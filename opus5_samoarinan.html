<!doctype html>
<!--
  opus5_samoarinan.html — WebGL2 マイク+カメラ →「さもありなん / It's probably so」
  ギターでの弾き語りに合わせるための映像。画面に映って
  いるのは「いま」ではない。各所がそれぞれ違う遅れを持った過去の光として届く。
  動かないものほど古く、歌っている間だけ遅れた像が寄り集まって一つになる。
  像を失った光は紙に押されたバブルアートの泡になり、増えては儚く消える。
  派生元エンジン: opus5_hana.html(マイク解析・合成の歌・カメラとUIと検証フック)/
  opus5_kiin-seido.html(実写の地・運動場)。

  様式解析(視覚的不変量。優先度 1>2>3>5>4>6):
    1. 遅延の場 — 画面の各点が固有の遅れ(秒)を持ち、その秒数だけ過去のフレームが
       映る。遅れは連続的に流れ、境界は見えない。**消印は無い**: 何秒前かを示す
       表示・色分け・輪郭を一切出さない(至急速達で届いた荷物/消印はなぜに消されている)。
       動いているところは「いま」に近く、動かないところほど古い(亡き人は動かない)。
    2. 統合と離散、そして再会 — 声が続く間、遅れた像が寄り集まって一つになる
       (時間が許す限り抱き締めて)。無音になると統合をやめ、静かに離れていく。
       人が自分の残像の立つ場所へ戻って重なり、声が保たれているとき — 更新前の
       深い遅れ×いまの身体×二つの像の一致 — その一角の止まった時間がほどけ、
       淡い暖色の息が数秒だけ通る。作品で唯一の肯定の身振り(さもありなん)。
       瞬間に紐づく演出であり、古さに紐づく消印ではない。山場は作らない。
    3. ひとつの法則、二つのスケール — 遅延クラスタと泡が同じ生成則(黄金角の
       葉序配置)で配置される。曲の一点でだけ二つが同時に同じ形へ重なり、また
       隠れる(「フラクタル=(統合)愛」の理論)。
    4. 泡はバブルアート — 石鹸玉ではない。ストローで吹いた泡が紙に触れて残す
       跡: 乾いた輪郭線、内側の滲み、密なところは小さな泡室の網。滲みは飾りでは
       なく**その場が抱えている最も古い光そのもの**(彩度が抜けていく途中の像)。
       泡は像だった言葉である(泡と化す宇宙の言葉)。平面で、
       ハイライトの白点も硬い光る縁も付けない(この2つが「雑に描いたシャボン玉」
       の正体だった)。漂わず、その場で咲いてその場で消える。
    5. 泡は声で決まる — 音量が大きさと数を、声色(スペクトル重心)が色相を決める。
       強いアタックは既にある泡を弾けさせる。大きい泡ほど脆い。
       ただし**ゆっくり**。生成頻度・音量での変動幅・破裂の強さは意図的に低く
       抑える(激しく湧いて激しく弾けると、曲の儚さから最も遠い明滅になる)。
    6. 残像を邪魔しない — 主役は人物とその残像。泡は遅延の場が深い所(=動かない
       地)にだけ濃く出て、人物とその航跡の上では退く。
    7. 抵抗しない色 — 無着色透明が基調。実写は淡いモノクロ寄り。彩度は泡だけに、
       それも一度彩度を落として紙に混ぜてから宿る(儚さは彩度の低さで作る)。

  パイプライン図(毎フレーム。★=EXT_color_buffer_float 有効時 RGBA16F / 無効時 RGBA8):
    入力: カメラ映像 / fakeScene(GLSL 室内+動く人型) + マイク or 合成の歌
    [P0 scene]  cover-fit+mirror                        sceneA/B RGBA8 長辺≤1280
    [P1 motion] フレーム差分 → R=運動EMA G=静止時間 BA=運動ベクトル motA/B★ ≤448
    [P2 blur]   運動場のソフト化(遅延の境界を出さないため)  softT★
    [P3 hist]   sceneT を履歴テクスチャ配列(2D_ARRAY, HIST_N 層)の書込層へ。
                固定 HIST_HZ で層を進めるので遅れは「秒」で扱える(可変フレームレート
                に依存しない)。上限 = HIST_N / HIST_HZ 秒
    [P4 delay]  遅延の場 ping-pong★ ≤448。R=遅れ(秒) G=泡量 B=速達の envelope
                A=再会の温度(更新前の遅れ×いまの動き×像の一致×持続音)
                遅れは目標値へ寄せるのではなく積む: 動きが止まった点では毎フレーム
                遅れが増え(=時間が止まる)、動いている点では「いま」へ引き戻される。
                止まった瞬間だけ反動が掛かるので、去った直後の姿がその場に残る。
                分布の基準は黄金角の葉序フラクタル場、アタックで「速達」の円が届く
    [P5 foam]   泡の状態 ping-pong(MRT 2枚, FOAM_W×FOAM_H)★
                A=(x, y, encV(速度)) B=(齢, 半径, seed, 色相)
                発生: 遅延の深い所を優先し、残像の上は避ける。半径と発生率は
                音量、色相は声色で決まる。アタックで齢が一気に進んで弾ける
    [P6 layer]  layerT★ を透明にクリアし前乗算アルファで重ねる:
                泡(instanced quad。輪郭線+内側の滲み+Worley の泡室網。
                遅延の場を読み、人物と残像の上では自ら薄くなる)
    [P7 bloom]  layerT の明部を抽出 → 2段ダウンサンプル+ぼかし        b1 b2
    [P8 comp]   遅延の場で履歴配列を2層サンプルして補間 → 実写(いま)を運動量で
                僅かに戻す → layer を前乗算合成 → ブルーム →
                肩付きトーンマップ・粒子・周辺減光

  実行方法:
    python3 -m http.server 8899 → http://localhost:8899/opus5_samoarinan.html を開き
    カメラとマイクを許可(どちらも端末内で処理。外部送信なし)。
    (カメラ/マイク API はセキュアコンテキスト必須。file:// では動きません)
    ?fakesource=1 … カメラ/マイク不使用。合成室内+動く人型+合成の歌(18秒ループ)で
                    全パス駆動(検証用)
    ?freeze=1    … 全ての時間駆動を停止(dt=0)し決定的な静止フレームを出す(検証用)
    ?prewarm=<秒> … 初回描画前に固定 dt で早送りし「遅れが育った」絵を出す(検証用)
    ?fakescale=<f> … 合成人型を f 倍(実機スケール乖離の検査。1.8〜2.2=大写し)
    デバッグ表示: 0=最終 1=運動と静止 2=遅延の場(B=再会の温度) 3=音の特徴量 4=泡 5=配色標本

  スライダーの説明:
    遅れの深さ  最も古い光が何秒前まで遡るか
    統合の強さ  歌っている間に遅れた像が一つへ寄る強さ
    網目の細かさ フラクタルな遅延分布の基準スケール(音高でも動く)
    速達        アタックで古い一枚が届く円の強さ
    泡          泡の量と寿命(音量でさらに増減する)
    音の感度    マイク入力のゲイン
    明るさ      全体の露出
    粒子        フィルムグレインの量

  依存: なし(単一の自己完結 HTML)。WebGL2 / GLSL ES 3.00 単体。
-->

    <style>
      :root {
        color-scheme: dark;
        --bg: #05070a;
        --ink: #f0e6ea;
        --muted: rgba(240, 230, 236, 0.66);
        --panel: rgba(14, 11, 18, 0.85);
        --line: rgba(240, 230, 236, 0.16);
        --accent: #e6849f;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: linear-gradient(160deg, #07070d, #0d0a12 55%, #05070a);
        font-family: ui-monospace, "Courier New", Courier, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      canvas { display: block; width: 100%; height: 100%; background: var(--bg); }
      video {
        position: fixed; width: 1px; height: 1px; left: -10px; top: -10px;
        opacity: 0; pointer-events: none;
      }
      .top-btn {
        position: fixed; top: max(14px, env(safe-area-inset-top)); z-index: 11;
        padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
        color: var(--ink); background: var(--panel); font: inherit; font-size: 11px;
        letter-spacing: 0.08em; cursor: pointer;
      }
      #togglePanel {
        left: max(14px, env(safe-area-inset-left)); width: 38px; padding: 8px 0;
        font-size: 15px; line-height: 1; text-align: center;
      }
      #togglePanel.hidden { display: none; }
      #closePanel {
        position: absolute; top: 9px; right: 9px; z-index: 2; width: 26px; height: 26px;
        display: flex; align-items: center; justify-content: center; padding: 0;
        border: 1px solid var(--line); border-radius: 7px; color: var(--ink);
        background: rgba(240, 230, 236, 0.06); font: inherit; font-size: 14px;
        line-height: 1; cursor: pointer;
      }
      #closePanel:hover { background: rgba(240, 230, 236, 0.14); }
      #flipCamera { right: max(14px, env(safe-area-inset-right)); display: none; }
      @media (pointer: coarse) { #flipCamera { display: block; } }
      #statusChip {
        position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%;
        transform: translateX(-50%); z-index: 11; padding: 7px 12px;
        border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
        background: var(--panel); font-size: 10px; letter-spacing: 0.1em;
        pointer-events: none; transition: opacity 0.6s ease; white-space: nowrap;
      }
      #statusChip.hidden { opacity: 0; }
      .panel {
        position: fixed; top: max(56px, calc(env(safe-area-inset-top) + 56px));
        left: max(14px, env(safe-area-inset-left)); z-index: 10;
        width: min(360px, calc(100vw - 28px)); max-height: calc(100vh - 76px);
        overflow: hidden; display: flex; flex-direction: column;
        padding: 13px 14px 14px; color: var(--muted); background: var(--panel);
        border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(10px);
        transition: transform 0.25s ease, opacity 0.25s ease;
      }
      .panel-body { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
      .panel h1 {
        margin: 0 0 6px; padding-right: 30px; font-size: 13px;
        letter-spacing: 0.14em; color: var(--ink);
      }
      .panel p { margin: 0 0 12px; font-size: 10.5px; line-height: 1.55; }
      .select-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; margin: 0 0 10px; font-size: 10px; letter-spacing: 0.08em;
      }
      .select-row select {
        flex: 1; max-width: 210px; padding: 5px 6px; color: var(--ink);
        background: rgba(240, 230, 236, 0.06); border: 1px solid var(--line);
        border-radius: 7px; font: inherit; font-size: 10.5px;
      }
      .row {
        display: grid; grid-template-columns: 1fr 44px;
        grid-template-areas: "label out" "slider slider"; gap: 2px 8px;
        padding: 7px 0 2px; border-top: 1px solid var(--line);
      }
      .row label { grid-area: label; font-size: 11px; color: var(--ink); }
      .row label span {
        display: block; font-size: 9.5px; color: var(--muted); letter-spacing: 0.02em;
      }
      .row output { grid-area: out; justify-self: end; font-size: 10.5px; color: var(--accent); }
      .row input[type="range"] { grid-area: slider; width: 100%; accent-color: var(--accent); }
      .check-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 0 2px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink);
      }
      .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .buttons button {
        flex: 1; min-width: 100px; padding: 8px 10px; border: 1px solid var(--line);
        border-radius: 8px; color: var(--ink); background: rgba(240, 230, 236, 0.06);
        font: inherit; font-size: 10.5px; letter-spacing: 0.08em; cursor: pointer;
      }
      .meter {
        margin-top: 10px; height: 5px; border-radius: 3px; overflow: hidden;
        background: rgba(240, 230, 236, 0.10);
      }
      .meter i {
        display: block; height: 100%; width: 0%;
        background: linear-gradient(90deg, #7fd4c1, #e6849f, #f0c46a);
        transition: width 0.08s linear;
      }
      .status {
        margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
        font-size: 9.5px; line-height: 1.7; letter-spacing: 0.05em;
      }
      .badge {
        display: inline-block; margin-top: 4px; padding: 3px 8px;
        border: 1px solid var(--line); border-radius: 999px; font-size: 9px; color: var(--muted);
      }
      #overlay {
        position: fixed; inset: 0; z-index: 20; display: flex; align-items: center;
        justify-content: center; padding: 20px; background: rgba(6, 5, 10, 0.76);
        backdrop-filter: blur(6px); transition: opacity 0.3s ease;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      .overlay-card {
        max-width: 460px; padding: 22px 24px; text-align: center; color: var(--muted);
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      }
      .overlay-card h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 0.16em; color: var(--ink); }
      .overlay-card p { margin: 0 0 14px; font-size: 11px; line-height: 1.6; }
      .overlay-card button {
        margin: 0 4px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 8px;
        color: var(--ink); background: rgba(240, 230, 236, 0.08); font: inherit;
        font-size: 11px; letter-spacing: 0.08em; cursor: pointer;
      }
      @media (max-width: 640px) {
        .panel {
          top: auto; right: max(10px, env(safe-area-inset-right));
          bottom: max(10px, env(safe-area-inset-bottom)); left: max(10px, env(safe-area-inset-left));
          width: auto; max-height: 54vh; padding: 12px;
        }
        .panel.collapsed { transform: translateY(calc(100% + 18px)); opacity: 0; }
      }
      @media (min-width: 641px) {
        .panel.collapsed { transform: translateX(calc(-100% - 22px)); opacity: 0; }
      }
    </style>
  </head>

  <body>
    <canvas id="gl" aria-label="WebGL2 delayed light webcam"></canvas>
    <video id="video" playsinline muted autoplay></video>

    <button id="togglePanel" type="button" class="top-btn hidden"
      aria-label="コントローラーを開く" aria-expanded="true">☰</button>
    <button id="flipCamera" type="button" class="top-btn" aria-label="カメラ切替">背面カメラ</button>
    <div id="statusChip">起動中</div>

    <section id="panel" class="panel" aria-label="Samoarinan controls"></section>

    <div id="overlay" role="status" aria-live="polite">
      <div class="overlay-card">
        <h2 id="overlayTitle">REQUESTING CAMERA</h2>
        <p id="overlayText">
          Please allow webcam access. Serve this file from localhost or HTTPS.
        </p>
        <button id="retryCamera" type="button" hidden>RETRY CAMERA</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("gl");
        const video = document.getElementById("video");
        const panel = document.getElementById("panel");
        const togglePanel = document.getElementById("togglePanel");
        const flipCameraBtn = document.getElementById("flipCamera");
        const statusChip = document.getElementById("statusChip");
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlayText = document.getElementById("overlayText");
        const retryCamera = document.getElementById("retryCamera");

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        const QUERY = new URLSearchParams(location.search);
        // ?fakesource=1 replaces BOTH inputs: a synthetic room + a full-body
        // figure that drifts and swings its limbs stands in for the camera, and
        // a scripted 18s song (intro / verse / chorus / bridge / fade) stands in
        // for the microphone. Neither MediaPipe nor WebAudio is ever touched, so
        // the whole growth pipeline runs offline and deterministically.
        const FAKE = QUERY.get("fakesource") === "1";
        // ?freeze=1 makes dt = 0: plant stages, petal physics, the audio EMAs,
        // the fake figure and every mask EMA stop → deterministic still frame.
        const FREEZE = QUERY.get("freeze") === "1";
        const FAKESCALE = (() => {
          const v = parseFloat(QUERY.get("fakescale"));
          return Number.isFinite(v) && v > 0.05 ? Math.min(4, v) : 1.0;
        })();
        // ?prewarm=<sec> fast-forwards the simulation with a fixed dt before the
        // first present, so a screenshot shows grown flowers instead of bare
        // ground (the verification GPU is far too slow to warm in real time —
        // CRAFT §C4). Chunked + glSync'd so the compositor is never parked.
        const PREWARM = (() => {
          const v = parseFloat(QUERY.get("prewarm"));
          return Number.isFinite(v) && v > 0 ? Math.min(30, v) : 0;
        })();
        const PREWARM_DT = 1 / 24;

        const DEBUG_MODES = [
          "最終",
          "運動と静止",
          "遅延の場",
          "音の特徴量",
          "泡",
          "配色標本",
        ];

        const DEFAULTS = {
          depth: 0.62,
          converge: 0.62,
          grain: 0.5,
          parcel: 0.55,
          foam: 0.55,
          micGain: 0.55,
          exposure: 1.0,
          filmGrain: 0.20,
        };

        const state = {
          ...DEFAULTS,
          debugView: 0,
          mirror: true,
          facingMode: "user",
          pauseAnim: reducedMotion || FREEZE,
        };

        const uiRows = [
          ["depth", "遅れの深さ", "最も古い光が何秒前まで遡るか", 0, 1, 0.01],
          ["converge", "統合の強さ", "歌う間に遅れた像が一つへ寄る強さ", 0, 1, 0.01],
          ["grain", "網目の細かさ", "遅延の分布の基準スケール(音高でも動く)", 0, 1, 0.01],
          ["parcel", "速達", "アタックで古い一枚が届く円の強さ", 0, 1, 0.01],
          ["foam", "泡", "泡化の量と寿命", 0, 1, 0.01],
          ["micGain", "音の感度", "マイク入力のゲイン", 0, 1, 0.01],
          ["exposure", "明るさ", "画面全体の露出", 0.6, 1.4, 0.01],
          ["filmGrain", "粒子", "全面の静的グレイン", 0, 1, 0.01],
        ];

        panel.innerHTML = `
          <button id="closePanel" type="button" aria-label="コントローラーを閉じる">✕</button>
          <div class="panel-body">
          <h1>OPUS5 · さもありなん</h1>
          <p>
            画面に映っているのは「いま」ではありません。各所がそれぞれ違う遅れを
            持った過去の光として届きます。動かないものほど古く、歌っている間だけ
            遅れた像が寄り集まって一つになります。最も古い光は像を失って泡になり、
            割れて消えます。マイクとカメラは端末内で処理されます。
          </p>
          <div class="select-row">
            <span>デバッグ表示</span>
            <select id="debugView" aria-label="デバッグ表示">
              ${DEBUG_MODES.map(
                (label, i) => `<option value="${i}">${label}</option>`,
              ).join("")}
            </select>
          </div>
          ${uiRows
            .map(
              ([key, label, hint, min, max, step]) => `
                <div class="row">
                  <label for="${key}">
                    ${label}
                    <span>${hint}</span>
                  </label>
                  <output id="${key}Out">${formatValue(state[key])}</output>
                  <input id="${key}" type="range" min="${min}" max="${max}"
                    step="${step}" value="${state[key]}" />
                </div>
              `,
            )
            .join("")}
          <label class="check-row">
            <span>左右反転(鏡)</span>
            <input id="mirror" type="checkbox" ${state.mirror ? "checked" : ""} />
          </label>
          <label class="check-row">
            <span>ゆらぎを停止</span>
            <input id="pauseAnim" type="checkbox" ${state.pauseAnim ? "checked" : ""} />
          </label>
          <div class="meter" aria-label="入力音量"><i id="levelBar"></i></div>
          <div class="buttons">
            <button id="savePng" type="button">PNG保存</button>
            <button id="resetLook" type="button">リセット</button>
            <button id="micRetry" type="button">マイク再試行</button>
          </div>
          <div class="status">
            <div id="readout">FPS -- / 解像度 -- / 株 -- / 花びら -- / 音 -- / 検知 --</div>
            <span class="badge">WebGL2 · Mic · Delayed Light</span>
          </div>
          </div>
        `;

        uiRows.forEach(([key]) => {
          const input = document.getElementById(key);
          const out = document.getElementById(`${key}Out`);
          input.addEventListener("input", () => {
            state[key] = Number(input.value);
            out.textContent = formatValue(state[key]);
          });
        });

        function setSlider(key, value) {
          state[key] = value;
          const input = document.getElementById(key);
          const out = document.getElementById(`${key}Out`);
          if (input) input.value = value;
          if (out) out.textContent = formatValue(value);
        }

        document.getElementById("debugView").addEventListener("change", (event) => {
          state.debugView = Number(event.currentTarget.value);
        });
        document.getElementById("mirror").addEventListener("change", (event) => {
          state.mirror = event.currentTarget.checked;
        });
        document.getElementById("pauseAnim").addEventListener("change", (event) => {
          state.pauseAnim = event.currentTarget.checked;
        });
        document.getElementById("resetLook").addEventListener("click", () => {
          Object.keys(DEFAULTS).forEach((key) => setSlider(key, DEFAULTS[key]));
        });

        const closePanel = document.getElementById("closePanel");
        function setPanelCollapsed(collapsed) {
          panel.classList.toggle("collapsed", collapsed);
          togglePanel.classList.toggle("hidden", !collapsed);
          togglePanel.setAttribute("aria-expanded", String(!collapsed));
        }
        togglePanel.addEventListener("click", () => setPanelCollapsed(false));
        closePanel.addEventListener("click", () => setPanelCollapsed(true));
        const isMobile = window.matchMedia("(max-width: 640px)").matches;
        setPanelCollapsed(isMobile);

        flipCameraBtn.addEventListener("click", () => {
          state.facingMode = state.facingMode === "user" ? "environment" : "user";
          flipCameraBtn.textContent =
            state.facingMode === "user" ? "背面カメラ" : "前面カメラ";
          state.mirror = state.facingMode === "user";
          document.getElementById("mirror").checked = state.mirror;
          startCamera();
        });

        document.getElementById("savePng").addEventListener("click", () => {
          const link = document.createElement("a");
          const stamp = new Date().toISOString().replace(/[:.]/g, "-");
          link.download = `opus5-samoarinan-${stamp}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        });

        function formatValue(value) {
          return Number(value).toFixed(Math.abs(value) >= 10 ? 0 : 2);
        }

        function setOverlay(kind, title, text, buttons = {}) {
          overlayTitle.textContent = title;
          overlayText.textContent = text;
          retryCamera.hidden = !buttons.retryCamera;
          overlay.classList.toggle("hidden", kind === "hidden");
        }

        /* ------------------------------------------------------------------
           WebGL2 setup
        ------------------------------------------------------------------ */

        const gl = canvas.getContext("webgl2", {
          alpha: false,
          antialias: false,
          depth: false,
          stencil: false,
          preserveDrawingBuffer: true,
          powerPreference: "high-performance",
        });

        if (!gl) {
          setOverlay(
            "error",
            "WEBGL2 UNAVAILABLE",
            "This piece needs WebGL2. Try a current desktop/mobile browser with hardware acceleration enabled.",
          );
          return;
        }

        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.CULL_FACE);
        gl.disable(gl.BLEND);

        // Float render targets keep the plant/petal state and the HDR flower
        // layer from stalling in 8 bits. Signed velocity is offset-encoded into
        // [0,1] (encV) so the RGBA8 fallback runs the same shaders, coarser.
        const floatExt = gl.getExtension("EXT_color_buffer_float");

        // Renderer probe → pool sizing. Software (SwiftShader in the verifier)
        // and coarse-pointer (mobile) devices get smaller pools.
        const dbgRI = gl.getExtension("WEBGL_debug_renderer_info");
        const RENDERER = dbgRI ? gl.getParameter(dbgRI.UNMASKED_RENDERER_WEBGL) : "";
        const IS_SOFT = /swiftshader|llvmpipe|software|basic|subzero/i.test(RENDERER);
        const COARSE = window.matchMedia("(pointer: coarse)").matches;

        // Rooted plants live in a tiny state texture (one texel per plant, two
        // MRT attachments). The pool is FIXED, which is what bounds the picture
        // (invariant 5): the foam pool is fixed, so nothing can accumulate.
        // The history of light. Frames are pushed at a FIXED cadence, so a delay
        // can be expressed in SECONDS and does not depend on the frame rate; the
        // oldest light the piece can show is HIST_N / HIST_HZ seconds ago.
        const HIST_HZ = IS_SOFT ? 8 : (COARSE ? 10 : 12);
        const HIST_N = IS_SOFT ? 20 : (COARSE ? 24 : 40);
        const HIST_MAX = IS_SOFT ? 256 : (COARSE ? 384 : 512);
        const MAX_DELAY = (HIST_N - 2) / HIST_HZ;      // seconds

        const FOAM_SIDE = IS_SOFT ? 26 : (COARSE ? 40 : 56);
        const FOAM_W = FOAM_SIDE;
        const FOAM_H = FOAM_SIDE;
        const FOAM_N = FOAM_W * FOAM_H;         // 676 / 1600 / 3136


        const fullscreenVS = `#version 300 es
          precision highp float;
          const vec2 POS[3] = vec2[3](
            vec2(-1.0, -1.0), vec2( 3.0, -1.0), vec2(-1.0,  3.0)
          );
          out vec2 vUv;
          void main() {
            vec2 p = POS[gl_VertexID];
            vUv = p * 0.5 + 0.5;
            gl_Position = vec4(p, 0.0, 1.0);
          }
        `;

        // Shared: pcg-flavoured hashes + value noise + fbm + curl noise (unit
        // scaled) + the 2D SDF helpers. Grain, mottle and every placement seed
        // are derived from POSITION or INDEX only — never from uTime (repo rule)
        // so they stay deterministic under ?freeze=1.
        const CHUNK_NOISE = `
          const float PI2 = 6.28318530718;
          float hash12(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
          }
          vec2 hash22(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
            p3 += dot(p3, p3.yxz + 33.33);
            return fract((p3.xx + p3.yz) * p3.zy);
          }
          float h11(float p) {
            p = fract(p * 0.1031);
            p *= p + 33.33;
            p *= p + p;
            return fract(p);
          }
          float vnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash12(i);
            float b = hash12(i + vec2(1.0, 0.0));
            float c = hash12(i + vec2(0.0, 1.0));
            float d = hash12(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }
          float fbm4(vec2 p) {
            float s = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 4; i++) {
              s += amp * vnoise(p);
              p *= 2.03;
              amp *= 0.5;
            }
            return s;
          }
          float fbm(vec2 p) {
            float s = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 5; i++) {
              s += amp * vnoise(p);
              p *= 2.03;
              amp *= 0.5;
            }
            return s;
          }
          // curl of value noise, normalised to ≈ unit scale (a raw finite
          // difference divided by 2e reaches ~20 and turns a "small" coefficient
          // into a 200px warp — CRAFT / kiin-seido §8-3).
          vec2 curlN(vec2 p) {
            float e = 0.35;
            float n1 = vnoise(p + vec2(0.0, e)) - vnoise(p - vec2(0.0, e));
            float n2 = vnoise(p + vec2(e, 0.0)) - vnoise(p - vec2(e, 0.0));
            return vec2(n1, -n2) * 1.6;
          }
          float sdSeg(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a;
            vec2 ba = b - a;
            float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
            return length(pa - ba * h);
          }
          float smin2(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
          }
        `;

        // Shared: [0,1] offset encoding for signed fields. The clamp doubles as
        // the mandatory velocity clamp (no NaN blow-ups).
        const CHUNK_ENC = `
          const float VMAX = 2.4;
          vec2 encV(vec2 v) { return clamp(v, -VMAX, VMAX) / (2.0 * VMAX) + 0.5; }
          vec2 decV(vec2 e) { return (e - 0.5) * (2.0 * VMAX); }
        `;

        // Shared: the ?fakesource=1 synthetic scene — a lit room (never black)
        // with a full-body figure that drifts, bobs and swings its limbs. The
        // swing is what makes the motion field, the gusts and the edge-band
        // sprouting testable offline. uScale is ?fakescale= (CRAFT §C2).
        const CHUNK_FAKE = `
          float humanDist(vec2 p, float cx, float swing, float sc) {
            vec2 anchor = vec2(cx, 0.46);
            p = (p - anchor) / max(sc, 0.05) + anchor;
            float d = 1e9;
            vec2 head = vec2(cx, 0.80);
            d = min(d, length((p - head) / vec2(1.0, 1.14)) - 0.062);
            d = smin2(d, sdSeg(p, vec2(cx, 0.745), vec2(cx, 0.685)) - 0.024, 0.018);
            d = smin2(d, sdSeg(p, vec2(cx, 0.685), vec2(cx, 0.40)) - 0.098, 0.045);
            d = smin2(d, sdSeg(p, vec2(cx - 0.115, 0.665), vec2(cx + 0.115, 0.665)) - 0.052, 0.04);
            // arms: shoulder → elbow → hand, driven by the swing phase (the
            // strumming/fretting arm of the singer)
            float aL = 2.55 + 0.62 * swing;
            vec2 shL = vec2(cx - 0.115, 0.655);
            vec2 elL = shL + 0.135 * vec2(cos(aL), sin(aL) * 0.7 - 0.35);
            vec2 haL = elL + 0.125 * vec2(cos(aL - 0.55 - 0.5 * swing),
                                          sin(aL - 0.55 - 0.5 * swing) * 0.8 - 0.3);
            d = smin2(d, sdSeg(p, shL, elL) - 0.036, 0.03);
            d = smin2(d, sdSeg(p, elL, haL) - 0.028, 0.028);
            float aR = 0.59 - 0.62 * swing;
            vec2 shR = vec2(cx + 0.115, 0.655);
            vec2 elR = shR + 0.135 * vec2(cos(aR), sin(aR) * 0.7 - 0.35);
            vec2 haR = elR + 0.125 * vec2(cos(aR + 0.55 + 0.5 * swing),
                                          sin(aR + 0.55 + 0.5 * swing) * 0.8 - 0.3);
            d = smin2(d, sdSeg(p, shR, elR) - 0.036, 0.03);
            d = smin2(d, sdSeg(p, elR, haR) - 0.028, 0.028);
            // legs: hip → knee → foot
            vec2 hipL = vec2(cx - 0.05, 0.405);
            vec2 knL = hipL + vec2(-0.028 - 0.05 * swing, -0.15);
            vec2 ftL = knL + vec2(-0.012 + 0.03 * swing, -0.155);
            d = smin2(d, sdSeg(p, hipL, knL) - 0.044, 0.035);
            d = smin2(d, sdSeg(p, knL, ftL) - 0.034, 0.03);
            vec2 hipR = vec2(cx + 0.05, 0.405);
            vec2 knR = hipR + vec2(0.028 + 0.05 * swing, -0.15);
            vec2 ftR = knR + vec2(0.012 - 0.03 * swing, -0.155);
            d = smin2(d, sdSeg(p, hipR, knR) - 0.044, 0.035);
            d = smin2(d, sdSeg(p, knR, ftR) - 0.034, 0.03);
            // the guitar: a body ellipse across the lap plus a neck to the left
            vec2 gc = vec2(cx + 0.055, 0.44);
            float gd = length((p - gc) / vec2(1.25, 1.0)) - 0.085;
            vec2 nk0 = gc + vec2(-0.09, 0.045);
            vec2 nk1 = gc + vec2(-0.30, 0.130);
            gd = min(gd, sdSeg(p, nk0, nk1) - 0.016);
            d = min(d, gd);
            return d;
          }
          vec3 fakeScene(vec2 uv, float cx, float cy, float swing, float aspect, float sc) {
            // a lit room, not a dim gradient: the synthetic scene is the only
            // proxy for a real background, so it must sit in a realistic
            // exposure range or every judgement about the flowers over it is wrong
            vec3 top = vec3(0.30, 0.31, 0.36);
            vec3 bot = vec3(0.46, 0.42, 0.37);
            vec3 bg = mix(top, bot, smoothstep(0.0, 1.0, uv.y));
            bg += 0.03 * (0.5 + 0.5 * sin(uv.x * 30.0) - 0.5);
            float horizon = exp(-pow((uv.y - 0.40) * 6.0, 2.0));
            bg = mix(bg, vec3(0.55, 0.51, 0.45), 0.16 * horizon);
            bg += 0.04 * (vnoise(uv * 5.0) - 0.5);
            vec2 p = vec2((uv.x - 0.5) * aspect + 0.5, uv.y - cy);
            float d = humanDist(p, cx, swing, sc);
            float m = 1.0 - smoothstep(-0.004, 0.008, d);
            // body-local coords (same transform humanDist uses) so the costume
            // regions ride with ?fakescale=. The figure needs INTERNAL tonal
            // structure — a flat silhouette makes the grading and the
            // figure/flower interplay impossible to judge offline.
            vec2 q = (p - vec2(cx, 0.46)) / max(sc, 0.05) + vec2(cx, 0.46);
            float folds = 0.86 + 0.30 * fbm(q * vec2(34.0, 20.0));
            float upper = smoothstep(0.40, 0.46, q.y);
            vec3 person = mix(vec3(0.24, 0.26, 0.33), vec3(0.68, 0.64, 0.58), upper);
            person = mix(person, vec3(0.16, 0.19, 0.29),
              smoothstep(0.01, -0.05, q.x - cx) * upper * 0.75);
            person = mix(person, vec3(0.15, 0.18, 0.27),
              smoothstep(0.60, 0.69, q.y) * 0.85);
            person = mix(person, vec3(0.36, 0.25, 0.16),
              exp(-pow((q.y - 0.44) * 55.0, 2.0)));            // the guitar body
            person *= folds;
            float headM = 1.0 - smoothstep(0.050, 0.070,
              length((q - vec2(cx, 0.80)) / vec2(1.0, 1.14)));
            vec3 skin = vec3(0.62, 0.49, 0.42);
            skin *= 1.0 - 0.45 * exp(-pow((q.y - 0.815) * 240.0, 2.0));  // brow
            skin *= 1.0 - 0.28 * exp(-pow((q.y - 0.772) * 190.0, 2.0));  // mouth
            person = mix(person, skin, headM);
            person *= 0.78 + 0.34 * smoothstep(0.05, 0.80, q.y);
            return clamp(mix(bg, person, m), 0.0, 1.0);
          }
          float fakeMask(vec2 uv, float cx, float cy, float swing, float aspect, float sc) {
            vec2 p = vec2((uv.x - 0.5) * aspect + 0.5, uv.y - cy);
            return 1.0 - smoothstep(-0.006, 0.010, humanDist(p, cx, swing, sc));
          }
        `;

        // Shared: the restrained palette. The picture is nearly colourless —
        // "無着色透明". Saturation is allowed only in the rain, the thin-film
        // colour of the foam, and the nectar freckles of the shakunage.
        const CHUNK_PALETTE = `
          const vec3 NIGHT = vec3(0.020, 0.024, 0.032);
          const vec3 PAPER = vec3(0.80, 0.79, 0.78);     // 泡が乗る紙
          // 泡の色相環。声色が環のどこを使うかを決める。彩度は一度落としてから
          // 紙に混ぜる — 生の色相環は墨と灰の画面で浮く。
          vec3 bubbleHue(float h) {
            vec3 c = 0.5 + 0.5 * cos(6.28318 * (h + vec3(0.0, 0.33, 0.67)));
            return mix(vec3(dot(c, vec3(0.30, 0.59, 0.11))), c, 0.66);
          }
          // thin-film interference: the only place a strong hue is allowed
        `;

        // 「フラクタル=(統合)愛」の理論。ONE generator, used at three scales:
        // the delay clusters, the shakunage truss, and the foam. A rhododendron
        // truss is a real specimen of it — a dozen funnels packed around a single
        // point by the golden angle, the same packing nature uses for seed heads.
        // The theory is what is hidden; the flower is in plain sight.
        const CHUNK_FRACTAL = `
          const float GOLDEN = 2.39996323;
          // the i-th of n children around one parent, in unit-disc polar form
          vec2 phyllo(float i, float n, float seed) {
            float a = i * GOLDEN + seed * PI2;
            float r = sqrt((i + 0.5) / max(n, 1.0));
            return vec2(cos(a), sin(a)) * r;
          }
          // the same law applied at three nested scales: a field whose clusters
          // are packed like florets, whose florets are packed like clusters
          float phylloField(vec2 p, float scale, float seed, float depth) {
            float acc = 0.0;
            float amp = 1.0;
            float sc = scale;
            for (int lv = 0; lv < 3; lv++) {
              if (float(lv) > depth) break;
              // cell-local coordinates at this level
              vec2 q = p * sc;
              vec2 cell = floor(q);
              float best = 1e9;
              // the 12 packed sites of this cell (the truss law), plus the
              // neighbours so the field is continuous across cell borders
              for (int k = 0; k < 9; k++) {
                vec2 nb = vec2(float(k % 3) - 1.0, float(k / 3) - 1.0);
                vec2 c2 = cell + nb;
                float hs = hash12(c2 + seed * 7.1 + float(lv) * 19.0);
                for (int f = 0; f < 4; f++) {
                  vec2 site = c2 + 0.5 + phyllo(float(f) * 3.0 + hs * 2.0, 12.0,
                    hs + float(lv)) * 0.62;
                  best = min(best, length(q - site));
                }
              }
              acc += amp * clamp(best, 0.0, 1.2);
              amp *= 0.52;
              sc *= 2.3;
            }
            return clamp((acc / 1.9 - 0.09) * 3.1, 0.0, 1.0);
          }
        `;

        // 履歴配列の読み出し。合成パスと泡の描画パスの両方が「何秒前の光か」を
        // 引くので、宣言ごと共有する(片方だけ直して食い違うのを避ける)。
        const CHUNK_HIST = `
          precision highp sampler2DArray;   // GLSL ES 3.00 has no default for it
          uniform sampler2DArray uHist;
          uniform float uHistHz;
          uniform float uHistN;
          uniform float uWrite;
          uniform float uMaxDelay;
          // sample the light that left this point sec seconds ago
          vec3 lightFrom(vec2 uv, float sec) {
            float lf = clamp(sec, 0.0, uMaxDelay) * uHistHz;
            float l0 = floor(lf);
            float fr = lf - l0;
            float a0 = mod(uWrite - l0 + uHistN * 2.0, uHistN);
            float a1 = mod(uWrite - l0 - 1.0 + uHistN * 2.0, uHistN);
            vec3 c0 = texture(uHist, vec3(uv, a0)).rgb;
            vec3 c1 = texture(uHist, vec3(uv, a1)).rgb;
            return mix(c0, c1, fr);
          }
        `;

        // P0 — webcam cover-fit + mirror (or the synthetic scene) into the
        // working scene buffer. Everything downstream is screen-aligned to it.
        const sceneFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uVideo;
          uniform vec2 uResolution;
          uniform vec2 uVideoSize;
          uniform float uAspect;
          uniform float uCx;
          uniform float uCy;
          uniform float uSwing;
          uniform float uScale;
          uniform int uMirror;
          uniform int uFake;
          uniform int uHasVideo;
          ${CHUNK_NOISE}
          ${CHUNK_FAKE}
          void main() {
            if (uFake == 1) {
              fragColor = vec4(fakeScene(vUv, uCx, uCy, uSwing, uAspect, uScale), 1.0);
              return;
            }
            if (uHasVideo == 0) {
              // neutral holding backdrop while the camera warms up (not black)
              fragColor = vec4(mix(vec3(0.10, 0.10, 0.13),
                vec3(0.20, 0.18, 0.24), vUv.y), 1.0);
              return;
            }
            vec2 uv = vUv;
            if (uMirror == 1) uv.x = 1.0 - uv.x;
            float canvasAspect = uResolution.x / uResolution.y;
            float videoAspect = uVideoSize.x / uVideoSize.y;
            vec2 scale = videoAspect > canvasAspect
              ? vec2(canvasAspect / videoAspect, 1.0)
              : vec2(1.0, videoAspect / canvasAspect);
            vec2 vuv = (uv - 0.5) * scale + 0.5;
            fragColor = vec4(texture(uVideo, vuv).rgb, 1.0);
          }
        `;

        // P1 — the motion field. There is NO person detection in this piece:
        //   R = motion energy (frame difference, EMA)
        //   G = STILLNESS AGE — how long this pixel has been still, 0..1. This is
        //       what ages the light: whatever does not move drifts into the past
        //       (亡き人は動かない). A moving performer stays near "now" for free,
        //       with no mask and no model.
        //   BA = the motion vector (encoded), used to nudge the foam.
        const motionFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform sampler2D uScenePrev;
          uniform sampler2D uPrev;
          uniform vec2 uTexel;
          uniform float uDt;
          uniform float uAlphaMot;
          uniform int uReset;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          float lumaf(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
          void main() {
            vec4 prev = texture(uPrev, vUv);
            vec3 cur = texture(uScene, vUv).rgb;
            float l0 = lumaf(texture(uScenePrev, vUv).rgb);
            float l1 = lumaf(cur);
            float diff = abs(l1 - l0) / max(uDt, 1e-3);
            float motRaw = clamp(diff * 0.45, 0.0, 1.0);
            float mot = uReset == 1 ? motRaw : mix(prev.r, motRaw, uAlphaMot);

            // stillness age: rises slowly while nothing happens here, and is
            // knocked straight back down by any movement
            float still = uReset == 1 ? 0.0 : prev.g;
            still += uDt * 0.20;
            still -= uDt * 6.0 * smoothstep(0.05, 0.35, mot);
            still = clamp(still, 0.0, 1.0);

            float lx = lumaf(texture(uScene, vUv + vec2(uTexel.x, 0.0)).rgb) -
              lumaf(texture(uScene, vUv - vec2(uTexel.x, 0.0)).rgb);
            float ly = lumaf(texture(uScene, vUv + vec2(0.0, uTexel.y)).rgb) -
              lumaf(texture(uScene, vUv - vec2(0.0, uTexel.y)).rgb);
            vec2 grd = vec2(lx / (2.0 * uTexel.x), ly / (2.0 * uTexel.y));
            float it = (l1 - l0) / max(uDt, 1e-3);
            vec2 flowRaw = clamp(-it * grd / (dot(grd, grd) + 40.0),
              vec2(-VMAX), vec2(VMAX));
            vec2 flow = uReset == 1 ? vec2(0.0)
              : mix(decV(prev.ba), flowRaw, uAlphaMot);
            fragColor = vec4(mot, still, encV(flow));
          }
        `;

        // Separable Gaussian (all channels). Softens the mask edge into the
        // sprouting band (P2), builds the wide proximity aura (P3) and blurs the
        // flower layer for the bloom (P7).
        const blurFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uSrc;
          uniform vec2 uDir;
          uniform float uSigma;
          void main() {
            vec4 acc = vec4(0.0);
            float wsum = 0.0;
            for (int i = -10; i <= 10; ++i) {
              float x = float(i);
              float w = exp(-0.5 * x * x / max(uSigma * uSigma, 1e-4));
              acc += texture(uSrc, vUv + uDir * x) * w;
              wsum += w;
            }
            fragColor = acc / wsum;
          }
        `;

        // P3 — the history write. The scene is copied into the layer the ring
        // buffer is pointing at. Downscaled: the past does not need full
        // resolution, and 40 full-size frames would not fit on a phone.
        const histCopyFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uSrc;
          void main() { fragColor = vec4(texture(uSrc, vUv).rgb, 1.0); }
        `;

        // P4 — the DELAY FIELD. One texel per screen cell, ping-ponged:
        //   R = the delay in SECONDS at this point
        //   G = foam amount (how far past the end of the history it has gone)
        //   B = the "express parcel" envelope (至急速達で届いた荷物)
        //   A = 再会の温度 — set where the held past and the present AGREE while
        //       the voice sustains (you have walked back into your own light and
        //       held it: ただ時間が許す限り抱き締めて), then it breathes out
        // The delay is smoothed in time so its boundaries never appear as edges:
        // there is no postmark anywhere in the picture telling you what is old.
        const delayFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uPrev;
          uniform sampler2D uMotion;
          uniform sampler2D uMotionRaw;
          uniform sampler2D uScene;
          uniform float uDt;
          uniform float uTime;
          uniform float uAspect;
          // uMaxDelay は CHUNK_HIST が宣言する
          uniform float uDepth;
          uniform float uConverge;
          uniform float uGrain;
          uniform float uParcel;
          uniform float uReveal;
          uniform float uSeed;
          uniform int uReset;
          uniform vec4 uAudA;   // rms, centroid, zcr, onset
          uniform vec4 uAudB;   // sustain, pitch, vibrato, arc
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_FRACTAL}
          ${CHUNK_HIST}
          void main() {
            vec2 ar = vec2(uAspect, 1.0);
            vec4 prev = texture(uPrev, vUv);
            vec4 mo = texture(uMotionRaw, vUv);   // tight: what is moving NOW
            float still = texture(uMotion, vUv).g;  // softened: how long since
            float rms = uAudA.x;
            float ons = uAudA.w;
            float sus = uAudB.x;
            float pit = uAudB.y;
            float arc = uAudB.w;

            // the fractal law: pitch moves its SCALE, so a high note draws a fine
            // mesh of ages and a low note draws great slow blocks of the past
            float sc = mix(1.6, 7.5, uGrain) * (0.55 + 0.95 * pit);
            float f = phylloField(vUv * ar, sc, uSeed, 1.0 + uReveal);
            // during the reveal every scale locks onto the same arrangement
            float fReveal = phylloField(vUv * ar, 2.2, uSeed, 2.0);
            f = mix(f, fReveal, uReveal);

            // WHERE MOTION STOPS, TIME STOPS. Adding dt to the delay holds the
            // displayed instant exactly still: the region keeps showing the last
            // thing that happened there. That is why a person who moves away
            // leaves themselves behind — the light from before has not finished
            // arriving. (An earlier version made stillness itself the age, which
            // is invisible: a still room looks the same at any age.)
            // ...and it must stop AT ONCE. An earlier version scaled the freeze
            // by the stillness AGE, which is zero at exactly the moment a
            // disturbance ends: the region only began to freeze seconds later,
            // by which time whoever had been standing there was long gone.
            // Nothing was ever left behind — which is the whole piece.
            float freeze = 0.30 + 0.70 * f;
            // the recoil: for a second or so after something passes, time here
            // runs BACKWARD faster than 1:1, so the delay reaches back into the
            // moments when the subject was still in this spot.
            float kick = smoothstep(0.45, 0.0, still);
            freeze *= 1.0 + 4.5 * kick;
            // movement drags a place back to the present, and so does a held
            // note — 統合: 「ただ時間が許す限り抱き締めて」
            // 統合 is a GESTURE on a note that is really held, not the default
            // state of singing. Measured: a constant pull kept every age at 7% of
            // the ceiling, so during a song — which is most of the time — nothing
            // was ever left behind. The threshold is what makes the embrace
            // legible: it only happens when the voice truly sustains.
            float toNow = 7.0 * smoothstep(0.04, 0.28, mo.r) +
              2.2 * uConverge * smoothstep(0.60, 0.95, sus);
            float d = uReset == 1 ? 0.0 : prev.r;
            d += uDt * freeze * (0.60 + 1.90 * uDepth);
            d -= uDt * toNow * (0.35 + d);

            // 至急速達: an attack delivers one very old frame to a disc whose
            // origin you cannot read
            float pSeed = floor(uTime * 0.7) + 1.0;
            vec2 pc = hash22(vec2(pSeed * 3.7, uSeed * 5.3));
            float pr = 0.10 + 0.22 * hash12(vec2(pSeed * 11.0, uSeed));
            float pd = length((vUv - pc) * ar) / pr;
            float parcel = (1.0 - smoothstep(0.72, 1.0, pd)) * ons * uParcel;
            parcel = max(parcel, prev.b - uDt * 0.42);
            d = max(d, parcel * uMaxDelay * 0.92);
            d = clamp(d, 0.0, uMaxDelay);

            // past the end of the history the light has lost its picture
            float foam = smoothstep(0.80, 1.0, d / max(uMaxDelay, 1e-3)) *
              (0.35 + 0.75 * arc);

            // ---- 再会. The one affirming gesture in the piece. It must fire
            // only where a PERSON has walked back into their own held light —
            // and "old light agrees with now" alone cannot detect that: on a
            // still wall the two agree forever (the same trap the bubbles fell
            // into). Nor can it be measured after the update: arriving motion
            // pulls d to zero, erasing the held past in the same frame the
            // body reaches it. So the test runs on the delay AS IT STOOD
            // (prev.r) and requires the body to be arriving (motion, or the
            // recoil of having just stopped): deep held past + the living body
            // over it + the two images agreeing + a truly held note.
            // Keyed to a MOMENT, not to age: this is not a postmark.
            float dHeld = prev.r;
            vec3 came = lightFrom(vUv, dHeld);
            vec3 here = texture(uScene, vUv).rgb;
            float agree = 1.0 - smoothstep(0.030, 0.12,
              dot(abs(came - here), vec3(0.36, 0.42, 0.22)));
            float presence = max(smoothstep(0.03, 0.18, mo.r), kick);
            float meet = agree * presence *
              smoothstep(0.18, 0.45, dHeld / max(uMaxDelay, 1e-3)) *
              smoothstep(0.55, 0.90, sus);
            // 不応期: a breath must be exhaled before the next one can be
            // drawn. Without this, a body that keeps moving in place (the
            // verification figure, or anyone swaying) re-ignites every frame
            // and the breath becomes a steady glow — measured +30/255 on the
            // torso, which is exactly the 山場 this piece must not have.
            meet *= 1.0 - smoothstep(0.04, 0.20, prev.a);
            // the embrace resolves that pocket of stopped time, and the warmth
            // it leaves breathes out over a few seconds — never a steady glow
            d -= uDt * 1.6 * meet * d;
            float warmth = max(prev.a * (1.0 - uDt * 0.30), meet);

            fragColor = vec4(max(d, 0.0), clamp(foam, 0.0, 1.0),
              clamp(parcel, 0.0, 1.0), clamp(warmth, 0.0, 1.0));
          }
        `;

        // P5 — the BUBBLES. 「泡と化す宇宙の言葉」.
        //
        // Not soap balls drifting through a room. This is bubble art: colour
        // blown through a straw into paint and pressed onto paper, so what is
        // left is a stamped ring, a wash inside it, and sometimes a raft of
        // small cells. They bloom where they are and stay there; they do not
        // float. 増えては儚く消える — a bubble is born, holds, and thins out.
        //
        // 音量 sets how big and how many. 声色 (spectral centroid) sets the
        // colour. A loud attack BURSTS the ones already on the paper.
        //
        // Fixed pool = structurally bounded. Nothing accumulates.
        const foamFS = `#version 300 es
          precision highp float;
          layout(location = 0) out vec4 outA;
          layout(location = 1) out vec4 outB;
          uniform sampler2D uStateA;
          uniform sampler2D uStateB;
          uniform sampler2D uDelay;
          uniform sampler2D uMotion;
          uniform sampler2D uScene;
          uniform float uTexW;
          uniform float uDt;
          uniform float uSeed;
          uniform float uAspect;
          uniform float uFoam;
          uniform float uReveal;
          uniform vec4 uAudA;   // rms, centroid, zcr, onset
          uniform vec4 uAudB;   // sustain, pitch, vibrato, arc
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_FRACTAL}
          ${CHUNK_HIST}
          // how much of a ghost is standing at c: the gap between the light
          // that arrives and the room as it is now
          float ghostAt(vec2 c, float sec) {
            vec3 old = lightFrom(c, sec);
            vec3 now = texture(uScene, c).rgb;
            return dot(abs(old - now), vec3(0.36, 0.42, 0.22));
          }
          void main() {
            ivec2 tc = ivec2(gl_FragCoord.xy);
            float idx = float(tc.y) * uTexW + float(tc.x);
            vec4 A = texture(uStateA, gl_FragCoord.xy / vec2(textureSize(uStateA, 0)));
            vec4 B = texture(uStateB, gl_FragCoord.xy / vec2(textureSize(uStateB, 0)));
            if (uDt <= 0.0) { outA = A; outB = B; return; }
            vec2 pos = A.xy;
            vec2 vel = decV(A.zw);
            float age = B.x;
            float rad = B.y;
            float seed = B.z;
            float hue = B.w;

            float loud = clamp(uAudA.x, 0.0, 1.0);
            float onset = clamp(uAudA.w, 0.0, 1.0);

            if (age >= 0.999) {
              // dormant: the louder the voice, the more of them arrive
              // 発生は「ゆっくり、まばらに」。実機では毎秒たくさん生まれて
              // たくさん弾け、画面が明滅して曲の儚さから遠かった。数そのもの
              // より、生まれる頻度を落とすことのほうが効く。
              // 音量での変動も浅くする(2.45倍まで振ると小節ごとに湧く)。
              float rate = (0.08 + 0.68 * uFoam) * (0.70 + 0.80 * loud) *
                uDt / max(uTexW * uTexW, 1.0);
              if (hash12(vec2(idx * 1.93, uSeed * 0.71)) < rate) {
                for (int k = 0; k < 6; k++) {
                  vec2 c = hash22(vec2(idx * 4.17 + float(k) * 9.13,
                    uSeed * 3.31 + float(k) * 2.77));
                  // during the reveal they pack themselves by the same law
                  vec2 cr = 0.5 + phyllo(floor(hash12(vec2(idx, float(k))) * 15.0),
                    15.0, uSeed) * 0.42;
                  c = mix(c, cr, uReveal * 0.85);
                  vec4 dl = texture(uDelay, c);
                  // KEEP OFF THE GHOST. The afterimage is the subject of the
                  // piece; bubbles blooming on top of it just fight it. They
                  // want the still ground around the figure instead.
                  float gh = ghostAt(c, dl.r);
                  float room = 1.0 - smoothstep(0.022, 0.10, gh);
                  // the oldest light is FAVOURED, not required. As a hard gate
                  // it throttled the paper down to a dozen bubbles, and bubble
                  // art is a crowd — they have to overlap to read as blown.
                  room *= 0.16 + 0.84 * smoothstep(0.04, 0.50, dl.g);
                  if (age >= 0.999 &&
                      hash12(vec2(idx * 5.1, float(k) * 3.9)) < room) {
                    pos = c;
                    vel = vec2(0.0);
                    age = 0.0;
                    seed = hash12(vec2(idx * 13.1, uSeed * 6.7));
                    // 音量が大きいほど大きく吹かれる
                    // a wide spread: mostly small, a few large. An even spread
                    // of one size reads as a pattern, not as blown bubbles.
                    rad = (0.013 + 0.090 * pow(hash12(vec2(seed * 21.0, 3.3)), 2.3))
                      * (0.55 + 0.70 * loud);
                    // 声色 → colour. Bright voice runs cool, chest voice warm.
                    // the voice sets where on the wheel the batch sits; each
                    // bubble still takes its own colour from around there
                    hue = fract(0.04 + 0.44 * clamp(uAudA.y, 0.0, 1.0) +
                      0.52 * hash12(vec2(seed * 31.0, 7.7)));
                  }
                }
              }
            } else {
              // stamped on the paper: it barely moves. Only the faintest
              // breathing, so the picture does not turn into a lava lamp.
              vel += curlN(pos * vec2(uAspect, 1.0) * 2.6 + seed * 13.0) *
                uDt * 0.045;
              vel *= exp(-uDt * 1.8);
              pos += vel * uDt / vec2(uAspect, 1.0);
              // 長く居させる。短命だと「儚い」ではなく「せわしない」になる。
              float life = 6.0 + 4.0 * uFoam + 5.0 * hash12(vec2(seed * 3.3, 1.7));
              age += uDt / life;
              // 音量で弾ける。ただし「強いアタックのときの、たまたま脆い泡」
              // だけ。以前は全部の泡が毎回のオンセットで齢を進めていたので、
              // 実機では常時生まれて常時弾ける明滅になっていた。
              float frail = smoothstep(0.030, 0.085, rad);
              float fragile = step(hash12(vec2(seed * 41.0, 3.1)), 0.30);
              age += uDt * 2.0 * smoothstep(0.55, 1.0, onset) * fragile *
                (0.35 + 0.65 * frail);
              // 成長はほぼ止める。寿命を3倍に伸ばしたとき 5%/秒 のままにして
              // いたら、一生のあいだに半径が 2.7 倍になって画面いっぱいの輪に
              // なった(寿命と成長率は必ず一緒に見ること)。
              rad = min(rad * (1.0 + uDt * 0.010), 0.13);
              if (age >= 1.0) age = 1.0;
            }
            outA = vec4(pos, encV(vel));
            outB = vec4(clamp(age, 0.0, 1.0), rad, seed, hue);
          }
        `;

        // P6b — the bubbles, drawn as instanced quads.
        //
        // Bubble art, not a soap bubble. What is left on paper when a blown
        // bubble lands and bursts is: a stamped ring where the film met the
        // sheet, a thin wash inside it, and — where the foam was dense — a raft
        // of small cells. Flat, no specular, no 3D. Two earlier versions failed
        // by adding exactly the marks that read as "drawn soap bubble": a hard
        // bright rim and a white highlight dot. There are none here.
        //
        // The palette is deliberately washed out. 儚い is the brief, and this
        // has to sit under an afterimage without competing with it, so every
        // colour is pulled most of the way to paper before it is used.
        const foamDrawVS = `#version 300 es
          precision highp float;
          uniform sampler2D uStateA;
          uniform sampler2D uStateB;
          uniform float uTexW;
          uniform float uAspect;
          out vec2 vLocal;
          out vec3 vAttr;   // age, seed, hue
          out vec3 vCen;    // bubble centre in uv + its uv radius
          ${CHUNK_ENC}
          const vec2 QUAD[6] = vec2[6](
            vec2(-1.0, -1.0), vec2(1.0, -1.0), vec2(-1.0, 1.0),
            vec2(-1.0,  1.0), vec2(1.0, -1.0), vec2( 1.0, 1.0)
          );
          void main() {
            vLocal = vec2(0.0);
            vAttr = vec3(1.0, 0.0, 0.0);
            vCen = vec3(0.0);
            int i = gl_InstanceID;
            int tw = int(uTexW);
            ivec2 tc = ivec2(i % tw, i / tw);
            vec4 A = texelFetch(uStateA, tc, 0);
            vec4 B = texelFetch(uStateB, tc, 0);
            if (B.x >= 0.999) { gl_Position = vec4(3.0, 3.0, 0.0, 1.0); return; }
            vec2 q = QUAD[gl_VertexID];
            vLocal = q;
            vAttr = vec3(B.x, B.z, B.w);
            vCen = vec3(A.xy, B.y);
            // the quad is a little larger than the bubble so the outermost
            // cells of a foam raft are not clipped off square
            vec2 P = A.xy * vec2(uAspect, 1.0) + q * B.y * 1.12;
            gl_Position = vec4(vec2(P.x / uAspect, P.y) * 2.0 - 1.0, 0.0, 1.0);
          }
        `;

        const foamDrawFS = `#version 300 es
          precision highp float;
          in vec2 vLocal;
          in vec3 vAttr;
          in vec3 vCen;
          out vec4 fragColor;
          uniform sampler2D uDelay;
          ${CHUNK_NOISE}
          ${CHUNK_PALETTE}
          ${CHUNK_HIST}

          // the web of borders in a raft of small bubbles: F2 - F1 of a jittered
          // Worley lattice is small exactly along the walls between cells
          float cellWeb(vec2 q, float sd) {
            vec2 g = floor(q), f = fract(q);
            float b1 = 8.0, b2 = 8.0;
            for (int y = -1; y <= 1; y++) {
              for (int x = -1; x <= 1; x++) {
                vec2 o = vec2(float(x), float(y));
                vec2 pt = o + 0.12 + 0.76 * hash22(g + o + sd);
                float d = length(f - pt);
                if (d < b1) { b2 = b1; b1 = d; } else if (d < b2) { b2 = d; }
              }
            }
            return b2 - b1;
          }

          void main() {
            float age = vAttr.x;
            float seed = vAttr.y;
            float hue = vAttr.z;
            vec2 p = vLocal * 1.12;          // quad was widened; undo for radius
            float r = length(p);
            if (r > 1.12) discard;

            // 増えては儚く消える。にじり出て、長く薄れる — 立ち上がりが速い
            // と、生まれた瞬間がストロボのように光って見える。
            float bloom = smoothstep(0.0, 0.38, age);
            float fade = 1.0 - smoothstep(0.22, 1.0, age);
            float R = mix(0.70, 1.0, bloom);
            float d = r / R;

            // the wall: an ink line where the film stood on the paper. It is
            // never perfectly round — a landed bubble dries wobbly.
            float th = atan(p.y, p.x);
            float wob = 1.0 + 0.030 * sin(th * 2.0 + seed * 19.0) +
              0.016 * sin(th * 5.0 - seed * 11.0);
            float dw = d / wob;
            float ring = smoothstep(0.86, 0.985, dw) * (1.0 - smoothstep(0.985, 1.06, dw));
            float inside = 1.0 - smoothstep(0.94, 1.0, dw);

            // a raft of small cells inside roughly a third of them
            float raft = step(0.66, hash12(vec2(seed * 7.3, 2.9)));
            float web = 0.0;
            if (raft > 0.5) {
              float sc = 4.5 + 6.0 * hash12(vec2(seed * 5.1, 8.4));
              float e = cellWeb(p * sc, seed * 23.0);
              web = (1.0 - smoothstep(0.0, 0.16, e)) * inside;
              // the raft does not fill the whole bubble, it drifts to one side
              vec2 off = (hash22(vec2(seed * 3.7, 1.3)) - 0.5) * 0.8;
              web *= smoothstep(0.95, 0.25, length(p - off));
            }

            // ---- what the wash inside the ring is MADE OF: the oldest light
            // this place still holds, bent a little by the film. 泡と化す宇宙の
            // 言葉 — the bubble is a word that used to be an image, so the image
            // has to be in it, going. (An earlier rework dropped this and the
            // bubbles fell back to being decoration.)
            vec2 radUv = vec2(vCen.z, vCen.z);
            float bulge = 0.55 + 0.50 * d * d;
            vec2 suv = clamp(vCen.xy + p * radUv * bulge * 0.9, 0.0, 1.0);
            float hsec = texture(uDelay, vCen.xy).r;
            vec3 held = lightFrom(suv, max(hsec, uMaxDelay * 0.55));
            // already going: thinned toward grey, more so as the bubble ages
            held = mix(held, vec3(dot(held, vec3(0.30, 0.59, 0.11))),
              0.45 + 0.40 * age);

            // ---- colour. Washed to the point of being barely there.
            vec3 pure = bubbleHue(hue);
            // paper first, pigment second — this is the whole reason it reads
            // as 儚い instead of as a children's toy
            vec3 tint = mix(PAPER, pure, 0.32);
            vec3 wash = mix(held, tint, 0.30);
            // the wall holds a little more pigment, as ink does when it dries
            // at an edge, but it goes DARKER rather than more colourful
            vec3 line = mix(tint, pure, 0.22) * 0.70;

            float aRing = ring * 0.42;
            // the wash carries the image, so it needs enough presence to read
            float aWash = inside * 0.20;
            float aWeb  = web * 0.30;
            float a = (aRing + aWash + aWeb) * fade;
            vec3 col = (line * (aRing + aWeb) + wash * aWash) / max(a, 1e-4);

            // ---- stay off the figure. The subject of the picture is the
            // person and the afterimage they leave; bubbles are the ground it
            // happens on. Comparing old light against now does NOT find the
            // figure — where someone stands still the two agree exactly — so
            // read the delay field instead: deep means still ground and is
            // safe, shallow means the living body and its recent wake.
            float ground = texture(uDelay, suv).g;
            a *= 0.14 + 0.86 * smoothstep(0.04, 0.42, ground);

            if (a <= 0.004) discard;
            fragColor = vec4(col * a, a);
          }
        `;

        // P7 — bloom bright pass: only the parts of the flower layer that are
        // genuinely luminous (the stamens, the brightest petal flanks) are
        // allowed to glow. Downsamples at the same time.
        const brightFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uSrc;
          void main() {
            vec3 c = texture(uSrc, vUv).rgb;
            float l = dot(c, vec3(0.299, 0.587, 0.114));
            // only the genuinely emissive parts (stamens, the hottest petal
            // flanks — the ones written above 1.0) are allowed to glow. A low
            // threshold makes every petal halo and the field reads as sparkles.
            fragColor = vec4(c * smoothstep(0.80, 1.60, l), 1.0);
          }
        `;

        // P8 — composite. The ground is not "now": every point samples the
        // history array at its own age and the two nearest stored frames are
        // blended, so the past arrives continuously. Nothing anywhere states how
        // old a region is — the postmark is erased.
        const compositeFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform sampler2D uDelay;
          uniform sampler2D uMotion;
          uniform sampler2D uLayer;
          uniform sampler2D uB1;
          uniform sampler2D uB2;
          uniform vec2 uResolution;
          uniform float uAspect;
          uniform float uTime;
          uniform float uExposure;
          uniform float uFilmGrain;
          uniform float uReveal;
          uniform vec4 uAudA;
          uniform vec4 uAudB;
          uniform int uDebug;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_PALETTE}
          ${CHUNK_FRACTAL}
          ${CHUNK_HIST}
          float lumaf(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

          void main() {
            vec2 ar = vec2(uAspect, 1.0);
            vec4 dl = texture(uDelay, vUv);
            vec4 mo = texture(uMotion, vUv);
            float sec = dl.r;
            float foam = dl.g;

            // ---- the picture that has arrived
            vec3 img = lightFrom(vUv, sec);
            // whatever is moving is nearly present. This has to be firm: the
            // proposition of the piece is that what moves is NOW and what stops
            // is old, and at 0.40 the living present was still half a memory.
            vec3 now = texture(uScene, vUv).rgb;
            img = mix(img, now, smoothstep(0.05, 0.40, mo.r));

            // 無着色 — but the same for every age. Tinting or darkening by age
            // would be a postmark: it would tell you which parts are old, and
            // the whole point is that you cannot tell. What is old shows only in
            // WHAT it shows, never in how it is coloured.
            float ageN = clamp(sec / max(uMaxDelay, 1e-3), 0.0, 1.0);
            float gl0 = lumaf(img);
            float g2 = pow(clamp(gl0, 0.0, 1.0), 1.05);
            vec3 col = mix(img, vec3(g2), 0.62);
            col = mix(col, NIGHT + vec3(g2) * 0.78, 0.22);
            // 再会の温度: where someone has walked back into their own held
            // light while the voice sustains, a pale warmth breathes through —
            // the one affirming gesture (さもありなん = 優しい肯定) in an
            // otherwise unresisting picture. Event-keyed, not age-keyed.
            float wmth = smoothstep(0.12, 0.65, dl.a);
            col += (vec3(0.93, 0.86, 0.74) - col) * wmth * 0.20;
            col *= 1.0 + 0.06 * wmth;
            col = (col - 0.5) * 1.10 + 0.5;

            // NOTHING is drawn here for the foam. Any tint keyed to the age
            // would draw a map of what is old across the picture — the postmark
            // again. The dissolve is carried entirely by the bubbles above.

            col = clamp(col * uExposure, 0.0, 4.0);

            // ---- 石楠花と泡(前乗算)
            vec4 F = texture(uLayer, vUv);
            col = col * (1.0 - clamp(F.a, 0.0, 1.0)) + F.rgb;

            // ---- the bloom of the film colour only
            vec3 b1 = texture(uB1, vUv).rgb;
            vec3 b2 = texture(uB2, vUv).rgb;
            col += (b1 * 0.30 + b2 * 0.52) * (0.30 + 0.5 * uReveal);

            // ---- 統合が露わになる一点: the same arrangement at every scale
            if (uReveal > 0.001) {
              float rv = phylloField(vUv * ar, 2.2, 3.0, 2.0);
              float lines = smoothstep(0.42, 0.36, rv) - smoothstep(0.30, 0.24, rv);
              col += vec3(0.55, 0.60, 0.72) * lines * uReveal * 0.20;
            }

            float l = lumaf(col);
            float lt = l < 0.74 ? l : 0.74 + (l - 0.74) / (1.0 + (l - 0.74) * 1.8);
            col *= l > 1e-4 ? lt / l : 1.0;

            float h1 = hash12(floor(gl_FragCoord.xy));
            col += (h1 - 0.5) * uFilmGrain * (0.05 +
              0.08 * (1.0 - smoothstep(0.05, 0.6, lumaf(col))));
            float vig = 1.0 - 0.18 * pow(clamp(
              length((vUv - 0.5) * vec2(1.04, 1.0)) * 1.42, 0.0, 1.0), 2.0);
            col *= vig;

            if (uDebug == 1) {
              col = vec3(mo.r * 2.0, mo.g, clamp(length(decV(mo.ba)), 0.0, 1.0));
            } else if (uDebug == 2) {
              col = vec3(ageN, foam, dl.a);   // B = 再会の温度(速達は目視で分かる)
            } else if (uDebug == 3) {
              float vals[6];
              vals[0] = uAudA.x; vals[1] = uAudB.x; vals[2] = uAudA.y;
              vals[3] = uAudA.z; vals[4] = uAudB.y; vals[5] = uAudB.w;
              col = vec3(0.03, 0.035, 0.05);
              for (int i = 0; i < 6; i++) {
                float y0 = 0.14 + 0.115 * float(i);
                float band = 1.0 - smoothstep(0.030, 0.038, abs(vUv.y - y0));
                float fill = step(vUv.x, 0.08 + 0.84 * clamp(vals[i], 0.0, 1.0));
                col = mix(col, bubbleHue(0.10 + 0.16 * float(i)),
                  band * fill * 0.95);
                col = mix(col, vec3(0.16), band * (1.0 - fill) * 0.6);
              }
            } else if (uDebug == 4) {
              col = F.rgb + vec3(0.08) * clamp(F.a, 0.0, 1.0);
            } else if (uDebug == 5) {
              float row = floor(vUv.y * 3.0);
              col = row < 1.0 ? mix(NIGHT, vec3(0.86), vUv.x)
                : (row < 2.0 ? bubbleHue(vUv.x)
                : mix(PAPER, bubbleHue(vUv.x), 0.28));
            }
            col = min(col, vec3(0.985));
            fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
          }
        `;

        /* ------------------------------------------------------------------

        ------------------------------------------------------------------ */

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(`Shader compile failed: ${gl.getShaderInfoLog(shader)}`);
          }
          return shader;
        }
        function createProgramVS(vsSource, fsSource) {
          const program = gl.createProgram();
          gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
          gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(`Program link failed: ${gl.getProgramInfoLog(program)}`);
          }
          return program;
        }
        function createProgram(fsSource) {
          return createProgramVS(fullscreenVS, fsSource);
        }
        function getLocations(program, names) {
          const out = {};
          names.forEach((name) => {
            out[name] = gl.getUniformLocation(program, name);
          });

        }

        const programs = {
          scene: createProgram(sceneFS),
          motion: createProgram(motionFS),
          blur: createProgram(blurFS),
          histCopy: createProgram(histCopyFS),
          delay: createProgram(delayFS),
          foam: createProgram(foamFS),
          foamDraw: createProgramVS(foamDrawVS, foamDrawFS),
          bright: createProgram(brightFS),
          composite: createProgram(compositeFS),
        };

        const locations = {
          scene: getLocations(programs.scene, [
            "uVideo", "uResolution", "uVideoSize", "uAspect", "uCx", "uCy",
            "uSwing", "uScale", "uMirror", "uFake", "uHasVideo",
          ]),
          motion: getLocations(programs.motion, [
            "uScene", "uScenePrev", "uPrev", "uTexel", "uDt", "uAlphaMot", "uReset",
          ]),
          blur: getLocations(programs.blur, ["uSrc", "uDir", "uSigma"]),
          histCopy: getLocations(programs.histCopy, ["uSrc"]),
          delay: getLocations(programs.delay, [
            "uPrev", "uMotion", "uMotionRaw", "uScene", "uDt", "uTime", "uAspect",
            "uMaxDelay", "uDepth",
            "uConverge", "uGrain", "uParcel", "uReveal", "uSeed", "uReset",
            "uAudA", "uAudB",
            "uHist", "uHistHz", "uHistN", "uWrite",
          ]),
          foam: getLocations(programs.foam, [
            "uStateA", "uStateB", "uDelay", "uMotion", "uScene", "uTexW", "uDt",
            "uSeed", "uAspect", "uFoam", "uReveal", "uAudA", "uAudB",
            "uHist", "uHistHz", "uHistN", "uWrite", "uMaxDelay",
          ]),
          foamDraw: getLocations(programs.foamDraw, [
            "uStateA", "uStateB", "uTexW", "uAspect", "uDelay",
            "uHist", "uHistHz", "uHistN", "uWrite", "uMaxDelay",
          ]),
          bright: getLocations(programs.bright, ["uSrc", "uThreshold"]),
          composite: getLocations(programs.composite, [
            "uScene", "uHist", "uDelay", "uMotion", "uLayer", "uB1", "uB2",
            "uResolution", "uAspect", "uTime", "uExposure", "uFilmGrain",
            "uReveal", "uHistHz", "uHistN", "uWrite", "uMaxDelay",
            "uAudA", "uAudB", "uDebug",

        };

        function createTexture(width, height, internal, format, type, filter) {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          const f = filter || gl.LINEAR;
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(gl.TEXTURE_2D, 0, internal, width, height, 0, format, type, null);
          return tex;
        }
        function createTarget(width, height, useFloat) {
          const internal = useFloat && floatExt ? gl.RGBA16F : gl.RGBA8;
          const type = useFloat && floatExt ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
          const tex = createTexture(width, height, internal, gl.RGBA, type, gl.LINEAR);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return { tex, fbo, width, height };
        }
        // A ping-pong-able STATE set: two data textures (NEAREST — pure state,
        // read with texelFetch) sharing one MRT framebuffer.
        function createStateSet(width, height) {
          const internal = floatExt ? gl.RGBA16F : gl.RGBA8;
          const type = floatExt ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
          const texA = createTexture(width, height, internal, gl.RGBA, type, gl.NEAREST);
          const texB = createTexture(width, height, internal, gl.RGBA, type, gl.NEAREST);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texA, 0);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, texB, 0);
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return { texA, texB, fbo, width, height };
        }
        function destroyTarget(target) {
          if (!target) return;
          if (target.tex) gl.deleteTexture(target.tex);
          gl.deleteFramebuffer(target.fbo);
        }
        function clearTarget(target, r, g, b, a) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
          gl.viewport(0, 0, target.width, target.height);
          gl.clearColor(r, g, b, a);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }

        // Empty VAO for attributeless draws (fullscreen tri + instanced quads).
        const vao = gl.createVertexArray();

        // Foam state ping-pong (allocated once; canvas-size independent).
        const foamSets = [
          createStateSet(FOAM_W, FOAM_H),
          createStateSet(FOAM_W, FOAM_H),
        ];
        let foamPing = false;

        // Video texture (DOM source → UNPACK_FLIP_Y).
        const videoTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

        // The HISTORY of light: a 2D texture ARRAY, one layer per stored frame.
        // Layers are written in a ring at a fixed cadence, so any delay can be
        // expressed in seconds. Rebuilt on resize with the rest of the targets.
        let histTex = null;
        let histFbo = null;
        let histW = 2, histH = 2;
        let histWrite = 0;          // the layer written most recently
        let histFill = 0;           // how many layers hold a real frame yet
        let histAcc = 0;            // cadence accumulator (seconds)

        function rebuildHistory(w, h) {
          if (histTex) gl.deleteTexture(histTex);
          if (histFbo) gl.deleteFramebuffer(histFbo);
          histW = w; histH = h;
          histTex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D_ARRAY, histTex);
          gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage3D(gl.TEXTURE_2D_ARRAY, 0, gl.RGBA8, w, h, HIST_N, 0,
            gl.RGBA, gl.UNSIGNED_BYTE, null);
          histFbo = gl.createFramebuffer();
          histWrite = 0;
          histFill = 0;
          histAcc = 0;
        }
        // write the current scene into one layer of the ring
        function pushHistory(srcTex) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, histFbo);
          gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
            histTex, 0, histWrite);
          gl.viewport(0, 0, histW, histH);
          gl.useProgram(programs.histCopy);
          bindTexture(0, srcTex);
          gl.uniform1i(locations.histCopy.uSrc, 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          histFill = Math.min(HIST_N, histFill + 1);
        }
        function bindHistory(unit) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D_ARRAY, histTex);
        }

        let targets = null;
        let paintW = 2, paintH = 2, fieldW = 2, fieldH = 2, glowW = 2, glowH = 2;
        let needsReset = true;

        function rebuildTargets() {
          if (targets) Object.values(targets).forEach(destroyTarget);
          const b1W = Math.max(4, Math.round(glowW / 2));
          const b1H = Math.max(4, Math.round(glowH / 2));
          const b2W = Math.max(4, Math.round(glowW / 4));
          const b2H = Math.max(4, Math.round(glowH / 4));
          targets = {
            sceneA: createTarget(paintW, paintH, false),
            sceneB: createTarget(paintW, paintH, false),
            motA: createTarget(fieldW, fieldH, true),
            motB: createTarget(fieldW, fieldH, true),
            softT: createTarget(fieldW, fieldH, true),
            softTmp: createTarget(fieldW, fieldH, true),
            delayA: createTarget(fieldW, fieldH, true),
            delayB: createTarget(fieldW, fieldH, true),
            layer: createTarget(paintW, paintH, true),
            b1Src: createTarget(b1W, b1H, true),
            b1Tmp: createTarget(b1W, b1H, true),
            b1: createTarget(b1W, b1H, true),
            b2Tmp: createTarget(b2W, b2H, true),
            b2: createTarget(b2W, b2H, true),
          };
