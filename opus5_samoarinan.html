            float lt = l < 0.74 ? l : 0.74 + (l - 0.74) / (1.0 + (l - 0.74) * 1.8);
            col *= l > 1e-4 ? lt / l : 1.0;

            float h1 = hash12(floor(gl_FragCoord.xy));
            col += (h1 - 0.5) * uFilmGrain * (0.05 +
              0.08 * (1.0 - smoothstep(0.05, 0.6, lumaf(col))));
            float vig = 1.0 - 0.18 * pow(clamp(
              length((vUv - 0.5) * vec2(1.04, 1.0)) * 1.42, 0.0, 1.0), 2.0);
            col *= vig;

            if (uDebug == 1) {
              col = vec3(mo.r * 2.0, mo.g, clamp(length(decV(mo.ba)), 0.0, 1.0));
            } else if (uDebug == 2) {
              col = vec3(ageN, foam, dl.b);
            } else if (uDebug == 3) {
              float vals[6];
              vals[0] = uAudA.x; vals[1] = uAudB.x; vals[2] = uAudA.y;
              vals[3] = uAudA.z; vals[4] = uAudB.y; vals[5] = uAudB.w;
              col = vec3(0.03, 0.035, 0.05);
              for (int i = 0; i < 6; i++) {
                float y0 = 0.14 + 0.115 * float(i);
                float band = 1.0 - smoothstep(0.030, 0.038, abs(vUv.y - y0));
                float fill = step(vUv.x, 0.08 + 0.84 * clamp(vals[i], 0.0, 1.0));
                col = mix(col, filmColour(0.2 + 0.12 * float(i), 0.4),
                  band * fill * 0.95);
                col = mix(col, vec3(0.16), band * (1.0 - fill) * 0.6);
              }
            } else if (uDebug == 4) {
              col = F.rgb + vec3(0.08) * clamp(F.a, 0.0, 1.0);
            } else if (uDebug == 5) {
              float row = floor(vUv.y * 3.0);
              col = row < 1.0 ? mix(LEAF_D, LEAF_L, vUv.x)
                : (row < 2.0 ? mix(PETAL_P, PETAL_W, vUv.x)
                : filmColour(vUv.x * 1.6, 0.4));
            }
            col = min(col, vec3(0.985));
            fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
          }
        `;

        /* ------------------------------------------------------------------
           Program / target plumbing
        ------------------------------------------------------------------ */

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(`Shader compile failed: ${gl.getShaderInfoLog(shader)}`);
          }
          return shader;
        }
        function createProgramVS(vsSource, fsSource) {
          const program = gl.createProgram();
          gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
          gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(`Program link failed: ${gl.getProgramInfoLog(program)}`);
          }
          return program;
        }
        function createProgram(fsSource) {
          return createProgramVS(fullscreenVS, fsSource);
        }
        function getLocations(program, names) {
          const out = {};
          names.forEach((name) => {
            out[name] = gl.getUniformLocation(program, name);
          });
          return out;
        }

        const programs = {
          scene: createProgram(sceneFS),
          motion: createProgram(motionFS),
          blur: createProgram(blurFS),
          histCopy: createProgram(histCopyFS),
          delay: createProgram(delayFS),
          foam: createProgram(foamFS),
          truss: createProgramVS(trussVS, trussFS),
          foamDraw: createProgramVS(foamDrawVS, foamDrawFS),
          bright: createProgram(brightFS),
          composite: createProgram(compositeFS),
        };

        const locations = {
          scene: getLocations(programs.scene, [
            "uVideo", "uResolution", "uVideoSize", "uAspect", "uCx", "uCy",
            "uSwing", "uScale", "uMirror", "uFake", "uHasVideo",
          ]),
          motion: getLocations(programs.motion, [
            "uScene", "uScenePrev", "uPrev", "uTexel", "uDt", "uAlphaMot", "uReset",
          ]),
          blur: getLocations(programs.blur, ["uSrc", "uDir", "uSigma"]),
          histCopy: getLocations(programs.histCopy, ["uSrc"]),
          delay: getLocations(programs.delay, [
            "uPrev", "uMotion", "uMotionRaw", "uDt", "uTime", "uAspect",
            "uMaxDelay", "uDepth",
            "uConverge", "uGrain", "uParcel", "uReveal", "uSeed", "uReset",
            "uAudA", "uAudB",
          ]),
          foam: getLocations(programs.foam, [
            "uStateA", "uStateB", "uDelay", "uMotion", "uScene", "uTexW", "uDt",
            "uSeed", "uAspect", "uFoam", "uReveal", "uAudA", "uAudB",
            "uHist", "uHistHz", "uHistN", "uWrite", "uMaxDelay",
          ]),
          truss: getLocations(programs.truss, [
            "uAspect", "uTime", "uTruss", "uReveal", "uAudA", "uAudB",
          ]),
          foamDraw: getLocations(programs.foamDraw, [
            "uStateA", "uStateB", "uTexW", "uAspect", "uDelay",
            "uHist", "uHistHz", "uHistN", "uWrite", "uMaxDelay",
          ]),
          bright: getLocations(programs.bright, ["uSrc", "uThreshold"]),
          composite: getLocations(programs.composite, [
            "uScene", "uHist", "uDelay", "uMotion", "uLayer", "uB1", "uB2",
            "uResolution", "uAspect", "uTime", "uExposure", "uFilmGrain", "uRain",
            "uReveal", "uHistHz", "uHistN", "uWrite", "uMaxDelay",
            "uAudA", "uAudB", "uDebug",
          ]),
        };

        function createTexture(width, height, internal, format, type, filter) {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          const f = filter || gl.LINEAR;
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(gl.TEXTURE_2D, 0, internal, width, height, 0, format, type, null);
          return tex;
        }
        function createTarget(width, height, useFloat) {
          const internal = useFloat && floatExt ? gl.RGBA16F : gl.RGBA8;
          const type = useFloat && floatExt ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
          const tex = createTexture(width, height, internal, gl.RGBA, type, gl.LINEAR);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return { tex, fbo, width, height };
        }
        // A ping-pong-able STATE set: two data textures (NEAREST — pure state,
        // read with texelFetch) sharing one MRT framebuffer.
        function createStateSet(width, height) {
          const internal = floatExt ? gl.RGBA16F : gl.RGBA8;
          const type = floatExt ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
          const texA = createTexture(width, height, internal, gl.RGBA, type, gl.NEAREST);
          const texB = createTexture(width, height, internal, gl.RGBA, type, gl.NEAREST);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texA, 0);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, texB, 0);
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return { texA, texB, fbo, width, height };
        }
        function destroyTarget(target) {
          if (!target) return;
          if (target.tex) gl.deleteTexture(target.tex);
          gl.deleteFramebuffer(target.fbo);
        }
        function clearTarget(target, r, g, b, a) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
          gl.viewport(0, 0, target.width, target.height);
          gl.clearColor(r, g, b, a);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }

        // Empty VAO for attributeless draws (fullscreen tri + instanced quads).
        const vao = gl.createVertexArray();

        // Foam state ping-pong (allocated once; canvas-size independent).
        const foamSets = [
          createStateSet(FOAM_W, FOAM_H),
          createStateSet(FOAM_W, FOAM_H),
        ];
        let foamPing = false;

        // Video texture (DOM source → UNPACK_FLIP_Y).
        const videoTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

        // The HISTORY of light: a 2D texture ARRAY, one layer per stored frame.
        // Layers are written in a ring at a fixed cadence, so any delay can be
        // expressed in seconds. Rebuilt on resize with the rest of the targets.
        let histTex = null;
        let histFbo = null;
        let histW = 2, histH = 2;
        let histWrite = 0;          // the layer written most recently
        let histFill = 0;           // how many layers hold a real frame yet
        let histAcc = 0;            // cadence accumulator (seconds)

        function rebuildHistory(w, h) {
          if (histTex) gl.deleteTexture(histTex);
          if (histFbo) gl.deleteFramebuffer(histFbo);
          histW = w; histH = h;
          histTex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D_ARRAY, histTex);
          gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage3D(gl.TEXTURE_2D_ARRAY, 0, gl.RGBA8, w, h, HIST_N, 0,
            gl.RGBA, gl.UNSIGNED_BYTE, null);
          histFbo = gl.createFramebuffer();
          histWrite = 0;
          histFill = 0;
          histAcc = 0;
        }
        // write the current scene into one layer of the ring
        function pushHistory(srcTex) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, histFbo);
          gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
            histTex, 0, histWrite);
          gl.viewport(0, 0, histW, histH);
          gl.useProgram(programs.histCopy);
          bindTexture(0, srcTex);
          gl.uniform1i(locations.histCopy.uSrc, 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          histFill = Math.min(HIST_N, histFill + 1);
        }
        function bindHistory(unit) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D_ARRAY, histTex);
        }

        let targets = null;
        let paintW = 2, paintH = 2, fieldW = 2, fieldH = 2, glowW = 2, glowH = 2;
        let needsReset = true;

        function rebuildTargets() {
          if (targets) Object.values(targets).forEach(destroyTarget);
          const b1W = Math.max(4, Math.round(glowW / 2));
          const b1H = Math.max(4, Math.round(glowH / 2));
          const b2W = Math.max(4, Math.round(glowW / 4));
          const b2H = Math.max(4, Math.round(glowH / 4));
          targets = {
            sceneA: createTarget(paintW, paintH, false),
            sceneB: createTarget(paintW, paintH, false),
            motA: createTarget(fieldW, fieldH, true),
            motB: createTarget(fieldW, fieldH, true),
            softT: createTarget(fieldW, fieldH, true),
            softTmp: createTarget(fieldW, fieldH, true),
            delayA: createTarget(fieldW, fieldH, true),
            delayB: createTarget(fieldW, fieldH, true),
            layer: createTarget(paintW, paintH, true),
            b1Src: createTarget(b1W, b1H, true),
            b1Tmp: createTarget(b1W, b1H, true),
            b1: createTarget(b1W, b1H, true),
            b2Tmp: createTarget(b2W, b2H, true),
            b2: createTarget(b2W, b2H, true),
          };
          needsReset = true;
        }

        // Encoded targets must clear to encoded zero (0.5) for the flow channel.
        function clearSimTargets() {
          clearTarget(targets.sceneA, 0.22, 0.22, 0.25, 1);
          clearTarget(targets.sceneB, 0.22, 0.22, 0.25, 1);
          clearTarget(targets.motA, 0, 0, 0.5, 0.5);
          clearTarget(targets.motB, 0, 0, 0.5, 0.5);
          clearTarget(targets.softT, 0, 0, 0.5, 0.5);
          clearTarget(targets.softTmp, 0, 0, 0.5, 0.5);
          clearTarget(targets.delayA, 0, 0, 0, 1);
          clearTarget(targets.delayB, 0, 0, 0, 1);
          clearTarget(targets.layer, 0, 0, 0, 0);
          clearTarget(targets.b1Src, 0, 0, 0, 1);
          clearTarget(targets.b1, 0, 0, 0, 1);
          clearTarget(targets.b2, 0, 0, 0, 1);
        }

        // The foam pool. Two MRT attachments need DIFFERENT clear values (a
        // dormant bubble is age = 1), so clear them one at a time.
        function clearStateSet(set, aClear, bClear) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, set.fbo);
          gl.viewport(0, 0, set.width, set.height);
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.NONE]);
          gl.clearColor(aClear[0], aClear[1], aClear[2], aClear[3]);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawBuffers([gl.NONE, gl.COLOR_ATTACHMENT1]);
          gl.clearColor(bClear[0], bClear[1], bClear[2], bClear[3]);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
        }
        function resetPools() {
          foamSets.forEach((s) => clearStateSet(s, [0.5, 0.5, 0.5, 0.5], [1, 0, 0, 0]));
          foamPing = false;
        }

        function resize() {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const width = Math.max(2, Math.floor(canvas.clientWidth * dpr));
          const height = Math.max(2, Math.floor(canvas.clientHeight * dpr));
          if (canvas.width !== width || canvas.height !== height || !targets) {
            canvas.width = width;
            canvas.height = height;
            const maxSide = Math.max(width, height);
            const paintScale = Math.min(1, 1280 / maxSide);
            paintW = Math.max(2, Math.round(width * paintScale));
            paintH = Math.max(2, Math.round(height * paintScale));
            const fieldScale = Math.min(1, 448 / maxSide);
            fieldW = Math.max(8, Math.round(width * fieldScale));
            fieldH = Math.max(8, Math.round(height * fieldScale));
            const glowScale = Math.min(0.5, 960 / maxSide);
            glowW = Math.max(8, Math.round(width * glowScale));
            glowH = Math.max(8, Math.round(height * glowScale));
            const histScale = Math.min(1, HIST_MAX / maxSide);
            rebuildHistory(Math.max(8, Math.round(width * histScale)),
              Math.max(8, Math.round(height * histScale)));
            rebuildTargets();
          }
        }
        window.addEventListener("resize", resize, { passive: true });

        function bindTexture(unit, texture) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, texture);
        }
        function renderPass(target, program, setup) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
          gl.viewport(0, 0, target ? target.width : canvas.width,
            target ? target.height : canvas.height);
          gl.useProgram(program);
          setup();
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        // stride lets a 21-tap kernel reach far (the proximity aura) without
        // turning into a truncated, boxy blur.
        function blurPass(src, tmp, dst, sigma, stride) {
          const st = stride || 1;
          renderPass(tmp, programs.blur, () => {
            bindTexture(0, src.tex);
            gl.uniform1i(locations.blur.uSrc, 0);
            gl.uniform2f(locations.blur.uDir, st / tmp.width, 0);
            gl.uniform1f(locations.blur.uSigma, sigma);
          });
          renderPass(dst, programs.blur, () => {
            bindTexture(0, tmp.tex);
            gl.uniform1i(locations.blur.uSrc, 0);
            gl.uniform2f(locations.blur.uDir, 0, st / dst.height);
            gl.uniform1f(locations.blur.uSigma, sigma);
          });
        }
        // True GPU sync for this environment: gl.finish() is effectively
        // non-blocking under swiftshader, a 1x1 readPixels is not (CRAFT §C4).
        const syncPixel = new Uint8Array(4);
        function glSync() {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, syncPixel);
        }

        /* ------------------------------------------------------------------
           There is NO person detection in this piece. What ages the light is
           STILLNESS, measured from the frame difference itself (P1), so nothing
           needs a model, a mask or a network round trip. The only tracked state
           is the synthetic figure used by ?fakesource=1.
        ------------------------------------------------------------------ */

        const det = { cx: 0.5, cy: 0, swing: 0, tcx: 0.5, tcy: 0 };

        /* ------------------------------------------------------------------
           SOUND → the growth signals. Three drivers behind ONE meter set:
             mic  — AnalyserNode: RMS (fast + slow EMA), spectral centroid,
                    zero-crossing rate, dominant-pitch estimate, and an onset
                    detector (hysteresis + refractory) for string attacks.
             fake — ?fakesource=1: a deterministic 18s song. WebAudio and the
                    microphone are NEVER opened, so verification is offline.
             demo — mic denied / unavailable: a slow procedural breath so the
                    piece still grows flowers instead of standing empty.
           Every meter is normalised to 0..1 and all smoothing is dt-driven, so
           ?freeze=1 (dt = 0) holds them exactly and ?prewarm= is deterministic.
        ------------------------------------------------------------------ */

        const aud = {
          mode: FAKE ? "fake" : "demo",
          ctx: null, analyser: null, stream: null,
          timeData: null, freqData: null,
          rmsF: 0, rmsS: 0, cen: 0.3, zcr: 0.2, pitF: 0.4, pitS: 0.4,
          armed: true, refr: 0, level: 0,
          err: "",
        };
        // rms = instant loudness, sus = sustained voice (the growth fuel),
        // cen = spectral centroid (timbre → hue), zcr = breathiness,
        // pitch = dominant pitch (→ stem height), vib = vibrato, onset = attack
        const meters = {
          rms: 0, sus: 0, cen: 0.3, zcr: 0.2, pitch: 0.4, vib: 0, onset: 0,
        };
        let arc = 0;          // 楽章: the accumulated arc of the song (0..1)
        let fakeOnsetK = 0;
        let demoOnsetT = 1.4;

        // The scripted song for ?fakesource=1 — 18s: 前奏 / A メロ / サビ /
        // 間奏 / 余韻. A pure function of the (frozen-able) art clock.
        function fakeSong(t) {
          const T = t % 18;
          let vol, cen, pit, zcr;
          if (T < 1.1) {                       // 前奏: almost silent
            vol = 0.05 + 0.03 * Math.sin(T * 3.0);
            cen = 0.22; pit = 0.30; zcr = 0.30;
          } else if (T < 6.6) {                // A メロ
            const u = (T - 1.1) / 5.5;
            vol = 0.30 + 0.13 * Math.sin(T * 2.3) + 0.08 * u;
            cen = 0.30 + 0.08 * Math.sin(T * 0.7);
            pit = 0.34 + 0.10 * Math.sin(T * 1.1);
            zcr = 0.26;
          } else if (T < 12.6) {               // サビ
            const u = (T - 6.6) / 6.0;
            vol = 0.60 + 0.20 * Math.sin(T * 1.7) * (0.6 + 0.4 * u);
            cen = 0.52 + 0.14 * Math.sin(T * 0.9);
            pit = 0.62 + 0.14 * Math.sin(T * 1.4);
            zcr = 0.22;
          } else if (T < 15.4) {               // 間奏: breathy, quiet
            vol = 0.20 + 0.07 * Math.sin(T * 2.9);
            cen = 0.40; pit = 0.45; zcr = 0.58;
          } else {                             // 余韻
            const u = (T - 15.4) / 2.6;
            vol = 0.16 * (1.0 - u);
            cen = 0.30; pit = 0.35; zcr = 0.34;
          }
          return { vol: Math.max(0, vol), cen, pit, zcr, playing: T > 1.05 && T < 15.4 };
        }

        // A gentle self-driven breath for visitors with no microphone: slow
        // swells with a soft attack, so the piece still opens flowers.
        function demoSong(t) {
          const s = 0.5 + 0.5 * Math.sin(t * 0.42);
          const s2 = 0.5 + 0.5 * Math.sin(t * 0.17 + 1.3);
          const vol = 0.10 + 0.26 * Math.pow(s, 1.6) * (0.5 + 0.5 * s2);
          return {
            vol,
            cen: 0.30 + 0.22 * s2,
            pit: 0.34 + 0.24 * s,
            zcr: 0.24 + 0.14 * (1 - s),
            playing: true,
          };
        }

        function micFeatures(dt) {
          const an = aud.analyser;
          an.getFloatTimeDomainData(aud.timeData);
          const N = aud.timeData.length;
          let sum = 0;
          let zc = 0;
          let prev = aud.timeData[0];
          for (let i = 1; i < N; i++) {
            const v = aud.timeData[i];
            sum += v * v;
            if ((v >= 0) !== (prev >= 0)) zc++;
            prev = v;
          }
          const rms = Math.sqrt(sum / N);
          const zcrRaw = Math.min(1, (zc / N) * 2.4);
          an.getByteFrequencyData(aud.freqData);
          const bins = aud.freqData.length;
          const binHz = (aud.ctx ? aud.ctx.sampleRate : 48000) / (2 * bins);
          let msum = 0;
          let mw = 0;
          let peak = 0;
          let peakBin = 0;
          const lo = Math.max(1, Math.floor(70 / binHz));
          const hi = Math.min(bins - 1, Math.ceil(1200 / binHz));
          for (let i = 0; i < bins; i++) {
            const v = aud.freqData[i];
            msum += v;
            mw += v * i;
            if (i >= lo && i <= hi && v > peak) { peak = v; peakBin = i; }
          }
          const cenRaw = msum > 4 ? (mw / msum) / (bins * 0.5) : 0;
          // dominant pitch → a log-scale 0..1 (80Hz..1200Hz)
          const f0 = peakBin * binHz;
          const pitRaw = peak > 24 && f0 > 60
            ? Math.min(1, Math.max(0, Math.log2(f0 / 80) / Math.log2(1200 / 80)))
            : aud.pitS;
          const k = (tc) => 1 - Math.exp(-Math.max(dt, 1e-4) / tc);
          aud.rmsF += (rms - aud.rmsF) * k(0.05);
          aud.rmsS += (rms - aud.rmsS) * k(1.8);
          aud.cen += (cenRaw - aud.cen) * k(0.20);
          aud.zcr += (zcrRaw - aud.zcr) * k(0.20);
          aud.pitF += (pitRaw - aud.pitF) * k(0.06);
          aud.pitS += (pitRaw - aud.pitS) * k(0.9);
          aud.level = aud.rmsF;
          // sensitivity: a lower reference makes a quiet room fill with flowers
          const ref = 0.030 + 0.190 * (1 - state.micGain);
          meters.rms = Math.min(1, aud.rmsF / ref);
          meters.sus = Math.min(1, aud.rmsS / (ref * 0.95));
          meters.cen = Math.min(1, aud.cen * 1.15);
          meters.zcr = aud.zcr;
          meters.pitch = aud.pitF;
          meters.vib = Math.min(1, Math.abs(aud.pitF - aud.pitS) * 9);
          // onset (string attack / consonant): the fast RMS crossing a threshold
          // above the slow one, with hysteresis and a refractory period
          aud.refr = Math.max(0, aud.refr - dt);
          const thHi = aud.rmsS * 1.75 + 0.008 * (1.4 - state.micGain);
          const thLo = aud.rmsS * 1.12 + 0.003;
          if (aud.armed && aud.refr <= 0 && aud.rmsF > thHi && aud.rmsF > 0.006) {
            aud.armed = false;
            aud.refr = 0.13;
            meters.onset = Math.min(1, 0.55 + meters.rms * 0.7);
          } else if (!aud.armed && aud.rmsF < thLo) {
            aud.armed = true;
          }
        }

        function scriptedFeatures(dt, song, onsetPeriod, seedBase) {
          const k = (tc) => 1 - Math.exp(-Math.max(dt, 1e-4) / tc);
          aud.rmsF += (song.vol - aud.rmsF) * k(0.06);
          aud.rmsS += (song.vol - aud.rmsS) * k(1.6);
          aud.cen += (song.cen - aud.cen) * k(0.25);
          aud.zcr += (song.zcr - aud.zcr) * k(0.25);
          aud.pitF += (song.pit - aud.pitF) * k(0.08);
          aud.pitS += (song.pit - aud.pitS) * k(0.9);
          aud.level = aud.rmsF;
          meters.rms = Math.min(1, aud.rmsF / 0.55);
          meters.sus = Math.min(1, aud.rmsS / 0.30);
          meters.cen = aud.cen;
          meters.zcr = aud.zcr;
          meters.pitch = aud.pitF;
          meters.vib = Math.min(1, Math.abs(aud.pitF - aud.pitS) * 7);
          // strums on a fixed grid (deterministic; frozen art clock = no onsets)
          if (song.playing) {
            while (seedBase.next <= animTime) {
              meters.onset = Math.min(1, 0.5 + meters.rms * 0.8);
              seedBase.next += onsetPeriod;
            }
          } else {
            seedBase.next = Math.max(seedBase.next, animTime + onsetPeriod);
          }
        }

        const fakeClock = { next: 1.2 };
        const demoClock = { next: 1.4 };

        function updateAudio(dt) {
          // ?freeze=1: hold every meter exactly. The flower head breathes with
          // the loudness, so letting the EMAs creep at dt=0 would make a frozen
          // frame drift (the determinism check would catch it eventually — this
          // makes it bit-exact by construction).
          if (dt <= 0) return;
          if (aud.mode === "mic" && aud.analyser) {
            micFeatures(dt);
          } else if (aud.mode === "fake") {
            scriptedFeatures(dt, fakeSong(animTime), 0.52, fakeClock);
          } else {
            const song = demoSong(animTime);
            scriptedFeatures(dt, song, 1.7, demoClock);
            // the demo breath must stay gentle: it is a holding pattern
            meters.rms *= 0.85;
            meters.sus *= 0.9;
          }
          // the attack is consumed as a short envelope by every shader
          meters.onset *= Math.exp(-dt * 5.5);
          // 楽章: the song's accumulated arc. It rises while there is real
          // singing and falls back in silence, and it biases hue, shedding and
          // the density of the field — the piece has a beginning and an end.
          const drive = meters.sus * 0.75 + meters.rms * 0.35;
          arc += dt * (drive - 0.16) * 0.085;
          arc = Math.max(0, Math.min(1, arc));
        }

        let micStarted = false;
        async function startMic() {
          if (FAKE || micStarted) return;
          micStarted = true;
          if (!window.isSecureContext ||
              !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            aud.err = "非対応";
            micStarted = false;
            return;
          }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            if (!stream.getAudioTracks || stream.getAudioTracks().length === 0) {
              throw new Error("no audio track");
            }
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!aud.ctx) aud.ctx = new Ctx();
            try { await aud.ctx.resume(); } catch (_e) { /* needs a gesture */ }
            const src = aud.ctx.createMediaStreamSource(stream);
            aud.analyser = aud.ctx.createAnalyser();
            aud.analyser.fftSize = 2048;
            aud.analyser.smoothingTimeConstant = 0;
            src.connect(aud.analyser);
            aud.stream = stream;
            aud.timeData = new Float32Array(aud.analyser.fftSize);
            aud.freqData = new Uint8Array(aud.analyser.frequencyBinCount);
            aud.mode = "mic";
            aud.err = "";
          } catch (error) {
            // A missing microphone is never fatal: the demo breath keeps the
            // piece alive and the panel offers a retry.
            aud.analyser = null;
            aud.mode = "demo";
            micStarted = false;
            const name = error && error.name ? error.name : "";
            aud.err = name === "NotAllowedError" ? "許可なし"
              : (name === "NotFoundError" ? "見つからない" : "使用不可");
          }
        }

        function stopMic() {
          if (aud.stream) {
            aud.stream.getTracks().forEach((t) => t.stop());
            aud.stream = null;
          }
          aud.analyser = null;
          if (aud.mode === "mic") aud.mode = "demo";
        }

        document.getElementById("micRetry").addEventListener("click", () => {
          stopMic();
          micStarted = false;
          aud.err = "";
          startMic();
        });
        // browsers suspend a fresh AudioContext until a user gesture
        const resumeAudio = () => {
          if (aud.ctx && aud.ctx.state === "suspended") aud.ctx.resume();
          if (!FAKE && !micStarted && aud.mode !== "mic") startMic();
        };
        window.addEventListener("pointerdown", resumeAudio, { passive: true });
        window.addEventListener("keydown", resumeAudio);

        /* ------------------------------------------------------------------
           Simulation + present
        ------------------------------------------------------------------ */

        let stream = null;
        let cameraReady = false;
        let animTime = 0;
        let seedCounter = 0;
        let lastNow = performance.now();
        let fpsLast = performance.now();
        let fpsFrames = 0;
        let scenePing = false, motPing = false, delayPing = false;
        let haveVideo = false;
        let readyStamped = false;
        let poolsReady = false;
        let prewarmLeft = Math.min(480, Math.round(PREWARM / PREWARM_DT));

        const readout = document.getElementById("readout");
        const levelBar = document.getElementById("levelBar");

        function uploadVideoFrame() {
          if (
            cameraReady &&
            video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
            video.videoWidth > 0 && video.videoHeight > 0
          ) {
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
            return true;
          }
          return false;
        }

        // The synthetic figure for ?fakesource=1 (there is no detection here).
        function updateDetection(dt) {
          if (FAKE) {
            det.tcx = 0.5 + 0.075 * Math.sin(animTime * 0.42);
            det.tcy = 0.022 * Math.sin(animTime * 0.71 + 1.0);
            det.swing = Math.sin(animTime * 1.25);
          }
          const k = FREEZE ? 0 : 1 - Math.exp(-dt * 6);
          det.cx += (det.tcx - det.cx) * k;
          det.cy += (det.tcy - det.cy) * k;
        }

        // 「フラクタル=(統合)愛」が露わになる一点。A loud sustained passage late in
        // the song opens the reveal; it decays on its own and cannot retrigger
        // for a while, so it happens ONCE in a stretch rather than pulsing.
        let reveal = 0;
        let revealLock = 0;
        function updateReveal(dt) {
          revealLock = Math.max(0, revealLock - dt);
          const want = meters.sus > 0.55 && arc > 0.45 && meters.onset > 0.25;
          if (want && revealLock <= 0 && reveal < 0.02) {
            reveal = 1;
            revealLock = 14;
          }
          reveal = Math.max(0, reveal - dt / 3.2);
        }

        function pushAudio(u) {
          gl.uniform4f(u.uAudA, meters.rms, meters.cen, meters.zcr, meters.onset);
          gl.uniform4f(u.uAudB, meters.sus, meters.pitch, meters.vib, arc);
        }

        // One simulation step: every pass except the final composite. Called once
        // per frame, or repeatedly with a fixed dt while ?prewarm= fast-forwards.
        function stepSim(dt) {
          const doReset = needsReset;
          needsReset = false;
          if (doReset) clearSimTargets();
          if (!poolsReady || doReset) {
            resetPools();
            poolsReady = true;
          }

          const aspect = canvas.width / Math.max(canvas.height, 1);
          seedCounter = (seedCounter + 1) % 65536;
          const seed = dt > 0 ? seedCounter * 0.017 + 0.31 : 0.31;
          const fieldTexel = [1 / fieldW, 1 / fieldH];

          const sceneCur = scenePing ? targets.sceneA : targets.sceneB;
          const scenePrev = scenePing ? targets.sceneB : targets.sceneA;
          const motOut = motPing ? targets.motA : targets.motB;
          const motPrev = motPing ? targets.motB : targets.motA;
          const delayOut = delayPing ? targets.delayA : targets.delayB;
          const delayPrev = delayPing ? targets.delayB : targets.delayA;
          const foamSrc = foamPing ? foamSets[1] : foamSets[0];
          const foamDst = foamPing ? foamSets[0] : foamSets[1];

          // P0 — scene (camera cover-fit / synthetic room)
          renderPass(sceneCur, programs.scene, () => {
            const u = locations.scene;
            bindTexture(0, videoTexture);
            gl.uniform1i(u.uVideo, 0);
            gl.uniform2f(u.uResolution, paintW, paintH);
            gl.uniform2f(u.uVideoSize,
              Math.max(1, video.videoWidth), Math.max(1, video.videoHeight));
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uCx, det.cx);
            gl.uniform1f(u.uCy, det.cy);
            gl.uniform1f(u.uSwing, det.swing);
            gl.uniform1f(u.uScale, FAKESCALE);
            gl.uniform1i(u.uMirror, state.mirror ? 1 : 0);
            gl.uniform1i(u.uFake, FAKE ? 1 : 0);
            gl.uniform1i(u.uHasVideo, haveVideo ? 1 : 0);
          });

          // P1 — motion + stillness age
          renderPass(motOut, programs.motion, () => {
            const u = locations.motion;
            bindTexture(0, sceneCur.tex);
            bindTexture(1, scenePrev.tex);
            bindTexture(2, motPrev.tex);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uScenePrev, 1);
            gl.uniform1i(u.uPrev, 2);
            gl.uniform2f(u.uTexel, fieldTexel[0], fieldTexel[1]);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uAlphaMot, 1 - Math.exp(-Math.max(dt, 1e-4) * 6.0));
            gl.uniform1i(u.uReset, doReset ? 1 : 0);
          });

          // P2 — soften the motion field: the delay must never show a boundary
          blurPass(motOut, targets.softTmp, targets.softT, 3.0, 2);

          // P3 — push a frame into the ring at a FIXED cadence
          histAcc += dt;
          const histStep = 1 / HIST_HZ;
          let pushes = 0;
          while (histAcc >= histStep && pushes < 4) {
            histAcc -= histStep;
            histWrite = (histWrite + 1) % HIST_N;
            pushHistory(sceneCur.tex);
            pushes++;
          }
          if (doReset) {
            // fill the whole ring with the present so the first frames are not
            // a stack of black (which would read as a broken picture, not as age)
            for (let k = 0; k < HIST_N; k++) {
              histWrite = (histWrite + 1) % HIST_N;
              pushHistory(sceneCur.tex);
            }
          }

          // P4 — the delay field
          renderPass(delayOut, programs.delay, () => {
            const u = locations.delay;
            bindTexture(0, delayPrev.tex);
            bindTexture(1, targets.softT.tex);
            bindTexture(2, motOut.tex);
            gl.uniform1i(u.uPrev, 0);
            gl.uniform1i(u.uMotion, 1);
            gl.uniform1i(u.uMotionRaw, 2);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uMaxDelay, MAX_DELAY);
            gl.uniform1f(u.uDepth, state.depth);
            gl.uniform1f(u.uConverge, state.converge);
            gl.uniform1f(u.uGrain, state.grain);
            gl.uniform1f(u.uParcel, state.parcel);
            gl.uniform1f(u.uReveal, reveal);
            gl.uniform1f(u.uSeed, 0.37);
            gl.uniform1i(u.uReset, doReset ? 1 : 0);
            pushAudio(u);
          });

          // P5 — the foam
          gl.bindFramebuffer(gl.FRAMEBUFFER, foamDst.fbo);
          gl.viewport(0, 0, foamDst.width, foamDst.height);
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
          gl.useProgram(programs.foam);
          {
            const u = locations.foam;
            bindTexture(0, foamSrc.texA);
            bindTexture(1, foamSrc.texB);
            bindTexture(2, delayOut.tex);
            bindTexture(3, targets.softT.tex);
            gl.uniform1i(u.uStateA, 0);
            gl.uniform1i(u.uStateB, 1);
            bindTexture(4, sceneCur.tex);
            bindHistory(5);
            gl.uniform1i(u.uDelay, 2);
            gl.uniform1i(u.uMotion, 3);
            gl.uniform1i(u.uScene, 4);
            gl.uniform1i(u.uHist, 5);
            gl.uniform1f(u.uHistHz, HIST_HZ);
            gl.uniform1f(u.uHistN, HIST_N);
            gl.uniform1f(u.uWrite, histWrite);
            gl.uniform1f(u.uMaxDelay, MAX_DELAY);
            gl.uniform1f(u.uTexW, FOAM_W);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uSeed, seed);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uFoam, state.foam);
            gl.uniform1f(u.uReveal, reveal);
            pushAudio(u);
          }
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          // P6 — the layer: 石楠花 first (behind), then the foam over it
          gl.bindFramebuffer(gl.FRAMEBUFFER, targets.layer.fbo);
          gl.viewport(0, 0, targets.layer.width, targets.layer.height);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.enable(gl.BLEND);
          gl.blendEquation(gl.FUNC_ADD);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // premultiplied over

          gl.useProgram(programs.truss);
          {
            const u = locations.truss;
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform1f(u.uTruss, state.truss);
            gl.uniform1f(u.uReveal, reveal);
            gl.uniform4f(u.uAudA, meters.rms, meters.cen, meters.zcr, meters.onset);
            gl.uniform4f(u.uAudB, meters.sus, meters.pitch, meters.vib, arc);
          }
          gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, TRUSS_N * TRUSS_PER);

          gl.useProgram(programs.foamDraw);
          {
            const u = locations.foamDraw;
            bindTexture(0, foamDst.texA);
            bindTexture(1, foamDst.texB);
            gl.uniform1i(u.uStateA, 0);
            gl.uniform1i(u.uStateB, 1);
            gl.uniform1f(u.uTexW, FOAM_W);
            gl.uniform1f(u.uAspect, aspect);
            // a bubble is made of the light it took, so it reads the history
            bindHistory(2);
            bindTexture(3, delayOut.tex);
            gl.uniform1i(u.uHist, 2);
            gl.uniform1i(u.uDelay, 3);
            gl.uniform1f(u.uHistHz, HIST_HZ);
            gl.uniform1f(u.uHistN, HIST_N);
            gl.uniform1f(u.uWrite, histWrite);
            gl.uniform1f(u.uMaxDelay, MAX_DELAY);
          }
          gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, FOAM_N);
          gl.disable(gl.BLEND);

          // P7 — bloom: the film colour is the only thing allowed to glow
          renderPass(targets.b1Src, programs.bright, () => {
            bindTexture(0, targets.layer.tex);
            gl.uniform1i(locations.bright.uSrc, 0);
            gl.uniform1f(locations.bright.uThreshold, 0.45);
          });
          blurPass(targets.b1Src, targets.b1Tmp, targets.b1, 2.4, 1);
          blurPass(targets.b1, targets.b2Tmp, targets.b2, 2.6, 2);

          scenePing = !scenePing;
          motPing = !motPing;
          delayPing = !delayPing;
          foamPing = !foamPing;
        }

        // P8 — composite to the canvas.
        function present() {
          const aspect = canvas.width / Math.max(canvas.height, 1);
          const sceneCur = scenePing ? targets.sceneB : targets.sceneA;
          const motCur = motPing ? targets.motB : targets.motA;
          const delayCur = delayPing ? targets.delayB : targets.delayA;
          renderPass(null, programs.composite, () => {
            const u = locations.composite;
            bindTexture(0, sceneCur.tex);
            bindTexture(2, delayCur.tex);
            bindTexture(3, motCur.tex);
            bindTexture(4, targets.layer.tex);
            bindTexture(5, targets.b1.tex);
            bindTexture(6, targets.b2.tex);
            bindHistory(1);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uHist, 1);
            gl.uniform1i(u.uDelay, 2);
            gl.uniform1i(u.uMotion, 3);
            gl.uniform1i(u.uLayer, 4);
            gl.uniform1i(u.uB1, 5);
            gl.uniform1i(u.uB2, 6);
            gl.uniform2f(u.uResolution, canvas.width, canvas.height);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform1f(u.uExposure, state.exposure);
            gl.uniform1f(u.uFilmGrain, state.filmGrain);
            gl.uniform1f(u.uRain, state.rain);
            gl.uniform1f(u.uReveal, reveal);
            gl.uniform1f(u.uHistHz, HIST_HZ);
            gl.uniform1f(u.uHistN, HIST_N);
            gl.uniform1f(u.uWrite, histWrite);
            gl.uniform1f(u.uMaxDelay, MAX_DELAY * (histFill / HIST_N));
            pushAudio(u);
            gl.uniform1i(u.uDebug, state.debugView);
          });
        }

        function sourceLabel() {
          if (FAKE) return "合成";
          if (aud.mode === "mic") return "マイク";
          if (aud.err) return `マイク不可(${aud.err})`;
          return "自走";
        }

        function updateChip() {
          statusChip.textContent = FAKE
            ? "入力 · 合成 (fakesource=1)"
            : `音 · ${sourceLabel()}`;
          statusChip.classList.toggle(
            "hidden", FAKE ? performance.now() - bootWall > 4000 : false);
        }

        function frame(now) {
          resize();

          const rawDt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
          lastNow = now;
          const dt = FREEZE ? 0 : rawDt;

          haveVideo = FAKE ? false : uploadVideoFrame();
          const hasInput = FAKE || haveVideo || cameraReady;

          if (!state.pauseAnim) animTime += dt;
          updateAudio(dt);
          updateDetection(dt);
          if (!FREEZE) updateReveal(dt);

          // ?prewarm=<sec>: deterministic fast-forward before __artReady, spread
          // over several rAF frames and synced with a 1x1 readPixels so the
          // preroll never parks the compositor for tens of seconds — under
          // swiftshader a single blocking preroll stalls everything (CRAFT §C4).
          if (prewarmLeft > 0) {
            const n = Math.min(12, prewarmLeft);
            for (let i = 0; i < n; i++) {
              if (!state.pauseAnim) animTime += PREWARM_DT;
              updateAudio(PREWARM_DT);
              updateDetection(PREWARM_DT);
              updateReveal(PREWARM_DT);
              stepSim(PREWARM_DT);
            }
            prewarmLeft -= n;
            glSync();
          }

          stepSim(dt);
          present();

          if (!readyStamped && hasInput && prewarmLeft <= 0) {
            glSync();               // the first REAL frame has completed
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            readout.textContent = `FPS ${fps.toFixed(0)} / 解像度 ${canvas.width}×${
              canvas.height} / 履歴 ${HIST_N}層@${HIST_HZ}Hz(最大${
              MAX_DELAY.toFixed(1)}秒) / 泡 ${FOAM_N.toLocaleString()} / 音 ${
              sourceLabel()} / 楽章 ${arc.toFixed(2)}`;
            levelBar.style.width = `${Math.round(Math.min(1, meters.rms) * 100)}%`;
            updateChip();
          }

          requestAnimationFrame(frame);
        }

        /* ------------------------------------------------------------------
           Camera + boot. With ?fakesource=1 the synthetic scene and the scripted
           song drive the pipeline and neither MediaPipe nor the microphone is
           touched, but getUserMedia still runs so the three camera error paths
           stay observable.
        ------------------------------------------------------------------ */

        async function startCamera() {
          stopCamera();
          cameraReady = false;
          retryCamera.disabled = true;
          setOverlay("requesting", "REQUESTING CAMERA",
            "Please allow webcam access. If this is not localhost or HTTPS, the camera API will be blocked.");

          if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost" &&
            location.hostname !== "127.0.0.1" &&
            location.hostname !== "[::1]"
          ) {
            setOverlay("error", "SECURE CONTEXT REQUIRED",
              "Serve the file from localhost (for example: python3 -m http.server 8899) or HTTPS, then reload.");
            retryCamera.disabled = false;
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setOverlay("error", "CAMERA API UNAVAILABLE",
              "This browser does not expose getUserMedia. Try a modern browser over localhost or HTTPS.");
            retryCamera.disabled = false;
            return;
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: state.facingMode,
                width: { ideal: 1280 }, height: { ideal: 720 },
              },
              audio: false,
            });
            video.srcObject = stream;
            await video.play();
            cameraReady = true;
            retryCamera.disabled = false;
            needsReset = true;
            setOverlay("hidden", "", "");
            if (!FAKE) {
              startMic();     // the microphone is opened separately (never fatal)
            }
          } catch (error) {
            retryCamera.disabled = false;
            const name = error && error.name ? error.name : "";
            if (name === "NotAllowedError" || name === "SecurityError") {
              setOverlay("error", "PERMISSION DENIED",
                "Camera access was denied. Enable camera permission for this site, then retry.",
                { retryCamera: true });
            } else if (name === "NotFoundError" || name === "OverconstrainedError") {
              setOverlay("error", "NO CAMERA FOUND",
                "No usable webcam was found. Connect a camera or release it from another app, then retry.",
                { retryCamera: true });
            } else {
              setOverlay("error", "CAMERA ERROR",
                `${name || "Unknown error"}. Check browser permissions and retry.`,
                { retryCamera: true });
            }
          }
        }

        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        retryCamera.addEventListener("click", () => { startCamera(); });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });
        window.addEventListener("beforeunload", () => { stopCamera(); stopMic(); });

        const bootWall = performance.now();

        try {
          resize();

          // startCamera() runs in every mode. Under ?fakesource=1 the synthetic
          // scene drives the whole pipeline regardless of the camera (the video
          // texture is never sampled, MediaPipe and the mic stay untouched), so
          // the camera is only exercised to keep the three error overlays
          // observable: on success the overlay hides and the fake art shows; on
          // denial / no-camera the matching error overlay appears over the
          // still-rendering art.
          startCamera();
          requestAnimationFrame(frame);
        } catch (error) {
          setOverlay("error", "WEBGL SETUP ERROR",
            error && error.message ? error.message : "Could not initialize the renderer.");
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
