<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Iwashi Particle - WebGL2 Bait Ball</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #00111f;
        color: #eafbff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        cursor: crosshair;
        background: #00111f;
        touch-action: none;
      }
      #readme {
        position: fixed;
        left: 14px;
        top: 12px;
        max-width: min(560px, calc(100vw - 330px));
        padding: 12px 14px;
        border: 1px solid rgba(158, 219, 255, 0.22);
        border-radius: 12px;
        background: linear-gradient(
          180deg,
          rgba(3, 22, 39, 0.78),
          rgba(2, 12, 24, 0.42)
        );
        color: rgba(231, 248, 255, 0.92);
        font-size: 12px;
        line-height: 1.55;
        backdrop-filter: blur(10px);
        pointer-events: none;
        user-select: none;
      }
      #readme strong {
        color: #fff;
      }
      #readme kbd {
        padding: 1px 5px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
      }
      #controlsToggle {
        position: fixed;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 4;
        display: none;
        min-width: 104px;
        padding: 10px 13px;
        border-radius: 999px;
        background: rgba(4, 24, 43, 0.78);
        backdrop-filter: blur(12px);
        transition: bottom 0.24s ease;
      }
      #controlsToggle.controls-toggle-open {
        bottom: calc(45vh + 20px + env(safe-area-inset-bottom));
      }
      #controls {
        position: fixed;
        right: 14px;
        top: 12px;
        z-index: 2;
        width: 286px;
        max-height: calc(100vh - 28px);
        overflow: auto;
        padding: 13px 14px 14px;
        border: 1px solid rgba(150, 218, 255, 0.22);
        border-radius: 14px;
        background: linear-gradient(
          180deg,
          rgba(4, 24, 43, 0.84),
          rgba(1, 10, 22, 0.6)
        );
        box-shadow: 0 14px 60px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(12px);
        user-select: none;
      }
      #controls h1 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #d8f5ff;
      }
      .row {
        margin: 10px 0;
      }
      .label-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 5px;
        font-size: 11px;
        color: rgba(224, 245, 255, 0.86);
      }
      .value {
        color: #fff;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #8fe8ff;
      }
      .button-line {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        border: 1px solid rgba(172, 230, 255, 0.28);
        border-radius: 9px;
        padding: 8px 9px;
        color: #ecfbff;
        background: rgba(117, 205, 255, 0.12);
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: rgba(117, 205, 255, 0.22);
      }
      #status {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.11);
        color: rgba(218, 242, 255, 0.78);
        font-size: 11px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
      }
      #notice {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        max-width: min(760px, calc(100vw - 28px));
        padding: 10px 14px;
        border-radius: 999px;
        color: #effbff;
        background: rgba(1, 15, 28, 0.72);
        border: 1px solid rgba(159, 225, 255, 0.24);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
        white-space: nowrap;
      }
      #notice.show {
        opacity: 1;
      }
      .hidden {
        display: none;
      }
      @media (max-width: 760px) {
        #readme {
          display: none;
        }
        #controlsToggle {
          display: block;
        }
        #controls {
          left: 10px;
          right: 10px;
          bottom: calc(10px + env(safe-area-inset-bottom));
          top: auto;
          width: auto;
          max-height: 45vh;
          transition:
            transform 0.24s ease,
            opacity 0.24s ease;
        }
        #controls.controls-collapsed {
          transform: translateY(
            calc(100% + 18px + env(safe-area-inset-bottom))
          );
          opacity: 0;
          pointer-events: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
README / 操作方法
- WebGL2 + EXT_color_buffer_float 対応ブラウザでこの単一 HTML を開いてください。
- マウスカーソルが捕食者です。群れに重ねると穴が空き、ベイトボールが割れて流れます。
- 右上 GUI で個体数、Boids 重み、渦力、ノイズ、捕食者、フォグ、カメラを調整できます。
- Space: 一時停止 / 再開、R: リセット、H: 説明表示切替。
実装メモ:
- 位置(xyz) と速度(xyz) を RGBA32F テクスチャに格納し、fragment shader で更新する GPGPU ping-pong 方式。
- Boids 近傍は固定本数の hashed sparse sampling で候補を読み、O(n^2) を避ける軽量版です。
- 描画は drawArraysInstanced。頂点シェーダで位置/速度を vertex texture fetch し、進行方向へ姿勢を合わせます。
- 捕食者座標は inverse(projection * view) による unproject でワールド平面へ投影します。
-->
    <canvas id="gl"></canvas>
    <button
      id="controlsToggle"
      type="button"
      aria-controls="controls"
      aria-expanded="true"
    >
      Controls
    </button>
    <div id="readme">
      <strong>WebGL2 Iwashi Bait Ball</strong><br />GPU ping-pong Boids
      によるイワシ玉。マウス/タッチ = 捕食者。<br />近づけると群れが裂け、離すと
      Cohesion + Vortex で再形成します。<br /><kbd>Space</kbd> 一時停止 /
      <kbd>R</kbd> リセット / <kbd>H</kbd> 説明表示切替
    </div>
    <div id="controls"><h1>Iwashi controls</h1></div>
    <div id="notice"></div>
    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("gl");
        const controls = document.getElementById("controls");
        const controlsToggle = document.getElementById("controlsToggle");
        const noticeEl = document.getElementById("notice");
        const readmeEl = document.getElementById("readme");
        const statusEl = document.createElement("div");

        const params = {
          fishCount: 20000,
          maxSpeed: 2.65,
          separation: 1.55,
          alignment: 0.78,
          cohesion: 0.32,
          vortex: 3.08,
          noise: 1.3,
          predatorStrength: 28,
          predatorRadius: 7.0,
          fogDensity: 0.01,
          cameraSpeed: 0.34,
          paused: false,
        };

        const gl = canvas.getContext("webgl2", {
          alpha: false,
          antialias: false,
          depth: true,
          stencil: false,
          powerPreference: "high-performance",
        });

        if (!gl)
          return fatal(
            "WebGL2 が利用できません。WebGL2 対応ブラウザで開いてください。",
          );
        if (!gl.getExtension("EXT_color_buffer_float"))
          return fatal(
            "EXT_color_buffer_float が利用できません。浮動小数点レンダーターゲットが必要です。",
          );
        gl.getExtension("OES_texture_float_linear");

        const fullscreenVS = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p=vec2((gl_VertexID==2)?3.0:-1.0,(gl_VertexID==1)?3.0:-1.0);
  vUv=p*.5+.5;
  gl_Position=vec4(p,0.0,1.0);
}`;

        const simFS = `#version 300 es
precision highp float;
precision highp int;
layout(location=0) out vec4 outPosition;
layout(location=1) out vec4 outVelocity;
uniform sampler2D uPositionTex,uVelocityTex;
uniform ivec2 uTexSize;
uniform int uFishCount,uFrameMod;
uniform float uDelta,uTime,uMaxSpeed,uMaxAccel;
uniform float uSeparationWeight,uAlignmentWeight,uCohesionWeight,uVortexWeight,uNoiseWeight;
uniform vec3 uPredatorPos;
uniform float uPredatorRadius,uPredatorStrength,uPredatorActive,uBoundsRadius;
const int NEIGHBOR_SAMPLES=52;
vec3 safeNormalize(vec3 v){float l=length(v);return l>1e-5?v/l:vec3(0.0);}
vec3 limitVec(vec3 v,float m){float l=length(v);return (l>m&&l>1e-5)?v*(m/l):v;}
vec3 curlField(vec3 p,float t){
  vec3 q=p*.34;
  vec3 c=vec3(
    sin(q.y*2.13+t*.41)-cos(q.z*1.71-t*.37),
    sin(q.z*1.91-t*.29)-cos(q.x*2.27+t*.31),
    sin(q.x*1.83+t*.23)-cos(q.y*2.01-t*.43)
  );
  return safeNormalize(c);
}
void main(){
  ivec2 coord=ivec2(gl_FragCoord.xy);
  int id=coord.y*uTexSize.x+coord.x;
  vec4 posData=texelFetch(uPositionTex,coord,0);
  vec4 velData=texelFetch(uVelocityTex,coord,0);
  if(id>=uFishCount){outPosition=posData;outVelocity=velData;return;}

  vec3 pos=posData.xyz;
  vec3 vel=velData.xyz;
  float seed=posData.w;
  vec3 center=vec3(sin(uTime*.13)*.78,sin(uTime*.17)*.45,cos(uTime*.11)*.62);

  vec3 separation=vec3(0.0),alignment=vec3(0.0),cohesion=vec3(0.0);
  int neighborCount=0,separationCount=0;
  float neighborRadius=2.85,separationRadius=.68;

  for(int i=0;i<NEIGHBOR_SAMPLES;++i){
    int sampleId;
    if(i<20){
      int delta=(i-10)*31;
      sampleId=(id+delta+uFishCount)%uFishCount;
    }else{
      int offset=(i*977+uFrameMod*37+int(seed*997.0))%uFishCount;
      sampleId=(id*73+offset*19+17)%uFishCount;
    }
    if(sampleId==id) continue;
    ivec2 sc=ivec2(sampleId%uTexSize.x,sampleId/uTexSize.x);
    vec3 npos=texelFetch(uPositionTex,sc,0).xyz;
    vec3 nvel=texelFetch(uVelocityTex,sc,0).xyz;
    vec3 diff=npos-pos;
    float d=length(diff);
    if(d>.0001&&d<neighborRadius){
      alignment+=safeNormalize(nvel);
      cohesion+=npos;
      neighborCount++;
      if(d<separationRadius){
        float falloff=1.0-d/separationRadius;
        separation-=diff*(falloff/max(d*d,.004));
        separationCount++;
      }
    }
  }

  vec3 accel=vec3(0.0);
  if(neighborCount>0){
    float invN=1.0/float(neighborCount);
    vec3 desiredAlign=safeNormalize(alignment*invN)*uMaxSpeed;
    vec3 desiredCohesion=safeNormalize(cohesion*invN-pos)*uMaxSpeed;
    accel+=limitVec(desiredAlign-vel,uMaxAccel)*uAlignmentWeight;
    accel+=limitVec(desiredCohesion-vel,uMaxAccel)*uCohesionWeight;
  }
  if(separationCount>0){
    vec3 desiredSeparation=safeNormalize(separation)*uMaxSpeed;
    accel+=limitVec(desiredSeparation-vel,uMaxAccel)*uSeparationWeight;
  }

  vec3 fromCenter=pos-center;
  float distCenter=length(fromCenter);
  vec3 radial=safeNormalize(fromCenter);
  vec3 vortexAxis=safeNormalize(vec3(.12*sin(uTime*.13),1.0,.16*cos(uTime*.11)));
  vec3 tangent=safeNormalize(cross(vortexAxis,radial));
  // poloidal (over-the-pole) direction keeps circulation spherical instead of a flat ring
  vec3 poloidal=safeNormalize(cross(tangent,radial));
  float shell=smoothstep(0.0,uBoundsRadius,distCenter);
  accel+=tangent*uVortexWeight*(.5+shell*.5);
  accel+=poloidal*uVortexWeight*(.42*sin(uTime*.27+seed*6.2831853));
  // gentle inward pull so the cloud holds a rounded ball rather than spreading into a disc
  accel+=-radial*max(distCenter-uBoundsRadius*.62,0.0)*.42;
  accel+=curlField(pos+seed*12.7,uTime)*uNoiseWeight;

  if(distCenter>uBoundsRadius) accel+=-radial*(distCenter-uBoundsRadius)*1.55;
  if(distCenter<0.85) accel+=radial*(0.85-distCenter)*.02;

  if(uPredatorActive>.5){
    vec3 awayVec=pos-uPredatorPos;
    float pd=length(awayVec);
    if(pd<uPredatorRadius){
      vec3 away=safeNormalize(awayVec);
      float q=1.0-pd/uPredatorRadius;
      vec3 shear=safeNormalize(cross(away,safeNormalize(vec3(.2,1.0,.1))));
      accel+=away*(uPredatorStrength*q*q/max(pd,.085));
      accel+=shear*(uPredatorStrength*.22*q);
    }
  }

  accel+=vec3(0.0,sin(seed*31.7+uTime*1.3)*.018,0.0);
  accel=limitVec(accel,uMaxAccel);
  vel+=accel*uDelta;
  float speed=length(vel);
  if(speed>uMaxSpeed) vel*=uMaxSpeed/speed;
  else if(speed<uMaxSpeed*.28) vel=safeNormalize(vel+curlField(pos*.51,uTime+seed))*(uMaxSpeed*.28);

  pos+=vel*uDelta;
  vec3 afterCenter=pos-center;
  float afterDist=length(afterCenter);
  if(afterDist>uBoundsRadius*1.9){
    pos=center+safeNormalize(afterCenter)*(uBoundsRadius*1.9);
    vel+=safeNormalize(center-pos)*(uMaxSpeed*.28);
  }

  outPosition=vec4(pos,seed);
  outVelocity=vec4(vel,velData.w);
}`;

        const bgFS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform float uTime;
uniform vec2 uResolution;
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
void main(){
  vec2 uv=vUv;
  vec3 top=vec3(.035,.30,.55),mid=vec3(.01,.11,.24),bottom=vec3(0.0,.018,.055);
  vec3 col=mix(bottom,mid,smoothstep(0.0,.62,uv.y));
  col=mix(col,top,smoothstep(.48,1.0,uv.y));
  vec2 source=vec2(.48+sin(uTime*.035)*.06,1.18);
  vec2 d=uv-source;
  float ang=atan(d.y,d.x);
  float rays=0.0;
  rays+=pow(max(0.0,.5+.5*sin(ang*18.0+uTime*.22)),18.0);
  rays+=pow(max(0.0,.5+.5*sin(ang*29.0-uTime*.16)),24.0)*.65;
  rays*=smoothstep(1.0,.18,length(d))*smoothstep(.2,1.0,uv.y);
  col+=vec3(.16,.42,.62)*rays*.36;
  float n=hash21(floor((uv*uResolution)/3.0));
  col+=(n-.5)*.008;
  outColor=vec4(col,1.0);
}`;

        const fishVS = `#version 300 es
precision highp float;
precision highp int;
layout(location=0) in vec3 aPosition;
layout(location=1) in vec3 aNormal;
uniform sampler2D uPositionTex,uVelocityTex;
uniform ivec2 uTexSize;
uniform mat4 uView,uProjection;
uniform vec3 uCameraPos;
uniform float uTime,uFogDensity;
out vec3 vWorldPos,vNormal,vForward,vLocal;
out float vFog,vSeed;
vec3 safeNormalize(vec3 v){float l=length(v);return l>1e-5?v/l:vec3(0.0,0.0,1.0);}
void main(){
  int id=gl_InstanceID;
  ivec2 tc=ivec2(id%uTexSize.x,id/uTexSize.x);
  vec4 posData=texelFetch(uPositionTex,tc,0);
  vec4 velData=texelFetch(uVelocityTex,tc,0);
  vec3 pos=posData.xyz;
  vec3 forward=safeNormalize(velData.xyz);
  float seed=posData.w;
  vec3 upRef=(abs(forward.y)>.92)?vec3(0.0,0.0,1.0):vec3(0.0,1.0,0.0);
  vec3 side=safeNormalize(cross(upRef,forward));
  vec3 up=safeNormalize(cross(forward,side));
  vec3 local=aPosition;
  float tailMask=smoothstep(.25,-1.10,local.x);
  float phase=seed*6.2831853;
  local.y+=sin(uTime*14.5+phase+local.x*8.2)*tailMask*.23;
  local.z+=sin(uTime*8.5+phase+local.x*5.0)*tailMask*.035;
  float distToCamera=distance(uCameraPos,pos);
  float randomScale=.82+fract(seed*37.231)*.42;
  float sizeAttenuation=clamp(1.18-distToCamera*.012,.62,1.16);
  float scale=.205*randomScale*sizeAttenuation;
  vec3 worldOffset=forward*local.x+side*local.y+up*local.z;
  vec3 worldPos=pos+worldOffset*scale;
  vec3 normal=safeNormalize(forward*aNormal.x+side*aNormal.y+up*aNormal.z);
  gl_Position=uProjection*uView*vec4(worldPos,1.0);
  vWorldPos=worldPos;
  vNormal=normal;
  vForward=forward;
  vLocal=local;
  vSeed=seed;
  vFog=clamp(1.0-exp(-uFogDensity*distToCamera),0.0,.96);
}`;

        const fishFS = `#version 300 es
precision highp float;
in vec3 vWorldPos,vNormal,vForward,vLocal;
in float vFog,vSeed;
uniform vec3 uCameraPos,uFogColor;
uniform float uTime;
out vec4 outColor;
void main(){
  vec3 N=normalize(vNormal);
  if(!gl_FrontFacing) N=-N;
  vec3 V=normalize(uCameraPos-vWorldPos);
  vec3 L=normalize(vec3(-.24,.88,.40));
  vec3 H=normalize(L+V);
  vec3 F=normalize(vForward);
  vec3 side=cross(F,vec3(0.0,1.0,0.0));
  if(dot(side,side)<.001) side=cross(F,vec3(1.0,0.0,0.0));
  side=normalize(side);
  float ndl=max(dot(N,L),0.0);
  float hemi=.34+.66*max(N.y*.5+.5,0.0);
  float backMix=smoothstep(-.06,.18,vLocal.z);
  vec3 belly=vec3(.82,.88,.88);
  vec3 back=vec3(.025,.30,.33);
  vec3 base=mix(belly,back,backMix);
  float sideLine=exp(-abs(vLocal.z)*24.0)*smoothstep(-.78,-.15,vLocal.x)*(1.0-smoothstep(.42,.98,vLocal.x));
  base*=1.0-sideLine*.22;
  float fresnel=pow(1.0-clamp(dot(N,V),0.0,1.0),3.2);
  float mirror=pow(max(dot(reflect(-L,N),V),0.0),86.0);
  float anisotropic=pow(max(dot(N,H),0.0),42.0)*pow(max(1.0-abs(dot(H,F)),0.0),2.0);
  float broadside=pow(abs(dot(side,V)),7.0);
  float sparkleGate=smoothstep(.46,1.0,sin(vSeed*91.7+uTime*6.0)*.5+.5);
  float flash=pow(max(dot(N,H),0.0),72.0)*(.45+2.4*broadside)*(.65+sparkleGate);
  vec3 color=base*(.20+.88*ndl)*hemi;
  color+=vec3(.92,.98,1.0)*(mirror*2.2+anisotropic*1.15+flash*.95+fresnel*.42);
  color+=vec3(.05,.15,.18)*max(dot(-N,L),0.0)*.12;
  float fog=clamp(vFog,0.0,.95);
  float lum=dot(color,vec3(.299,.587,.114));
  color=mix(vec3(lum),color,1.0-fog*.54);
  color=mix(color,uFogColor,fog);
  outColor=vec4(color,1.0);
}`;

        const snowVS = `#version 300 es
precision highp float;
layout(location=0) in vec4 aSnow;
uniform mat4 uView,uProjection;
uniform float uTime;
out float vAlpha;
void main(){
  vec3 p=aSnow.xyz;
  float seed=aSnow.w;
  p.x+=sin(uTime*(.05+seed*.05)+seed*18.0)*1.6;
  p.z+=cos(uTime*(.04+seed*.04)+seed*21.0)*1.4;
  p.y=mod(p.y+18.0+uTime*(.10+seed*.09),36.0)-18.0;
  vec4 clip=uProjection*uView*vec4(p,1.0);
  gl_Position=clip;
  gl_PointSize=clamp((1.25+seed*2.2)*96.0/max(clip.w,2.0),1.0,5.5);
  vAlpha=.14+seed*.18;
}`;

        const snowFS = `#version 300 es
precision highp float;
in float vAlpha;
out vec4 outColor;
void main(){
  vec2 p=gl_PointCoord*2.0-1.0;
  float d=dot(p,p);
  if(d>1.0) discard;
  float a=(1.0-smoothstep(.05,1.0,d))*vAlpha;
  outColor=vec4(.72,.92,1.0,a);
}`;

        const predatorVS = `#version 300 es
precision highp float;
uniform mat4 uView,uProjection;
uniform vec3 uPredatorPos;
uniform float uPredatorRadius;
void main(){
  vec4 clip=uProjection*uView*vec4(uPredatorPos,1.0);
  gl_Position=clip;
  gl_PointSize=clamp(uPredatorRadius*118.0/max(clip.w,.8),34.0,260.0);
}`;

        const predatorFS = `#version 300 es
precision highp float;
out vec4 outColor;
void main(){
  vec2 p=gl_PointCoord*2.0-1.0;
  float d=length(p);
  if(d>1.0) discard;
  float ring=smoothstep(.58,.66,d)*(1.0-smoothstep(.92,1.0,d));
  float core=1.0-smoothstep(0.0,.35,d);
  float haze=1.0-smoothstep(.2,1.0,d);
  vec3 col=mix(vec3(.24,.78,1.0),vec3(.95,.98,1.0),core);
  outColor=vec4(col,ring*.18+core*.07+haze*.035);
}`;

        const simProgram = createProgram(fullscreenVS, simFS, "simulation");
        const bgProgram = createProgram(fullscreenVS, bgFS, "background");
        const fishProgram = createProgram(fishVS, fishFS, "fish");
        const snowProgram = createProgram(snowVS, snowFS, "marine snow");
        const predatorProgram = createProgram(
          predatorVS,
          predatorFS,
          "predator",
        );

        const simU = uniforms(simProgram, [
          "uPositionTex",
          "uVelocityTex",
          "uTexSize",
          "uFishCount",
          "uFrameMod",
          "uDelta",
          "uTime",
          "uMaxSpeed",
          "uMaxAccel",
          "uSeparationWeight",
          "uAlignmentWeight",
          "uCohesionWeight",
          "uVortexWeight",
          "uNoiseWeight",
          "uPredatorPos",
          "uPredatorRadius",
          "uPredatorStrength",
          "uPredatorActive",
          "uBoundsRadius",
        ]);
        const bgU = uniforms(bgProgram, ["uTime", "uResolution"]);
        const fishU = uniforms(fishProgram, [
          "uPositionTex",
          "uVelocityTex",
          "uTexSize",
          "uView",
          "uProjection",
          "uCameraPos",
          "uTime",
          "uFogDensity",
          "uFogColor",
        ]);
        const snowU = uniforms(snowProgram, ["uView", "uProjection", "uTime"]);
        const predatorU = uniforms(predatorProgram, [
          "uView",
          "uProjection",
          "uPredatorPos",
          "uPredatorRadius",
        ]);

        const fullscreenVao = gl.createVertexArray();

        const fishMesh = makeFishMesh();
        const fishVao = gl.createVertexArray();
        const fishBuffer = gl.createBuffer();
        gl.bindVertexArray(fishVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, fishBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, fishMesh.data, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
        gl.bindVertexArray(null);

        const snow = makeSnow(950);
        const snowVao = gl.createVertexArray();
        const snowBuffer = gl.createBuffer();
        gl.bindVertexArray(snowVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, snowBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, snow.data, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 16, 0);
        gl.bindVertexArray(null);

        const view = new Float32Array(16);
        const projection = new Float32Array(16);
        const viewProjection = new Float32Array(16);
        const inverseViewProjection = new Float32Array(16);
        const eye = [0, 6, 24];
        const target = [0, 0, 0];
        const cameraForward = [0, 0, -1];
        const predator = {
          active: false,
          x: 0,
          y: 0,
          input: "none",
          world: [999, 999, 999],
        };
        const mobileControlsQuery = window.matchMedia("(max-width: 760px)");
        let controlsOpen = !mobileControlsQuery.matches;

        let texSize = 0,
          capacity = 0,
          fishCount = 0,
          readState = null,
          writeState = null;
        let frameIndex = 0,
          lastTime = performance.now(),
          fpsTime = lastTime,
          fpsFrames = 0,
          fps = 0;

        setupGui();
        syncControlsPanel();
        resetSimulation(params.fishCount);
        requestAnimationFrame(loop);

        controlsToggle.addEventListener("click", () => {
          controlsOpen = !controlsOpen;
          syncControlsPanel();
        });
        mobileControlsQuery.addEventListener("change", (ev) => {
          controlsOpen = !ev.matches;
          syncControlsPanel();
        });

        canvas.addEventListener("pointerdown", (ev) => {
          if (!ev.isPrimary) return;
          setPredatorFromPointer(ev);
          canvas.setPointerCapture?.(ev.pointerId);
          ev.preventDefault();
        });
        canvas.addEventListener("pointermove", (ev) => {
          if (!ev.isPrimary) return;
          setPredatorFromPointer(ev);
          if (ev.pointerType !== "mouse") ev.preventDefault();
        });
        canvas.addEventListener("pointerup", (ev) => {
          if (!ev.isPrimary) return;
          if (ev.pointerType !== "mouse") predator.active = false;
          canvas.releasePointerCapture?.(ev.pointerId);
        });
        canvas.addEventListener("pointercancel", (ev) => {
          if (!ev.isPrimary) return;
          predator.active = false;
          canvas.releasePointerCapture?.(ev.pointerId);
        });
        canvas.addEventListener("pointerleave", (ev) => {
          if (ev.pointerType === "mouse") predator.active = false;
        });
        window.addEventListener("keydown", (ev) => {
          if (ev.code === "Space") {
            ev.preventDefault();
            params.paused = !params.paused;
            updatePauseButton();
          } else if (ev.key.toLowerCase() === "r") {
            resetSimulation(params.fishCount);
            showNotice("Simulation reset");
          } else if (ev.key.toLowerCase() === "h") {
            readmeEl.classList.toggle("hidden");
          }
        });

        function loop(now) {
          const t = now * 0.001;
          const dt = Math.min(
            Math.max((now - lastTime) * 0.001, 0.0001),
            0.033,
          );
          lastTime = now;
          resize();
          updateCamera(t);
          updatePredatorWorld();
          if (!params.paused) simulate(dt, t);
          render(t);
          updateStatus(now);
          requestAnimationFrame(loop);
        }

        function simulate(dt, time) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, writeState.fbo);
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
          gl.viewport(0, 0, texSize, texSize);
          gl.disable(gl.DEPTH_TEST);
          gl.disable(gl.BLEND);
          gl.useProgram(simProgram);
          gl.bindVertexArray(fullscreenVao);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, readState.posTex);
          gl.uniform1i(simU.uPositionTex, 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, readState.velTex);
          gl.uniform1i(simU.uVelocityTex, 1);
          gl.uniform2i(simU.uTexSize, texSize, texSize);
          gl.uniform1i(simU.uFishCount, fishCount);
          gl.uniform1i(simU.uFrameMod, frameIndex % 97);
          gl.uniform1f(simU.uDelta, dt);
          gl.uniform1f(simU.uTime, time);
          gl.uniform1f(simU.uMaxSpeed, params.maxSpeed);
          gl.uniform1f(simU.uMaxAccel, 7.2);
          gl.uniform1f(simU.uSeparationWeight, params.separation);
          gl.uniform1f(simU.uAlignmentWeight, params.alignment);
          gl.uniform1f(simU.uCohesionWeight, params.cohesion);
          gl.uniform1f(simU.uVortexWeight, params.vortex);
          gl.uniform1f(simU.uNoiseWeight, params.noise);
          gl.uniform3f(
            simU.uPredatorPos,
            predator.world[0],
            predator.world[1],
            predator.world[2],
          );
          gl.uniform1f(simU.uPredatorRadius, params.predatorRadius);
          gl.uniform1f(simU.uPredatorStrength, params.predatorStrength);
          gl.uniform1f(simU.uPredatorActive, predator.active ? 1 : 0);
          gl.uniform1f(simU.uBoundsRadius, 8.7);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          const tmp = readState;
          readState = writeState;
          writeState = tmp;
          frameIndex++;
        }

        function render(time) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.clearColor(0, 0.015, 0.035, 1);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

          gl.disable(gl.DEPTH_TEST);
          gl.disable(gl.BLEND);
          gl.depthMask(false);
          gl.useProgram(bgProgram);
          gl.bindVertexArray(fullscreenVao);
          gl.uniform1f(bgU.uTime, time);
          gl.uniform2f(bgU.uResolution, canvas.width, canvas.height);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
          gl.useProgram(snowProgram);
          gl.bindVertexArray(snowVao);
          gl.uniformMatrix4fv(snowU.uView, false, view);
          gl.uniformMatrix4fv(snowU.uProjection, false, projection);
          gl.uniform1f(snowU.uTime, time);
          gl.drawArrays(gl.POINTS, 0, snow.count);

          gl.depthMask(true);
          gl.enable(gl.DEPTH_TEST);
          gl.depthFunc(gl.LEQUAL);
          gl.disable(gl.BLEND);
          gl.disable(gl.CULL_FACE);
          gl.useProgram(fishProgram);
          gl.bindVertexArray(fishVao);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, readState.posTex);
          gl.uniform1i(fishU.uPositionTex, 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, readState.velTex);
          gl.uniform1i(fishU.uVelocityTex, 1);
          gl.uniform2i(fishU.uTexSize, texSize, texSize);
          gl.uniformMatrix4fv(fishU.uView, false, view);
          gl.uniformMatrix4fv(fishU.uProjection, false, projection);
          gl.uniform3f(fishU.uCameraPos, eye[0], eye[1], eye[2]);
          gl.uniform1f(fishU.uTime, time);
          gl.uniform1f(fishU.uFogDensity, params.fogDensity);
          gl.uniform3f(fishU.uFogColor, 0.012, 0.105, 0.205);
          gl.drawArraysInstanced(
            gl.TRIANGLES,
            0,
            fishMesh.vertexCount,
            fishCount,
          );

          if (predator.active) {
            gl.depthMask(false);
            gl.disable(gl.DEPTH_TEST);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
            gl.useProgram(predatorProgram);
            gl.bindVertexArray(fullscreenVao);
            gl.uniformMatrix4fv(predatorU.uView, false, view);
            gl.uniformMatrix4fv(predatorU.uProjection, false, projection);
            gl.uniform3f(
              predatorU.uPredatorPos,
              predator.world[0],
              predator.world[1],
              predator.world[2],
            );
            gl.uniform1f(predatorU.uPredatorRadius, params.predatorRadius);
            gl.drawArrays(gl.POINTS, 0, 1);
            gl.depthMask(true);
          }
          gl.bindVertexArray(null);
        }

        function updateCamera(time) {
          const orbit = time * params.cameraSpeed * 0.32;
          const radius = 24 + Math.sin(time * 0.09) * 2.1;
          eye[0] = Math.sin(orbit) * radius + Math.sin(time * 0.071) * 2.2;
          eye[1] = 5.8 + Math.sin(time * 0.151) * 2;
          eye[2] = Math.cos(orbit) * radius + Math.cos(time * 0.063) * 1.8;
          target[0] = Math.sin(time * 0.1) * 0.65;
          target[1] = Math.sin(time * 0.13) * 0.34;
          target[2] = Math.cos(time * 0.08) * 0.55;
          const f = normalize3(sub3(target, eye));
          cameraForward[0] = f[0];
          cameraForward[1] = f[1];
          cameraForward[2] = f[2];
          mat4LookAt(view, eye, target, [0, 1, 0]);
          mat4Perspective(
            projection,
            Math.PI / 4.2,
            canvas.width / Math.max(1, canvas.height),
            0.1,
            120,
          );
          mat4Multiply(viewProjection, projection, view);
          mat4Invert(inverseViewProjection, viewProjection);
        }

        function setPredatorFromPointer(ev) {
          const rect = canvas.getBoundingClientRect();
          predator.x = ev.clientX - rect.left;
          predator.y = ev.clientY - rect.top;
          predator.input = ev.pointerType || "pointer";
          predator.active = true;
        }

        function syncControlsPanel() {
          controls.classList.toggle("controls-collapsed", !controlsOpen);
          controlsToggle.classList.toggle("controls-toggle-open", controlsOpen);
          controlsToggle.setAttribute("aria-expanded", String(controlsOpen));
          controlsToggle.textContent = controlsOpen ? "閉じる" : "Controls";
        }

        function updatePredatorWorld() {
          if (!predator.active) {
            predator.world[0] = 999;
            predator.world[1] = 999;
            predator.world[2] = 999;
            return;
          }
          const ndcX = (predator.x / Math.max(1, canvas.clientWidth)) * 2 - 1;
          const ndcY = 1 - (predator.y / Math.max(1, canvas.clientHeight)) * 2;
          const near = transformMat4(
            [ndcX, ndcY, -1, 1],
            inverseViewProjection,
          );
          const far = transformMat4([ndcX, ndcY, 1, 1], inverseViewProjection);
          for (let i = 0; i < 3; i++) {
            near[i] /= near[3];
            far[i] /= far[3];
          }
          const rayDir = normalize3(sub3(far, near));
          const denom = dot3(rayDir, cameraForward);
          let hit;
          if (Math.abs(denom) > 1e-5) {
            const tt = dot3(sub3(target, near), cameraForward) / denom;
            hit = add3(near, mul3(rayDir, tt));
          } else {
            hit = add3(eye, mul3(cameraForward, 24));
          }
          predator.world[0] = hit[0];
          predator.world[1] = hit[1];
          predator.world[2] = hit[2];
        }

        function resetSimulation(newFishCount) {
          fishCount = clamp(Math.round(newFishCount), 5000, 32768);
          params.fishCount = fishCount;
          texSize = Math.ceil(Math.sqrt(fishCount));
          capacity = texSize * texSize;
          if (readState) disposeState(readState);
          if (writeState) disposeState(writeState);

          const pos = new Float32Array(capacity * 4);
          const vel = new Float32Array(capacity * 4);
          const radius = 6.8;

          for (let i = 0; i < capacity; i++) {
            const o = i * 4;
            if (i < fishCount) {
              const theta = Math.random() * Math.PI * 2;
              const z = Math.random() * 2 - 1;
              const rr = radius * Math.cbrt(Math.random());
              const xy = Math.sqrt(Math.max(0, 1 - z * z));
              const organicScale = 0.92 + Math.random() * 0.16;
              const p = [
                Math.cos(theta) * xy * rr * organicScale,
                z * rr * organicScale,
                Math.sin(theta) * xy * rr * organicScale,
              ];
              const radial = normalize3(p);
              let tangent = cross3([0, 1, 0], radial);
              if (length3(tangent) < 1e-4) tangent = cross3([1, 0, 0], radial);
              tangent = normalize3(tangent);
              const poloidal = normalize3(cross3(tangent, radial));
              const jitter = normalize3([
                Math.random() * 2 - 1,
                Math.random() * 2 - 1,
                Math.random() * 2 - 1,
              ]);
              const inward = mul3(radial, -1);
              const speed = params.maxSpeed * (0.34 + Math.random() * 0.38);
              const vv = normalize3(
                add3(
                  add3(mul3(tangent, 0.86), mul3(poloidal, 0.46)),
                  add3(mul3(jitter, 0.35), mul3(inward, 0.18)),
                ),
              );
              pos[o] = p[0];
              pos[o + 1] = p[1];
              pos[o + 2] = p[2];
              pos[o + 3] = Math.random();
              vel[o] = vv[0] * speed;
              vel[o + 1] = vv[1] * speed;
              vel[o + 2] = vv[2] * speed;
              vel[o + 3] = Math.random();
            }
          }

          readState = createState(pos, vel);
          writeState = createState(null, null);
          frameIndex = 0;
          refreshGuiValues();
        }

        function createFloatTexture(w, h, data) {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA32F,
            w,
            h,
            0,
            gl.RGBA,
            gl.FLOAT,
            data,
          );
          return tex;
        }

        function createState(positionData, velocityData) {
          const state = {
            posTex: createFloatTexture(texSize, texSize, positionData),
            velTex: createFloatTexture(texSize, texSize, velocityData),
            fbo: gl.createFramebuffer(),
          };
          gl.bindFramebuffer(gl.FRAMEBUFFER, state.fbo);
          gl.framebufferTexture2D(
            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT0,
            gl.TEXTURE_2D,
            state.posTex,
            0,
          );
          gl.framebufferTexture2D(
            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT1,
            gl.TEXTURE_2D,
            state.velTex,
            0,
          );
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
          const fbStatus = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
          if (fbStatus !== gl.FRAMEBUFFER_COMPLETE)
            fatal(
              "浮動小数点 FBO を作成できませんでした: 0x" +
                fbStatus.toString(16),
            );
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return state;
        }

        function disposeState(state) {
          gl.deleteTexture(state.posTex);
          gl.deleteTexture(state.velTex);
          gl.deleteFramebuffer(state.fbo);
        }

        function makeFishMesh() {
          const vertices = [];
          const push = (v, n) =>
            vertices.push(v[0], v[1], v[2], n[0], n[1], n[2]);
          const addTri = (a, b, c) => {
            const n = normalize3(cross3(sub3(b, a), sub3(c, a)));
            push(a, n);
            push(b, n);
            push(c, n);
          };
          const nose = [1.05, 0, 0],
            tail = [-0.72, 0, 0];
          const top = [0.05, 0, 0.205],
            bottom = [0.07, 0, -0.165],
            left = [-0.03, 0.175, 0.012],
            right = [-0.03, -0.175, 0.012];
          addTri(nose, top, left);
          addTri(nose, left, bottom);
          addTri(nose, bottom, right);
          addTri(nose, right, top);
          addTri(tail, left, top);
          addTri(tail, bottom, left);
          addTri(tail, right, bottom);
          addTri(tail, top, right);
          addTri(tail, [-1.16, 0, 0.39], [-1.34, 0, 0]);
          addTri(tail, [-1.34, 0, 0], [-1.16, 0, -0.39]);
          addTri([-0.18, 0, 0.16], [-0.54, 0, 0.34], [0.18, 0, 0.17]);
          addTri(
            [0.14, 0.12, -0.035],
            [-0.28, 0.52, -0.13],
            [-0.1, 0.1, -0.12],
          );
          addTri(
            [0.14, -0.12, -0.035],
            [-0.1, -0.1, -0.12],
            [-0.28, -0.52, -0.13],
          );
          return {
            data: new Float32Array(vertices),
            vertexCount: vertices.length / 6,
          };
        }

        function makeSnow(count) {
          const data = new Float32Array(count * 4);
          for (let i = 0; i < count; i++) {
            const o = i * 4;
            data[o] = (Math.random() * 2 - 1) * 23;
            data[o + 1] = (Math.random() * 2 - 1) * 18;
            data[o + 2] = (Math.random() * 2 - 1) * 23;
            data[o + 3] = Math.random();
          }
          return { data, count };
        }

        function setupGui() {
          controls.innerHTML = "<h1>Iwashi controls</h1>";
          addSlider(
            "fishCount",
            "個体数",
            5000,
            32768,
            1024,
            (v) => Math.round(v).toLocaleString(),
            true,
          );
          addSlider("maxSpeed", "最大速度", 0.8, 5.5, 0.05, (v) =>
            v.toFixed(2),
          );
          addSlider("separation", "分離 Separation", 0, 4, 0.01, (v) =>
            v.toFixed(2),
          );
          addSlider("alignment", "整列 Alignment", 0, 3, 0.01, (v) =>
            v.toFixed(2),
          );
          addSlider("cohesion", "結合 Cohesion", 0, 3, 0.01, (v) =>
            v.toFixed(2),
          );
          addSlider("vortex", "渦力 Vortex", 0, 4, 0.01, (v) => v.toFixed(2));
          addSlider("noise", "ノイズ Curl", 0, 2, 0.01, (v) => v.toFixed(2));
          addSlider("predatorStrength", "捕食者 強度", 0, 28, 0.1, (v) =>
            v.toFixed(1),
          );
          addSlider("predatorRadius", "捕食者 半径", 0.5, 7, 0.05, (v) =>
            v.toFixed(2),
          );
          addSlider("fogDensity", "フォグ濃度", 0, 0.09, 0.001, (v) =>
            v.toFixed(3),
          );
          addSlider("cameraSpeed", "カメラ旋回", 0, 1.4, 0.01, (v) =>
            v.toFixed(2),
          );

          const buttons = document.createElement("div");
          buttons.className = "button-line";
          const pause = document.createElement("button");
          pause.id = "pauseButton";
          pause.type = "button";
          pause.textContent = "一時停止";
          pause.onclick = () => {
            params.paused = !params.paused;
            updatePauseButton();
          };
          const reset = document.createElement("button");
          reset.type = "button";
          reset.textContent = "リセット";
          reset.onclick = () => {
            resetSimulation(params.fishCount);
            showNotice("Simulation reset");
          };
          buttons.append(pause, reset);
          controls.appendChild(buttons);
          statusEl.id = "status";
          controls.appendChild(statusEl);
        }

        function addSlider(
          key,
          label,
          min,
          max,
          step,
          format,
          resetOnCommit = false,
        ) {
          const row = document.createElement("div");
          row.className = "row";
          const labelLine = document.createElement("div");
          labelLine.className = "label-line";
          const name = document.createElement("span");
          name.textContent = label;
          const value = document.createElement("span");
          value.className = "value";
          value.dataset.key = key;
          value.textContent = format(params[key]);
          const input = document.createElement("input");
          input.type = "range";
          input.min = min;
          input.max = max;
          input.step = step;
          input.value = params[key];
          input.dataset.key = key;
          input.oninput = () => {
            const v =
              key === "fishCount"
                ? Math.round(Number(input.value))
                : Number(input.value);
            params[key] = v;
            value.textContent = format(v);
            if (key === "fishCount")
              statusEl.textContent =
                "個体数変更はスライダーを離すと再初期化されます。";
          };
          input.onchange = () => {
            if (resetOnCommit) {
              resetSimulation(params.fishCount);
              showNotice(
                params.fishCount.toLocaleString() + " fish initialized",
              );
            }
          };
          labelLine.append(name, value);
          row.append(labelLine, input);
          controls.appendChild(row);
        }

        function refreshGuiValues() {
          controls.querySelectorAll("input[data-key]").forEach((input) => {
            input.value = params[input.dataset.key];
          });
          controls.querySelectorAll(".value[data-key]").forEach((value) => {
            const key = value.dataset.key;
            const v = params[key];
            if (key === "fishCount")
              value.textContent = Math.round(v).toLocaleString();
            else if (key === "fogDensity")
              value.textContent = Number(v).toFixed(3);
            else if (key === "predatorStrength")
              value.textContent = Number(v).toFixed(1);
            else value.textContent = Number(v).toFixed(2);
          });
          updatePauseButton();
        }

        function updatePauseButton() {
          const btn = document.getElementById("pauseButton");
          if (btn) btn.textContent = params.paused ? "再開" : "一時停止";
        }

        function updateStatus(now) {
          fpsFrames++;
          if (now - fpsTime > 500) {
            fps = (fpsFrames * 1000) / (now - fpsTime);
            fpsFrames = 0;
            fpsTime = now;
          }
          statusEl.innerHTML =
            fishCount.toLocaleString() +
            " fish / " +
            texSize +
            "×" +
            texSize +
            " RGBA32F<br>" +
            fps.toFixed(0) +
            " fps / " +
            (params.paused ? "paused" : "running") +
            "<br>" +
            "predator (" +
            predator.input +
            "): " +
            (predator.active ? "active" : "outside");
        }

        function showNotice(message) {
          noticeEl.textContent = message;
          noticeEl.classList.add("show");
          clearTimeout(showNotice.timer);
          showNotice.timer = setTimeout(
            () => noticeEl.classList.remove("show"),
            1500,
          );
        }

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
          const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }
        }

        function createProgram(vsSource, fsSource, label) {
          const vs = compileShader(
            gl.VERTEX_SHADER,
            vsSource,
            label + " vertex",
          );
          const fs = compileShader(
            gl.FRAGMENT_SHADER,
            fsSource,
            label + " fragment",
          );
          const program = gl.createProgram();
          gl.attachShader(program, vs);
          gl.attachShader(program, fs);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS))
            fatal(
              "Program link error [" +
                label +
                "]:\n" +
                gl.getProgramInfoLog(program),
            );
          gl.deleteShader(vs);
          gl.deleteShader(fs);
          return program;
        }

        function compileShader(type, source, label) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            fatal(
              "Shader compile error [" +
                label +
                "]:\n" +
                gl.getShaderInfoLog(shader),
            );
          return shader;
        }

        function uniforms(program, names) {
          const out = {};
          for (const name of names)
            out[name] = gl.getUniformLocation(program, name);
          return out;
        }

        function fatal(message) {
          console.error(message);
          noticeEl.textContent = message;
          noticeEl.classList.add("show");
          if (controls)
            controls.innerHTML =
              "<h1>WebGL error</h1><div id='status'>" +
              String(message).replace(/[<>&]/g, "_").replace(/\n/g, "<br>") +
              "</div>";
        }

        function clamp(v, lo, hi) {
          return Math.max(lo, Math.min(hi, v));
        }
        function add3(a, b) {
          return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
        }
        function sub3(a, b) {
          return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
        }
        function mul3(a, s) {
          return [a[0] * s, a[1] * s, a[2] * s];
        }
        function dot3(a, b) {
          return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        }
        function cross3(a, b) {
          return [
            a[1] * b[2] - a[2] * b[1],
            a[2] * b[0] - a[0] * b[2],
            a[0] * b[1] - a[1] * b[0],
          ];
        }
        function length3(a) {
          return Math.hypot(a[0], a[1], a[2]);
        }
        function normalize3(a) {
          const l = length3(a);
          return l < 1e-8 ? [0, 0, 0] : [a[0] / l, a[1] / l, a[2] / l];
        }

        function mat4Perspective(out, fovy, aspect, near, far) {
          const f = 1 / Math.tan(fovy / 2);
          out[0] = f / aspect;
          out[1] = 0;
          out[2] = 0;
          out[3] = 0;
          out[4] = 0;
          out[5] = f;
          out[6] = 0;
          out[7] = 0;
          out[8] = 0;
          out[9] = 0;
          out[10] = (far + near) / (near - far);
          out[11] = -1;
          out[12] = 0;
          out[13] = 0;
          out[14] = (2 * far * near) / (near - far);
          out[15] = 0;
        }

        function mat4LookAt(out, eyeV, centerV, upV) {
          const z = normalize3(sub3(eyeV, centerV));
          let x = normalize3(cross3(upV, z));
          if (length3(x) < 1e-8) x = [1, 0, 0];
          const y = cross3(z, x);
          out[0] = x[0];
          out[1] = y[0];
          out[2] = z[0];
          out[3] = 0;
          out[4] = x[1];
          out[5] = y[1];
          out[6] = z[1];
          out[7] = 0;
          out[8] = x[2];
          out[9] = y[2];
          out[10] = z[2];
          out[11] = 0;
          out[12] = -dot3(x, eyeV);
          out[13] = -dot3(y, eyeV);
          out[14] = -dot3(z, eyeV);
          out[15] = 1;
        }

        function mat4Multiply(out, a, b) {
          const a00 = a[0],
            a01 = a[1],
            a02 = a[2],
            a03 = a[3];
          const a10 = a[4],
            a11 = a[5],
            a12 = a[6],
            a13 = a[7];
          const a20 = a[8],
            a21 = a[9],
            a22 = a[10],
            a23 = a[11];
          const a30 = a[12],
            a31 = a[13],
            a32 = a[14],
            a33 = a[15];
          let b0 = b[0],
            b1 = b[1],
            b2 = b[2],
            b3 = b[3];
          out[0] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
          out[1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
          out[2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
          out[3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
          b0 = b[4];
          b1 = b[5];
          b2 = b[6];
          b3 = b[7];
          out[4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
          out[5] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
          out[6] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
          out[7] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
          b0 = b[8];
          b1 = b[9];
          b2 = b[10];
          b3 = b[11];
          out[8] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
          out[9] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
          out[10] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
          out[11] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
          b0 = b[12];
          b1 = b[13];
          b2 = b[14];
          b3 = b[15];
          out[12] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
          out[13] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
          out[14] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
          out[15] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
        }

        function mat4Invert(out, a) {
          const a00 = a[0],
            a01 = a[1],
            a02 = a[2],
            a03 = a[3];
          const a10 = a[4],
            a11 = a[5],
            a12 = a[6],
            a13 = a[7];
          const a20 = a[8],
            a21 = a[9],
            a22 = a[10],
            a23 = a[11];
          const a30 = a[12],
            a31 = a[13],
            a32 = a[14],
            a33 = a[15];
          const b00 = a00 * a11 - a01 * a10,
            b01 = a00 * a12 - a02 * a10,
            b02 = a00 * a13 - a03 * a10;
          const b03 = a01 * a12 - a02 * a11,
            b04 = a01 * a13 - a03 * a11,
            b05 = a02 * a13 - a03 * a12;
          const b06 = a20 * a31 - a21 * a30,
            b07 = a20 * a32 - a22 * a30,
            b08 = a20 * a33 - a23 * a30;
          const b09 = a21 * a32 - a22 * a31,
            b10 = a21 * a33 - a23 * a31,
            b11 = a22 * a33 - a23 * a32;
          let det =
            b00 * b11 -
            b01 * b10 +
            b02 * b09 +
            b03 * b08 -
            b04 * b07 +
            b05 * b06;
          if (!det) return null;
          det = 1 / det;
          out[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
          out[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
          out[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
          out[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
          out[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
          out[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
          out[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
          out[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
          out[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
          out[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
          out[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
          out[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
          out[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
          out[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
          out[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
          out[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
          return out;
        }

        function transformMat4(v, m) {
          const x = v[0],
            y = v[1],
            z = v[2],
            w = v[3];
          return [
            m[0] * x + m[4] * y + m[8] * z + m[12] * w,
            m[1] * x + m[5] * y + m[9] * z + m[13] * w,
            m[2] * x + m[6] * y + m[10] * z + m[14] * w,
            m[3] * x + m[7] * y + m[11] * z + m[15] * w,
          ];
        }
      })();
    </script>
  </body>
