<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVE PORTRAIT IN FLUX — FLUID</title>
    <style>
      :root {
        --fg: #e8e9ec;
        --muted: #7e8290;
        --bg: #0c0d10;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family:
          "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", Meiryo, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas#gl {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      video,
      canvas#src {
        display: none;
      }

      .hint {
        position: fixed;
        bottom: 28px;
        left: 34px;
        font-size: 10px;
        letter-spacing: 0.28em;
        color: #4a4e58;
        user-select: none;
        pointer-events: none;
        transition: opacity 1.2s ease;
      }

      .panel {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        z-index: 10;
        transition: opacity 0.6s ease;
      }
      .panel.hide {
        opacity: 0;
        pointer-events: none;
      }
      .panel .box {
        text-align: center;
        color: var(--fg);
      }
      .panel .box p {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.22em;
        margin-bottom: 22px;
        line-height: 2;
      }
      .panel button {
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.2em;
        color: var(--bg);
        background: var(--fg);
        border: 0;
        padding: 14px 30px;
        border-radius: 999px;
        cursor: pointer;
      }
      .err {
        color: #c98;
        font-size: 11px;
        letter-spacing: 0.1em;
        margin-top: 18px;
        min-height: 1em;
      }

      .nen-state {
        position: fixed;
        bottom: 28px;
        right: 34px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
        user-select: none;
        pointer-events: none;
        color: #ffffff;
        mix-blend-mode: difference;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      .nen-state.visible {
        opacity: 1;
      }
      .nen-flash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 100;
        color: #ffffff;
        mix-blend-mode: difference;
        font-size: 60vh;
        font-weight: 600;
        letter-spacing: 0;
        opacity: 0;
      }
      .nen-flash.show {
        animation: nen-flash-anim 2s forwards;
      }
      @keyframes nen-flash-anim {
        0% {
          opacity: 0;
          transform: scale(0.85);
        }
        8% {
          opacity: 1;
          transform: scale(1);
        }
        70% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.06);
        }
      }
      .voice-dot {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2a2c32;
        transition:
          background 0.2s ease,
          box-shadow 0.2s ease;
      }
      .voice-dot.active {
        background: #5599ff;
        box-shadow: 0 0 8px #5599ff;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <video id="video" playsinline muted></video>
    <canvas id="src"></canvas>

    <div class="hint" id="hint">
      MOVE TO INTERACT ／ 念：テン・ゼツ・レン・ハツ
    </div>
    <div class="nen-state" id="nenState"></div>
    <div class="nen-flash" id="nenFlash"></div>
    <div class="voice-dot" id="voiceDot"></div>

    <div class="panel" id="panel">
      <div class="box">
        <p>
          カメラ映像をリアルタイムで流体として表現します<br />映像はこの端末内だけで処理され、どこにも送信されません
        </p>
        <button id="startBtn">カメラを起動</button>
        <div class="err" id="err"></div>
      </div>
    </div>

    <script type="module">
      import {
        ImageSegmenter,
        PoseLandmarker,
        FilesetResolver,
      } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";

      /* ---- constants ---- */
      const SIM = 256; // velocity / pressure grid resolution
      const DYE_W = 512; // dye texture resolution
      const DYE_H = 512;
      const GRID_W = 160; // person-texture grid width
      let GRID_H = 120; // recalculated from video aspect
      /* BG removed — camera feed is rendered as background */

      const glc = document.getElementById("gl");
      const gl = glc.getContext("webgl2", {
        antialias: false,
        alpha: false,
        depth: false,
        preserveDrawingBuffer: false,
      });
      const errEl = document.getElementById("err");
      function fatal(msg) {
        errEl.textContent = msg;
      }
      if (!gl) fatal("WebGL2 非対応のブラウザです");
      if (gl && !gl.getExtension("EXT_color_buffer_float"))
        fatal("float テクスチャ非対応です");

      const video = document.getElementById("video");
      const srcCanvas = document.getElementById("src");
      const srcCtx = srcCanvas.getContext("2d", { willReadFrequently: true });

      let segmenter      = null;
      let poseLandmarker = null;
      let wristUV        = null; // right wrist in WebGL UV space, null when not detected

      /* ---- Mobile detection recipe (from fable5_gas-head.html) ----
         Coarse-pointer devices run MediaPipe on a ≤288px copy of the frame,
         on an adaptive cadence, and rebuild the segmenter on CPU when the
         GPU delegate emits degenerate masks. Desktop (fine pointer) keeps
         the original per-video-frame full-resolution inference. */
      const SEG_SMALL = matchMedia("(pointer: coarse)").matches;
      const SEG_MAX_SIDE = 288;
      const inferCanvas = document.createElement("canvas");
      const inferCtx = inferCanvas.getContext("2d");
      let latestMask = null,
        latestMaskW = 0,
        latestMaskH = 0;
      let segCost = 20,
        segBadRun = 0,
        segSwitching = false,
        lastInferAt = -1e9;
      let segDelegate = "GPU",
        visionRef = null,
        segOptsRef = null;

      /* Mobile only: MediaPipe reads a ≤288px copy of the frame (5x cheaper
         at 640x480 input; the mask lands in the 160px person grid anyway).
         Desktop returns the raw video element — identical to before. */
      function segInput() {
        if (!SEG_SMALL) return video;
        const vw = video.videoWidth,
          vh = video.videoHeight;
        const s = Math.min(1, SEG_MAX_SIDE / Math.max(vw, vh));
        const cw = Math.max(2, Math.round(vw * s)),
          ch = Math.max(2, Math.round(vh * s));
        if (inferCanvas.width !== cw || inferCanvas.height !== ch) {
          inferCanvas.width = cw;
          inferCanvas.height = ch;
        }
        inferCtx.drawImage(video, 0, 0, cw, ch);
        return inferCanvas;
      }

      /* Some mobile GPU delegates "succeed" but emit degenerate masks
         (all-zero or all-one). When that persists, rebuild on CPU. */
      async function switchToCpuDelegate() {
        if (segSwitching || segDelegate === "CPU" || !visionRef || !segOptsRef)
          return;
        segSwitching = true;
        try {
          const next = await ImageSegmenter.createFromOptions(
            visionRef,
            segOptsRef("CPU"),
          );
          try {
            segmenter?.close?.();
          } catch {}
          segmenter = next;
          segDelegate = "CPU";
          segBadRun = 0;
          console.warn(
            "overflowing_aura: GPU segmentation output looked broken — switched to CPU delegate",
          );
        } catch {}
        segSwitching = false;
      }

      /* ?debug=1 — tiny on-screen inference readout for on-device checks */
      const DBG_ON = new URLSearchParams(location.search).has("debug");
      let dbgEl = null;
      function dbgShow(text) {
        if (!DBG_ON) return;
        if (!dbgEl) {
          dbgEl = document.createElement("div");
          dbgEl.style.cssText =
            "position:fixed;left:8px;bottom:8px;z-index:99;font:11px ui-monospace,monospace;color:#9fe;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:4px;pointer-events:none";
          document.body.appendChild(dbgEl);
        }
        dbgEl.textContent = text;
      }

      /* ---- Nen state management ---- */
      const PRESETS = {
        default: {
          turbStrength: 0.005, blastStrength: 0.025, riseStrength: 0.0035,
          bodyInject: 0.32,    auraSat: 2.0,          auraWhite: 0.04,
          silhouetteInject: 0.48,
          velDissipation: 0.985, dyeDissipation: 0.970,
          mangaRange: 0.72, personSat: 1.0, personAlpha: 1.0, posterize: 8.0,
        },
        ten: {
          turbStrength: 0.009, blastStrength: 0.007, riseStrength: 0.002,
          bodyInject: 0.80,    auraSat: 2.0,          auraWhite: 0.04,
          silhouetteInject: 0.88,
          velDissipation: 0.91, dyeDissipation: 0.976,
          mangaRange: 0.72, personSat: 1.0, personAlpha: 1.0, posterize: 8.0,
        },
        zetsu: {
          turbStrength: 0.0,   blastStrength: 0.0,   riseStrength: 0.0,
          bodyInject: 0.0,     auraSat: 0.0,          auraWhite: 0.0,
          silhouetteInject: 0.0,
          velDissipation: 0.92, dyeDissipation: 0.88,
          mangaRange: 0.72, personSat: 0.40, personAlpha: 1.0,  posterize: 8.0,
        },
        ren: {
          turbStrength: 0.020, blastStrength: 0.065, riseStrength: 0.013,
          bodyInject: 0.8,     auraSat: 8.0,          auraWhite: 0.15,
          silhouetteInject: 0.97,
          velDissipation: 0.982, dyeDissipation: 0.986,
          mangaRange: 0.72, personSat: 1.0, personAlpha: 1.0, posterize: 8.0,
        },
        hatsu: {
          turbStrength: 0.009, blastStrength: 0.007, riseStrength: 0.002,
          bodyInject: 0.75,    auraSat: 3.0,          auraWhite: 0.04,
          silhouetteInject: 0.88,
          velDissipation: 0.93, dyeDissipation: 0.980,
          mangaRange: 0.72, personSat: 1.0,  personAlpha: 1.0, posterize: 8.0,
        },
      };
      const NEN_LABELS = { ten: "纏", zetsu: "絶", ren: "錬", hatsu: "発" };
      const NEN_COLORS = {
        ten: "#88ccff",
        zetsu: "#aaaaaa",
        ren: "#ffcc44",
        hatsu: "#ff6633",
      };

      let currentPreset = "default";
      const auraState = { ...PRESETS.default };
      let burstFrames = 0;

      function setPreset(name) {
        if (currentPreset === name) return;
        currentPreset = name;
        if (name === "hatsu") burstFrames = 1;
        const el = document.getElementById("nenState");
        const flash = document.getElementById("nenFlash");
        if (!el) return;
        if (name === "default") {
          el.classList.remove("visible");
        } else {
          const label = NEN_LABELS[name] ?? name;
          el.textContent = label;
          el.classList.add("visible");
          if (flash) {
            flash.textContent = label;
            flash.classList.remove("show");
            void flash.offsetWidth; // reflow to restart animation
            flash.classList.add("show");
          }
        }
      }

      function lerpState(dt) {
        const target = PRESETS[currentPreset];
        const alpha = 1 - Math.exp(-dt * 8);
        for (const k of Object.keys(target)) {
          auraState[k] += (target[k] - auraState[k]) * alpha;
        }
      }

      /* ================================================================
         SHADERS
         ================================================================ */

      const vsQuad = `#version 300 es
layout(location=0) in vec2 a_pos;
out vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

      /* Semi-Lagrangian advection (shared for vel and dye) */
      const fsAdvect = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform sampler2D u_src;
uniform float u_dt;
uniform float u_dissipation;
out vec4 o;
void main() {
  vec2 vel = texture(u_vel, v_uv).xy;
  vec2 uv  = clamp(v_uv - vel * u_dt, 0.0, 1.0);
  o = texture(u_src, uv) * u_dissipation;
}`;

      const fsDiv = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform vec2 u_texel;
out vec4 o;
void main() {
  float l = texture(u_vel, v_uv - vec2(u_texel.x, 0.0)).x;
  float r = texture(u_vel, v_uv + vec2(u_texel.x, 0.0)).x;
  float b = texture(u_vel, v_uv - vec2(0.0, u_texel.y)).y;
  float t = texture(u_vel, v_uv + vec2(0.0, u_texel.y)).y;
  o = vec4((r - l + t - b) * 0.5, 0.0, 0.0, 1.0);
}`;

      const fsPres = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_pres;
uniform sampler2D u_div;
uniform vec2 u_texel;
out vec4 o;
void main() {
  float l = texture(u_pres, v_uv - vec2(u_texel.x, 0.0)).x;
  float r = texture(u_pres, v_uv + vec2(u_texel.x, 0.0)).x;
  float b = texture(u_pres, v_uv - vec2(0.0, u_texel.y)).x;
  float t = texture(u_pres, v_uv + vec2(0.0, u_texel.y)).x;
  float div = texture(u_div, v_uv).x;
  o = vec4((l + r + b + t - div) * 0.25, 0.0, 0.0, 1.0);
}`;

      const fsGrad = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform sampler2D u_pres;
uniform vec2 u_texel;
out vec4 o;
void main() {
  float l = texture(u_pres, v_uv - vec2(u_texel.x, 0.0)).x;
  float r = texture(u_pres, v_uv + vec2(u_texel.x, 0.0)).x;
  float b = texture(u_pres, v_uv - vec2(0.0, u_texel.y)).x;
  float t = texture(u_pres, v_uv + vec2(0.0, u_texel.y)).x;
  vec2 vel = texture(u_vel, v_uv).xy;
  o = vec4(vel - vec2(r - l, t - b) * 0.5, 0.0, 1.0);
}`;

      const fsBoundary = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform vec2 u_texel;
out vec4 o;
void main() {
  vec2 vel = texture(u_vel, v_uv).xy;
  if (v_uv.x <       u_texel.x) vel.x =  abs(vel.x) * 0.2;
  if (v_uv.x > 1.0 - u_texel.x) vel.x = -abs(vel.x) * 0.2;
  if (v_uv.y <       u_texel.y) vel.y =  abs(vel.y) * 0.2;
  if (v_uv.y > 1.0 - u_texel.y) vel.y = -abs(vel.y) * 0.2;
  o = vec4(vel, 0.0, 1.0);
}`;

      /* Gaussian splat — mouse interaction on velocity field */
      const fsSplat = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_base;
uniform vec2 u_point;
uniform vec3 u_color;
uniform float u_r;
out vec4 o;
void main() {
  vec2 d  = v_uv - u_point;
  float sp = exp(-dot(d, d) / u_r);
  o = texture(u_base, v_uv) + vec4(u_color * sp, 0.0);
}`;

      /* Background: anime cel-shade treatment applied to the entire camera feed.
         Sobel edges → black outlines; posterize to 5 flat colour bands; desaturate.
         Velocity distorts the sample UV — aura warps the space around it. */
      const fsBackground = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_video;
uniform sampler2D u_vel;
uniform vec2      u_videoTexel;
uniform float     u_screenAR;
uniform float     u_camAR;
uniform float     u_posterize;
out vec4 o;

vec2 coverUV(vec2 uv) {
  if (u_screenAR >= u_camAR)
    return vec2(uv.x, (uv.y - 0.5) * (u_camAR / u_screenAR) + 0.5);
  return vec2((uv.x - 0.5) * (u_screenAR / u_camAR) + 0.5, uv.y);
}

void main() {
  vec2 vel   = texture(u_vel, v_uv).xy;
  vec2 camUV = coverUV(v_uv) + vel * 0.20;
  vec2 vUV   = vec2(1.0 - clamp(camUV.x, 0.0, 1.0), 1.0 - clamp(camUV.y, 0.0, 1.0));
  vec2 dx    = vec2(u_videoTexel.x, 0.0);
  vec2 dy    = vec2(0.0, u_videoTexel.y);

  /* 3×3 Sobel on luma — cel-shade outlines */
  vec3 lw = vec3(0.299, 0.587, 0.114);
  float tl = dot(texture(u_video, vUV - dx + dy).rgb, lw);
  float tm = dot(texture(u_video, vUV      + dy).rgb, lw);
  float tr = dot(texture(u_video, vUV + dx + dy).rgb, lw);
  float ml = dot(texture(u_video, vUV - dx     ).rgb, lw);
  float mr = dot(texture(u_video, vUV + dx     ).rgb, lw);
  float bl = dot(texture(u_video, vUV - dx - dy).rgb, lw);
  float bm = dot(texture(u_video, vUV      - dy).rgb, lw);
  float br = dot(texture(u_video, vUV + dx - dy).rgb, lw);
  float ex   = (tl - tr) + 2.0*(ml - mr) + (bl - br);
  float ey   = (tl - bl) + 2.0*(tm - bm) + (tr - br);
  /* edge=0 (black line) when edgeMag > 0.48 */
  float edge = step(0.52, 1.0 - length(vec2(ex, ey)));

  vec4  cam  = texture(u_video, vUV);
  float luma = dot(cam.rgb, lw);

  /* Anime palette: desaturate + posterize to flat colour bands */
  cam.rgb = mix(vec3(luma), cam.rgb, 0.18);
  cam.rgb = floor(cam.rgb * u_posterize + 0.5) / u_posterize;

  /* Stamp cel-shade lines */
  cam.rgb *= edge;

  o = vec4(cam.rgb, 1.0);
}`;

      /* Inject gentle multi-directional turbulence within the person area.
         Navier-Stokes pressure projection converts it to divergence-free flow,
         producing organic swirling motion rather than directional drift.
         coverUV maps dye UV (screen space) → camera UV with object-fit:cover. */
      const fsInjectVel = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform sampler2D u_person;
uniform float u_time;
uniform float u_screenAR;
uniform float u_camAR;
uniform vec2 u_personTexel;
uniform float u_turbStrength;
uniform float u_blastStrength;
uniform float u_riseStrength;
out vec4 o;

vec2 coverUV(vec2 uv) {
  if (u_screenAR >= u_camAR)
    return vec2(uv.x, (uv.y - 0.5) * (u_camAR / u_screenAR) + 0.5);
  return vec2((uv.x - 0.5) * (u_screenAR / u_camAR) + 0.5, uv.y);
}

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}

void main() {
  vec2  camUV = coverUV(v_uv);
  vec2  pUV   = vec2(camUV.x, 1.0 - camUV.y);
  float mask  = texture(u_person, pUV).a;
  vec2  vel   = texture(u_vel, v_uv).xy;

  /* Turbulence inside person body */
  float t  = u_time * 0.045;
  vec2  np = v_uv * 2.2;
  float nx = vnoise(np + vec2(t,         0.0)) - 0.5;
  float ny = vnoise(np + vec2(37.2, t + 51.8)) - 0.5;
  vel += vec2(nx, ny) * u_turbStrength * mask;

  /* Silhouette outward blast — reduced to keep aura hugging the body */
  vec2 tx = u_personTexel;
  float ml = texture(u_person, pUV - vec2(tx.x, 0.0)).a;
  float mr = texture(u_person, pUV + vec2(tx.x, 0.0)).a;
  float mb = texture(u_person, pUV - vec2(0.0, tx.y)).a;
  float mt = texture(u_person, pUV + vec2(0.0, tx.y)).a;
  vec2 grad = vec2(mr - ml, mt - mb);
  vel += -grad * u_blastStrength;

  /* Gentle upward rise — aura floats up like heat from body surface */
  float riseZone = mask + clamp(length(grad) * 2.5, 0.0, 1.0);
  vel += vec2(0.0, u_riseStrength) * riseZone;

  o = vec4(vel, 0.0, 1.0);
}`;

      /* Blend camera color into dye where person is present.
         At silhouette edge, inject hypersaturated aura energy (HDR values > 1 glow). */
      const fsInjectDye = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_dye;
uniform sampler2D u_person;
uniform float u_screenAR;
uniform float u_camAR;
uniform vec2 u_personTexel;
uniform float u_bodyInject;
uniform float u_auraSat;
uniform float u_auraWhite;
uniform float u_silhouetteInject;
out vec4 o;

vec2 coverUV(vec2 uv) {
  if (u_screenAR >= u_camAR)
    return vec2(uv.x, (uv.y - 0.5) * (u_camAR / u_screenAR) + 0.5);
  return vec2((uv.x - 0.5) * (u_screenAR / u_camAR) + 0.5, uv.y);
}

void main() {
  vec2  camUV = coverUV(v_uv);
  vec2  pUV   = vec2(camUV.x, 1.0 - camUV.y);
  vec4  p     = texture(u_person, pUV);
  float mask  = p.a;
  vec3  col   = p.rgb;
  vec3  dye   = texture(u_dye, v_uv).rgb;

  /* Inner body: colour injection — boosted for denser aura body */
  dye = mix(dye, col, mask * u_bodyInject);

  /* Silhouette gradient magnitude — peaks at body edge */
  vec2  tx = u_personTexel;
  float ml = texture(u_person, pUV - vec2(tx.x, 0.0)).a;
  float mr = texture(u_person, pUV + vec2(tx.x, 0.0)).a;
  float mb = texture(u_person, pUV - vec2(0.0, tx.y)).a;
  float mt = texture(u_person, pUV + vec2(0.0, tx.y)).a;
  float gradMag = length(vec2(mr - ml, mt - mb));

  /* Aura colour: hypersaturated person colour + white-hot glow core.
     HDR values (> 1.0) are stored in RGBA16F and appear as intense glow
     via additive blending in the display pass. */
  float avg  = dot(col, vec3(1.0 / 3.0));
  vec3  aura = mix(vec3(avg), col, u_auraSat);
  aura = mix(aura, vec3(1.8), u_auraWhite);

  float auraMix = clamp(gradMag * 4.0, 0.0, 1.0);
  dye = mix(dye, aura, auraMix * u_silhouetteInject);

  o = vec4(dye, 1.0);
}`;

      /* Display: dye as aura energy particles — additive blended in render().
         HDR dye (> 1.0) from silhouette injection clamps to white = glow core.
         Velocity drift shifts dots aggressively for a living-energy look. */
      const fsDisplay = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_dye;
uniform sampler2D u_vel;
uniform float u_dpr;
out vec4 o;
void main() {
  vec3  dye  = texture(u_dye, v_uv).rgb;
  float mag  = length(dye);
  vec3  col  = clamp(dye * 1.5, 0.0, 1.0);
  float alpha = smoothstep(0.008, 0.07, mag);

  /* Aura particle grid — strong vel shift makes particles streak with flow */
  vec2 vel = texture(u_vel, v_uv).xy;
  float dotSpacing = 7.0;
  vec2 gp = mod(gl_FragCoord.xy / u_dpr + vel * 14.0, dotSpacing)
            - vec2(dotSpacing * 0.5);
  float dot = smoothstep(3.2, 0.4, length(gp));

  /* Between particles: nearly transparent — pure additive glow at centres */
  alpha *= mix(0.40, 1.0, dot);
  o = vec4(col, alpha);
}`;

      /* Manga overlay — reference technique (https://dsflon.github.io/dsflon-glsl/dev/009/)
         Full-res video → Sobel on red channel → step() binarisation → black lines.
         Luminosity boost (luma * range * 4) blows out highlights → manga white.
         u_person (160×120) provides the person mask for alpha clipping. */
      const fsManga = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_video;      /* full-res camera (640×480, raw / not mirrored) */
uniform sampler2D u_person;     /* 160×120 mask only                              */
uniform vec2      u_videoTexel; /* vec2(1/videoW, 1/videoH)                       */
uniform float     u_screenAR;
uniform float     u_camAR;
uniform float     u_range;      /* edge threshold 0.3–0.9, default 0.72           */
uniform float     u_personSat;  /* saturation multiplier: 1.0=normal, 0.0=grey    */
uniform float     u_personAlpha;/* overall alpha multiplier: 1.0=normal            */
uniform float     u_posterize;  /* colour quantization levels, 4.0 ≈ 16 colours   */
out vec4 o;

vec2 coverUV(vec2 uv) {
  if (u_screenAR >= u_camAR)
    return vec2(uv.x, (uv.y - 0.5) * (u_camAR / u_screenAR) + 0.5);
  return vec2((uv.x - 0.5) * (u_screenAR / u_camAR) + 0.5, uv.y);
}

void main() {
  vec2 camUV = coverUV(v_uv);

  /* Person mask — personTex is pre-mirrored, sample as-is */
  float mask = texture(u_person, vec2(camUV.x, 1.0 - camUV.y)).a;
  if (mask < 0.04) { o = vec4(0.0); return; }

  /* Video UV — raw (not pre-mirrored), so flip x to mirror selfie */
  vec2 vUV = vec2(1.0 - camUV.x, 1.0 - camUV.y);

  vec2 dx = vec2(u_videoTexel.x, 0.0);
  vec2 dy = vec2(0.0, u_videoTexel.y);

  /* 3×3 Sobel on red channel (same as reference) */
  float tl = texture(u_video, vUV - dx + dy).r;
  float tm = texture(u_video, vUV      + dy).r;
  float tr = texture(u_video, vUV + dx + dy).r;
  float ml = texture(u_video, vUV - dx     ).r;
  float mr = texture(u_video, vUV + dx     ).r;
  float bl = texture(u_video, vUV - dx - dy).r;
  float bm = texture(u_video, vUV      - dy).r;
  float br = texture(u_video, vUV + dx - dy).r;

  float hx = (tl - tr) + 2.0*(ml - mr) + (bl - br);
  float hy = (tl - bl) + 2.0*(tm - bm) + (tr - br);
  float edgeMag = length(vec2(hx, hy));

  /* Hard binarisation: strong edge → 0 (black line), no edge → 1 (keep color) */
  float d = step(u_range, 1.0 - edgeMag);

  /* Base color from full-res video */
  vec4 cam = texture(u_video, vUV);
  float luma2 = dot(cam.rgb, vec3(0.299, 0.587, 0.114));
  cam.rgb = mix(vec3(luma2), cam.rgb, u_personSat);
  cam.rgb = floor(cam.rgb * u_posterize + 0.5) / u_posterize;

  vec3 col = cam.rgb * d;

  float alpha = smoothstep(0.04, 0.22, mask);
  o = vec4(col, alpha * u_personAlpha);
}`;

      /* ================================================================
         GL HELPERS
         ================================================================ */

      function mkShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          throw new Error(gl.getShaderInfoLog(s));
        return s;
      }

      function mkProg(fs) {
        const p = gl.createProgram();
        gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vsQuad));
        gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS))
          throw new Error(gl.getProgramInfoLog(p));
        p.u = {};
        const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
        for (let i = 0; i < n; i++) {
          const { name } = gl.getActiveUniform(p, i);
          p.u[name] = gl.getUniformLocation(p, name);
        }
        return p;
      }

      const quadVAO = gl.createVertexArray();
      gl.bindVertexArray(quadVAO);
      const qb = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, qb);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
        gl.STATIC_DRAW,
      );
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);

      function drawQuad() {
        gl.bindVertexArray(quadVAO);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.bindVertexArray(null);
      }

      function mkFBO(w, h) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA16F,
          w,
          h,
          0,
          gl.RGBA,
          gl.HALF_FLOAT,
          null,
        );
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(
          gl.FRAMEBUFFER,
          gl.COLOR_ATTACHMENT0,
          gl.TEXTURE_2D,
          tex,
          0,
        );
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { tex, fb, w, h };
      }

      function mkDouble(w, h) {
        const fbos = [mkFBO(w, h), mkFBO(w, h)];
        let idx = 0;
        return {
          get read() {
            return fbos[idx];
          },
          get write() {
            return fbos[1 - idx];
          },
          swap() {
            idx = 1 - idx;
          },
        };
      }

      function useFBO(fbo) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fb);
        gl.viewport(0, 0, fbo.w, fbo.h);
      }

      function bindFBOTex(unit, fbo) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, fbo.tex);
      }

      /* ================================================================
         STARTUP
         ================================================================ */

      function initSpeech() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;

        const dot = document.getElementById("voiceDot");
        let active = false;

        function createAndStart() {
          if (active) return;
          active = true;

          const r = new SR();
          r.lang = "ja-JP";
          r.continuous = false; // 1発話ごとに完結
          r.interimResults = true; // 途中認識でも即反応
          r.maxAlternatives = 3; // 認識候補を複数チェック

          let cooldown = false; // 同一発話の多重トリガーを防ぐ

          r.onstart = () => dot?.classList.add("active");

          r.onresult = (e) => {
            if (cooldown) return;
            for (let i = e.resultIndex; i < e.results.length; i++) {
              for (let alt = 0; alt < e.results[i].length; alt++) {
                const t = e.results[i][alt].transcript;
                console.log(`SR[${alt}] final=${e.results[i].isFinal} → "${t}"`);
                if (/テン|テ|てん|て|ten|10|纏|天|点|転|展|典|添|[.,、。・]/i.test(t)) {
                  cooldown = true;
                  setPreset("ten");
                  return;
                } else if (/ゼツ|ぜつ|zetsu|絶|舌|ゼ|ぜ|えつ|エツ/i.test(t)) {
                  cooldown = true;
                  setPreset("zetsu");
                  return;
                } else if (/レン|レ|れん|れ|ren|錬|練|連|蓮|恋|廉|煉|年/i.test(t)) {
                  cooldown = true;
                  setPreset("ren");
                  return;
                } else if (/ハツ|はつ|hatsu|発|初|八|ハ|は|あつ|アツ|8/i.test(t)) {
                  cooldown = true;
                  setPreset("hatsu");
                  return;
                }
              }
            }
          };

          r.onspeechend = () => dot?.classList.remove("active");

          r.onend = () => {
            active = false;
            dot?.classList.remove("active");
            setTimeout(createAndStart, 150);
          };

          r.onerror = (e) => {
            active = false;
            dot?.classList.remove("active");
            if (e.error !== "no-speech") console.warn("SR:", e.error);
            setTimeout(createAndStart, 300);
          };

          r.start();
        }

        createAndStart();
      }

      let started = false;
      document.getElementById("startBtn").addEventListener("click", start);

      async function start() {
        if (started) return;
        started = true;
        try {
          const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm",
          );
          const modelAssetPath =
            "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";
          const segOpts = (delegate) => ({
            baseOptions: { modelAssetPath, delegate },
            runningMode: "VIDEO",
            outputCategoryMask: false,
            outputConfidenceMasks: true,
          });
          visionRef = vision;
          segOptsRef = segOpts;
          try {
            segmenter = await ImageSegmenter.createFromOptions(
              vision,
              segOpts("GPU"),
            );
            segDelegate = "GPU";
          } catch {
            segmenter = await ImageSegmenter.createFromOptions(
              vision,
              segOpts("CPU"),
            );
            segDelegate = "CPU";
          }

          /* Pose is an enhancement (wrist-focused aura) — if it fails to
             load (common on low-end mobiles) the artwork still runs. */
          try {
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
              baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
              },
              runningMode: "VIDEO",
              numPoses: 1,
            });
          } catch (e) {
            poseLandmarker = null;
            console.warn("overflowing_aura: pose unavailable — wrist focus disabled", e);
          }

          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480, facingMode: "user" },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();

          document.getElementById("panel").classList.add("hide");
          setTimeout(
            () => (document.getElementById("hint").style.opacity = 0),
            4000,
          );
          boot();
          initSpeech();
        } catch (e) {
          console.error(e);
          fatal("起動に失敗しました：" + (e?.message ?? e));
          started = false;
        }
      }

      function boot() {
        const vAspect = video.videoWidth / video.videoHeight || 640 / 480;
        GRID_H = Math.round(GRID_W / vAspect);
        srcCanvas.width = GRID_W;
        srcCanvas.height = GRID_H;

        /* Compile all programs */
        const progAdvect = mkProg(fsAdvect);
        const progDiv = mkProg(fsDiv);
        const progPres = mkProg(fsPres);
        const progGrad = mkProg(fsGrad);
        const progBoundary = mkProg(fsBoundary);
        const progSplat = mkProg(fsSplat);
        const progBackground = mkProg(fsBackground);
        const progInjectVel = mkProg(fsInjectVel);
        const progInjectDye = mkProg(fsInjectDye);
        const progDisplay = mkProg(fsDisplay);
        const progManga = mkProg(fsManga);

        /* Fluid FBOs */
        const vel = mkDouble(SIM, SIM);
        const dye = mkDouble(DYE_W, DYE_H);
        const pres = mkDouble(SIM, SIM);
        const divFBO = mkFBO(SIM, SIM);

        /* Person texture — camera color (RGB) + mask (A) */
        const personTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, personTex);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA,
          GRID_W,
          GRID_H,
          0,
          gl.RGBA,
          gl.UNSIGNED_BYTE,
          null,
        );
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        const personPix = new Uint8Array(GRID_W * GRID_H * 4);
        const maskSmooth = new Float32Array(GRID_W * GRID_H);

        /* Full-res video texture for manga Sobel — uploaded directly from <video> */
        const videoTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA,
          video.videoWidth,
          video.videoHeight,
          0,
          gl.RGBA,
          gl.UNSIGNED_BYTE,
          null,
        );
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        /* Canvas resize */
        const dpr = Math.min(devicePixelRatio || 1, 2);
        let W = 0,
          H = 0;
        function resize() {
          W = Math.round(innerWidth * dpr);
          H = Math.round(innerHeight * dpr);
          glc.width = W;
          glc.height = H;
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, W, H);
        }
        addEventListener("resize", resize);
        resize();

        /* Mouse / touch → velocity splat */
        const M = { x: 0.5, y: 0.5, dx: 0, dy: 0 };
        function onMove(cx, cy, pcx, pcy) {
          M.x = cx / innerWidth;
          M.y = 1.0 - cy / innerHeight;
          M.dx = (cx - pcx) / innerWidth;
          M.dy = -(cy - pcy) / innerHeight;
        }
        let prevMX = null,
          prevMY = null;
        glc.addEventListener("mousemove", (e) => {
          if (prevMX === null) {
            prevMX = e.clientX;
            prevMY = e.clientY;
          }
          onMove(e.clientX, e.clientY, prevMX, prevMY);
          prevMX = e.clientX;
          prevMY = e.clientY;
        });
        glc.addEventListener("mouseleave", () => {
          prevMX = null;
          prevMY = null;
        });
        let prevTX = null,
          prevTY = null;
        glc.addEventListener(
          "touchmove",
          (e) => {
            e.preventDefault();
            const t = e.touches[0];
            if (prevTX === null) {
              prevTX = t.clientX;
              prevTY = t.clientY;
            }
            onMove(t.clientX, t.clientY, prevTX, prevTY);
            prevTX = t.clientX;
            prevTY = t.clientY;
          },
          { passive: false },
        );
        glc.addEventListener("touchend", () => {
          prevTX = null;
          prevTY = null;
        });

        let lastVideoT = -1;

        /* ---- updatePerson: MediaPipe segmentation + color extraction ---- */
        function updatePerson(now) {
          if (video.readyState < 2) return;
          /* Inference (segmentation + pose). Desktop: every video frame,
             exactly as before (interval 0). Mobile: adaptive cadence on a
             ≤288px input — between inferences the person grid reuses
             latestMask and the maskSmooth EMA bridges the gaps. */
          const interval = SEG_SMALL
            ? Math.max(33, Math.min(250, segCost * 1.7))
            : 0;
          if (!segSwitching && now - lastInferAt >= interval) {
            lastInferAt = now;
            const inp = segInput();
            const t0 = performance.now();
            try {
              const res = segmenter.segmentForVideo(inp, now);
              const cm = res?.confidenceMasks?.[0];
              if (cm) {
                latestMask = cm.getAsFloat32Array();
                latestMaskW = cm.width;
                latestMaskH = cm.height;
                res.close?.();
                if (SEG_SMALL) {
                  /* GPU-health watchdog: mean coverage ~0 or ~1 for >40
                     consecutive results = delegate garbage, not "no person" */
                  let sum = 0;
                  for (let i = 0; i < latestMask.length; i++)
                    sum += latestMask[i];
                  const cover = sum / latestMask.length;
                  segBadRun = cover < 0.002 || cover > 0.97 ? segBadRun + 1 : 0;
                  if (segBadRun > 40) switchToCpuDelegate();
                }
              }
            } catch {
              if (SEG_SMALL && ++segBadRun > 40) switchToCpuDelegate();
            }

            /* Right wrist tracking for ハツ aura focus */
            try {
              const pr  = poseLandmarker.detectForVideo(inp, now);
              const lm  = pr?.landmarks?.[0];
              const raw = lm?.[16]; // index 16 = right wrist (anatomical)
              if (raw) {
                // mirror x (selfie), flip y (WebGL bottom-up), apply inverse coverUV
                const cx = 1 - raw.x;
                const cy = 1 - raw.y;
                const sar = innerWidth / innerHeight;
                if (sar >= vAspect) {
                  wristUV = { x: cx, y: (cy - 0.5) * (sar / vAspect) + 0.5 };
                } else {
                  wristUV = { x: (cx - 0.5) * (vAspect / sar) + 0.5, y: cy };
                }
              } else {
                wristUV = null;
              }
            } catch { wristUV = null; }

            segCost = segCost * 0.8 + (performance.now() - t0) * 0.2;
            dbgShow(
              `seg ${segDelegate} ${segCost.toFixed(0)}ms${SEG_SMALL ? " ·288px" : ""}`,
            );
          }
          const mask = latestMask;

          /* Mirror the image (selfie convention) */
          srcCtx.save();
          srcCtx.scale(-1, 1);
          srcCtx.drawImage(video, -GRID_W, 0, GRID_W, GRID_H);
          srcCtx.restore();
          const img = srcCtx.getImageData(0, 0, GRID_W, GRID_H).data;

          const mw = latestMaskW,
            mh = latestMaskH;
          for (let gy = 0; gy < GRID_H; gy++) {
            for (let gx = 0; gx < GRID_W; gx++) {
              let mv = 0.0;
              if (mask) {
                const sx = Math.min(
                  mw - 1,
                  (((GRID_W - 1 - gx + 0.5) / GRID_W) * mw) | 0,
                );
                const sy = Math.min(mh - 1, (((gy + 0.5) / GRID_H) * mh) | 0);
                mv = mask[sy * mw + sx];
              }
              const gi = gy * GRID_W + gx;
              maskSmooth[gi] += (mv - maskSmooth[gi]) * 0.35;

              const di = gi * 4,
                si = gi * 4;
              /* Mild saturation boost — no quantization, smooth colors for fluid */
              let r = img[si],
                g = img[si + 1],
                b = img[si + 2];
              const avg = (r + g + b) / 3;
              const SAT = 1.15;
              r = Math.min(255, Math.max(0, avg + (r - avg) * SAT));
              g = Math.min(255, Math.max(0, avg + (g - avg) * SAT));
              b = Math.min(255, Math.max(0, avg + (b - avg) * SAT));
              personPix[di] = r;
              personPix[di + 1] = g;
              personPix[di + 2] = b;
              personPix[di + 3] =
                maskSmooth[gi] > 0.45 ? 255 : Math.floor(maskSmooth[gi] * 255);
            }
          }
          gl.bindTexture(gl.TEXTURE_2D, personTex);
          gl.texSubImage2D(
            gl.TEXTURE_2D,
            0,
            0,
            0,
            GRID_W,
            GRID_H,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            personPix,
          );

          /* Upload full-res frame for manga Sobel (raw, not mirrored) */
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            video,
          );

        }

        /* ---- Navier-Stokes fluid step ---- */
        function simStep(dt, totalTime) {
          const tx = 1 / SIM,
            ty = 1 / SIM;

          /* 1. Advect velocity */
          useFBO(vel.write);
          gl.useProgram(progAdvect);
          bindFBOTex(0, vel.read);
          gl.uniform1i(progAdvect.u.u_vel, 0);
          bindFBOTex(1, vel.read);
          gl.uniform1i(progAdvect.u.u_src, 1);
          gl.uniform1f(progAdvect.u.u_dt, dt);
          gl.uniform1f(progAdvect.u.u_dissipation, auraState.velDissipation);
          drawQuad();
          vel.swap();

          /* 2. Inject velocity — person silhouette drives outward aura blast */
          useFBO(vel.write);
          gl.useProgram(progInjectVel);
          bindFBOTex(0, vel.read);
          gl.uniform1i(progInjectVel.u.u_vel, 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, personTex);
          gl.uniform1i(progInjectVel.u.u_person, 1);
          gl.uniform1f(progInjectVel.u.u_time, totalTime);
          gl.uniform1f(progInjectVel.u.u_screenAR, innerWidth / innerHeight);
          gl.uniform1f(progInjectVel.u.u_camAR, vAspect);
          gl.uniform2f(
            progInjectVel.u.u_personTexel,
            1.0 / GRID_W,
            1.0 / GRID_H,
          );
          gl.uniform1f(progInjectVel.u.u_turbStrength, auraState.turbStrength);
          gl.uniform1f(
            progInjectVel.u.u_blastStrength,
            auraState.blastStrength,
          );
          gl.uniform1f(progInjectVel.u.u_riseStrength, auraState.riseStrength);
          drawQuad();
          vel.swap();

          /* 3. Mouse splat on velocity */
          if (Math.abs(M.dx) > 0.0001 || Math.abs(M.dy) > 0.0001) {
            useFBO(vel.write);
            gl.useProgram(progSplat);
            bindFBOTex(0, vel.read);
            gl.uniform1i(progSplat.u.u_base, 0);
            gl.uniform2f(progSplat.u.u_point, M.x, M.y);
            gl.uniform3f(progSplat.u.u_color, M.dx * 5.0, M.dy * 5.0, 0.0);
            gl.uniform1f(progSplat.u.u_r, 0.0018);
            drawQuad();
            vel.swap();
            M.dx = 0;
            M.dy = 0;
          }

          /* Hatsu burst — one-shot radial velocity explosion on 発 activation */
          if (burstFrames > 0) {
            burstFrames = 0;
            const N = 12,
              bStr = 0.14,
              bR = 0.004;
            for (let j = 0; j < N; j++) {
              const angle = (j / N) * Math.PI * 2;
              useFBO(vel.write);
              gl.useProgram(progSplat);
              bindFBOTex(0, vel.read);
              gl.uniform1i(progSplat.u.u_base, 0);
              gl.uniform2f(progSplat.u.u_point, 0.5, 0.45);
              gl.uniform3f(
                progSplat.u.u_color,
                Math.cos(angle) * bStr,
                Math.sin(angle) * bStr,
                0.0,
              );
              gl.uniform1f(progSplat.u.u_r, bR);
              drawQuad();
              vel.swap();
            }
          }

          /* Hatsu wrist — wild chaotic dual-vortex (inner CCW + outer CW = shear turbulence) */
          if (currentPreset === 'hatsu' && wristUV) {
            const wx = wristUV.x, wy = wristUV.y;
            const t = totalTime;
            // inner CCW ring — tight, fast, wobbles irregularly per-point
            for (let j = 0; j < 6; j++) {
              const angle = (j / 6) * Math.PI * 2 + t * 6.5 + Math.sin(t * (4.0 + j * 1.9)) * 1.6;
              const r = 0.013 + Math.sin(t * (5.5 + j * 2.3)) * 0.007;
              useFBO(vel.write);
              gl.useProgram(progSplat);
              bindFBOTex(0, vel.read);
              gl.uniform1i(progSplat.u.u_base, 0);
              gl.uniform2f(progSplat.u.u_point, wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
              gl.uniform3f(progSplat.u.u_color, -Math.sin(angle) * 0.40, Math.cos(angle) * 0.40, 0.0);
              gl.uniform1f(progSplat.u.u_r, 0.0020);
              drawQuad();
              vel.swap();
            }
            // outer CW ring — wider, opposite rotation, also fast
            for (let j = 0; j < 4; j++) {
              const angle = (j / 4) * Math.PI * 2 - t * 4.2 + Math.sin(t * (3.5 + j * 2.6)) * 1.4;
              const r = 0.030 + Math.sin(t * (4.5 + j * 1.9)) * 0.010;
              useFBO(vel.write);
              gl.useProgram(progSplat);
              bindFBOTex(0, vel.read);
              gl.uniform1i(progSplat.u.u_base, 0);
              gl.uniform2f(progSplat.u.u_point, wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
              gl.uniform3f(progSplat.u.u_color, Math.sin(angle) * 0.26, -Math.cos(angle) * 0.26, 0.0);
              gl.uniform1f(progSplat.u.u_r, 0.0025);
              drawQuad();
              vel.swap();
            }
          }

          /* 4. Advect dye — 0.978 gives ~2s trail for lingering aura */
          useFBO(dye.write);
          gl.useProgram(progAdvect);
          bindFBOTex(0, vel.read);
          gl.uniform1i(progAdvect.u.u_vel, 0);
          bindFBOTex(1, dye.read);
          gl.uniform1i(progAdvect.u.u_src, 1);
          gl.uniform1f(progAdvect.u.u_dt, dt);
          gl.uniform1f(progAdvect.u.u_dissipation, auraState.dyeDissipation);
          drawQuad();
          dye.swap();

          /* 5. Inject dye — person colour + aura glow at silhouette */
          useFBO(dye.write);
          gl.useProgram(progInjectDye);
          bindFBOTex(0, dye.read);
          gl.uniform1i(progInjectDye.u.u_dye, 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, personTex);
          gl.uniform1i(progInjectDye.u.u_person, 1);
          gl.uniform1f(progInjectDye.u.u_screenAR, innerWidth / innerHeight);
          gl.uniform1f(progInjectDye.u.u_camAR, vAspect);
          gl.uniform2f(
            progInjectDye.u.u_personTexel,
            1.0 / GRID_W,
            1.0 / GRID_H,
          );
          gl.uniform1f(progInjectDye.u.u_bodyInject, auraState.bodyInject);
          gl.uniform1f(progInjectDye.u.u_auraSat, auraState.auraSat);
          gl.uniform1f(progInjectDye.u.u_auraWhite, auraState.auraWhite);
          gl.uniform1f(
            progInjectDye.u.u_silhouetteInject,
            auraState.silhouetteInject,
          );
          drawQuad();
          dye.swap();

          /* Hatsu wrist — HDR dye: bright core + 5 irregular chaotic splats */
          if (currentPreset === 'hatsu' && wristUV) {
            const wx = wristUV.x, wy = wristUV.y;
            const t = totalTime;
            // bright core
            useFBO(dye.write);
            gl.useProgram(progSplat);
            bindFBOTex(0, dye.read);
            gl.uniform1i(progSplat.u.u_base, 0);
            gl.uniform2f(progSplat.u.u_point, wx, wy);
            gl.uniform3f(progSplat.u.u_color, 6.0, 3.5, 1.2);
            gl.uniform1f(progSplat.u.u_r, 0.0030);
            drawQuad();
            dye.swap();
            // 5 chaotic dye splats — each a distinct vivid hue
            const wristHues = [
              [1.0, 0.05, 0.02],  // blood red
              [1.0, 0.42, 0.00],  // vivid orange
              [1.0, 0.95, 0.10],  // golden yellow
              [0.55, 0.05, 1.0],  // electric purple
              [0.00, 0.70, 1.0],  // electric blue
            ];
            for (let k = 0; k < 5; k++) {
              const a  = (k / 5) * Math.PI * 2 + t * (8.0 + k * 2.8) + Math.sin(t * (5.5 + k * 2.1)) * 1.8;
              const dr = 0.010 + Math.sin(t * (6.5 + k * 2.5)) * 0.009;
              const s  = 4.5 + Math.sin(t * (5.5 + k * 2.2)) * 2.5;
              const cr = wristHues[k];
              useFBO(dye.write);
              gl.useProgram(progSplat);
              bindFBOTex(0, dye.read);
              gl.uniform1i(progSplat.u.u_base, 0);
              gl.uniform2f(progSplat.u.u_point, wx + Math.cos(a) * dr, wy + Math.sin(a) * dr);
              gl.uniform3f(progSplat.u.u_color, s * cr[0], s * cr[1], s * cr[2]);
              gl.uniform1f(progSplat.u.u_r, 0.0017);
              drawQuad();
              dye.swap();
            }
          }

          /* 6. Divergence */
          useFBO(divFBO);
          gl.useProgram(progDiv);
          bindFBOTex(0, vel.read);
          gl.uniform1i(progDiv.u.u_vel, 0);
          gl.uniform2f(progDiv.u.u_texel, tx, ty);
          drawQuad();

          /* 7. Pressure — Jacobi iterations */
          useFBO(pres.read);
          gl.clearColor(0, 0, 0, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
          for (let i = 0; i < 25; i++) {
            useFBO(pres.write);
            gl.useProgram(progPres);
            bindFBOTex(0, pres.read);
            gl.uniform1i(progPres.u.u_pres, 0);
            bindFBOTex(1, divFBO);
            gl.uniform1i(progPres.u.u_div, 1);
            gl.uniform2f(progPres.u.u_texel, tx, ty);
            drawQuad();
            pres.swap();
          }

          /* 8. Gradient subtract → divergence-free velocity */
          useFBO(vel.write);
          gl.useProgram(progGrad);
          bindFBOTex(0, vel.read);
          gl.uniform1i(progGrad.u.u_vel, 0);
          bindFBOTex(1, pres.read);
          gl.uniform1i(progGrad.u.u_pres, 1);
          gl.uniform2f(progGrad.u.u_texel, tx, ty);
          drawQuad();
          vel.swap();

          /* 9. Boundary conditions */
          useFBO(vel.write);
          gl.useProgram(progBoundary);
          bindFBOTex(0, vel.read);
          gl.uniform1i(progBoundary.u.u_vel, 0);
          gl.uniform2f(progBoundary.u.u_texel, tx, ty);
          drawQuad();
          vel.swap();
        }

        /* ---- Render to screen ---- */
        function render() {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, W, H);
          gl.clearColor(0.0, 0.0, 0.0, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);

          /* 1. Background: anime cel-shade + aura distortion (opaque) */
          gl.disable(gl.BLEND);
          gl.useProgram(progBackground);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.uniform1i(progBackground.u.u_video, 0);
          bindFBOTex(1, vel.read);
          gl.uniform1i(progBackground.u.u_vel, 1);
          gl.uniform2f(
            progBackground.u.u_videoTexel,
            1.0 / video.videoWidth,
            1.0 / video.videoHeight,
          );
          gl.uniform1f(progBackground.u.u_screenAR, innerWidth / innerHeight);
          gl.uniform1f(progBackground.u.u_camAR, vAspect);
          gl.uniform1f(progBackground.u.u_posterize, auraState.posterize);
          drawQuad();

          /* 2. Aura fluid — additive blend → particles accumulate into glow */
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
          gl.useProgram(progDisplay);
          bindFBOTex(0, dye.read);
          gl.uniform1i(progDisplay.u.u_dye, 0);
          bindFBOTex(1, vel.read);
          gl.uniform1i(progDisplay.u.u_vel, 1);
          gl.uniform1f(progDisplay.u.u_dpr, dpr);
          drawQuad();

          /* 3. Manga person overlay — normal alpha blend */
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          gl.useProgram(progManga);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.uniform1i(progManga.u.u_video, 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, personTex);
          gl.uniform1i(progManga.u.u_person, 1);
          gl.uniform2f(
            progManga.u.u_videoTexel,
            1.0 / video.videoWidth,
            1.0 / video.videoHeight,
          );
          gl.uniform1f(progManga.u.u_screenAR, innerWidth / innerHeight);
          gl.uniform1f(progManga.u.u_camAR, vAspect);
          gl.uniform1f(progManga.u.u_range,       auraState.mangaRange);
          gl.uniform1f(progManga.u.u_personSat,   auraState.personSat);
          gl.uniform1f(progManga.u.u_personAlpha, auraState.personAlpha);
          gl.uniform1f(progManga.u.u_posterize,   auraState.posterize);
          drawQuad();

          gl.disable(gl.BLEND);
        }

        /* ---- Main loop ---- */
        let last = performance.now();
        let totalTime = 0;

        function frame(now) {
          const dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          totalTime += dt;

          if (video.currentTime !== lastVideoT) {
            updatePerson(now);
            lastVideoT = video.currentTime;
          }

          lerpState(dt);
          simStep(dt, totalTime);
          render();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
    </script>
  </body>
</html>
