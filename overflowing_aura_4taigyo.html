const personTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,personTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,GRID_W,GRID_H,0,gl.RGBA,gl.UNSIGNED_BYTE,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

const dpr=Math.min(devicePixelRatio||1,2);let W=0,H=0;
function resize(){W=Math.round(innerWidth*dpr);H=Math.round(innerHeight*dpr);glc.width=W;glc.height=H;gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);}
addEventListener("resize",resize);resize();
const M={x:0.5,y:0.5,dx:0,dy:0};
function onMove(cx,cy,pcx,pcy){M.x=cx/innerWidth;M.y=1.0-cy/innerHeight;M.dx=(cx-pcx)/innerWidth;M.dy=-(cy-pcy)/innerHeight;}
let prevMX=null,prevMY=null;
glc.addEventListener("mousemove",(e)=>{if(prevMX===null){prevMX=e.clientX;prevMY=e.clientY;}onMove(e.clientX,e.clientY,prevMX,prevMY);prevMX=e.clientX;prevMY=e.clientY;});

let prevTX=null,prevTY=null;
glc.addEventListener("touchmove",(e)=>{e.preventDefault();const t=e.touches[0];if(prevTX===null){prevTX=t.clientX;prevTY=t.clientY;}onMove(t.clientX,t.clientY,prevTX,prevTY);prevTX=t.clientX;prevTY=t.clientY;},{passive:false});
glc.addEventListener("touchend",()=>{prevTX=null;prevTY=null;});
let lastVideoT=-1;
function updatePerson(now){if(video.readyState<2)return;let mask=null;try{const res=segmenter.segmentForVideo(video,now);if(res?.confidenceMasks?.[0]){mask=res.confidenceMasks[0].getAsFloat32Array();res.close?.();}}catch{}
srcCtx.save();srcCtx.scale(-1,1);srcCtx.drawImage(video,-GRID_W,0,GRID_W,GRID_H);srcCtx.restore();const img=srcCtx.getImageData(0,0,GRID_W,GRID_H).data;
const mw=video.videoWidth,mh=video.videoHeight;
for(let gy=0;gy<GRID_H;gy++){for(let gx=0;gx<GRID_W;gx++){let mv=0.0;if(mask){const sx=Math.min(mw-1,(((GRID_W-1-gx+0.5)/GRID_W)*mw)|0);const sy=Math.min(mh-1,(((gy+0.5)/GRID_H)*mh)|0);mv=mask[sy*mw+sx];}const gi=gy*GRID_W+gx;maskSmooth[gi]+=(mv-maskSmooth[gi])*0.35;const di=gi*4,si=gi*4;let r=img[si],g=img[si+1],b=img[si+2];const avg=(r+g+b)/3;const SAT=1.15;r=Math.min(255,Math.max(0,avg+(r-avg)*SAT));g=Math.min(255,Math.max(0,avg+(g-avg)*SAT));b=Math.min(255,Math.max(0,avg+(b-avg)*SAT));personPix[di]=r;personPix[di+1]=g;personPix[di+2]=b;personPix[di+3]=maskSmooth[gi]>0.45?255:Math.floor(maskSmooth[gi]*255);}}

gl.bindTexture(gl.TEXTURE_2D,videoTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);}
function simStep(dt,totalTime){const tx=1/SIM,ty=1/SIM;
useFBO(vel.write);gl.useProgram(progAdvect);bindFBOTex(0,vel.read);gl.uniform1i(progAdvect.u.u_vel,0);bindFBOTex(1,vel.read);gl.uniform1i(progAdvect.u.u_src,1);gl.uniform1f(progAdvect.u.u_dt,dt);gl.uniform1f(progAdvect.u.u_dissipation,auraState.velDissipation);drawQuad();vel.swap();
useFBO(vel.write);gl.useProgram(progInjectVel);bindFBOTex(0,vel.read);gl.uniform1i(progInjectVel.u.u_vel,0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,personTex);gl.uniform1i(progInjectVel.u.u_person,1);gl.uniform1f(progInjectVel.u.u_time,totalTime);gl.uniform1f(progInjectVel.u.u_screenAR,innerWidth/innerHeight);gl.uniform1f(progInjectVel.u.u_camAR,vAspect);gl.uniform2f(progInjectVel.u.u_personTexel,1.0/GRID_W,1.0/GRID_H);gl.uniform1f(progInjectVel.u.u_turbStrength,auraState.turbStrength);gl.uniform1f(progInjectVel.u.u_blastStrength,auraState.blastStrength);gl.uniform1f(progInjectVel.u.u_riseStrength,auraState.riseStrength);drawQuad();vel.swap();
if(Math.abs(M.dx)>0.0001||Math.abs(M.dy)>0.0001){useFBO(vel.write);gl.useProgram(progSplat);bindFBOTex(0,vel.read);gl.uniform1i(progSplat.u.u_base,0);gl.uniform2f(progSplat.u.u_point,M.x,M.y);gl.uniform3f(progSplat.u.u_color,M.dx*5.0,M.dy*5.0,0.0);gl.uniform1f(progSplat.u.u_r,0.0018);drawQuad();vel.swap();M.dx=0;M.dy=0;}
if(burstFrames>0){burstFrames=0;const N=12,bStr=0.14,bR=0.004;for(let j=0;j<N;j++){const angle=(j/N)*Math.PI*2;useFBO(vel.write);gl.useProgram(progSplat);bindFBOTex(0,vel.read);gl.uniform1i(progSplat.u.u_base,0);gl.uniform2f(progSplat.u.u_point,0.5,0.45);gl.uniform3f(progSplat.u.u_color,Math.cos(angle)*bStr,Math.sin(angle)*bStr,0.0);gl.uniform1f(progSplat.u.u_r,bR);drawQuad();vel.swap();}}
useFBO(dye.write);gl.useProgram(progAdvect);bindFBOTex(0,vel.read);gl.uniform1i(progAdvect.u.u_vel,0);bindFBOTex(1,dye.read);gl.uniform1i(progAdvect.u.u_src,1);gl.uniform1f(progAdvect.u.u_dt,dt);gl.uniform1f(progAdvect.u.u_dissipation,auraState.dyeDissipation);drawQuad();dye.swap();
useFBO(dye.write);gl.useProgram(progInjectDye);bindFBOTex(0,dye.read);gl.uniform1i(progInjectDye.u.u_dye,0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,personTex);gl.uniform1i(progInjectDye.u.u_person,1);gl.uniform1f(progInjectDye.u.u_screenAR,innerWidth/innerHeight);gl.uniform1f(progInjectDye.u.u_camAR,vAspect);gl.uniform2f(progInjectDye.u.u_personTexel,1.0/GRID_W,1.0/GRID_H);gl.uniform1f(progInjectDye.u.u_bodyInject,auraState.bodyInject);gl.uniform1f(progInjectDye.u.u_auraSat,auraState.auraSat);gl.uniform1f(progInjectDye.u.u_auraWhite,auraState.auraWhite);gl.uniform1f(progInjectDye.u.u_silhouetteInject,auraState.silhouetteInject);drawQuad();dye.swap();

function render(){gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.clearColor(0.0,0.0,0.0,1.0);gl.clear(gl.COLOR_BUFFER_BIT);

let last=performance.now(),totalTime=0;
function frame(now){const dt=Math.min((now-last)/1000,0.05);last=now;totalTime+=dt;if(video.currentTime!==lastVideoT){updatePerson(now);lastVideoT=video.currentTime;}lerpState(dt);simStep(dt,totalTime);render();requestAnimationFrame(frame);}
