<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水墨 — FLUID INK</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f0e8;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .hint {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 0.32em;
        color: #9a9590;
        user-select: none;
        pointer-events: none;
        transition: opacity 2.5s ease;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        white-space: nowrap;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f0e8;
        z-index: 10;
        transition: opacity 0.8s ease;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 11px;
        letter-spacing: 0.3em;
        color: #9a9590;
      }
      #loading.hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="loading">読み込み中 ...</div>
    <div class="hint" id="hint">CLICK · DRAG · MOVE</div>

    <script type="module">
      /* ================================================================
       WebGL2 Fluid Ink — Sumi-e interactive
       ================================================================ */

      const SIM = 256; // velocity / pressure grid

      const glc = document.getElementById("gl");
      const gl = glc.getContext("webgl2", {
        antialias: false,
        alpha: false,
        depth: false,
        preserveDrawingBuffer: false,
      });
      if (!gl) {
        alert("WebGL2 not supported");
        throw 0;
      }
      if (!gl.getExtension("EXT_color_buffer_float")) {
        alert("Float textures not supported");
        throw 0;
      }

      /* ----------------------------------------------------------------
       SHADERS
    ---------------------------------------------------------------- */

      const vsQuad = `#version 300 es
layout(location=0) in vec2 a_pos;
out vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

      /* Semi-Lagrangian advection */
      const fsAdvect = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform sampler2D u_src;
uniform float u_dt;
uniform float u_dissipation;
out vec4 o;
void main() {
  vec2 vel = texture(u_vel, v_uv).xy;
  vec2 uv  = clamp(v_uv - vel * u_dt, 0.0, 1.0);
  o = texture(u_src, uv) * u_dissipation;
}`;

      /* Divergence */
      const fsDiv = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform vec2 u_texel;
out vec4 o;
void main() {
  float l = texture(u_vel, v_uv - vec2(u_texel.x,0)).x;
  float r = texture(u_vel, v_uv + vec2(u_texel.x,0)).x;
  float b = texture(u_vel, v_uv - vec2(0,u_texel.y)).y;
  float t = texture(u_vel, v_uv + vec2(0,u_texel.y)).y;
  o = vec4((r-l+t-b)*0.5, 0.0, 0.0, 1.0);
}`;

      /* Jacobi pressure */
      const fsPres = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_pres;
uniform sampler2D u_div;
uniform vec2 u_texel;
out vec4 o;
void main() {
  float l = texture(u_pres, v_uv - vec2(u_texel.x,0)).x;
  float r = texture(u_pres, v_uv + vec2(u_texel.x,0)).x;
  float b = texture(u_pres, v_uv - vec2(0,u_texel.y)).x;
  float t = texture(u_pres, v_uv + vec2(0,u_texel.y)).x;
  float d = texture(u_div, v_uv).x;
  o = vec4((l+r+b+t-d)*0.25, 0.0, 0.0, 1.0);
}`;

      /* Gradient subtract */
      const fsGrad = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform sampler2D u_pres;
uniform vec2 u_texel;
out vec4 o;
void main() {
  float l = texture(u_pres, v_uv - vec2(u_texel.x,0)).x;
  float r = texture(u_pres, v_uv + vec2(u_texel.x,0)).x;
  float b = texture(u_pres, v_uv - vec2(0,u_texel.y)).x;
  float t = texture(u_pres, v_uv + vec2(0,u_texel.y)).x;
  vec2 vel = texture(u_vel, v_uv).xy;
  o = vec4(vel - vec2(r-l, t-b)*0.5, 0.0, 1.0);
}`;

      /* Soft boundary */
      const fsBoundary = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform vec2 u_texel;
out vec4 o;
void main() {
  vec2 v = texture(u_vel, v_uv).xy;
  if (v_uv.x < u_texel.x)       v.x =  abs(v.x) * 0.18;
  if (v_uv.x > 1.0-u_texel.x)   v.x = -abs(v.x) * 0.18;
  if (v_uv.y < u_texel.y)       v.y =  abs(v.y) * 0.18;
  if (v_uv.y > 1.0-u_texel.y)   v.y = -abs(v.y) * 0.18;
  o = vec4(v, 0.0, 1.0);
}`;

      /* Gaussian splat — adds to velocity or dye */
      const fsSplat = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_base;
uniform vec2 u_point;
uniform vec3 u_color;
uniform float u_r;
out vec4 o;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p);
  f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}

void main() {
  vec2 d = v_uv - u_point;
  float sp = exp(-dot(d,d) / u_r);

  /* ムラ: 複数スケールのノイズで不均一な筆触れを再現 */
  vec2 seed = u_point * 37.3;
  float n1 = vnoise(v_uv * 45.0  + seed);           /* 大きな塊 */
  float n2 = vnoise(v_uv * 120.0 + seed * 2.1);     /* 中くらいのムラ */
  float n3 = vnoise(v_uv * 280.0 + seed * 5.7);     /* 細かい繊維感 */
  float mura = n1*0.55 + n2*0.30 + n3*0.15;
  mura = smoothstep(0.15, 0.85, mura);              /* コントラスト強調 */

  o = texture(u_base, v_uv) + vec4(u_color * sp * mura, 0.0);
}`;

      /* Ambient turbulence injection into velocity */
      const fsTurb = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_vel;
uniform float u_time;
uniform float u_strength;
out vec4 o;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i=floor(p); vec2 f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
void main() {
  vec2 vel = texture(u_vel, v_uv).xy;
  float t = u_time * 0.025;
  float nx = vnoise(v_uv*3.5 + vec2(t, 0.0))      - 0.5;
  float ny = vnoise(v_uv*3.5 + vec2(37.2, t+51.8)) - 0.5;
  vel += vec2(nx, ny) * u_strength;
  o = vec4(vel, 0.0, 1.0);
}`;

      /* Source inject — blend source image into dye buffer.
       Both u_dye and u_src are in the same dye UV space (image AR). */
      const fsInjectSrc = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_dye;
uniform sampler2D u_src;
uniform float u_strength;
out vec4 o;
void main() {
  vec3 dye = texture(u_dye, v_uv).rgb;
  vec3 src = texture(u_src, v_uv).rgb;
  /* luminance → ink density (white=0, black=1) */
  float lum = dot(src, vec3(0.2126, 0.7152, 0.0722));
  float target = 1.0 - lum;
  vec3 tgt = vec3(target);
  o = vec4(mix(dye, tgt, u_strength), 1.0);
}`;

      /* Display — ink on paper, with contain mapping dye→screen */
      const fsDisplay = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_dye;
uniform float u_dyeAR;    /* dye texture aspect ratio (W/H) */
uniform float u_screenAR; /* screen aspect ratio */
out vec4 o;

vec2 screenToDye(vec2 uv) {
  if (u_screenAR > u_dyeAR) {
    /* pillarbox: image fills height */
    float frac = u_dyeAR / u_screenAR;
    float border = (1.0 - frac) * 0.5;
    return vec2((uv.x - border) / frac, uv.y);
  } else {
    /* letterbox: image fills width */
    float frac = u_screenAR / u_dyeAR;
    float border = (1.0 - frac) * 0.5;
    return vec2(uv.x, (uv.y - border) / frac);
  }
}

void main() {
  vec3 paper = vec3(0.962, 0.948, 0.923);
  vec3 ink   = vec3(0.050, 0.044, 0.060);

  vec2 dyeUV = screenToDye(v_uv);
  bool inBounds = dyeUV.x >= 0.0 && dyeUV.x <= 1.0
               && dyeUV.y >= 0.0 && dyeUV.y <= 1.0;

  if (!inBounds) { o = vec4(paper, 1.0); return; }

  float density = clamp(texture(u_dye, dyeUV).r, 0.0, 1.0);
  /* non-linear tone: faint washes look like diluted ink */
  float d = pow(density, 0.65);
  o = vec4(mix(paper, ink, d), 1.0);
}`;

      /* ----------------------------------------------------------------
       GL HELPERS
    ---------------------------------------------------------------- */

      function mkShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          throw new Error(gl.getShaderInfoLog(s));
        return s;
      }

      function mkProg(fs) {
        const p = gl.createProgram();
        gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vsQuad));
        gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS))
          throw new Error(gl.getProgramInfoLog(p));
        p.u = {};
        const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
        for (let i = 0; i < n; i++) {
          const { name } = gl.getActiveUniform(p, i);
          p.u[name] = gl.getUniformLocation(p, name);
        }
        return p;
      }

      const quadVAO = gl.createVertexArray();
      gl.bindVertexArray(quadVAO);
      {
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW,
        );
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      }
      gl.bindVertexArray(null);

      function drawQuad() {
        gl.bindVertexArray(quadVAO);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.bindVertexArray(null);
      }

      function mkFBO(w, h) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA16F,
          w,
          h,
          0,
          gl.RGBA,
          gl.HALF_FLOAT,
          null,
        );
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(
          gl.FRAMEBUFFER,
          gl.COLOR_ATTACHMENT0,
          gl.TEXTURE_2D,
          tex,
          0,
        );
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { tex, fb, w, h };
      }

      function mkDouble(w, h) {
        const fbos = [mkFBO(w, h), mkFBO(w, h)];
        let idx = 0;
        return {
          get read() {
            return fbos[idx];
          },
          get write() {
            return fbos[1 - idx];
          },
          swap() {
            idx = 1 - idx;
          },
        };
      }

      function useFBO(fbo) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fb);
        gl.viewport(0, 0, fbo.w, fbo.h);
      }

      function bindFBOTex(unit, fbo) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, fbo.tex);
      }

      function bindTex(unit, tex) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, tex);
      }

      /* ----------------------------------------------------------------
       LOAD SOURCE IMAGE
    ---------------------------------------------------------------- */

      async function loadImg(src) {
        return new Promise((res, rej) => {
          const img = new Image();
          img.onload = () => res(img);
          img.onerror = rej;
          img.src = src;
        });
      }

      const srcImage = await loadImg("/src/suibokuga.png");
      const IMG_W = srcImage.naturalWidth;
      const IMG_H = srcImage.naturalHeight;
      const IMG_AR = IMG_W / IMG_H;

      /* DYE texture size: match image aspect ratio, max 1024 on longest side */
      const MAX_DYE = 1024;
      let DYE_W, DYE_H;
      if (IMG_W >= IMG_H) {
        DYE_W = MAX_DYE;
        DYE_H = Math.round(MAX_DYE / IMG_AR);
      } else {
        DYE_H = MAX_DYE;
        DYE_W = Math.round(MAX_DYE * IMG_AR);
      }

      /* Upload source as GPU texture (same size as DYE for 1:1 sampling) */
      const offscreen = document.createElement("canvas");
      offscreen.width = DYE_W;
      offscreen.height = DYE_H;
      offscreen.getContext("2d").drawImage(srcImage, 0, 0, DYE_W, DYE_H);

      const srcTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, srcTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        offscreen,
      );
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      /* ----------------------------------------------------------------
       COMPILE PROGRAMS
    ---------------------------------------------------------------- */

      const progAdvect = mkProg(fsAdvect);
      const progDiv = mkProg(fsDiv);
      const progPres = mkProg(fsPres);
      const progGrad = mkProg(fsGrad);
      const progBoundary = mkProg(fsBoundary);
      const progSplat = mkProg(fsSplat);
      const progInjectSrc = mkProg(fsInjectSrc);
      const progDisplay = mkProg(fsDisplay);

      /* ----------------------------------------------------------------
       FBOs
    ---------------------------------------------------------------- */

      const vel = mkDouble(SIM, SIM);
      const dye = mkDouble(DYE_W, DYE_H);
      const pres = mkDouble(SIM, SIM);
      const divFBO = mkFBO(SIM, SIM);

      /* ----------------------------------------------------------------
       CANVAS RESIZE
    ---------------------------------------------------------------- */

      const dpr = Math.min(devicePixelRatio || 1, 2);
      let W = 0,
        H = 0;
      function resize() {
        W = Math.round(innerWidth * dpr);
        H = Math.round(innerHeight * dpr);
        glc.width = W;
        glc.height = H;
      }
      addEventListener("resize", resize);
      resize();

      /* ----------------------------------------------------------------
       INITIALISE DYE FROM SOURCE (full strength)
    ---------------------------------------------------------------- */

      function fillDye(strength) {
        for (let pass = 0; pass < 2; pass++) {
          useFBO(dye.write);
          gl.useProgram(progInjectSrc);
          bindFBOTex(0, dye.read);
          gl.uniform1i(progInjectSrc.u.u_dye, 0);
          bindTex(1, srcTex);
          gl.uniform1i(progInjectSrc.u.u_src, 1);
          gl.uniform1f(progInjectSrc.u.u_strength, strength);
          drawQuad();
          dye.swap();
        }
      }
      fillDye(1.0);

      /* ----------------------------------------------------------------
       INTERACTION STATE
    ---------------------------------------------------------------- */

      /* Convert screen UV (y-up) → dye UV.
       Dye AR = IMG_AR; screen AR varies. */
      function screenToDyeUV(sx, sy) {
        const sa = innerWidth / innerHeight;
        const da = IMG_AR;
        if (sa > da) {
          const frac = da / sa;
          const border = (1 - frac) * 0.5;
          return { x: (sx - border) / frac, y: sy };
        } else {
          const frac = sa / da;
          const border = (1 - frac) * 0.5;
          return { x: sx, y: (sy - border) / frac };
        }
      }

      /* Scale a screen-space delta → dye-space delta */
      function screenDeltaToDye(sdx, sdy) {
        const sa = innerWidth / innerHeight;
        const da = IMG_AR;
        if (sa > da) return { x: (sdx * sa) / da, y: sdy };
        else return { x: sdx, y: (sdy * da) / sa };
      }

      const M = { dx: 0, dy: 0, sx: 0.5, sy: 0.5, down: false, click: false };
      /* Dye-space position */
      const Md = { x: 0.5, y: 0.5 };

      let prevMX = null,
        prevMY = null;

      function onMove(cx, cy, pcx, pcy) {
        const sx = cx / innerWidth;
        const sy = 1 - cy / innerHeight;
        const psx = (pcx ?? cx) / innerWidth;
        const psy = 1 - (pcy ?? cy) / innerHeight;
        const d = screenToDyeUV(sx, sy);
        Md.x = d.x;
        Md.y = d.y;
        const dd = screenDeltaToDye(sx - psx, sy - psy);
        M.dx = dd.x;
        M.dy = dd.y;
      }

      glc.addEventListener("mousemove", (e) => {
        onMove(e.clientX, e.clientY, prevMX, prevMY);
        prevMX = e.clientX;
        prevMY = e.clientY;
        lastInteract = totalTime;
      });
      glc.addEventListener("mouseleave", () => {
        prevMX = null;
        prevMY = null;
        M.dx = 0;
        M.dy = 0;
      });
      glc.addEventListener("mousedown", (e) => {
        M.down = true;
        M.click = true;
        prevMX = e.clientX;
        prevMY = e.clientY;
        lastInteract = totalTime;
      });
      glc.addEventListener("mouseup", () => {
        M.down = false;
      });

      glc.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          const t = e.touches[0];
          onMove(t.clientX, t.clientY, prevMX, prevMY);
          prevMX = t.clientX;
          prevMY = t.clientY;
          lastInteract = totalTime;
        },
        { passive: false },
      );
      glc.addEventListener(
        "touchstart",
        (e) => {
          const t = e.touches[0];
          M.down = true;
          M.click = true;
          prevMX = t.clientX;
          prevMY = t.clientY;
          onMove(t.clientX, t.clientY, null, null);
          lastInteract = totalTime;
        },
        { passive: true },
      );
      glc.addEventListener("touchend", () => {
        M.down = false;
        prevMX = null;
        prevMY = null;
      });

      /* ----------------------------------------------------------------
       SPLAT HELPERS (all in dye UV space)
    ---------------------------------------------------------------- */

      function splatVel(x, y, dx, dy, r) {
        useFBO(vel.write);
        gl.useProgram(progSplat);
        bindFBOTex(0, vel.read);
        gl.uniform1i(progSplat.u.u_base, 0);
        gl.uniform2f(progSplat.u.u_point, x, y);
        gl.uniform3f(progSplat.u.u_color, dx, dy, 0.0);
        gl.uniform1f(progSplat.u.u_r, r);
        drawQuad();
        vel.swap();
      }

      function splatDye(x, y, density, r) {
        useFBO(dye.write);
        gl.useProgram(progSplat);
        bindFBOTex(0, dye.read);
        gl.uniform1i(progSplat.u.u_base, 0);
        gl.uniform2f(progSplat.u.u_point, x, y);
        gl.uniform3f(progSplat.u.u_color, density, density, density);
        gl.uniform1f(progSplat.u.u_r, r);
        drawQuad();
        dye.swap();
      }

      /* ----------------------------------------------------------------
       RENDER LOOP
    ---------------------------------------------------------------- */

      document.getElementById("loading").classList.add("hide");
      setTimeout(
        () => (document.getElementById("hint").style.opacity = 0),
        5000,
      );

      let totalTime = 0;
      let prevT = null;
      let lastInteract = -100;

      function frame(ts) {
        requestAnimationFrame(frame);

        if (prevT === null) prevT = ts;
        const dt = Math.min((ts - prevT) / 1000.0, 0.033);
        prevT = ts;
        totalTime += dt;

        const screenAR = innerWidth / innerHeight;
        const tx = 1 / SIM,
          ty = 1 / SIM;

        const isIdle = totalTime - lastInteract > 3.0;
        const velDiss = 0.978;
        const dyeDiss = 1.0;

        /* ---- 1. Advect velocity ---- */
        useFBO(vel.write);
        gl.useProgram(progAdvect);
        bindFBOTex(0, vel.read);
        gl.uniform1i(progAdvect.u.u_vel, 0);
        bindFBOTex(1, vel.read);
        gl.uniform1i(progAdvect.u.u_src, 1);
        gl.uniform1f(progAdvect.u.u_dt, dt);
        gl.uniform1f(progAdvect.u.u_dissipation, velDiss);
        drawQuad();
        vel.swap();

        /* ---- 2. Mouse / touch interaction ---- */
        if (M.click) {
          M.click = false;
          /* 水面への一滴: 密な芯 + 淡い暈かし + 穏やかな波紋 */
          /* 水面への一滴: 元の絵のトーンに合わせた薄いグレー */
          splatDye(Md.x, Md.y, 0.22, 0.00022); // 芯
          splatDye(Md.x, Md.y, 0.08, 0.001); // 中ハロー
          splatDye(Md.x, Md.y, 0.025, 0.0038); // 外縁
          /* 飛び散り: ランダムな小滴 */
          for (let j = 0; j < 6; j++) {
            const a = Math.random() * Math.PI * 2;
            const dist = 0.005 + Math.random() * 0.012;
            splatDye(
              Md.x + Math.cos(a) * dist,
              Md.y + Math.sin(a) * dist,
              0.06 + Math.random() * 0.1,
              0.00006 + Math.random() * 0.00018,
            );
          }
          /* 波紋: 内→外 2リングで自然な広がり */
          const N = 10,
            r1 = 0.0016,
            r2 = 0.0028;
          for (let j = 0; j < N; j++) {
            const a = (j / N) * Math.PI * 2;
            splatVel(Md.x, Md.y, Math.cos(a) * 0.03, Math.sin(a) * 0.03, r1);
            splatVel(Md.x, Md.y, Math.cos(a) * 0.018, Math.sin(a) * 0.018, r2);
          }
        } else if (M.down) {
          /* 連続垂らし: 薄い筆跡 + 流れる速度 */
          if (Math.abs(M.dx) > 0.00005 || Math.abs(M.dy) > 0.00005) {
            splatDye(Md.x, Md.y, 0.14, 0.0003);
            splatDye(Md.x, Md.y, 0.05, 0.0013);
            splatVel(Md.x, Md.y, M.dx * 4.5, M.dy * 4.5, 0.0016);
            M.dx = 0;
            M.dy = 0;
          }
        } else if (Math.abs(M.dx) > 0.0001 || Math.abs(M.dy) > 0.0001) {
          /* 移動: 軽い波紋だけ、dye は変えない */
          splatVel(Md.x, Md.y, M.dx * 3.0, M.dy * 3.0, 0.0018);
          M.dx = 0;
          M.dy = 0;
        }

        /* ---- 5. Advect dye ---- */
        useFBO(dye.write);
        gl.useProgram(progAdvect);
        bindFBOTex(0, vel.read);
        gl.uniform1i(progAdvect.u.u_vel, 0);
        bindFBOTex(1, dye.read);
        gl.uniform1i(progAdvect.u.u_src, 1);
        gl.uniform1f(progAdvect.u.u_dt, dt);
        gl.uniform1f(progAdvect.u.u_dissipation, dyeDiss);
        drawQuad();
        dye.swap();

        /* ---- 5b. Source injection — idle 後にゆっくり元の絵に戻す ---- */
        if (isIdle) {
          useFBO(dye.write);
          gl.useProgram(progInjectSrc);
          bindFBOTex(0, dye.read);
          gl.uniform1i(progInjectSrc.u.u_dye, 0);
          bindTex(1, srcTex);
          gl.uniform1i(progInjectSrc.u.u_src, 1);
          gl.uniform1f(progInjectSrc.u.u_strength, 0.016);
          drawQuad();
          dye.swap();
        }

        /* ---- 6. Divergence ---- */
        useFBO(divFBO);
        gl.useProgram(progDiv);
        bindFBOTex(0, vel.read);
        gl.uniform1i(progDiv.u.u_vel, 0);
        gl.uniform2f(progDiv.u.u_texel, tx, ty);
        drawQuad();

        /* ---- 7. Pressure — Jacobi iterations ---- */
        useFBO(pres.read);
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        for (let i = 0; i < 22; i++) {
          useFBO(pres.write);
          gl.useProgram(progPres);
          bindFBOTex(0, pres.read);
          gl.uniform1i(progPres.u.u_pres, 0);
          bindFBOTex(1, divFBO);
          gl.uniform1i(progPres.u.u_div, 1);
          gl.uniform2f(progPres.u.u_texel, tx, ty);
          drawQuad();
          pres.swap();
        }

        /* ---- 8. Gradient subtract → divergence-free ---- */
        useFBO(vel.write);
        gl.useProgram(progGrad);
        bindFBOTex(0, vel.read);
        gl.uniform1i(progGrad.u.u_vel, 0);
        bindFBOTex(1, pres.read);
        gl.uniform1i(progGrad.u.u_pres, 1);
        gl.uniform2f(progGrad.u.u_texel, tx, ty);
        drawQuad();
        vel.swap();

        /* ---- 9. Boundary ---- */
        useFBO(vel.write);
        gl.useProgram(progBoundary);
        bindFBOTex(0, vel.read);
        gl.uniform1i(progBoundary.u.u_vel, 0);
        gl.uniform2f(progBoundary.u.u_texel, tx, ty);
        drawQuad();
        vel.swap();

        /* ---- 10. Render to screen ---- */
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, W, H);
        gl.disable(gl.BLEND);
        gl.useProgram(progDisplay);
        bindFBOTex(0, dye.read);
        gl.uniform1i(progDisplay.u.u_dye, 0);
        gl.uniform1f(progDisplay.u.u_dyeAR, IMG_AR);
        gl.uniform1f(progDisplay.u.u_screenAR, screenAR);
        drawQuad();
      }

      requestAnimationFrame(frame);
    </script>
  </body>
</html>
