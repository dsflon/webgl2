        }
        window.addEventListener("resize", resize, { passive: true });

        function bindTexture(unit, texture) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, texture);
        }
        function renderPass(target, program, setup) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
          gl.viewport(0, 0, target ? target.width : canvas.width,
            target ? target.height : canvas.height);
          gl.useProgram(program);
          setup();
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        function blurPass(src, tmp, dst, sigma) {
          renderPass(tmp, programs.blur, () => {
            bindTexture(0, src.tex);
            gl.uniform1i(locations.blur.uSrc, 0);
            gl.uniform2f(locations.blur.uDir, 1 / tmp.width, 0);
            gl.uniform1f(locations.blur.uSigma, sigma);
          });
          renderPass(dst, programs.blur, () => {
            bindTexture(0, tmp.tex);
            gl.uniform1i(locations.blur.uSrc, 0);
            gl.uniform2f(locations.blur.uDir, 0, 1 / dst.height);
            gl.uniform1f(locations.blur.uSigma, sigma);
          });
        }

        // True GPU sync — a 1×1 readPixels. gl.finish() is effectively
        // non-blocking under swiftshader; without this the prewarm work
        // queues up and stalls the compositor for tens of seconds (CRAFT §C4).
        const syncPx = new Uint8Array(4);
        function glSync() {
          gl.bindFramebuffer(gl.FRAMEBUFFER, targets.stats.fbo);
          gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, syncPx);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        }

        /* ------------------------------------------------------------------
           Quantile thresholds (CPU side of invariant 1). A 128×128 stats
           target is read back every ~200 ms (never per frame), weighted
           histograms per class → quantiles → dead-zone hysteresis + EMA →
           uniform arrays. Thresholds keep a minimum separation so bands
           never swap or collapse (invariant 5).
        ------------------------------------------------------------------ */

        const BINS = 64;
        const statsBuf = new Uint8Array(STATS_RES * STATS_RES * 4);
        const histFace = new Float32Array(BINS);
        const histBody = new Float32Array(BINS);
        const histCloth = new Float32Array(BINS);
        const histHair = new Float32Array(BINS);
        const histSkin = new Float32Array(BINS);
        const MIN_W = 14;          // min class weight before quantiles count
        const DEAD = 0.006;        // hysteresis dead zone
        const MIN_GAP = 0.012;     // min threshold separation

        const TH = {
          skin: new Float32Array(7),
          face: new Float32Array(11),
          cloth: new Float32Array(5),
          skinN: 6,
          faceN: 10,
          clothN: 4,
          faceDark: 0.16,
          lipA: 0.10,
          hairQ: new Float32Array([0.14, 0.22, 0.32]),
          seeded: false,
        };
        const cov = { hair: 0, face: 0, body: 0, cloth: 0 };

        function counts() {
          return {
            skinN: Math.min(8, 4 + Math.round(state.layers * 4)),
            faceN: Math.min(10, 4 + Math.round(state.detail * 5)),
            clothN: Math.min(6, 3 + Math.round(state.layers * 3)),
          };
        }
        function seedEven(arr, n, lo, hi) {
          for (let i = 0; i < n - 1; i++) {
            arr[i] = lo + ((hi - lo) * (i + 1)) / n;
          }
        }
        seedEven(TH.skin, TH.skinN, 0.18, 0.8);
        seedEven(TH.face, TH.faceN, 0.14, 0.85);
        seedEven(TH.cloth, TH.clothN, 0.15, 0.7);

        function quantileOf(hist, wsum, q) {
          if (wsum < MIN_W) return null;
          const target = wsum * q;
          let acc = 0;
          for (let i = 0; i < BINS; i++) {
            const next = acc + hist[i];
            if (next >= target) {
              const f = hist[i] > 0 ? (target - acc) / hist[i] : 0.5;
              return (i + f) / BINS;
            }
            acc = next;
          }
          return 1;
        }
        function smoothScalar(cur, target, k) {
          if (target === null) return cur;
          if (!TH.seeded) return target;
          if (Math.abs(target - cur) < DEAD) return cur;
          return cur + (target - cur) * k;
        }
        function updateArray(arr, n, hist, wsum, k, snap) {
          for (let i = 0; i < n - 1; i++) {
            const t = quantileOf(hist, wsum, (i + 1) / n);
            if (t === null) continue;
            arr[i] = snap || !TH.seeded ? t : smoothScalar(arr[i], t, k);
          }
          for (let i = 1; i < n - 1; i++) {
            if (arr[i] < arr[i - 1] + MIN_GAP) arr[i] = arr[i - 1] + MIN_GAP;
          }
        }

        // dtStat = seconds since the previous stats update (real or simulated)
        function updateThresholds(dtStat) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, targets.stats.fbo);
          gl.readPixels(0, 0, STATS_RES, STATS_RES, gl.RGBA, gl.UNSIGNED_BYTE, statsBuf);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);

          histFace.fill(0); histBody.fill(0); histCloth.fill(0); histHair.fill(0);
          let wFace = 0, wBody = 0, wCloth = 0, wHair = 0;
          let aSum = 0, aW = 0;
          const half = STATS_RES / 2;
          for (let y = 0; y < STATS_RES; y++) {
            for (let x = 0; x < STATS_RES; x++) {
              const o = (y * STATS_RES + x) * 4;
              const w = statsBuf[o + 1] / 255;
              if (w < 0.02) continue;
              const bin = Math.min(BINS - 1, (statsBuf[o] / 255 * BINS) | 0);
              const q = (x >= half ? 1 : 0) + (y >= half ? 2 : 0);
              if (q === 0) {
                histFace[bin] += w; wFace += w;
                aSum += ((statsBuf[o + 2] / 255) - 0.5) / 2 * w; aW += w;
              } else if (q === 1) { histBody[bin] += w; wBody += w; }
              else if (q === 2) { histCloth[bin] += w; wCloth += w; }
              else { histHair[bin] += w; wHair += w; }
            }
          }
          const qArea = half * half;
          cov.face = wFace / qArea; cov.body = wBody / qArea;
          cov.cloth = wCloth / qArea; cov.hair = wHair / qArea;
          for (let i = 0; i < BINS; i++) histSkin[i] = histFace[i] + histBody[i];
          const wSkin = wFace + wBody;

          const c = counts();
          const tau = 0.5 + 2.0 * state.calm;
          const k = 1 - Math.exp(-Math.max(dtStat, 1e-3) / tau);
          const snapSkin = c.skinN !== TH.skinN;
          const snapFace = c.faceN !== TH.faceN;
          const snapCloth = c.clothN !== TH.clothN;
          TH.skinN = c.skinN; TH.faceN = c.faceN; TH.clothN = c.clothN;
          updateArray(TH.skin, TH.skinN, histSkin, wSkin, k, snapSkin);
          updateArray(TH.face, TH.faceN, histFace, wFace, k, snapFace);
          updateArray(TH.cloth, TH.clothN, histCloth, wCloth, k, snapCloth);

          // dark-feature floor (eyes/brows survive as the darkest paper) +
          // lip redness gate (face mean oklab a + a detail-scaled margin)
          const fd = quantileOf(histFace, wFace, 0.07);
          if (fd !== null) {
            TH.faceDark = smoothScalar(TH.faceDark,
              Math.min(Math.max(fd, 0.03), 0.55), k);
          }
          if (aW > MIN_W) {
            const margin = 0.055 - 0.027 * state.detail;
            TH.lipA = smoothScalar(TH.lipA, aSum / aW + margin, k);
          }
          const h1 = quantileOf(histHair, wHair, 0.25);
          const h2 = quantileOf(histHair, wHair, 0.55);
          const h3 = quantileOf(histHair, wHair, 0.85);
          if (h1 !== null) {
            TH.hairQ[0] = smoothScalar(TH.hairQ[0], h1, k);
            TH.hairQ[1] = smoothScalar(TH.hairQ[1], h2, k);
            TH.hairQ[2] = smoothScalar(TH.hairQ[2], h3, k);
          }
          if (wSkin >= MIN_W) TH.seeded = true;
        }

        /* ------------------------------------------------------------------
           Detection state + MediaPipe multiclass segmentation. All masks are
           consumed in SCREEN UV so fakesource and MediaPipe drive the exact
           same shader path. Only ImageSegmenter is loaded (CRAFT §C3).
        ------------------------------------------------------------------ */

        const det = {
          cx: 0.5, cy: 0,
          tcx: 0.5, tcy: 0,
          present: 0, tpresent: 0,
          segScale: [1, 1],
          segReady: false,
        };

        const MP_PKG = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";
        const MP_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm";
        // Multiclass selfie model — file name verified against the live
        // storage bucket (a mistyped model path 404s and silently kills all
        // detection, CRAFT §C2). Categories: 0 background / 1 hair /
        // 2 body-skin / 3 face-skin / 4 clothes / 5 others.
        const SEG_MODEL =
          "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";

        let mpSegmenter = null;
        let mpState = "idle"; // idle | loading | ready | error
        let mpProgress = 0;
        let mpDelegate = "GPU";
        let mpVision = null;
        let ImageSegmenterClass = null;
        let mpSwitching = false;
        let segRGBA = new Uint8Array(4);
        const SEG_MAX_SIDE = 288;   // small inference copy (CRAFT §C3)
        const segSrc = document.createElement("canvas");
        const segSrcCtx = segSrc.getContext("2d");
        let detCost = 20;
        let segBadRun = 0;

        const segOpts = (delegate) => ({
          baseOptions: { modelAssetPath: SEG_MODEL, delegate },
          runningMode: "VIDEO",
          outputCategoryMask: false,
          outputConfidenceMasks: true,
        });

        async function loadMediaPipe() {
          if (FAKE || mpState === "loading" || mpState === "ready") return;
          mpState = "loading";
          mpProgress = 0.05;
          try {
            const mod = await import(/* @vite-ignore */ MP_PKG);
            const { FilesetResolver, ImageSegmenter } = mod;
            ImageSegmenterClass = ImageSegmenter;
            mpProgress = 0.3;
            mpVision = await FilesetResolver.forVisionTasks(MP_WASM);
            mpProgress = 0.6;
            try {
              mpSegmenter = await ImageSegmenter.createFromOptions(mpVision, segOpts("GPU"));
              mpDelegate = "GPU";
            } catch (_e) {
              mpSegmenter = await ImageSegmenter.createFromOptions(mpVision, segOpts("CPU"));
              mpDelegate = "CPU";
            }
            mpProgress = 1;
            mpState = "ready";
          } catch (error) {
            console.error("MediaPipe load failed", error);
            mpState = "error";
          }
        }

        // Some mobile GPU delegates "succeed" but emit degenerate masks
        // (all-zero or all-one). When that persists, rebuild on CPU.
        async function switchToCpuDelegate() {
          if (mpSwitching || mpDelegate === "CPU" || !ImageSegmenterClass || !mpVision) return;
          mpSwitching = true;
          try {
            const next = await ImageSegmenterClass.createFromOptions(mpVision, segOpts("CPU"));
            try { if (mpSegmenter && mpSegmenter.close) mpSegmenter.close(); } catch (_e) { /* noop */ }
            mpSegmenter = next;
            mpDelegate = "CPU";
            segBadRun = 0;
            console.warn("kirie: GPU segmentation output looked broken — switched to CPU delegate");
          } catch (_e) { /* keep the GPU segmenter */ }
          mpSwitching = false;
        }

        // Offline diagnostic (?fakeseg=1): a synthetic multiclass mask of
        // KNOWN orientation — hair band across the image TOP, face below it,
        // clothes at the image BOTTOM (top-left origin, FLIP_Y=false, exactly
        // like a real MediaPipe upload). With the shader Y flip correct, hair
        // must render at the TOP of the screen and clothes at the BOTTOM.
        function uploadFakeSeg() {
          const w = 96, h = 96;
          const arr = new Uint8Array(w * h * 4);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const o = (y * w + x) * 4;
              const fy = y / h;
              const inBand = x > w * 0.24 && x < w * 0.76;
              if (!inBand) continue;
              if (fy < 0.28) arr[o] = 255;              // hair (image top)
              else if (fy < 0.52) arr[o + 1] = 255;     // face skin
              else if (fy < 0.60) arr[o + 2] = 255;     // body skin
              else arr[o + 3] = 255;                    // clothes (image bottom)
            }
          }
          gl.bindTexture(gl.TEXTURE_2D, segTexture);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, arr);
          segSize = [w, h];
          det.segReady = true;
        }

        // Packs the six confidence masks into one RGBA texture
        // (R hair / G face / B body / A clothes+others) and returns the
        // person coverage (1 - background mean).
        function uploadSegMasks(masks) {
          const w = masks[0].width, h = masks[0].height;
          const n = w * h;
          const bg = masks[0].getAsFloat32Array();
          const hair = masks[1].getAsFloat32Array();
          const body = masks[2].getAsFloat32Array();
          const face = masks[3].getAsFloat32Array();
          const cloth = masks[4].getAsFloat32Array();
          const other = masks.length > 5 ? masks[5].getAsFloat32Array() : null;
          if (segRGBA.length !== n * 4) segRGBA = new Uint8Array(n * 4);
          let sum = 0;
          for (let i = 0; i < n; i++) {
            const o = i * 4;
            segRGBA[o] = Math.max(0, Math.min(255, (hair[i] * 255) | 0));
            segRGBA[o + 1] = Math.max(0, Math.min(255, (face[i] * 255) | 0));
            segRGBA[o + 2] = Math.max(0, Math.min(255, (body[i] * 255) | 0));
            const cl = cloth[i] + (other ? other[i] * 0.7 : 0);
            segRGBA[o + 3] = Math.max(0, Math.min(255, (cl * 255) | 0));
            sum += 1 - bg[i];
          }
          gl.bindTexture(gl.TEXTURE_2D, segTexture);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
          if (segSize[0] !== w || segSize[1] !== h) {
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, segRGBA);
            segSize = [w, h];
          } else {
            gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, segRGBA);
          }
          det.segReady = true;
          return sum / n;
        }

        // Runs OUTSIDE the render loop (latest-wins); never awaited in rAF.
        // UNTESTED in this environment (network + swiftshader).
        function runDetection(now) {
          if (video.readyState < 2 || video.videoWidth === 0 || mpSwitching) return;
          const vw = video.videoWidth, vh = video.videoHeight;
          const s = Math.min(1, SEG_MAX_SIDE / Math.max(vw, vh));
          const cw = Math.max(2, Math.round(vw * s));
          const ch = Math.max(2, Math.round(vh * s));
          if (segSrc.width !== cw || segSrc.height !== ch) {
            segSrc.width = cw;
            segSrc.height = ch;
          }
          segSrcCtx.drawImage(video, 0, 0, cw, ch);
          const t0 = performance.now();
          try {
            const seg = mpSegmenter.segmentForVideo(segSrc, now);
            const cms = seg && seg.confidenceMasks;
            if (cms && cms.length >= 5) {
              const cover = uploadSegMasks(cms);
              det.tpresent = cover > 0.008 && cover < 0.95 ? 1 : 0;
              const degenerate = cover < 0.002 || cover > 0.97;
              segBadRun = degenerate ? segBadRun + 1 : 0;
              if (segBadRun > 40) switchToCpuDelegate();
            }
            if (seg && seg.close) seg.close();
          } catch (_e) {
            segBadRun++;
            if (segBadRun > 40) switchToCpuDelegate();
          }
          detCost = detCost * 0.8 + (performance.now() - t0) * 0.2;
        }

        let detTimer = 0;
        function detectionTick() {
          if (!FAKE && mpState === "ready" && cameraReady && !document.hidden) {
            runDetection(performance.now());
          }
          // Adaptive cadence: inference never owns the main thread. Slow
          // devices detect less often; the class EMA bridges the gaps.
          const interval = Math.max(33, Math.min(250, detCost * 1.7));
          detTimer = setTimeout(detectionTick, interval);
        }

        /* ------------------------------------------------------------------
           Render core + loop + prewarm
        ------------------------------------------------------------------ */

        let stream = null;
        let cameraReady = false;
        let animTime = 0;
        let lastNow = performance.now();
        let fpsLast = performance.now();
        let fpsFrames = 0;
        let structPing = false, classPing = false;
        let readyStamped = false;
        let lastStatWall = 0;

        const readout = document.getElementById("readout");

        function uploadVideoFrame() {
          if (
            cameraReady &&
            video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
            video.videoWidth > 0 && video.videoHeight > 0
          ) {
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
            return true;
          }
          return false;
        }

        function updateDetection(dt) {
          const canvasAspect = canvas.width / Math.max(canvas.height, 1);
          const videoAspect = (video.videoWidth && video.videoHeight)
            ? video.videoWidth / video.videoHeight : 4 / 3;
          det.segScale = videoAspect > canvasAspect
            ? [canvasAspect / videoAspect, 1]
            : [1, videoAspect / canvasAspect];
          if (FAKE) {
            // slow sway + bob: the figure keeps moving (--motion contract);
            // frozen (animTime pinned) it is a deterministic still.
            det.tcx = 0.5 + 0.055 * Math.sin(animTime * 0.45);
            det.tcy = 0.025 * Math.sin(animTime * 0.7 + 1.0);
            det.tpresent = 1;
          } else if (mpState !== "ready") {
            det.tpresent = 0;
          }
          if (FAKESEG) det.segScale = [1, 1]; // direct mapping for the Y-flip test
          const k = dt > 0 ? 1 - Math.exp(-dt * 6) : 0;
          det.cx += (det.tcx - det.cx) * k;
          det.cy += (det.tcy - det.cy) * k;
          det.present += (det.tpresent - det.present) * k;
        }

        // One full pipeline step. dt drives the fake-figure tracking;
        // emaDt drives every EMA (fixed 1/60 during prewarm so the warmed
        // state is deterministic and framerate-independent).
        function renderCore(dt, emaDt, drawFinal, haveVideo) {
          updateDetection(dt);
          const doReset = needsReset;
          needsReset = false;
          if (doReset) clearSimTargets();

          const aspect = canvas.width / Math.max(canvas.height, 1);
          const source = FAKESEG ? 1
            : (FAKE ? 0 : (mpState === "ready" && det.segReady ? 1 : 2));

          const structCur = structPing ? targets.structA : targets.structB;
          const structPrev = structPing ? targets.structB : targets.structA;
          const classCur = classPing ? targets.classA : targets.classB;
          const classPrev = classPing ? targets.classB : targets.classA;

          const aClass = 1 - Math.exp(-emaDt * (16 - 11 * state.calm));
          const aStruct = 1 - Math.exp(-emaDt * (20 - 13 * state.calm));

          // P0 — scene
          renderPass(targets.scene, programs.scene, () => {
            const u = locations.scene;
            bindTexture(0, videoTexture);
            gl.uniform1i(u.uVideo, 0);
            gl.uniform2f(u.uResolution, paintW, paintH);
            gl.uniform2f(u.uVideoSize,
              Math.max(1, video.videoWidth), Math.max(1, video.videoHeight));
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uCx, det.cx);
            gl.uniform1f(u.uCy, det.cy);
            gl.uniform1f(u.uFakeScale, FAKESCALE);
            gl.uniform1i(u.uMirror, state.mirror ? 1 : 0);
            gl.uniform1i(u.uFake, FAKE ? 1 : 0);
            gl.uniform1i(u.uHasVideo, haveVideo ? 1 : 0);
          });

          // P3 — kuwahara + EMA (ping-pong)
          renderPass(structCur, programs.struct, () => {
            const u = locations.struct;
            bindTexture(0, targets.scene.tex);
            bindTexture(1, structPrev.tex);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uPrev, 1);
            gl.uniform2f(u.uTexel, 1 / structW, 1 / structH);
            gl.uniform1f(u.uAlpha, aStruct);
            gl.uniform1f(u.uRadius, 4.2);
            gl.uniform1i(u.uReset, doReset ? 1 : 0);
          });

          // P1 — class EMA (ping-pong)
          renderPass(classCur, programs.klass, () => {
            const u = locations.klass;
            bindTexture(0, segTexture);
            bindTexture(1, classPrev.tex);
            gl.uniform1i(u.uSeg, 0);
            gl.uniform1i(u.uPrev, 1);
            gl.uniform2f(u.uSegScale, det.segScale[0], det.segScale[1]);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uCx, det.cx);
            gl.uniform1f(u.uCy, det.cy);
            gl.uniform1f(u.uFakeScale, FAKESCALE);
            gl.uniform1f(u.uAlpha, aClass);
            gl.uniform1i(u.uReset, doReset ? 1 : 0);
            gl.uniform1i(u.uSource, source);
            gl.uniform1i(u.uMirror, state.mirror ? 1 : 0);
          });

          // P2 — soft class boundaries + heavy blur (scissor + card shadow)
          blurPass(classCur, targets.softTmp, targets.softT, 1.7);
          blurPass(targets.softT, targets.shadTmp, targets.shadT, 5.5);

          // P4 — etf
          renderPass(targets.etfT, programs.etf, () => {
            const u = locations.etf;
            bindTexture(0, structCur.tex);
            gl.uniform1i(u.uStruct, 0);
            gl.uniform2f(u.uTexel, 1 / etfW, 1 / etfH);
          });

          // P5 — stats source (read back on a slow CPU cadence)
          renderPass(targets.stats, programs.stats, () => {
            const u = locations.stats;
            bindTexture(0, structCur.tex);
            bindTexture(1, targets.softT.tex);
            gl.uniform1i(u.uStruct, 0);
            gl.uniform1i(u.uSoft, 1);
          });

          if (drawFinal) {
            // P6 — quilling curls (instanced spiral sprites, premultiplied)
            const cellsX = Math.round(34 + 30 * state.curls);
            const cellSize = aspect / cellsX;
            let rows = Math.ceil(1 / cellSize) + 1;
            const MAX_INST = 8192;
            if (cellsX * rows > MAX_INST) rows = Math.floor(MAX_INST / cellsX);
            const inst = cellsX * rows;
            gl.bindFramebuffer(gl.FRAMEBUFFER, targets.ribbon.fbo);
            gl.viewport(0, 0, targets.ribbon.width, targets.ribbon.height);
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.useProgram(programs.ribbon);
            const ur = locations.ribbon;
            bindTexture(0, targets.softT.tex);
            bindTexture(1, targets.etfT.tex);
            bindTexture(2, structCur.tex);
            gl.uniform1i(ur.uSoft, 0);
            gl.uniform1i(ur.uEtf, 1);
            gl.uniform1i(ur.uStruct, 2);
            gl.uniform1f(ur.uAspect, aspect);
            gl.uniform1f(ur.uCells, cellsX);
            gl.uniform2f(ur.uSoftTexel, 1 / classW, 1 / classH);
            gl.uniform1f(ur.uCurls, state.curls);
            gl.uniform1f(ur.uRibbon, state.ribbon);
            gl.uniform1f(ur.uPalette, state.palette);
            gl.uniform3f(ur.uHairQ, TH.hairQ[0], TH.hairQ[1], TH.hairQ[2]);
            gl.uniform1i(ur.uPreset, state.preset);
            gl.uniform1f(ur.uRelief, state.relief);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
            gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, inst);
            gl.disable(gl.BLEND);

            // P7 — composite → canvas
            renderPass(null, programs.composite, () => {
              const u = locations.composite;
              bindTexture(0, structCur.tex);
              bindTexture(1, targets.softT.tex);
              bindTexture(2, targets.shadT.tex);
              bindTexture(3, targets.ribbon.tex);
              gl.uniform1i(u.uStruct, 0);
              gl.uniform1i(u.uSoft, 1);
              gl.uniform1i(u.uShad, 2);
              gl.uniform1i(u.uRibbon, 3);
              gl.uniform2f(u.uResolution, canvas.width, canvas.height);
              gl.uniform1f(u.uAspect, aspect);
              gl.uniform1f(u.uRelief, state.relief);
              gl.uniform1f(u.uPalette, state.palette);
              gl.uniform1f(u.uDetail, state.detail);
              gl.uniform1f(u.uGrain, state.grain);
              gl.uniform1i(u.uPreset, state.preset);
              gl.uniform1i(u.uDebug, state.debugView);
              gl.uniform1fv(u["uSkinTh[0]"], TH.skin);
              gl.uniform1i(u.uSkinN, TH.skinN);
              gl.uniform1fv(u["uFaceTh[0]"], TH.face);
              gl.uniform1i(u.uFaceN, TH.faceN);
              gl.uniform1fv(u["uClothTh[0]"], TH.cloth);
              gl.uniform1i(u.uClothN, TH.clothN);
              gl.uniform1f(u.uFaceDark, TH.faceDark);
              gl.uniform1f(u.uLipA, TH.lipA);
              gl.uniform3f(u.uHairQ, TH.hairQ[0], TH.hairQ[1], TH.hairQ[2]);
            });
          }

          structPing = !structPing;
          classPing = !classPing;
        }

        // ?prewarm=<sec>: deterministic fast-forward BEFORE the first
        // presented frame. Two phases (both fixed-step, so the result is a
        // pure function of the prewarm value): (A) up to 3 simulated seconds
        // of full pipeline steps at dt=1/20 — the GPU EMAs (class/struct)
        // converge in ~1-2 s; (B) the remaining simulated time in 1.5 s
        // chunks of one pipeline step + one CPU quantile update each — the
        // threshold EMA (τ up to ~2.5 s) converges without paying for full
        // GPU steps (swiftshader budget, CRAFT §C4). Async-chunked so the
        // page load event is never blocked; true glSync per chunk. Under
        // ?freeze=1 the figure pose stays pinned while every EMA still
        // converges onto the static scene.
        async function runPrewarm() {
          const PDT = 1 / 20;
          const stepsA = Math.round(Math.min(PREWARM, 3) / PDT);
          for (let i = 0; i < stepsA; i++) {
            if (!FREEZE && !state.pauseAnim) animTime += PDT;
            renderCore(PDT, PDT, false, false);
            if (i % 4 === 3) updateThresholds(4 * PDT);
            if (i % 10 === 9) {
              glSync();
              await new Promise((resolve) => setTimeout(resolve, 0));
            }
          }
          let remain = PREWARM - Math.min(PREWARM, 3);
          while (remain > 1e-3) {
            const chunk = Math.min(1.5, remain);
            if (!FREEZE && !state.pauseAnim) animTime += chunk;
            renderCore(chunk, PDT, false, false);
            updateThresholds(chunk);
            remain -= chunk;
            glSync();
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
          updateThresholds(4 * PDT);
          glSync();
        }

        function detectionLabel() {
          if (FAKE) return "合成";
          if (mpState === "loading") return `検知ロード中 ${Math.round(mpProgress * 100)}%`;
          if (mpState === "error") return "検知エラー";
          if (mpState === "ready") {
            const st = det.present > 0.4 ? "追従中" : "未検出";
            return `${st} ${Math.round(detCost)}ms·${mpDelegate}`;
          }
          return "待機";
        }
        function coverageLabel() {
          const pc = (v) => `${Math.round(Math.min(1, v) * 100)}`;
          return `髪${pc(cov.hair)} 顔${pc(cov.face)} 体${pc(cov.body)} 服${pc(cov.cloth)}%`;
        }

        function updateChip() {
          statusChip.textContent = FAKE
            ? "入力 · 合成 (fakesource=1)"
            : `検知 · ${detectionLabel()}`;
          statusChip.classList.toggle(
            "hidden", FAKE ? performance.now() - bootWall > 4000 : false);
        }

        function frame(now) {
          resize();

          const rawDt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
          lastNow = now;
          const dt = FREEZE ? 0 : rawDt;
          if (!state.pauseAnim) animTime += dt;

          const haveVideo = FAKE ? false : uploadVideoFrame();
          const hasInput = FAKE || haveVideo || mpState === "ready";

          renderCore(dt, dt, true, haveVideo);

          // low-cadence quantile refresh (never per frame)
          if (now - lastStatWall > 200) {
            updateThresholds(Math.min(1, (now - lastStatWall) / 1000));
            lastStatWall = now;
          }

          if (!readyStamped && hasInput) {
            glSync();   // first real frame actually finished (CRAFT §C4)
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            readout.textContent = `FPS ${fps.toFixed(0)} / 解像度 ${canvas.width}×${
              canvas.height} / 検知 ${detectionLabel()} / ${coverageLabel()}`;
            updateChip();
          }

          requestAnimationFrame(frame);
        }

        /* ------------------------------------------------------------------
           Camera + boot. With ?fakesource=1 the synthetic bust drives the
           pipeline and MediaPipe is never touched, but getUserMedia still
           runs so the three error paths stay observable.
        ------------------------------------------------------------------ */

        async function startCamera() {
          stopCamera();
          cameraReady = false;
          retryCamera.disabled = true;
          setOverlay("requesting", "REQUESTING CAMERA",
            "Please allow webcam access. If this is not localhost or HTTPS, the camera API will be blocked.");

          if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost" &&
            location.hostname !== "127.0.0.1" &&
            location.hostname !== "[::1]"
          ) {
            setOverlay("error", "SECURE CONTEXT REQUIRED",
              "Serve the file from localhost (for example: python3 -m http.server 8888) or HTTPS, then reload.");
            retryCamera.disabled = false;
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setOverlay("error", "CAMERA API UNAVAILABLE",
              "This browser does not expose getUserMedia. Try a modern browser over localhost or HTTPS.");
            retryCamera.disabled = false;
            return;
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: state.facingMode,
                width: { ideal: 1280 }, height: { ideal: 720 },
              },
              audio: false,
            });
            video.srcObject = stream;
            await video.play();
            cameraReady = true;
            retryCamera.disabled = false;
            needsReset = true;
            setOverlay("hidden", "", "");
            if (!FAKE) loadMediaPipe();
          } catch (error) {
            retryCamera.disabled = false;
            const name = error && error.name ? error.name : "";
            if (name === "NotAllowedError" || name === "SecurityError") {
              setOverlay("error", "PERMISSION DENIED",
                "Camera access was denied. Enable camera permission for this site, then retry.",
                { retryCamera: true });
            } else if (name === "NotFoundError" || name === "OverconstrainedError") {
              setOverlay("error", "NO CAMERA FOUND",
                "No usable webcam was found. Connect a camera or release it from another app, then retry.",
                { retryCamera: true });
            } else {
              setOverlay("error", "CAMERA ERROR",
                `${name || "Unknown error"}. Check browser permissions and retry.`,
                { retryCamera: true });
            }
          }
        }

        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        retryCamera.addEventListener("click", () => { startCamera(); });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });
        window.addEventListener("beforeunload", stopCamera);

        const bootWall = performance.now();

        try {
          resize();
          if (FAKESEG) uploadFakeSeg(); // offline seg-path diagnostic
          // startCamera() runs in every mode. Under ?fakesource=1 the
          // synthetic bust drives the whole pipeline regardless of the camera
          // (the video texture is never sampled, MediaPipe stays untouched),
          // so the camera is only exercised to keep the error overlays
          // observable.
          startCamera();
          detectionTick();
          if (PREWARM > 0) {
            runPrewarm().then(() => requestAnimationFrame(frame));
          } else {
            requestAnimationFrame(frame);
          }
        } catch (error) {
          setOverlay("error", "WEBGL SETUP ERROR",
            error && error.message ? error.message : "Could not initialize the renderer.");
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
