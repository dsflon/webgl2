<!DOCTYPE html>
<!--
  WATER · CAM — real-time webcam → "a person made of water" (WebGL2 + MediaPipe person segmentation).

  HOW TO RUN
    The camera API and ES-module imports need a secure context:
      python3 -m http.server 8000
      → open http://localhost:8000/water-cam.html and allow the camera.
    Opening via file:// will not work.

  EXTERNAL DEPENDENCIES (the ONLY external code, loaded at runtime from CDN)
    MediaPipe Tasks-Vision : https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs
    wasm runtime           : https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm
    segmentation model     : https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite

  PIPELINE (per frame)
    webcam frame ─▶ video texture (FLIP_Y, cover-fit + mirror applied in shader)
    MediaPipe person mask (256², top-row-first; flipped in shader) ─▶ raw mask texture
      1) MASK BLUR   : feather the raw mask (5×5 gaussian, small FBO)
      2) MASK FIELD  : store feathered mask + edge magnitude (Sobel-ish) — the "edge field"
      3) WATER NORMALS: animated FBM noise + downward-running film bands → normal map (half-res)
      4) COMPOSITE   : inside the mask — refraction (uv offset by normal), preserved facial
                       shading, sharp specular + crest glints, Fresnel rim, silver mono;
                       outside — near-black; below the silhouette — animated DRIP threads
      5) BRIGHT      : threshold the scene (half-res)
      6) BLUR        : blur the bright pass
      7) FINAL       : scene + bloom, vignette, grain → screen

  SLIDERS
    Refraction      how strongly the water bends the image under it
    Ripple scale    size of the water ripples          Ripple speed   how fast they move
    Ripple strength surface bumpiness                  Specular       highlight intensity
    Fresnel         silhouette rim glow                Mono           0=color … 1=silver monochrome
    Drip amount     fraction of columns that drip      Drip speed     drip fall speed
    Bloom           glow on bright glints              Vignette       corner darkening
  TOGGLES: Mirror / Pause water / Show mask (debug).  BUTTON: Save PNG.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WATER · CAM</title>
<style>
  :root{
    --ice:#8FD4E6;            /* accent: icy water blue */
    --ice-dim:#3E7E8E;
    --pale:#BCC7CD;
    --deep:#0A1119;           /* page base, near-black */
    --line:rgba(143,212,230,0.30);
    --mono:"Courier New", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--deep); color:var(--pale); font-family:var(--mono); overflow:hidden; }
  #gl{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }

  /* ── control HUD ─────────────────────────────────────────── */
  .panel{
    position:fixed; top:16px; left:16px; z-index:10;
    width:264px; max-width:calc(100vw - 32px);
    background:rgba(10,17,25,0.74);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line); user-select:none;
  }
  .panel__bar{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; cursor:pointer; background:transparent; border:0; color:var(--ice);
    font:inherit; letter-spacing:0.14em; font-size:12px; text-transform:uppercase;
    border-bottom:1px solid var(--line);
  }
  .panel__bar:focus-visible{ outline:2px solid var(--ice); outline-offset:-2px; }
  .panel__title{ display:flex; align-items:center; gap:8px; }
  .cursor{ width:7px; height:13px; background:var(--ice); display:inline-block;
           animation:blink 1.05s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .panel__chev{ transition:transform .18s ease; }
  .panel.collapsed .panel__chev{ transform:rotate(-90deg); }
  .panel.collapsed .panel__body{ display:none; }
  .panel__body{
    padding:12px 12px 13px; display:flex; flex-direction:column; gap:10px;
    max-height:calc(100vh - 120px); overflow:auto;
  }
  .ctrl label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px;
  }
  .ctrl .val{ color:var(--ice); font-size:11px; letter-spacing:0.05em; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:14px;
    background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]:focus-visible{ outline:2px solid var(--ice); outline-offset:4px; }
  input[type=range]::-webkit-slider-runnable-track{
    height:2px; background:linear-gradient(90deg,var(--ice-dim),rgba(188,199,205,0.25));
  }
  input[type=range]::-moz-range-track{
    height:2px; background:linear-gradient(90deg,var(--ice-dim),rgba(188,199,205,0.25));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:11px; height:14px; margin-top:-6px;
    background:var(--ice); border:0; border-radius:0;
  }
  input[type=range]::-moz-range-thumb{ width:11px; height:14px; background:var(--ice); border:0; border-radius:0; }

  .toggles{ display:flex; gap:8px; flex-wrap:wrap; }
  .tog, .save{
    flex:1; min-width:70px; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:transparent; border:1px solid var(--line); color:var(--pale);
    font:inherit; font-size:10.5px; letter-spacing:0.10em; text-transform:uppercase;
    padding:8px 10px; cursor:pointer;
  }
  .tog i{ font-style:normal; color:var(--ice-dim); letter-spacing:0; }
  .tog[aria-pressed=true] i{ color:var(--ice); }
  .tog:hover, .save:hover{ border-color:var(--ice); }
  .tog:focus-visible, .save:focus-visible{ outline:2px solid var(--ice); outline-offset:2px; }
  .save{ justify-content:center; color:var(--ice); }

  .readout{
    font-size:10px; letter-spacing:0.07em; border-top:1px solid var(--line);
    padding-top:10px; line-height:1.6; opacity:0.85; white-space:pre-wrap;
  }
  .readout b{ color:var(--ice); font-weight:normal; }

  /* model-status chip */
  #chip{
    position:fixed; left:16px; bottom:16px; z-index:10; display:none;
    border:1px solid var(--line); background:rgba(10,17,25,0.74); color:var(--ice);
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; padding:7px 11px;
  }
  #chip.show{ display:block; }
  #chip.show::after{ content:""; animation:dots 1.4s steps(4) infinite; }
  @keyframes dots{ 0%{content:"";}25%{content:"·";}50%{content:"··";}75%{content:"···";} }

  /* ── camera / model state overlay ────────────────────────── */
  #state{
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:rgba(10,17,25,0.88); color:var(--pale);
  }
  #state.show{ display:flex; }
  #state .box{ max-width:460px; }
  #state h1{ color:var(--ice); font-size:13px; letter-spacing:0.22em; text-transform:uppercase; margin:0 0 14px; }
  #state p{ font-size:12.5px; line-height:1.75; letter-spacing:0.03em; margin:0 0 14px; }
  #state code{ color:var(--ice); background:rgba(143,212,230,0.10); padding:2px 6px; }
  #state button{
    background:transparent; border:1px solid var(--ice); color:var(--ice);
    font:inherit; font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    padding:10px 18px; cursor:pointer;
  }
  #state button:hover{ background:rgba(143,212,230,0.12); }
  .dots::after{ content:""; animation:dots 1.4s steps(4) infinite; }

  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; }
    #chip.show::after, .dots::after{ animation:none; content:"…"; }
  }
  @media (max-width:520px){ .panel{ width:calc(100vw - 24px); top:12px; left:12px; } }
</style>
</head>
<body>
  <canvas id="gl"></canvas>

  <aside class="panel" id="panel" aria-label="Water render controls">
    <button class="panel__bar" id="toggle" aria-expanded="true">
      <span class="panel__title">WATER · CAM <span class="cursor" aria-hidden="true"></span></span>
      <span class="panel__chev" aria-hidden="true">▾</span>
    </button>
    <div class="panel__body">
      <div class="ctrl"><label for="refract">Refraction <span class="val" id="vRefract"></span></label>
        <input id="refract" type="range" min="0" max="1" step="0.01" value="0.55"></div>
      <div class="ctrl"><label for="rippleScale">Ripple scale <span class="val" id="vRippleScale"></span></label>
        <input id="rippleScale" type="range" min="0.4" max="3" step="0.01" value="1.40"></div>
      <div class="ctrl"><label for="rippleSpeed">Ripple speed <span class="val" id="vRippleSpeed"></span></label>
        <input id="rippleSpeed" type="range" min="0" max="1.5" step="0.01" value="0.55"></div>
      <div class="ctrl"><label for="rippleStrength">Ripple strength <span class="val" id="vRippleStrength"></span></label>
        <input id="rippleStrength" type="range" min="0" max="1.5" step="0.01" value="0.70"></div>
      <div class="ctrl"><label for="specular">Specular <span class="val" id="vSpecular"></span></label>
        <input id="specular" type="range" min="0" max="2" step="0.01" value="0.85"></div>
      <div class="ctrl"><label for="fresnel">Fresnel / edge <span class="val" id="vFresnel"></span></label>
        <input id="fresnel" type="range" min="0" max="1.5" step="0.01" value="0.50"></div>
      <div class="ctrl"><label for="mono">Mono / silver <span class="val" id="vMono"></span></label>
        <input id="mono" type="range" min="0" max="1" step="0.01" value="0.92"></div>
      <div class="ctrl"><label for="drip">Drip amount <span class="val" id="vDrip"></span></label>
        <input id="drip" type="range" min="0" max="1" step="0.01" value="0.35"></div>
      <div class="ctrl"><label for="dripSpeed">Drip speed <span class="val" id="vDripSpeed"></span></label>
        <input id="dripSpeed" type="range" min="0" max="1.5" step="0.01" value="0.40"></div>
      <div class="ctrl"><label for="bloom">Bloom <span class="val" id="vBloom"></span></label>
        <input id="bloom" type="range" min="0" max="1.5" step="0.01" value="0.55"></div>
      <div class="ctrl"><label for="vignette">Vignette <span class="val" id="vVignette"></span></label>
        <input id="vignette" type="range" min="0" max="1" step="0.01" value="0.50"></div>

      <div class="toggles">
        <button class="tog" id="mirror" aria-pressed="true">Mirror <i>[X]</i></button>
        <button class="tog" id="pause" aria-pressed="false">Pause <i>[ ]</i></button>
        <button class="tog" id="showMask" aria-pressed="false">Mask <i>[ ]</i></button>
      </div>
      <button class="save" id="save">Save PNG ▏</button>
      <div class="readout" id="readout">—</div>
    </div>
  </aside>

  <div id="chip">model loading</div>

  <div id="state" role="alertdialog" aria-live="assertive"><div class="box" id="stateBox"></div></div>

<script type="module">
/* ============================== constants ============================== */
const CDN_BUNDLE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";
const CDN_WASM   = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm";
const MODEL_URL  = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";
const MASK_FBO = 384;           // resolution of the mask blur/field passes

/* Mobile detection recipe (proven in fable5_gas-head.html): coarse-pointer
   devices segment a downscaled copy of the frame on an adaptive cadence and
   auto-switch GPU→CPU when the delegate emits degenerate masks. Desktop
   (fine pointer) keeps the exact full-resolution pipeline it always had. */
const SEG_SMALL    = matchMedia("(pointer: coarse)").matches;
const SEG_MAX_SIDE = 288;       // longest side of the mobile inference input

/* ============================== state ============================== */
const S = {
  refract:0.55, rippleScale:1.40, rippleSpeed:0.55, rippleStrength:0.70,
  specular:0.85, fresnel:0.50, mono:0.92, drip:0.35, dripSpeed:0.40,
  bloom:0.55, vignette:0.50,
  mirror:true, paused:false, showMask:false
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduceMotion) S.paused = true;   // water animation paused by default

/* ============================== shaders ============================== */
// Fullscreen triangle from gl_VertexID — no vertex buffers needed.
const VS = `#version 300 es
precision highp float;
const vec2 P[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
out vec2 v_uv;
void main(){ vec2 p = P[gl_VertexID]; v_uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

// 1) MASK BLUR — feather the raw MediaPipe mask.
// The raw mask is stored top-row-first (image coords) while our FBO uv space is y-up,
// so we flip Y once here; every later pass is consistently y-up.
const FS_MASKBLUR = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D uMaskRaw;
uniform vec2 uTexel;                       // 1 / raw mask size
void main(){
  vec2 muv = vec2(v_uv.x, 1.0 - v_uv.y);   // flip: mask rows start at the top
  float s = 0.0, wsum = 0.0;
  for (int j=-2; j<=2; j++)
  for (int i=-2; i<=2; i++){
    float w = exp(-float(i*i+j*j)*0.35);   // 5x5 gaussian
    s += w * texture(uMaskRaw, muv + vec2(float(i),float(j))*uTexel*1.4).r;
    wsum += w;
  }
  o = vec4(s/wsum, 0.0, 0.0, 1.0);
}`;

// 2) MASK FIELD — feathered mask (r) + edge magnitude (g) via central differences.
// The edge field is what the Fresnel rim and the drip pass key off.
const FS_MASKFIELD = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D uMaskBlur;
uniform vec2 uTexel;                       // 1 / field FBO size
void main(){
  float m   = texture(uMaskBlur, v_uv).r;
  float mx1 = texture(uMaskBlur, v_uv + vec2(uTexel.x,0.)).r;
  float mx0 = texture(uMaskBlur, v_uv - vec2(uTexel.x,0.)).r;
  float my1 = texture(uMaskBlur, v_uv + vec2(0.,uTexel.y)).r;
  float my0 = texture(uMaskBlur, v_uv - vec2(0.,uTexel.y)).r;
  vec2 g = vec2(mx1-mx0, my1-my0);
  float edge = clamp(length(g)*6.0, 0.0, 1.0);
  o = vec4(m, edge, g*0.5+0.5);
}`;

// 3) WATER NORMALS — animated height field (FBM value noise + a thin running film band),
// normal from finite differences. Rendered half-res in screen space.
const FS_NORMALS = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform float uTime, uRippleScale, uRippleSpeed, uRippleStrength, uViewAspect;
float hash(vec2 p){ p = fract(p*vec2(127.1,311.7)); p += dot(p,p+34.5); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){
  float s=0.0, a=0.5;
  for (int k=0;k<3;k++){ s += a*vnoise(p); p = p*2.03+7.31; a *= 0.5; }
  return s;
}
float height(vec2 uv, float t){
  vec2 p = uv * vec2(uViewAspect,1.0) * (3.0*uRippleScale);
  vec2 flow = vec2(0.15*sin(t*0.4 + p.y*1.5), -t*0.9);      // mostly downward flow
  float h = fbm(p + flow);
  h += 0.5  * fbm(p*2.3 + flow*1.6 + 17.0);
  h += 0.18 * sin(p.y*22.0 + t*3.5 + fbm(p*3.0 + flow)*7.0); // thin water-film bands
  return h/1.68;
}
void main(){
  float t = uTime*uRippleSpeed;
  float e = 0.006;
  float h0 = height(v_uv, t);
  float hx = height(v_uv + vec2(e,0.), t);
  float hy = height(v_uv + vec2(0.,e), t);
  vec2 n = vec2(h0-hx, h0-hy)/e * 0.12 * uRippleStrength;    // slope -> normal.xy
  n = clamp(n, -1.0, 1.0);
  o = vec4(n*0.5+0.5, clamp(h0,0.,1.), 1.0);
}`;

// 4) COMPOSITE — the core water look + drips. Renders into the scene FBO.
const FS_COMP = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D uVideo, uMaskField, uNormals;
uniform vec2  uResolution;
uniform float uVideoAspect, uViewAspect;
uniform bool  uMirror, uMaskReady, uShowMask;
uniform float uRefract, uSpecular, uFresnel, uMono, uDripAmount, uDripSpeed, uTime;

float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
float hash1(float x){ return fract(sin(x*127.1)*43758.5453); }

// canvas uv -> video uv: cover-fit crop, then mirror. The mask lives in video uv space
// (segmentation ran on the raw frame), so the SAME transform keeps them aligned.
vec2 coverUV(vec2 uv){
  if (uViewAspect > uVideoAspect) uv.y = (uv.y-0.5)*(uVideoAspect/uViewAspect)+0.5; // crop top/bottom
  else                            uv.x = (uv.x-0.5)*(uViewAspect/uVideoAspect)+0.5; // crop sides
  if (uMirror) uv.x = 1.0 - uv.x;
  return uv;
}

void main(){
  vec2 vuv = coverUV(v_uv);

  vec4 mf   = texture(uMaskField, vuv);
  float mask = uMaskReady ? mf.r : 0.0;

  if (uShowMask){ o = vec4(vec3(mask),1.0); return; }

  vec3 raw = texture(uVideo, vuv).rgb;
  if (!uMaskReady){ o = vec4(raw,1.0); return; }   // passthrough until the model is up

  vec4 nrm = texture(uNormals, v_uv);
  vec2 n2  = nrm.xy*2.0 - 1.0;
  float hgt = nrm.z;

  // --- protect facial detail: strong local luminance gradient => damp the effect ---
  vec2 dpx = vec2(2.0)/uResolution;
  float l0 = lum(raw);
  float gx = lum(texture(uVideo, vuv+vec2(dpx.x,0.)).rgb) - l0;
  float gy = lum(texture(uVideo, vuv+vec2(0.,dpx.y)).rgb) - l0;
  float detail = clamp(length(vec2(gx,gy))*9.0, 0.0, 1.0);

  // --- refraction: bend the image under the water surface ---
  float eff = mask*(1.0 - 0.55*detail);
  vec2 ruv  = vuv + n2*(0.06*uRefract)*eff;
  vec3 src  = texture(uVideo, ruv).rgb;

  // --- preserved shading, lifted contrast, silver monochrome ---
  float l = lum(src);
  l = clamp((l-0.5)*1.35 + 0.5, 0.0, 1.0);
  vec3 silver = vec3(l)*vec3(0.93,0.98,1.06);      // slightly cool tint
  vec3 base = mix(src, silver, uMono);

  // --- specular + crest glints (Blinn-ish, fixed upper-left light) ---
  vec3 N = normalize(vec3(n2, 0.9));
  vec3 L = normalize(vec3(-0.35, 0.60, 0.72));
  vec3 H = normalize(L + vec3(0.,0.,1.));
  float ndh   = max(dot(N,H), 0.0);
  float spec  = pow(ndh, 64.0);
  float glint = pow(ndh, 220.0);
  float crest = smoothstep(0.55, 0.85, hgt);
  vec3 water = base + uSpecular*(spec*0.9 + glint*1.6*(0.5+crest))*vec3(0.95,1.0,1.05)*mask;

  // --- Fresnel-style rim: bright meniscus band on the soft mask ramp ---
  float rim = smoothstep(0.03,0.35,mask)*(1.0 - smoothstep(0.45,0.90,mask));
  water += uFresnel*rim*vec3(0.75,0.88,1.0)*0.7;

  vec3 bg  = vec3(0.012,0.014,0.020);
  vec3 col = mix(bg, water, smoothstep(0.12, 0.55, mask));

  // --- drips: thin animated water threads hanging below the silhouette ---
  if (uDripAmount > 0.001 && mask < 0.35){
    vec2 fragPx = v_uv*uResolution;
    float colW  = max(6.0, uResolution.x/160.0);          // drip column width in px
    float cid   = floor(fragPx.x/colW);
    float r     = hash1(cid*1.618 + 4.7);
    if (r < uDripAmount){
      float maxLen = 0.16 + 0.10*hash1(cid + 9.1);        // uv units below the edge
      float below  = -1.0;                                 // distance up to silhouette
      for (int i=1; i<=20; i++){
        float dy = float(i)/20.0*maxLen;
        float m2 = texture(uMaskField, coverUV(v_uv + vec2(0.,dy))).r;
        if (m2 > 0.5){ below = dy; break; }
      }
      if (below > 0.0){
        float phase = fract(uTime*(0.25+0.6*hash1(cid*2.3))*uDripSpeed*2.0 + hash1(cid*3.1)*7.0);
        float len   = maxLen*phase;                        // the falling head position
        float cx    = (cid+0.5)*colW;
        float wob   = sin(v_uv.y*34.0 + hash1(cid)*20.0 + uTime*1.5)*1.6;
        float xd    = abs(fragPx.x - cx - wob);
        float wpx   = 1.3 + 1.6*hash1(cid*5.7);
        float thread= exp(-xd*xd/(wpx*wpx));
        float body  = step(below, len)*mix(0.35, 0.9, 1.0-below/maxLen);
        float head  = exp(-pow((below-len)*90.0, 2.0))*1.4; // droplet at the head
        float d = thread*(body*0.5 + head)*smoothstep(0.35, 0.15, mask);
        col += d*vec3(0.80,0.90,1.0);
      }
    }
  }
  o = vec4(col, 1.0);
}`;

// 5) BRIGHT — soft-threshold the scene for bloom (half-res).
const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D uScene;
void main(){
  vec3 c = texture(uScene, v_uv).rgb;
  float b = max(max(c.r,c.g), c.b);
  o = vec4(c*smoothstep(0.72, 0.95, b), 1.0);
}`;

// 6) BLUR — 9-tap blur of the bright pass.
const FS_BLUR = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D uTex;
uniform vec2 uTexel;
void main(){
  const vec2 T[9] = vec2[9](vec2(0,0),vec2(1,0),vec2(-1,0),vec2(0,1),vec2(0,-1),
                            vec2(1,1),vec2(-1,1),vec2(1,-1),vec2(-1,-1));
  const float W[9] = float[9](0.25,0.125,0.125,0.125,0.125,0.0625,0.0625,0.0625,0.0625);
  vec3 s = vec3(0.);
  for (int i=0;i<9;i++) s += W[i]*texture(uTex, v_uv + T[i]*uTexel*2.2).rgb;
  o = vec4(s, 1.0);
}`;

// 7) FINAL — scene + bloom, vignette, subtle grain.
const FS_FINAL = `#version 300 es
precision highp float;
in vec2 v_uv; out vec4 o;
uniform sampler2D uScene, uBloom;
uniform float uBloomAmt, uVignette, uTime;
float hash2(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
void main(){
  vec3 c = texture(uScene, v_uv).rgb + texture(uBloom, v_uv).rgb*uBloomAmt;
  vec2 q = v_uv - 0.5;
  c *= clamp(1.0 - uVignette*dot(q,q)*1.7, 0.0, 1.0);
  c += (hash2(v_uv*vec2(1223.,911.) + fract(uTime)*17.0) - 0.5)*0.03;
  o = vec4(c, 1.0);
}`;

/* ============================== GL setup ============================== */
const $ = id => document.getElementById(id);
const canvas = $("gl");
const gl = canvas.getContext("webgl2", { antialias:false, alpha:false, preserveDrawingBuffer:true });

const stateEl = $("state"), stateBox = $("stateBox"), chip = $("chip");
function showState(html){ stateBox.innerHTML = html; stateEl.classList.add("show"); wireRetry(); }
function hideState(){ stateEl.classList.remove("show"); }
function escapeHtml(s){ return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
const stateRequesting = () => `<h1>Requesting camera</h1><p class="dots">Allow camera access to start the water figure</p>`;
const stateDenied = (m) => `<h1>Camera blocked</h1><p>Access was denied. Allow the camera for this page in your browser's site settings, then retry.${m?`<br><br>(${escapeHtml(m)})`:""}</p><button data-retry>Retry</button>`;
const stateNoCam = () => `<h1>No camera found</h1><p>No video input device is available. Connect a camera and retry.</p><button data-retry>Retry</button>`;
const stateInsecure = () => `<h1>Secure context required</h1><p>The camera and module imports are unavailable here. Serve this file over <code>localhost</code> or <code>https</code> — e.g. <code>python3 -m http.server</code> then open <code>http://localhost:8000</code>.</p><button data-retry>Retry</button>`;
const stateNoWebGL = (m) => `<h1>WebGL2 unavailable</h1><p>This browser could not start WebGL2.${m?`<br><br>(${escapeHtml(m)})`:""}</p>`;
const stateModelFail = (m) => `<h1>Model failed to load</h1><p>The MediaPipe segmentation model could not be loaded (network/CDN?).${m?`<br><br>(${escapeHtml(m)})`:""}</p><button data-retry-model>Retry model</button>`;
function wireRetry(){
  const a = stateBox.querySelector("[data-retry]");
  if (a) a.addEventListener("click", ()=>{ hideState(); startCamera(); });
  const b = stateBox.querySelector("[data-retry-model]");
  if (b) b.addEventListener("click", ()=>{ hideState(); loadModel(); });
}

if (!gl){ showState(stateNoWebGL()); throw new Error("no webgl2"); }

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
let P = {};
try{
  P = { maskBlur:program(FS_MASKBLUR), maskField:program(FS_MASKFIELD), normals:program(FS_NORMALS),
        comp:program(FS_COMP), bright:program(FS_BRIGHT), blur:program(FS_BLUR), final:program(FS_FINAL) };
}catch(e){ showState(stateNoWebGL(e.message)); throw e; }
const loc = (p,n)=>gl.getUniformLocation(p,n);
const vao = gl.createVertexArray();

function makeTex(w,h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function makeFBO(w,h){
  const tex = makeTex(w,h);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}

// video + raw-mask textures
const videoTex = makeTex(2,2);
const maskRawTex = makeTex(2,2);
let maskW = 0, maskH = 0;

// fixed small FBOs for the mask field
const maskBlurF  = makeFBO(MASK_FBO, MASK_FBO);
const maskFieldF = makeFBO(MASK_FBO, MASK_FBO);

// canvas-sized FBOs (rebuilt on resize)
let sceneF=null, normalsF=null, brightF=null, bloomF=null;
function rebuildFBOs(){
  for (const f of [sceneF, normalsF, brightF, bloomF]) if (f){ gl.deleteTexture(f.tex); gl.deleteFramebuffer(f.fbo); }
  const w=canvas.width, h=canvas.height, hw=Math.max(1,w>>1), hh=Math.max(1,h>>1);
  sceneF   = makeFBO(w,h);
  normalsF = makeFBO(hw,hh);
  brightF  = makeFBO(hw,hh);
  bloomF   = makeFBO(hw,hh);
}
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width  = Math.max(1, Math.round(innerWidth*dpr));
  canvas.height = Math.max(1, Math.round(innerHeight*dpr));
  rebuildFBOs();
}
addEventListener("resize", resize);
resize();

/* ============================== camera ============================== */
const video = document.createElement("video");
video.playsInline = true; video.muted = true; video.autoplay = true;
let videoReady = false, stream = null;

async function startCamera(){
  if (!isSecureContext || !navigator.mediaDevices?.getUserMedia){ showState(stateInsecure()); return; }
  showState(stateRequesting());
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ width:{ideal:1280}, height:{ideal:720}, facingMode:"user" }, audio:false
    });
    video.srcObject = stream;
    await video.play();
    videoReady = true;
    hideState();
  }catch(err){
    if (err && (err.name==="NotAllowedError" || err.name==="SecurityError")) showState(stateDenied());
    else if (err && err.name==="NotFoundError") showState(stateNoCam());
    else showState(stateDenied(err && err.message));
  }
}
addEventListener("pagehide", ()=>{ if (stream) stream.getTracks().forEach(t=>t.stop()); });

/* ============================== MediaPipe model ============================== */
let segmenter = null, personIdx = -1, modelStatus = "idle";
let maskReady = false, maskDirty = false;
let segDelegate = "GPU", segCost = 20, segBadRun = 0, segSwitching = false;
let SegClass = null, segFiles = null;
const segSrc = document.createElement("canvas");
const segSrcCtx = segSrc.getContext("2d");

const segOpts = (delegate)=>({
  baseOptions:{ modelAssetPath: MODEL_URL, delegate },
  runningMode:"VIDEO", outputCategoryMask:false, outputConfidenceMasks:true
});

async function loadModel(){
  modelStatus = "loading"; chip.classList.add("show"); updateReadout();
  try{
    const { ImageSegmenter, FilesetResolver } = await import(CDN_BUNDLE);
    SegClass = ImageSegmenter;
    segFiles = await FilesetResolver.forVisionTasks(CDN_WASM);
    try{
      segmenter = await ImageSegmenter.createFromOptions(segFiles, segOpts("GPU"));
      segDelegate = "GPU";
    }catch(_){
      // some mobile GPUs reject the GPU delegate outright — fall back to CPU
      segmenter = await ImageSegmenter.createFromOptions(segFiles, segOpts("CPU"));
      segDelegate = "CPU";
    }
    // find which confidence mask is the person (labels differ across models)
    try{
      const labels = segmenter.getLabels ? (segmenter.getLabels()||[]) : [];
      personIdx = labels.findIndex(l=>/person|selfie|fore/i.test(String(l)));
    }catch(_){ personIdx = -1; }
    modelStatus = "ready"; chip.classList.remove("show");
  }catch(err){
    modelStatus = "failed"; chip.classList.remove("show");
    showState(stateModelFail(err && err.message));
  }
  updateReadout();
}

// Some mobile GPU delegates "succeed" but emit degenerate masks (all-zero or
// all-one). When that persists, rebuild the segmenter on the CPU delegate.
async function switchToCpuDelegate(){
  if (segSwitching || segDelegate === "CPU" || !SegClass || !segFiles) return;
  segSwitching = true;
  try{
    const next = await SegClass.createFromOptions(segFiles, segOpts("CPU"));
    try{ if (segmenter && segmenter.close) segmenter.close(); }catch(_){}
    segmenter = next; segDelegate = "CPU"; segBadRun = 0;
    console.warn("water-cam: GPU segmentation output looked broken — switched to CPU delegate");
  }catch(_){ /* keep the GPU segmenter */ }
  segSwitching = false;
}

// Mobile only: segment a ≤288px copy of the frame (10-20x cheaper, and the
// mask is consumed through a 384px blur anyway). Desktop returns the raw
// video element — byte-identical to the original pipeline.
function segInput(){
  if (!SEG_SMALL) return video;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.min(1, SEG_MAX_SIDE / Math.max(vw, vh));
  const cw = Math.max(2, Math.round(vw*s)), ch = Math.max(2, Math.round(vh*s));
  if (segSrc.width !== cw || segSrc.height !== ch){ segSrc.width = cw; segSrc.height = ch; }
  segSrcCtx.drawImage(video, 0, 0, cw, ch);
  return segSrc;
}

function runSegmentation(){
  if (!segmenter || segSwitching || !videoReady || video.readyState < 2 || !video.videoWidth) return;
  const t0 = performance.now();
  try{
    segmenter.segmentForVideo(segInput(), t0, (res)=>{
      const masks = res.confidenceMasks;
      if (masks && masks.length){
        const idx = (personIdx >= 0 && personIdx < masks.length) ? personIdx : masks.length-1;
        uploadMask(masks[idx]);          // copy out inside the callback (masks freed after)
      }
    });
  }catch(_){
    if (SEG_SMALL && ++segBadRun > 40) switchToCpuDelegate();
  }
  segCost = segCost*0.8 + (performance.now() - t0)*0.2;
}

// Inference must never own the main thread: it runs on its own timer, outside
// rAF. Desktop keeps the original ~30 Hz; slow phones (CPU delegate) back off
// up to 250 ms and the latest mask is simply reused between results.
function segTick(){
  if (!document.hidden) runSegmentation();
  const interval = SEG_SMALL ? Math.max(33, Math.min(250, segCost*1.7)) : 33;
  setTimeout(segTick, interval);
}
segTick();

function uploadMask(mpMask){
  maskW = mpMask.width; maskH = mpMask.height;
  const data = mpMask.getAsUint8Array();            // confidence 0..255
  if (SEG_SMALL){
    // GPU-health watchdog: mean coverage ~0 or ~1 for >40 consecutive
    // results means the delegate is emitting garbage, not "no person".
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i];
    const cover = sum / (data.length * 255);
    segBadRun = (cover < 0.002 || cover > 0.97) ? segBadRun + 1 : 0;
    if (segBadRun > 40) switchToCpuDelegate();
  }
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);    // keep raw top-row-first; shader flips
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.bindTexture(gl.TEXTURE_2D, maskRawTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.R8,maskW,maskH,0,gl.RED,gl.UNSIGNED_BYTE,data);
  maskReady = true; maskDirty = true;
}

/* ============================== render loop ============================== */
let vt = 0, lastNow = performance.now();
let fps = 0, fpsAcc = 0, fpsN = 0;

function draw(prog, fbo, w, h){
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0,0,w,h);
  gl.useProgram(prog);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(now - lastNow, 50); lastNow = now;
  if (!S.paused) vt += dt/1000;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 500){ fps = Math.round(1000*fpsN/fpsAcc); fpsAcc=0; fpsN=0; updateReadout(); }

  gl.bindVertexArray(vao);

  if (!videoReady || !video.videoWidth){
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0.039,0.067,0.098,1); gl.clear(gl.COLOR_BUFFER_BIT);
    return;
  }

  // upload the current webcam frame (flipped => y-up uv space)
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, videoTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);

  // segmentation runs on its own adaptive timer (segTick) — never in rAF

  // 1+2) mask blur + field — only when a fresh mask arrived
  if (maskDirty){
    gl.useProgram(P.maskBlur);
    gl.uniform1i(loc(P.maskBlur,"uMaskRaw"), 0);
    gl.uniform2f(loc(P.maskBlur,"uTexel"), 1/Math.max(1,maskW), 1/Math.max(1,maskH));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, maskRawTex);
    draw(P.maskBlur, maskBlurF.fbo, maskBlurF.w, maskBlurF.h);

    gl.useProgram(P.maskField);
    gl.uniform1i(loc(P.maskField,"uMaskBlur"), 0);
    gl.uniform2f(loc(P.maskField,"uTexel"), 1/MASK_FBO, 1/MASK_FBO);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, maskBlurF.tex);
    draw(P.maskField, maskFieldF.fbo, maskFieldF.w, maskFieldF.h);
    maskDirty = false;
  }

  // 3) water normals (half-res, animated)
  gl.useProgram(P.normals);
  gl.uniform1f(loc(P.normals,"uTime"), vt);
  gl.uniform1f(loc(P.normals,"uRippleScale"), S.rippleScale);
  gl.uniform1f(loc(P.normals,"uRippleSpeed"), S.rippleSpeed);
  gl.uniform1f(loc(P.normals,"uRippleStrength"), S.rippleStrength);
  gl.uniform1f(loc(P.normals,"uViewAspect"), canvas.width/canvas.height);
  draw(P.normals, normalsF.fbo, normalsF.w, normalsF.h);

  // 4) water composite (+ drips) -> scene
  gl.useProgram(P.comp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, videoTex);      gl.uniform1i(loc(P.comp,"uVideo"),0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, maskFieldF.tex);gl.uniform1i(loc(P.comp,"uMaskField"),1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, normalsF.tex);  gl.uniform1i(loc(P.comp,"uNormals"),2);
  gl.uniform2f(loc(P.comp,"uResolution"), canvas.width, canvas.height);
  gl.uniform1f(loc(P.comp,"uVideoAspect"), video.videoWidth/video.videoHeight);
  gl.uniform1f(loc(P.comp,"uViewAspect"), canvas.width/canvas.height);
  gl.uniform1i(loc(P.comp,"uMirror"), S.mirror?1:0);
  gl.uniform1i(loc(P.comp,"uMaskReady"), maskReady?1:0);
  gl.uniform1i(loc(P.comp,"uShowMask"), S.showMask?1:0);
  gl.uniform1f(loc(P.comp,"uRefract"), S.refract);
  gl.uniform1f(loc(P.comp,"uSpecular"), S.specular);
  gl.uniform1f(loc(P.comp,"uFresnel"), S.fresnel);
  gl.uniform1f(loc(P.comp,"uMono"), S.mono);
  gl.uniform1f(loc(P.comp,"uDripAmount"), S.drip);
  gl.uniform1f(loc(P.comp,"uDripSpeed"), S.dripSpeed);
  gl.uniform1f(loc(P.comp,"uTime"), vt);
  draw(P.comp, sceneF.fbo, sceneF.w, sceneF.h);

  // 5) bright -> 6) blur (bloom chain, half-res)
  gl.useProgram(P.bright);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneF.tex);
  gl.uniform1i(loc(P.bright,"uScene"),0);
  draw(P.bright, brightF.fbo, brightF.w, brightF.h);

  gl.useProgram(P.blur);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, brightF.tex);
  gl.uniform1i(loc(P.blur,"uTex"),0);
  gl.uniform2f(loc(P.blur,"uTexel"), 1/brightF.w, 1/brightF.h);
  draw(P.blur, bloomF.fbo, bloomF.w, bloomF.h);

  // 7) final -> screen
  gl.useProgram(P.final);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneF.tex); gl.uniform1i(loc(P.final,"uScene"),0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomF.tex); gl.uniform1i(loc(P.final,"uBloom"),1);
  gl.uniform1f(loc(P.final,"uBloomAmt"), S.bloom);
  gl.uniform1f(loc(P.final,"uVignette"), S.vignette);
  gl.uniform1f(loc(P.final,"uTime"), vt);
  draw(P.final, null, canvas.width, canvas.height);
}
requestAnimationFrame(frame);

/* ============================== UI ============================== */
function bindSlider(id, key){
  const el = $(id), out = $("v"+id[0].toUpperCase()+id.slice(1));
  const show = ()=>{ out.textContent = Number(S[key]).toFixed(2); };
  el.value = S[key]; show();
  el.addEventListener("input", ()=>{ S[key] = parseFloat(el.value); show(); });
}
["refract","rippleScale","rippleSpeed","rippleStrength","specular","fresnel",
 "mono","drip","dripSpeed","bloom","vignette"].forEach(id=>{
  bindSlider(id, id);
});
function bindToggle(id, key){
  const el = $(id);
  const paint = ()=>{ el.setAttribute("aria-pressed", String(S[key])); el.querySelector("i").textContent = S[key]?"[X]":"[ ]"; };
  paint();
  el.addEventListener("click", ()=>{ S[key] = !S[key]; paint(); updateReadout(); });
}
bindToggle("mirror","mirror");
bindToggle("pause","paused");
bindToggle("showMask","showMask");

$("toggle").addEventListener("click", ()=>{
  const c = $("panel").classList.toggle("collapsed");
  $("toggle").setAttribute("aria-expanded", String(!c));
});
$("save").addEventListener("click", ()=>{
  canvas.toBlob(b=>{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = `water-cam_${Date.now()}.png`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
});
function updateReadout(){
  const res = videoReady ? `${video.videoWidth}×${video.videoHeight}` : "—";
  const seg = modelStatus === "ready" ? ` (${segDelegate} ${segCost.toFixed(0)}ms)` : "";
  $("readout").innerHTML =
    `cam <b>${res}</b> · mask <b>${maskReady?"on":"off"}</b> · model <b>${modelStatus}${seg}</b> · <b>${fps}</b> fps`;
}
updateReadout();

/* ============================== boot ============================== */
await startCamera();
loadModel();          // async; passthrough renders until the mask engages
</script>
</body>
</html>
