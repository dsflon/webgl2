  <body>
    <canvas id="gl" aria-label="WebGL2 song of flowers webcam"></canvas>
    <video id="video" playsinline muted autoplay></video>

    <button id="togglePanel" type="button" class="top-btn hidden"
      aria-label="コントローラーを開く" aria-expanded="true">☰</button>
    <button id="flipCamera" type="button" class="top-btn" aria-label="カメラ切替">背面カメラ</button>
    <div id="statusChip">起動中</div>

    <section id="panel" class="panel" aria-label="Song of flowers controls"></section>

    <div id="overlay" role="status" aria-live="polite">
      <div class="overlay-card">
        <h2 id="overlayTitle">REQUESTING CAMERA</h2>
        <p id="overlayText">
          Please allow webcam access. Serve this file from localhost or HTTPS.
        </p>
        <button id="retryCamera" type="button" hidden>RETRY CAMERA</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("gl");
        const video = document.getElementById("video");
        const panel = document.getElementById("panel");
        const togglePanel = document.getElementById("togglePanel");
        const flipCameraBtn = document.getElementById("flipCamera");
        const statusChip = document.getElementById("statusChip");
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlayText = document.getElementById("overlayText");
        const retryCamera = document.getElementById("retryCamera");

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        const QUERY = new URLSearchParams(location.search);
        // ?fakesource=1 replaces BOTH inputs: a synthetic room + a full-body
        // figure that drifts and swings its limbs stands in for the camera, and
        // a scripted 18s song (intro / verse / chorus / bridge / fade) stands in
        // for the microphone. Neither MediaPipe nor WebAudio is ever touched, so
        // the whole growth pipeline runs offline and deterministically.
        const FAKE = QUERY.get("fakesource") === "1";
        // ?freeze=1 makes dt = 0: plant stages, petal physics, the audio EMAs,
        // the fake figure and every mask EMA stop → deterministic still frame.
        const FREEZE = QUERY.get("freeze") === "1";
        // ?fakeseg=1 (offline diagnostic; use with fakesource=1): forces the
        // uSource==1 real-camera mask path and feeds it a synthetic R8 mask of
        // KNOWN orientation (person in the TOP ~60% of image space, top-left
        // origin, uploaded UNPACK_FLIP_Y=false exactly like a MediaPipe mask).
        // With the Y-flip correct the flowers must sprout around the TOP figure;
        // if they gather at the bottom the flip regressed (CRAFT §C1).
        const FAKESEG = QUERY.get("fakeseg") === "1";
        // ?fakescale=<f> scales the synthetic figure (real-scale divergence test,
        // CRAFT §C2). f>1 = big/close, f<1 = far/small. Default 1.0.
        const FAKESCALE = (() => {
          const v = parseFloat(QUERY.get("fakescale"));
          return Number.isFinite(v) && v > 0.05 ? Math.min(4, v) : 1.0;
        })();
        // ?prewarm=<sec> fast-forwards the simulation with a fixed dt before the
        // first present, so a screenshot shows grown flowers instead of bare
        // ground (the verification GPU is far too slow to warm in real time —
        // CRAFT §C4). Chunked + glSync'd so the compositor is never parked.
        const PREWARM = (() => {
          const v = parseFloat(QUERY.get("prewarm"));
          return Number.isFinite(v) && v > 0 ? Math.min(30, v) : 0;
        })();
        const PREWARM_DT = 1 / 24;

        const DEBUG_MODES = [
          "最終",
          "マスク/運動",
          "音の特徴量",
          "芽吹き場",
          "花・花びら層",
          "配色標本",
        ];

        const DEFAULTS = {
          bloomAmt: 0.62,
          micGain: 0.55,
          growth: 0.55,
          wind: 0.5,
          fall: 0.5,
          headSize: 0.5,
          glow: 0.6,
          hueMove: 0.6,
          bgAbstract: 0.55,
          exposure: 1.0,
          filmGrain: 0.18,
        };

        const state = {
          ...DEFAULTS,
          debugView: 0,
          mirror: true,
          facingMode: "user",
          pauseAnim: reducedMotion || FREEZE,
        };

        const uiRows = [
          ["bloomAmt", "咲きの量", "同時に育つ株の数と発芽の勢い", 0, 1, 0.01],
          ["micGain", "音の感度", "マイク入力のゲイン(小声でも咲かせるなら上げる)", 0, 1, 0.01],
          ["growth", "伸びる速さ", "声で芽吹き茎が伸びる速さ", 0, 1, 0.01],
          ["wind", "風・渦", "体の動きが生む突風とカールノイズの渦", 0, 1, 0.01],
          ["fall", "散り", "花びらの散る量と萎れの速さ", 0, 1, 0.01],
          ["headSize", "花の大きさ", "花冠・花びらの大きさ", 0, 1, 0.01],
          ["glow", "発光", "花芯とブルームの光の強さ", 0, 1, 0.01],
          ["hueMove", "色の移ろい", "声色(スペクトル重心)が色相を動かす量", 0, 1, 0.01],
          ["bgAbstract", "背景の抽象度", "実写背景が夜の花園へ溶ける度合い(0=実写のまま)", 0, 1, 0.01],
          ["exposure", "明るさ", "画面全体の露出", 0.6, 1.4, 0.01],
          ["filmGrain", "フィルム粒子", "全面の静的グレイン", 0, 1, 0.01],
        ];

        panel.innerHTML = `
          <button id="closePanel" type="button" aria-label="コントローラーを閉じる">✕</button>
          <div class="panel-body">
          <h1>OPUS5 · 花</h1>
          <p>
            歌とギターの音で花が育ちます。声が続くと芽が出て茎が伸び、弦のアタックで
            蕾がほどけ、盛り上がりで一斉に開花し、静けさが続けば萎れて散ります。
            声色が色相、音高が茎の高さ、息のノイズが綿毛になります。人物は実写のまま、
            背景は周縁から夜の花園へ溶けます。マイクとカメラは端末内で処理されます。
          </p>
          <div class="select-row">
            <span>デバッグ表示</span>
            <select id="debugView" aria-label="デバッグ表示">
              ${DEBUG_MODES.map(
                (label, i) => `<option value="${i}">${label}</option>`,
              ).join("")}
            </select>
          </div>
          ${uiRows
            .map(
              ([key, label, hint, min, max, step]) => `
                <div class="row">
                  <label for="${key}">
                    ${label}
                    <span>${hint}</span>
                  </label>
                  <output id="${key}Out">${formatValue(state[key])}</output>
                  <input id="${key}" type="range" min="${min}" max="${max}"
                    step="${step}" value="${state[key]}" />
                </div>
              `,
            )
            .join("")}
          <label class="check-row">
            <span>左右反転(鏡)</span>
            <input id="mirror" type="checkbox" ${state.mirror ? "checked" : ""} />
          </label>
          <label class="check-row">
            <span>ゆらぎを停止</span>
            <input id="pauseAnim" type="checkbox" ${state.pauseAnim ? "checked" : ""} />
          </label>
          <div class="meter" aria-label="入力音量"><i id="levelBar"></i></div>
          <div class="buttons">
            <button id="savePng" type="button">PNG保存</button>
            <button id="resetLook" type="button">リセット</button>
            <button id="micRetry" type="button">マイク再試行</button>
          </div>
          <div class="status">
            <div id="readout">FPS -- / 解像度 -- / 株 -- / 花びら -- / 音 -- / 検知 --</div>
            <span class="badge">WebGL2 · Mic + MediaPipe · GPU Plants</span>
          </div>
          </div>
        `;

        uiRows.forEach(([key]) => {
          const input = document.getElementById(key);
          const out = document.getElementById(`${key}Out`);
          input.addEventListener("input", () => {
            state[key] = Number(input.value);
            out.textContent = formatValue(state[key]);
          });
        });

        function setSlider(key, value) {
          state[key] = value;
          const input = document.getElementById(key);
          const out = document.getElementById(`${key}Out`);
          if (input) input.value = value;
          if (out) out.textContent = formatValue(value);
        }

        document.getElementById("debugView").addEventListener("change", (event) => {
          state.debugView = Number(event.currentTarget.value);
        });
        document.getElementById("mirror").addEventListener("change", (event) => {
          state.mirror = event.currentTarget.checked;
        });
        document.getElementById("pauseAnim").addEventListener("change", (event) => {
          state.pauseAnim = event.currentTarget.checked;
        });
        document.getElementById("resetLook").addEventListener("click", () => {
          Object.keys(DEFAULTS).forEach((key) => setSlider(key, DEFAULTS[key]));
        });

        const closePanel = document.getElementById("closePanel");
        function setPanelCollapsed(collapsed) {
          panel.classList.toggle("collapsed", collapsed);
          togglePanel.classList.toggle("hidden", !collapsed);
          togglePanel.setAttribute("aria-expanded", String(!collapsed));
        }
        togglePanel.addEventListener("click", () => setPanelCollapsed(false));
        closePanel.addEventListener("click", () => setPanelCollapsed(true));
        const isMobile = window.matchMedia("(max-width: 640px)").matches;
        setPanelCollapsed(isMobile);

        flipCameraBtn.addEventListener("click", () => {
          state.facingMode = state.facingMode === "user" ? "environment" : "user";
          flipCameraBtn.textContent =
            state.facingMode === "user" ? "背面カメラ" : "前面カメラ";
          state.mirror = state.facingMode === "user";
          document.getElementById("mirror").checked = state.mirror;
          startCamera();
        });

        document.getElementById("savePng").addEventListener("click", () => {
          const link = document.createElement("a");
          const stamp = new Date().toISOString().replace(/[:.]/g, "-");
          link.download = `opus5-hana-${stamp}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        });

        function formatValue(value) {
          return Number(value).toFixed(Math.abs(value) >= 10 ? 0 : 2);
        }

        function setOverlay(kind, title, text, buttons = {}) {
          overlayTitle.textContent = title;
          overlayText.textContent = text;
          retryCamera.hidden = !buttons.retryCamera;
          overlay.classList.toggle("hidden", kind === "hidden");
        }

        /* ------------------------------------------------------------------
           WebGL2 setup
        ------------------------------------------------------------------ */

        const gl = canvas.getContext("webgl2", {
          alpha: false,
          antialias: false,
          depth: false,
          stencil: false,
          preserveDrawingBuffer: true,
          powerPreference: "high-performance",
        });

        if (!gl) {
          setOverlay(
            "error",
            "WEBGL2 UNAVAILABLE",
            "This piece needs WebGL2. Try a current desktop/mobile browser with hardware acceleration enabled.",
          );
          return;
        }

        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.CULL_FACE);
        gl.disable(gl.BLEND);

        // Float render targets keep the plant/petal state and the HDR flower
        // layer from stalling in 8 bits. Signed velocity is offset-encoded into
        // [0,1] (encV) so the RGBA8 fallback runs the same shaders, coarser.
        const floatExt = gl.getExtension("EXT_color_buffer_float");

        // Renderer probe → pool sizing. Software (SwiftShader in the verifier)
        // and coarse-pointer (mobile) devices get smaller pools.
        const dbgRI = gl.getExtension("WEBGL_debug_renderer_info");
        const RENDERER = dbgRI ? gl.getParameter(dbgRI.UNMASKED_RENDERER_WEBGL) : "";
        const IS_SOFT = /swiftshader|llvmpipe|software|basic|subzero/i.test(RENDERER);
        const COARSE = window.matchMedia("(pointer: coarse)").matches;

        // Rooted plants live in a tiny state texture (one texel per plant, two
        // MRT attachments). The pool is FIXED, which is what bounds the picture
        // (invariant 5): flowers can never accumulate past PLANT_N.
        const PLANT_W = IS_SOFT ? 14 : (COARSE ? 16 : 28);
        const PLANT_H = IS_SOFT ? 6 : (COARSE ? 7 : 10);
        const PLANT_N = PLANT_W * PLANT_H;      // 84 / 112 / 280
        const STEM_SEGS = 7;                    // quads per stem
        const LEAF_N = 3;                       // leaves per plant
        const STEM_PER = STEM_SEGS + LEAF_N;    // instances per plant

        // Free-flying petals / seed fluff. Sized to the expected live population
        // (shed rate x lifetime), not to a huge spray: each petal must be big
        // enough to read as a petal (CRAFT §B1).
        const PETAL_SIDE = IS_SOFT ? 56 : (COARSE ? 64 : 96);
        const PETAL_W = PETAL_SIDE;
        const PETAL_H = PETAL_SIDE;
        const PETAL_N = PETAL_W * PETAL_H;      // 3136 / 4096 / 9216

        const fullscreenVS = `#version 300 es
          precision highp float;
          const vec2 POS[3] = vec2[3](
            vec2(-1.0, -1.0), vec2( 3.0, -1.0), vec2(-1.0,  3.0)
          );
          out vec2 vUv;
          void main() {
            vec2 p = POS[gl_VertexID];
            vUv = p * 0.5 + 0.5;
            gl_Position = vec4(p, 0.0, 1.0);
          }
        `;

        // Shared: pcg-flavoured hashes + value noise + fbm + curl noise (unit
        // scaled) + the 2D SDF helpers. Grain, mottle and every placement seed
        // are derived from POSITION or INDEX only — never from uTime (repo rule)
        // so they stay deterministic under ?freeze=1.
        const CHUNK_NOISE = `
          const float PI2 = 6.28318530718;
          float hash12(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
          }
          vec2 hash22(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
            p3 += dot(p3, p3.yxz + 33.33);
            return fract((p3.xx + p3.yz) * p3.zy);
          }
          float h11(float p) {
            p = fract(p * 0.1031);
            p *= p + 33.33;
            p *= p + p;
            return fract(p);
          }
          float vnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash12(i);
            float b = hash12(i + vec2(1.0, 0.0));
            float c = hash12(i + vec2(0.0, 1.0));
            float d = hash12(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }
          float fbm4(vec2 p) {
            float s = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 4; i++) {
              s += amp * vnoise(p);
              p *= 2.03;
              amp *= 0.5;
            }
            return s;
          }
          float fbm(vec2 p) {
            float s = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 5; i++) {
              s += amp * vnoise(p);
              p *= 2.03;
              amp *= 0.5;
            }
            return s;
          }
          // curl of value noise, normalised to ≈ unit scale (a raw finite
          // difference divided by 2e reaches ~20 and turns a "small" coefficient
          // into a 200px warp — CRAFT / kiin-seido §8-3).
          vec2 curlN(vec2 p) {
            float e = 0.35;
            float n1 = vnoise(p + vec2(0.0, e)) - vnoise(p - vec2(0.0, e));
            float n2 = vnoise(p + vec2(e, 0.0)) - vnoise(p - vec2(e, 0.0));
            return vec2(n1, -n2) * 1.6;
          }
          float sdSeg(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a;
            vec2 ba = b - a;
            float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
            return length(pa - ba * h);
          }
          float smin2(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
          }
        `;

        // Shared: [0,1] offset encoding for signed fields. The clamp doubles as
        // the mandatory velocity clamp (no NaN blow-ups).
        const CHUNK_ENC = `
          const float VMAX = 2.4;
          vec2 encV(vec2 v) { return clamp(v, -VMAX, VMAX) / (2.0 * VMAX) + 0.5; }
          vec2 decV(vec2 e) { return (e - 0.5) * (2.0 * VMAX); }
        `;

        // Shared: the ?fakesource=1 synthetic scene — a lit room (never black)
        // with a full-body figure that drifts, bobs and swings its limbs. The
        // swing is what makes the motion field, the gusts and the edge-band
        // sprouting testable offline. uScale is ?fakescale= (CRAFT §C2).
        const CHUNK_FAKE = `
          float humanDist(vec2 p, float cx, float swing, float sc) {
            vec2 anchor = vec2(cx, 0.46);
            p = (p - anchor) / max(sc, 0.05) + anchor;
            float d = 1e9;
            vec2 head = vec2(cx, 0.80);
            d = min(d, length((p - head) / vec2(1.0, 1.14)) - 0.062);
            d = smin2(d, sdSeg(p, vec2(cx, 0.745), vec2(cx, 0.685)) - 0.024, 0.018);
            d = smin2(d, sdSeg(p, vec2(cx, 0.685), vec2(cx, 0.40)) - 0.098, 0.045);
            d = smin2(d, sdSeg(p, vec2(cx - 0.115, 0.665), vec2(cx + 0.115, 0.665)) - 0.052, 0.04);
            // arms: shoulder → elbow → hand, driven by the swing phase (the
            // strumming/fretting arm of the singer)
            float aL = 2.55 + 0.62 * swing;
            vec2 shL = vec2(cx - 0.115, 0.655);
            vec2 elL = shL + 0.135 * vec2(cos(aL), sin(aL) * 0.7 - 0.35);
            vec2 haL = elL + 0.125 * vec2(cos(aL - 0.55 - 0.5 * swing),
                                          sin(aL - 0.55 - 0.5 * swing) * 0.8 - 0.3);
            d = smin2(d, sdSeg(p, shL, elL) - 0.036, 0.03);
            d = smin2(d, sdSeg(p, elL, haL) - 0.028, 0.028);
            float aR = 0.59 - 0.62 * swing;
            vec2 shR = vec2(cx + 0.115, 0.655);
            vec2 elR = shR + 0.135 * vec2(cos(aR), sin(aR) * 0.7 - 0.35);
            vec2 haR = elR + 0.125 * vec2(cos(aR + 0.55 + 0.5 * swing),
                                          sin(aR + 0.55 + 0.5 * swing) * 0.8 - 0.3);
            d = smin2(d, sdSeg(p, shR, elR) - 0.036, 0.03);
            d = smin2(d, sdSeg(p, elR, haR) - 0.028, 0.028);
            // legs: hip → knee → foot
            vec2 hipL = vec2(cx - 0.05, 0.405);
            vec2 knL = hipL + vec2(-0.028 - 0.05 * swing, -0.15);
            vec2 ftL = knL + vec2(-0.012 + 0.03 * swing, -0.155);
            d = smin2(d, sdSeg(p, hipL, knL) - 0.044, 0.035);
            d = smin2(d, sdSeg(p, knL, ftL) - 0.034, 0.03);
            vec2 hipR = vec2(cx + 0.05, 0.405);
            vec2 knR = hipR + vec2(0.028 + 0.05 * swing, -0.15);
            vec2 ftR = knR + vec2(0.012 - 0.03 * swing, -0.155);
            d = smin2(d, sdSeg(p, hipR, knR) - 0.044, 0.035);
            d = smin2(d, sdSeg(p, knR, ftR) - 0.034, 0.03);
            // the guitar: a body ellipse across the lap plus a neck to the left
            vec2 gc = vec2(cx + 0.055, 0.44);
            float gd = length((p - gc) / vec2(1.25, 1.0)) - 0.085;
            vec2 nk0 = gc + vec2(-0.09, 0.045);
            vec2 nk1 = gc + vec2(-0.30, 0.130);
            gd = min(gd, sdSeg(p, nk0, nk1) - 0.016);
            d = min(d, gd);
            return d;
          }
          vec3 fakeScene(vec2 uv, float cx, float cy, float swing, float aspect, float sc) {
            // a lit room, not a dim gradient: the synthetic scene is the only
            // proxy for a real background, so it must sit in a realistic
            // exposure range or every judgement about the flowers over it is wrong
            vec3 top = vec3(0.30, 0.31, 0.36);
            vec3 bot = vec3(0.46, 0.42, 0.37);
            vec3 bg = mix(top, bot, smoothstep(0.0, 1.0, uv.y));
            bg += 0.03 * (0.5 + 0.5 * sin(uv.x * 30.0) - 0.5);
            float horizon = exp(-pow((uv.y - 0.40) * 6.0, 2.0));
            bg = mix(bg, vec3(0.55, 0.51, 0.45), 0.16 * horizon);
            bg += 0.04 * (vnoise(uv * 5.0) - 0.5);
            vec2 p = vec2((uv.x - 0.5) * aspect + 0.5, uv.y - cy);
            float d = humanDist(p, cx, swing, sc);
            float m = 1.0 - smoothstep(-0.004, 0.008, d);
            // body-local coords (same transform humanDist uses) so the costume
            // regions ride with ?fakescale=. The figure needs INTERNAL tonal
            // structure — a flat silhouette makes the grading and the
            // figure/flower interplay impossible to judge offline.
            vec2 q = (p - vec2(cx, 0.46)) / max(sc, 0.05) + vec2(cx, 0.46);
            float folds = 0.86 + 0.30 * fbm(q * vec2(34.0, 20.0));
            float upper = smoothstep(0.40, 0.46, q.y);
            vec3 person = mix(vec3(0.24, 0.26, 0.33), vec3(0.68, 0.64, 0.58), upper);
            person = mix(person, vec3(0.16, 0.19, 0.29),
              smoothstep(0.01, -0.05, q.x - cx) * upper * 0.75);
            person = mix(person, vec3(0.15, 0.18, 0.27),
              smoothstep(0.60, 0.69, q.y) * 0.85);
            person = mix(person, vec3(0.36, 0.25, 0.16),
              exp(-pow((q.y - 0.44) * 55.0, 2.0)));            // the guitar body
            person *= folds;
            float headM = 1.0 - smoothstep(0.050, 0.070,
              length((q - vec2(cx, 0.80)) / vec2(1.0, 1.14)));
            vec3 skin = vec3(0.62, 0.49, 0.42);
            skin *= 1.0 - 0.45 * exp(-pow((q.y - 0.815) * 240.0, 2.0));  // brow
            skin *= 1.0 - 0.28 * exp(-pow((q.y - 0.772) * 190.0, 2.0));  // mouth
            person = mix(person, skin, headM);
            person *= 0.78 + 0.34 * smoothstep(0.05, 0.80, q.y);
            return clamp(mix(bg, person, m), 0.0, 1.0);
          }
          float fakeMask(vec2 uv, float cx, float cy, float swing, float aspect, float sc) {
            vec2 p = vec2((uv.x - 0.5) * aspect + 0.5, uv.y - cy);
            return 1.0 - smoothstep(-0.006, 0.010, humanDist(p, cx, swing, sc));
          }
        `;

        // Shared: the flower palette. A CONTINUOUS ramp (not bands) because the
        // hue is a continuous function of the singing timbre: dark-warm at the
        // low end (chest voice / bass strings) → bright-cool at the high end
        // (falsetto / bright strum). Deterministic; no time anywhere.
        const CHUNK_PALETTE = `
          const vec3 LEAF_D = vec3(0.035, 0.105, 0.058);
          const vec3 LEAF_L = vec3(0.185, 0.400, 0.205);
          vec3 flowerHue(float t) {
            t = clamp(fract(t), 0.0, 1.0) * 8.0;
            vec3 c0 = vec3(0.80, 0.05, 0.22);   // 0 深紅
            vec3 c1 = vec3(1.00, 0.18, 0.40);   // 1 紅薔薇
            vec3 c2 = vec3(1.00, 0.36, 0.66);   // 2 紅梅
            vec3 c3 = vec3(1.00, 0.60, 0.60);   // 3 桃
            vec3 c4 = vec3(1.00, 0.80, 0.32);   // 4 金
            vec3 c5 = vec3(1.00, 0.95, 0.74);   // 5 淡黄
            vec3 c6 = vec3(0.99, 0.97, 0.95);   // 6 白
            vec3 c7 = vec3(0.58, 0.88, 1.00);   // 7 淡青
            vec3 c8 = vec3(0.56, 0.38, 1.00);   // 8 菫
            float i = floor(t);
            float f = smoothstep(0.0, 1.0, fract(t));
            if (i < 1.0) return mix(c0, c1, f);
            if (i < 2.0) return mix(c1, c2, f);
            if (i < 3.0) return mix(c2, c3, f);
            if (i < 4.0) return mix(c3, c4, f);
            if (i < 5.0) return mix(c4, c5, f);
            if (i < 6.0) return mix(c5, c6, f);
            if (i < 7.0) return mix(c6, c7, f);
            return mix(c7, c8, f);
          }
        `;

        // Shared by the plant update AND every draw pass, so all three agree on
        // a plant's species, size and the exact shape of its stem without extra
        // state. Everything is derived from the per-plant seed.
        const CHUNK_PLANT = `
          // 0 = 小花 (a small many-flowered stem), 1 = 大輪 (one big bloom),
          // 2 = 穂 (a spike of tiny florets)
          float plantSpecies(float seed) {
            float h = h11(seed * 31.7 + 0.3);
            return h < 0.52 ? 0.0 : (h < 0.85 ? 1.0 : 2.0);
          }
          float plantPetals(float seed) {
            return 5.0 + floor(h11(seed * 41.0 + 0.7) * 4.0);
          }
          // head radius in ASPECT space (fraction of screen height)
          float plantHeadSize(float seed, float species) {
            float base = species > 1.5 ? 0.030 : (species > 0.5 ? 0.044 : 0.023);
            return base * (0.75 + 0.55 * h11(seed * 13.7 + 1.3));
          }
          float plantStemW(float seed, float species) {
            float base = species > 1.5 ? 0.0021 : (species > 0.5 ? 0.0036 : 0.0026);
            return base * (0.8 + 0.5 * h11(seed * 23.3 + 2.1));
          }
          // visible stem length for a growth stage: a shoot first (stage 0→1),
          // then the stem extends to its full height (stage 1→2)
          float plantLen(float stage, float hgt) {
            float e = clamp(stage, 0.0, 2.0);
            float f = e < 1.0 ? 0.13 * e : 0.13 + 0.87 * (e - 1.0);
            return hgt * f;
          }
          // The stem: a curved line rooted at rootA (ASPECT space), leaning along
          // ang, permanently bent by its seed and swaying with the music. s runs
          // 0 at the root → 1 at the tip.
          vec2 stemPoint(vec2 rootA, float ang, float len, float s,
                         float seed, float t, float swayAmt) {
            vec2 d = vec2(cos(ang), sin(ang));
            vec2 pp = vec2(-d.y, d.x);
            float bend = (h11(seed * 7.7 + 3.1) - 0.5) * 0.42;
            float sw = sin(t * (0.55 + 0.75 * h11(seed * 3.3 + 4.7)) + seed * 19.0) *
              swayAmt;
            float lat = (bend + sw) * s * s;
            return rootA + d * (s * len) + pp * (lat * len);
          }
          // petal / fluff traits from the particle index (freeze-safe)
          //   x = life (s), y = size (px), z = kind (0 petal, 1 seed fluff),
          //   w = tumble speed
          vec4 petalTraits(float idx) {
            float s0 = h11(idx * 0.017 + 0.11);
            float s1 = h11(idx * 0.017 + 5.70);
            float s2 = h11(idx * 0.017 + 13.3);
            float kind = step(0.955, s1);
            float life = mix(3.4, 8.5, s0) * (1.0 + 0.5 * kind);
            // a wide size spread: mostly small drifting petals with a few big
            // ones close to camera, so the fall reads as depth not confetti
            float sizePx = mix(11.0, 22.0, s2 * s2) * (1.0 + 0.45 * kind);
            sizePx = mix(sizePx, mix(26.0, 38.0, s0), step(0.88, s2));
            return vec4(life, sizePx, kind, (h11(idx * 0.017 + 31.0) - 0.5) * 1.1);
          }
        `;

        // P0 — webcam cover-fit + mirror (or the synthetic scene) into the
        // working scene buffer. Everything downstream is screen-aligned to it.
        const sceneFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uVideo;
          uniform vec2 uResolution;
          uniform vec2 uVideoSize;
          uniform float uAspect;
          uniform float uCx;
          uniform float uCy;
          uniform float uSwing;
          uniform float uScale;
          uniform int uMirror;
          uniform int uFake;
          uniform int uHasVideo;
          ${CHUNK_NOISE}
          ${CHUNK_FAKE}
          void main() {
            if (uFake == 1) {
              fragColor = vec4(fakeScene(vUv, uCx, uCy, uSwing, uAspect, uScale), 1.0);
              return;
            }
            if (uHasVideo == 0) {
              // neutral holding backdrop while the camera warms up (not black)
              fragColor = vec4(mix(vec3(0.10, 0.10, 0.13),
                vec3(0.20, 0.18, 0.24), vUv.y), 1.0);
              return;
            }
            vec2 uv = vUv;
            if (uMirror == 1) uv.x = 1.0 - uv.x;
            float canvasAspect = uResolution.x / uResolution.y;
            float videoAspect = uVideoSize.x / uVideoSize.y;
            vec2 scale = videoAspect > canvasAspect
              ? vec2(canvasAspect / videoAspect, 1.0)
              : vec2(1.0, videoAspect / canvasAspect);
            vec2 vuv = (uv - 0.5) * scale + 0.5;
            fragColor = vec4(texture(uVideo, vuv).rgb, 1.0);
          }
        `;

        // P1 — the mask / motion field:
        //   R = fast person-mask EMA (the body as it is NOW; the sprouting band
        //       and the "keep the singer legible" core come from this)
        //   G = slow person-mask EMA (the body a moment ago; R-G is where the
        //       body just moved, which is where sprouting is favoured)
        //   BA = motion field (frame-difference pseudo flow, EMA-smoothed) — the
        //       gust that blows petals around when the performer moves
        const maskFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform sampler2D uScenePrev;
          uniform sampler2D uPrev;
          uniform sampler2D uSeg;
          uniform vec2 uTexel;
          uniform vec2 uSegScale;
          uniform float uAspect;
          uniform float uCx;
          uniform float uCy;
          uniform float uSwing;
          uniform float uScale;
          uniform float uDt;
          uniform float uAlphaFast;
          uniform float uAlphaSlow;
          uniform float uAlphaMot;
          uniform int uReset;
          uniform int uSource;
          uniform int uMirror;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_FAKE}
          float lumaf(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
          void main() {
            float rawMask = 0.0;
            if (uSource == 0) {
              rawMask = fakeMask(vUv, uCx, uCy, uSwing, uAspect, uScale);
            } else if (uSource == 1) {
              // Real-camera segmentation mask. Coordinate convention matched to
              // kiin-seido / gas-head so the mask overlaps the real person
              // pixel-for-pixel with the P0 background:
              //   * mirror: uv.x = 1-uv.x applied BEFORE cover-fit — identical
              //     to the P0 scene, so scene and mask stay in register.
              //   * cover-fit: (uv-0.5)*uSegScale+0.5 — the same crop as P0.
              //   * Y flip: sample at (suv.x, 1.0 - suv.y). MediaPipe masks are
              //     image-space (top-left origin) and segTexture is uploaded
              //     UNPACK_FLIP_Y=false, while the video texture is uploaded
              //     UNPACK_FLIP_Y=true (upright). Without the explicit flip the
              //     mask lands upside-down (CRAFT §C1: "only the face" bug).
              vec2 uv = vUv;
              if (uMirror == 1) uv.x = 1.0 - uv.x;
              vec2 suv = (uv - 0.5) * uSegScale + 0.5;
              float rawSeg = texture(uSeg, vec2(suv.x, 1.0 - suv.y)).r;
              // firm the soft confidence mask toward 0/1 so the real body is a
              // solid figure (the singer must stay legible inside it)
              rawMask = smoothstep(0.32, 0.70, rawSeg);
            }
            vec4 prev = texture(uPrev, vUv);
            float fastM = uReset == 1 ? rawMask : mix(prev.r, rawMask, uAlphaFast);
            float slowM = uReset == 1 ? rawMask : mix(prev.g, rawMask, uAlphaSlow);

            // pseudo optical flow from the scene frame difference
            vec3 cur = texture(uScene, vUv).rgb;
            float l0 = lumaf(texture(uScenePrev, vUv).rgb);
            float l1 = lumaf(cur);
            float lx = lumaf(texture(uScene, vUv + vec2(uTexel.x, 0.0)).rgb) -
              lumaf(texture(uScene, vUv - vec2(uTexel.x, 0.0)).rgb);
            float ly = lumaf(texture(uScene, vUv + vec2(0.0, uTexel.y)).rgb) -
              lumaf(texture(uScene, vUv - vec2(0.0, uTexel.y)).rgb);
            vec2 grd = vec2(lx / (2.0 * uTexel.x), ly / (2.0 * uTexel.y));
            float it = (l1 - l0) / max(uDt, 1e-3);
            vec2 flowRaw = -it * grd / (dot(grd, grd) + 40.0);
            flowRaw = clamp(flowRaw, vec2(-VMAX), vec2(VMAX));
            vec2 flow = uReset == 1 ? vec2(0.0)
              : mix(decV(prev.ba), flowRaw, uAlphaMot);

            fragColor = vec4(clamp(fastM, 0.0, 1.0), clamp(slowM, 0.0, 1.0), encV(flow));
          }
        `;

        // Separable Gaussian (all channels). Softens the mask edge into the
        // sprouting band (P2), builds the wide proximity aura (P3) and blurs the
        // flower layer for the bloom (P7).
        const blurFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uSrc;
          uniform vec2 uDir;
          uniform float uSigma;
          void main() {
            vec4 acc = vec4(0.0);
            float wsum = 0.0;
            for (int i = -10; i <= 10; ++i) {
              float x = float(i);
              float w = exp(-0.5 * x * x / max(uSigma * uSigma, 1e-4));
              acc += texture(uSrc, vUv + uDir * x) * w;
              wsum += w;
            }
            fragColor = acc / wsum;
          }
        `;

        // P4 — the PLANTS. One texel per plant, two MRT attachments, ping-pong:
        //   A = (root.x, root.y, stage/5, wilt)
        //   B = (seed, hue, height/2, direction angle normalised)
        // A plant is DORMANT while wilt >= 0.999 (the initial state of the whole
        // pool). Sound germinates it: the probability is a per-second rate spread
        // over the pool, so density never depends on the frame rate or on the
        // ?prewarm= step size. A dormant plant rejection-samples a root either on
        // the person's soft edge band or on the bottom of the frame; if every
        // candidate misses it simply stays dormant — it never falls back to
        // sprouting somewhere random (CRAFT §B3).
        //
        // stage is the whole drama, and only sound advances it:
        //   0→1 芽   sustained voice pushes a shoot out of the ground
        //   1→2 茎   sustained voice + pitch extend the stem (higher = taller)
        //   2→3 蕾   the bud swells; string attacks (onsets) help it along
        //   3→4 開花 loudness and attacks unfold the petals
        //   wilt    silence dries the plant at any stage; after full bloom it
        //           ages anyway and sheds (that is what keeps the picture bounded)
        const plantFS = `#version 300 es
          precision highp float;
          layout(location = 0) out vec4 outA;
          layout(location = 1) out vec4 outB;
          uniform sampler2D uPlantA;
          uniform sampler2D uPlantB;
          uniform sampler2D uMask;
          uniform sampler2D uSoft;
          uniform sampler2D uAura;
          uniform vec2 uTexel;
          uniform float uTexW;
          uniform float uCount;
          uniform float uDt;
          uniform float uSeed;
          uniform float uAspect;
          uniform float uPresent;
          uniform float uBloomAmt;
          uniform float uGrowth;
          uniform float uFall;
          uniform float uHueMove;
          uniform vec4 uAudA;   // rms, centroid, zcr, onset envelope
          uniform vec4 uAudB;   // sustain, pitch, vibrato, arc
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_PLANT}
          void main() {
            ivec2 tc = ivec2(gl_FragCoord.xy);
            float idx = float(tc.y) * uTexW + float(tc.x);
            vec4 A = texelFetch(uPlantA, tc, 0);
            vec4 B = texelFetch(uPlantB, tc, 0);
            if (uDt <= 0.0) {           // frozen: hold the state exactly
              outA = A;
              outB = B;
              return;
            }
            vec2 root = A.xy;
            float stage = A.z * 5.0;
            float wilt = A.w;
            float seed = B.x;
            float hue = B.y;
            float hgt = B.z * 0.5;
            float ang = (B.w - 0.5) * PI2;

            float rms = uAudA.x;
            float cen = uAudA.y;
            float ons = uAudA.w;
            float sus = uAudB.x;
            float pit = uAudB.y;
            float arc = uAudB.w;

            if (wilt >= 0.999) {
              // ---- dormant slot: try to germinate --------------------------
              // plants per SECOND for the whole field, spread over the pool.
              // The arc term is the dramatic build: a few shoots during the
              // intro, a full bed by the chorus.
              float rate = (1.0 + 17.0 * uBloomAmt) *
                (0.04 + 0.85 * sus + 1.5 * ons + 0.35 * rms) *
                (0.35 + 0.95 * arc);
              float pr = rate * uDt / max(uCount, 1.0);
              if (hash12(vec2(idx * 1.71, uSeed * 0.93)) < pr) {
                bool wantEdge = uPresent > 0.25 &&
                  hash12(vec2(idx * 3.31, uSeed * 1.77)) < 0.66;
                bool got = false;
                vec2 cand = vec2(0.5);
                for (int k = 0; k < 10; k++) {
                  vec2 c = hash22(vec2(idx * 5.13 + float(k) * 7.31,
                    uSeed * 2.11 + float(k) * 3.70));
                  float m = texture(uMask, c).r;
                  float sf = texture(uSoft, c).r;
                  // the soft edge band: just OUTSIDE the silhouette (mask low,
                  // blurred mask still high) — flowers hug the performer without
                  // ever being drawn from the mask contour itself (CRAFT §A2)
                  float band = clamp(sf - m, 0.0, 1.0);
                  if (!got && wantEdge && band > 0.045 && m < 0.42 && sf > 0.05) {
                    got = true;
                    cand = c;
                  }
                  if (!got && !wantEdge) {
                    // the flower bed along the bottom of the frame, clumped by a
                    // static fbm so there are gaps instead of a uniform lawn
                    float ground = 1.0 - smoothstep(0.03, 0.34, c.y);
                    if (ground > 0.25 && m < 0.14 &&
                        fbm(c * vec2(uAspect, 1.0) * 3.5) > 0.40) {
                      got = true;
                      cand = c;
                    }
                  }
                }
                if (got) {
                  root = cand;
                  // grow AWAY from the body: -grad(aura) points outward. Blended
                  // with straight up so nothing grows downward off the shoulders.
                  float aL = texture(uAura, cand - vec2(uTexel.x, 0.0)).r;
                  float aR = texture(uAura, cand + vec2(uTexel.x, 0.0)).r;
                  float aB = texture(uAura, cand - vec2(0.0, uTexel.y)).r;
                  float aT = texture(uAura, cand + vec2(0.0, uTexel.y)).r;
                  vec2 gA = vec2(aR - aL, aT - aB) * 0.5;
                  float gLen = length(gA);
                  vec2 outw = gLen > 1e-5 ? -gA / gLen : vec2(0.0, 1.0);
                  float lean = hash12(vec2(idx * 11.7, uSeed * 5.19)) - 0.5;
                  vec2 d = normalize(vec2(0.0, 1.0) +
                    outw * (wantEdge ? 0.85 : 0.12) + vec2(lean * 0.55, 0.0));
                  ang = atan(d.y, d.x);
                  seed = hash12(vec2(idx * 9.13, uSeed * 4.31));
                  // TIMBRE → HUE. The centroid moves the CENTRE of the
                  // distribution (a dark chest voice or a bass string opens
                  // crimson flowers, a bright falsetto opens white / pale blue /
                  // violet ones) while a wide per-plant spread keeps the bed
                  // varied — a single hue for the whole field looks synthetic.
                  float hj = (h11(seed * 17.0 + 0.9) - 0.5) * 0.40;
                  float centre = mix(0.30, clamp(0.02 + 0.94 * cen, 0.0, 1.0),
                    0.15 + 0.85 * uHueMove);
                  hue = clamp(centre + hj + 0.05 * arc, 0.0, 1.0);
                  // ~1 plant in 6 is an ACCENT drawn from the far end of the
                  // ramp (deep crimson or violet), so the bed never turns into
                  // one flat hue even while the singer holds one timbre
                  if (h11(seed * 53.0 + 4.4) < 0.17) {
                    hue = clamp(hue > 0.5 ? hue - 0.42 : hue + 0.46, 0.0, 1.0);
                  }
                  // PITCH → HEIGHT. A high sustained note grows a tall stem.
                  hgt = clamp((0.070 + 0.135 * h11(seed * 7.7 + 2.3)) *
                    (0.55 + 0.95 * pit), 0.045, 0.30);
                  stage = 0.0;
                  wilt = 0.0;
                }
              }
            } else {
              // ---- living plant: sound advances the life cycle --------------
              // ~3s from shoot to open flower while the singer holds a voice at
              // the default 伸びる速さ (≈9s at 0, ≈2s at 1) — slow enough that
              // the sprout → stem → bud → bloom progression is READABLE, which
              // is the whole point of the piece
              float ds;
              if (stage < 1.0) {
                ds = 0.14 + 0.85 * sus + 0.25 * rms;
              } else if (stage < 2.0) {
                ds = 0.05 + 0.80 * sus + 0.25 * pit;
              } else if (stage < 3.0) {
                ds = 0.04 + 0.55 * sus + 1.10 * ons;
              } else {
                ds = 0.06 + 1.00 * rms + 1.40 * ons;
              }
              stage = min(stage + ds * uDt * (0.35 + 1.6 * uGrowth), 4.6);
              // 有界性: silence dries any plant; a fully open flower ages anyway
              // and sheds faster on attacks late in the song (一斉散華)
              float quiet = 1.0 - smoothstep(0.02, 0.26, sus);
              float bloomed = smoothstep(3.5, 4.2, stage);
              wilt += uDt * ((0.010 + 0.115 * quiet) +
                bloomed * (0.022 + 0.16 * uFall + 0.55 * ons * uFall * arc));
              if (wilt >= 0.999) {
                wilt = 1.0;
                stage = 0.0;
              }
            }
            outA = vec4(root, stage * 0.2, clamp(wilt, 0.0, 1.0));
            outB = vec4(seed, hue, hgt * 2.0, ang / PI2 + 0.5);
          }
        `;

        // P5 — the PETALS (and seed fluff). Free particles, two MRT attachments,
        // ping-pong:
        //   A = (pos.x, pos.y, encV(vel))
        //   B = (ageFraction, rotation turns, seed, hue inherited from the flower)
        // A petal is DORMANT while ageF >= 0.999 (the initial state). It can only
        // come into being by DETACHING from a plant that is actually in bloom —
        // there are no petals before the first flower opens, and a failed search
        // leaves the slot dormant instead of scattering a bright dot somewhere
        // random (CRAFT §B3). Each petal then integrates its OWN acceleration
        // (air, not water advection — CRAFT §A4): gravity pulls it down, a loud
        // passage lifts it, the performer's motion field gusts it, curl noise
        // wafts it, and it tumbles.
        const petalFS = `#version 300 es
          precision highp float;
          layout(location = 0) out vec4 outA;
          layout(location = 1) out vec4 outB;
          uniform sampler2D uStateA;
          uniform sampler2D uStateB;
          uniform sampler2D uPlantA;
          uniform sampler2D uPlantB;
          uniform sampler2D uMask;
          uniform float uTexW;
          uniform float uCount;
          uniform float uPlantW;
          uniform float uPlantN;
          uniform float uDt;
          uniform float uTime;
          uniform float uSeed;
          uniform float uAspect;
          uniform float uWind;
          uniform float uFall;
          uniform float uSway;
          uniform vec4 uAudA;
          uniform vec4 uAudB;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_PLANT}
          void main() {
            ivec2 tc = ivec2(gl_FragCoord.xy);
            float idx = float(tc.y) * uTexW + float(tc.x);
            vec4 A = texelFetch(uStateA, tc, 0);
            vec4 B = texelFetch(uStateB, tc, 0);
            if (uDt <= 0.0) {           // frozen: hold the state exactly
              outA = A;
              outB = B;
              return;
            }
            vec2 pos = A.xy;
            vec2 vel = decV(A.zw);
            float ageF = B.x;
            float rot = B.y;
            float seed = B.z;
            float hue = B.w;
            vec4 tr = petalTraits(idx);
            float kind = tr.z;

            float rms = uAudA.x;
            float zcr = uAudA.z;
            float ons = uAudA.w;

            if (ageF >= 0.999) {
              // ---- dormant: try to detach from a blooming flower ------------
              // petals per SECOND for the whole field, spread over the pool.
              // Breathy singing (high ZCR) sends up more seed fluff.
              float rate = (3.0 + 85.0 * uFall) *
                (0.10 + 0.70 * rms + 1.8 * ons + 0.5 * zcr * kind);
              float pr = rate * uDt / max(uCount, 1.0);
              if (hash12(vec2(idx * 2.13, uSeed * 1.31)) < pr) {
                for (int k = 0; k < 6; k++) {
                  float pick = floor(hash12(vec2(idx * 7.70 + float(k) * 3.31,
                    uSeed * 5.11 + float(k) * 1.97)) * uPlantN);
                  ivec2 ptc = ivec2(int(mod(pick, uPlantW)),
                    int(floor(pick / uPlantW)));
                  vec4 PA = texelFetch(uPlantA, ptc, 0);
                  vec4 PB = texelFetch(uPlantB, ptc, 0);
                  float pstage = PA.z * 5.0;
                  if (PA.w < 0.999 && pstage > 3.35) {
                    vec2 ar = vec2(uAspect, 1.0);
                    float pseed = PB.x;
                    float plen = plantLen(pstage, PB.z * 0.5);
                    vec2 headA = stemPoint(PA.xy * ar, (PB.w - 0.5) * PI2, plen,
                      1.0, pseed, uTime, uSway);
                    vec2 head = headA / ar;
                    vec2 jit = (hash22(vec2(idx * 3.7, uSeed * 9.1)) - 0.5);
                    float spread = plantHeadSize(pseed, plantSpecies(pseed));
                    pos = head + jit * spread * 1.4 / ar;
                    hue = PB.y;
                    seed = hash12(vec2(idx * 4.31, uSeed * 7.13));
                    // thrown outward from the flower, then physics takes over
                    float a0 = hash12(vec2(seed * 21.0, 3.1)) * PI2;
                    vel = vec2(cos(a0), sin(a0)) * (0.02 + 0.10 * rms + 0.16 * ons);
                    vel.y += kind > 0.5 ? 0.05 : -0.02;
                    ageF = 0.0;
                    rot = hash12(vec2(seed * 5.0, 11.3));
                    break;
                  }
                }
              }
            } else {
              // ---- living petal: its own acceleration -----------------------
              ageF += uDt / tr.x;
              vec4 mk = texture(uMask, pos);
              vec2 flow = decV(mk.ba);
              vec2 cn = curlN(pos * vec2(uAspect, 1.0) * 3.0 +
                        vec2(0.0, -uTime * 0.05)) +
                        0.5 * curlN(pos * vec2(uAspect, 1.0) * 7.0 +
                        vec2(uTime * 0.03, 0.0));
              vel += cn * (0.014 + 0.070 * uWind) * uDt;
              // GUST: the performer's movement blows the petals around
              vel += flow * (1.8 + 8.0 * uWind) * uDt;
              if (kind > 0.5) {
                vel.y += (0.045 + 0.10 * rms) * uDt;      // seed fluff rises
                vel *= exp(-uDt * 1.25);
              } else {
                // petals FALL — unless the song lifts them (声が大きいと舞い上がる)
                vel.y += (-0.175 + 0.34 * rms + 0.45 * ons) * uDt;
                vel *= exp(-uDt * 0.85);
              }
              vel = clamp(vel, vec2(-VMAX), vec2(VMAX));
              pos += vel * uDt;
              rot = fract(rot + tr.w * uDt * (0.6 + length(vel) * 5.0));
              bool gone = pos.x < -0.15 || pos.x > 1.15 ||
                          pos.y < -0.18 || pos.y > 1.25;
              if (ageF >= 1.0 || gone) ageF = 1.0;
            }
            outA = vec4(pos, encV(vel));
            outB = vec4(ageF, rot, seed, hue);
          }
        `;

        // P6a — stems and leaves. One instanced quad per stem segment plus a few
        // per plant for leaves; the segment endpoints are computed from the plant
        // state with the SHARED stemPoint(), so the drawn stem is exactly the
        // curve the petals detach from. Drawn with PREMULTIPLIED-ALPHA over
        // blending, which is what lets dark green stems sit on the real footage
        // (an additive layer can only ever brighten).
        const stemVS = `#version 300 es
          precision highp float;
          uniform sampler2D uPlantA;
          uniform sampler2D uPlantB;
          uniform float uPlantW;
          uniform float uAspect;
          uniform float uTime;
          uniform float uSway;
          uniform float uSize;
          uniform vec4 uAudB;
          out vec2 vP;
          out vec4 vSeg;
          out vec4 vAttr;    // kind(0 stem / 1 leaf), half width, wilt, s
          out vec3 vCol;
          out vec2 vLocal;
          out float vSeed;
          ${CHUNK_NOISE}
          ${CHUNK_PALETTE}
          ${CHUNK_PLANT}
          const vec2 QUAD[6] = vec2[6](
            vec2(-1.0, -1.0), vec2(1.0, -1.0), vec2(-1.0, 1.0),
            vec2(-1.0,  1.0), vec2(1.0, -1.0), vec2( 1.0, 1.0)
          );
          const float SEGS = ${STEM_SEGS}.0;
          const float PER = ${STEM_PER}.0;
          void main() {
            vP = vec2(0.0);
            vSeg = vec4(0.0);
            vAttr = vec4(0.0);
            vCol = vec3(0.0);
            vLocal = vec2(0.0);
            vSeed = 0.0;
            float inst = float(gl_InstanceID);
            float pid = floor(inst / PER);
            float part = inst - pid * PER;
            ivec2 tc = ivec2(int(mod(pid, uPlantW)), int(floor(pid / uPlantW)));
            vec4 A = texelFetch(uPlantA, tc, 0);
            vec4 B = texelFetch(uPlantB, tc, 0);
            float stage = A.z * 5.0;
            float wilt = A.w;
            if (wilt >= 0.999 || stage <= 0.03) {
              gl_Position = vec4(3.0, 3.0, 0.0, 1.0);   // dormant: park offscreen
              return;
            }
            vec2 ar = vec2(uAspect, 1.0);
            float seed = B.x;
            float hue = B.y;
            float hgt = B.z * 0.5;
            float ang = (B.w - 0.5) * PI2;
            float species = plantSpecies(seed);
            float len = plantLen(stage, hgt);
            vec2 rootA = A.xy * ar;
            vSeed = seed;
            // a wilting stem browns and thins
            vec3 green = mix(LEAF_D, LEAF_L, 0.35 + 0.5 * h11(seed * 3.7 + 5.1));
            green = mix(green, vec3(0.185, 0.130, 0.070), 0.75 * wilt);
            vec2 P;
            if (part < SEGS) {
              float s0 = part / SEGS;
              float s1 = (part + 1.0) / SEGS;
              vec2 a = stemPoint(rootA, ang, len, s0, seed, uTime, uSway);
              vec2 b = stemPoint(rootA, ang, len, s1, seed, uTime, uSway);
              float w = plantStemW(seed, species) * (0.70 + 0.6 * uSize) *
                (1.0 - 0.45 * s0) * (1.0 - 0.25 * wilt);
              vec2 axis = b - a;
              float L = length(axis);
              vec2 ax = L > 1e-6 ? axis / L : vec2(0.0, 1.0);
              vec2 pv = vec2(-ax.y, ax.x);
              vec2 q = QUAD[gl_VertexID];
              P = 0.5 * (a + b) + ax * q.x * (0.5 * L + w * 1.6) + pv * q.y * w * 1.8;
              vSeg = vec4(a, b);
              vAttr = vec4(0.0, w, wilt, s0);
              vCol = green * (0.75 + 0.5 * s0);
              vLocal = q;
            } else {
              float j = part - SEGS;
              float s = 0.24 + 0.21 * j;
              if (len < 0.012) {          // no stem yet: no leaves on it
                gl_Position = vec4(3.0, 3.0, 0.0, 1.0);
                return;
              }
              vec2 c = stemPoint(rootA, ang, len, s, seed, uTime, uSway);
              vec2 t0 = stemPoint(rootA, ang, len, max(0.0, s - 0.06), seed, uTime, uSway);
              vec2 tang = normalize(c - t0 + vec2(1e-5, 1e-5));
              // leaves alternate sides and lift toward the light
              float side = mod(j, 2.0) < 0.5 ? 1.0 : -1.0;
              float la = atan(tang.y, tang.x) + side * (0.85 + 0.35 * h11(seed * 9.1 + j));
              float ls = (0.013 + 0.017 * h11(seed * 5.3 + j * 3.1)) *
                (0.7 + 0.7 * uSize) * clamp(stage, 0.0, 1.4) / 1.4 *
                (0.55 + 0.9 * hgt / 0.30);
              vec2 ld = vec2(cos(la), sin(la));
              vec2 lp = vec2(-ld.y, ld.x);
              vec2 q = QUAD[gl_VertexID];
              P = c + ld * (q.x * 0.5 + 0.5) * ls * 2.0 + lp * q.y * ls * 0.44;
              vSeg = vec4(c, ld);
              vAttr = vec4(1.0, ls, wilt, s);
              vCol = green * (0.85 + 0.35 * h11(seed * 7.1 + j));
              vLocal = q;
            }
            vP = P;
            gl_Position = vec4(vec2(P.x / uAspect, P.y) * 2.0 - 1.0, 0.0, 1.0);
          }
        `;

        const stemFS = `#version 300 es
          precision highp float;
          in vec2 vP;
          in vec4 vSeg;
          in vec4 vAttr;
          in vec3 vCol;
          in vec2 vLocal;
          in float vSeed;
          out vec4 fragColor;
          ${CHUNK_NOISE}
          void main() {
            float kind = vAttr.x;
            float wilt = vAttr.z;
            float cov;
            vec3 col = vCol;
            if (kind < 0.5) {
              // --- stem: a tapered line with a lit edge on one side so it reads
              // as a round stalk instead of a flat stroke
              float d = sdSeg(vP, vSeg.xy, vSeg.zw);
              float w = vAttr.y;
              cov = 1.0 - smoothstep(w * 0.55, w, d);
              float across = clamp(vLocal.y * 0.5 + 0.5, 0.0, 1.0);
              col *= 0.65 + 0.85 * pow(1.0 - abs(vLocal.y), 0.8);
              col += vec3(0.10, 0.16, 0.10) * smoothstep(0.55, 1.0, across);
            } else {
              // --- leaf: a slender pointed blade with a central vein
              vec2 p = vLocal;
              float ty = clamp(p.x * 0.5 + 0.5, 0.0, 1.0);
              float prof = pow(clamp(sin(ty * 3.14159265), 0.0, 1.0), 0.72);
              float halfw = 0.86 * prof;
              cov = smoothstep(1.0, 0.55, abs(p.y) / max(halfw, 1e-3));
              float vein = smoothstep(0.13, 0.0, abs(p.y)) * prof;
              col *= 0.72 + 0.55 * prof;
              col += vCol * 0.55 * vein;
              cov *= 1.0 - 0.35 * wilt;
            }
            float a = clamp(cov, 0.0, 1.0) * 0.96;
            if (a <= 0.01) discard;
            fragColor = vec4(col * a, a);      // premultiplied over
          }
        `;

        // P6b — the flower heads: bud → open flower → wilt, one instanced quad
        // per plant. The shape is CARVED (deep petal scallops, dark seams between
        // the petals, a saturated stamen, a green calyx while it is still a bud,
        // a stacked spike for the 穂 species) — never a round bokeh dot, which on
        // any ground reads as "light" rather than "flower" (CRAFT §B1).
        const headVS = `#version 300 es
          precision highp float;
          uniform sampler2D uPlantA;
          uniform sampler2D uPlantB;
          uniform float uPlantW;
          uniform float uAspect;
          uniform float uTime;
          uniform float uSway;
          uniform float uSize;
          uniform float uGlow;
          uniform vec4 uAudA;
          uniform vec4 uAudB;
          out vec2 vLocal;
          out vec4 vAttr;    // bloom, petals, wilt, species
          out vec3 vCol;
          out float vSeed;
          out float vGlow;
          ${CHUNK_NOISE}
          ${CHUNK_PALETTE}
          ${CHUNK_PLANT}
          const vec2 QUAD[6] = vec2[6](
            vec2(-1.0, -1.0), vec2(1.0, -1.0), vec2(-1.0, 1.0),
            vec2(-1.0,  1.0), vec2(1.0, -1.0), vec2( 1.0, 1.0)
          );
          void main() {
            vLocal = vec2(0.0);
            vAttr = vec4(0.0);
            vCol = vec3(0.0);
            vSeed = 0.0;
            vGlow = 0.0;
            float pid = float(gl_InstanceID);
            ivec2 tc = ivec2(int(mod(pid, uPlantW)), int(floor(pid / uPlantW)));
            vec4 A = texelFetch(uPlantA, tc, 0);
            vec4 B = texelFetch(uPlantB, tc, 0);
            float stage = A.z * 5.0;
            float wilt = A.w;
            if (wilt >= 0.999 || stage <= 0.05) {
              gl_Position = vec4(3.0, 3.0, 0.0, 1.0);
              return;
            }
            vec2 ar = vec2(uAspect, 1.0);
            float seed = B.x;
            float hue = B.y;
            float hgt = B.z * 0.5;
            float ang = (B.w - 0.5) * PI2;
            float species = plantSpecies(seed);
            float len = plantLen(stage, hgt);
            vec2 rootA = A.xy * ar;
            vec2 c = stemPoint(rootA, ang, len, 1.0, seed, uTime, uSway);
            vec2 c0 = stemPoint(rootA, ang, len, 0.90, seed, uTime, uSway);
            vec2 tang = normalize(c - c0 + vec2(1e-5, 1e-5));
            // stage → geometry: a shoot tip, then a swelling bud, then the open
            // flower. The last loud passage is what actually opens it.
            float shoot = smoothstep(0.0, 1.0, stage);
            float budT = smoothstep(1.55, 2.95, stage);
            float bloomT = smoothstep(3.05, 4.25, stage);
            // the three stage weights SUM TO 1, so a fully open flower is exactly
            // plantHeadSize and never twice it
            float scale = plantHeadSize(seed, species) * (0.55 + 1.35 * uSize) *
              (0.14 * shoot + 0.26 * budT + 0.60 * bloomT) * (1.0 - 0.20 * wilt);
            // a bloom breathes with the loudness of the voice
            scale *= 1.0 + 0.10 * uAudA.x * bloomT;
            vec3 col = flowerHue(hue);
            // late in the song the whole field warms and deepens
            col = mix(col, col * vec3(1.05, 0.90, 0.94), 0.35 * uAudB.w);
            col = mix(col, col * vec3(0.72, 0.55, 0.52), 0.55 * wilt);
            vCol = col;
            vAttr = vec4(bloomT, plantPetals(seed), wilt, species);
            vSeed = seed;
            vGlow = uGlow;
            vLocal = QUAD[gl_VertexID];
            // the flower faces along the stem: rotate the quad so local +Y is
            // the stem tangent (spikes and small florets read as "growing")
            float rot = atan(tang.y, tang.x) - 1.57079633;
            float cs = cos(rot), sn = sin(rot);
            vec2 q = vLocal;
            vec2 rq = vec2(q.x * cs - q.y * sn, q.x * sn + q.y * cs);
            vec2 P = c + rq * scale;
            gl_Position = vec4(vec2(P.x / uAspect, P.y) * 2.0 - 1.0, 0.0, 1.0);
          }
        `;

        const headFS = `#version 300 es
          precision highp float;
          in vec2 vLocal;
          in vec4 vAttr;
          in vec3 vCol;
          in float vSeed;
          in float vGlow;
          out vec4 fragColor;
          ${CHUNK_NOISE}
          ${CHUNK_PALETTE}
          void main() {
            float bloomT = vAttr.x;
            float petals = vAttr.y;
            float wilt = vAttr.z;
            float species = vAttr.w;
            vec2 p = vLocal;
            float r = length(p);
            if (r > 1.02) discard;
            float ang = atan(p.y, p.x);
            vec3 col;
            float cov;

            if (species > 1.5) {
              // ---- 穂: a spike of tiny florets stacked along the stem
              float sp = 0.0;
              float coreS = 0.0;
              for (int i = 0; i < 7; i++) {
                float fi = float(i);
                vec2 c = vec2(0.17 * sin(fi * 2.4 + vSeed * 9.0) * (0.4 + 0.6 * bloomT),
                  -0.80 + 0.26 * fi);
                float rr = (0.10 + 0.07 * h11(vSeed * 13.0 + fi)) *
                  (0.45 + 0.75 * bloomT);
                float d = length(p - c);
                sp = max(sp, 1.0 - smoothstep(rr * 0.72, rr, d));
                coreS = max(coreS, 1.0 - smoothstep(rr * 0.18, rr * 0.42, d));
              }
              cov = sp;
              col = vCol * (0.55 + 0.55 * sp);
              col += mix(vCol, vec3(1.0, 0.92, 0.68), 0.55) * coreS *
                (0.35 + 1.1 * vGlow) * bloomT;
            } else {
              // ---- bud: a slim teardrop calyx with sepal ribs, the petal colour
              // just showing at the tip as it swells (not a green ball)
              vec2 bp = p * vec2(1.85, 0.98);
              float taper = 0.72 - 0.30 * smoothstep(-0.2, 1.0, p.y);
              float budCov = 1.0 - smoothstep(taper * 0.86, taper, length(bp));
              float ribs = 0.5 + 0.5 * cos(atan(bp.y, bp.x) * 6.0 + vSeed * 9.0);
              vec3 budCol = mix(LEAF_D, LEAF_L, 0.30 + 0.45 * ribs);
              budCol = mix(budCol, vCol, smoothstep(0.25, 0.95, p.y) * 0.62);

              // ---- open flower: WIDE rounded petals with dark seams between
              // them, a lighter tip and a small saturated stamen. Wide lobes and
              // a restrained core are what keep it from reading as a star or a
              // sparkle (CRAFT §B1).
              float k = 0.5 + 0.5 * cos(ang * petals + vSeed * 6.0);
              float petal = pow(k, 0.30);
              float ragged = 1.0 - 0.07 * vnoise(vec2(ang * 6.0, vSeed * 30.0));
              float rad = mix(0.60, 1.0, petal) * ragged * (1.0 - 0.14 * wilt);
              rad *= mix(0.34, 1.0, bloomT);          // petals unfold outward
              float edge = smoothstep(rad, rad * 0.90, r);
              // the seam only bites the OUTER half of the petal, so the flower
              // keeps a continuous disc near the middle instead of splitting
              // into separate rays
              float seam = mix(1.0, smoothstep(0.02, 0.34, petal),
                smoothstep(0.30, 0.95, r / max(rad, 1e-3)));
              // petal shading: darker at the throat, lighter toward the tip
              float shade = 0.62 + 0.55 * smoothstep(0.10, 0.95, r / max(rad, 1e-3));
              float vein = smoothstep(0.65, 1.0, k) *
                (0.5 + 0.5 * sin(r * 22.0 + vSeed * 12.0)) * 0.08;
              float core = smoothstep(0.30 * mix(1.4, 1.0, bloomT), 0.02, r);
              vec3 fCol = vCol * (edge * seam * shade * (0.95 - 0.32 * wilt) + vein);
              // the stamen is the only emissive part; it can exceed 1.0 so the
              // bloom pass gives the flower a lamp instead of a halo
              fCol += mix(vCol, vec3(1.0, 0.84, 0.42), 0.50) * core *
                (0.22 + 0.62 * vGlow) * (0.30 + 0.85 * bloomT);
              float fCov = clamp(edge * seam + core * 0.35, 0.0, 1.0);

              float mixT = smoothstep(0.10, 0.62, bloomT);
              cov = mix(budCov, fCov, mixT);
              col = mix(budCol * budCov, fCol, mixT);
            }
            float a = clamp(cov, 0.0, 1.0) * (1.0 - 0.35 * wilt);
            if (a <= 0.012) discard;
            fragColor = vec4(col, a);   // col is already coverage-weighted
          }
        `;

        // P6c — the fallen petals and the seed fluff. Instanced quads (chosen
        // over gl.POINTS for mobile robustness: no point-size clamp and no
        // whole-sprite clipping) with true per-petal rotation. A petal is an
        // almond with a centre vein that STRETCHES with speed; fluff is a soft
        // filamented puff. Premultiplied over, like the rest of the layer.
        const petalDrawVS = `#version 300 es
          precision highp float;
          uniform sampler2D uStateA;
          uniform sampler2D uStateB;
          uniform float uTexW;
          uniform vec2 uResolution;
          uniform float uAspect;
          uniform float uSize;
          uniform float uGlow;
          out vec2 vLocal;
          out vec3 vCol;
          out float vAlpha;
          out float vKind;
          out float vSeed;
          out float vGlow;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_PALETTE}
          ${CHUNK_PLANT}
          const vec2 QUAD[6] = vec2[6](
            vec2(-1.0, -1.0), vec2(1.0, -1.0), vec2(-1.0, 1.0),
            vec2(-1.0,  1.0), vec2(1.0, -1.0), vec2( 1.0, 1.0)
          );
          void main() {
            vLocal = vec2(0.0);
            vCol = vec3(0.0);
            vAlpha = 0.0;
            vKind = 0.0;
            vSeed = 0.0;
            vGlow = 0.0;
            int i = gl_InstanceID;
            int tw = int(uTexW);
            ivec2 tc = ivec2(i % tw, i / tw);
            vec4 A = texelFetch(uStateA, tc, 0);
            vec4 B = texelFetch(uStateB, tc, 0);
            float ageF = B.x;
            if (ageF >= 0.999) {
              gl_Position = vec4(3.0, 3.0, 0.0, 1.0);   // dormant
              return;
            }
            vec4 tr = petalTraits(float(i));
            vec2 pos = A.xy;
            vec2 vel = decV(A.zw);
            float rot = B.y * PI2;
            float halfSz = 0.5 * (tr.y / max(uResolution.y, 1.0)) *
              (0.55 + 1.5 * uSize);
            vKind = tr.z;
            vSeed = B.z;
            vGlow = uGlow;
            vCol = flowerHue(B.w) * (tr.z > 0.5 ? 0.55 : 1.0);
            // fades in as it detaches and out as it dies
            vAlpha = smoothstep(0.0, 0.06, ageF) * (1.0 - smoothstep(0.72, 1.0, ageF));
            vec2 q = QUAD[gl_VertexID];
            vLocal = q;
            vec2 shape = q;
            if (tr.z < 0.5) {
              float stretch = 1.20 + 0.55 * clamp(length(vel) * 1.4, 0.0, 1.6);
              shape = vec2(q.x * 0.52, q.y * stretch);
            }
            float cs = cos(rot), sn = sin(rot);
            vec2 rq = vec2(shape.x * cs - shape.y * sn, shape.x * sn + shape.y * cs);
            vec2 ar = vec2(uAspect, 1.0);
            vec2 P = pos * ar + rq * halfSz;
            gl_Position = vec4(vec2(P.x / uAspect, P.y) * 2.0 - 1.0, 0.0, 1.0);
          }
        `;

        const petalDrawFS = `#version 300 es
          precision highp float;
          in vec2 vLocal;
          in vec3 vCol;
          in float vAlpha;
          in float vKind;
          in float vSeed;
          in float vGlow;
          out vec4 fragColor;
          ${CHUNK_NOISE}
          void main() {
            vec2 p = vLocal;
            if (vKind > 0.5) {
              // ---- seed fluff: a soft dandelion puff carried by the breath.
              // Few, long, soft filaments — a many-spoked star reads as a
              // snowflake instead of down (CRAFT §B1).
              float r = length(p);
              if (r > 1.0) discard;
              float ang = atan(p.y, p.x);
              float fil = pow(0.5 + 0.5 * sin(ang * 6.0 + vSeed * 30.0), 1.6);
              float body = 1.0 - smoothstep(0.10, 0.98, r);
              float a = (body * (0.16 + 0.34 * fil)) * vAlpha * 0.42;
              if (a <= 0.005) discard;
              vec3 c = mix(vec3(0.94, 0.96, 1.0), vCol, 0.22) * (0.80 + 0.4 * vGlow);
              fragColor = vec4(c * a, a);
              return;
            }
            // ---- petal: almond, pointed at both ends, with a centre vein
            float ty = clamp(p.y * 0.5 + 0.5, 0.0, 1.0);
            float prof = pow(clamp(sin(ty * 3.14159265), 0.0, 1.0), 0.62);
            float halfw = 0.90 * prof;
            float dx = abs(p.x) / max(halfw, 1e-3);
            float body = smoothstep(1.0, 0.40, dx);
            float vein = smoothstep(0.15, 0.0, abs(p.x)) * prof;
            float a = body * vAlpha * 0.95;
            if (a <= 0.006) discard;
            // curl: one flank catches the light as the petal tumbles
            vec3 c = vCol * (0.62 + 0.55 * smoothstep(-0.6, 0.9, p.x) + 0.30 * vein);
            c *= 0.85 + 0.45 * vGlow;
            fragColor = vec4(c * a, a);
          }
        `;

        // P7 — bloom bright pass: only the parts of the flower layer that are
        // genuinely luminous (the stamens, the brightest petal flanks) are
        // allowed to glow. Downsamples at the same time.
        const brightFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uSrc;
          void main() {
            vec3 c = texture(uSrc, vUv).rgb;
            float l = dot(c, vec3(0.299, 0.587, 0.114));
            // only the genuinely emissive parts (stamens, the hottest petal
            // flanks — the ones written above 1.0) are allowed to glow. A low
            // threshold makes every petal halo and the field reads as sparkles.
            fragColor = vec4(c * smoothstep(0.80, 1.60, l), 1.0);
          }
        `;

        // P8 — composite. The ground is the REAL WORLD: the camera is not
        // replaced, it is graded and then loses its grip on the real the further
        // it is from the performer — smeared along the local flow, desaturated,
        // and finally sunk into a night garden. The abstraction field is
        // (frame margin + fbm patches − person proximity): deriving it from
        // distance-to-body alone paints a BODY-SHAPED halo, which is the cut-out
        // look returning as a soft glow (kiin-seido invariant 1).
        const compositeFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform sampler2D uMask;
          uniform sampler2D uSoft;
          uniform sampler2D uAura;
          uniform sampler2D uField;
          uniform sampler2D uB1;
          uniform sampler2D uB2;
          uniform vec2 uResolution;
          uniform float uAspect;
          uniform float uTime;
          uniform float uExposure;
          uniform float uBgAbs;
          uniform float uGlow;
          uniform float uFilmGrain;
          uniform float uPresent;
          uniform vec4 uAudA;
          uniform vec4 uAudB;
          uniform int uDebug;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_PALETTE}
          float lumaf(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
          void main() {
            vec2 ar = vec2(uAspect, 1.0);
            vec4 m = texture(uMask, vUv);
            vec2 flow = decV(m.ba);
            float soft = texture(uSoft, vUv).r;
            float aura = texture(uAura, vUv).r;
            vec4 F = texture(uField, vUv);

            // ---- the abstraction field -----------------------------------
            // The proximity term (which keeps the singer's surround
            // photographic) must NOT be a clean function of distance-to-body:
            // against a dark garden a smooth "protected" bubble reads as a
            // spotlight halo — the cut-out returning as a glow. So the aura is
            // sampled through a turbulent warp and then broken by the same fbm
            // patches that dissolve the rest of the frame, and a floor of
            // abstraction applies everywhere (no perfectly untouched bubble).
            float ragged = fbm4(vUv * ar * 26.0 + 9.0) - 0.5;
            vec2 wp = vUv + curlN(vUv * ar * 3.6 + 21.0) * 0.022;
            float auraW = texture(uAura, wp).r;
            float edgeM = smoothstep(0.16, 0.64,
              length((vUv - 0.5) * vec2(1.05, 1.0)));
            float blotchF = smoothstep(0.34, 0.74, fbm4(vUv * ar * 2.2 + 13.0));
            // two break scales, so the photographic margin around the singer
            // shows up as PATCHES of the real room rather than as a contour glow
            float brk = smoothstep(0.30, 0.78, fbm4(vUv * ar * 5.5 + 31.0));
            float near = smoothstep(0.05, 0.50, auraW) *
              (0.18 + 0.62 * blotchF + 0.42 * brk);
            // the person's OWN pixels are the subject, not background: they stay
            // photographic, with the boundary torn by brush-scale noise so it can
            // never harden into a sticker edge (CRAFT §A2)
            float onBody = smoothstep(0.35, 0.82, m.r + ragged * 0.12);
            float abst = clamp(uBgAbs * (0.30 + 0.55 * edgeM +
              0.85 * blotchF * (0.35 + 0.65 * edgeM) - 0.62 * near), 0.0, 1.0);
            abst *= 1.0 - 0.88 * onBody * uPresent;

            // ---- the ground: real footage, graded and dissolved -----------
            vec3 camRaw = texture(uScene, vUv).rgb;
            vec2 dirv = normalize(flow + vec2(1e-4, 1e-4));
            vec2 smr = dirv * 0.0045 +
              curlN(vUv * ar * 3.0 + vec2(0.0, uTime * 0.03)) * 0.004;
            vec3 camS = 0.25 * (texture(uScene, vUv + smr).rgb +
              texture(uScene, vUv - smr).rgb +
              texture(uScene, vUv + smr * 2.4).rgb +
              texture(uScene, vUv - smr * 2.4).rgb);
            vec3 camMix = mix(camRaw, camS, 0.10 + 0.72 * abst);
            float gl0 = lumaf(camMix);
            // the night garden the background sinks into: a deep blue-violet
            // earth with a faint warm horizon, mottled so it is not a flat swatch
            vec3 gardenA = vec3(0.014, 0.020, 0.036);
            vec3 gardenB = vec3(0.040, 0.026, 0.052);
            vec3 garden = mix(gardenA, gardenB,
              smoothstep(0.30, 0.70, fbm4(vUv * ar * 2.6 + 5.0)));
            garden += vec3(0.026, 0.017, 0.012) * (1.0 - smoothstep(0.0, 0.45, vUv.y));
            garden *= 0.45 + 0.85 * gl0;     // keep the footage's own light shape
            vec3 bg = mix(camMix, mix(vec3(gl0), camMix, 0.30) * 0.60, abst * 0.85);
            bg *= mix(1.0, 0.52, abst);      // dusk falloff away from the singer
            bg = mix(bg, garden, pow(abst, 1.05) * 0.95);
            bg = clamp(bg * uExposure, 0.0, 4.0);

            // ---- the flower layer, premultiplied over the ground ----------
            vec3 col = bg * (1.0 - clamp(F.a, 0.0, 1.0)) + F.rgb;

            // ---- keep the singer legible: the person's CORE comes back ~half
            // in front of the flowers, so blossoms crossing the body read as a
            // translucent foreground instead of erasing the face. The boundary
            // is broken with the same brush-scale noise.
            float deep = smoothstep(0.62, 0.96, m.r + ragged * 0.14);
            col = mix(col, bg, deep * 0.50 * uPresent);

            // ---- bloom: the flowers' own light ---------------------------
            vec3 b1 = texture(uB1, vUv).rgb;
            vec3 b2 = texture(uB2, vUv).rgb;
            col += (b1 * 0.42 + b2 * 0.66) * (0.22 + 1.05 * uGlow);

            // ---- shoulder tonemap: tames the glow WITHOUT crushing the
            // photograph (a global filmic curve would darken the whole room)
            float l = lumaf(col);
            float lt = l < 0.72 ? l : 0.72 + (l - 0.72) / (1.0 + (l - 0.72) * 1.7);
            col *= l > 1e-4 ? lt / l : 1.0;

            // ---- static grain + vignette (seeded by pixel only) ----------
            float h1 = hash12(floor(gl_FragCoord.xy));
            col += (h1 - 0.5) * uFilmGrain * (0.045 +
              0.075 * (1.0 - smoothstep(0.05, 0.6, lumaf(col))));
            float vig = 1.0 - 0.16 * pow(clamp(
              length((vUv - 0.5) * vec2(1.04, 1.0)) * 1.42, 0.0, 1.0), 2.0);
            col *= vig;

            if (uDebug == 1) {
              col = vec3(m.r, m.g, clamp(length(flow) * 2.0, 0.0, 1.0));
            } else if (uDebug == 2) {
              // audio meters: rms / sustain / centroid / zcr / pitch / arc
              float vals[6];
              vals[0] = uAudA.x; vals[1] = uAudB.x; vals[2] = uAudA.y;
              vals[3] = uAudA.z; vals[4] = uAudB.y; vals[5] = uAudB.w;
              col = vec3(0.03, 0.035, 0.05);
              for (int i = 0; i < 6; i++) {
                float y0 = 0.14 + 0.115 * float(i);
                float band = 1.0 - smoothstep(0.030, 0.038, abs(vUv.y - y0));
                float fill = step(vUv.x, 0.08 + 0.84 * clamp(vals[i], 0.0, 1.0));
                col = mix(col, flowerHue(0.08 + 0.13 * float(i)),
                  band * fill * 0.95);
                col = mix(col, vec3(0.16), band * (1.0 - fill) * 0.6);
              }
              col = mix(col, vec3(1.0, 0.85, 0.5),
                (1.0 - smoothstep(0.02, 0.05, length((vUv - vec2(0.94, 0.88)) *
                vec2(uAspect, 1.0)))) * clamp(uAudA.w, 0.0, 1.0));
            } else if (uDebug == 3) {
              float band = clamp(soft - m.r, 0.0, 1.0);
              col = vec3(band * 3.0, clamp(F.a, 0.0, 1.0), aura * 1.6);
            } else if (uDebug == 4) {
              col = F.rgb + vec3(0.10) * clamp(F.a, 0.0, 1.0);
            } else if (uDebug == 5) {
              float row = floor(vUv.y * 3.0);
              col = row < 1.0 ? mix(LEAF_D, LEAF_L, vUv.x)
                : (row < 2.0 ? flowerHue(vUv.x)
                : mix(vec3(0.020, 0.028, 0.046), vec3(0.052, 0.036, 0.062), vUv.x));
            }
            col = min(col, vec3(0.985));      // hard whiteout guard
            fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
          }
        `;

        /* ------------------------------------------------------------------
           Program / target plumbing
        ------------------------------------------------------------------ */

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(`Shader compile failed: ${gl.getShaderInfoLog(shader)}`);
          }
          return shader;
        }
        function createProgramVS(vsSource, fsSource) {
          const program = gl.createProgram();
          gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
          gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(`Program link failed: ${gl.getProgramInfoLog(program)}`);
          }
          return program;
        }
        function createProgram(fsSource) {
          return createProgramVS(fullscreenVS, fsSource);
        }
        function getLocations(program, names) {
          const out = {};
          names.forEach((name) => {
