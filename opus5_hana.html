<!doctype html>
<!--
  opus5_hana.html — WebGL2 マイク+カメラ →「花 / Song of Flowers」
  ギターでの弾き語りに合わせて、歌う人のまわりに花が育つ。マイクの声と弦の音が
  「種→芽→茎→蕾→開花→満開→散華」のライフサイクルを進める唯一の動力で、
  音量・声色(スペクトル重心)・音高・アタック(onset)・息のノイズ(ZCR)が
  それぞれ別の視覚量に写る。人物のコアは実写のまま鮮明に残り(切り抜きにしない)、
  背景は画面の周縁と大きな不規則パッチから夜の花園へ溶ける。歌が止まれば花は
  萎れて散り、余白が戻る。
  派生元エンジン: fable5_flower-being.html(花・花びらのスプライト表現と GPU
  パーティクル)/ opus5_kiin-seido.html(人物周辺の抽象度場・実写の地・検知と
  モバイル recipe・検証フック)/ fable5_kotonoha-shigure.html(マイク解析)。

  様式解析(視覚的不変量。優先度 1>2>3>4>5>6):
    1. 音が進めるライフサイクル — 花は舞うだけの花びらではなく、根を持つ株として
       芽吹き、茎が伸び、蕾が膨らみ、開花し、やがて散る。段階を進めるのは音だけ
       (持続音=伸長 / アタック=開花 / 無音=萎れ)。株は固定プールの状態機械で、
       段階は連続量 stage∈[0,4.6] として GPU の状態テクスチャに持つ。
    2. 人物は実写・周囲は花園 — 地はカメラ映像そのもの(バーチャル背景にしない)。
       抽象度場 =(周縁 + fbm パッチ − 人物近傍)で背景だけが夜の花園へ溶ける。
       距離だけで抽象化すると人型ハロー=切り抜きが再発する。花は人物の周縁帯と
       画面下から芽吹き、体の外へ向かって咲く(向きは −grad(aura) と上方向の合成)。
    3. 音の要素が別々の視覚量に写る — 音量=開き・発光・舞い上がり / 声色(重心)=
       色相 / 音高=茎の伸びる高さ / アタック=一斉開花と花びらの射出 / 息のノイズ=
       綿毛と花びら縁のかすれ / ビブラート=揺れ。ひとつの量に束ねない。
    4. 花は離散した個体 — 丸いボケ玉にしない。深い花弁スキャロップ+花弁間の暗い
       スリット+彩度のある花芯、茎・葉・蕾・穂を持つ。散った花びらは先の尖った
       涙型で tumble する。3種(小花/大輪/穂)+綿毛。
    5. 有界性 — 株と花びらは固定プール(=構造的に有界)。加算でなく前乗算アルファの
       重ね合わせで、発光はブルーム+肩付きトーンマップに通す(白飛びしない)。
       無音が続けば萎れて散り、余白が戻る。
    6. 頑健性/モバイル — マイク拒否・カメラ拒否・MediaPipe 未ロードでも自走する
       デモ呼吸で絵が成立する。検知は ImageSegmenter のみ、推論は 288px 縮小コピー、
       33〜250ms の負荷適応間引き、GPU 破綻時 CPU 自動切替、presence はカバレッジ。
       ?fakesource=1 で音まで含めた全パイプラインをオフライン駆動。

  パイプライン図(毎フレーム。★=EXT_color_buffer_float 有効時 RGBA16F / 無効時 RGBA8):
    入力: カメラ映像 / fakeScene(GLSL 室内+動く人型) / MediaPipe seg マスク(uint8 tex)
          + マイク(AnalyserNode fft2048 → RMS/重心/ZCR/音高/onset) or 合成音
    [P0 scene]  cover-fit+mirror                          sceneA/B RGBA8 長辺≤1280
    [P1 mask]   seg tex or fake SDF → R=速い EMA マスク     maskA/B★ ≤448
                G=遅い EMA(直前の身体) BA=運動場(フレーム差分の EMA)
    [P2 soft]   マスク縁のソフト化(=芽吹きの帯)           softT★
    [P3 aura]   soft の広いぼかし(近傍場・外向き勾配)      auraT★
    [P4 plant]  株の状態 ping-pong(MRT 2枚, PLANT_W×PLANT_H)★
                A=(根x, 根y, stage/5, wilt) B=(seed, 色相, 高さ/2, 向き)
                休眠株は音のエネルギーで発芽(棄却サンプリング: 人物の縁帯 or 画面下)
    [P5 petal]  花びらの状態 ping-pong(MRT 2枚, PETAL_W×PETAL_H)★
                A=(x, y, encV(速度)) B=(年齢, 回転, seed, 色相)
                満開の株の花冠からのみ発生(外れたら休眠。全画面ばら撒きはしない)
    [P6 field]  fieldT★ を (0,0,0,0) にクリアし前乗算アルファで重ねる:
                茎+葉 → 花冠(蕾/花/穂) → 花びら+綿毛(すべて instanced quad)
    [P7 bloom]  fieldT の明部を抽出 → 2段ダウンサンプル+ぼかし        b1 b2
    [P8 comp]   地=実写カメラ → 抽象度場(周縁+fbmパッチ−人物近傍)で方向性スメア/
                彩度落ち/夜の花園へ沈める → field を前乗算合成 → 人物のコアを
                45% 手前に戻す(歌う人が判読できること)→ ブルーム加算 →
                肩付きトーンマップ・粒子・周辺減光

  実行方法:
    python3 -m http.server 8899 → http://localhost:8899/opus5_hana.html を開き
    カメラとマイクを許可(どちらも端末内で処理。外部送信なし)。
    (カメラ/マイク API はセキュアコンテキスト必須。file:// では動きません)
    ?fakesource=1 … カメラ/マイク/MediaPipe 不使用。合成室内+動く人型+合成の歌
                    (18秒ループ: 前奏→A メロ→サビ→間奏→余韻)で全パス駆動(検証用)
    ?freeze=1    … 全ての時間駆動を停止(dt=0)し決定的な静止フレームを出す(検証用)
    ?prewarm=<秒> … 初回描画前に固定 dt で早送りし「育った花」を出す(検証用)
    ?fakeseg=1   … 既知向きの合成マスクを実カメラ経路へ流し Y 反転を検査(検証用)
    ?fakescale=<f> … 合成人型を f 倍(実機スケール乖離の検査。1.8〜2.2=大写し)
    デバッグ表示: 0=最終 1=マスク/運動 2=音の特徴量 3=芽吹き場 4=花・花びら層 5=配色標本

  スライダーの説明:
    咲きの量    同時に育つ株の数と発芽の勢い
    音の感度    マイク入力のゲイン(小声でも咲かせたいとき上げる)
    伸びる速さ  声でどれだけ速く芽吹き茎が伸びるか
    風・渦      体の動きが生む突風とカールノイズの渦
    散り        花びらの散る量と萎れの速さ
    花の大きさ  花冠・花びらの大きさ
    発光        花芯とブルームの光の強さ
    色の移ろい  声色(スペクトル重心)が色相を動かす量
    背景の抽象度 実写背景が夜の花園へ溶ける度合い(0=実写のまま)
    明るさ      画面全体の露出
    フィルム粒子 全面の静的グレイン

  依存: @mediapipe/tasks-vision の CDN(実カメラ時のみ実行時 import。fakesource は
  依存ゼロ)。WebGL2 / GLSL ES 3.00 単体。音声は WebAudio の AnalyserNode のみ。
-->
