<!doctype html>
<!--
  opus5_koe.html — WebGL2 マイク+カメラ →「声 / Voice」
  森山直太朗「声」(映画『半落ち』主題歌)のための映像。
  **歌っていないあいだは雨が降り、歌えば声は体の奥で光になる。** 人物は実写のまま。
  夜の雨に打たれて肩から濡れ、濡れた跡は乾ききらない。歌い続けると声が胸から
  光として昇って全身を内側から灯し、光が満ちるほど雨は上がって、やがて晴れる
  (この声が いつの日か あなたに見える日まで/光の庭で 永遠に唄うよ)。
  黙れば、また静かな雨が戻る(何も語らず 静かに そっと肩にかかる雨)。
  真綿は人を覆わない — 「真綿のように生きて居る」は生き方の直喩なので、
  白い綿毛として風に流れ、雲は暗がりをゆっくり過ぎていく。
  派生元エンジン: opus5_hana.html(ImageSegmenter のモバイル手順・マイク解析・
  合成の歌・カメラと UI と検証フック)。

  様式解析(視覚的不変量。優先度 1>2>5>3>4>6):
    1. 天候の弧 — 雨と光は同じ一つの状態(shine)の両端。無音=雨、歌えば光が
       満ちて雨が上がる。天気と同じで、ひと声では変わらない(満ちるのに十数秒、
       引くのに数十秒)。雨は夜の雨らしい細い斜めの筋として見える。
    2. 人物は実写のまま — 「花」と同じ図地の割り方(2026-07-28 の是正。素材
       置換はシルエット化を招き、直喩の読みとしても誤りだった)。夜のグレードの
       中でマスクが人物だけを淡く持ち上げ、人が人として読める。
       真綿・風・雲は抽象表現として空中に出す:
       白い綿毛が風に流れ(真綿のように/風に吹かれ)、
       雲が暗がりをゆっくり過ぎて、晴れるにつれ薄れる(雲に焦がれ)。
    3. 雨は肩にかかる — ぼかしたマスクの勾配=法線と上方マーチの遮蔽判定で、
       上を向いた面(肩・頭頂)だけが濡れる。腕の下側は乾いたまま。
       粒が当たった瞬間だけ淡く光り、濡れは重力で流れ落ちて胴へ広がる。
    4. 濡れは実写の上に — 雨に打たれた服と髪は暗く沈み、色が抜ける(肩から)。
       水滴の反射で光らせない。
    5. 声の光は胸から昇り、後光になる — 光は空から降らず、歌っている体の奥で
       湧き、上へ昇って肩と頭に満ちる。**実写の明るさが光を運ぶ**(顔や皺の
       明るい所が灯り、影は影のまま)ので、体の実際の形に沿って灯る。
       輪郭は縁が燃えるように光り、身体の**重心から光芒が放射する**
       (光の場を中心へ向かってマーチして外へ塗る。中心はマスクの重心から
       求め、cover-fit と鏡像を逆変換して画面座標に直す)。=光の庭。
       一様には光らせない(§A1)。
    6. 確かな誇り — 濡れには下限があり、乾ききらない。届いたものは残る。
       ただし上限で飽和するので、いつまでも溜まり続けはしない。

  パイプライン図(毎フレーム。★=EXT_color_buffer_float 有効時 RGBA16F / 無効時 RGBA8):
    入力: カメラ映像 + ImageSegmenter / fakeScene(GLSL 室内+動く人型) + マイク or 合成の歌
    [P0 scene]  cover-fit+mirror                        sceneA/B RGBA8 長辺≤1280
    [P1 mask]   R=速いマスクEMA G=遅いマスクEMA BA=運動ベクトル  maskA/B★ ≤448
    [P2 blur]   マスクのソフト化(法線を取るため)            softT★
    [P3 wet]    濡れと光の場 ping-pong★。R=濡れ G=誇りの床 B=声の光
                濡れ: 雨量×上向きの面×遮蔽なし×マスク → 重力で流下、床まで減衰
                光: 歌う声がマスク深部で湧き、下から上へ昇り、ゆっくり減衰
    [P4 rain]   雨粒プール ping-pong(MRT 2枚, RAIN_W×RAIN_H)★
                A=(x, y, encV(速度)) B=(齢, 大きさ, seed, 奥行き)
                発生率=いまの雨量(=天候)。奥行きで3層の視差。近い粒だけが
                身体に届いて閃光になり、濡れを足す
    [P4b wisp]  綿毛プール ping-pong(MRT 2枚, WISP_W×WISP_H)★
                浮力で漂い、風に流れ、カールノイズで蛇行。落ちない。
                晴れるほど身体の光を受けて明るむ
    [P5 layer]  layerT★ を透明にクリアし前乗算アルファで重ねる:
                綿毛(宙を漂う)→ 声の光(全画面・エミッシブ。実写輝度が変調)→
                雨(落下中の筋+着弾の閃光)
    [P6 bloom]  layerT の明部を抽出 → 2段ダウンサンプル+ぼかし        b1 b2
    [P7 comp]   夜の実写 → 人物を淡く持ち上げ(実写のまま)→ 濡れで暗く沈め →
                雲(暗がりのみ・晴れで薄れる)→ 声の光(実写輝度が運ぶ)→
                layer 前乗算合成 → ブルーム(=光の庭のハロー)→
                誇りの淡い温度 → 肩付きトーンマップ・粒子・周辺減光

  実行方法:
    python3 -m http.server 8899 → http://localhost:8899/opus5_koe.html を開き
    カメラとマイクを許可(どちらも端末内で処理。外部送信なし)。
    (カメラ/マイク API はセキュアコンテキスト必須。file:// では動きません)
    **歌ってください。歌い続けると雨が上がり、体が灯ります。黙ると、また雨が戻ります。**
    ?fakesource=1 … カメラ/マイク不使用。合成室内+動く人型+合成の歌(24秒ループ。
                    無音→静かな持続→ふくらみ→無音の天候弧)で全パス駆動(検証用)
    ?freeze=1    … 全ての時間駆動を停止(dt=0)し決定的な静止フレームを出す(検証用)
    ?prewarm=<秒> … 初回描画前に固定 dt で早送り(検証用。上限20秒)
    ?fakeseg=1   … 実カメラのマスク経路を合成マスクで駆動(Y反転の検査)
    ?fakescale=<f> … 合成人型を f 倍(実機スケール乖離の検査。1.8〜2.2=大写し)
    デバッグ表示: 0=最終 1=マスクと法線 2=濡れと光 3=音の特徴量(光=天候を含む)
                  4=雨と綿毛 5=配色標本

  スライダーの説明:
    雨          歌っていないときに降る雨の量
    晴れ        光が満ちたときに、どれだけ晴れるか
    声の光      声が体に灯す光の強さ
    後光        体から放たれる光芒の強さ
    真綿        風に漂う綿毛の量
    乾きにくさ  濡れた跡がどれだけ長く残るか
    風          風の強さ(雨の傾きと綿毛の流れ)
    音の感度    マイクの感度(小さな声で歌うときは上げる)
    明るさ      画面全体の明るさ
    粒子        画面全体にかかる粒子の量

  依存: MediaPipe tasks-vision(ImageSegmenter)とそのモデルのみ。他は自己完結。
-->

    <style>

        color-scheme: dark;
        --bg: #05070a;
        --ink: #f0e6ea;
        --muted: rgba(240, 230, 236, 0.66);

  <body>
    <canvas id="gl" aria-label="WebGL2 声 — 雨と光のウェブカメラ作品"></canvas>
    <video id="video" playsinline muted autoplay></video>

    <button id="togglePanel" type="button" class="top-btn hidden"
      aria-label="コントローラーを開く" aria-expanded="true">☰</button>
    <button id="flipCamera" type="button" class="top-btn" aria-label="カメラ切替">背面カメラ</button>
    <div id="statusChip">起動中</div>

    <section id="panel" class="panel" aria-label="声 のコントローラー"></section>

    <div id="overlay" role="status" aria-live="polite">
      <div class="overlay-card">
        <h2 id="overlayTitle">REQUESTING CAMERA</h2>
        <p id="overlayText">
          Please allow webcam access. Serve this file from localhost or HTTPS.
        </p>
        <button id="retryCamera" type="button" hidden>RETRY CAMERA</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("gl");
        const video = document.getElementById("video");
        const panel = document.getElementById("panel");
        const togglePanel = document.getElementById("togglePanel");
        const flipCameraBtn = document.getElementById("flipCamera");
        const statusChip = document.getElementById("statusChip");
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlayText = document.getElementById("overlayText");
        const retryCamera = document.getElementById("retryCamera");

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        const QUERY = new URLSearchParams(location.search);
        // ?fakesource=1 replaces BOTH inputs: a synthetic room + a full-body
        // figure that drifts and swings its limbs stands in for the camera, and
        // a scripted 18s song (intro / verse / chorus / bridge / fade) stands in
        // for the microphone. Neither MediaPipe nor WebAudio is ever touched, so
        // the whole growth pipeline runs offline and deterministically.
        const FAKE = QUERY.get("fakesource") === "1";
        // ?freeze=1 makes dt = 0: plant stages, petal physics, the audio EMAs,
        // the fake figure and every mask EMA stop → deterministic still frame.
        const FREEZE = QUERY.get("freeze") === "1";
        // ?fakeseg=1 (offline diagnostic; use with fakesource=1): forces the
        // uSource==1 real-camera mask path and feeds it a synthetic R8 mask of
        // KNOWN orientation (person in the TOP ~60% of image space, top-left
        // origin, uploaded UNPACK_FLIP_Y=false exactly like a MediaPipe mask).
        // With the Y-flip correct the flowers must sprout around the TOP figure;
        // if they gather at the bottom the flip regressed (CRAFT §C1).
        const FAKESEG = QUERY.get("fakeseg") === "1";
        // ?fakescale=<f> scales the synthetic figure (real-scale divergence test,
        // CRAFT §C2). f>1 = big/close, f<1 = far/small. Default 1.0.
        const FAKESCALE = (() => {
          const v = parseFloat(QUERY.get("fakescale"));
          return Number.isFinite(v) && v > 0.05 ? Math.min(4, v) : 1.0;
        })();
        // ?prewarm=<sec> fast-forwards the simulation with a fixed dt before the
        // first present, so a screenshot shows grown flowers instead of bare
        // ground (the verification GPU is far too slow to warm in real time —
        // CRAFT §C4). Chunked + glSync'd so the compositor is never parked.
        const PREWARM = (() => {
          const v = parseFloat(QUERY.get("prewarm"));
          return Number.isFinite(v) && v > 0 ? Math.min(30, v) : 0;
        })();
        const PREWARM_DT = 1 / 24;

        const DEBUG_MODES = [
          "最終",
          "マスクと法線",
          "濡れと光",
          "音の特徴量",
          "雨と綿毛",
          "配色標本",
        ];

        const DEFAULTS = {
          rain: 0.60,
          clear: 0.92,
          glowAmt: 0.62,
          rays: 0.62,
          floss: 0.55,
          soak: 0.50,
          wind: 0.45,
          micGain: 0.55,
          exposure: 1.0,
          filmGrain: 0.18,
        };

        const state = {
          ...DEFAULTS,
          debugView: 0,
          mirror: true,
          facingMode: "user",
          pauseAnim: reducedMotion || FREEZE,
        };

        const uiRows = [
          ["rain", "雨", "歌っていないときに降る雨の量", 0, 1, 0.01],
          ["clear", "晴れ", "光が満ちたときに、どれだけ晴れるか", 0, 1, 0.01],
          ["glowAmt", "声の光", "声が体に灯す光の強さ", 0, 1, 0.01],
          ["rays", "後光", "体から放たれる光芒の強さ", 0, 1, 0.01],
          ["floss", "真綿", "風に漂う綿毛の量", 0, 1, 0.01],
          ["soak", "乾きにくさ", "濡れた跡がどれだけ長く残るか", 0, 1, 0.01],
          ["wind", "風", "風の強さ(雨の傾きと綿毛の流れ)", 0, 1, 0.01],
          ["micGain", "音の感度", "マイクの感度(小さな声で歌うときは上げる)", 0, 1, 0.01],
          ["exposure", "明るさ", "画面全体の明るさ", 0.6, 1.4, 0.01],
          ["filmGrain", "粒子", "画面全体にかかる粒子の量", 0, 1, 0.01],
        ];

        panel.innerHTML = `
          <button id="closePanel" type="button" aria-label="コントローラーを閉じる">✕</button>
          <div class="panel-body">
          <h1>OPUS5 · 声</h1>
          <p>
            歌っていないあいだは、雨が降っています。夜の雨が肩を濡らし、
            濡れた跡は乾ききりません。歌うと、声は体の奥で光になります —
            <strong>歌い続けるほど光は満ちてゆき、輪郭が燃えて後光が
            差し、やがて雨が上がって晴れていきます</strong>。黙れば、また静かな雨が戻ります。真綿のような
            白い綿毛が風に流れ、雲が暗がりをゆっくり過ぎていきます。
            天気と同じで、ひと声では変わりません。
            映像も音声も、すべて端末内で処理されます。
          </p>
          <div class="select-row">
            <span>デバッグ表示</span>
            <select id="debugView" aria-label="デバッグ表示">
              ${DEBUG_MODES.map(
                (label, i) => `<option value="${i}">${label}</option>`,
              ).join("")}
            </select>
          </div>
          ${uiRows
            .map(
              ([key, label, hint, min, max, step]) => `
                <div class="row">
                  <label for="${key}">
                    ${label}
                    <span>${hint}</span>
                  </label>
                  <output id="${key}Out">${formatValue(state[key])}</output>
                  <input id="${key}" type="range" min="${min}" max="${max}"
                    step="${step}" value="${state[key]}" />
                </div>
              `,
            )
            .join("")}
          <label class="check-row">
            <span>左右反転(鏡)</span>
            <input id="mirror" type="checkbox" ${state.mirror ? "checked" : ""} />
          </label>
          <label class="check-row">
            <span>ゆらぎを停止</span>
            <input id="pauseAnim" type="checkbox" ${state.pauseAnim ? "checked" : ""} />
          </label>
          <div class="meter" aria-label="入力音量"><i id="levelBar"></i></div>
          <div class="buttons">
            <button id="savePng" type="button">PNG保存</button>
            <button id="resetLook" type="button">リセット</button>
            <button id="micRetry" type="button">マイク再試行</button>
          </div>
          <div class="status">
            <div id="readout">FPS -- / 解像度 -- / 綿毛 -- / 雨 -- / 音 -- / 検知 --</div>
            <span class="badge">WebGL2 · Mic + MediaPipe · GPU Plants</span>
          </div>
          </div>
        `;

        uiRows.forEach(([key]) => {
          const input = document.getElementById(key);
          const out = document.getElementById(`${key}Out`);
          input.addEventListener("input", () => {
            state[key] = Number(input.value);
            out.textContent = formatValue(state[key]);
          });
        });

        function setSlider(key, value) {
          state[key] = value;
          const input = document.getElementById(key);
          const out = document.getElementById(`${key}Out`);
          if (input) input.value = value;
          if (out) out.textContent = formatValue(value);
        }

        document.getElementById("debugView").addEventListener("change", (event) => {
          state.debugView = Number(event.currentTarget.value);
        });
        document.getElementById("mirror").addEventListener("change", (event) => {
          state.mirror = event.currentTarget.checked;
        });
        document.getElementById("pauseAnim").addEventListener("change", (event) => {
          state.pauseAnim = event.currentTarget.checked;
        });
        document.getElementById("resetLook").addEventListener("click", () => {
          Object.keys(DEFAULTS).forEach((key) => setSlider(key, DEFAULTS[key]));
        });

        const closePanel = document.getElementById("closePanel");
        function setPanelCollapsed(collapsed) {
          panel.classList.toggle("collapsed", collapsed);
          togglePanel.classList.toggle("hidden", !collapsed);
          togglePanel.setAttribute("aria-expanded", String(!collapsed));
        }
        togglePanel.addEventListener("click", () => setPanelCollapsed(false));
        closePanel.addEventListener("click", () => setPanelCollapsed(true));
        const isMobile = window.matchMedia("(max-width: 640px)").matches;
        setPanelCollapsed(isMobile);

        flipCameraBtn.addEventListener("click", () => {
          state.facingMode = state.facingMode === "user" ? "environment" : "user";
          flipCameraBtn.textContent =
            state.facingMode === "user" ? "背面カメラ" : "前面カメラ";
          state.mirror = state.facingMode === "user";
          document.getElementById("mirror").checked = state.mirror;
          startCamera();
        });

        document.getElementById("savePng").addEventListener("click", () => {
          const link = document.createElement("a");
          const stamp = new Date().toISOString().replace(/[:.]/g, "-");
          link.download = `opus5-koe-${stamp}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        });

        function formatValue(value) {
          return Number(value).toFixed(Math.abs(value) >= 10 ? 0 : 2);
        }

        function setOverlay(kind, title, text, buttons = {}) {
          overlayTitle.textContent = title;
          overlayText.textContent = text;
          retryCamera.hidden = !buttons.retryCamera;
          overlay.classList.toggle("hidden", kind === "hidden");
        }

        /* ------------------------------------------------------------------
           WebGL2 setup
        ------------------------------------------------------------------ */

        const gl = canvas.getContext("webgl2", {
          alpha: false,
          antialias: false,
          depth: false,
          stencil: false,
          preserveDrawingBuffer: true,
          powerPreference: "high-performance",
        });

        if (!gl) {
          setOverlay(
            "error",
            "WEBGL2 UNAVAILABLE",
            "This piece needs WebGL2. Try a current desktop/mobile browser with hardware acceleration enabled.",
          );
          return;
        }

        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.CULL_FACE);
        gl.disable(gl.BLEND);

        // Float render targets keep the plant/petal state and the HDR flower
        // layer from stalling in 8 bits. Signed velocity is offset-encoded into
        // [0,1] (encV) so the RGBA8 fallback runs the same shaders, coarser.
        const floatExt = gl.getExtension("EXT_color_buffer_float");

        // Renderer probe → pool sizing. Software (SwiftShader in the verifier)
        // and coarse-pointer (mobile) devices get smaller pools.
        const dbgRI = gl.getExtension("WEBGL_debug_renderer_info");
        const RENDERER = dbgRI ? gl.getParameter(dbgRI.UNMASKED_RENDERER_WEBGL) : "";
        const IS_SOFT = /swiftshader|llvmpipe|software|basic|subzero/i.test(RENDERER);
        const COARSE = window.matchMedia("(pointer: coarse)").matches;

        // 真綿の綿毛. 「真綿のように生きて居る」は空気を含んだ柔らかさの直喩で
        // あって、人体を覆う布ではない(2026-07-28 の是正)。宙をゆっくり漂う
        // 綿毛のプール — 生きた数は百前後、風に吹かれて流れていく。
        const WISP_SIDE = IS_SOFT ? 12 : (COARSE ? 16 : 20);
        const WISP_W = WISP_SIDE;
        const WISP_H = WISP_SIDE;
        const WISP_N = WISP_W * WISP_H;         // 144 / 256 / 400

        // 声の雨. Free particles, two MRT attachments. Sized to the live
        // population: drops are invisible in flight and only matter at the
        // instant of contact, so this is a throughput pool, not a spray.
        const RAIN_SIDE = IS_SOFT ? 40 : (COARSE ? 56 : 80);
        const RAIN_W = RAIN_SIDE;
        const RAIN_H = RAIN_SIDE;
        const RAIN_N = RAIN_W * RAIN_H;         // 1600 / 3136 / 6400

        const fullscreenVS = `#version 300 es
          precision highp float;
          const vec2 POS[3] = vec2[3](
            vec2(-1.0, -1.0), vec2( 3.0, -1.0), vec2(-1.0,  3.0)
          );
          out vec2 vUv;
          void main() {
            vec2 p = POS[gl_VertexID];
            vUv = p * 0.5 + 0.5;
            gl_Position = vec4(p, 0.0, 1.0);
          }
        `;

        // Shared: pcg-flavoured hashes + value noise + fbm + curl noise (unit
        // scaled) + the 2D SDF helpers. Grain, mottle and every placement seed
        // are derived from POSITION or INDEX only — never from uTime (repo rule)
        // so they stay deterministic under ?freeze=1.
        const CHUNK_NOISE = `
          const float PI2 = 6.28318530718;
          float hash12(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
          }
          vec2 hash22(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
            p3 += dot(p3, p3.yxz + 33.33);
            return fract((p3.xx + p3.yz) * p3.zy);
          }
          float h11(float p) {
            p = fract(p * 0.1031);
            p *= p + 33.33;
            p *= p + p;
            return fract(p);
          }
          float vnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash12(i);
            float b = hash12(i + vec2(1.0, 0.0));
            float c = hash12(i + vec2(0.0, 1.0));
            float d = hash12(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }
          float fbm4(vec2 p) {
            float s = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 4; i++) {
              s += amp * vnoise(p);
              p *= 2.03;
              amp *= 0.5;
            }
            return s;
          }
          float fbm(vec2 p) {
            float s = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 5; i++) {
              s += amp * vnoise(p);
              p *= 2.03;
              amp *= 0.5;
            }
            return s;
          }
          // curl of value noise, normalised to ≈ unit scale (a raw finite
          // difference divided by 2e reaches ~20 and turns a "small" coefficient
          // into a 200px warp — CRAFT / kiin-seido §8-3).
          vec2 curlN(vec2 p) {
            float e = 0.35;
            float n1 = vnoise(p + vec2(0.0, e)) - vnoise(p - vec2(0.0, e));
            float n2 = vnoise(p + vec2(e, 0.0)) - vnoise(p - vec2(e, 0.0));
            return vec2(n1, -n2) * 1.6;
          }
          float sdSeg(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a;
            vec2 ba = b - a;
            float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
            return length(pa - ba * h);
          }
          float smin2(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
          }
        `;

        // Shared: [0,1] offset encoding for signed fields. The clamp doubles as
        // the mandatory velocity clamp (no NaN blow-ups).
        const CHUNK_ENC = `
          const float VMAX = 2.4;
          vec2 encV(vec2 v) { return clamp(v, -VMAX, VMAX) / (2.0 * VMAX) + 0.5; }
          vec2 decV(vec2 e) { return (e - 0.5) * (2.0 * VMAX); }
        `;

        // Shared: the ?fakesource=1 synthetic scene — a lit room (never black)
        // with a full-body figure that drifts, bobs and swings its limbs. The
        // swing is what makes the motion field, the gusts and the edge-band
        // sprouting testable offline. uScale is ?fakescale= (CRAFT §C2).
        const CHUNK_FAKE = `
          float humanDist(vec2 p, float cx, float swing, float sc) {
            vec2 anchor = vec2(cx, 0.46);
            p = (p - anchor) / max(sc, 0.05) + anchor;
            float d = 1e9;
            vec2 head = vec2(cx, 0.80);
            d = min(d, length((p - head) / vec2(1.0, 1.14)) - 0.062);
            d = smin2(d, sdSeg(p, vec2(cx, 0.745), vec2(cx, 0.685)) - 0.024, 0.018);
            d = smin2(d, sdSeg(p, vec2(cx, 0.685), vec2(cx, 0.40)) - 0.098, 0.045);
            d = smin2(d, sdSeg(p, vec2(cx - 0.115, 0.665), vec2(cx + 0.115, 0.665)) - 0.052, 0.04);
            // arms: shoulder → elbow → hand, driven by the swing phase (the
            // strumming/fretting arm of the singer)
            float aL = 2.55 + 0.62 * swing;
            vec2 shL = vec2(cx - 0.115, 0.655);
            vec2 elL = shL + 0.135 * vec2(cos(aL), sin(aL) * 0.7 - 0.35);
            vec2 haL = elL + 0.125 * vec2(cos(aL - 0.55 - 0.5 * swing),
                                          sin(aL - 0.55 - 0.5 * swing) * 0.8 - 0.3);
            d = smin2(d, sdSeg(p, shL, elL) - 0.036, 0.03);
            d = smin2(d, sdSeg(p, elL, haL) - 0.028, 0.028);
            float aR = 0.59 - 0.62 * swing;
            vec2 shR = vec2(cx + 0.115, 0.655);
            vec2 elR = shR + 0.135 * vec2(cos(aR), sin(aR) * 0.7 - 0.35);
            vec2 haR = elR + 0.125 * vec2(cos(aR + 0.55 + 0.5 * swing),
                                          sin(aR + 0.55 + 0.5 * swing) * 0.8 - 0.3);
            d = smin2(d, sdSeg(p, shR, elR) - 0.036, 0.03);
            d = smin2(d, sdSeg(p, elR, haR) - 0.028, 0.028);
            // legs: hip → knee → foot
            vec2 hipL = vec2(cx - 0.05, 0.405);
            vec2 knL = hipL + vec2(-0.028 - 0.05 * swing, -0.15);
            vec2 ftL = knL + vec2(-0.012 + 0.03 * swing, -0.155);
            d = smin2(d, sdSeg(p, hipL, knL) - 0.044, 0.035);
            d = smin2(d, sdSeg(p, knL, ftL) - 0.034, 0.03);
            vec2 hipR = vec2(cx + 0.05, 0.405);
            vec2 knR = hipR + vec2(0.028 + 0.05 * swing, -0.15);
            vec2 ftR = knR + vec2(0.012 - 0.03 * swing, -0.155);
            d = smin2(d, sdSeg(p, hipR, knR) - 0.044, 0.035);
            d = smin2(d, sdSeg(p, knR, ftR) - 0.034, 0.03);
            // the guitar: a body ellipse across the lap plus a neck to the left
            vec2 gc = vec2(cx + 0.055, 0.44);
            float gd = length((p - gc) / vec2(1.25, 1.0)) - 0.085;
            vec2 nk0 = gc + vec2(-0.09, 0.045);
            vec2 nk1 = gc + vec2(-0.30, 0.130);
            gd = min(gd, sdSeg(p, nk0, nk1) - 0.016);
            d = min(d, gd);
            return d;
          }
          vec3 fakeScene(vec2 uv, float cx, float cy, float swing, float aspect, float sc) {
            // a lit room, not a dim gradient: the synthetic scene is the only
            // proxy for a real background, so it must sit in a realistic
            // exposure range or every judgement about the flowers over it is wrong
            vec3 top = vec3(0.30, 0.31, 0.36);
            vec3 bot = vec3(0.46, 0.42, 0.37);
            vec3 bg = mix(top, bot, smoothstep(0.0, 1.0, uv.y));
            bg += 0.03 * (0.5 + 0.5 * sin(uv.x * 30.0) - 0.5);
            float horizon = exp(-pow((uv.y - 0.40) * 6.0, 2.0));
            bg = mix(bg, vec3(0.55, 0.51, 0.45), 0.16 * horizon);
            bg += 0.04 * (vnoise(uv * 5.0) - 0.5);
            vec2 p = vec2((uv.x - 0.5) * aspect + 0.5, uv.y - cy);
            float d = humanDist(p, cx, swing, sc);
            float m = 1.0 - smoothstep(-0.004, 0.008, d);
            // body-local coords (same transform humanDist uses) so the costume
            // regions ride with ?fakescale=. The figure needs INTERNAL tonal
            // structure — a flat silhouette makes the grading and the
            // figure/flower interplay impossible to judge offline.
            vec2 q = (p - vec2(cx, 0.46)) / max(sc, 0.05) + vec2(cx, 0.46);
            float folds = 0.86 + 0.30 * fbm(q * vec2(34.0, 20.0));
            float upper = smoothstep(0.40, 0.46, q.y);
            vec3 person = mix(vec3(0.24, 0.26, 0.33), vec3(0.68, 0.64, 0.58), upper);
            person = mix(person, vec3(0.16, 0.19, 0.29),
              smoothstep(0.01, -0.05, q.x - cx) * upper * 0.75);
            person = mix(person, vec3(0.15, 0.18, 0.27),
              smoothstep(0.60, 0.69, q.y) * 0.85);
            person = mix(person, vec3(0.36, 0.25, 0.16),
              exp(-pow((q.y - 0.44) * 55.0, 2.0)));            // the guitar body
            person *= folds;
            float headM = 1.0 - smoothstep(0.050, 0.070,
              length((q - vec2(cx, 0.80)) / vec2(1.0, 1.14)));
            vec3 skin = vec3(0.62, 0.49, 0.42);
            skin *= 1.0 - 0.45 * exp(-pow((q.y - 0.815) * 240.0, 2.0));  // brow
            skin *= 1.0 - 0.28 * exp(-pow((q.y - 0.772) * 190.0, 2.0));  // mouth
            person = mix(person, skin, headM);
            person *= 0.78 + 0.34 * smoothstep(0.05, 0.80, q.y);
            return clamp(mix(bg, person, m), 0.0, 1.0);
          }
          float fakeMask(vec2 uv, float cx, float cy, float swing, float aspect, float sc) {
            vec2 p = vec2((uv.x - 0.5) * aspect + 0.5, uv.y - cy);
            return 1.0 - smoothstep(-0.006, 0.010, humanDist(p, cx, swing, sc));
          }
        `;

        // Shared: the flower palette. A CONTINUOUS ramp (not bands) because the
        // hue is a continuous function of the singing timbre: dark-warm at the
        // low end (chest voice / bass strings) → bright-cool at the high end
        // (falsetto / bright strum). Deterministic; no time anywhere.
        // 夜と真綿。彩度はほとんど無い。真綿は「白」だが純白ではなく、
        // 生成りの絹の白(僅かに黄がかる)。濡れるとその白が抜けて暗い灰へ落ちる。
        const CHUNK_PALETTE = `
          const vec3 NIGHT = vec3(0.026, 0.030, 0.040);   // 夜の地
          const vec3 FLOSS_DRY = vec3(0.955, 0.945, 0.915); // 生成りの絹
          const vec3 FLOSS_WET = vec3(0.225, 0.240, 0.280); // 吸って重くなった絹
          const vec3 VOICE = vec3(0.860, 0.900, 0.960);   // 着弾の閃光(青白い)
          const vec3 PRIDE = vec3(0.940, 0.870, 0.760);   // 胸のうちの温度
          float lumaf(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
        `;

        // P0 — webcam cover-fit + mirror (or the synthetic scene) into the
        // working scene buffer. Everything downstream is screen-aligned to it.
        const sceneFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uVideo;
          uniform vec2 uResolution;
          uniform vec2 uVideoSize;
          uniform float uAspect;
          uniform float uCx;
          uniform float uCy;
          uniform float uSwing;
          uniform float uScale;
          uniform int uMirror;
          uniform int uFake;
          uniform int uHasVideo;
          ${CHUNK_NOISE}
          ${CHUNK_FAKE}
          void main() {
            if (uFake == 1) {
              fragColor = vec4(fakeScene(vUv, uCx, uCy, uSwing, uAspect, uScale), 1.0);
              return;
            }
            if (uHasVideo == 0) {
              // neutral holding backdrop while the camera warms up (not black)
              fragColor = vec4(mix(vec3(0.10, 0.10, 0.13),
                vec3(0.20, 0.18, 0.24), vUv.y), 1.0);
              return;
            }
            vec2 uv = vUv;
            if (uMirror == 1) uv.x = 1.0 - uv.x;
            float canvasAspect = uResolution.x / uResolution.y;
            float videoAspect = uVideoSize.x / uVideoSize.y;
            vec2 scale = videoAspect > canvasAspect
              ? vec2(canvasAspect / videoAspect, 1.0)
              : vec2(1.0, videoAspect / canvasAspect);
            vec2 vuv = (uv - 0.5) * scale + 0.5;
            fragColor = vec4(texture(uVideo, vuv).rgb, 1.0);
          }
        `;

        // P1 — the mask / motion field:
        //   R = fast person-mask EMA (the body as it is NOW; the sprouting band
        //       and the "keep the singer legible" core come from this)
        //   G = slow person-mask EMA (the body a moment ago; R-G is where the
        //       body just moved, which is where sprouting is favoured)
        //   BA = motion field (frame-difference pseudo flow, EMA-smoothed) — the
        //       gust that blows petals around when the performer moves
        const maskFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform sampler2D uScenePrev;
          uniform sampler2D uPrev;
          uniform sampler2D uSeg;
          uniform vec2 uTexel;
          uniform vec2 uSegScale;
          uniform float uAspect;
          uniform float uCx;
          uniform float uCy;
          uniform float uSwing;
          uniform float uScale;
          uniform float uDt;
          uniform float uAlphaFast;
          uniform float uAlphaSlow;
          uniform float uAlphaMot;
          uniform int uReset;
          uniform int uSource;
          uniform int uMirror;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_FAKE}
          float lumaf(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
          void main() {
            float rawMask = 0.0;
            if (uSource == 0) {
              rawMask = fakeMask(vUv, uCx, uCy, uSwing, uAspect, uScale);
            } else if (uSource == 1) {
              // Real-camera segmentation mask. Coordinate convention matched to
              // kiin-seido / gas-head so the mask overlaps the real person
              // pixel-for-pixel with the P0 background:
              //   * mirror: uv.x = 1-uv.x applied BEFORE cover-fit — identical
              //     to the P0 scene, so scene and mask stay in register.
              //   * cover-fit: (uv-0.5)*uSegScale+0.5 — the same crop as P0.
              //   * Y flip: sample at (suv.x, 1.0 - suv.y). MediaPipe masks are
              //     image-space (top-left origin) and segTexture is uploaded
              //     UNPACK_FLIP_Y=false, while the video texture is uploaded
              //     UNPACK_FLIP_Y=true (upright). Without the explicit flip the
              //     mask lands upside-down (CRAFT §C1: "only the face" bug).
              vec2 uv = vUv;
              if (uMirror == 1) uv.x = 1.0 - uv.x;
              vec2 suv = (uv - 0.5) * uSegScale + 0.5;
              float rawSeg = texture(uSeg, vec2(suv.x, 1.0 - suv.y)).r;
              // firm the soft confidence mask toward 0/1 so the real body is a
              // solid figure (the singer must stay legible inside it)
              rawMask = smoothstep(0.32, 0.70, rawSeg);
            }
            vec4 prev = texture(uPrev, vUv);
            float fastM = uReset == 1 ? rawMask : mix(prev.r, rawMask, uAlphaFast);
            float slowM = uReset == 1 ? rawMask : mix(prev.g, rawMask, uAlphaSlow);

            // pseudo optical flow from the scene frame difference
            vec3 cur = texture(uScene, vUv).rgb;
            float l0 = lumaf(texture(uScenePrev, vUv).rgb);
            float l1 = lumaf(cur);
            float lx = lumaf(texture(uScene, vUv + vec2(uTexel.x, 0.0)).rgb) -
              lumaf(texture(uScene, vUv - vec2(uTexel.x, 0.0)).rgb);
            float ly = lumaf(texture(uScene, vUv + vec2(0.0, uTexel.y)).rgb) -
              lumaf(texture(uScene, vUv - vec2(0.0, uTexel.y)).rgb);
            vec2 grd = vec2(lx / (2.0 * uTexel.x), ly / (2.0 * uTexel.y));
            float it = (l1 - l0) / max(uDt, 1e-3);
            vec2 flowRaw = -it * grd / (dot(grd, grd) + 40.0);
            flowRaw = clamp(flowRaw, vec2(-VMAX), vec2(VMAX));
            vec2 flow = uReset == 1 ? vec2(0.0)
              : mix(decV(prev.ba), flowRaw, uAlphaMot);

            fragColor = vec4(clamp(fastM, 0.0, 1.0), clamp(slowM, 0.0, 1.0), encV(flow));
          }
        `;

        // Separable Gaussian (all channels). Softens the mask edge into the
        // sprouting band (P2), builds the wide proximity aura (P3) and blurs the
        // flower layer for the bloom (P7).
        const blurFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uSrc;
          uniform vec2 uDir;
          uniform float uSigma;
          void main() {
            vec4 acc = vec4(0.0);
            float wsum = 0.0;
            for (int i = -10; i <= 10; ++i) {
              float x = float(i);
              float w = exp(-0.5 * x * x / max(uSigma * uSigma, 1e-4));
              acc += texture(uSrc, vUv + uDir * x) * w;
              wsum += w;
            }
            fragColor = acc / wsum;
          }
        `;

        // P3 — the WETNESS FIELD. Ping-ponged, one texel per screen cell:
        //   R = wetness now
        //   G = the FLOOR it can never dry below (確かな誇り — what arrived stays)
        //   BA = the direction the water is running (encoded)
        //
        // Where the voice lands is geometry, not decoration. Rain arrives from
        // above, so it can only wet a surface that FACES UP and is not standing
        // under something. Both of those are read off the mask:
        //   * facing up   = the blurred mask gradient points up (-grad.y)
        //   * not sheltered = a short march upward finds no body above
        // 「そっと肩にかかる雨」: the shoulders and the crown wet first, and the
        // underside of an arm stays dry. Skip either test and the whole body
        // wets uniformly, which is a wash, not rain.
        const wetFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uPrev;
          uniform sampler2D uMask;
          uniform sampler2D uSoft;
          uniform vec2 uTexel;
          uniform float uDt;
          uniform float uAspect;
          uniform float uSoak;
          uniform float uRainAmt;    // the weather: how much rain is falling now
          uniform float uVoice;      // the voice arriving as light, right now
          uniform float uGlowAmt;
          uniform int uReset;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_PALETTE}
          void main() {
            vec4 prev = texture(uPrev, vUv);
            float body = texture(uMask, vUv).r;
            float soft = texture(uSoft, vUv).r;

            // the surface normal of the silhouette, from the SOFTENED mask —
            // the raw confidence mask has block edges and its gradient is noise
            float gx = texture(uSoft, vUv + vec2(uTexel.x, 0.0)).r -
                       texture(uSoft, vUv - vec2(uTexel.x, 0.0)).r;
            float gy = texture(uSoft, vUv + vec2(0.0, uTexel.y)).r -
                       texture(uSoft, vUv - vec2(0.0, uTexel.y)).r;
            vec2 nrm = -normalize(vec2(gx, gy) + vec2(1e-6));
            // uv.y grows upward here (P0 uploads the video upright), so a
            // surface facing the sky has a normal with POSITIVE y
            float faceUp = clamp(nrm.y, 0.0, 1.0);
            faceUp = pow(faceUp, 0.75);

            // 庇の下は濡れない: march up and see whether a body is in the way
            float shelter = 0.0;
            for (int k = 1; k <= 10; k++) {
              float up = float(k) * 4.0 * uTexel.y;
              shelter = max(shelter, texture(uSoft, vUv + vec2(0.0, up)).r *
                (1.0 - float(k) / 12.0));
            }
            float sky = 1.0 - smoothstep(0.20, 0.70, shelter);

            // the rain only wets what it can reach
            float gain = uRainAmt * body * faceUp * sky;
            // a little unevenness so the wet edge is not a clean band
            gain *= 0.70 + 0.60 * vnoise(vUv * vec2(uAspect, 1.0) * 26.0);
            gain *= 1.65;

            float wet = uReset == 1 ? 0.0 : prev.r;
            float floor0 = uReset == 1 ? 0.0 : prev.g;
            wet += uDt * gain * 1.35;

            // Gravity. This carries the whole invariant: the wetting SITE is a
            // thin band on the upward-facing contour (a silhouette has no other
            // 3D information), so unless the water actually runs down the body
            // the wetness covers about 1% of the figure and cannot be read at
            // all — which is exactly what happened at 1.1.
            float above = texture(uPrev, vUv + vec2(0.0, uTexel.y * 3.4)).r;
            float bodyAbove = texture(uSoft, vUv + vec2(0.0, uTexel.y * 3.4)).r;
            wet += uDt * 3.4 * max(above - wet, 0.0) * bodyAbove * body;

            // sideways spread is tiny — silk floss wicks, it does not flow
            float lr = texture(uPrev, vUv + vec2(uTexel.x * 1.6, 0.0)).r +
                       texture(uPrev, vUv - vec2(uTexel.x * 1.6, 0.0)).r;
            wet += uDt * 0.22 * (lr * 0.5 - wet) * body;

            // 確かな誇り: the floor rises with what has arrived and saturates.
            // Bounded on purpose — an unbounded floor would slowly whiten the
            // whole figure and the longrun check would (rightly) fail.
            float cap = 0.20 + 0.55 * uSoak;
            floor0 += uDt * 0.055 * uSoak * max(wet - floor0, 0.0);
            floor0 = min(floor0, cap);
            // off the body there is nothing to hold water
            floor0 *= smoothstep(0.05, 0.35, body);

            // drying back to the floor
            float dry = mix(0.30, 0.055, uSoak);
            wet += (floor0 - wet) * (1.0 - exp(-uDt * dry));
            wet = clamp(wet, 0.0, 1.0);
            wet *= smoothstep(0.02, 0.30, body);

            // ---- 声の光. The voice does not fall from anywhere: it RISES in
            // the body that is singing. It fills from within, breathes with the
            // held voice, spills a little upward past the crown, and it fades
            // slowly — light is the piece's good weather, and weather does not
            // flinch at a syllable. Bounded: source is capped, decay is
            // proportional, so longrun cannot blow it up.
            float glow = uReset == 1 ? 0.0 : prev.b;
            // the light wells up from the MIDDLE of the body (the chest, as far
            // as a silhouette can know one): deep inside the mask, weighted low
            float depth = smoothstep(0.35, 0.95, soft);
            glow += uDt * uGlowAmt * uVoice * depth * 0.85;
            // it rises: each cell also receives from the cell below, so a long
            // note climbs from the chest into the shoulders and the head
            float below = texture(uPrev, vUv - vec2(0.0, uTexel.y * 2.6)).b;
            float bodyBelow = texture(uSoft, vUv - vec2(0.0, uTexel.y * 2.6)).r;
            glow += uDt * 1.6 * max(below - glow, 0.0) * bodyBelow *
              smoothstep(0.04, 0.30, soft);
            glow -= uDt * glow * 0.30;
            glow = clamp(glow, 0.0, 1.5);

            vec2 run = vec2(0.0, -1.0) * wet;
            fragColor = vec4(wet, clamp(floor0, 0.0, 1.0), glow, 1.0);
          }
        `;

        // P4 — the RAIN. 「ああ愛とは 何も語らず 静かに そっと肩にかかる雨」
        //
        // The rain is the SILENCE of the piece: it falls when nobody sings, and
        // as the body fills with light the weather clears and the rain thins
        // out. It is drawn — thin slanted streaks, the way night rain shows
        // against a dark room — and where a drop meets the body it flares
        // faintly and wets the floss. (An earlier version kept the drops
        // invisible in flight on principle, and the principle cost the picture
        // everything: there was no rain to see.)
        const rainFS = `#version 300 es
          precision highp float;
          layout(location = 0) out vec4 outA;
          layout(location = 1) out vec4 outB;
          uniform sampler2D uStateA;
          uniform sampler2D uStateB;
          uniform sampler2D uMask;
          uniform float uTexW;
          uniform float uDt;
          uniform float uTime;
          uniform float uSeed;
          uniform float uAspect;
          uniform float uRainAmt;    // the weather (0 = clear sky, 1 = full rain)
          uniform float uWind;
          uniform vec4 uAudA;        // rms, centroid, steadiness, onset
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          void main() {
            ivec2 tc = ivec2(gl_FragCoord.xy);
            float idx = float(tc.y) * uTexW + float(tc.x);
            vec4 A = texture(uStateA, gl_FragCoord.xy / vec2(textureSize(uStateA, 0)));
            vec4 B = texture(uStateB, gl_FragCoord.xy / vec2(textureSize(uStateB, 0)));
            if (uDt <= 0.0) { outA = A; outB = B; return; }
            vec2 pos = A.xy;
            vec2 vel = decV(A.zw);
            float age = B.x;      // >= 1 = dormant; 0..1 falling; < 0 = flaring
            float size = B.y;
            float seed = B.z;
            float depth = B.w;    // 0 near … 1 far (parallax layer of this drop)

            float wind = (0.10 + 0.55 * uWind) *
              (0.6 + 0.5 * sin(uTime * 0.21 + seed * 5.0));

            if (age >= 0.999) {
              // the spawn rate IS the weather
              float rate = (1.2 + 30.0 * uRainAmt) * uDt / 64.0;
              if (hash12(vec2(idx * 1.93, uSeed * 0.71)) < rate) {
                seed = hash12(vec2(idx * 13.1, uSeed * 6.7));
                depth = hash12(vec2(idx * 3.7, uSeed * 1.9));
                pos = vec2(hash12(vec2(idx * 4.17, uSeed * 3.31)) * 1.5 - 0.25, 1.08);
                // far drops fall slower on screen (they are further away)
                float fall = mix(1.15, 0.55, depth);
                vel = vec2(wind * 0.30, -fall * (0.85 + 0.30 * hash12(vec2(seed * 7.0, 2.0))));
                age = 0.001;
                size = 0.0055 + 0.0075 * hash12(vec2(seed * 21.0, 3.3));
              }
            } else if (age < 0.0) {
              // flaring: a contact lasts a fraction of a second and is over
              age += uDt * 5.5;
              if (age >= 0.0) age = 1.0;
            } else {
              vel.x += (wind * mix(1.3, 0.6, depth) - vel.x) * min(1.0, uDt * 2.2);
              pos += vel * uDt / vec2(uAspect, 1.0);
              age += uDt * 0.16;
              // contact: only the NEAR drops can reach the person
              float body = texture(uMask, clamp(pos, 0.0, 1.0)).r;
              if (depth < 0.45 && body > 0.55) {
                age = -0.55;                  // begin the flare, stop moving
                vel = vec2(0.0);
              } else if (pos.y < -0.06 || pos.x < -0.25 || pos.x > 1.25 || age >= 1.0) {
                age = 1.0;
              }
            }
            outA = vec4(pos, encV(vel));
            outB = vec4(age, size, seed, depth);
          }
        `;

        // P5a — 真綿の綿毛. 「あの夏の日 風に吹かれ」「真綿のように生きて居る」
        //
        // Tufts of silk floss adrift in the room's air: buoyant, unhurried,
        // combed along by the wind, never falling. They are the abstract
        // register of the piece — the body itself stays REAL (the 2026-07-28
        // correction: the simile describes how someone lives, it does not
        // wrap them in cloth). In the clear weather they catch the body's
        // light and the air itself becomes the 光の庭.
        const wispFS = `#version 300 es
          precision highp float;
          layout(location = 0) out vec4 outA;
          layout(location = 1) out vec4 outB;
          uniform sampler2D uStateA;
          uniform sampler2D uStateB;
          uniform float uTexW;
          uniform float uDt;
          uniform float uTime;
          uniform float uSeed;
          uniform float uAspect;
          uniform float uWisp;
          uniform float uWind;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          void main() {
            ivec2 tc = ivec2(gl_FragCoord.xy);
            float idx = float(tc.y) * uTexW + float(tc.x);
            vec4 A = texture(uStateA, gl_FragCoord.xy / vec2(textureSize(uStateA, 0)));
            vec4 B = texture(uStateB, gl_FragCoord.xy / vec2(textureSize(uStateB, 0)));
            if (uDt <= 0.0) { outA = A; outB = B; return; }
            vec2 pos = A.xy;
            vec2 vel = decV(A.zw);
            float age = B.x;
            float size = B.y;
            float seed = B.z;
            float phase = B.w;

            if (age >= 0.999) {
              float rate = (0.35 + 2.6 * uWisp) * uDt / 24.0;
              if (hash12(vec2(idx * 1.93, uSeed * 0.71)) < rate) {
                seed = hash12(vec2(idx * 13.1, uSeed * 6.7));
                // most fade in anywhere in the air; some drift in from windward.
                // Spawning ONLY at the edge piled them up along one side.
                float fromEdge = step(0.78, hash12(vec2(idx * 9.3, uSeed)));
                pos = mix(
                  hash22(vec2(idx * 4.17, uSeed * 3.31)) * vec2(1.1, 1.05) - 0.03,
                  vec2(-0.10, hash12(vec2(idx * 4.17, uSeed * 3.31)) * 1.05),
                  fromEdge);
                vel = vec2(0.02, 0.0);
                age = 0.001;
                size = 0.006 + 0.011 * pow(hash12(vec2(seed * 21.0, 3.3)), 1.6);
                phase = hash12(vec2(seed * 31.0, 7.7));
              }
            } else {
              // buoyant: it rides the wind, wanders on curl noise, and BREATHES
              // up and down instead of falling — floss holds air
              float wind = (0.035 + 0.085 * uWind) *
                (0.75 + 0.35 * sin(uTime * 0.17 + seed * 6.28));
              vec2 drift = curlN(pos * vec2(uAspect, 1.0) * 1.9 + seed * 13.0);
              vec2 want = vec2(wind, 0.012 * sin(uTime * 0.5 + phase * 6.28))
                + drift * 0.020;
              vel += (want - vel) * min(1.0, uDt * 0.8);
              pos += vel * uDt / vec2(uAspect, 1.0);
              // a long, gentle life; it dissolves before it gets anywhere fast
              age += uDt / (16.0 + 14.0 * hash12(vec2(seed * 3.3, 1.7)));
              if (pos.x > 1.15 || pos.y < -0.10 || pos.y > 1.12 || age >= 1.0) age = 1.0;
            }
            outA = vec4(pos, encV(vel));
            outB = vec4(clamp(age, 0.0, 1.0), size, seed, phase);
          }
        `;

        const wispDrawVS = `#version 300 es
          precision highp float;
          uniform sampler2D uStateA;
          uniform sampler2D uStateB;
          uniform float uTexW;
          uniform float uAspect;
          uniform float uTime;
          out vec2 vLocal;
          out vec4 vAttr;   // age, seed, phase, tumble
          ${CHUNK_ENC}
          ${CHUNK_NOISE}
          const vec2 QUAD[6] = vec2[6](
            vec2(-1.0, -1.0), vec2(1.0, -1.0), vec2(-1.0, 1.0),
            vec2(-1.0,  1.0), vec2(1.0, -1.0), vec2( 1.0, 1.0)
          );
          void main() {
            vLocal = vec2(0.0);
            vAttr = vec4(0.0);
            int i = gl_InstanceID;
            int tw = int(uTexW);
            ivec2 tc = ivec2(i % tw, i / tw);
            vec4 A = texelFetch(uStateA, tc, 0);
            vec4 B = texelFetch(uStateB, tc, 0);
            if (B.x >= 0.999) { gl_Position = vec4(3.0, 3.0, 0.0, 1.0); return; }
            vec2 q = QUAD[gl_VertexID];
            vLocal = q;
            // a slow tumble, different for every tuft
            float tum = uTime * (0.10 + 0.22 * B.z) + B.w * 6.28;
            vAttr = vec4(B.x, B.z, B.w, tum);
            float cr = cos(tum), sr = sin(tum);
            vec2 rq = vec2(q.x * cr - q.y * sr, q.x * sr + q.y * cr);
            // much wider than tall: a combed tuft trailing on the wind
            vec2 P = A.xy * vec2(uAspect, 1.0) + rq * B.y * vec2(2.6, 0.8);
            gl_Position = vec4(vec2(P.x / uAspect, P.y) * 2.0 - 1.0, 0.0, 1.0);
          }
        `;

        const wispDrawFS = `#version 300 es
          precision highp float;
          in vec2 vLocal;
          in vec4 vAttr;
          out vec4 fragColor;
          uniform float uShine;
          ${CHUNK_NOISE}
          ${CHUNK_PALETTE}
          void main() {
            float age = vAttr.x;
            float seed = vAttr.y;
            vec2 p = vLocal;
            float r = length(p);
            if (r > 1.0) discard;
            // a BREATH, not a splat: a soft elongated core, faint fibre streaks
            // riding along it, and an edge that dissolves. The first version had
            // hard lace at the rim and read as flicked paint.
            float streak = fbm(vec2(p.x * 2.2 + seed * 19.0, p.y * 7.0 + seed * 7.0));
            float body = (1.0 - smoothstep(0.05, 1.0, r)) *
              (0.55 + 0.45 * streak);
            float fade = smoothstep(0.0, 0.20, age) * (1.0 - smoothstep(0.55, 1.0, age));
            float a = clamp(body * 0.16, 0.0, 1.0) * fade;
            if (a <= 0.004) discard;
            // dim silk in the rain; in the clear weather it catches the light
            vec3 col = FLOSS_DRY * (0.40 + 0.45 * uShine);
            col += vec3(1.00, 0.93, 0.80) * 0.16 * uShine * (1.0 - r);
            fragColor = vec4(col * a, a);
          }
        `;

        // P5b — the rain, drawn. A falling drop is a thin streak along its own
        // velocity — night rain reads as short slanted lines, nothing else. A
        // drop that has met the body is a brief soft flare. Far drops are
        // dimmer and shorter: three cheap parallax layers out of one pool.
        const rainDrawVS = `#version 300 es
          precision highp float;
          uniform sampler2D uStateA;
          uniform sampler2D uStateB;
          uniform float uTexW;
          uniform float uAspect;
          out vec2 vLocal;
          out vec4 vAttr;   // kind(0 streak / 1 flare), phase, seed, depth
          ${CHUNK_ENC}
          const vec2 QUAD[6] = vec2[6](
            vec2(-1.0, -1.0), vec2(1.0, -1.0), vec2(-1.0, 1.0),
            vec2(-1.0,  1.0), vec2(1.0, -1.0), vec2( 1.0, 1.0)
          );
          void main() {
            vLocal = vec2(0.0);
            vAttr = vec4(0.0);
            int i = gl_InstanceID;
            int tw = int(uTexW);
            ivec2 tc = ivec2(i % tw, i / tw);
            vec4 A = texelFetch(uStateA, tc, 0);
            vec4 B = texelFetch(uStateB, tc, 0);
            if (B.x >= 0.999) { gl_Position = vec4(3.0, 3.0, 0.0, 1.0); return; }
            vec2 q = QUAD[gl_VertexID];
            vLocal = q;
            vec2 P;
            if (B.x < 0.0) {
              // contact flare
              float ph = clamp(1.0 + B.x / 0.55, 0.0, 1.0);
              vAttr = vec4(1.0, ph, B.z, B.w);
              float r = B.y * (0.9 + 1.3 * ph);
              P = A.xy * vec2(uAspect, 1.0) + q * r;
            } else {
              // falling streak, stretched along the velocity
              vec2 vel = decV(A.zw);
              vec2 dir = normalize(vel + vec2(1e-5));
              vec2 perp = vec2(-dir.y, dir.x);
              float len = (0.030 + 0.055 * length(vel)) * mix(1.0, 0.45, B.w);
              float wid = B.y * mix(0.55, 0.30, B.w);
              vAttr = vec4(0.0, B.x, B.z, B.w);
              P = A.xy * vec2(uAspect, 1.0) + dir * q.x * len + perp * q.y * wid;
            }
            gl_Position = vec4(vec2(P.x / uAspect, P.y) * 2.0 - 1.0, 0.0, 1.0);
          }
        `;

        const rainDrawFS = `#version 300 es
          precision highp float;
          in vec2 vLocal;
          in vec4 vAttr;
          out vec4 fragColor;
          ${CHUNK_NOISE}
          ${CHUNK_PALETTE}
          void main() {
            float kind = vAttr.x;
            float ph = vAttr.y;
            float depth = vAttr.w;
            vec2 p = vLocal;
            if (kind > 0.5) {
              // the flare where the rain met the body
              float r = length(p);
              if (r > 1.0) discard;
              float core = (1.0 - smoothstep(0.0, 0.62, r)) * (1.0 - ph * 0.85);
              float ring = (1.0 - smoothstep(0.06, 0.30, abs(r - (0.40 + 0.55 * ph)))) *
                (1.0 - ph) * 0.70;
              float a = clamp(core * 0.95 + ring * 0.55, 0.0, 1.0);
              if (a <= 0.004) discard;
              vec3 col = VOICE * (0.95 + 0.75 * (1.0 - ph));
              fragColor = vec4(col * a, a);
            } else {
              // a falling streak: brightest in the middle of its length, hair
              // thin, and FAINT — the rain must read in sum, not per drop
              float along = 1.0 - abs(p.x);
              float across = 1.0 - smoothstep(0.35, 1.0, abs(p.y));
              float a = along * along * across * mix(0.30, 0.10, depth);
              if (a <= 0.004) discard;
              vec3 col = vec3(0.62, 0.68, 0.80) * mix(1.0, 0.6, depth);
              fragColor = vec4(col * a, a);
            }
          }
        `;

        // P5c — the LIGHT, into the layer. The voice risen in the body, drawn
        // emissive (rgb written above alpha) so the bloom pass builds the halo:
        // the light has to LEAVE the body a little, or it reads as a brightness
        // setting instead of as a thing the body is doing. Modulated by the
        // same fibre direction the surface uses, so the silk glows as strands.
        const glowFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uWet;
          uniform sampler2D uSoft;
          uniform sampler2D uScene;
          uniform float uAspect;
          uniform float uGlowAmt;
          ${CHUNK_NOISE}
          ${CHUNK_PALETTE}
          void main() {
            float glow = texture(uWet, vUv).b * uGlowAmt;
            float soft = texture(uSoft, vUv).r;
            if (glow * soft <= 0.004) discard;
            // modulated by the person's OWN image, so the light rides their
            // real form — bright skin and folds carry it, shadow keeps it —
            // instead of turning the figure into one white blob (§A1)
            float rl = lumaf(texture(uScene, vUv).rgb);
            float carry = 0.30 + 1.10 * pow(clamp(rl, 0.0, 1.0), 0.80);
            vec3 lampCol = vec3(1.00, 0.93, 0.80);
            float g = glow * smoothstep(0.10, 0.70, soft) * carry;
            // rgb above alpha: this is what feeds the bloom
            fragColor = vec4(lampCol * g * 1.20, clamp(g * 0.26, 0.0, 1.0));
          }
        `;

        const brightFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uSrc;
          void main() {
            vec3 c = texture(uSrc, vUv).rgb;
            float l = dot(c, vec3(0.299, 0.587, 0.114));
            // only the genuinely emissive parts (stamens, the hottest petal
            // flanks — the ones written above 1.0) are allowed to glow. A low
            // threshold makes every petal halo and the field reads as sparkles.
            fragColor = vec4(c * smoothstep(0.55, 1.30, l), 1.0);
          }
        `;

        // P7 — composite. EVERYTHING real stays real (the 2026-07-28
        // correction, same as 花): the room AND the person are the camera,
        // graded to night. The person is NOT covered — 「真綿のように」 is a
        // simile for how someone lives, so the floss drifts in the air instead.
        // Over the real night: slow clouds of longing (雲に焦がれ), the rain of
        // silence, the wisps on the wind, and the light the singing body makes.
        const compositeFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform sampler2D uMask;
          uniform sampler2D uSoft;
          uniform sampler2D uWet;   // R=濡れ G=誇りの床 B=声の光
          uniform sampler2D uLayer;
          uniform sampler2D uB1;
          uniform sampler2D uB2;
          uniform vec2 uResolution;
          uniform float uAspect;
          uniform float uTime;
          uniform float uExposure;
          uniform float uFilmGrain;
          uniform sampler2D uWide;
          uniform vec2 uCenter;
          uniform float uGlowAmt;
          uniform float uRays;
          uniform float uShine;
          uniform float uPresent;
          uniform vec4 uAudA;   // rms, centroid, steadiness, onset
          uniform vec4 uAudB;   // sustain, pitch, vibrato, arc
          uniform int uDebug;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_PALETTE}
          void main() {
            vec2 ar = vec2(uAspect, 1.0);
            vec3 room = texture(uScene, vUv).rgb;
            vec4 mk = texture(uMask, vUv);
            float soft = texture(uSoft, vUv).r;
            vec4 wt = texture(uWet, vUv);
            vec4 L = texture(uLayer, vUv);

            // ---- the room, at night. Real, just turned down and drained.
            float rl = lumaf(room);
            vec3 night = NIGHT + vec3(pow(clamp(rl, 0.0, 1.0), 1.25)) * 0.62;
            night = mix(night, room * 0.42, 0.28);
            vec3 col = night;

            // ---- the person stays REAL. At night they would sink into the
            // dark with the room, so the mask only LIFTS them gently — more of
            // the camera's own light survives inside the figure, which is what
            // keeps them a person and not a silhouette.
            float bodyIn = smoothstep(0.25, 0.75, soft);
            vec3 person = NIGHT + vec3(pow(clamp(rl, 0.0, 1.0), 1.02)) * 0.86;
            person = mix(person, room * 0.80, 0.42);
            col = mix(col, person, bodyIn);

            // ---- the rain that reached them stays on them: wet cloth and hair
            // go darker and lose their colour, from the shoulders down. This is
            // the one place the weather touches the person's own image.
            float w = smoothstep(0.05, 0.95, wt.r);
            vec3 wetCol = mix(col, vec3(lumaf(col)) * 0.62, 0.75);
            col = mix(col, wetCol, w * bodyIn * 0.85);

            // ---- 雲に焦がれ. Slow abstract clouds adrift over the dark room —
            // never over the person. They belong to the rain's weather and thin
            // away as the singing clears the sky. Drift is on the (freezable)
            // art clock; the forms are fbm, so nothing about them is a photo.
            vec2 cw = vUv * ar * 2.1 + vec2(uTime * 0.014, uTime * 0.004);
            float cl = fbm(cw + fbm(cw * 1.7) * 0.55);
            float cloudAmt = (1.0 - uShine * 0.85) * (1.0 - bodyIn);
            float cband = smoothstep(0.35, 0.85, cl) * smoothstep(-0.1, 0.65, vUv.y);
            col = mix(col, vec3(0.30, 0.33, 0.40) * (0.5 + 0.5 * cl),
              cband * cloudAmt * 0.30);
            col *= 1.0 - 0.18 * (1.0 - cband) * cloudAmt * smoothstep(0.5, 1.0, vUv.y);

            // ---- 声の光. The voice risen in the body lights the person from
            // within: modulated by the CAMERA's own luminance, so it follows
            // their real form (face, folds, hands) instead of painting a flat
            // wash over them.
            float glow = wt.b * uGlowAmt;
            vec3 lampCol = vec3(1.00, 0.94, 0.82);
            float lamp = glow * (0.40 + 0.90 * pow(clamp(rl, 0.0, 1.0), 0.75));
            col += lampCol * lamp * 0.26 * bodyIn;

            // ---- the floss layer (premultiplied over)
            col = col * (1.0 - clamp(L.a, 0.0, 1.0)) + L.rgb;

            // ---- bloom: the lit body and the rain flares reach it, so the
            // halo around the figure IS the voice — 光の庭
            vec3 b = texture(uB1, vUv).rgb * 0.50 + texture(uB2, vUv).rgb * 0.85;
            col += b * 0.95;

            float shine = clamp(uShine, 0.0, 1.0);

            // ---- 後光. Light shafts streaming out of the body.
            // No centroid is needed: the gradient of the WIDE mask halo points
            // at the body from every direction around it, so marching toward it
            // and smearing the bloom back outward gives rays that leave the
            // real silhouette — from the shoulders, the head, the arms.
            float outside = 1.0 - smoothstep(0.10, 0.55, soft);
            // confined to the halo around the body. Unbounded, the shafts
            // reached the corners and washed the whole night out.
            float near = smoothstep(0.010, 0.22, texture(uWide, vUv).r);
            float rayAmt = uRays * smoothstep(0.04, 0.55, shine) * outside * near *
              smoothstep(0.15, 0.55, uPresent);
            if (rayAmt > 0.002) {
              // Radiating from the body's CENTROID. Striping by the local mask
              // gradient instead made the shafts follow the contour and read as
              // watery ripples — a halo has to be indexed by one global angle
              // or it is not a halo.
              vec2 d = (vUv - uCenter) * ar;
              vec2 toBody = -normalize(d + vec2(1e-6));
              float ang = atan(d.y, d.x);
              // sharpened: a soft fbm reads as a blur, a peaked one as shafts
              float sn = fbm(vec2(ang * 6.0, uTime * 0.04));
              float stri = 0.14 + 2.20 * pow(clamp(sn, 0.0, 1.0), 2.2);
              // Marched over the LIGHT FIELD itself, not over the bloom
              // texture: sourcing the shafts from the bloom made them vanish
              // whenever the bloom or 声の光 was tuned down, so they were never
              // their own thing. This reads the glow the body actually holds.
              float shaftE = 0.0;
              float wsum = 0.0;
              for (int i = 1; i <= 16; i++) {
                float t = float(i) / 16.0;
                vec2 sp = clamp(vUv + toBody * t * 0.24, 0.0, 1.0);
                float w = 1.0 - t * 0.85;
                shaftE += texture(uWet, sp).b *
                  smoothstep(0.25, 0.75, texture(uSoft, sp).r) * w;
                wsum += w;
              }
              shaftE /= max(wsum, 1e-4);
              col += vec3(1.05, 0.96, 0.80) * shaftE * rayAmt * stri * 2.2;
            }

            // ---- the rim of the body blazes: the edge is where a lit body
            // most obviously stops being lit FROM outside and starts being lit
            // from within
            float rimBand = smoothstep(0.20, 0.55, soft) * (1.0 - smoothstep(0.55, 0.92, soft));
            col += vec3(1.00, 0.92, 0.76) * rimBand * wt.b * uGlowAmt * 0.95;

            // the room itself lifts as the weather clears
            col += vec3(0.075, 0.068, 0.055) * shine * (1.0 - smoothstep(0.18, 0.80, soft));

            // ---- 確かな誇り。「今 私の胸のうちに息衝くのは 確かな誇り」
            // The floor of the wetness — the part that will not dry — carries a
            // faint warmth. It does not flicker with the voice: it holds.
            float pride = smoothstep(0.06, 0.42, wt.g);
            col += (PRIDE - col) * pride * 0.16;

            // ---- tone. Shouldered, so the contacts bloom without clipping.
            col = clamp(col * uExposure, 0.0, 6.0);
            col = col / (1.0 + col * 0.72);
            col = (col - 0.5) * 1.06 + 0.5;
            // vignette
            vec2 d = (vUv - 0.5) * ar;
            col *= 1.0 - 0.30 * smoothstep(0.32, 0.92, length(d));
            // static grain (position-seeded, so ?freeze=1 does not flicker)
            float gr = hash12(floor(vUv * uResolution / 1.5)) - 0.5;
            col += gr * uFilmGrain * 0.055;

            if (uDebug == 1) {
              vec2 texel = vec2(1.0) / vec2(textureSize(uSoft, 0));
              float gx = texture(uSoft, vUv + vec2(texel.x, 0.0)).r -
                         texture(uSoft, vUv - vec2(texel.x, 0.0)).r;
              float gy = texture(uSoft, vUv + vec2(0.0, texel.y)).r -
                         texture(uSoft, vUv - vec2(0.0, texel.y)).r;
              vec2 nrm = -normalize(vec2(gx, gy) + vec2(1e-6));
              col = vec3(mk.r, clamp(nrm.y, 0.0, 1.0), soft);
            } else if (uDebug == 2) {
              col = vec3(wt.r, wt.g, wt.b);   // R=濡れ G=床 B=光
            } else if (uDebug == 3) {
              float vals[6];
              vals[0] = uAudA.x;   // 音量
              vals[1] = uAudA.z;   // 安定度
              vals[2] = uShine;    // 光(=天候。増えるほど雨が上がる)
              vals[3] = uAudB.x;   // 持続
              vals[4] = uAudA.y;   // 声色
              vals[5] = uAudA.w;   // アタック
              col = vec3(0.03, 0.035, 0.05);
              for (int i = 0; i < 6; i++) {
                float y0 = 0.14 + 0.115 * float(i);
                float band = 1.0 - smoothstep(0.030, 0.038, abs(vUv.y - y0));
                float fill = step(vUv.x, 0.08 + 0.84 * clamp(vals[i], 0.0, 1.0));
                col = mix(col, i == 2 ? VOICE : vec3(0.72, 0.76, 0.84),
                  band * fill * 0.95);
                col = mix(col, vec3(0.16), band * (1.0 - fill) * 0.6);
              }
            } else if (uDebug == 4) {
              col = L.rgb + vec3(0.08) * clamp(L.a, 0.0, 1.0);
            } else if (uDebug == 5) {
              float row = floor(vUv.y * 3.0);
              col = row < 1.0 ? mix(NIGHT, vec3(0.86), vUv.x)
                : (row < 2.0 ? mix(FLOSS_WET, FLOSS_DRY, vUv.x)
                : mix(NIGHT, VOICE, vUv.x));
            }
            col = min(col, vec3(0.985));
            fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
          }
        `;

        /* ------------------------------------------------------------------
           Program / target plumbing
        ------------------------------------------------------------------ */

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(`Shader compile failed: ${gl.getShaderInfoLog(shader)}`);
          }
          return shader;
        }
        function createProgramVS(vsSource, fsSource) {
          const program = gl.createProgram();
          gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
          gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(`Program link failed: ${gl.getProgramInfoLog(program)}`);
          }
          return program;
        }
        function createProgram(fsSource) {
          return createProgramVS(fullscreenVS, fsSource);
        }
        function getLocations(program, names) {
          const out = {};
          names.forEach((name) => {
            out[name] = gl.getUniformLocation(program, name);
          });
          return out;
        }

        const programs = {
          scene: createProgram(sceneFS),
          mask: createProgram(maskFS),
          blur: createProgram(blurFS),
          wet: createProgram(wetFS),
          rain: createProgram(rainFS),
          wisp: createProgram(wispFS),
          wispDraw: createProgramVS(wispDrawVS, wispDrawFS),
          rainDraw: createProgramVS(rainDrawVS, rainDrawFS),
          glow: createProgram(glowFS),
          bright: createProgram(brightFS),
          composite: createProgram(compositeFS),
        };

        const locations = {
          scene: getLocations(programs.scene, [
            "uVideo", "uResolution", "uVideoSize", "uAspect", "uCx", "uCy",
            "uSwing", "uScale", "uMirror", "uFake", "uHasVideo",
          ]),
          mask: getLocations(programs.mask, [
            "uScene", "uScenePrev", "uPrev", "uSeg", "uTexel", "uSegScale",
            "uAspect", "uCx", "uCy", "uSwing", "uScale", "uDt", "uAlphaFast",
            "uAlphaSlow", "uAlphaMot", "uReset", "uSource", "uMirror",
          ]),
          blur: getLocations(programs.blur, ["uSrc", "uDir", "uSigma"]),
          wet: getLocations(programs.wet, [
            "uPrev", "uMask", "uSoft", "uTexel", "uDt", "uAspect",
            "uSoak", "uRainAmt", "uVoice", "uGlowAmt", "uReset",
          ]),
          rain: getLocations(programs.rain, [
            "uStateA", "uStateB", "uMask", "uTexW", "uDt", "uTime", "uSeed",
            "uAspect", "uRainAmt", "uWind", "uAudA",
          ]),
          wisp: getLocations(programs.wisp, [
            "uStateA", "uStateB", "uTexW", "uDt", "uTime", "uSeed", "uAspect",
            "uWisp", "uWind",
          ]),
          wispDraw: getLocations(programs.wispDraw, [
            "uStateA", "uStateB", "uTexW", "uAspect", "uTime", "uShine",
          ]),
          rainDraw: getLocations(programs.rainDraw, [
            "uStateA", "uStateB", "uTexW", "uAspect",
          ]),
          glow: getLocations(programs.glow, [
            "uWet", "uSoft", "uScene", "uAspect", "uGlowAmt",
          ]),
          bright: getLocations(programs.bright, ["uSrc"]),
          composite: getLocations(programs.composite, [
            "uScene", "uMask", "uSoft", "uWide", "uWet", "uLayer", "uB1", "uB2",
            "uResolution", "uAspect", "uTime", "uExposure",
            "uCenter", "uGlowAmt", "uRays", "uShine",
            "uFilmGrain", "uPresent", "uAudA", "uAudB", "uDebug",
          ]),
        };

        function createTexture(width, height, internal, format, type, filter) {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          const f = filter || gl.LINEAR;
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(gl.TEXTURE_2D, 0, internal, width, height, 0, format, type, null);
          return tex;
        }
        function createTarget(width, height, useFloat) {
          const internal = useFloat && floatExt ? gl.RGBA16F : gl.RGBA8;
          const type = useFloat && floatExt ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
          const tex = createTexture(width, height, internal, gl.RGBA, type, gl.LINEAR);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return { tex, fbo, width, height };
        }
        // A ping-pong-able STATE set: two data textures (NEAREST — pure state,
        // read with texelFetch) sharing one MRT framebuffer.
        function createStateSet(width, height) {
          const internal = floatExt ? gl.RGBA16F : gl.RGBA8;
          const type = floatExt ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
          const texA = createTexture(width, height, internal, gl.RGBA, type, gl.NEAREST);
          const texB = createTexture(width, height, internal, gl.RGBA, type, gl.NEAREST);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texA, 0);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, texB, 0);
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return { texA, texB, fbo, width, height };
        }
        function destroyTarget(target) {
          if (!target) return;
          if (target.tex) gl.deleteTexture(target.tex);
          gl.deleteFramebuffer(target.fbo);
        }
        function clearTarget(target, r, g, b, a) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
          gl.viewport(0, 0, target.width, target.height);
          gl.clearColor(r, g, b, a);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }

        // Empty VAO for attributeless draws (fullscreen tri + instanced quads).
        const vao = gl.createVertexArray();

        // Rain + wisp state ping-pong (allocated once; canvas-size independent).
        const rainSets = [
          createStateSet(RAIN_W, RAIN_H),
          createStateSet(RAIN_W, RAIN_H),
        ];
        const wispSets = [
          createStateSet(WISP_W, WISP_H),
          createStateSet(WISP_W, WISP_H),
        ];
        let rainPing = false;
        let wispPing = false;
        let wetPing = false;

        // Video texture (DOM source → UNPACK_FLIP_Y). The segmentation texture is
        // a plain R8 upload from MediaPipe (image space, no flip on upload).
        const videoTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

        const segTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, segTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        // 8 bytes, not 4: R8 rows are padded to UNPACK_ALIGNMENT (4) so a 2x2
        // upload needs 4 bytes per row
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 2, 2, 0, gl.RED, gl.UNSIGNED_BYTE,
          new Uint8Array(8));
        let segSize = [2, 2];

        let targets = null;
        let paintW = 2, paintH = 2, fieldW = 2, fieldH = 2, glowW = 2, glowH = 2;
        let needsReset = true;

        function rebuildTargets() {
          if (targets) Object.values(targets).forEach(destroyTarget);
          const b1W = Math.max(4, Math.round(glowW / 2));
          const b1H = Math.max(4, Math.round(glowH / 2));
          const b2W = Math.max(4, Math.round(glowW / 4));
          const b2H = Math.max(4, Math.round(glowH / 4));
          targets = {
            sceneA: createTarget(paintW, paintH, false),
            sceneB: createTarget(paintW, paintH, false),
            maskA: createTarget(fieldW, fieldH, true),
            maskB: createTarget(fieldW, fieldH, true),
            softT: createTarget(fieldW, fieldH, true),
            softTmp: createTarget(fieldW, fieldH, true),
            wideT: createTarget(fieldW, fieldH, true),
            wideTmp: createTarget(fieldW, fieldH, true),
            wetA: createTarget(fieldW, fieldH, true),
            wetB: createTarget(fieldW, fieldH, true),
            layer: createTarget(paintW, paintH, true),
            b1Src: createTarget(b1W, b1H, true),
            b1Tmp: createTarget(b1W, b1H, true),
            b1: createTarget(b1W, b1H, true),
            b2Tmp: createTarget(b2W, b2H, true),
            b2: createTarget(b2W, b2H, true),
          };
          needsReset = true;
        }

        // Encoded targets must clear to encoded zero (0.5) for the flow channel.
        // The plant / petal pools clear to DORMANT (wilt = 1, ageF = 1).
        function clearSimTargets() {
          clearTarget(targets.sceneA, 0.22, 0.22, 0.25, 1);
          clearTarget(targets.sceneB, 0.22, 0.22, 0.25, 1);
          clearTarget(targets.maskA, 0, 0, 0.5, 0.5);
          clearTarget(targets.maskB, 0, 0, 0.5, 0.5);
          clearTarget(targets.softT, 0, 0, 0.5, 0.5);
          clearTarget(targets.softTmp, 0, 0, 0.5, 0.5);
          clearTarget(targets.wideT, 0, 0, 0.5, 0.5);
          clearTarget(targets.wideTmp, 0, 0, 0.5, 0.5);
          clearTarget(targets.wetA, 0, 0, 0, 1);
          clearTarget(targets.wetB, 0, 0, 0, 1);
          clearTarget(targets.layer, 0, 0, 0, 0);
          clearTarget(targets.b1Src, 0, 0, 0, 1);
          clearTarget(targets.b1, 0, 0, 0, 1);
          clearTarget(targets.b2, 0, 0, 0, 1);
        }

        // Dormant pools. attachment 0 (A) = (root/pos, stage/vel), attachment 1
        // (B) = (seed, hue, ...). wilt / ageF live in A.w / B.x respectively, so
        // the two attachments need DIFFERENT clear values → clear them one at a
        // time with drawBuffers masking.
        function clearStateSet(set, aClear, bClear) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, set.fbo);
          gl.viewport(0, 0, set.width, set.height);
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.NONE]);
          gl.clearColor(aClear[0], aClear[1], aClear[2], aClear[3]);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawBuffers([gl.NONE, gl.COLOR_ATTACHMENT1]);
          gl.clearColor(bClear[0], bClear[1], bClear[2], bClear[3]);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
        }
        function resetPools() {
          // rain/wisp: A = (pos 0.5,0.5, vel encoded 0 = 0.5), B.x = age 1 = dormant
          rainSets.forEach((s) => clearStateSet(s, [0.5, 0.5, 0.5, 0.5], [1, 0, 0, 0]));
          wispSets.forEach((s) => clearStateSet(s, [0.5, 0.5, 0.5, 0.5], [1, 0, 0, 0]));
          rainPing = false;
          wispPing = false;
        }

        function resize() {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const width = Math.max(2, Math.floor(canvas.clientWidth * dpr));
          const height = Math.max(2, Math.floor(canvas.clientHeight * dpr));
          if (canvas.width !== width || canvas.height !== height || !targets) {
            canvas.width = width;
            canvas.height = height;
            const maxSide = Math.max(width, height);
            const paintScale = Math.min(1, 1280 / maxSide);
            paintW = Math.max(2, Math.round(width * paintScale));
            paintH = Math.max(2, Math.round(height * paintScale));
            const fieldScale = Math.min(1, 448 / maxSide);
            fieldW = Math.max(8, Math.round(width * fieldScale));
            fieldH = Math.max(8, Math.round(height * fieldScale));
            const glowScale = Math.min(0.5, 960 / maxSide);
            glowW = Math.max(8, Math.round(width * glowScale));
            glowH = Math.max(8, Math.round(height * glowScale));
            rebuildTargets();
          }
        }
        window.addEventListener("resize", resize, { passive: true });

        function bindTexture(unit, texture) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, texture);
        }
        function renderPass(target, program, setup) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
          gl.viewport(0, 0, target ? target.width : canvas.width,
            target ? target.height : canvas.height);
          gl.useProgram(program);
          setup();
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        // stride lets a 21-tap kernel reach far (the proximity aura) without
        // turning into a truncated, boxy blur.
        function blurPass(src, tmp, dst, sigma, stride) {
          const st = stride || 1;
          renderPass(tmp, programs.blur, () => {
            bindTexture(0, src.tex);
            gl.uniform1i(locations.blur.uSrc, 0);
            gl.uniform2f(locations.blur.uDir, st / tmp.width, 0);
            gl.uniform1f(locations.blur.uSigma, sigma);
          });
          renderPass(dst, programs.blur, () => {
            bindTexture(0, tmp.tex);
            gl.uniform1i(locations.blur.uSrc, 0);
            gl.uniform2f(locations.blur.uDir, 0, st / dst.height);
            gl.uniform1f(locations.blur.uSigma, sigma);
          });
        }
        // True GPU sync for this environment: gl.finish() is effectively
        // non-blocking under swiftshader, a 1x1 readPixels is not (CRAFT §C4).
        const syncPixel = new Uint8Array(4);
        function glSync() {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, syncPixel);
        }

        /* ------------------------------------------------------------------
           Detection state (person mask + presence). Everything lives in SCREEN
           UV so fakesource and MediaPipe drive the exact same shader path, and
           every quantity is EMA-smoothed. Only ImageSegmenter is loaded — no
