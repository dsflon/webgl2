           pose model, because nothing here needs landmarks (CRAFT §C3).
        ------------------------------------------------------------------ */

        const det = {
          mx: 0.5, my: 0.5, tmx: 0.5, tmy: 0.5,   // 身体の重心(後光の中心)
          cx: 0.5, cy: 0, present: 0,
          tcx: 0.5, tcy: 0, tpresent: 0,
          swing: 0,
          segScale: [1, 1],
          segReady: false,
        };

        const MP_PKG = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";
        const MP_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm";
        const SEG_MODEL =
          "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";

        let mpSegmenter = null;
        let mpState = "idle"; // idle | loading | ready | error
        let mpProgress = 0;
        let mpDelegate = "GPU";
        let mpVision = null;
        let ImageSegmenterClass = null;
        let mpSwitching = false;
        let segU8 = new Uint8Array(4);
        // Inference reads a SMALL offscreen copy of the video, never the full
        // frame: the mask is consumed at field resolution (≤448) anyway, and a
        // ~288px input is 10-20x cheaper (CRAFT §C3).
        const SEG_MAX_SIDE = 288;
        const segSrc = document.createElement("canvas");
        const segSrcCtx = segSrc.getContext("2d");
        let detCost = 20;   // EMA of inference ms → adaptive cadence + readout
        let segBadRun = 0;  // consecutive degenerate masks (GPU-health check)

        const segOpts = (delegate) => ({
          baseOptions: { modelAssetPath: SEG_MODEL, delegate },
          runningMode: "VIDEO",
          outputCategoryMask: false,
          outputConfidenceMasks: true,
        });

        async function loadMediaPipe() {
          if (FAKE || mpState === "loading" || mpState === "ready") return;
          mpState = "loading";
          mpProgress = 0.05;
          try {
            const mod = await import(/* @vite-ignore */ MP_PKG);
            const { FilesetResolver, ImageSegmenter } = mod;
            ImageSegmenterClass = ImageSegmenter;
            mpProgress = 0.3;
            mpVision = await FilesetResolver.forVisionTasks(MP_WASM);
            mpProgress = 0.6;
            try {
              mpSegmenter = await ImageSegmenter.createFromOptions(mpVision, segOpts("GPU"));
              mpDelegate = "GPU";
            } catch (_e) {
              mpSegmenter = await ImageSegmenter.createFromOptions(mpVision, segOpts("CPU"));
              mpDelegate = "CPU";
            }
            mpProgress = 1;
            mpState = "ready";
          } catch (error) {
            console.error("MediaPipe load failed", error);
            mpState = "error";
          }
        }

        // Some mobile GPU delegates "succeed" but emit degenerate masks
        // (all-zero or all-one). When that persists, rebuild on CPU.
        async function switchToCpuDelegate() {
          if (mpSwitching || mpDelegate === "CPU" || !ImageSegmenterClass || !mpVision) return;
          mpSwitching = true;
          try {
            const next = await ImageSegmenterClass.createFromOptions(mpVision, segOpts("CPU"));
            try { if (mpSegmenter && mpSegmenter.close) mpSegmenter.close(); } catch (_e) { /* noop */ }
            mpSegmenter = next;
            mpDelegate = "CPU";
            segBadRun = 0;
            console.warn("koe: GPU segmentation output looked broken — switched to CPU delegate");
          } catch (_e) { /* keep the GPU segmenter */ }
          mpSwitching = false;
        }

        // Offline diagnostic (?fakeseg=1): a synthetic MediaPipe-style mask.
        // Rows top-to-bottom = image top-to-bottom (top-left origin, like
        // getAsFloat32Array); uploaded UNPACK_FLIP_Y=false exactly like the real
        // mask. The person occupies the TOP ~60% of the image, so a correct
        // Y-flip sprouts the flowers around a figure in the TOP of the screen.
        function uploadFakeSeg() {
          const w = 96, h = 96;
          const arr = new Uint8Array(w * h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const inTop = y < h * 0.6;
              const inBand = x > w * 0.22 && x < w * 0.78;
              arr[y * w + x] = inTop && inBand ? 255 : 0;
            }
          }
          gl.bindTexture(gl.TEXTURE_2D, segTexture);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, arr);
          segSize = [w, h];
          det.segReady = true;
          det.tpresent = 1;
        }

        // Uploads the confidence mask and returns its mean coverage (0..1).
        function uploadSegMask(mask) {
          const w = mask.width, h = mask.height;
          const f = mask.getAsFloat32Array();
          if (segU8.length !== w * h) segU8 = new Uint8Array(w * h);
          let sum = 0;
          // The centroid of the body, in the same pass that uploads the mask.
          // The light shafts need a real centre to radiate from; det.cx/cy only
          // ever tracked the synthetic figure, so on a real camera the rays had
          // nothing to point at.
          let mx = 0, my = 0;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const v = Math.max(0, Math.min(255, (f[y * w + x] * 255) | 0));
              segU8[y * w + x] = v;
              sum += v;
              mx += v * x;
              my += v * y;
            }
          }
          if (sum > 255 * 32) {
            // image space is top-left origin; the art clock is y-up
            det.tmx = (mx / sum) / w;
            det.tmy = 1 - (my / sum) / h;
          }
          gl.bindTexture(gl.TEXTURE_2D, segTexture);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
          if (segSize[0] !== w || segSize[1] !== h) {
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, segU8);
            segSize = [w, h];
          } else {
            gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RED, gl.UNSIGNED_BYTE, segU8);
          }
          det.segReady = true;
          return sum / (w * h * 255);
        }

        // Runs OUTSIDE the render loop (latest-wins); never awaited in rAF.
        // UNTESTED in this environment (network + swiftshader).
        function runDetection(now) {
          if (video.readyState < 2 || video.videoWidth === 0 || mpSwitching) return;
          const vw = video.videoWidth, vh = video.videoHeight;
          const s = Math.min(1, SEG_MAX_SIDE / Math.max(vw, vh));
          const cw = Math.max(2, Math.round(vw * s));
          const ch = Math.max(2, Math.round(vh * s));
          if (segSrc.width !== cw || segSrc.height !== ch) {
            segSrc.width = cw;
            segSrc.height = ch;
          }
          segSrcCtx.drawImage(video, 0, 0, cw, ch);
          const t0 = performance.now();
          try {
            const seg = mpSegmenter.segmentForVideo(segSrc, now);
            const cm = seg && seg.confidenceMasks && seg.confidenceMasks[0];
            if (cm) {
              const cover = uploadSegMask(cm);
              // presence from real coverage — sprouting around the body stops
              // when nobody is in frame instead of clinging to a stale mask
              det.tpresent = cover > 0.008 && cover < 0.95 ? 1 : 0;
              const degenerate = cover < 0.002 || cover > 0.97;
              segBadRun = degenerate ? segBadRun + 1 : 0;
              if (segBadRun > 40) switchToCpuDelegate();
            }
            if (seg && seg.close) seg.close();
          } catch (_e) {
            segBadRun++;
            if (segBadRun > 40) switchToCpuDelegate();
          }
          detCost = detCost * 0.8 + (performance.now() - t0) * 0.2;
        }

        let detTimer = 0;
        function detectionTick() {
          if (!FAKE && mpState === "ready" && cameraReady && !document.hidden) {
            runDetection(performance.now());
          }
          // Adaptive cadence: inference must never own the main thread.
          const interval = Math.max(33, Math.min(250, detCost * 1.7));
          detTimer = setTimeout(detectionTick, interval);
        }

        /* ------------------------------------------------------------------
           SOUND → the growth signals. Three drivers behind ONE meter set:
             mic  — AnalyserNode: RMS (fast + slow EMA), spectral centroid,
                    zero-crossing rate, dominant-pitch estimate, and an onset
                    detector (hysteresis + refractory) for string attacks.
             fake — ?fakesource=1: a deterministic 18s song. WebAudio and the
                    microphone are NEVER opened, so verification is offline.
             demo — mic denied / unavailable: a slow procedural breath so the
                    piece still grows flowers instead of standing empty.
           Every meter is normalised to 0..1 and all smoothing is dt-driven, so
           ?freeze=1 (dt = 0) holds them exactly and ?prewarm= is deterministic.
        ------------------------------------------------------------------ */

        const aud = {
          mode: FAKE ? "fake" : "demo",
          ctx: null, analyser: null, stream: null,
          timeData: null, freqData: null,
          rmsF: 0, rmsS: 0, cen: 0.3, zcr: 0.2, pitF: 0.4, pitS: 0.4,
          armed: true, refr: 0, level: 0,
          err: "",
        };
        // rms = instant loudness, sus = sustained voice (the growth fuel),
        // cen = spectral centroid (timbre → hue), zcr = breathiness,
        // pitch = dominant pitch (→ stem height), vib = vibrato, onset = attack
        // steady = how UNWAVERING the voice is (the inverse of short-window
        //   loudness変動 + timbre flux).
        // shine  = the WEATHER of the piece: how much light the body has built
        //   up by singing. Silence lets it fade and the rain comes back.
        const meters = {
          rms: 0, sus: 0, cen: 0.3, zcr: 0.2, pitch: 0.4, vib: 0, onset: 0,
          steady: 0, shine: 0,
        };
        // running state for the steadiness estimate
        const stab = { mean: 0, dev: 0, cenPrev: 0.3, flux: 0 };

        // 天候。静けさには雨が降り、歌い続けるほど身体の光が増して晴れていく。
        // shine は歌で満ち(全力で 12 秒ほど)、黙ると 35 秒ほどかけて薄れる —
        // 天気なので、一音では変わらない。保たれた声がいちばんよく満たし、
        // 揺れる声・叫びは steady が下がる分だけ満ちが遅い(罰は無い)。
        function updateShine(dt) {
          const voiced = smoothstep01(0.03, 0.16, meters.rms);
          const charge = voiced * meters.sus * (0.40 + 0.60 * meters.steady);
          // 6s to fill at full voice, 30s to fade. At 12s the arc was so slow
          // that a real singer never saw the sky clear at all.
          meters.shine += dt * (charge / 6.0);
          meters.shine -= dt * (meters.shine / 30.0);
          meters.shine = Math.max(0, Math.min(1, meters.shine));
        }
        // 実効の雨量: 光が増すほど雨は上がっていく(晴れる)。
        // clear スライダーは光と天候の結合の強さ。
        function rainNow() {
          return state.rain *
            (1 - state.clear * smoothstep01(0.05, 0.55, meters.shine));
        }
        function smoothstep01(a, b, x) {
          const t = Math.max(0, Math.min(1, (x - a) / Math.max(b - a, 1e-5)));
          return t * t * (3 - 2 * t);
        }
        let arc = 0;          // 楽章: the accumulated arc of the song (0..1)
        let fakeOnsetK = 0;
        let demoOnsetT = 1.4;

        // The scripted song for ?fakesource=1 — 18s: 前奏 / A メロ / サビ /
        // 間奏 / 余韻. A pure function of the (frozen-able) art clock.
        // The scripted song for ?fakesource=1 — 24s, built as the WEATHER ARC
        // this piece runs on: real silence first (the rain must be seen), then
        // a long sustained sing (the light must grow and the sky must clear),
        // then silence again (the rain must come back). If the song never goes
        // quiet, the rain never appears offline and invariant 1 goes
        // unexercised — the samoarinan lesson, applied in advance.
        function fakeSong(t) {
          const T = t % 24;
          let vol, cen, pit, zcr;
          if (T < 5.0) {                       // 無音: the rain's scene
            vol = 0.015 + 0.010 * Math.sin(T * 1.7);
            cen = 0.24; pit = 0.32; zcr = 0.30;
          } else if (T < 15.0) {               // 静かな持続: the light grows
            vol = 0.26 + 0.020 * Math.sin(T * 0.6);
            cen = 0.30 + 0.012 * Math.sin(T * 0.33);
            pit = 0.38 + 0.025 * Math.sin(T * 0.7);
            zcr = 0.24;
          } else if (T < 19.0) {               // ふくらみ: still held, fuller
            const u = (T - 15.0) / 4.0;
            vol = 0.40 + 0.06 * u + 0.03 * Math.sin(T * 1.1);
            cen = 0.38 + 0.05 * Math.sin(T * 0.8);
            pit = 0.50 + 0.06 * Math.sin(T * 0.9);
            zcr = 0.22;
          } else {                             // 余韻 → 無音: the rain returns
            const u = (T - 19.0) / 5.0;
            vol = Math.max(0.0, 0.22 * (1.0 - u * 1.15));
            cen = 0.27; pit = 0.35; zcr = 0.28;
          }
          return { vol: Math.max(0, vol), cen, pit, zcr, playing: T > 4.9 && T < 21.5 };
        }

        // A gentle self-driven breath for visitors with no microphone: slow
        // swells with a soft attack, so the piece still opens flowers.
        function demoSong(t) {
          const s = 0.5 + 0.5 * Math.sin(t * 0.42);
          const s2 = 0.5 + 0.5 * Math.sin(t * 0.17 + 1.3);
          const vol = 0.10 + 0.26 * Math.pow(s, 1.6) * (0.5 + 0.5 * s2);
          return {
            vol,
            cen: 0.30 + 0.22 * s2,
            pit: 0.34 + 0.24 * s,
            zcr: 0.24 + 0.14 * (1 - s),
            playing: true,
          };
        }

        function micFeatures(dt) {
          const an = aud.analyser;
          an.getFloatTimeDomainData(aud.timeData);
          const N = aud.timeData.length;
          let sum = 0;
          let zc = 0;
          let prev = aud.timeData[0];
          for (let i = 1; i < N; i++) {
            const v = aud.timeData[i];
            sum += v * v;
            if ((v >= 0) !== (prev >= 0)) zc++;
            prev = v;
          }
          const rms = Math.sqrt(sum / N);
          const zcrRaw = Math.min(1, (zc / N) * 2.4);
          an.getByteFrequencyData(aud.freqData);
          const bins = aud.freqData.length;
          const binHz = (aud.ctx ? aud.ctx.sampleRate : 48000) / (2 * bins);
          let msum = 0;
          let mw = 0;
          let peak = 0;
          let peakBin = 0;
          const lo = Math.max(1, Math.floor(70 / binHz));
          const hi = Math.min(bins - 1, Math.ceil(1200 / binHz));
          for (let i = 0; i < bins; i++) {
            const v = aud.freqData[i];
            msum += v;
            mw += v * i;
            if (i >= lo && i <= hi && v > peak) { peak = v; peakBin = i; }
          }
          const cenRaw = msum > 4 ? (mw / msum) / (bins * 0.5) : 0;
          // dominant pitch → a log-scale 0..1 (80Hz..1200Hz)
          const f0 = peakBin * binHz;
          const pitRaw = peak > 24 && f0 > 60
            ? Math.min(1, Math.max(0, Math.log2(f0 / 80) / Math.log2(1200 / 80)))
            : aud.pitS;
          const k = (tc) => 1 - Math.exp(-Math.max(dt, 1e-4) / tc);
          aud.rmsF += (rms - aud.rmsF) * k(0.05);
          aud.rmsS += (rms - aud.rmsS) * k(1.8);
          aud.cen += (cenRaw - aud.cen) * k(0.20);
          aud.zcr += (zcrRaw - aud.zcr) * k(0.20);
          aud.pitF += (pitRaw - aud.pitF) * k(0.06);
          aud.pitS += (pitRaw - aud.pitS) * k(0.9);
          aud.level = aud.rmsF;
          // sensitivity: a lower reference makes a quiet room fill with flowers
          const ref = 0.030 + 0.190 * (1 - state.micGain);
          meters.rms = Math.min(1, aud.rmsF / ref);
          meters.sus = Math.min(1, aud.rmsS / (ref * 0.95));
          meters.cen = Math.min(1, aud.cen * 1.15);
          meters.zcr = aud.zcr;
          meters.pitch = aud.pitF;
          meters.vib = Math.min(1, Math.abs(aud.pitF - aud.pitS) * 9);
          // onset (string attack / consonant): the fast RMS crossing a threshold
          // above the slow one, with hysteresis and a refractory period
          aud.refr = Math.max(0, aud.refr - dt);
          const thHi = aud.rmsS * 1.75 + 0.008 * (1.4 - state.micGain);
          const thLo = aud.rmsS * 1.12 + 0.003;
          if (aud.armed && aud.refr <= 0 && aud.rmsF > thHi && aud.rmsF > 0.006) {
            aud.armed = false;
            aud.refr = 0.13;
            meters.onset = Math.min(1, 0.55 + meters.rms * 0.7);
          } else if (!aud.armed && aud.rmsF < thLo) {
            aud.armed = true;
          }
          updateSteady(dt, meters.rms, meters.cen);
          updateShine(dt);
        }

        // 安定度. Two things make a voice unsteady: its loudness wobbles, and its
        // timbre keeps moving. Both are measured against slow means so a long
        // held note scores high however loud or quiet it is, and a shouted or
        // choppy phrase scores low. Loudness itself is NOT part of this, so the
        // two can be read apart in debug view 3.
        function updateSteady(dt, rmsN, cenN) {
          const k = (tc) => 1 - Math.exp(-Math.max(dt, 1e-4) / tc);
          stab.mean += (rmsN - stab.mean) * k(0.9);
          const dev = Math.abs(rmsN - stab.mean);
          stab.dev += (dev - stab.dev) * k(0.45);
          const fl = Math.abs(cenN - stab.cenPrev) / Math.max(dt, 1e-3);
          stab.cenPrev = cenN;
          stab.flux += (Math.min(1, fl * 0.35) - stab.flux) * k(0.40);
          // RELATIVE deviation, not absolute. An absolute threshold penalises a
          // loud steady voice more than a quiet steady one simply because its
          // deviations are bigger in magnitude — which would smuggle loudness
          // back into a meter that has to be about steadiness alone.
          const rel = stab.dev / Math.max(stab.mean, 0.055);
          const wob = 1 - smoothstep01(0.12, 0.62, rel);
          const clean = 1 - smoothstep01(0.10, 0.55, stab.flux);
          meters.steady = Math.max(0, Math.min(1, wob * 0.62 + clean * 0.38));
        }

        function scriptedFeatures(dt, song, onsetPeriod, seedBase) {
          const k = (tc) => 1 - Math.exp(-Math.max(dt, 1e-4) / tc);
          aud.rmsF += (song.vol - aud.rmsF) * k(0.06);
          aud.rmsS += (song.vol - aud.rmsS) * k(1.6);
          aud.cen += (song.cen - aud.cen) * k(0.25);
          aud.zcr += (song.zcr - aud.zcr) * k(0.25);
          aud.pitF += (song.pit - aud.pitF) * k(0.08);
          aud.pitS += (song.pit - aud.pitS) * k(0.9);
          aud.level = aud.rmsF;
          meters.rms = Math.min(1, aud.rmsF / 0.55);
          meters.sus = Math.min(1, aud.rmsS / 0.30);
          meters.cen = aud.cen;
          meters.zcr = aud.zcr;
          meters.pitch = aud.pitF;
          meters.vib = Math.min(1, Math.abs(aud.pitF - aud.pitS) * 7);
          // strums on a fixed grid (deterministic; frozen art clock = no onsets)
          if (song.playing) {
            while (seedBase.next <= animTime) {
              meters.onset = Math.min(1, 0.5 + meters.rms * 0.8);
              seedBase.next += onsetPeriod;
            }
          } else {
            seedBase.next = Math.max(seedBase.next, animTime + onsetPeriod);
          }
          updateSteady(dt, meters.rms, meters.cen);
          updateShine(dt);
        }

        const fakeClock = { next: 1.2 };
        const demoClock = { next: 1.4 };

        function updateAudio(dt) {
          // ?freeze=1: hold every meter exactly. The flower head breathes with
          // the loudness, so letting the EMAs creep at dt=0 would make a frozen
          // frame drift (the determinism check would catch it eventually — this
          // makes it bit-exact by construction).
          if (dt <= 0) return;
          if (aud.mode === "mic" && aud.analyser) {
            micFeatures(dt);
          } else if (aud.mode === "fake") {
            scriptedFeatures(dt, fakeSong(animTime), 0.52, fakeClock);
          } else {
            const song = demoSong(animTime);
            scriptedFeatures(dt, song, 1.7, demoClock);
            // the demo breath must stay gentle: it is a holding pattern
            meters.rms *= 0.85;
            meters.sus *= 0.9;
          }
          // the attack is consumed as a short envelope by every shader
          meters.onset *= Math.exp(-dt * 5.5);
          // 楽章: the song's accumulated arc. It rises while there is real
          // singing and falls back in silence, and it biases hue, shedding and
          // the density of the field — the piece has a beginning and an end.
          const drive = meters.sus * 0.75 + meters.rms * 0.35;
          arc += dt * (drive - 0.16) * 0.085;
          arc = Math.max(0, Math.min(1, arc));
        }

        let micStarted = false;
        async function startMic() {
          if (FAKE || micStarted) return;
          micStarted = true;
          if (!window.isSecureContext ||
              !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            aud.err = "非対応";
            micStarted = false;
            return;
          }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            if (!stream.getAudioTracks || stream.getAudioTracks().length === 0) {
              throw new Error("no audio track");
            }
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!aud.ctx) aud.ctx = new Ctx();
            try { await aud.ctx.resume(); } catch (_e) { /* needs a gesture */ }
            const src = aud.ctx.createMediaStreamSource(stream);
            aud.analyser = aud.ctx.createAnalyser();
            aud.analyser.fftSize = 2048;
            aud.analyser.smoothingTimeConstant = 0;
            src.connect(aud.analyser);
            aud.stream = stream;
            aud.timeData = new Float32Array(aud.analyser.fftSize);
            aud.freqData = new Uint8Array(aud.analyser.frequencyBinCount);
            aud.mode = "mic";
            aud.err = "";
          } catch (error) {
            // A missing microphone is never fatal: the demo breath keeps the
            // piece alive and the panel offers a retry.
            aud.analyser = null;
            aud.mode = "demo";
            micStarted = false;
            const name = error && error.name ? error.name : "";
            aud.err = name === "NotAllowedError" ? "許可なし"
              : (name === "NotFoundError" ? "見つからない" : "使用不可");
          }
        }

        function stopMic() {
          if (aud.stream) {
            aud.stream.getTracks().forEach((t) => t.stop());
            aud.stream = null;
          }
          aud.analyser = null;
          if (aud.mode === "mic") aud.mode = "demo";
        }

        document.getElementById("micRetry").addEventListener("click", () => {
          stopMic();
          micStarted = false;
          aud.err = "";
          startMic();
        });
        // browsers suspend a fresh AudioContext until a user gesture
        const resumeAudio = () => {
          if (aud.ctx && aud.ctx.state === "suspended") aud.ctx.resume();
          if (!FAKE && !micStarted && aud.mode !== "mic") startMic();
        };
        window.addEventListener("pointerdown", resumeAudio, { passive: true });
        window.addEventListener("keydown", resumeAudio);

        /* ------------------------------------------------------------------
           Simulation + present
        ------------------------------------------------------------------ */

        let stream = null;
        let cameraReady = false;
        let animTime = 0;
        let seedCounter = 0;
        let lastNow = performance.now();
        let fpsLast = performance.now();
        let fpsFrames = 0;
        let scenePing = false, maskPing = false;
        let haveVideo = false;
        let readyStamped = false;
        let poolsReady = false;
        let prewarmLeft = Math.min(480, Math.round(PREWARM / PREWARM_DT));

        const readout = document.getElementById("readout");
        const levelBar = document.getElementById("levelBar");

        function uploadVideoFrame() {
          if (
            cameraReady &&
            video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
            video.videoWidth > 0 && video.videoHeight > 0
          ) {
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
            return true;
          }
          return false;
        }

        function updateDetection(dt) {
          const canvasAspect = canvas.width / Math.max(canvas.height, 1);
          const videoAspect = (video.videoWidth && video.videoHeight)
            ? video.videoWidth / video.videoHeight : 4 / 3;
          det.segScale = videoAspect > canvasAspect
            ? [canvasAspect / videoAspect, 1]
            : [1, videoAspect / canvasAspect];

          if (FAKE) {
            // sway + bob + limb swing so the mask moves like a real performer:
            // this is what feeds the motion field, the gusts and the moving
            // sprouting band offline (verify_runtime --motion depends on it).
            det.tcx = 0.5 + 0.075 * Math.sin(animTime * 0.42);
            det.tcy = 0.022 * Math.sin(animTime * 0.71 + 1.0);
            det.swing = Math.sin(animTime * 1.25);
            det.tpresent = 1;
          } else if (FAKESEG) {
            det.tpresent = 1;
          } else if (mpState !== "ready") {
            det.tpresent = 0;
          }
          if (FAKESEG) det.segScale = [1, 1]; // direct mapping for the Y-flip test
          const k = FREEZE ? 0 : 1 - Math.exp(-dt * 6);
          if (FAKE) { det.tmx = 0.5 + det.tcx - 0.5; det.tmy = 0.52 + det.tcy; }
          det.mx += (det.tmx - det.mx) * k;
          det.my += (det.tmy - det.my) * k;
          det.cx += (det.tcx - det.cx) * k;
          det.cy += (det.tcy - det.cy) * k;
          det.present += (det.tpresent - det.present) * k;
        }

        function audioUniforms(u) {
          gl.uniform4f(u.uAudA, meters.rms, meters.cen, meters.zcr, meters.onset);
          gl.uniform4f(u.uAudB, meters.sus, meters.pitch, meters.vib, arc);
        }

        // One simulation step: every pass except the final composite. Called once
        // per frame, or repeatedly with a fixed dt while ?prewarm= fast-forwards.
        function stepSim(dt) {
          const doReset = needsReset;
          needsReset = false;
          if (doReset) clearSimTargets();
          if (!poolsReady || doReset) {
            resetPools();
            poolsReady = true;
          }

          const aspect = canvas.width / Math.max(canvas.height, 1);
          // FAKESEG forces the real-camera seg path (uSource==1) with the
          // synthetic mask so the Y-flip can be validated offline.
          const source = FAKESEG ? 1
            : (FAKE ? 0 : (mpState === "ready" && det.segReady ? 1 : 2));
          seedCounter = (seedCounter + 1) % 65536;
          const seed = dt > 0 ? seedCounter * 0.017 + 0.31 : 0.31;
          const sceneCur = scenePing ? targets.sceneA : targets.sceneB;
          const scenePrev = scenePing ? targets.sceneB : targets.sceneA;
          const maskOut = maskPing ? targets.maskA : targets.maskB;
          const maskPrev = maskPing ? targets.maskB : targets.maskA;
          const wetOut = wetPing ? targets.wetA : targets.wetB;
          const wetPrev = wetPing ? targets.wetB : targets.wetA;
          const rainSrc = rainPing ? rainSets[1] : rainSets[0];
          const rainDst = rainPing ? rainSets[0] : rainSets[1];
          const wispSrc = wispPing ? wispSets[1] : wispSets[0];
          const wispDst = wispPing ? wispSets[0] : wispSets[1];
          const fieldTexel = [1 / fieldW, 1 / fieldH];

          // P0 — scene (camera cover-fit / synthetic room)
          renderPass(sceneCur, programs.scene, () => {
            const u = locations.scene;
            bindTexture(0, videoTexture);
            gl.uniform1i(u.uVideo, 0);
            gl.uniform2f(u.uResolution, paintW, paintH);
            gl.uniform2f(u.uVideoSize,
              Math.max(1, video.videoWidth), Math.max(1, video.videoHeight));
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uCx, det.cx);
            gl.uniform1f(u.uCy, det.cy);
            gl.uniform1f(u.uSwing, det.swing);
            gl.uniform1f(u.uScale, FAKESCALE);
            gl.uniform1i(u.uMirror, state.mirror ? 1 : 0);
            gl.uniform1i(u.uFake, FAKE ? 1 : 0);
            gl.uniform1i(u.uHasVideo, haveVideo ? 1 : 0);
          });

          // P1 — mask (fast + slow EMA) and motion field
          renderPass(maskOut, programs.mask, () => {
            const u = locations.mask;
            bindTexture(0, sceneCur.tex);
            bindTexture(1, scenePrev.tex);
            bindTexture(2, maskPrev.tex);
            bindTexture(3, segTexture);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uScenePrev, 1);
            gl.uniform1i(u.uPrev, 2);
            gl.uniform1i(u.uSeg, 3);
            gl.uniform2f(u.uTexel, fieldTexel[0], fieldTexel[1]);
            gl.uniform2f(u.uSegScale, det.segScale[0], det.segScale[1]);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uCx, det.cx);
            gl.uniform1f(u.uCy, det.cy);
            gl.uniform1f(u.uSwing, det.swing);
            gl.uniform1f(u.uScale, FAKESCALE);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uAlphaFast, 1 - Math.exp(-Math.max(dt, 1e-4) * 16));
            gl.uniform1f(u.uAlphaSlow, 1 - Math.exp(-Math.max(dt, 1e-4) * 2.3));
            gl.uniform1f(u.uAlphaMot, 1 - Math.exp(-Math.max(dt, 1e-4) * 5.5));
            gl.uniform1i(u.uReset, doReset ? 1 : 0);
            gl.uniform1i(u.uSource, source);
            gl.uniform1i(u.uMirror, state.mirror ? 1 : 0);
          });

          // P2 — soften the mask. The normals and the shelter march both read
          // from this: the raw confidence mask has block edges and its gradient
          // is noise, so "which way does this surface face" is meaningless on it.
          blurPass(maskOut, targets.softTmp, targets.softT, 3.2, 1);
          // A WIDE halo of the mask. Its gradient points toward the body from
          // anywhere around it, which is what lets the light shafts radiate out
          // of the actual silhouette — shoulders, head, arms — with no need for
          // a centroid (det.cx/cy only tracks the synthetic figure).
          blurPass(targets.softT, targets.wideTmp, targets.wideT, 3.2, 9);

          // P3 — the wetness field
          renderPass(wetOut, programs.wet, () => {
            const u = locations.wet;
            bindTexture(0, wetPrev.tex);
            bindTexture(1, maskOut.tex);
            bindTexture(2, targets.softT.tex);
            gl.uniform1i(u.uPrev, 0);
            gl.uniform1i(u.uMask, 1);
            gl.uniform1i(u.uSoft, 2);
            gl.uniform2f(u.uTexel, fieldTexel[0], fieldTexel[1]);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uSoak, state.soak);
            gl.uniform1f(u.uRainAmt, rainNow());
            // the light breathes with the held voice, over the weather floor
            gl.uniform1f(u.uVoice,
              meters.sus * (0.35 + 0.65 * meters.steady) *
              (0.45 + 0.55 * meters.shine));
            gl.uniform1f(u.uGlowAmt, state.glowAmt);
            gl.uniform1i(u.uReset, doReset ? 1 : 0);
          });

          // P4 — the rain: fall, find the body, flare, die
          renderPass(rainDst, programs.rain, () => {
            const u = locations.rain;
            bindTexture(0, rainSrc.texA);
            bindTexture(1, rainSrc.texB);
            bindTexture(2, maskOut.tex);
            gl.uniform1i(u.uStateA, 0);
            gl.uniform1i(u.uStateB, 1);
            gl.uniform1i(u.uMask, 2);
            gl.uniform1f(u.uTexW, RAIN_W);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform1f(u.uSeed, seed);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uRainAmt, rainNow());
            gl.uniform1f(u.uWind, state.wind);
            gl.uniform4f(u.uAudA,
              meters.rms, meters.cen, meters.steady, meters.onset);
          });

          // P4b — the wisps adrift
          renderPass(wispDst, programs.wisp, () => {
            const u = locations.wisp;
            bindTexture(0, wispSrc.texA);
            bindTexture(1, wispSrc.texB);
            gl.uniform1i(u.uStateA, 0);
            gl.uniform1i(u.uStateB, 1);
            gl.uniform1f(u.uTexW, WISP_W);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform1f(u.uSeed, seed);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uWisp, state.floss);
            gl.uniform1f(u.uWind, state.wind);
          });

          // P5 — the layer. Cleared to transparent and built with PREMULTIPLIED
          // alpha: wisps in the air, then the body's light, then the rain in
          // front of everything.
          gl.bindFramebuffer(gl.FRAMEBUFFER, targets.layer.fbo);
          gl.viewport(0, 0, targets.layer.width, targets.layer.height);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.enable(gl.BLEND);
          gl.blendEquation(gl.FUNC_ADD);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.bindVertexArray(vao);

          gl.useProgram(programs.wispDraw);
          {
            const u = locations.wispDraw;
            bindTexture(0, wispDst.texA);
            bindTexture(1, wispDst.texB);
            gl.uniform1i(u.uStateA, 0);
            gl.uniform1i(u.uStateB, 1);
            gl.uniform1f(u.uTexW, WISP_W);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform1f(u.uShine, meters.shine);
          }
          gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, WISP_N);

          // the light of the voice (fullscreen, emissive)
          gl.useProgram(programs.glow);
          {
            const u = locations.glow;
            bindTexture(0, wetOut.tex);
            bindTexture(1, targets.softT.tex);
            bindTexture(2, sceneCur.tex);
            gl.uniform1i(u.uWet, 0);
            gl.uniform1i(u.uSoft, 1);
            gl.uniform1i(u.uScene, 2);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uGlowAmt, state.glowAmt);
          }
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          gl.useProgram(programs.rainDraw);
          {
            const u = locations.rainDraw;
            bindTexture(0, rainDst.texA);
            bindTexture(1, rainDst.texB);
            gl.uniform1i(u.uStateA, 0);
            gl.uniform1i(u.uStateB, 1);
            gl.uniform1f(u.uTexW, RAIN_W);
            gl.uniform1f(u.uAspect, aspect);
          }
          gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, RAIN_N);

          gl.bindVertexArray(null);
          gl.disable(gl.BLEND);

          // P7 — bloom: threshold + downsample, then two blur stages
          renderPass(targets.b1Src, programs.bright, () => {
            bindTexture(0, targets.layer.tex);
            gl.uniform1i(locations.bright.uSrc, 0);
          });
          blurPass(targets.b1Src, targets.b1Tmp, targets.b1, 2.6, 1);
          blurPass(targets.b1, targets.b2Tmp, targets.b2, 2.6, 1);

          scenePing = !scenePing;
          maskPing = !maskPing;
          wetPing = !wetPing;
          rainPing = !rainPing;
          wispPing = !wispPing;
        }

        // P7 — composite to the canvas.
        function present() {
          const aspect = canvas.width / Math.max(canvas.height, 1);
          const sceneCur = scenePing ? targets.sceneB : targets.sceneA;
          const maskCur = maskPing ? targets.maskB : targets.maskA;
          const wetCur = wetPing ? targets.wetB : targets.wetA;
          renderPass(null, programs.composite, () => {
            const u = locations.composite;
            bindTexture(0, sceneCur.tex);
            bindTexture(1, maskCur.tex);
            bindTexture(2, targets.softT.tex);
            bindTexture(3, wetCur.tex);
            bindTexture(4, targets.layer.tex);
            bindTexture(5, targets.b1.tex);
            bindTexture(6, targets.b2.tex);
            bindTexture(7, targets.wideT.tex);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uMask, 1);
            gl.uniform1i(u.uSoft, 2);
            gl.uniform1i(u.uWet, 3);
            gl.uniform1i(u.uLayer, 4);
            gl.uniform1i(u.uB1, 5);
            gl.uniform1i(u.uB2, 6);
            gl.uniform1i(u.uWide, 7);
            gl.uniform2f(u.uResolution, canvas.width, canvas.height);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform1f(u.uExposure, state.exposure);
            gl.uniform1f(u.uGlowAmt, state.glowAmt);
            // det.mx/my are in the mask's sampling space. The canvas applies
            // cover-fit (segScale) and the mirror on top of that, so the raw
            // centroid would sit off the body on any non-matching aspect or
            // with the mirror on. Invert both here.
            let ccx = (det.mx - 0.5) / Math.max(det.segScale[0], 1e-4) + 0.5;
            const ccy = (det.my - 0.5) / Math.max(det.segScale[1], 1e-4) + 0.5;
            if (state.mirror && !FAKE) ccx = 1 - ccx;
            gl.uniform2f(u.uCenter,
              Math.max(-0.5, Math.min(1.5, ccx)),
              Math.max(-0.5, Math.min(1.5, ccy)));
            gl.uniform1f(u.uRays, state.rays);
            gl.uniform1f(u.uShine, meters.shine);
            gl.uniform1f(u.uFilmGrain, state.filmGrain);
            gl.uniform1f(u.uPresent, det.present);
            gl.uniform4f(u.uAudA,
              meters.rms, meters.cen, meters.steady, meters.onset);
            gl.uniform4f(u.uAudB, meters.sus, meters.pitch, meters.vib, arc);
            gl.uniform1i(u.uDebug, state.debugView);
          });
        }

        function detectionLabel() {
          if (FAKE) return "合成";
          if (FAKESEG) return "合成マスク";
          if (mpState === "loading") return `検知ロード中 ${Math.round(mpProgress * 100)}%`;
          if (mpState === "error") return "検知エラー";
          if (mpState === "ready") {
            const st = det.present > 0.4 ? "追従中" : "未検出";
            return `${st} ${Math.round(detCost)}ms·${mpDelegate}`;
          }
          return "待機";
        }

        function audioLabel() {
          if (aud.mode === "fake") return "合成の歌";
          if (aud.mode === "mic") {
            const db = aud.level > 1e-5 ? Math.round(20 * Math.log10(aud.level)) : -99;
            const susp = aud.ctx && aud.ctx.state === "suspended" ? "·要タップ" : "";
            return `マイク ${db}dB${susp}`;
          }
          return `デモ呼吸${aud.err ? `(マイク:${aud.err})` : ""}`;
        }

        function updateChip() {
          statusChip.textContent = FAKE
            ? "入力 · 合成 (fakesource=1)"
            : `音 · ${audioLabel()} / 検知 · ${detectionLabel()}`;
          statusChip.classList.toggle(
            "hidden", FAKE ? performance.now() - bootWall > 4000 : false);
        }

        function frame(now) {
          resize();

          const rawDt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
          lastNow = now;
          const dt = FREEZE ? 0 : rawDt;

          haveVideo = FAKE ? false : uploadVideoFrame();
          const hasInput = FAKE || FAKESEG || haveVideo || mpState === "ready";

          if (!state.pauseAnim) animTime += dt;
          updateAudio(dt);
          updateDetection(dt);

          // ?prewarm=<sec>: deterministic fast-forward before __artReady, spread
          // over several rAF frames and synced with a 1x1 readPixels so the
          // preroll never parks the compositor for tens of seconds — under
          // swiftshader a single blocking preroll stalls everything (CRAFT §C4).
          if (prewarmLeft > 0) {
            const n = Math.min(12, prewarmLeft);
            for (let i = 0; i < n; i++) {
              if (!state.pauseAnim) animTime += PREWARM_DT;
              updateAudio(PREWARM_DT);
              updateDetection(PREWARM_DT);
              stepSim(PREWARM_DT);
            }
            prewarmLeft -= n;
            glSync();
          }

          stepSim(dt);
          present();

          if (!readyStamped && hasInput && prewarmLeft <= 0) {
            glSync();               // the first REAL frame has completed
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            readout.textContent = `FPS ${fps.toFixed(0)} / 解像度 ${canvas.width}×${
              canvas.height} / 綿毛 ${WISP_N.toLocaleString()} / 雨 ${
              RAIN_N.toLocaleString()} / 音 ${audioLabel()} / 安定 ${
              meters.steady.toFixed(2)} / 光 ${meters.shine.toFixed(2)} / 検知 ${
              detectionLabel()}`;
            levelBar.style.width = `${Math.round(Math.min(1, meters.rms) * 100)}%`;
            updateChip();
          }

          requestAnimationFrame(frame);
        }

        /* ------------------------------------------------------------------
           Camera + boot. With ?fakesource=1 the synthetic scene and the scripted
           song drive the pipeline and neither MediaPipe nor the microphone is
           touched, but getUserMedia still runs so the three camera error paths
           stay observable.
        ------------------------------------------------------------------ */

        async function startCamera() {
          stopCamera();
          cameraReady = false;
          retryCamera.disabled = true;
          setOverlay("requesting", "REQUESTING CAMERA",
            "Please allow webcam access. If this is not localhost or HTTPS, the camera API will be blocked.");

          if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost" &&
            location.hostname !== "127.0.0.1" &&
            location.hostname !== "[::1]"
          ) {
            setOverlay("error", "SECURE CONTEXT REQUIRED",
              "Serve the file from localhost (for example: python3 -m http.server 8899) or HTTPS, then reload.");
            retryCamera.disabled = false;
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setOverlay("error", "CAMERA API UNAVAILABLE",
              "This browser does not expose getUserMedia. Try a modern browser over localhost or HTTPS.");
            retryCamera.disabled = false;
            return;
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: state.facingMode,
                width: { ideal: 1280 }, height: { ideal: 720 },
              },
              audio: false,
            });
            video.srcObject = stream;
            await video.play();
            cameraReady = true;
            retryCamera.disabled = false;
            needsReset = true;
            setOverlay("hidden", "", "");
            if (!FAKE) {
              loadMediaPipe();
              startMic();     // the microphone is opened separately (never fatal)
            }
          } catch (error) {
            retryCamera.disabled = false;
            const name = error && error.name ? error.name : "";
            if (name === "NotAllowedError" || name === "SecurityError") {
              setOverlay("error", "PERMISSION DENIED",
                "Camera access was denied. Enable camera permission for this site, then retry.",
                { retryCamera: true });
            } else if (name === "NotFoundError" || name === "OverconstrainedError") {
              setOverlay("error", "NO CAMERA FOUND",
                "No usable webcam was found. Connect a camera or release it from another app, then retry.",
                { retryCamera: true });
            } else {
              setOverlay("error", "CAMERA ERROR",
                `${name || "Unknown error"}. Check browser permissions and retry.`,
                { retryCamera: true });
            }
          }
        }

        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        retryCamera.addEventListener("click", () => { startCamera(); });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });
        window.addEventListener("beforeunload", () => { stopCamera(); stopMic(); });

        const bootWall = performance.now();

        try {
          resize();
          if (FAKESEG) uploadFakeSeg(); // offline seg-path diagnostic
          // startCamera() runs in every mode. Under ?fakesource=1 the synthetic
          // scene drives the whole pipeline regardless of the camera (the video
          // texture is never sampled, MediaPipe and the mic stay untouched), so
          // the camera is only exercised to keep the three error overlays
          // observable: on success the overlay hides and the fake art shows; on
          // denial / no-camera the matching error overlay appears over the
          // still-rendering art.
          startCamera();
          detectionTick();
          requestAnimationFrame(frame);
        } catch (error) {
          setOverlay("error", "WEBGL SETUP ERROR",
            error && error.message ? error.message : "Could not initialize the renderer.");
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
