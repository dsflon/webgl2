            bindTexture(0, curDye().tex);
            gl.uniform1i(u.uDye, 0);
            gl.uniform2f(u.uTexel, simTexelX, simTexelY);
          });
          gl.bindFramebuffer(gl.FRAMEBUFFER, reduceT.fbo);
          gl.readPixels(0, 0, REDUCE_N, REDUCE_N, gl.RGBA, gl.UNSIGNED_BYTE, reducePx);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          let sum = 0;
          for (let i = 0; i < reducePx.length; i += 4) sum += reducePx[i];
          coverage = sum / (REDUCE_N * REDUCE_N) / 255;
        }

        /* ==================================================================
           Frame loop
        ================================================================== */

        const PRE_STEPS = FREEZE ? 300 : 0;
        const PRE_CHUNK = 40;
        let preRoll = PRE_STEPS;
        let simTime = 0;       // physics clock (advances while the sim runs)
        let ambientTime = 0;   // shimmer/curl phase (frozen when paused/frozen)
        let acc = 0;
        let lastNow = performance.now();
        let fpsLast = performance.now();
        let fpsFrames = 0;
        let frameCount = 0;
        let readyStamped = false;
        const readout = document.getElementById("readout");

        function runSubsteps(nSteps, dt, ambientOn) {
          for (let i = 0; i < nSteps; i++) {
            if (FAKESOURCE) fakeStrokes(simTime);
            simStep(dt, ambientOn);
            simTime += dt;
            if (ambientOn) ambientTime += dt;
            pending.length = 0;   // consumed
          }
        }

        function frame(now) {
          resize();
          const rawDt = Math.min(MAX_SUBSTEPS / 60, Math.max(0, (now - lastNow) / 1000));
          lastNow = now;

          if (preRoll > 0) {
            const steps = Math.min(PRE_CHUNK, preRoll);
            // freeze pre-roll: fixed dt, ambient frozen (deterministic still)
            runSubsteps(steps, STEP, false);
            preRoll -= steps;
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            glSync();
            if (preRoll > 0) {
              requestAnimationFrame(frame);
              return;
            }
          } else if (!FREEZE) {
            const ambientOn = !state.pauseAnim;
            acc += rawDt;
            let n = 0;
            while (acc >= STEP && n < MAX_SUBSTEPS) {
              runSubsteps(1, STEP, ambientOn);
              acc -= STEP;
              n++;
            }
            if (n === MAX_SUBSTEPS) acc = 0;
          }

          compositePass();

          // coverage readout every 20 frames (cheap; small target)
          if ((frameCount % 20) === 0) measureCoverage();
          frameCount++;

          if (!readyStamped && preRoll === 0) {
            glSync();
            readyStamped = true;
            window.__artReady = true;
          }

          // idle hint (real pointer only): show after a few seconds untouched
          if (!FAKESOURCE && !FREEZE && readyStamped) {
            if (!pointerActive && simTime - lastInputT > 4.0) showHint();
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            const modeLabel = FAKESOURCE ? "fake" : (pointerActive ? "pointer●" : "pointer");
            readout.textContent = `FPS ${fps.toFixed(0)} / 描画 ${canvas.width}×${
              canvas.height}(場 ${simW}×${simH}) / 濡れ率 ${
              Math.round(coverage * 100)}% / 入力 ${modeLabel}`;
          }
          requestAnimationFrame(frame);
        }

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });

        try {
          resize();
          if (!FLOAT_OK) {
            document.getElementById("glBadge").textContent =
              "WebGL2 · Stable Fluids · oklab · pointer · RGBA8";
          }
          requestAnimationFrame(frame);
        } catch (error) {
          const msg = error && error.message ? error.message : "";
          if (/RENDER TARGET INCOMPLETE/.test(msg)) {
            setOverlay("RENDER TARGET UNAVAILABLE",
              "流体場のレンダーターゲットを確保できませんでした。別のブラウザ/GPU でお試しください。",
              true);
          } else {
            setOverlay("WEBGL SETUP ERROR",
              msg || "レンダラーを初期化できませんでした。", true);
          }
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
