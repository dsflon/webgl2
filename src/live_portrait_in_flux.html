<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVE PORTRAIT IN FLUX</title>
    <style>
      :root {
        --fg: #e8e9ec;
        --muted: #7e8290;
        --bg: #0c0d10;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family:
          "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", Meiryo, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas#gl {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      video,
      canvas#src {
        display: none;
      }

      .caption {
        position: fixed;
        top: 30px;
        left: 34px;
        user-select: none;
        pointer-events: none;
      }
      .caption .en {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.38em;
        color: var(--fg);
      }
      .caption .jp {
        margin-top: 6px;
        font-size: 10px;
        letter-spacing: 0.3em;
        color: var(--muted);
      }

      .hint {
        position: fixed;
        bottom: 28px;
        left: 34px;
        font-size: 10px;
        letter-spacing: 0.28em;
        color: #4a4e58;
        user-select: none;
        pointer-events: none;
        transition: opacity 1.2s ease;
      }

      .panel {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        z-index: 10;
        transition: opacity 0.6s ease;
      }
      .panel.hide {
        opacity: 0;
        pointer-events: none;
      }
      .panel .box {
        text-align: center;
        color: var(--fg);
      }
      .panel .box p {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.22em;
        margin-bottom: 22px;
        line-height: 2;
      }
      .panel button {
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.2em;
        color: var(--bg);
        background: var(--fg);
        border: 0;
        padding: 14px 30px;
        border-radius: 999px;
        cursor: pointer;
      }
      .err {
        color: #c98;
        font-size: 11px;
        letter-spacing: 0.1em;
        margin-top: 18px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <video id="video" playsinline muted></video>
    <canvas id="src"></canvas>

    <div class="hint" id="hint">MOVE TO INTERACT</div>

    <div class="panel" id="panel">
      <div class="box">
        <p>
          カメラ映像をリアルタイムでドット粒子に変換します<br />映像はこの端末内だけで処理され、どこにも送信されません
        </p>
        <button id="startBtn">カメラを起動</button>
        <div class="err" id="err"></div>
      </div>
    </div>

    <script type="module">
      import {
        ImageSegmenter,
        FilesetResolver,
      } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";

      const TEX = 256; // 256^2 = 65,536 particles
      const NUM = TEX * TEX;
      const GRID_W = 160; // ドット格子の横セル数（縦は映像比から算出）
      const BG = [0.047, 0.051, 0.063];
      const Z_DEPTH = 0.35; // ボクセル奥行き幅（world）

      const glc = document.getElementById("gl");
      const gl = glc.getContext("webgl2", {
        antialias: false,
        alpha: false,
        depth: true,
        preserveDrawingBuffer: true,
      });
      const errEl = document.getElementById("err");
      function fatal(msg) {
        errEl.textContent = msg;
      }
      if (!gl) {
        fatal("WebGL2 非対応のブラウザです");
      }
      if (gl && !gl.getExtension("EXT_color_buffer_float")) {
        fatal("float テクスチャ非対応です");
      }

      const video = document.getElementById("video");
      const srcCanvas = document.getElementById("src");
      const srcCtx = srcCanvas.getContext("2d", { willReadFrequently: true });

      let segmenter = null;
      let GRID_H = 112; // 後で映像比から再設定

      /* ---------- shader helpers ---------- */
      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(s));
          throw new Error("shader");
        }
        return s;
      }
      function program(vs, fs, tf) {
        const p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
        if (tf) gl.transformFeedbackVaryings(p, tf, gl.SEPARATE_ATTRIBS);
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
          console.error(gl.getProgramInfoLog(p));
          throw new Error("link");
        }
        return p;
      }

      const QUAD_VS = `#version 300 es
layout(location=0) in vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

      /* ---- simulation ----
   各粒子はグリッド上の担当セル(home)を持つ。home.w=lf（層番号 0=前面 1=奥）。
   毎フレーム人物テクスチャを参照し、life を人物/背景に応じて補間する。
   位置は常に home へバネ吸着。Z は lf × mask × Z_DEPTH でレリーフ奥行きを付ける。
*/
      const SIM_FS = `#version 300 es
precision highp float;
uniform sampler2D uState;   /* xyz=pos, w=mode */
uniform sampler2D uVel;     /* xyz=vel, w=life */
uniform sampler2D uHome;    /* xy=home cellpos(world), z=seed, w=lf(layer) */
uniform sampler2D uPerson;  /* RGB=映像色, A=マスク(人=1) */
uniform float uTime;
uniform float uDt;
uniform float uStep;
uniform vec2  uHalf;        /* world 半サイズ x,y */
uniform vec2  uMouse;
uniform float uPuff;        /* 0..1 拡散エンベロープ */
uniform float uCellW;
layout(location=0) out vec4 oState;
layout(location=1) out vec4 oVel;

vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+1.0)*x); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
  vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod289(i);
  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
  m=m*m; m=m*m;
  vec3 x=2.0*fract(p*C.www)-1.0; vec3 h=abs(x)-0.5; vec3 ox=floor(x+0.5); vec3 a0=x-ox;
  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.0*dot(m,g);
}
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy);
  vec4 st = texelFetch(uState, fc, 0);
  vec4 vl = texelFetch(uVel, fc, 0);
  vec4 hm = texelFetch(uHome, fc, 0);
  vec3 pos = st.xyz;
  float mode = st.w;
  vec3 vel = vl.xyz;
  float life = vl.w;
  vec2 home = hm.xy;
  float seed = hm.z;
  float lf = hm.w;   // 層番号 0=前面 1=奥

  /* home セルの uv（中心）→ 人物マスク参照 */
  vec2 uv = vec2(home.x / (2.0*uHalf.x) + 0.5, home.y / (2.0*uHalf.y) + 0.5);
  float mask = texture(uPerson, vec2(uv.x, 1.0 - uv.y)).a;
  bool person = mask > 0.5;

  vec3 force = vec3(0.0);

  /* life は「表示の濃さ」。人物セルなら 1 へ、背景セルなら 0 へなめらかに。
     位置は常に home（ボクセルレリーフZ）へバネ吸着。 */
  float targetLife = person ? 1.0 : 0.0;
  life += (targetLife - life) * (1.0 - pow(0.72, uStep));

  vec3 target = vec3(home, lf * mask * ${Z_DEPTH});
  force += (target - pos) * 10.0;

  /* ふわっと拡散：ゆっくり立ち上がる全方位の放射力。
     粒ごとの感度差(seed)と浮力で綿毛のようなムラと浮遊感を出す */
  if(uPuff > 0.003){
    vec3 dm = pos - vec3(uMouse, 0.12);
    float d = length(dm);
    float fall = exp(-d * d * 7.0);
    float sens = 0.55 + 0.9 * seed;
    vec3 dir = dm / max(d, 0.05);
    force += dir * fall * uPuff * 2.1 * sens;
    force += vec3(0.0, 0.22, 0.05) * fall * uPuff * sens;
  }

  vel = vel * pow(0.80, uStep) + force * uDt;
  float sp = length(vel);
  float cap = 0.05 * uStep;
  vel *= min(sp, cap) / max(sp, 1e-5);
  pos += vel;

  mode = 0.0;
  oState = vec4(pos, mode);
  oVel = vec4(vel, life);
}`;

      const PTS_VS = `#version 300 es
precision highp float;
uniform sampler2D uState;
uniform sampler2D uVel;
uniform sampler2D uHome;
uniform sampler2D uPerson;
uniform float uAspect;
uniform float uFit;
uniform float uPxPerWorld;
uniform float uCellW;
uniform float uFocal;
out vec4 vColor;
out float vSkip;

void main(){
  int id = gl_VertexID;
  ivec2 fc = ivec2(id % ${TEX}, id / ${TEX});
  vec4 st = texelFetch(uState, fc, 0);
  vec4 hm = texelFetch(uHome, fc, 0);
  vec3 pos = st.xyz;
  float life = texelFetch(uVel, fc, 0).w;
  vec2 home = hm.xy;
  float lf = hm.w;   // 層番号 0=前面 1=奥

  vec2 uv = vec2(home.x/(2.0*${"${HALFX}"}) + 0.5, home.y/(2.0*${"${HALFY}"}) + 0.5);
  vec4 ptex = texture(uPerson, vec2(uv.x, 1.0 - uv.y));

  vSkip = life < 0.04 ? 1.0 : 0.0;

  vec3 col = ptex.rgb;
  /* 奥の層ほど暗く（ボクセルの陰影） */
  col *= mix(1.0, 0.45, lf * lf);

  /* 透視投影 */
  float w = uFocal + pos.z;
  float s = uFocal / w;
  vec2 clip = vec2(pos.x * s * uFit / uAspect, pos.y * s * uFit);
  /* 深度値：前面(z=0)→near、奥面(z=Z_DEPTH)→far */
  float z01 = clamp(pos.z / (${Z_DEPTH} + 0.05), 0.0, 1.0);
  gl_Position = vec4(clip, z01 * 2.0 - 1.0, 1.0);

  vColor = vec4(col, 1.0);

  gl_PointSize = max(uCellW * uPxPerWorld * s * uFit * 1.02, 1.0);
}`;

      const PTS_FS = `#version 300 es
precision highp float;
in vec4 vColor;
in float vSkip;
out vec4 o;
void main(){
  if(vSkip > 0.5) discard;
  vec2 d = abs(gl_PointCoord - 0.5);
  float m = 1.0 - smoothstep(0.42, 0.5, max(d.x, d.y));
  if(m < 0.05) discard;
  o = vec4(vColor.rgb, m);
}`;

      const FADE_FS = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 o;
void main(){ o = uColor; }`;

      let started = false;
      document.getElementById("startBtn").addEventListener("click", start);

      async function start() {
        if (started) return;
        started = true;
        try {
          const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm",
          );
          const modelAssetPath =
            "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";
          const segmenterOptions = (delegate) => ({
            baseOptions: { modelAssetPath, delegate },
            runningMode: "VIDEO",
            outputCategoryMask: false,
            outputConfidenceMasks: true,
          });
          try {
            segmenter = await ImageSegmenter.createFromOptions(
              vision,
              segmenterOptions("GPU"),
            );
          } catch {
            segmenter = await ImageSegmenter.createFromOptions(
              vision,
              segmenterOptions("CPU"),
            );
          }

          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480, facingMode: "user" },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();

          document.getElementById("panel").classList.add("hide");
          setTimeout(
            () => (document.getElementById("hint").style.opacity = 0),
            4000,
          );
          boot();
        } catch (e) {
          console.error(e);
          fatal("起動に失敗しました：" + (e && e.message ? e.message : e));
          started = false;
        }
      }

      function boot() {
        /* 映像比からグリッド高さを確定 */
        const vAspect = video.videoWidth / video.videoHeight || 640 / 480;
        GRID_H = Math.round(GRID_W / vAspect);
        srcCanvas.width = GRID_W;
        srcCanvas.height = GRID_H;

        const HALFY = 0.9;
        const HALFX = HALFY * vAspect;
        const cellW = (2 * HALFX) / GRID_W;
        const FOCAL = 3.0;

        /* PTS_VS のプレースホルダを実値に置換してコンパイル */
        const ptsVsSrc = PTS_VS.replace("${HALFX}", HALFX.toFixed(5)).replace(
          "${HALFY}",
          HALFY.toFixed(5),
        );

        const simProg = program(QUAD_VS, SIM_FS);
        const ptsProg = program(ptsVsSrc, PTS_FS);
        const fadeProg = program(QUAD_VS, FADE_FS);
        const U = (p) => {
          const u = {};
          const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
          for (let i = 0; i < n; i++) {
            const info = gl.getActiveUniform(p, i);
            u[info.name] = gl.getUniformLocation(p, info.name);
          }
          return u;
        };
        const simU = U(simProg),
          ptsU = U(ptsProg),
          fadeU = U(fadeProg);

        /* ---- ホーム格子（各セルに K 層。余りは複製） ---- */
        const K = Math.max(1, Math.floor(NUM / (GRID_W * GRID_H)));
        const home = new Float32Array(NUM * 4);
        let n = 0;
        for (let gy = 0; gy < GRID_H && n < NUM; gy++) {
          for (let gx = 0; gx < GRID_W && n < NUM; gx++) {
            const u = (gx + 0.5) / GRID_W,
              v = (gy + 0.5) / GRID_H;
            const wx = (u - 0.5) * 2 * HALFX;
            const wy = (v - 0.5) * 2 * HALFY;
            for (let k = 0; k < K && n < NUM; k++) {
              const lf = K > 1 ? k / (K - 1) : 0;
              home[n * 4 + 0] = wx;
              home[n * 4 + 1] = wy;
              home[n * 4 + 2] = Math.random();
              home[n * 4 + 3] = lf;
              n++;
            }
          }
        }
        for (; n < NUM; n++) {
          const s = (Math.random() * n) | 0;
          home[n * 4] = home[s * 4];
          home[n * 4 + 1] = home[s * 4 + 1];
          home[n * 4 + 2] = Math.random();
          home[n * 4 + 3] = home[s * 4 + 3];
        }

        function makeTex(data) {
          const t = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, t);
          gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA32F,
            TEX,
            TEX,
            0,
            gl.RGBA,
            gl.FLOAT,
            data,
          );
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          return t;
        }
        const homeTex = makeTex(home);

        const st0 = new Float32Array(NUM * 4);
        for (let i = 0; i < NUM; i++) {
          st0[i * 4] = home[i * 4];
          st0[i * 4 + 1] = home[i * 4 + 1];
          st0[i * 4 + 2] = 0;
          st0[i * 4 + 3] = 0;
        }
        let stateA = makeTex(st0),
          stateB = makeTex(null);
        let velA = makeTex(new Float32Array(NUM * 4)),
          velB = makeTex(null);
        const fbo = gl.createFramebuffer();

        /* 人物テクスチャ（GRID解像度。RGB=映像, A=マスク） */
        const personTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, personTex);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA,
          GRID_W,
          GRID_H,
          0,
          gl.RGBA,
          gl.UNSIGNED_BYTE,
          null,
        );
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        const quadVAO = gl.createVertexArray();
        gl.bindVertexArray(quadVAO);
        const qb = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, qb);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW,
        );
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.bindVertexArray(null);
        const emptyVAO = gl.createVertexArray();

        /* マスク時間平滑化用バッファ */
        const personPix = new Uint8Array(GRID_W * GRID_H * 4);
        const maskSmooth = new Float32Array(GRID_W * GRID_H);

        let W = 0,
          H = 0,
          aspect = 1,
          fit = 1,
          pxPerWorld = 1;
        function resize() {
          const w = Math.floor(innerWidth * Math.min(devicePixelRatio || 1, 2));
          const h = Math.floor(
            innerHeight * Math.min(devicePixelRatio || 1, 2),
          );
          W = w;
          H = h;
          glc.width = W;
          glc.height = H;
          aspect = W / H;
          fit = Math.max(1 / HALFY, aspect / HALFX);
          pxPerWorld = H / 2;
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, W, H);
          gl.clearColor(BG[0], BG[1], BG[2], 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }
        addEventListener("resize", resize);
        resize();

        /* マウス（puff インタラクション） */
        const M = { x: 0, y: 0, sx: 0, sy: 0, has: false, moveAmt: 0 };
        addEventListener("pointermove", (e) => {
          const clipX = (e.clientX / innerWidth) * 2 - 1;
          const clipY = -((e.clientY / innerHeight) * 2 - 1);
          const wx = (clipX * aspect) / fit;
          const wy = clipY / fit;
          if (M.has) {
            M.moveAmt = Math.min(
              1.5,
              M.moveAmt + Math.hypot(wx - M.x, wy - M.y) * 2.2,
            );
          }
          M.x = wx;
          M.y = wy;
          M.has = true;
        });

        let puff = 0; // ゆっくり立ち上がり、ゆっくり消えるエンベロープ

        let t0 = performance.now(),
          lastNow = t0,
          lastVideoT = -1;

        function updatePerson(now) {
          if (video.readyState < 2) return;
          /* セグメンテーション（VIDEOモード） */
          let mask = null;
          try {
            const res = segmenter.segmentForVideo(video, now);
            if (res && res.confidenceMasks && res.confidenceMasks[0]) {
              mask = res.confidenceMasks[0].getAsFloat32Array(); // video解像度
              res.close && res.close();
            }
          } catch (e) {
            /* 一部フレームで失敗しても継続 */
          }

          /* 映像をGRID解像度に縮小して色取得（鏡像反転） */
          srcCtx.save();
          srcCtx.scale(-1, 1);
          srcCtx.drawImage(video, -GRID_W, 0, GRID_W, GRID_H);
          srcCtx.restore();
          const img = srcCtx.getImageData(0, 0, GRID_W, GRID_H).data;

          /* マスクをGRIDへダウンサンプル（最近傍）＋時間平滑化＋鏡像 */
          const mw = video.videoWidth,
            mh = video.videoHeight;
          for (let gy = 0; gy < GRID_H; gy++) {
            for (let gx = 0; gx < GRID_W; gx++) {
              let mv = 0.0;
              if (mask) {
                const sx = Math.min(
                  mw - 1,
                  (((GRID_W - 1 - gx + 0.5) / GRID_W) * mw) | 0,
                ); // 横反転
                const sy = Math.min(mh - 1, (((gy + 0.5) / GRID_H) * mh) | 0);
                mv = mask[sy * mw + sx];
              }
              const gi = gy * GRID_W + gx;
              maskSmooth[gi] += (mv - maskSmooth[gi]) * 0.35; // テンポラル平滑化
              const di = gi * 4,
                si = gi * 4;
              // ドット絵デフォルメ：各チャンネルを6段に量子化＋軽く彩度を上げる
              let r = img[si],
                g = img[si + 1],
                b = img[si + 2];
              const mx = Math.max(r, g, b),
                mn = Math.min(r, g, b),
                avg = (r + g + b) / 3;
              const SAT = 1.25;
              r = avg + (r - avg) * SAT;
              g = avg + (g - avg) * SAT;
              b = avg + (b - avg) * SAT;
              const Q = 42; // 量子化ステップ（大きいほどカクっと）
              r = Math.min(255, Math.max(0, Math.round(r / Q) * Q));
              g = Math.min(255, Math.max(0, Math.round(g / Q) * Q));
              b = Math.min(255, Math.max(0, Math.round(b / Q) * Q));
              personPix[di] = r;
              personPix[di + 1] = g;
              personPix[di + 2] = b;
              personPix[di + 3] =
                maskSmooth[gi] > 0.45 ? 255 : Math.floor(maskSmooth[gi] * 255);
            }
          }
          gl.bindTexture(gl.TEXTURE_2D, personTex);
          gl.texSubImage2D(
            gl.TEXTURE_2D,
            0,
            0,
            0,
            GRID_W,
            GRID_H,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            personPix,
          );
        }

        function frame(now) {
          const time = (now - t0) / 1000;
          const rawDt = Math.min((now - lastNow) / 1000, 0.1);
          lastNow = now;
          const dt = Math.max(rawDt, 1 / 240);
          const step = dt * 60;

          /* puff エンベロープ: attack ~0.5s / release ~2.2s */
          const puffTarget = Math.min(1, M.moveAmt);
          M.moveAmt *= Math.pow(0.25, dt);
          const puffRate =
            puffTarget > puff ? 1 - Math.pow(0.08, dt) : 1 - Math.pow(0.55, dt);
          puff += (puffTarget - puff) * puffRate;

          /* スムーズポインタ（拡散の中心） */
          const k = 1 - Math.pow(0.004, dt);
          M.sx += (M.x - M.sx) * k;
          M.sy += (M.y - M.sy) * k;

          if (video.currentTime !== lastVideoT) {
            updatePerson(now);
            lastVideoT = video.currentTime;
          }

          /* simulate */
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(
            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT0,
            gl.TEXTURE_2D,
            stateB,
            0,
          );
          gl.framebufferTexture2D(
            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT1,
            gl.TEXTURE_2D,
            velB,
            0,
          );
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
          gl.viewport(0, 0, TEX, TEX);
          gl.disable(gl.BLEND);
          gl.disable(gl.DEPTH_TEST);
          gl.useProgram(simProg);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, stateA);
          gl.uniform1i(simU.uState, 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, velA);
          gl.uniform1i(simU.uVel, 1);
          gl.activeTexture(gl.TEXTURE2);
          gl.bindTexture(gl.TEXTURE_2D, homeTex);
          gl.uniform1i(simU.uHome, 2);
          gl.activeTexture(gl.TEXTURE3);
          gl.bindTexture(gl.TEXTURE_2D, personTex);
          gl.uniform1i(simU.uPerson, 3);
          gl.uniform1f(simU.uTime, time);
          gl.uniform1f(simU.uDt, dt);
          gl.uniform1f(simU.uStep, step);
          gl.uniform2f(simU.uHalf, HALFX, HALFY);
          gl.uniform2f(simU.uMouse, M.sx, M.sy);
          gl.uniform1f(simU.uPuff, M.has ? puff : 0);
          gl.uniform1f(simU.uCellW, cellW);
          gl.bindVertexArray(quadVAO);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          let ts = stateA;
          stateA = stateB;
          stateB = ts;
          let tv = velA;
          velA = velB;
          velB = tv;

          /* 背景クリア（残像なし・こぼれ落ちなしのクリーンな表示） */
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, W, H);
          gl.clearColor(BG[0], BG[1], BG[2], 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

          /* points（深度テストで前面レイヤーが後面を正しく隠す） */
          gl.enable(gl.DEPTH_TEST);
          gl.depthFunc(gl.LEQUAL);
          gl.useProgram(ptsProg);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, stateA);
          gl.uniform1i(ptsU.uState, 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, velA);
          gl.uniform1i(ptsU.uVel, 1);
          gl.activeTexture(gl.TEXTURE2);
          gl.bindTexture(gl.TEXTURE_2D, homeTex);
          gl.uniform1i(ptsU.uHome, 2);
          gl.activeTexture(gl.TEXTURE3);
          gl.bindTexture(gl.TEXTURE_2D, personTex);
          gl.uniform1i(ptsU.uPerson, 3);
          gl.uniform1f(ptsU.uAspect, aspect);
          gl.uniform1f(ptsU.uFit, fit);
          gl.uniform1f(ptsU.uPxPerWorld, pxPerWorld);
          gl.uniform1f(ptsU.uCellW, cellW);
          gl.uniform1f(ptsU.uFocal, FOCAL);
          gl.bindVertexArray(emptyVAO);
          gl.drawArrays(gl.POINTS, 0, NUM);
          gl.bindVertexArray(null);
          gl.disable(gl.DEPTH_TEST);

          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
    </script>
  </body>
