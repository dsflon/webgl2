<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水墨画 — PARTICLE</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f0ede8;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9a968e;
        font-size: 11px;
        letter-spacing: 0.32em;
        background: #f0ede8;
        transition: opacity 0.8s ease;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        pointer-events: none;
        z-index: 10;
      }
      .loading.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div class="loading" id="loading">LOADING</div>
    <script>
      // ─────────────────────────────────────────────
      // CONFIG
      // ─────────────────────────────────────────────
      const TEX = 1024; // TEX² = 1,048,576 particles
      const NUM = TEX * TEX;

      // ─────────────────────────────────────────────
      // WEBGL2 INIT
      // ─────────────────────────────────────────────
      const canvas = document.getElementById("gl");
      const gl = canvas.getContext("webgl2", {
        antialias: true,
        preserveDrawingBuffer: false,
      });
      if (!gl) {
        document.getElementById("loading").textContent = "WebGL2 not supported";
        throw new Error("no webgl2");
      }
      const extCBF = gl.getExtension("EXT_color_buffer_float");
      if (!extCBF) {
        document.getElementById("loading").textContent =
          "EXT_color_buffer_float not supported";
        throw new Error("no float fb");
      }

      // ─────────────────────────────────────────────
      // SHADERS
      // ─────────────────────────────────────────────

      // Fullscreen quad VS (shared by physics passes)
      const vsQuad = `#version 300 es
layout(location=0) in vec2 a_pos;
out vec2 v_uv;
void main() { v_uv = a_pos * .5 + .5; gl_Position = vec4(a_pos, 0., 1.); }`;

      // Velocity update FS — ds.html style: puff envelope + drift noise
      const fsVel = `#version 300 es
precision highp float;
uniform sampler2D u_pos;
uniform sampler2D u_vel;
uniform sampler2D u_home1;
uniform sampler2D u_home2;
uniform float u_imgBlend; // home position blend 0=img1, 1=img2
uniform float u_chaos;   // 0..1 turbulence strength (sin curve during transition)
uniform vec2  u_mouse;   // smooth mouse in image UV
uniform float u_puff;    // 0..1 envelope driven by mouse movement
uniform float u_springK;
uniform float u_damp;
uniform float u_dt;
uniform float u_step;    // dt * 60
uniform float u_time;
out vec4 o;

// 2D simplex noise
vec3 mod289v(vec3 x){ return x - floor(x*(1./289.))*289.; }
vec2 mod289v(vec2 x){ return x - floor(x*(1./289.))*289.; }
vec3 permute(vec3 x){ return mod289v(((x*34.)+1.)*x); }
float snoise(vec2 v){
  const vec4 C = vec4(.211324865,.366025403,-.577350269,.024390243);
  vec2 i  = floor(v + dot(v,C.yy));
  vec2 x0 = v - i + dot(i,C.xx);
  vec2 i1  = x0.x>x0.y ? vec2(1,0) : vec2(0,1);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
  i = mod289v(i);
  vec3 p = permute(permute(i.y+vec3(0,i1.y,1))+i.x+vec3(0,i1.x,1));
  vec3 m = max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);
  m=m*m; m=m*m;
  vec3 x2 = 2.*fract(p*C.www)-1., h=abs(x2)-.5, ox=floor(x2+.5), a0=x2-ox;
  m *= 1.79284291-.85373472*(a0*a0+h*h);
  vec3 gv; gv.x=a0.x*x0.x+h.x*x0.y; gv.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.*dot(m,gv);
}

void main() {
  ivec2 fc   = ivec2(gl_FragCoord.xy);
  vec2  pos  = texelFetch(u_pos,  fc, 0).xy;
  vec2  vel  = texelFetch(u_vel,  fc, 0).xy;
  vec4  hd1  = texelFetch(u_home1, fc, 0);
  vec4  hd2  = texelFetch(u_home2, fc, 0);
  vec2  home = mix(hd1.xy, hd2.xy, u_imgBlend);
  float seed = hd1.w;

  // Spring toward home (always fully active)
  vec2 force = (home - pos) * u_springK;

  if (u_chaos > 0.01) {
    // Ghost mice: 4 points orbiting the image with different frequencies/phases.
    // Uses the exact same puff formula as real mouse interaction → same organic feel.
    float ct = u_time * 1.8;
    vec2 g0 = vec2(0.5 + cos(ct * 1.00)        * 0.40, 0.5 + sin(ct * 1.30)        * 0.36);
    vec2 g1 = vec2(0.5 + cos(ct * 1.70 + 1.57) * 0.36, 0.5 + sin(ct * 1.10 + 1.57) * 0.40);
    vec2 g2 = vec2(0.5 + cos(ct * 1.30 + 3.14) * 0.38, 0.5 + sin(ct * 1.90 + 3.14) * 0.30);
    vec2 g3 = vec2(0.5 + cos(ct * 2.10 + 4.71) * 0.30, 0.5 + sin(ct * 1.50 + 4.71) * 0.38);

    vec2 ghosts[4];
    ghosts[0] = g0; ghosts[1] = g1; ghosts[2] = g2; ghosts[3] = g3;

    float sens = 0.55 + 0.9 * seed;
    for (int k = 0; k < 4; k++) {
      vec2  dm   = pos - ghosts[k];
      float d    = length(dm);
      float fall = exp(-d * d * 20.0);
      vec2  dir  = dm / max(d, 0.02);
      force += dir * fall * u_chaos * 2.8 * sens;
    }
  } else if (u_puff > 0.003) {
    vec2  dm   = pos - u_mouse;
    float d    = length(dm);
    float fall = exp(-d * d * 35.0);
    float sens = 0.55 + 0.9 * seed;
    vec2  dir  = dm / max(d, 0.02);
    force += dir * fall * u_puff * 2.1 * sens;
  }

  // Drift noise while displaced — weakened during convergence to reduce vortexing
  float disp = clamp(length(pos - home) * 5.0, 0.0, 1.0);
  if (disp > 0.01) {
    vec2 sw = vec2(
      snoise(pos * 4.0 + vec2(u_time * 0.10, seed * 7.0)),
      snoise(pos.yx * 4.0 - vec2(u_time * 0.08, seed * 3.0)));
    float driftAmt = 0.08 + u_chaos * 0.22;
    force += sw * disp * driftAmt;
  }

  vel = vel * u_damp + force * u_dt;

  float sp  = length(vel);
  float cap = 0.012 * u_step;
  vel *= min(sp, cap) / max(sp, 1e-5);

  o = vec4(vel, 0., 1.);
}`;

      // Position update FS — fixed-step like ds.html: pos += vel (no *dt)
      const fsPos = `#version 300 es
precision highp float;
uniform sampler2D u_pos;
uniform sampler2D u_vel;
out vec4 o;
void main() {
  ivec2 fc = ivec2(gl_FragCoord.xy);
  vec2 pos = texelFetch(u_pos, fc, 0).xy;
  vec2 vel = texelFetch(u_vel, fc, 0).xy;
  o = vec4(pos + vel, 0., 1.);
}`;

      // Particle VS — reads position texture by ID, outputs clip position + color
      const vsParticle = `#version 300 es
precision highp float;
layout(location=0) in float a_id;
uniform sampler2D u_pos;
uniform sampler2D u_col1;
uniform sampler2D u_col2;
uniform float     u_imgBlend;
uniform vec2      u_imgOff;    // contain-fit: offset (UV)
uniform vec2      u_imgScale;  // contain-fit: scale (UV)
uniform float     u_ptSize;    // base point size (physical px)
out vec4 v_col;
void main() {
  int   id  = int(a_id);
  ivec2 fc  = ivec2(id % ${TEX}, id / ${TEX});
  v_col = mix(texelFetch(u_col1, fc, 0), texelFetch(u_col2, fc, 0), u_imgBlend);

  // Cull invisible particles (push off-screen)
  if (v_col.a < 0.02) { gl_Position = vec4(9., 9., 0., 1.); gl_PointSize = 0.; return; }

  vec2 pos = texelFetch(u_pos, fc, 0).xy;

  // Image UV → screen UV → NDC  (image Y=0 is top; NDC Y=1 is top)
  vec2 suv  = u_imgOff + pos * u_imgScale;
  vec2 clip = suv * 2.0 - 1.0;
  clip.y    = -clip.y;

  gl_Position  = vec4(clip, 0., 1.);

  // Per-particle size jitter (hash on id, no extra texture)
  float rnd    = fract(sin(float(id) * 0.31758) * 43758.5453);
  gl_PointSize = u_ptSize * (0.9 + rnd * 0.2);
}`;

      // Particle FS — soft circular ink dot
      const fsParticle = `#version 300 es
precision mediump float;
in vec4  v_col;
out vec4 o;
void main() {
  vec2  d  = gl_PointCoord - .5;
  float r2 = dot(d, d);
  float a  = exp(-r2 * 7.0) * v_col.a;
  if (a < 0.01) discard;
  o = vec4(v_col.rgb, a);
}`;

      // ─────────────────────────────────────────────
      // GL HELPERS
      // ─────────────────────────────────────────────
      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          throw new Error(
            gl.getShaderInfoLog(s) + "\n---\n" + src.slice(0, 400),
          );
        return s;
      }

      function mkProg(vs, fs) {
        const p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS))
          throw new Error(gl.getProgramInfoLog(p));
        const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
        p.u = {};
        for (let i = 0; i < n; i++) {
          const info = gl.getActiveUniform(p, i);
          p.u[info.name] = gl.getUniformLocation(p, info.name);
        }
        return p;
      }

      function mkTex32F(w, h, data) {
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA32F,
          w,
          h,
          0,
          gl.RGBA,
          gl.FLOAT,
          data ?? null,
        );
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return t;
      }

      function mkFBO(tex) {
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(
          gl.FRAMEBUFFER,
          gl.COLOR_ATTACHMENT0,
          gl.TEXTURE_2D,
          tex,
          0,
        );
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return fb;
      }

      // ─────────────────────────────────────────────
      // COMPILE PROGRAMS
      // ─────────────────────────────────────────────
      const progVel = mkProg(vsQuad, fsVel);
      const progPos = mkProg(vsQuad, fsPos);
      const progPts = mkProg(vsParticle, fsParticle);

      // ─────────────────────────────────────────────
      // VAOs
      // ─────────────────────────────────────────────

      // Fullscreen quad (for physics passes)
      const quadVAO = gl.createVertexArray();
      gl.bindVertexArray(quadVAO);
      {
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW,
        );
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      }

      // Particle IDs (one float per particle)
      const ptsVAO = gl.createVertexArray();
      gl.bindVertexArray(ptsVAO);
      {
        const ids = new Float32Array(NUM);
        for (let i = 0; i < NUM; i++) ids[i] = i;
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, ids, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);
      }

      function drawQuad() {
        gl.bindVertexArray(quadVAO);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      // ─────────────────────────────────────────────
      // MAIN
      // ─────────────────────────────────────────────
      async function init() {
        // Load both images in parallel
        function loadImg(src) {
          return new Promise((res, rej) => {
            const el = new Image();
            el.onload = () => res(el);
            el.onerror = rej;
            el.src = src;
          });
        }
        const imgs = await Promise.all([
          loadImg("image_saito.png"),
          loadImg("image_naya.png"),
          loadImg("image_asano.png"),
          loadImg("image_suzuki.png"),
        ]);

        // Compute contain-fit params for a given image and canvas size
        function computeFit(iW, iH, cW, cH) {
          const s = Math.max(cW / iW, cH / iH);
          const dW = iW * s,
            dH = iH * s;
          return {
            offX: (cW - dW) / (2 * cW),
            offY: (cH - dH) / (2 * cH),
            scaleX: dW / cW,
            scaleY: dH / cH,
          };
        }

        // Sample an image into home+color Float32 arrays
        function buildData(img) {
          const oc = document.createElement("canvas");
          oc.width = TEX;
          oc.height = TEX;
          const ctx2d = oc.getContext("2d");
          ctx2d.drawImage(img, 0, 0, TEX, TEX);
          const px = ctx2d.getImageData(0, 0, TEX, TEX).data;
          const homeData = new Float32Array(NUM * 4);
          const colorData = new Float32Array(NUM * 4);
          for (let j = 0; j < TEX; j++) {
            for (let i = 0; i < TEX; i++) {
              const idx = j * TEX + i;
              const p = idx * 4;
              const r = px[p] / 255;
              const g = px[p + 1] / 255;
              const b = px[p + 2] / 255;
              const a = px[p + 3] / 255;
              const lum = 0.299 * r + 0.587 * g + 0.114 * b;
              const ink = 1.0 - lum;
              const x = (i + Math.random()) / TEX;
              const y = (j + Math.random()) / TEX;
              homeData[idx * 4 + 0] = x;
              homeData[idx * 4 + 1] = y;
              homeData[idx * 4 + 2] = 0.0;
              homeData[idx * 4 + 3] = Math.random();
              const noise = 0.75 + Math.random() * 0.5;
              colorData[idx * 4 + 0] = 0.06;
              colorData[idx * 4 + 1] = 0.05;
              colorData[idx * 4 + 2] = 0.08;
              const isWhite = r > 0.97 && g > 0.97 && b > 0.97;
              colorData[idx * 4 + 3] = isWhite
                ? 0.0
                : Math.min(1.0, Math.pow(ink, 0.4) * noise * 1.4) * a;
            }
          }
          return { homeData, colorData };
        }

        const datasets = imgs.map((img) => buildData(img));
        const homeTexes = datasets.map((d) => mkTex32F(TEX, TEX, d.homeData));
        const colTexes = datasets.map((d) => mkTex32F(TEX, TEX, d.colorData));

        // Physics textures (ping-pong)
        const posTexA = mkTex32F(TEX, TEX, datasets[0].homeData); // start at img0 home
        const posTexB = mkTex32F(TEX, TEX, null);
        const velTexA = mkTex32F(TEX, TEX, null); // zero velocity initially
        const velTexB = mkTex32F(TEX, TEX, null);

        const posFbA = mkFBO(posTexA),
          posFbB = mkFBO(posTexB);
        const velFbA = mkFBO(velTexA),
          velFbB = mkFBO(velTexB);

        let posR = posTexA,
          posW = posTexB,
          posFbR = posFbA,
          posFbW = posFbB;
        let velR = velTexA,
          velW = velTexB,
          velFbR = velFbA,
          velFbW = velFbB;

        // ─── Contain-fit geometry ──────────────────
        let W = 1,
          H = 1;
        let fits = imgs.map(() => ({ offX: 0, offY: 0, scaleX: 1, scaleY: 1 }));

        function resize() {
          W = (canvas.clientWidth * devicePixelRatio) | 0;
          H = (canvas.clientHeight * devicePixelRatio) | 0;
          canvas.width = W;
          canvas.height = H;
          fits = imgs.map((img) =>
            computeFit(img.naturalWidth, img.naturalHeight, W, H),
          );
        }
        resize();
        window.addEventListener("resize", resize);

        // ─── Input state (ds.html style) ──────────
        // M.x/y: actual mouse in image UV
        // M.sx/sy: smoothed mouse (lags behind)
        // M.moveAmt: accumulates movement, drives puff
        const M = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5, has: false, moveAmt: 0 };
        let puff = 0; // slowly rising/falling envelope 0..1

        // Image cycling: current → next → finalize → repeat
        let transT = -1.0; // -1=idle, 0..1=transitioning
        let currentIdx = 0;
        let nextIdx = 0;
        let imgBlend = 0.0;

        function switchImage() {
          if (transT >= 0) return;
          nextIdx = (currentIdx + 1) % imgs.length;
          imgBlend = 0.0;
          transT = 0.0;
        }

        // Desktop click (skip if mouse moved → puff interaction)
        canvas.addEventListener("click", () => switchImage());

        // Mobile tap: touchend without significant movement
        let touchStartX = 0,
          touchStartY = 0;
        canvas.addEventListener(
          "touchstart",
          (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          },
          { passive: true },
        );
        canvas.addEventListener(
          "touchend",
          (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.hypot(dx, dy) < 10) switchImage();
          },
          { passive: true },
        );

        function toImgUV(cx, cy) {
          const f = fits[currentIdx];
          const px = (cx * devicePixelRatio) / W;
          const py = (cy * devicePixelRatio) / H;
          return {
            x: (px - f.offX) / f.scaleX,
            y: (py - f.offY) / f.scaleY,
          };
        }

        function onPointerMove(cx, cy) {
          const uv = toImgUV(cx, cy);
          if (M.has) {
            // Scale UV delta to match ds.html's world-space sensitivity
            M.moveAmt = Math.min(
              1.5,
              M.moveAmt + Math.hypot(uv.x - M.x, uv.y - M.y) * 8.0,
            );
          }
          M.x = uv.x;
          M.y = uv.y;
          M.has = true;
        }

        // Desktop
        canvas.addEventListener("pointermove", (e) => {
          if (e.pointerType !== "touch") onPointerMove(e.clientX, e.clientY);
        });
        canvas.addEventListener("pointerdown", (e) => {
          if (e.pointerType !== "touch") onPointerMove(e.clientX, e.clientY);
        });
        canvas.addEventListener("pointerleave", (e) => {
          if (e.pointerType !== "touch") M.has = false;
        });

        // Mobile touch
        canvas.addEventListener(
          "touchmove",
          (e) => {
            e.preventDefault();
            onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
          },
          { passive: false },
        );
        canvas.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
          },
          { passive: false },
        );
        canvas.addEventListener(
          "touchend",
          () => {
            M.has = false;
          },
          { passive: false },
        );

        // ─── Render loop ───────────────────────────
        let lastT = null;
        let totalTime = 0;
        document.getElementById("loading").classList.add("done");

        function frame(ts) {
          requestAnimationFrame(frame);
          if (!lastT) {
            lastT = ts;
            return;
          }
          const dt = Math.min((ts - lastT) / 1000, 0.05);
          lastT = ts;
          totalTime += dt;
          const step = dt * 60;

          // puff envelope: attack ~0.5s / release ~2.2s
          const target = Math.min(1, M.moveAmt);
          M.moveAmt *= Math.pow(0.25, dt);
          const rate =
            target > puff ? 1 - Math.pow(0.08, dt) : 1 - Math.pow(0.55, dt);
          puff += (target - puff) * rate;

          // smooth mouse follower
          const k = 1 - Math.pow(0.004, dt);
          M.sx += (M.x - M.sx) * k;
          M.sy += (M.y - M.sy) * k;

          const damp = Math.pow(0.93, step);

          // Transition: chaos rises and falls over 1.4s on a sin curve
          let chaos = 0.0;
          if (transT >= 0) {
            transT = Math.min(1.0, transT + dt / 1.4);
            chaos = Math.sin(transT * Math.PI);
            imgBlend += (1.0 - imgBlend) * Math.min(1, dt * 1.2);
            if (transT >= 1.0) {
              // Finalize before rendering: advance current, reset blend
              currentIdx = nextIdx;
              imgBlend = 0.0;
              chaos = 0.0;
              transT = -1.0;
            }
          }

          // ── Velocity update ───────────────────────
          gl.bindFramebuffer(gl.FRAMEBUFFER, velFbW);
          gl.viewport(0, 0, TEX, TEX);
          gl.useProgram(progVel);

          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, posR);
          gl.uniform1i(progVel.u["u_pos"], 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, velR);
          gl.uniform1i(progVel.u["u_vel"], 1);
          gl.activeTexture(gl.TEXTURE2);
          gl.bindTexture(gl.TEXTURE_2D, homeTexes[currentIdx]);
          gl.uniform1i(progVel.u["u_home1"], 2);
          gl.activeTexture(gl.TEXTURE3);
          gl.bindTexture(gl.TEXTURE_2D, homeTexes[nextIdx]);
          gl.uniform1i(progVel.u["u_home2"], 3);
          gl.uniform1f(progVel.u["u_imgBlend"], imgBlend);
          gl.uniform1f(progVel.u["u_chaos"], chaos);

          gl.uniform2f(progVel.u["u_mouse"], M.sx, M.sy);
          gl.uniform1f(progVel.u["u_puff"], M.has ? puff : 0);
          gl.uniform1f(progVel.u["u_springK"], 2.4);
          gl.uniform1f(progVel.u["u_damp"], damp);
          gl.uniform1f(progVel.u["u_dt"], dt);
          gl.uniform1f(progVel.u["u_step"], step);
          gl.uniform1f(progVel.u["u_time"], totalTime);

          drawQuad();
          [velR, velW, velFbR, velFbW] = [velW, velR, velFbW, velFbR];

          // ── Position update ───────────────────────
          gl.bindFramebuffer(gl.FRAMEBUFFER, posFbW);
          gl.viewport(0, 0, TEX, TEX);
          gl.useProgram(progPos);

          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, posR);
          gl.uniform1i(progPos.u["u_pos"], 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, velR);
          gl.uniform1i(progPos.u["u_vel"], 1);

          drawQuad();
          [posR, posW, posFbR, posFbW] = [posW, posR, posFbW, posFbR];

          // ── Render particles ──────────────────────
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, W, H);
          gl.clearColor(240 / 255, 237 / 255, 232 / 255, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);

          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          gl.useProgram(progPts);

          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, posR);
          gl.uniform1i(progPts.u["u_pos"], 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, colTexes[currentIdx]);
          gl.uniform1i(progPts.u["u_col1"], 1);
          gl.activeTexture(gl.TEXTURE2);
          gl.bindTexture(gl.TEXTURE_2D, colTexes[nextIdx]);
          gl.uniform1i(progPts.u["u_col2"], 2);
          gl.uniform1f(progPts.u["u_imgBlend"], imgBlend);

          const t = imgBlend;
          const cf = fits[currentIdx];
          const nf = fits[nextIdx];
          const curOffX = cf.offX + (nf.offX - cf.offX) * t;
          const curOffY = cf.offY + (nf.offY - cf.offY) * t;
          const curScaleX = cf.scaleX + (nf.scaleX - cf.scaleX) * t;
          const curScaleY = cf.scaleY + (nf.scaleY - cf.scaleY) * t;
          gl.uniform2f(progPts.u["u_imgOff"], curOffX, curOffY);
          gl.uniform2f(progPts.u["u_imgScale"], curScaleX, curScaleY);

          // Point size: ~2x cell spacing for dense, gapless coverage
          const cellPx = Math.min(curScaleX * W, curScaleY * H) / TEX;
          gl.uniform1f(
            progPts.u["u_ptSize"],
            Math.max(2.0, Math.min(cellPx * 3.5, 9.0)),
          );

          gl.bindVertexArray(ptsVAO);
          gl.drawArrays(gl.POINTS, 0, NUM);
          gl.disable(gl.BLEND);
        }

        requestAnimationFrame(frame);
      }

      init().catch((e) => {
        console.error(e);
        const el = document.getElementById("loading");
        el.textContent = "ERROR: " + (e.message || e);
        el.style.opacity = "1";
        el.style.pointerEvents = "none";
      });
    </script>
  </body>
</html>
