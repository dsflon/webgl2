<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORTRAIT IN FLUX — VOXEL</title>
<style>
  :root{
    --ink:#3A3733;
    --muted:#9A968E;
    --bg:#F1F0EC;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{
    font-family:"Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;width:100%;height:100%;cursor:crosshair;}

  .caption{
    position:fixed; top:30px; left:34px;
    user-select:none; pointer-events:none;
  }
  .caption .en{
    font-size:12px; font-weight:700; letter-spacing:.38em; color:var(--ink);
  }
  .caption .jp{
    margin-top:6px;
    font-size:10px; letter-spacing:.30em; color:var(--muted);
  }

  .hint{
    position:fixed; bottom:28px; left:34px;
    font-size:10px; letter-spacing:.28em; color:#B9B5AC;
    user-select:none; pointer-events:none;
    transition:opacity 1.2s ease;
  }

  .loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:11px; letter-spacing:.32em;
    background:var(--bg);
    transition:opacity .8s ease;
    pointer-events:none; z-index:10;
  }
  .loading.done{opacity:0;}

  .fallback{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center; text-align:center;
    color:var(--ink); padding:32px; line-height:2;
    font-size:13px; letter-spacing:.08em;
  }
  @media (max-width:640px){
    .caption{top:20px;left:20px;}
    .hint{bottom:20px;left:20px;}
  }
</style>
</head>

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s)); throw new Error('shader');
  }
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p)); throw new Error('link');
  }
  return p;
}

const QUAD_VS = `#version 300 es
layout(location=0) in vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

/* ---------- simulation (MRT: pos / vel) ---------- */
const SIM_FS = `#version 300 es
precision highp float;
uniform sampler2D uPos;     /* xyz = pos, w = rand seed */
uniform sampler2D uVel;     /* xyz = vel */
uniform sampler2D uHome;    /* xyz = home, w = rand seed */
uniform float uTime;
uniform float uDt;
uniform float uStep;
uniform float uDamp;
uniform vec2  uMouse;       /* world xy (z=0 平面) */
uniform float uPuff;        /* 0..1 拡散エンベロープ（JSでゆっくり立上げ/減衰） */
layout(location=0) out vec4 oPos;
layout(location=1) out vec4 oVel;

vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec2 mod289(vec2 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+1.0)*x); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy);
  vec4 ps = texelFetch(uPos, fc, 0);
  vec3 pos = ps.xyz;
  float seed = ps.w;
  vec3 vel = texelFetch(uVel, fc, 0).xyz;
  vec3 home = texelFetch(uHome, fc, 0).xyz;

  /* --- 弱いスプリング：ゆっくり還る --- */
  vec3 force = (home - pos) * 2.4;

  /* --- ふわっと拡散：
     方向性の衝撃ではなく、カーソル近傍に「ゆっくり立ち上がる
     全方位の放射力」。粒ごとの感度差（seed）と微弱な浮力で
     綿毛のようなムラと浮遊感を出す --- */
  if(uPuff > 0.003){
    vec3 dm = pos - vec3(uMouse, 0.12);          /* 少し手前から押す */
    float d = length(dm);
    float fall = exp(-d * d * 7.0);
    float sens = 0.55 + 0.9 * seed;              /* 粒ごとの感度 */
    vec3 dir = dm / max(d, 0.05);
    force += dir * fall * uPuff * 2.1 * sens;
    force += vec3(0.0, 0.22, 0.05) * fall * uPuff * sens;  /* 浮力 */
  }

  /* --- 漂い：ホームから離れている間だけ、ごく遅い渦に乗る --- */
  float disp = clamp(length(pos - home) * 2.5, 0.0, 1.0);
  if(disp > 0.01){
    vec2 sw = vec2(
      snoise(pos.xy * 1.6 + vec2(uTime * 0.10, seed * 7.0)),
      snoise(pos.yx * 1.6 - vec2(uTime * 0.08, seed * 3.0)));
    float swz = snoise(pos.xz * 2.0 + vec2(seed * 11.0, uTime * 0.07));
    force += vec3(sw, swz * 0.6) * disp * 0.30;
  }

  /* --- 静止時のかすかな呼吸（Z方向に揺れて奥行きが息づく） --- */
  force.z += sin(uTime * 0.7 + seed * 6.2831) * 0.004;

  vel = vel * uDamp + force * uDt;
  float sp = length(vel);
  float cap = 0.030 * uStep;                      /* ゆっくり＝ふわっ */
  vel *= min(sp, cap) / max(sp, 1e-5);
  pos += vel;

  oPos = vec4(pos, seed);
  oVel = vec4(vel, 0.0);
}`;

/* ---------- render: depth-tested square dots ---------- */
const PTS_VS = `#version 300 es
precision highp float;
uniform sampler2D uPos;
uniform sampler2D uHomeUV;   /* xy=uv, z=layerFrac */
uniform sampler2D uGrid;     /* ドット絵（NEAREST） */
uniform float uAspect;
uniform float uFit;
uniform float uPxPerWorld;   /* z=0 平面での px/world */
uniform float uCellW;        /* セルの world 幅 */
uniform vec2  uSway;         /* カメラ yaw, pitch */
out vec4 vColor;

const float FOCAL = ${FOCAL.toFixed(2)};
const float ZMID  = ${(Z_DEPTH * 0.5).toFixed(3)};

void main(){
  int id = gl_VertexID;
  ivec2 fc = ivec2(id % ${TEX}, id / ${TEX});
  vec3 pos = texelFetch(uPos, fc, 0).xyz;
  vec4 h = texelFetch(uHomeUV, fc, 0);
  vec3 col = texture(uGrid, h.xy).rgb;
  float layer = h.z;          /* 0=最前面, 1=最奥 */

  /* --- カメラスウェイ：図像中心まわりの微小回転 --- */
  vec3 p = pos - vec3(0.0, 0.0, ZMID);
  float cy = cos(uSway.x), sy = sin(uSway.x);
  p = vec3(cy*p.x + sy*p.z, p.y, -sy*p.x + cy*p.z);
  float cx = cos(uSway.y), sx = sin(uSway.y);
  p = vec3(p.x, cx*p.y - sx*p.z, sx*p.y + cx*p.z);
  p.z += ZMID;

  /* --- 透視投影 --- */
  float w = FOCAL + p.z;
  float s = FOCAL / w;
  vec2 clip = vec2(p.x * s * uFit / uAspect, p.y * s * uFit);
  float z01 = clamp((p.z + 0.8) / 2.4, 0.0, 1.0);
  gl_Position = vec4(clip, z01 * 2.0 - 1.0, 1.0);

  /* --- 奥の層ほど暗く（ボクセルの陰影） --- */
  float shade = mix(1.0, 0.42, pow(layer, 0.8));
  vColor = vec4(col * shade, 1.0);

  gl_PointSize = max(uCellW * uPxPerWorld * s * uFit * 1.04, 1.0);
}`;

const PTS_FS = `#version 300 es
precision highp float;
in vec4 vColor;
out vec4 o;
void main(){
  vec2 d = abs(gl_PointCoord - 0.5);
  float m = 1.0 - smoothstep(0.44, 0.50, max(d.x, d.y));   /* 角の立った四角ドット */
  if(m < 0.04) discard;
  o = vec4(vColor.rgb, m);
}`;

const FADE_FS = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 o;
void main(){ o = uColor; }`;

/* ---------- bootstrap ---------- */
const gridImg = new Image();
gridImg.onload = () => { try{ init(gridImg); }catch(e){ console.error(e); fail(); } };
gridImg.onerror = fail;
gridImg.src = "data:image/png;base64," + GRID_B64;

function init(gridImg){
  const GW = gridImg.naturalWidth, GH = gridImg.naturalHeight;
  const gridAspect = GW / GH;

  /* ===== 1) グリッド読み出し ===== */
  const ac = document.createElement('canvas');
  ac.width = GW; ac.height = GH;
  const ctx = ac.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(gridImg, 0, 0);
  const px = ctx.getImageData(0, 0, GW, GH).data;

  const cells = [];
  for(let i = 0; i < GW * GH; i++){
    if(px[i*4+3] > 8) cells.push(i);     /* A=厚み>0 が被写体セル */
  }
  const K = Math.max(2, Math.floor(NUM / cells.length));   /* 層数 */

  /* ===== 2) ホーム構築：セル×K層のボクセル柱 ===== */
  const worldHW = WORLD_HH * gridAspect;
  const cellW = (2 * worldHW) / GW;
  const homePos = new Float32Array(NUM * 4);
  const homeUV  = new Float32Array(NUM * 4);
  let n = 0;
  for(let c = 0; c < cells.length && n < NUM; c++){
    const i = cells[c];
    const cx = i % GW, cyy = (i / GW) | 0;
    const u = (cx + 0.5) / GW, v = (cyy + 0.5) / GH;
    const wx = (u - 0.5) * 2 * worldHW;
    const wy = (0.5 - v) * 2 * WORLD_HH;
    const th = px[i*4+3] / 255;                  /* 厚み 0..1 */
    for(let k = 0; k < K && n < NUM; k++){
      const lf = K > 1 ? k / (K - 1) : 0;        /* 0=前面 1=奥 */
      homePos[n*4+0] = wx;
      homePos[n*4+1] = wy;
      homePos[n*4+2] = lf * th * Z_DEPTH;
      homePos[n*4+3] = Math.random();            /* seed */
      homeUV[n*4+0] = u;
      homeUV[n*4+1] = 1.0 - v;                   /* flipY アップロードに合わせる */
      homeUV[n*4+2] = lf;
      homeUV[n*4+3] = 0;
      n++;
    }
  }
  /* 余り粒子は前面層の複製（描画密度の僅かな補強） */
  for(; n < NUM; n++){
    const s = (Math.random() * n) | 0;
    for(let j = 0; j < 4; j++){
      homePos[n*4+j] = homePos[s*4+j];
      homeUV[n*4+j]  = homeUV[s*4+j];
    }
  }

  /* ===== 3) GL resources ===== */
  function makeTex(data){
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, TEX, TEX, 0, gl.RGBA, gl.FLOAT, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  const homePosTex = makeTex(homePos);
  const homeUVTex  = makeTex(homeUV);

  /* 開始：中心からふわっと集まる（球状散布） */
  const pos0 = new Float32Array(NUM * 4);
  const vel0 = new Float32Array(NUM * 4);
  for(let i = 0; i < NUM; i++){
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    const r = 0.9 + Math.random() * 0.9;
    pos0[i*4+0] = homePos[i*4+0] + Math.sin(ph) * Math.cos(th) * r * 0.7;
    pos0[i*4+1] = homePos[i*4+1] + Math.sin(ph) * Math.sin(th) * r * 0.7;
    pos0[i*4+2] = homePos[i*4+2] + Math.cos(ph) * r * 0.4;
    pos0[i*4+3] = homePos[i*4+3];
  }
  let posA = makeTex(pos0), posB = makeTex(null);
  let velA = makeTex(vel0), velB = makeTex(null);
  const fbo = gl.createFramebuffer();

  /* ドット絵テクスチャ（NEAREST＝カクッとした色） */
  const gridTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, gridTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, gridImg);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const simProg  = program(QUAD_VS, SIM_FS);
  const ptsProg  = program(PTS_VS, PTS_FS);
  const fadeProg = program(QUAD_VS, FADE_FS);
  const U = p => {
    const u = {};
    const n2 = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for(let i = 0; i < n2; i++){
      const info = gl.getActiveUniform(p, i);
      u[info.name] = gl.getUniformLocation(p, info.name);
    }
    return u;
  };
  const simU = U(simProg), ptsU = U(ptsProg), fadeU = U(fadeProg);

  const quadVAO = gl.createVertexArray();
  gl.bindVertexArray(quadVAO);
  const qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  const emptyVAO = gl.createVertexArray();

  /* ---------- resize ---------- */
  let W = 0, H = 0, aspect = 1, fit = 1, pxPerWorld = 1;
  function resize(){
    const w = Math.floor(innerWidth * DPR);
    const h = Math.floor(innerHeight * DPR);
    if(w === W && h === H) return;
    W = w; H = h;
    canvas.width = W; canvas.height = H;
    aspect = W / H;
    fit = Math.min(1.0 / 1.05, aspect / (worldHW * 1.30));
    pxPerWorld = H / 2;     /* clip = world*fit → px = world*fit*H/2（shader側でfit乗算） */
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.clearColor(BG[0], BG[1], BG[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  }
  addEventListener('resize', resize);
  resize();

  /* ---------- pointer：位置＋「動いている近さ」で puff を駆動 ---------- */
  const M = { x:0, y:0, sx:0, sy:0, has:false, lastT:0, moveAmt:0 };
  function onMove(e){
    const clipX = (e.clientX / innerWidth) * 2 - 1;
    const clipY = -((e.clientY / innerHeight) * 2 - 1);
    const wx = clipX * aspect / fit;
    const wy = clipY / fit;
    if(M.has){
      M.moveAmt = Math.min(1.5, M.moveAmt + Math.hypot(wx - M.x, wy - M.y) * 2.2);
    }
    M.x = wx; M.y = wy; M.has = true;
  }
  addEventListener('pointermove', onMove);
  addEventListener('pointerdown', onMove);

  let puff = 0;          /* ゆっくり立ち上がり、ゆっくり消えるエンベロープ */

  /* ---------- loop ---------- */
  document.getElementById('loading').classList.add('done');
  const hint = document.getElementById('hint');
  let interacted = false;
  let t0 = performance.now();
  let lastNow = performance.now();

  function frame(now){
    const time = (now - t0) / 1000;
    const rawDt = Math.min((now - lastNow) / 1000, 0.1);
    lastNow = now;
    const dt = Math.max(rawDt, 1/240);
    const step = dt * 60;

    /* puff エンベロープ：attack ~0.5s / release ~2.2s */
    const target = Math.min(1, M.moveAmt);
    M.moveAmt *= Math.pow(0.25, dt);
    const rate = target > puff ? (1 - Math.pow(0.08, dt)) : (1 - Math.pow(0.55, dt));
    puff += (target - puff) * rate;
    const puffOut = reduceMotion ? Math.min(puff, 0.35) : puff;

    if(puff > 0.1 && !interacted){
      interacted = true;
      setTimeout(() => hint.style.opacity = 0, 2500);
    }

    /* スムーズなポインタ（拡散の中心） */
    const k = 1 - Math.pow(0.004, dt);
    M.sx += (M.x - M.sx) * k;
    M.sy += (M.y - M.sy) * k;

    /* カメラスウェイ：自律＋ポインタ視差 */
    const swayYaw = (reduceMotion ? 0 : 0.085 * Math.sin(time * 0.33))
                  + (M.has ? M.sx * fit * 0.05 : 0);
    const swayPitch = (reduceMotion ? 0 : 0.05 * Math.sin(time * 0.41 + 1.7))
                  + (M.has ? -M.sy * fit * 0.04 : 0);

    /* --- simulate (MRT) --- */
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, posB, 0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, velB, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.viewport(0, 0, TEX, TEX);
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(simProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, posA);
    gl.uniform1i(simU.uPos, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, velA);
    gl.uniform1i(simU.uVel, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, homePosTex);
    gl.uniform1i(simU.uHome, 2);
    gl.uniform1f(simU.uTime, time);
    gl.uniform1f(simU.uDt, dt);
    gl.uniform1f(simU.uStep, step);
    gl.uniform1f(simU.uDamp, Math.pow(0.93, step));
    gl.uniform2f(simU.uMouse, M.sx, M.sy);
    gl.uniform1f(simU.uPuff, M.has ? puffOut : 0);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    let t1 = posA; posA = posB; posB = t1;
    let t2 = velA; velA = velB; velB = t2;

    /* --- fade pass（淡い残像、深度には書かない） --- */
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(fadeProg);
    gl.uniform4f(fadeU.uColor, BG[0], BG[1], BG[2], 0.55);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    /* --- voxel dots（毎フレーム深度クリア→深度テストで前後関係を解決） --- */
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.useProgram(ptsProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, posA);
    gl.uniform1i(ptsU.uPos, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, homeUVTex);
    gl.uniform1i(ptsU.uHomeUV, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, gridTex);
    gl.uniform1i(ptsU.uGrid, 2);
    gl.uniform1f(ptsU.uAspect, aspect);
    gl.uniform1f(ptsU.uFit, fit);
    gl.uniform1f(ptsU.uPxPerWorld, pxPerWorld);
    gl.uniform1f(ptsU.uCellW, cellW);
    gl.uniform2f(ptsU.uSway, swayYaw, swayPitch);
    gl.bindVertexArray(emptyVAO);
    gl.drawArrays(gl.POINTS, 0, NUM);
    gl.bindVertexArray(null);
    gl.disable(gl.DEPTH_TEST);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

})();
</script>
</body>
</html>
