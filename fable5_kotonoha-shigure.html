        // per-character bodies on first contact (flagged by collisionStart,
        // processed after Engine.update). Each child keeps the parent's ink/aka/
        // fresh + glyph slot; child velocity = parent velocity + tangential
        // velocity from the spin + a small hashed scatter. The children are real
        // matter-js bodies → they collide and stack ONE BY ONE (言葉が地に落ちて
        // 意味がほどける).
        function breakWordBody(b) {
          const idx = bodies.indexOf(b);
          if (idx >= 0) bodies.splice(idx, 1);
          const mb = b.mb;
          const cang = mb.angle;
          const c = Math.cos(cang), s = Math.sin(cang);
          const cvel = mb.velocity;         // px/step
          const cav = mb.angularVelocity;   // rad/step
          MComposite.remove(mWorld, mb);
          for (let g = 0; g < b.glyphs.length; g++) {
            const gl_ = b.glyphs[g];
            const rx = c * gl_.lx - s * gl_.ly;   // rotated world-unit offset
            const ry = s * gl_.lx + c * gl_.ly;
            const h = (n) => hseed(b.seed * 991 + g * 17 + n);
            const wx = b.cx + rx, wy = b.cy + ry;
            if (liveCount() >= MAX_LIVE) {
              // budget full — settle this glyph straight into the ink layer
              stampQueue.push({
                cx: wx, cy: wy, dhw: gl_.dhw, dhh: gl_.dhh, ang: cang,
                u0: gl_.u0, v0: gl_.v0, ink: b.ink * 0.95, aka: b.aka, fresh: b.fresh,
              });
              continue;
            }
            const cm = MBodies.rectangle(wx * PS, wy * PS,
              gl_.dhw * 2 * 0.72 * PS, gl_.dhh * 2 * 0.80 * PS, matterOpts(b.K));
            cm.plugKind = "glyph";
            MBody.setAngle(cm, cang + (h(3) - 0.5) * 0.5);
            // tangential px/step from spin: ω × r = (-ω·ry, ω·rx)·PS
            MBody.setVelocity(cm, {
              x: cvel.x - cav * ry * PS + (h(1) - 0.5) * 0.16 * VEL_CONV,
              y: cvel.y + cav * rx * PS + 0.05 * h(2) * VEL_CONV,
            });
            MBody.setAngularVelocity(cm, cav + (h(4) - 0.5) * 1.2 * OM_CONV);
            MComposite.add(mWorld, cm);
            const cd = {
              kindKey: b.kindKey, K: b.K, mb: cm,
              cx: wx, cy: wy, ang: cm.angle,
              size: gl_.dhw * 2, dhw: gl_.dhw, dhh: gl_.dhh,
              hw: gl_.dhw * 0.72, hh: gl_.dhh * 0.80,
              ink: b.ink, aka: b.aka, fresh: b.fresh,
              u0: gl_.u0, v0: gl_.v0, slot: gl_.slot,
              life: 0, seed: h(7),
            };
            cm.plugDesc = cd;
            bodies.push(cd);
          }
        }

        /* ------------------------------------------------------------------
           Physics step (matter-js). Per substep:
             (1) hand-integrate motes (outside Matter — §9 centre stream);
             (2) apply per-kind gravity/sway force to awake glyph bodies;
             (3) Engine.update at a fixed delta (deterministic);
             (4) break any word body that made first contact this step;
             (5) sync render descriptors from their bodies, cull off-screen;
             (6) a body that has gone to sleep is bled into the ink layer,
                 then FROZEN to a static collider and KEPT — later letters
                 stack on it, so the pile is real (invariant #2);
             (7) retire the oldest settled colliders when over budget (they
                 are the most buried; their footprint is already in the height
                 field, so the pile height for dissolve/weathering is kept).
           The height field is now only the accumulation MEASURE (dissolve
           trigger + burial depth), no longer the collision surface.
        ------------------------------------------------------------------ */
        function stepPhysics(dt) {
          const cw = aspect / NC;

          // (1) motes + (2) per-body gravity/sway
          for (let bi = bodies.length - 1; bi >= 0; bi--) {
            const b = bodies[bi];
            const K = b.K;
            if (b.isMote) {
              b.life += dt;
              b.vy -= K.grav * dt;
              const dm = Math.exp(-dt * K.drag);
              b.vx *= dm; b.vy *= dm;
              b.cx += b.vx * dt; b.cy += b.vy * dt;
              b.ang += b.om * dt; b.om *= Math.exp(-dt * 2.4);
              const col = Math.max(0, Math.min(NC - 1, Math.floor(b.cx / cw)));
              if (b.cy - b.size * 0.42 <= hcol[col] || b.cy < 0.06) bodies.splice(bi, 1);
              continue;
            }
            const mb = b.mb;
            if (!mb || mb.isSleeping || mb.isStatic) continue;
            let ax = 0;
            if (K.sway) {
              b.life += dt;
              ax = Math.sin(b.life * 2.3 + b.seed * 6.283) * K.sway;
            }
            const gf = mb.mass * K.grav * GRAV_A;
            MBody.applyForce(mb, mb.position, {
              x: gf * gDir.x + mb.mass * ax * GRAV_A,   // gDir = down, tilted by device
              y: gf * gDir.y,
            });
          }

          // (3) integrate one fixed step
          MEngine.update(mEngine, MDT);

          // (4) break word bodies that touched floor/pile this step
          if (shatterSet.size) {
            for (const mb of shatterSet) {
              const b = mb.plugDesc;
              if (b && bodies.indexOf(b) >= 0) breakWordBody(b);
            }
            shatterSet.clear();
          }

          // (5)-(6) sync, cull, settle→sharp-static (stays grabbable in `bodies`)
          for (let bi = bodies.length - 1; bi >= 0; bi--) {
            const b = bodies[bi];
            if (b.isMote || !b.mb) continue;
            const mb = b.mb;
            b.cx = mb.position.x / PS;
            b.cy = mb.position.y / PS;
            b.ang = mb.angle;
            if (!Number.isFinite(b.cx) || !Number.isFinite(b.cy)
              || b.cx < -0.5 || b.cx > aspect + 0.5 || b.cy > 3.0 || b.cy < -0.6) {
              MComposite.remove(mWorld, mb);
              bodies.splice(bi, 1);
              continue;
            }
            if (mb.isStatic) continue;         // already settled-sharp (grabbable)
            // a body held by the pointer never freezes
            if (b === dragBody) { b.settle = 0; continue; }
            // settle timer: low speed sustained for SETTLE_T ⇒ come-to-rest.
            // A falling body keeps accelerating (speed grows → timer resets),
            // so only a supported body completes the timer — no mid-air freeze.
            if (mb.speed < SETTLE_V && mb.angularSpeed < SETTLE_W) {
              b.settle = (b.settle || 0) + dt;
            } else {
              b.settle = 0;
            }
            if (b.isWord) {
              // a word clump that came to rest without shattering still unravels
              if (b.settle > 0.08) breakWordBody(b);
              continue;
            }
            // while the device is meaningfully TILTED, never freeze — a jammed
            // pile would re-solidify (speed≈0) before tilted gravity could make
            // it flow. Keeping it live lets the whole pile slide/collapse toward
            // the low side, and it re-settles once the phone is level again.
            if (b.settle > SETTLE_T && Math.abs(gDir.x) < 0.12) {
              // come to rest: raise the pile height and FREEZE to a static
              // collider, but keep it as a SHARP body in `bodies` — it stays
              // grabbable and leaves NO ink behind until it is buried below.
              raiseHeight(b);
              MBody.setStatic(mb, true);
              b.settled = true;
              if (!b.inSharpQ) { b.inSharpQ = true; sharpQ.push(b); }
            }
          }

          // (7a) bleed the OLDEST settled-sharp letters into the paper once the
          // sharp pile is over budget — this is the 定着 (invariant #3): buried
          // type soaks into the page. They become invisible ink colliders.
          while (sharpQ.length && countSharp() > MAX_SHARP) {
            const b = sharpQ.shift();
            b.inSharpQ = false;
            if (!b.settled || !b.mb || !b.mb.isStatic) continue;   // woken again → skip
            stampInk(b);                       // now bleed into the paper
            staticColliders.push(b.mb);
            b.mb.plugDesc = null;
            const idx = bodies.indexOf(b);
            if (idx >= 0) bodies.splice(idx, 1);
          }
          // (7b) retire the oldest buried ink colliders over budget (footprint
          // already lives in the height field, so the pile height is preserved)
          while (staticColliders.length > MAX_STATIC) {
            MComposite.remove(mWorld, staticColliders.shift());
          }

          // height-field avalanche relaxation — smooths the burial-depth measure
          // used by weathering/dissolve (the pile SHAPE is the real bodies now)
          const slopeMax = 0.014;
          for (let i = 0; i < NC - 1; i++) {
            const d = hcol[i] - hcol[i + 1];
            if (d > slopeMax) {
              const f = (d - slopeMax) * 0.25;
              hcol[i] -= f; hcol[i + 1] += f;
            } else if (-d > slopeMax) {
              const f = (-d - slopeMax) * 0.25;
              hcol[i] += f; hcol[i + 1] -= f;
            }
          }
          liveTopCol.fill(0);
        }

        // Sweep phase (invariant 5): pile height threshold → one wind pass.
        // Reset phase (invariant 5): once the pile fills the page, the ink
        // DISSOLVES INTO WATER — it blooms outward and dilutes back to blank
        // paper (the shader does the bloom; this drives the envelope). At the
        // start every active glyph body is retired into the ink layer so the
        // whole image dissolves together, with no rigid glyphs left on top.
        // Slower/gentler than the old wind gust — diffusion takes its time.
        function stepSweep(dt) {
          let sum = 0;
          let mx = 0;
          // measure ONLY the frozen (settled/sedimented) ink height. Using the
          // live-body surface here counted FALLING words high up and spiked the
          // trigger → the page dissolved before any pile could accumulate. The
          // frozen base tracks the true settled pile (live surface is ~0.28
          // thick on top; the threshold accounts for it).
          for (let i = 0; i < NC; i++) {
            sum += hcol[i];
            if (hcol[i] > mx) mx = hcol[i];
          }
          meanH = sum / NC;
          if (!sweeping) {
            const thr = 0.18 + 0.62 * state.sweep;
            if (meanH * 0.75 + mx * 0.25 > thr) {
              sweeping = true;
              sweepT = 0;
              sweepCount++;
              // retire everything into the layer → all ink dissolves together
              // (airborne glyphs join the bloom too), and purge the whole
              // matter-js world: live bodies + settled colliders alike.
              for (const b of bodies) {
                if (!b.isMote) stampBody(b);
                if (b.mb) MComposite.remove(mWorld, b.mb);
              }
              bodies.length = 0;
              sharpQ.length = 0;
              for (const mb of staticColliders) MComposite.remove(mWorld, mb);
              staticColliders.length = 0;
              shatterSet.clear();
              if (dragC) { MComposite.remove(mWorld, dragC); dragC = null; }
              dragBody = null;
            }
            sweepEnv = 0;
            return;
          }
          sweepT += dt;
          // gentle rise, long hold, soft finish — a dilution, not a gust
          const ein = Math.min(1, sweepT / 0.9);
          const eout = 1 - Math.min(1, Math.max(0, (sweepT - 4.6) / 1.4));
          sweepEnv = ein * ein * (3 - 2 * ein) * eout;
          // the pile height melts down as the ink diffuses (isotropic)
          for (let i = 0; i < NC; i++) hcol[i] *= Math.exp(-dt * 1.15 * sweepEnv);
          if (sweepT > 6.0) {
            sweeping = false;
            sweepEnv = 0;
            hcol.fill(0);
          }
        }

        /* ------------------------------------------------------------------
           Sound → events. Three drivers behind ONE spawn API:
           mic  — AnalyserNode features (RMS/centroid/ZCR, ema, hysteresis
                  onset) + Web Speech words (progressive layer, silent
                  fallback: invariant 4)
           fake — ?fakesource=1: deterministic scripted event list; WebAudio
                  and the microphone are NEVER opened
           demo — mic denied/missing: sparse procedural onomatope shigure
        ------------------------------------------------------------------ */

        const aud = {
          mode: FAKESOURCE ? "fake" : "demo",
          ctx: null, analyser: null, stream: null,
          timeData: null, freqData: null,
          rmsF: 0, rmsS: 0, cen: 0, zcr: 0,
          armed: true, refr: 0, showerAcc: 0,
        };
        const meters = { rms: 0, cen: 0, zcr: 0, onset: 0, kind: 4, exc: 0, sus: 0 };
        let lastWord = "";
        let fakeK = 0;
        let demoK = 0;
        let demoNext = 1.0;
        let micEvSeed = 0;

        // fakesource: one event every 0.55s forever (--motion guarantee).
        // fx table spreads across the page; every event ALSO drops two small
        // centre companions so the screen-centre sample never goes still.
        function fireFakeEvent(k) {
          const h = (n) => hseed(k * 977 + n);
          const kinds = ["RAIN", "POTSU", "GORO", "WORD", "SOFT"];
          const kindKey = kinds[k % 5];
          const FXT = [0.50, 0.22, 0.62, 0.78, 0.40, 0.88, 0.30, 0.68];
          const fx = FXT[k % 8];
          const volN = 0.35 + 0.55 * h(1);
          const akaOn = state.aka > 0.01 && h(2) < 0.08 + 0.30 * state.aka;
          const word = kindKey === "WORD"
            ? ONOMATOPE.WORD[Math.floor(k / 5) % ONOMATOPE.WORD.length]
            : pickOnomatope(kindKey, k);
          if (!sweeping) {
            fireWord(word, kindKey, fx, volN, akaOn, k);
            fireRainDrop(0.44 + 0.12 * h(3), 0.0, k * 7 + 1);
            fireRainDrop(0.44 + 0.12 * h(4), 0.27, k * 7 + 2);
          }
          meters.rms = Math.max(meters.rms, volN);
          meters.cen = h(5);
          meters.zcr = kindKey === "RAIN" ? 0.7 : 0.25 + 0.3 * h(6);
          meters.onset = 1;
          meters.kind = KIND_INDEX[kindKey];
          meters.exc = akaOn ? 0.9 : volN * 0.5;
          meters.sus = 0.4 + 0.4 * h(7);
          lastWord = word;
        }

        function fireDemoEvent(k) {
          const h = (n) => hseed(k * 449 + n + 900);
          const kinds = ["RAIN", "POTSU", "POTSU", "SOFT", "GORO", "RAIN", "SOFT", "POTSU"];
          const kindKey = kinds[k % 8];
          const volN = 0.2 + 0.5 * h(1);
          const akaOn = state.aka > 0.01 && h(2) < 0.05 + 0.12 * state.aka;
          const word = pickOnomatope(kindKey, k + 500);
          if (!sweeping) {
            fireWord(word, kindKey, 0.06 + 0.88 * h(3), volN, akaOn, k * 13 + 7);
          }
          meters.rms = Math.max(meters.rms, volN * 0.8);
          meters.cen = h(4);
          meters.zcr = kindKey === "RAIN" ? 0.65 : 0.3;
          meters.onset = 1;
          meters.kind = KIND_INDEX[kindKey];
          meters.exc = akaOn ? 0.85 : volN * 0.4;
          meters.sus = 0.3;
          lastWord = word;
          demoNext = simTime + (0.9 + 2.6 * h(5)) / (0.25 + 1.5 * state.amount);
        }

        let fakeMoteK = 0;
        let fakeMotesSeeded = false;
        function driverStep() {
          if (aud.mode === "fake") {
            while (0.6 + fakeK * 0.55 <= simTime) {
              fireFakeEvent(fakeK);
              fakeK++;
            }
            // slow centre motes every 0.22s (+ a pre-seeded column at t=0):
            // guarantees the screen-centre sample of the --motion check
            // always sees falling ink (§9)
            if (!fakeMotesSeeded) {
              // one continuous column: seed spacing (0.085) = stream spacing
              // (0.22s × terminal 0.385/s), so the centre band is never empty
              fakeMotesSeeded = true;
              for (let i = 0; i < 19; i++) {
                pending.push({
                  t: simTime,
                  ch: ["ヽ", "丶", "ゝ"][i % 3],
                  kindKey: "MOTE",
                  x: (0.487 + 0.026 * hseed(i * 91 + 2)) * aspect,
                  y: 0.18 + 0.049 * i,  // tops out ≈1.06 = the stream's
                                        // spawn height: no gap ever opens
                  size: 0.032 + 0.008 * hseed(i * 91 + 5),
                  aka: false,
                  seed: i * 47 + 13,
                  dirSign: 0,
                });
              }
            }
            while (0.2 + fakeMoteK * 0.12 <= simTime) {
              const mk = fakeMoteK++;
              if (sweeping) continue;
              pending.push({
                t: simTime,
                ch: ["ヽ", "丶", "ゝ"][Math.floor(hseed(mk * 61 + 9) * 3) % 3],
                kindKey: "MOTE",
                x: (0.487 + 0.026 * hseed(mk * 61 + 4)) * aspect,
                size: 0.032 + 0.008 * hseed(mk * 61 + 6),
                aka: false,
                seed: mk * 23 + 3,
                dirSign: 0,
              });
            }
          } else if (aud.mode === "demo") {
            while (simTime >= demoNext) {
              fireDemoEvent(demoK);
              demoK++;
            }
          }
        }

        function fixedStep() {
          simTime += STEP;
          driverStep();
          for (let i = pending.length - 1; i >= 0; i--) {
            if (pending[i].t <= simTime) {
              spawnBody(pending[i]);
              pending.splice(i, 1);
            }
          }
          stepPhysics(STEP);
          stepSweep(STEP);
        }

        // ---- microphone analysis (per frame; invariant 4) ----
        function updateMicAudio(dt) {
          const an = aud.analyser;
          if (!an) return;
          an.getFloatTimeDomainData(aud.timeData);
          const N = aud.timeData.length;
          let sum = 0;
          let zc = 0;
          let prev = aud.timeData[0];
          for (let i = 1; i < N; i++) {
            const v = aud.timeData[i];
            sum += v * v;
            if ((v >= 0) !== (prev >= 0)) zc++;
            prev = v;
          }
          const rms = Math.sqrt(sum / N);
          const zcrRaw = zc / N;
          an.getByteFrequencyData(aud.freqData);
          let msum = 0;
          let mw = 0;
          for (let i = 0; i < aud.freqData.length; i++) {
            msum += aud.freqData[i];
            mw += aud.freqData[i] * i;
          }
          const cenRaw = msum > 4 ? (mw / msum) / (aud.freqData.length * 0.5) : 0;
          aud.rmsF += (rms - aud.rmsF) * (1 - Math.exp(-dt / 0.05));
          aud.rmsS += (rms - aud.rmsS) * (1 - Math.exp(-dt / 1.4));
          aud.cen += (cenRaw - aud.cen) * (1 - Math.exp(-dt / 0.2));
          aud.zcr += (Math.min(1, zcrRaw * 2.4) - aud.zcr) * (1 - Math.exp(-dt / 0.2));
          meters.rms = Math.min(1, aud.rmsF / 0.2);
          meters.cen = Math.min(1, aud.cen);
          meters.zcr = aud.zcr;
          meters.sus = Math.min(1, aud.rmsS / 0.06);
          // onset: fast RMS crosses slow-ema threshold (hysteresis + refractory)
          aud.refr = Math.max(0, aud.refr - dt);
          const hi = aud.rmsS * 1.9 + 0.010;
          const lo = aud.rmsS * 1.15 + 0.004;
          if (aud.armed && aud.refr <= 0 && aud.rmsF > hi && aud.rmsF > 0.012) {
            aud.armed = false;
            aud.refr = 0.16;
            micOnset();
          } else if (!aud.armed && aud.rmsF < lo) {
            aud.armed = true;
          }
          // sustained hiss → the ザー shower (continuous rain marks)
          if (aud.rmsF > 0.03 && aud.zcr > 0.45 && !sweeping) {
            aud.showerAcc += dt * (0.8 + 5.0 * state.amount)
              * Math.min(1, aud.rmsF / 0.1);
            while (aud.showerAcc > 1) {
              aud.showerAcc -= 1;
              micEvSeed++;
              fireRainDrop(0.06 + 0.88 * hseed(micEvSeed * 53 + 5), 0, micEvSeed * 53);
            }
          } else {
            aud.showerAcc = Math.min(aud.showerAcc, 0.5);
          }
        }

        function micOnset() {
          micEvSeed++;
          const volN = Math.min(1, aud.rmsF / 0.18);
          const exc = volN * 0.55 + Math.min(1, aud.cen) * 0.45;
          meters.onset = 1;
          meters.exc = exc;
          if (sweeping) return;
          // Suppress single-glyph onomatopoeia WHILE the user is voicing speech:
          // recognised words arrive as clumps via the speech-recognition path
          // (startSpeech → emitTranscript), so an onset during voiced speech must
          // not also spit a lone kana (the "ぶつ切り 1〜2 文字" the user saw).
          // Voice band = sustained + mid spectral centroid + not-too-noisy;
          // percussive/hissy/environmental onsets fall through to onomatopoeia.
          const voiced = speechAvail && aud.rmsS > 0.018
            && aud.cen > 0.10 && aud.cen < 0.62 && aud.zcr < 0.52;
          if (voiced) return;
          const akaOn = state.aka > 0.01 && exc > (1.02 - 0.72 * state.aka);
          let kindKey;
          const noisy = aud.zcr > 0.5;
          const sus = aud.rmsS > 0.03;
          if (volN > 0.6 && aud.cen < 0.32) kindKey = "GORO";
          else if (noisy && sus) kindKey = "RAIN";
          else if (sus && !noisy) kindKey = "SOFT";
          else kindKey = "POTSU";
          const word = pickOnomatope(kindKey, micEvSeed);
          meters.kind = KIND_INDEX[kindKey];
          lastWord = word;
          fireWord(word, kindKey, 0.08 + 0.84 * hseed(micEvSeed * 71 + 3),
            volN, akaOn, micEvSeed * 7 + 1);
        }

        // ---- Web Speech (progressive layer — Chrome系+online only; every
        // failure path is a SILENT fallback to onomatope, never an error) ----
        // Recognised words are emitted IMMEDIATELY as word-clumps (not queued
        // for the next onset), so speech feels responsive and reads as words.
        let speechRec = null;
        let speechRestarts = 0;
        let speechAvail = false;     // SR constructed → suppress onomatopoeia while voicing
        // ---- speech DIAGNOSTICS (surfaced in the readout so the user can see
        // whether recognition actually works — it can't be sandbox-verified).
        // speechDiag.state: 未対応/開始/聴取中/認識中/エラー; heard = interim
        // events (proves audio reaches SR); got = final transcripts (proves
        // full recognition); err = last error name (e.g. network / not-allowed).
        const speechDiag = { state: "—", heard: 0, got: 0, err: "" };

        // A recognised phrase → one or more falling word-clumps. Split on spaces
        // and Japanese punctuation into phrases, then chunk each phrase to
        // ≤ MAX_WORD glyphs so a long sentence rains as successive 短冊 clumps.
        function emitTranscript(text) {
          const t = String(text || "").trim();
          if (!t || aud.mode !== "mic" || sweeping) return;
          const pieces = t.split(/[\s、。「」『』・,.!?！？]+/).filter(Boolean);
          let idx = 0;
          for (const piece of pieces) {
            const arr = [...piece];
            for (let s = 0; s < arr.length; s += MAX_WORD) {
              emitSpeechWord(arr.slice(s, s + MAX_WORD).join(""), idx++);
              if (idx > 10) return;          // safety cap on one utterance
            }
          }
        }
        function emitSpeechWord(word, idx) {
          if (!word) return;
          micEvSeed++;
          // moderate size floor — 1.55/0.72 was oversized on mobile (実機
          // フィードバック), 1.0/0.5 was undersized; 1.25/0.65 lands between
          const volN = Math.max(0.65, Math.min(1, aud.rmsF / 0.12));
          const exc = volN * 0.5 + Math.min(1, aud.cen) * 0.5;
          const akaOn = state.aka > 0.01 && exc > (1.05 - 0.72 * state.aka);
          const fx = 0.12 + 0.76 * hseed(micEvSeed * 71 + idx * 17 + 3);
          meters.kind = KIND_INDEX.WORD;
          meters.onset = 1;
          lastWord = word;
          // stagger successive chunks so a sentence falls as a short cascade
          fireWord(word, "WORD", fx, volN, akaOn, micEvSeed * 7 + idx * 5 + 1,
            idx * 0.24);
        }

        // Speech recognition — modelled on the WORKING reference in this repo
        // (overflowing_aura_4taigyo_v2.html): a SHORT-lived recogniser
        // (continuous=false) that is RE-CREATED on every end/error. That piece
        // recognises Japanese reliably; its getUserMedia is video-only, so the
        // recogniser owns the microphone. We do the same here — SR is started
        // first and owns the mic; the volume analyser is best-effort (see
        // startMic). This replaces the continuous=true recogniser that fought
        // getUserMedia({audio}) for the mic and failed with `audio-capture`.
        let speechActive = false;
        let speechFatals = 0;   // consecutive PERMANENT SR failures with zero results
        let restartTimer = null;   // single pending restart (no overlapping sessions)
        let interimDrizzleAt = -1;   // throttle for the listening drizzle
        function startSpeech() {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) { speechDiag.state = "未対応(このブラウザ)"; speechAvail = false; return; }
          speechAvail = true;
          const createAndStart = () => {
            if (speechActive || aud.mode !== "mic") return;
            speechActive = true;
            const r = new SR();
            speechRec = r;
            r.lang = "ja-JP";
            r.continuous = false;          // short utterances, re-created each time
            r.interimResults = true;       // interim = proof audio is reaching SR
            r.maxAlternatives = 3;
            // per-session salvage/eager state: many sessions on mobile produce
            // interim text but die (abort / network hiccup / timeout) before a
            // FINAL ever arrives. Three emission paths, deduped by
            // `interimEmitted` (what this session already rained):
            //   先出し: interim text unchanged for ~0.45s → emit now
            //           (perceived "sensitivity": quiet/short speech becomes
            //           words without waiting for the ~1s finalisation)
            //   認識:   final → emit only the not-yet-emitted suffix; if the
            //           final is a rewrite (kana→kanji) of what already rained,
            //           skip it (no doubles)
            //   補完:   session dies with interim only → emit the remainder
            let lastInterim = "";
            let gotFinal = false;
            let interimEmitted = "";
            let stableTimer = null;
            const emitUnemitted = (text, tag) => {
              if (!text || aud.mode !== "mic") return;
              let part = null;
              if (!interimEmitted) part = text;
              else if (text.startsWith(interimEmitted)) {
                part = text.slice(interimEmitted.length);
              }
              if (part && part.trim()) {
                interimEmitted = text;
                speechDiag.got++;
                speechDiag.state = tag;
                emitTranscript(part);
              }
            };
            r.onstart = () => { speechDiag.state = "聴取中"; speechFatals = 0; };
            r.onspeechstart = () => { speechDiag.state = "発話検知"; };
            r.onresult = (event) => {
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const res = event.results[i];
                if (!res[0]) continue;
                if (res.isFinal) {
                  speechFatals = 0;
                  gotFinal = true;
                  if (stableTimer) { clearTimeout(stableTimer); stableTimer = null; }
                  emitUnemitted(res[0].transcript, "認識");
                } else {
                  speechDiag.heard++;
                  const t = res[0].transcript;
                  if (t && t !== lastInterim) {
                    lastInterim = t;
                    // eager emission: if this interim stays unchanged for a
                    // beat, rain it without waiting for the final
                    if (stableTimer) clearTimeout(stableTimer);
                    stableTimer = setTimeout(() => {
                      if (!gotFinal && lastInterim === t) {
                        emitUnemitted(t, "認識(先出し)");
                      }
                    }, 450);
                  }
                  speechDiag.state = "認識中…";
                  // INSTANT feedback while the recogniser is still working:
                  // the backend only finalises a phrase ~1s after you stop
                  // speaking (unavoidable latency), so drizzle a few small ink
                  // marks the moment interim results arrive — the piece
                  // audibly "hears" you now, the word clump lands moments
                  // later. Throttled; skipped during the sweep.
                  if (simTime > interimDrizzleAt + 0.22 && !sweeping) {
                    interimDrizzleAt = simTime;
                    micEvSeed++;
                    fireRainDrop(0.20 + 0.60 * hseed(micEvSeed * 37 + 8), 0,
                      micEvSeed * 37);
                  }
                }
              }
            };
            r.onerror = (e) => {
              speechDiag.err = (e && e.error) ? String(e.error) : "unknown";
              // Only PERMANENT failures may force the volume-mode fallback.
              // `aborted` and `no-speech` are TRANSIENT — desktop Chrome emits
              // them constantly while cycling short sessions in silence — so
              // they must NOT count, or recognition is abandoned before the user
              // even speaks (observed on PC: aborted×3 → 認識不可→音量モード).
              const benign = speechDiag.err === "no-speech" || speechDiag.err === "aborted";
              if (!benign) {
                speechDiag.state = "エラー:" + speechDiag.err;
                // hard denials never recover by retrying → give up promptly;
                // network / audio-capture may be a blip → tolerate a few.
                speechFatals += (speechDiag.err === "not-allowed"
                  || speechDiag.err === "service-not-allowed") ? 3 : 1;
              }
              // AUTO-RECOVER from a mic conflict: if the recogniser can't
              // capture audio because the volume analyser is holding the mic,
              // release the analyser so SR can reclaim it (speech is primary).
              if (speechDiag.err === "audio-capture" && aud.stream) {
                try {
                  aud.stream.getTracks().forEach((t) => t.stop());
                } catch (_) { /* ignore */ }
                aud.stream = null;
                aud.analyser = null;
                speechDiag.err = "音量解析を解放し音声認識を優先";
              }
            };
            r.onend = () => {
              speechActive = false;
              if (stableTimer) { clearTimeout(stableTimer); stableTimer = null; }
              // SALVAGE: the session heard words (interim) but died before a
              // final — emit whatever hasn't rained yet instead of dropping it.
              if (!gotFinal && lastInterim && aud.mode === "mic") {
                emitUnemitted(lastInterim, "認識(補完)");
                lastInterim = "";
              }
              if (aud.mode !== "mic") return;
              // GIVE UP on a permanently-broken recogniser: several fatal
              // errors and not one result → hand the mic to the analyser so
              // the piece still reacts to sound (volume + onomatopoeia).
              if (speechFatals >= 3 && speechDiag.got === 0) {
                speechAvail = false;
                speechDiag.state = "認識不可→音量モード";
                startAnalyser();
                return;
              }
              // restart via a SINGLE pending timer (overlapping sessions abort
              // each other — a source of the `aborted` streak). Small gap keeps
              // the deaf window short without racing the previous teardown.
              if (restartTimer) clearTimeout(restartTimer);
              restartTimer = setTimeout(createAndStart, 160);
            };
            try {
              r.start();
              if (speechDiag.state === "—" || speechDiag.state === "開始")
                speechDiag.state = "開始";
            } catch (_) {
              speechActive = false;
              if (restartTimer) clearTimeout(restartTimer);
              restartTimer = setTimeout(createAndStart, 400);
            }
          };
          speechDiag.state = "開始";
          createAndStart();
        }

        // ---- microphone acquisition ----
        // SPEECH-FIRST design (root-cause fix): the speech recogniser owns the
        // microphone, exactly like the working reference in this repo. The
        // volume analyser (getUserMedia({audio}) → AnalyserNode) is now a
        // FALLBACK used only when SpeechRecognition is unavailable: on those
        // browsers the analyser drives volume→size + onomatopoeia. On SR-capable
        // browsers the recogniser owns the mic exclusively (see startMic) —
        // sharing the mic muted the recogniser on mobile (0 results, no error),
        // and grabbing it first failed SR with `audio-capture` on desktop.
        async function startMic() {
          if (FAKESOURCE) return;
          if (!window.isSecureContext) {
            setOverlay("error", "マイクを使えません(非セキュア接続)",
              "この作品のマイク入力は https または localhost でのみ使えます。"
              + "その間もデモ時雨が降り続けています — このまま眺めることもできます。",
              { skip: true });
            return;
          }
          // enter mic mode + start speech recognition FIRST (it opens its own
          // mic). This is the primary input; the diagnostic now shows too.
          aud.mode = "mic";
          setOverlay("hidden", "", "", null);
          startSpeech();

          // EXCLUSIVE-MIC arrangement (mobile field report: recogniser stayed
          // in 聴取中 with 0 results while the analyser held the mic — many
          // mobile browsers give SR no audio once getUserMedia({audio}) opens,
          // WITHOUT raising audio-capture). The proven reference piece never
          // opens an audio getUserMedia at all. So: when speech recognition is
          // available it OWNS the microphone exclusively — no analyser at all
          // (word clumps use a fixed volume floor; ambient onomatopoeia off).
          // The analyser (volume→size + onomatopoeia) runs ONLY on browsers
          // with no SpeechRecognition (e.g. iOS Chrome / in-app webviews).
          if (!speechAvail) {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              startAnalyser();
            } else {
              setOverlay("error", "マイクを使えませんでした",
                "このブラウザでは音声認識も音量解析も使えませんでした。"
                + "その間もデモ時雨が降り続けています。",
                { mic: true, skip: true, micLabel: "マイクを再試行" });
            }
          }
        }

        let analyserStarted = false;
        async function startAnalyser() {
          if (analyserStarted || aud.mode !== "mic") return;
          analyserStarted = true;
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!aud.ctx) aud.ctx = new Ctx();
            await aud.ctx.resume();   // §8-14: resume after the user gesture
            const src = aud.ctx.createMediaStreamSource(stream);
            aud.analyser = aud.ctx.createAnalyser();
            aud.analyser.fftSize = 2048;
            aud.analyser.smoothingTimeConstant = 0;
            src.connect(aud.analyser);
            aud.stream = stream;
            aud.timeData = new Float32Array(aud.analyser.fftSize);
            aud.freqData = new Uint8Array(aud.analyser.frequencyBinCount);
          } catch (err) {
            // analyser unavailable (mic busy with SR / denied). Speech still
            // runs; note it in the diagnostic but do NOT block the piece.
            aud.analyser = null;
            analyserStarted = false;   // allow a later retry attempt
            if (!speechAvail) {
              setOverlay("error", "マイクを使えませんでした",
                ((err && err.name === "NotAllowedError")
                  ? "マイクの使用が許可されませんでした。"
                  : "マイクを開けませんでした。")
                + "ブラウザのマイク許可を確認して再試行できます。"
                + "その間もデモ時雨が降り続けています。",
                { mic: true, skip: true, micLabel: "マイクを再試行" });
            }
          }
        }

        /* ------------------------------------------------------------------
           Targets, height texture, resize (state-preserving world remap)
        ------------------------------------------------------------------ */

        let layerA = null;
        let layerB = null;
        let layerPing = false;   // current readable layer = ping ? B : A
        let paperT = null;       // baked paper (re-baked on resize / slider)
        let paperBaked = -1;     // paper-slider value the bake was made with
        let targetsReady = false;
        let preRoll = FREEZE ? PRE_STEPS : 0;

        function bakePaper() {
          renderPass(paperT, programs.paper, () => {
            const u = locations.paper;
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uPaper, state.paper);
          });
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          paperBaked = state.paper;
        }

        const hTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, hTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, NC, 1, 0,
          gl.RED, gl.UNSIGNED_BYTE, null);

        function uploadH() {
          for (let i = 0; i < NC; i++) {
            hBytes[i] = Math.max(0, Math.min(255, Math.round((hcol[i] / 1.2) * 255)));
          }
          gl.bindTexture(gl.TEXTURE_2D, hTex);
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
          gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, NC, 1,
            gl.RED, gl.UNSIGNED_BYTE, hBytes);
        }

        function currentLayer() {
          return layerPing ? layerB : layerA;
        }

        function layerUpdatePass(dt) {
          const src = currentLayer();
          const dst = layerPing ? layerA : layerB;
          renderPass(dst, programs.layer, () => {
            const u = locations.layer;
            bindTexture(0, src.tex);
            bindTexture(1, hTex);
            gl.uniform1i(u.uPrev, 0);
            gl.uniform1i(u.uH, 1);
            gl.uniform2f(u.uRes, dst.width, dst.height);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uBleed, 0.15 + 1.1 * state.bleed);
            gl.uniform1f(u.uWeather, 0.1 + 1.4 * state.weather);
            gl.uniform1f(u.uSweepAmt, sweepEnv);
            gl.uniform1f(u.uWindDir, windDir);
            bindTexture(2, paperT.tex);
            gl.uniform1i(u.uPaperT, 2);
          });
          layerPing = !layerPing;
        }

        function flushStamps() {
          if (!stampQueue.length) return;
          drawGlyphInstances(stampQueue, 1, currentLayer(), aspect);
          stampQueue.length = 0;
        }

        function compositePass() {
          refreshAtlasMips();
          renderPass(null, programs.composite, () => {
            const u = locations.composite;
            bindTexture(0, currentLayer().tex);
            bindTexture(1, hTex);
            bindTexture(2, atlasTex);
            bindTexture(3, paperT.tex);
            gl.uniform1i(u.uLayer, 0);
            gl.uniform1i(u.uH, 1);
            gl.uniform1i(u.uAtlas, 2);
            gl.uniform1i(u.uPaperT, 3);
            gl.uniform2f(u.uRes, canvas.width, canvas.height);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uTime, simTime);
            gl.uniform1f(u.uInk, state.ink);
            gl.uniform1f(u.uWeather, state.weather);
            gl.uniform1i(u.uDebug, state.debugView);
            gl.uniform4f(u.uMeterA, meters.rms, meters.cen, meters.zcr, meters.onset);
            gl.uniform4f(u.uMeterB, meters.kind, meters.exc, meters.sus, sweepEnv);
          });
        }

        function drawFallingBodies() {
          if (state.debugView >= 2 || !bodies.length) return;
          drawGlyphInstances(bodies, state.debugView === 1 ? 2 : 0, null, aspect);
        }

        function remapHeights(oldA, newA) {
          const old = Float32Array.from(hcol);
          const shift = (newA - oldA) / 2;
          for (let i = 0; i < NC; i++) {
            const wx = ((i + 0.5) / NC) * newA - shift;
            if (wx < 0 || wx > oldA) {
              hcol[i] = 0;
              continue;
            }
            const fo = (wx / oldA) * NC - 0.5;
            const i0 = Math.floor(fo);
            const fr = fo - i0;
            const a = old[Math.max(0, Math.min(NC - 1, i0))];
            const b = old[Math.max(0, Math.min(NC - 1, i0 + 1))];
            hcol[i] = a * (1 - fr) + b * fr;
          }
        }

        function resize() {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
          const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
          if (canvas.width === w && canvas.height === h && targetsReady) return;
          const oldA = canvas.width / Math.max(canvas.height, 1);
          const hadState = targetsReady && preRoll === 0;
          canvas.width = w;
          canvas.height = h;
          aspect = w / h;
          destroyTarget(paperT);
          paperT = createTarget(w, h);
          bakePaper();
          if (hadState) {
            // §7: FBOs are reallocated at the new size but the developed page
            // SURVIVES — the layer is resampled in world coordinates, the
            // height field is re-sampled on the CPU, bodies shift with the
            // horizontal centre. (Chosen over the blank-page reset option.)
            const newA = createTarget(w, h);
            const newB = createTarget(w, h);
            renderPass(newA, programs.copy, () => {
              const u = locations.copy;
              bindTexture(0, currentLayer().tex);
              gl.uniform1i(u.uSrc, 0);
              gl.uniform1f(u.uAspect, aspect);
              gl.uniform1f(u.uOldAspect, oldA);
            });
            clearTarget(newB);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            destroyTarget(layerA);
            destroyTarget(layerB);
            layerA = newA;
            layerB = newB;
            layerPing = false;
            remapHeights(oldA, aspect);
            const shift = (aspect - oldA) / 2;
            for (const b of bodies) {
              b.cx += shift;
              if (b.mb) MBody.translate(b.mb, { x: shift * PS, y: 0 });
            }
            for (const mb of staticColliders) MBody.translate(mb, { x: shift * PS, y: 0 });
            for (const sp of pending) sp.x += shift;
          } else {
            destroyTarget(layerA);
            destroyTarget(layerB);
            layerA = createTarget(w, h);
            layerB = createTarget(w, h);
            clearTarget(layerA);
            clearTarget(layerB);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            layerPing = false;
          }
          rebuildBounds();     // floor/walls follow the new aspect
          if (targetsReady) wakeAll();   // pile re-settles against the new bounds
          targetsReady = true;
        }
        window.addEventListener("resize", resize, { passive: true });

        /* ------------------------------------------------------------------
           Interaction (user request 2026-07-22): drag & fling the type with a
           pointer; on devices, tilt gravity / shake to scatter. Grabbing WAKES
           settled ink back into a moving body — the ink it already bled into the
           paper stays as a faint print (墨は紙に染みる). Resizing the window (see
           resize) wakes the whole pile so it collapses & re-settles.
           These are LIVE-only: freeze pre-roll never fires pointer/device/resize
           events, so ?freeze determinism is untouched.
        ------------------------------------------------------------------ */

        // wake a settled-SHARP letter (already in `bodies`) back into motion.
        // Only sharp letters are wakeable; buried ink (staticColliders) has
        // soaked into the paper and stays put — so nothing is ever duplicated.
        function wakeBody(b) {
          if (!b || !b.mb || !b.mb.isStatic || !b.settled) return;
          MBody.setStatic(b.mb, false);
          b.settled = false;
          b.settle = 0;
        }
        function wakeAll() {
          for (const b of bodies) if (b.settled) wakeBody(b);
        }
        function wakeRegion(wx, wy, r) {
          const r2 = r * r;
          for (const b of bodies) {
            if (!b.settled || !b.mb) continue;
            const dx = b.mb.position.x / PS - wx, dy = b.mb.position.y / PS - wy;
            if (dx * dx + dy * dy < r2) wakeBody(b);
          }
        }

        // pointer → world (y up, visible band 0..1) → Matter (×PS)
        function pointerWorld(ev) {
          const rect = canvas.getBoundingClientRect();
          return {
            x: ((ev.clientX - rect.left) / rect.width) * aspect,
            y: 1 - (ev.clientY - rect.top) / rect.height,
          };
        }
        // find the grabbable descriptor under the pointer — only letters in
        // `bodies` (falling + settled-sharp), never buried ink.
        function bodyAt(wx, wy) {
          const mp = { x: wx * PS, y: wy * PS };
          const pool = [];
          for (const b of bodies) if (b.mb) pool.push(b.mb);
          const hit = MQuery.point(pool, mp);
          let mb = null;
          if (hit.length) {
            hit.sort((a, b) => b.position.y - a.position.y);   // topmost = front
            mb = hit[0];
          } else {
            let bd = (0.055 * PS) ** 2;   // else nearest centre within grab radius
            for (const m of pool) {
              const dx = m.position.x - mp.x, dy = m.position.y - mp.y;
              const d = dx * dx + dy * dy;
              if (d < bd) { bd = d; mb = m; }
            }
          }
          return mb ? mb.plugDesc || null : null;
        }

        let dragC = null;
        function startDrag(ev) {
          maybeAskDeviceMotion();
          const wp = pointerWorld(ev);
          wakeRegion(wp.x, wp.y, 0.11);              // scoop up the neighbourhood
          const b = bodyAt(wp.x, wp.y);
          if (!b || !b.mb) return;
          if (b.mb.isStatic) wakeBody(b);
          dragBody = b;
          const mb = b.mb;
          const mp = { x: wp.x * PS, y: wp.y * PS };
          const off = { x: mp.x - mb.position.x, y: mp.y - mb.position.y };
          const ca = Math.cos(-mb.angle), sa = Math.sin(-mb.angle);
          dragC = MConstraint.create({
            pointA: mp,
            bodyB: mb,
            pointB: { x: ca * off.x - sa * off.y, y: sa * off.x + ca * off.y },
            stiffness: 0.26, damping: 0.14, length: 0,
          });
          MComposite.add(mWorld, dragC);
          if (canvas.setPointerCapture) canvas.setPointerCapture(ev.pointerId);
        }
        function moveDrag(ev) {
          if (!dragC) return;
          const wp = pointerWorld(ev);
          dragC.pointA = { x: wp.x * PS, y: wp.y * PS };
        }
        function endDrag() {
          if (dragC) { MComposite.remove(mWorld, dragC); dragC = null; }
          dragBody = null;                            // let it fling free & re-settle
        }
        canvas.addEventListener("pointerdown", startDrag);
        canvas.addEventListener("pointermove", moveDrag);
        window.addEventListener("pointerup", endDrag);
        window.addEventListener("pointercancel", endDrag);

        // ---- device motion: tilt → gravity direction, shake → scatter ----
        // (silent fallback if unsupported/denied — never errors on input.)
        // Attach as EARLY as possible: on Android / desktop sensors no permission
        // is needed, so listen from startup (tilt works without any tap). Only
        // iOS 13+ gates motion behind requestPermission(), which must run inside
        // a user gesture — we fire that on the first tap anywhere (canvas OR the
        // opening overlay buttons), so a single tap unlocks tilt-to-collapse.
        let deviceAsked = false;
        let motionAttached = false;
        let lastAccMag = 0;
        function attachMotion() {
          if (motionAttached) return;
          motionAttached = true;
          window.addEventListener("deviceorientation", onOrient, { passive: true });
          window.addEventListener("devicemotion", onMotion, { passive: true });
        }
        function motionNeedsPermission() {
          const DM = window.DeviceMotionEvent, DO = window.DeviceOrientationEvent;
          return (DM && typeof DM.requestPermission === "function")
            || (DO && typeof DO.requestPermission === "function");
        }
        function initMotion() {
          // no-permission platforms: listen immediately (no gesture required)
          if (!motionNeedsPermission()) attachMotion();
        }
        function maybeAskDeviceMotion() {
          if (deviceAsked) return;
          deviceAsked = true;
          const DM = window.DeviceMotionEvent, DO = window.DeviceOrientationEvent;
          try {
            if (DM && typeof DM.requestPermission === "function") {
              DM.requestPermission().then((s) => { if (s === "granted") attachMotion(); }).catch(() => {});
            } else if (DO && typeof DO.requestPermission === "function") {
              DO.requestPermission().then((s) => { if (s === "granted") attachMotion(); }).catch(() => {});
            } else {
              attachMotion();
            }
          } catch (e) { /* silent */ }
        }
        initMotion();
        function onOrient(ev) {
          if (ev.gamma == null) return;              // left-right tilt (deg)
          const a = Math.max(-1, Math.min(1, ev.gamma / 45)) * 0.9;  // clamp ≈52°
          const nx = Math.sin(a), ny = -Math.cos(a);
          if (Math.abs(nx - gDir.x) > 0.04) wakeAll();  // pile slides toward the low side
          gDir.x = nx; gDir.y = ny;
        }
        function onMotion(ev) {
          const a = ev.accelerationIncludingGravity || ev.acceleration;
          if (!a) return;
          const mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
          const jolt = Math.abs(mag - lastAccMag);
          lastAccMag = mag;
          if (jolt > 13) {                           // a sharp shake scatters the pile
            wakeAll();
            for (const b of bodies) {
              if (!b.mb || b.mb.isStatic) continue;
              const r1 = hseed(intK++), r2 = hseed(intK++);
              MBody.setVelocity(b.mb, {
                x: (r1 - 0.5) * 0.9 * VEL_CONV,
                y: (0.25 + 0.6 * r2) * VEL_CONV,
              });
              MBody.setAngularVelocity(b.mb, (r1 - 0.5) * 2.2 * OM_CONV);
            }
          }
        }

        /* ------------------------------------------------------------------
           Frame loop
        ------------------------------------------------------------------ */

        let acc = 0;
        let lastNow = performance.now();
        let fpsLast = performance.now();
        let fpsFrames = 0;
        let readyStamped = false;
        let lastDrawSig = "";
        const readout = document.getElementById("readout");

        function frame(now) {
          resize();
          if (paperBaked !== state.paper) bakePaper();
          // dt clamp = MAX_SUBSTEPS worth of fixed steps: on slow (software
          // GL) machines the piece runs slow-motion instead of exploding.
          const rawDt = Math.min(MAX_SUBSTEPS / 60, Math.max(0, (now - lastNow) / 1000));
          lastNow = now;

          if (preRoll > 0) {
            // deterministic fixed-dt development (freeze pre-roll), chunked
            // with a true GPU sync per chunk (CRAFT §C4: swiftshader queues)
            const steps = Math.min(PRE_CHUNK, preRoll);
            for (let i = 0; i < steps; i++) {
              fixedStep();
              uploadH();
              layerUpdatePass(STEP);
              flushStamps();
            }
            preRoll -= steps;
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            glSync();
            if (preRoll > 0) {
              requestAnimationFrame(frame);
              return;
            }
          } else if (!FREEZE && !state.pauseAnim) {
            const dt = rawDt;
            if (dt > 0) {
              meters.onset *= Math.exp(-dt * 5);
              if (aud.mode === "mic") updateMicAudio(dt);
              else meters.rms *= Math.exp(-dt * 2.0);
              acc += dt;
              let n = 0;
              while (acc >= STEP && n < MAX_SUBSTEPS) {
                fixedStep();
                acc -= STEP;
                n++;
              }
              if (n === MAX_SUBSTEPS) acc = 0;   // frame drop: don't spiral
              if (n > 0) {
                uploadH();
                layerUpdatePass(STEP * n);
                flushStamps();
              }
            }
          }

          // static-scene short-circuit (frozen/paused only): identical input
          // → skip the GPU passes; preserveDrawingBuffer keeps the frame.
          const drawSig = `${simTime}|${canvas.width}x${canvas.height}|${
            state.paper}|${state.ink}|${state.weather}|${state.bleed}|${
            state.aka}|${state.amount}|${state.size}|${state.sweep}|${
            state.debugView}`;
          if (readyStamped && (FREEZE || state.pauseAnim) && drawSig === lastDrawSig) {
            requestAnimationFrame(frame);
            return;
          }
          lastDrawSig = drawSig;

          compositePass();
          drawFallingBodies();

          // verification hook: first REAL frame, stamped only after the GPU
          // queue is drained (renderPass(null,…) left the backbuffer bound)
          if (!readyStamped && preRoll === 0) {
            glSync();
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            const modeLabel = aud.mode === "mic" ? "mic"
              : aud.mode === "fake" ? "fake" : "デモ";
            // append the live speech diagnostic so the user can see whether
            // recognition is actually working on their device (shown once mic
            // mode is entered or recognition has been attempted)
            const speechInfo = (aud.mode === "mic" || speechDiag.state !== "—")
              ? ` / 音声 ${speechDiag.state}・認識${speechDiag.got}件`
                + (speechDiag.heard ? `・聴取${speechDiag.heard}` : "")
                + (speechDiag.err ? `・${speechDiag.err}` : "")
              : "";
            readout.textContent = `FPS ${fps.toFixed(0)} / 描画 ${canvas.width}×${
              canvas.height} / 文字 ${bodies.length}+${staticColliders.length}・堆積 ${
              Math.round(meanH * 100)}% / 入力 ${modeLabel}${
              lastWord ? " 「" + lastWord + "」" : ""}${speechInfo}`;
          }
          requestAnimationFrame(frame);
        }

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });

        // ---- overlay wiring (mic invite / error paths) ----
        // these taps are the FIRST user gesture on mobile → also use them to
        // unlock iOS motion sensors so tilt-to-collapse works right away.
        micStartBtn.addEventListener("click", () => { maybeAskDeviceMotion(); startMic(); });
        micSkipBtn.addEventListener("click", () => { maybeAskDeviceMotion(); setOverlay("hidden", "", "", null); });
        document.getElementById("micBtn").addEventListener("click", () => { maybeAskDeviceMotion(); startMic(); });
        if (FAKESOURCE) {
          document.getElementById("micBtn").style.display = "none";
        } else {
          setOverlay("info", "言の葉時雨 — 音が墨になる",
            "マイクで集めた音が墨の活字になって降り積もります。声が取れれば言葉が、"
            + "環境音は「ザー」「ゴロゴロ」「ポツ」などのオノマトペが降ります。"
            + "マイクなしでもデモ時雨を眺められます。",
            { mic: true, skip: true, micLabel: "マイクを許可して始める" });
        }

        try {
          resize();
          requestAnimationFrame(frame);
        } catch (error) {
          const msg = error && error.message ? error.message : "";
          if (/RENDER TARGET INCOMPLETE/.test(msg)) {
            setOverlay("error", "RENDER TARGET UNAVAILABLE",
              "RGBA8 render targets could not be allocated. Try another browser/GPU.",
              null);
          } else {
            setOverlay("error", "WEBGL SETUP ERROR",
              msg || "Could not initialize the renderer.", null);
          }
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
