        function fireFakeEvent(k) {
          const h = (n) => hseed(k * 977 + n);
          const kinds = ["RAIN", "POTSU", "GORO", "WORD", "SOFT"];
          const kindKey = kinds[k % 5];
          const FXT = [0.50, 0.22, 0.62, 0.78, 0.40, 0.88, 0.30, 0.68];
          const fx = FXT[k % 8];
          const volN = 0.35 + 0.55 * h(1);
          const akaOn = state.aka > 0.01 && h(2) < 0.08 + 0.30 * state.aka;
          const word = kindKey === "WORD"
            ? ONOMATOPE.WORD[Math.floor(k / 5) % ONOMATOPE.WORD.length]
            : pickOnomatope(kindKey, k);
          if (!sweeping) {
            fireWord(word, kindKey, fx, volN, akaOn, k);
            fireRainDrop(0.44 + 0.12 * h(3), 0.0, k * 7 + 1);
            fireRainDrop(0.44 + 0.12 * h(4), 0.27, k * 7 + 2);
          }
          meters.rms = Math.max(meters.rms, volN);
          meters.cen = h(5);
          meters.zcr = kindKey === "RAIN" ? 0.7 : 0.25 + 0.3 * h(6);
          meters.onset = 1;
          meters.kind = KIND_INDEX[kindKey];
          meters.exc = akaOn ? 0.9 : volN * 0.5;
          meters.sus = 0.4 + 0.4 * h(7);
          lastWord = word;
        }

        function fireDemoEvent(k) {
          const h = (n) => hseed(k * 449 + n + 900);
          const kinds = ["RAIN", "POTSU", "POTSU", "SOFT", "GORO", "RAIN", "SOFT", "POTSU"];
          const kindKey = kinds[k % 8];
          const volN = 0.2 + 0.5 * h(1);
          const akaOn = state.aka > 0.01 && h(2) < 0.05 + 0.12 * state.aka;
          const word = pickOnomatope(kindKey, k + 500);
          if (!sweeping) {
            fireWord(word, kindKey, 0.06 + 0.88 * h(3), volN, akaOn, k * 13 + 7);
          }
          meters.rms = Math.max(meters.rms, volN * 0.8);
          meters.cen = h(4);
          meters.zcr = kindKey === "RAIN" ? 0.65 : 0.3;
          meters.onset = 1;
          meters.kind = KIND_INDEX[kindKey];
          meters.exc = akaOn ? 0.85 : volN * 0.4;
          meters.sus = 0.3;
          lastWord = word;
          demoNext = simTime + (0.9 + 2.6 * h(5)) / (0.25 + 1.5 * state.amount);
        }

        let fakeMoteK = 0;
        let fakeMotesSeeded = false;
        function driverStep() {
          if (aud.mode === "fake") {
            while (0.6 + fakeK * 0.55 <= simTime) {
              fireFakeEvent(fakeK);
              fakeK++;
            }
            // slow centre motes every 0.22s (+ a pre-seeded column at t=0):
            // guarantees the screen-centre sample of the --motion check
            // always sees falling ink (§9)
            if (!fakeMotesSeeded) {
              // one continuous column: seed spacing (0.085) = stream spacing
              // (0.22s × terminal 0.385/s), so the centre band is never empty
              fakeMotesSeeded = true;
              for (let i = 0; i < 19; i++) {
                pending.push({
                  t: simTime,
                  ch: ["ヽ", "丶", "ゝ"][i % 3],
                  kindKey: "MOTE",
                  x: (0.487 + 0.026 * hseed(i * 91 + 2)) * aspect,
                  y: 0.18 + 0.049 * i,  // tops out ≈1.06 = the stream's
                                        // spawn height: no gap ever opens
                  size: 0.032 + 0.008 * hseed(i * 91 + 5),
                  aka: false,
                  seed: i * 47 + 13,
                  dirSign: 0,
                });
              }
            }
            while (0.2 + fakeMoteK * 0.12 <= simTime) {
              const mk = fakeMoteK++;
              if (sweeping) continue;
              pending.push({
                t: simTime,
                ch: ["ヽ", "丶", "ゝ"][Math.floor(hseed(mk * 61 + 9) * 3) % 3],
                kindKey: "MOTE",
                x: (0.487 + 0.026 * hseed(mk * 61 + 4)) * aspect,
                size: 0.032 + 0.008 * hseed(mk * 61 + 6),
                aka: false,
                seed: mk * 23 + 3,
                dirSign: 0,
              });
            }
          } else if (aud.mode === "demo") {
            while (simTime >= demoNext) {
              fireDemoEvent(demoK);
              demoK++;
            }
          }
        }

        function fixedStep() {
          simTime += STEP;
          driverStep();
          for (let i = pending.length - 1; i >= 0; i--) {
            if (pending[i].t <= simTime) {
              spawnBody(pending[i]);
              pending.splice(i, 1);
            }
          }
          stepPhysics(STEP);
          stepSweep(STEP);
        }

        // ---- microphone analysis (per frame; invariant 4) ----
        function updateMicAudio(dt) {
          const an = aud.analyser;
          if (!an) return;
          an.getFloatTimeDomainData(aud.timeData);
          const N = aud.timeData.length;
          let sum = 0;
          let zc = 0;
          let prev = aud.timeData[0];
          for (let i = 1; i < N; i++) {
            const v = aud.timeData[i];
            sum += v * v;
            if ((v >= 0) !== (prev >= 0)) zc++;
            prev = v;
          }
          const rms = Math.sqrt(sum / N);
          const zcrRaw = zc / N;
          an.getByteFrequencyData(aud.freqData);
          let msum = 0;
          let mw = 0;
          for (let i = 0; i < aud.freqData.length; i++) {
            msum += aud.freqData[i];
            mw += aud.freqData[i] * i;
          }
          const cenRaw = msum > 4 ? (mw / msum) / (aud.freqData.length * 0.5) : 0;
          aud.rmsF += (rms - aud.rmsF) * (1 - Math.exp(-dt / 0.05));
          aud.rmsS += (rms - aud.rmsS) * (1 - Math.exp(-dt / 1.4));
          aud.cen += (cenRaw - aud.cen) * (1 - Math.exp(-dt / 0.2));
          aud.zcr += (Math.min(1, zcrRaw * 2.4) - aud.zcr) * (1 - Math.exp(-dt / 0.2));
          meters.rms = Math.min(1, aud.rmsF / 0.2);
          meters.cen = Math.min(1, aud.cen);
          meters.zcr = aud.zcr;
          meters.sus = Math.min(1, aud.rmsS / 0.06);
          // onset: fast RMS crosses slow-ema threshold (hysteresis + refractory)
          aud.refr = Math.max(0, aud.refr - dt);
          const hi = aud.rmsS * 1.9 + 0.010;
          const lo = aud.rmsS * 1.15 + 0.004;
          if (aud.armed && aud.refr <= 0 && aud.rmsF > hi && aud.rmsF > 0.012) {
            aud.armed = false;
            aud.refr = 0.16;
            micOnset();
          } else if (!aud.armed && aud.rmsF < lo) {
            aud.armed = true;
          }
          // sustained hiss → the ザー shower (continuous rain marks)
          if (aud.rmsF > 0.03 && aud.zcr > 0.45 && !sweeping) {
            aud.showerAcc += dt * (0.8 + 5.0 * state.amount)
              * Math.min(1, aud.rmsF / 0.1);
            while (aud.showerAcc > 1) {
              aud.showerAcc -= 1;
              micEvSeed++;
              fireRainDrop(0.06 + 0.88 * hseed(micEvSeed * 53 + 5), 0, micEvSeed * 53);
            }
          } else {
            aud.showerAcc = Math.min(aud.showerAcc, 0.5);
          }
        }

        function micOnset() {
          micEvSeed++;
          const volN = Math.min(1, aud.rmsF / 0.18);
          const exc = volN * 0.55 + Math.min(1, aud.cen) * 0.45;
          meters.onset = 1;
          meters.exc = exc;
          if (sweeping) return;
          // Suppress single-glyph onomatopoeia WHILE the user is voicing speech:
          // recognised words arrive as clumps via the speech-recognition path
          // (startSpeech → emitTranscript), so an onset during voiced speech must
          // not also spit a lone kana (the "ぶつ切り 1〜2 文字" the user saw).
          // Voice band = sustained + mid spectral centroid + not-too-noisy;
          // percussive/hissy/environmental onsets fall through to onomatopoeia.
          const voiced = speechAvail && aud.rmsS > 0.018
            && aud.cen > 0.10 && aud.cen < 0.62 && aud.zcr < 0.52;
          if (voiced) return;
          const akaOn = state.aka > 0.01 && exc > (1.02 - 0.72 * state.aka);
          let kindKey;
          const noisy = aud.zcr > 0.5;
          const sus = aud.rmsS > 0.03;
          if (volN > 0.6 && aud.cen < 0.32) kindKey = "GORO";
          else if (noisy && sus) kindKey = "RAIN";
          else if (sus && !noisy) kindKey = "SOFT";
          else kindKey = "POTSU";
          const word = pickOnomatope(kindKey, micEvSeed);
          meters.kind = KIND_INDEX[kindKey];
          lastWord = word;
          fireWord(word, kindKey, 0.08 + 0.84 * hseed(micEvSeed * 71 + 3),
            volN, akaOn, micEvSeed * 7 + 1);
        }

        // ---- Web Speech (progressive layer — Chrome系+online only; every
        // failure path is a SILENT fallback to onomatope, never an error) ----
        // Recognised words are emitted IMMEDIATELY as word-clumps (not queued
        // for the next onset), so speech feels responsive and reads as words.
        let speechRec = null;
        let speechRestarts = 0;
        let speechAvail = false;     // SR constructed → suppress onomatopoeia while voicing
        // ---- speech DIAGNOSTICS (surfaced in the readout so the user can see
        // whether recognition actually works — it can't be sandbox-verified).
        // speechDiag.state: 未対応/開始/聴取中/認識中/エラー; heard = interim
        // events (proves audio reaches SR); got = final transcripts (proves
        // full recognition); err = last error name (e.g. network / not-allowed).
        const speechDiag = { state: "—", heard: 0, got: 0, err: "" };

        // A recognised phrase → one or more falling word-clumps. Split on spaces
        // and Japanese punctuation into phrases, then chunk each phrase to
        // ≤ MAX_WORD glyphs so a long sentence rains as successive 短冊 clumps.
        function emitTranscript(text) {
          const t = String(text || "").trim();
          if (!t || aud.mode !== "mic" || sweeping) return;
          const pieces = t.split(/[\s、。「」『』・,.!?！？]+/).filter(Boolean);
          let idx = 0;
          for (const piece of pieces) {
            const arr = [...piece];
            for (let s = 0; s < arr.length; s += MAX_WORD) {
              emitSpeechWord(arr.slice(s, s + MAX_WORD).join(""), idx++);
              if (idx > 10) return;          // safety cap on one utterance
            }
          }
        }
        function emitSpeechWord(word, idx) {
          if (!word) return;
          micEvSeed++;
          // moderate size floor — 1.55/0.72 was oversized on mobile (実機
          // フィードバック), 1.0/0.5 was undersized; 1.25/0.65 lands between
          const volN = Math.max(0.65, Math.min(1, aud.rmsF / 0.12));
          const exc = volN * 0.5 + Math.min(1, aud.cen) * 0.5;
          const akaOn = state.aka > 0.01 && exc > (1.05 - 0.72 * state.aka);
          const fx = 0.12 + 0.76 * hseed(micEvSeed * 71 + idx * 17 + 3);
          meters.kind = KIND_INDEX.WORD;
          meters.onset = 1;
          lastWord = word;
          // stagger successive chunks so a sentence falls as a short cascade
          fireWord(word, "WORD", fx, volN, akaOn, micEvSeed * 7 + idx * 5 + 1,
            idx * 0.24);
        }

        // Speech recognition — modelled on the WORKING reference in this repo
        // (overflowing_aura_4taigyo_v2.html): a SHORT-lived recogniser
        // (continuous=false) that is RE-CREATED on every end/error. That piece
        // recognises Japanese reliably; its getUserMedia is video-only, so the
        // recogniser owns the microphone. We do the same here — SR is started
        // first and owns the mic; the volume analyser is best-effort (see
        // startMic). This replaces the continuous=true recogniser that fought
        // getUserMedia({audio}) for the mic and failed with `audio-capture`.
        let speechActive = false;
        let speechFatals = 0;   // consecutive fatal SR errors with zero results
        let interimDrizzleAt = -1;   // throttle for the listening drizzle
        function startSpeech() {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) { speechDiag.state = "未対応(このブラウザ)"; speechAvail = false; return; }
          speechAvail = true;
          const createAndStart = () => {
            if (speechActive || aud.mode !== "mic") return;
            speechActive = true;
            const r = new SR();
            speechRec = r;
            r.lang = "ja-JP";
            r.continuous = false;          // short utterances, re-created each time
            r.interimResults = true;       // interim = proof audio is reaching SR
            r.maxAlternatives = 3;
            // per-session salvage/eager state: many sessions on mobile produce
            // interim text but die (abort / network hiccup / timeout) before a
            // FINAL ever arrives. Three emission paths, deduped by
            // `interimEmitted` (what this session already rained):
            //   先出し: interim text unchanged for ~0.45s → emit now
            //           (perceived "sensitivity": quiet/short speech becomes
            //           words without waiting for the ~1s finalisation)
            //   認識:   final → emit only the not-yet-emitted suffix; if the
            //           final is a rewrite (kana→kanji) of what already rained,
            //           skip it (no doubles)
            //   補完:   session dies with interim only → emit the remainder
            let lastInterim = "";
            let gotFinal = false;
            let interimEmitted = "";
            let stableTimer = null;
            const emitUnemitted = (text, tag) => {
              if (!text || aud.mode !== "mic") return;
              let part = null;
              if (!interimEmitted) part = text;
              else if (text.startsWith(interimEmitted)) {
                part = text.slice(interimEmitted.length);
              }
              if (part && part.trim()) {
                interimEmitted = text;
                speechDiag.got++;
                speechDiag.state = tag;
                emitTranscript(part);
              }
            };
            r.onstart = () => { speechDiag.state = "聴取中"; };
            r.onspeechstart = () => { speechDiag.state = "発話検知"; };
            r.onresult = (event) => {
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const res = event.results[i];
                if (!res[0]) continue;
                if (res.isFinal) {
                  speechFatals = 0;
                  gotFinal = true;
                  if (stableTimer) { clearTimeout(stableTimer); stableTimer = null; }
                  emitUnemitted(res[0].transcript, "認識");
                } else {
                  speechDiag.heard++;
                  const t = res[0].transcript;
                  if (t && t !== lastInterim) {
                    lastInterim = t;
                    // eager emission: if this interim stays unchanged for a
                    // beat, rain it without waiting for the final
                    if (stableTimer) clearTimeout(stableTimer);
                    stableTimer = setTimeout(() => {
                      if (!gotFinal && lastInterim === t) {
                        emitUnemitted(t, "認識(先出し)");
                      }
                    }, 450);
                  }
                  speechDiag.state = "認識中…";
                  // INSTANT feedback while the recogniser is still working:
                  // the backend only finalises a phrase ~1s after you stop
                  // speaking (unavoidable latency), so drizzle a few small ink
                  // marks the moment interim results arrive — the piece
                  // audibly "hears" you now, the word clump lands moments
                  // later. Throttled; skipped during the sweep.
                  if (simTime > interimDrizzleAt + 0.22 && !sweeping) {
                    interimDrizzleAt = simTime;
                    micEvSeed++;
                    fireRainDrop(0.20 + 0.60 * hseed(micEvSeed * 37 + 8), 0,
                      micEvSeed * 37);
                  }
                }
              }
            };
            r.onerror = (e) => {
              speechDiag.err = (e && e.error) ? String(e.error) : "unknown";
              if (speechDiag.err !== "no-speech") {
                speechDiag.state = "エラー:" + speechDiag.err;
                // fatal-error streak (audio-capture / network /
                // service-not-allowed / not-allowed …). no-speech is benign.
                speechFatals++;
              }
              // AUTO-RECOVER from a mic conflict: if the recogniser can't
              // capture audio because the volume analyser is holding the mic,
              // release the analyser so SR can reclaim it (speech is primary).
              if (speechDiag.err === "audio-capture" && aud.stream) {
                try {
                  aud.stream.getTracks().forEach((t) => t.stop());
                } catch (_) { /* ignore */ }
                aud.stream = null;
                aud.analyser = null;
                speechDiag.err = "音量解析を解放し音声認識を優先";
              }
            };
            r.onend = () => {
              speechActive = false;
              if (stableTimer) { clearTimeout(stableTimer); stableTimer = null; }
              // SALVAGE: the session heard words (interim) but died before a
              // final — emit whatever hasn't rained yet instead of dropping it.
              if (!gotFinal && lastInterim && aud.mode === "mic") {
                emitUnemitted(lastInterim, "認識(補完)");
                lastInterim = "";
              }
              if (aud.mode !== "mic") return;
              // GIVE UP on a permanently-broken recogniser: several fatal
              // errors and not one result → hand the mic to the analyser so
              // the piece still reacts to sound (volume + onomatopoeia).
              if (speechFatals >= 3 && speechDiag.got === 0) {
                speechAvail = false;
                speechDiag.state = "認識不可→音量モード";
                startAnalyser();
                return;
              }
              // restart fast: this gap is a deaf window — speech begun inside
              // it is lost entirely, one cause of "words rarely appear"
              setTimeout(createAndStart, 80);
            };
            try {
              r.start();
              if (speechDiag.state === "—" || speechDiag.state === "開始")
                speechDiag.state = "開始";
            } catch (_) {
              speechActive = false;
              setTimeout(createAndStart, 400);
            }
          };
          speechDiag.state = "開始";
          createAndStart();
        }

        // ---- microphone acquisition ----
        // SPEECH-FIRST design (root-cause fix): the speech recogniser owns the
        // microphone, exactly like the working reference in this repo. The
        // volume analyser (getUserMedia({audio}) → AnalyserNode) is now a
        // FALLBACK used only when SpeechRecognition is unavailable: on those
        // browsers the analyser drives volume→size + onomatopoeia. On SR-capable
        // browsers the recogniser owns the mic exclusively (see startMic) —
        // sharing the mic muted the recogniser on mobile (0 results, no error),
        // and grabbing it first failed SR with `audio-capture` on desktop.
        async function startMic() {
          if (FAKESOURCE) return;
          if (!window.isSecureContext) {
            setOverlay("error", "マイクを使えません(非セキュア接続)",
              "この作品のマイク入力は https または localhost でのみ使えます。"
              + "その間もデモ時雨が降り続けています — このまま眺めることもできます。",
              { skip: true });
            return;
          }
          // enter mic mode + start speech recognition FIRST (it opens its own
          // mic). This is the primary input; the diagnostic now shows too.
          aud.mode = "mic";
          setOverlay("hidden", "", "", null);
          startSpeech();

          // EXCLUSIVE-MIC arrangement (mobile field report: recogniser stayed
          // in 聴取中 with 0 results while the analyser held the mic — many
          // mobile browsers give SR no audio once getUserMedia({audio}) opens,
          // WITHOUT raising audio-capture). The proven reference piece never
          // opens an audio getUserMedia at all. So: when speech recognition is
          // available it OWNS the microphone exclusively — no analyser at all
          // (word clumps use a fixed volume floor; ambient onomatopoeia off).
          // The analyser (volume→size + onomatopoeia) runs ONLY on browsers
          // with no SpeechRecognition (e.g. iOS Chrome / in-app webviews).
          if (!speechAvail) {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              startAnalyser();
            } else {
              setOverlay("error", "マイクを使えませんでした",
                "このブラウザでは音声認識も音量解析も使えませんでした。"
                + "その間もデモ時雨が降り続けています。",
                { mic: true, skip: true, micLabel: "マイクを再試行" });
            }
          }
        }

        let analyserStarted = false;
        async function startAnalyser() {
          if (analyserStarted || aud.mode !== "mic") return;
          analyserStarted = true;
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!aud.ctx) aud.ctx = new Ctx();
            await aud.ctx.resume();   // §8-14: resume after the user gesture
            const src = aud.ctx.createMediaStreamSource(stream);
            aud.analyser = aud.ctx.createAnalyser();
            aud.analyser.fftSize = 2048;
            aud.analyser.smoothingTimeConstant = 0;
            src.connect(aud.analyser);
            aud.stream = stream;
            aud.timeData = new Float32Array(aud.analyser.fftSize);
            aud.freqData = new Uint8Array(aud.analyser.frequencyBinCount);
          } catch (err) {
            // analyser unavailable (mic busy with SR / denied). Speech still
            // runs; note it in the diagnostic but do NOT block the piece.
            aud.analyser = null;
            analyserStarted = false;   // allow a later retry attempt
            if (!speechAvail) {
              setOverlay("error", "マイクを使えませんでした",
                ((err && err.name === "NotAllowedError")
                  ? "マイクの使用が許可されませんでした。"
                  : "マイクを開けませんでした。")
                + "ブラウザのマイク許可を確認して再試行できます。"
                + "その間もデモ時雨が降り続けています。",
                { mic: true, skip: true, micLabel: "マイクを再試行" });
            }
          }
        }

        /* ------------------------------------------------------------------
           Targets, height texture, resize (state-preserving world remap)
        ------------------------------------------------------------------ */

        let layerA = null;
        let layerB = null;
        let layerPing = false;   // current readable layer = ping ? B : A
        let paperT = null;       // baked paper (re-baked on resize / slider)
        let paperBaked = -1;     // paper-slider value the bake was made with
        let targetsReady = false;
        let preRoll = FREEZE ? PRE_STEPS : 0;

        function bakePaper() {
          renderPass(paperT, programs.paper, () => {
            const u = locations.paper;
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uPaper, state.paper);
          });
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          paperBaked = state.paper;
        }

        const hTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, hTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, NC, 1, 0,
          gl.RED, gl.UNSIGNED_BYTE, null);

        function uploadH() {
          for (let i = 0; i < NC; i++) {
            hBytes[i] = Math.max(0, Math.min(255, Math.round((hcol[i] / 1.2) * 255)));
          }
          gl.bindTexture(gl.TEXTURE_2D, hTex);
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
          gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, NC, 1,
            gl.RED, gl.UNSIGNED_BYTE, hBytes);
        }

        function currentLayer() {
          return layerPing ? layerB : layerA;
        }

        function layerUpdatePass(dt) {
          const src = currentLayer();
          const dst = layerPing ? layerA : layerB;
          renderPass(dst, programs.layer, () => {
            const u = locations.layer;
            bindTexture(0, src.tex);
            bindTexture(1, hTex);
            gl.uniform1i(u.uPrev, 0);
            gl.uniform1i(u.uH, 1);
            gl.uniform2f(u.uRes, dst.width, dst.height);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uBleed, 0.15 + 1.1 * state.bleed);
            gl.uniform1f(u.uWeather, 0.1 + 1.4 * state.weather);
            gl.uniform1f(u.uSweepAmt, sweepEnv);
            gl.uniform1f(u.uWindDir, windDir);
            bindTexture(2, paperT.tex);
            gl.uniform1i(u.uPaperT, 2);
          });
          layerPing = !layerPing;
        }

        function flushStamps() {
          if (!stampQueue.length) return;
          drawGlyphInstances(stampQueue, 1, currentLayer(), aspect);
          stampQueue.length = 0;
        }

        function compositePass() {
          refreshAtlasMips();
          renderPass(null, programs.composite, () => {
            const u = locations.composite;
            bindTexture(0, currentLayer().tex);
            bindTexture(1, hTex);
            bindTexture(2, atlasTex);
            bindTexture(3, paperT.tex);
            gl.uniform1i(u.uLayer, 0);
            gl.uniform1i(u.uH, 1);
            gl.uniform1i(u.uAtlas, 2);
            gl.uniform1i(u.uPaperT, 3);
            gl.uniform2f(u.uRes, canvas.width, canvas.height);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uTime, simTime);
            gl.uniform1f(u.uInk, state.ink);
            gl.uniform1f(u.uWeather, state.weather);
            gl.uniform1i(u.uDebug, state.debugView);
            gl.uniform4f(u.uMeterA, meters.rms, meters.cen, meters.zcr, meters.onset);
            gl.uniform4f(u.uMeterB, meters.kind, meters.exc, meters.sus, sweepEnv);
          });
        }

        function drawFallingBodies() {
          if (state.debugView >= 2 || !bodies.length) return;
          drawGlyphInstances(bodies, state.debugView === 1 ? 2 : 0, null, aspect);
        }

        function remapHeights(oldA, newA) {
          const old = Float32Array.from(hcol);
          const shift = (newA - oldA) / 2;
          for (let i = 0; i < NC; i++) {
            const wx = ((i + 0.5) / NC) * newA - shift;
            if (wx < 0 || wx > oldA) {
              hcol[i] = 0;
              continue;
            }
            const fo = (wx / oldA) * NC - 0.5;
            const i0 = Math.floor(fo);
            const fr = fo - i0;
            const a = old[Math.max(0, Math.min(NC - 1, i0))];
            const b = old[Math.max(0, Math.min(NC - 1, i0 + 1))];
            hcol[i] = a * (1 - fr) + b * fr;
          }
        }

        function resize() {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
          const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
          if (canvas.width === w && canvas.height === h && targetsReady) return;
          const oldA = canvas.width / Math.max(canvas.height, 1);
          const hadState = targetsReady && preRoll === 0;
          canvas.width = w;
          canvas.height = h;
          aspect = w / h;
          destroyTarget(paperT);
          paperT = createTarget(w, h);
          bakePaper();
          if (hadState) {
            // §7: FBOs are reallocated at the new size but the developed page
            // SURVIVES — the layer is resampled in world coordinates, the
            // height field is re-sampled on the CPU, bodies shift with the
            // horizontal centre. (Chosen over the blank-page reset option.)
            const newA = createTarget(w, h);
            const newB = createTarget(w, h);
            renderPass(newA, programs.copy, () => {
              const u = locations.copy;
              bindTexture(0, currentLayer().tex);
              gl.uniform1i(u.uSrc, 0);
              gl.uniform1f(u.uAspect, aspect);
              gl.uniform1f(u.uOldAspect, oldA);
            });
            clearTarget(newB);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            destroyTarget(layerA);
            destroyTarget(layerB);
            layerA = newA;
            layerB = newB;
            layerPing = false;
            remapHeights(oldA, aspect);
            const shift = (aspect - oldA) / 2;
            for (const b of bodies) b.cx += shift;
            for (const sp of pending) sp.x += shift;
          } else {
            destroyTarget(layerA);
            destroyTarget(layerB);
            layerA = createTarget(w, h);
            layerB = createTarget(w, h);
            clearTarget(layerA);
            clearTarget(layerB);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            layerPing = false;
          }
          targetsReady = true;
        }
        window.addEventListener("resize", resize, { passive: true });

        /* ------------------------------------------------------------------
           Frame loop
        ------------------------------------------------------------------ */

        let acc = 0;
        let lastNow = performance.now();
        let fpsLast = performance.now();
        let fpsFrames = 0;
        let readyStamped = false;
        let lastDrawSig = "";
        const readout = document.getElementById("readout");

        function frame(now) {
          resize();
          if (paperBaked !== state.paper) bakePaper();
          // dt clamp = MAX_SUBSTEPS worth of fixed steps: on slow (software
          // GL) machines the piece runs slow-motion instead of exploding.
          const rawDt = Math.min(MAX_SUBSTEPS / 60, Math.max(0, (now - lastNow) / 1000));
          lastNow = now;

          if (preRoll > 0) {
            // deterministic fixed-dt development (freeze pre-roll), chunked
            // with a true GPU sync per chunk (CRAFT §C4: swiftshader queues)
            const steps = Math.min(PRE_CHUNK, preRoll);
            for (let i = 0; i < steps; i++) {
              fixedStep();
              uploadH();
              layerUpdatePass(STEP);
              flushStamps();
            }
            preRoll -= steps;
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            glSync();
            if (preRoll > 0) {
              requestAnimationFrame(frame);
              return;
            }
          } else if (!FREEZE && !state.pauseAnim) {
            const dt = rawDt;
            if (dt > 0) {
              meters.onset *= Math.exp(-dt * 5);
              if (aud.mode === "mic") updateMicAudio(dt);
              else meters.rms *= Math.exp(-dt * 2.0);
              acc += dt;
              let n = 0;
              while (acc >= STEP && n < MAX_SUBSTEPS) {
                fixedStep();
                acc -= STEP;
                n++;
              }
              if (n === MAX_SUBSTEPS) acc = 0;   // frame drop: don't spiral
              if (n > 0) {
                uploadH();
                layerUpdatePass(STEP * n);
                flushStamps();
              }
            }
          }

          // static-scene short-circuit (frozen/paused only): identical input
          // → skip the GPU passes; preserveDrawingBuffer keeps the frame.
          const drawSig = `${simTime}|${canvas.width}x${canvas.height}|${
            state.paper}|${state.ink}|${state.weather}|${state.bleed}|${
            state.aka}|${state.amount}|${state.size}|${state.sweep}|${
            state.debugView}`;
          if (readyStamped && (FREEZE || state.pauseAnim) && drawSig === lastDrawSig) {
            requestAnimationFrame(frame);
            return;
          }
          lastDrawSig = drawSig;

          compositePass();
          drawFallingBodies();

          // verification hook: first REAL frame, stamped only after the GPU
          // queue is drained (renderPass(null,…) left the backbuffer bound)
          if (!readyStamped && preRoll === 0) {
            glSync();
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            const modeLabel = aud.mode === "mic" ? "mic"
              : aud.mode === "fake" ? "fake" : "デモ";
            // append the live speech diagnostic so the user can see whether
            // recognition is actually working on their device (shown once mic
            // mode is entered or recognition has been attempted)
            const speechInfo = (aud.mode === "mic" || speechDiag.state !== "—")
              ? ` / 音声 ${speechDiag.state}・認識${speechDiag.got}件`
                + (speechDiag.heard ? `・聴取${speechDiag.heard}` : "")
                + (speechDiag.err ? `・${speechDiag.err}` : "")
              : "";
            readout.textContent = `FPS ${fps.toFixed(0)} / 描画 ${canvas.width}×${
              canvas.height} / 文字 ${bodies.length}・堆積 ${
              Math.round(meanH * 100)}% / 入力 ${modeLabel}${
              lastWord ? " 「" + lastWord + "」" : ""}${speechInfo}`;
          }
          requestAnimationFrame(frame);
        }

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });

        // ---- overlay wiring (mic invite / error paths) ----
        micStartBtn.addEventListener("click", () => { startMic(); });
        micSkipBtn.addEventListener("click", () => setOverlay("hidden", "", "", null));
        document.getElementById("micBtn").addEventListener("click", () => { startMic(); });
        if (FAKESOURCE) {
          document.getElementById("micBtn").style.display = "none";
        } else {
          setOverlay("info", "言の葉時雨 — 音が墨になる",
            "マイクで集めた音が墨の活字になって降り積もります。声が取れれば言葉が、"
            + "環境音は「ザー」「ゴロゴロ」「ポツ」などのオノマトペが降ります。"
            + "マイクなしでもデモ時雨を眺められます。",
            { mic: true, skip: true, micLabel: "マイクを許可して始める" });
        }

        try {
          resize();
          requestAnimationFrame(frame);
        } catch (error) {
          const msg = error && error.message ? error.message : "";
          if (/RENDER TARGET INCOMPLETE/.test(msg)) {
            setOverlay("error", "RENDER TARGET UNAVAILABLE",
              "RGBA8 render targets could not be allocated. Try another browser/GPU.",
              null);
          } else {
            setOverlay("error", "WEBGL SETUP ERROR",
              msg || "Could not initialize the renderer.", null);
          }
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
