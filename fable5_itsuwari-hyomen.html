<!doctype html>
<!--
  fable5_itsuwari-hyomen.html — WebGL2「偽りの表面(The False Surface)」— webcam

  発注書: prompts/fable5_itsuwari-hyomen_order.md
  ディレクション規約: AI_DIRECTION_GUIDE.md / UI・カメラ規約の参照: fable5_papercraft-cam.html

  概要:
    Webカメラにはいつも通りの自分と風景が映る。しかしそれは偽りで、クリック/タップ
    した点を中心に表面が正方形ブロックとして剥離し、回転しながら崩れ落ちて画面下に
    堆積する。剥がれた穴からは本当の世界 — 彩度ゼロで味気ない、sobel 輪郭と粗い明暗
    だけの白黒世界 — が露出する。剥がれたブロックは剥離した瞬間の色を凍結したまま
    積もり、背後の白黒世界だけが動き続ける。放置すると表面は緩やかに自己修復する。

  様式解析の要約(視覚的不変量、優先順):
    1. 無傷の表面は生のカメラ映像そのもの — 継ぎ目・格子・タイル感は一切見えない。
       無傷領域は video テクスチャのフルスクリーン直描き(事前タイル分割の禁止)。
       剥離状態は低解像度マスク(グリッドセル単位、CPU 管理)で持ち、合成時に
       smoothstep 再鋭化した境界で生映像/裏世界を切り替える。
    3. 各ブロックは剥離した瞬間の映像を凍結して携える — 剥離イベント時のみ sceneT を
       GPU 内コピー(copyTexSubImage2D)でスナップショット凍結。世代 3 枚を参照
       カウント付きで共有し、ブロックは生成時の世代を元位置 UV で参照する。
    2. 剥離ブロックは回転を伴う剛体として落下し床に山なりに堆積 — CPU 物理
       (重力+空気抵抗+列ハイトマップ着地+安息角緩和+スリープ)、インスタンス描画。
    5. 崩壊は部分的 — クリックは手のひら大。支持喪失伝播(ストレス場の幾何減衰)で
       周縁セルが時間差で追い崩れ、必ず有限半径で止まる。乱数は cell-hash。
    4. 裏世界は彩度ゼロ — ライブ輝度の sobel 輪郭+3〜4 段の無彩ポスタライズを
       暗めに沈める。ライブ検知なので裏世界の被写体は動き続ける。
    6. 自己修復と風化 — マスクは穴の端から ema 的長時定数で回復。堆積ブロックは
       寿命で退色して白黒世界に同化し消滅(ボディ数・堆積高さは有界)。

  パイプライン図(P2 のみイベント時、他は毎フレーム):
    video / fakeScene ─► [P0 scene] cover-fit+mirror      sceneT  RGBA8 長辺≤1024
    sceneT ───────────► [P1 bw   ] sobel+無彩ポスタライズ  bwT     RGBA8 長辺≤512
    sceneT ─(剥離時)──► [P2 snap ] copyTexSubImage2D      snapT×3 RGBA8 sceneT同寸
    [CPU mask] グリッド(基準 64×40)剥離/伝播/修復 → R8 小テクスチャへ一方向転送
    [CPU phys] 剥離セル→剛体ボディ(≤1600)。列ハイトマップ堆積(安息角緩和+
               斜面スライド+支え喪失時の再落下)+スリープ+寿命
    [P3 comp ] bwT 基層+マスクで無傷領域だけ sceneT。穴の縁に厚みの影と欠けの縁
    [P4 block] instanced quads(snapT 世代参照+風化の退色)→ canvas

  スライダー(写真らしさ ↔ 様式の強さ。カッコ内は既定値):
    block   ブロックの大きさ(0.50)— グリッドセルの辺長(小=細かい破片/大=大きな板。
            既定は細かめ=画面幅の約 1/64。上限側が旧既定相当の大きな板)
    burst   崩れの規模(0.50)— クリック起点の初期剥離半径
    spread  追い崩れ(0.55)— 支持喪失伝播の確率と持続(0=起点のみ/1=広く連鎖)
    tumble  破片の暴れ(0.50)— 剥離時の初速・角速度・反発係数
    heal    修復の速さ(0.35)— 剥離マスクの回復時定数(0=ほぼ直らない)
    weather 破片の風化(0.50)— 堆積ブロックの退色・消滅までの寿命
    depth   裏世界の暗さ(0.30)— 白黒世界の沈み(既定は明るめの線画。上げると夜へ)
    edge    輪郭の感度(0.50)— sobel 輪郭のしきい値と線の太さ
    プリセット: 壁画の剥落(標準)/ 検知の世界 / 崩れ続ける夜

  実行方法:
    python3 -m http.server 8888
    → http://localhost:8888/fable5_itsuwari-hyomen.html を開きカメラを許可し、
    画面をクリック/ドラッグすると表面が剥がれる。
    (カメラ API はセキュアコンテキスト必須。file:// では動きません)
    ?fakesource=1 … カメラ不使用。GLSL 合成シーン(揺れる人物+振り子ランプ+雲)で駆動
    ?freeze=1     … 時間駆動を停止(合成シーン・物理・伝播・修復。決定的静止フレーム)
    ?prewarm=<秒> … 初回描画前に固定 dt で決定的早送り。スクリプトの剥離イベント
                    3 発を含み、穴・落下・堆積・追い崩れ・部分修復が揃った状態を作る
    uDebug: 0=最終 / 1=剥離マスク / 2=裏世界のみ / 3=ブロックのみ / 4=標本

  依存: なし(外部ライブラリ・MLモデル不使用)。WebGL2 / GLSL ES 3.00 単体。
-->
