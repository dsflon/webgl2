        function solveContactPos(c) {
          const a = c.a;
          const b = c.b;
          let pen = c.p0 ? c.p0.pen : 0;
          if (c.p1 && c.p1.pen > pen) pen = c.p1.pen;
          const nx = c.nx;
          const ny = c.ny;
          const bpx = b ? b.pushX : 0;
          const bpy = b ? b.pushY : 0;
          const remaining =
            pen - ((bpx - a.pushX) * nx + (bpy - a.pushY) * ny);
          const slop = Math.max(0.35, a.h * 0.08);
          if (remaining <= slop) return;
          const wA = c.dynA ? 1 : 0;
          const wB = c.dynB ? 1 : 0;
          const tot = wA + wB;
          if (tot === 0) return;
          const corr = (remaining - slop) * 0.42;
          if (c.dynA) {
            a.pushX -= (nx * corr * wA) / tot;
            a.pushY -= (ny * corr * wA) / tot;
          }
          if (c.dynB) {
            b.pushX += (nx * corr * wB) / tot;
            b.pushY += (ny * corr * wB) / tot;
          }
        }

        // OBB-OBB proximity test (fast SAT rejection with a contact margin,
        // no clipping): are A and B within `margin` of touching? Used by the
        // ground-connectivity flood fill — a resting pair separated by more
        // than the slop is NOT an edge of the contact graph.
        function boxesTouch(A, B, margin) {
          const ca = Math.cos(A.ang);
          const sa = Math.sin(A.ang);
          const cb = Math.cos(B.ang);
          const sb = Math.sin(B.ang);
          const hA = A.h + margin;
          const hB = B.h + margin;
          const dpx = B.x - A.x;
          const dpy = B.y - A.y;
          const K =
            Math.abs(ca * cb + sa * sb) + Math.abs(sa * cb - ca * sb) + 2e-6;
          if (Math.abs(dpx * ca + dpy * sa) - hA - hB * K > 0) return false;
          if (Math.abs(-dpx * sa + dpy * ca) - hA - hB * K > 0) return false;
          if (Math.abs(dpx * cb + dpy * sb) - hB - hA * K > 0) return false;
          if (Math.abs(-dpx * sb + dpy * cb) - hB - hA * K > 0) return false;
          return true;
        }

        // Ground-connectivity flood fill over the RESTING (sleeping/frozen)
        // bodies. Seeds = bodies whose outermost corner touches the floor or
        // a side wall; edges = box-box proximity contacts between resting
        // bodies. Sets b.grounded on every resting body and returns the count
        // of resting bodies NOT connected to ground (the "floating island"
        // metric). Local "has a neighbour below" support is insufficient —
        // a dense mid-air jam has neighbours below yet touches no ground, so
        // it must be caught by global connectivity, not a per-body scan.
        // (repair #4: contact-based physics' classic floating-island problem.)
        function scanGroundConnectivity() {
          buildBroadphase();
          const W = canvas.width;
          const H = canvas.height;
          const margin = Math.max(1.5, Math.min(cellW, cellH) * 0.22);
          const rest = [];
          for (let i = 0; i < bodies.length; i++) {
            const b = bodies[i];
            if (b.state === 0) continue;
            b.grounded = false;
            rest.push(b);
          }
          // seed the BFS with floor/wall contacts (rotated half-diagonal)
          const queue = [];
          for (let r = 0; r < rest.length; r++) {
            const b = rest[r];
            const hd =
              b.h * (Math.abs(Math.cos(b.ang)) + Math.abs(Math.sin(b.ang)));
            if (
              b.y + hd >= H - margin ||
              b.x - hd <= margin ||
              b.x + hd >= W - margin
            ) {
              b.grounded = true;
              queue.push(b);
            }
          }
          // BFS across the resting contact graph
          let head = 0;
          while (head < queue.length) {
            const b = queue[head++];
            const gx = Math.floor(b.x / bpCell);
            const gy = Math.floor(b.y / bpCell);
            for (let oy = -1; oy <= 1; oy++) {
              for (let ox = -1; ox <= 1; ox++) {
                const arr = bpMap.get(bpKey(gx + ox, gy + oy));
                if (!arr) continue;
                for (let k = 0; k < arr.length; k++) {
                  const o = bodies[arr[k]];
                  if (o.state === 0 || o.grounded) continue;
                  if (boxesTouch(b, o, margin)) {
                    o.grounded = true;
                    queue.push(o);
                  }
                }
              }
            }
          }
          let ungrounded = 0;
          for (let r = 0; r < rest.length; r++) {
            if (!rest[r].grounded) ungrounded++;
          }
          return ungrounded;
        }

        // Periodic scan (every 15 steps): ground connectivity replaces the old
        // local support test. (a) resting bodies NOT connected to the floor
        // through a contact chain — floating islands, or piles that lost their
        // support to weathering — wake quietly and subside; (b) grounded,
        // long-asleep bodies carrying load freeze (leave the solver).
        function supportScan() {
          scanGroundConnectivity(); // sets b.grounded, (re)builds broadphase
          for (let i = 0; i < bodies.length; i++) {
            const b = bodies[i];
            if (b.state === 0) continue;
            if (!b.grounded) {
              wakeBody(b, true); // quiet subsidence, never a bounce
              continue;
            }
            // deep-pile freeze uses a "loaded from directly above" test, so
            // it only applies while gravity is (near) vertical
            if (b.state === 1 && b.sleepT > FREEZE_AFTER && Math.abs(gravAng) < 0.05) {
              // freeze only if something rests on top (keeps the exposed top
              // layer solver-active so new falls still land on it)
              let load = false;
              const gx = Math.floor(b.x / bpCell);
              const gy = Math.floor(b.y / bpCell);
              for (let oy = -1; oy <= 0 && !load; oy++) {
                for (let ox = -1; ox <= 1; ox++) {
                  const arr = bpMap.get(bpKey(gx + ox, gy + oy));
                  if (!arr) continue;
                  for (let k = 0; k < arr.length; k++) {
                    const o = bodies[arr[k]];
                    if (o === b) continue;
                    if (Math.abs(o.x - b.x) > (o.h + b.h) * 1.25) continue;
                    const dy = o.y - b.y; // < 0 → o above b (y-down)
                    if (dy < 0 && -dy < (o.h + b.h) * 1.6) {
                      load = true;
                      break;
                    }
                  }
                  if (load) break;
                }
              }
              if (load) b.state = 2; // deep-pile freeze: drawn only
            }
          }
        }

        function physicsStep(dt) {
          const t0 = performance.now();
          const W = canvas.width;
          const H = canvas.height;
          const sc = H / 750;
          physStepCount++;
          updateGravityTilt(dt); // device tilt → gravity direction (mobile)

          // ---- weathering + lifetime (resting bodies only: falling chips
          // stay fresh, matching the frozen-snapshot look). The lifetime is
          // evaluated against the CURRENT weather slider each step, so
          // turning 風化 up visibly ages the existing pile too. Runs for
          // sleeping AND frozen bodies alike — deep-pile freeze is solver
          // exclusion, never a pause of time.
          // Heal coupling (repair #5, made bounded in repair #6): once a
          // block's origin cell has healed over (healedAway latches), the
          // orphaned chip no longer merely ages FASTER — its whole remaining
          // life is CLAMPED to a short fixed window (fadeLife ≈ 2–4 s,
          // cell-hash jitter). A multiplier was not an expiry date: at the
          // default weather the 43 s life only became ~17 s, so chips born
          // just before the last tap outlived the repair by half a minute
          // (measured: wounds 0 at t=53.0, floor empty at t=69.5). With the
          // clamp, "the cell closed ⇒ its chip is gone a few seconds later"
          // is guaranteed. Insurance: when the surface is fully repaired
          // (no wounded cell at all) EVERY remaining body gets the same
          // bounded fade, including falling ones, so stray chips whose
          // origin cell went out of range can never survive.
          const lifeBase = 70 - 62 * Math.pow(state.weather, 1.2);
          const allHealed = peeledCellsLive === 0;
          for (let i = bodies.length - 1; i >= 0; i--) {
            const b = bodies[i];
            const resting = b.state > 0;
            // falling chips stay fresh (the frozen-snapshot look) — unless
            // the surface is already whole again, in which case even a
            // straggler in the air must fade out, or the chip has been
            // doomed by an overload valve (repair #8: the fade must run
            // even mid-air, otherwise a doomed flyer would never leave).
            if (!resting && !allHealed && !b.doom) continue;
            if (resting) b.sleepT += dt;
            if (!b.healedAway) {
              const ci = b.ci;
              const gone = ci < 0 || ci >= surf.length || surf[ci] > 0.85;
              if (allHealed || gone) b.healedAway = true;
            }
            let life = Math.max(2, lifeBase * b.wJit * (b.wFast ? 1 / 3 : 1));
            if (b.healedAway) life = Math.min(life, b.fadeLife);
            if (b.doom) life = Math.min(life, 3);
            b.weather += dt / life;
            if (b.weather >= 1) {
              rmCount.weather++;
              removeBody(i);
            }
          }

          // ---- integrate active bodies (semi-implicit Euler)
          let active = 0;
          for (let i = 0; i < bodies.length; i++) {
            const b = bodies[i];
            if (b.state !== 0) {
              b.airT = 0;
              b.supported = false;
              continue;
            }
            if (b.supported) b.airT = 0;
            else b.airT += dt;
            b.supported = false;
            b.groundedNow = false;
            active++;
            // gravity as a VECTOR: vertical on desktop, rolled by device
            // tilt on mobile (gDir is a unit vector, magnitude unchanged)
            b.vy += 2.6 * H * gDirY * dt;
            b.vx += 2.6 * H * gDirX * dt;
            const dragL = b.quiet ? 2.4 : 0.5;
            const dragA = b.quiet ? 1.6 : 0.15;
            b.vx *= Math.exp(-dragL * dt);
            b.angv *= Math.exp(-dragA * dt);
            // anti-tunneling speed cap: one block edge per fixed step
            const vmax = Math.min(2.4 * H, (b.size * 0.85) / SDT);
            if (b.vy > vmax) b.vy = vmax;
            else if (b.vy < -vmax) b.vy = -vmax;
            if (b.vx > vmax) b.vx = vmax;
            else if (b.vx < -vmax) b.vx = -vmax;
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.ang += b.angv * dt;
          }
          physActiveNow = active;
          // Adaptive solver budget (repair #8): over the active cap the
          // iteration counts drop instead of the body count. Iterations are
          // the inner loop, so this is where the cost actually lives; a
          // softer pile for a fraction of a second is invisible next to
          // blocks disappearing.
          const overload = active / MAX_ACTIVE;
          const velIters = overload > 1.6 ? 2 : overload > 1.15 ? 3 : VEL_ITERS;
          const posIters = overload > 1.6 ? 1 : overload > 1.15 ? 2 : POS_ITERS;

          if (active > 0) {
            buildBroadphase();
            genContacts(sc);
            // restitution only for genuine impacts: the threshold must sit
            // far above the per-step gravity velocity (grav·dt). At ~2×
            // grav·dt settled wedges still catch the bias occasionally and
            // the pile self-excites in a limit cycle (measured: totalSpeed
            // ~20 px/s forever); at 5× it is unreachable at rest while real
            // falls (≥ a few block heights) still bounce.
            const restThreshV = Math.max(110 * sc, 5.0 * 2.6 * H * SDT);
            for (let k = 0; k < contacts.length; k++) {
              prestepContact(contacts[k], restThreshV);
            }
            for (let it = 0; it < velIters; it++) {
              for (let k = 0; k < contacts.length; k++) {
                solveContactVel(contacts[k]);
              }
            }
            for (let it = 0; it < posIters; it++) {
              for (let k = 0; k < contacts.length; k++) {
                solveContactPos(contacts[k]);
              }
            }
            // apply positional pushes + support flags + ground propagation +
            // store warm impulses. Ground connectivity is threaded through the
            // contact list each step: a boundary (floor/wall) contact grounds
            // the body; a contact with an already-grounded resting body grounds
            // the active one. A mid-air jam touches neither, so no member is
            // grounded and none may sleep — it keeps falling (repair #4).
            for (let k = 0; k < contacts.length; k++) {
              const c = contacts[k];
              const a = c.a;
              const b = c.b;
              // "supported" = the contact normal opposes GRAVITY (not just
              // +y): under device tilt the downhill wall carries load too.
              const sup = c.nx * gDirX + c.ny * gDirY;
              if (!b) {
                if (sup > 0.6) a.supported = true;
                a.groundedNow = true; // touching the floor or a wall
              } else {
                if (sup > 0.6) a.supported = true;
                else if (sup < -0.6) b.supported = true;
                if (a.state === 0 && b.state > 0 && b.grounded) {
                  a.groundedNow = true;
                }
                if (b.state === 0 && a.state > 0 && a.grounded) {
                  b.groundedNow = true;
                }
              }
              const rec = { stamp: physStepCount, p: [] };
              if (c.p0) {
                rec.p.push({ px: c.p0.px, py: c.p0.py, jn: c.p0.jn, jt: c.p0.jt });
              }
              if (c.p1) {
                rec.p.push({ px: c.p1.px, py: c.p1.py, jn: c.p1.jn, jt: c.p1.jt });
              }
              wsMap.set(c.key, rec);
            }
            for (let i = 0; i < bodies.length; i++) {
              const b = bodies[i];
              if (b.state !== 0) continue;
              if (b.pushX !== 0 || b.pushY !== 0) {
                b.x += b.pushX;
                b.y += b.pushY;
                b.pushX = 0;
                b.pushY = 0;
              }
              // ---- sleep bookkeeping (Matter-style smoothed motion)
              const motion =
                b.vx * b.vx + b.vy * b.vy + b.angv * b.angv * b.size * b.size;
              b.motionS = 0.75 * b.motionS + 0.25 * motion;
              const thresh = 15 * sc * (15 * sc);
              // sleep only when low-motion AND supported from below AND
              // grounded (connected to the floor) — a floating jam is
              // low-motion + supported but not grounded, so it stays awake.
              if (b.motionS < thresh && b.supported && b.groundedNow) {
                b.sleepCount++;
              } else {
                b.sleepCount = Math.max(0, b.sleepCount - 2);
              }
              if (b.sleepCount >= SLEEP_STEPS) {
                sleepBody(b);
                active--;
              }
            }
            // ---- active cap: force-sleep the oldest GROUNDED supported
            // movers only (never freeze a falling/floating body in mid-air).
            if (active > MAX_ACTIVE) {
              const cand = [];
              for (let i = 0; i < bodies.length; i++) {
                const b = bodies[i];
                if (b.state === 0 && b.supported && b.groundedNow) cand.push(b);
              }
              cand.sort((p, q) => p.born - q.born || p.id - q.id);
              for (let k = 0; k < cand.length && active > MAX_ACTIVE; k++) {
                sleepBody(cand[k]);
                active--;
              }
              // The overage is airborne: nothing may be frozen in mid-air and
              // NOTHING MAY BE DELETED (repair #8 — instantly popping blocks
              // the viewer is watching is forbidden; the old code here removed
              // 1139 blocks in a single step when a 5° tilt woke a big pile).
              // Cost is bounded by two degradations that do not touch content:
              //   1. fewer solver iterations (applied above, before the solve)
              //   2. genuine overload only (≥1.5× the cap): put the oldest
              //      bodies into the ~1 s dissolve FADE — graceful, never a pop
              if (active > MAX_ACTIVE * 1.5) {
                for (let k = 0; k < 16; k++) {
                  if (!doomOldest()) break;
                  rmCount.doomOverload++;
                }
              }
            }
          } else {
            physContactsNow = 0;
          }

          if (physStepCount % 15 === 0 && bodies.length > 0) supportScan();
          if (physStepCount % 120 === 0 && wsMap.size > 4096) {
            for (const [key, rec] of wsMap) {
              if (rec.stamp < physStepCount - 3) wsMap.delete(key);
            }
          }

          physMsAvg = physMsAvg * 0.9 + (performance.now() - t0) * 0.1;
        }

        // Diagnostic probe (verification aid; no effect on rendering).
        // `ungrounded` runs an independent ground-connectivity flood fill on
        // the current resting bodies — the machine metric for the
        // floating-island bug (repair #4): >0 before the fix, ~0 after.
        window.__physProbe = () => {
          const H = canvas.height;
          const sc = H / 750;
          const ungrounded = scanGroundConnectivity();
          const sample = [];
          let sup = 0;
          let slp = 0;
          let frz = 0;
          let healed = 0;
          let doomed = 0;
          let wSum = 0;
          let wN = 0;
          let cxSum = 0;
          let cyMin = 1;
          let spdMax = 0;
          for (let i = 0; i < bodies.length; i++) {
            const b = bodies[i];
            cxSum += b.x / Math.max(1, canvas.width);
            cyMin = Math.min(cyMin, b.y / Math.max(1, H));
            spdMax = Math.max(spdMax, Math.hypot(b.vx, b.vy) / Math.max(1, H));
            if (b.state === 1) slp++;
            else if (b.state === 2) frz++;
            if (b.supported) sup++;
            if (b.healedAway) healed++;
            if (b.doom) doomed++;
            if (b.state > 0) {
              wSum += b.weather;
              wN++;
            }
            if (i % 97 === 0) {
              sample.push({
                st: b.state,
                sup: b.supported,
                slc: b.sleepCount,
                mo: +b.motionS.toFixed(2),
                vx: +b.vx.toFixed(2),
                vy: +b.vy.toFixed(2),
                av: +b.angv.toFixed(3),
                y: Math.round(b.y),
                q: b.quiet,
                w: +b.weather.toFixed(3),
              });
            }
          }
          return {
            n: bodies.length,
            wounded: peeledCellsLive, // cells not yet fully repaired
            t: +simTime.toFixed(2),
            active: physActiveNow,
            contacts: physContactsNow,
            supported: sup,
            ungrounded, // resting bodies not connected to the floor (repair #4)
            sleeping: slp,
            frozen: frz,
            healedAway: healed, // heal-coupled fast fade (repair #5)
            doomed, // soft-cap fade valve (repair #5)
            wMean: wN ? +(wSum / wN).toFixed(3) : 0,
            // pile shape/energy metrics (tilt verification, repair #6)
            cxMean: bodies.length ? +(cxSum / bodies.length).toFixed(3) : 0,
            topY: bodies.length ? +cyMin.toFixed(3) : 1,
            vMax: +spdMax.toFixed(3),
            gravDeg: +((gravAng * 180) / Math.PI).toFixed(2),
            // cumulative removals per path (repair #8 diagnosis)
            rm: { ...rmCount },
            thresh: +(15 * sc * (15 * sc)).toFixed(2),
            ms: +physMsAvg.toFixed(3),
            step: physStepCount,
            sample,
          };
        };

        function simStep(dt) {
          simTime += dt;
          propAccum += dt;
          while (propAccum >= PROP_DT) {
            propagationTick();
            propAccum -= PROP_DT;
          }
          healStep(dt);
          physicsStep(dt);
        }

        /* ------------------------------------------------------------------
           Snapshot generations — GPU-side copy at peel events only
           (copyTexSubImage2D from the scene FBO; no per-frame copies)
        ------------------------------------------------------------------ */

        function flushSnapshot() {
          if (!pendingGen.length) return;
          if (snapCur < 0 || simTime - snapLastT > 0.3) {
            let g = -1;
            for (let k = 0; k < 3; k++) {
              if (snapRefs[k] === 0 && k !== snapCur) {
                g = k;
                break;
              }
            }
            if (g < 0) {
              let best = Infinity;
              for (let k = 0; k < 3; k++) {
                if (k !== snapCur && snapStamp[k] < best) {
                  best = snapStamp[k];
                  g = k;
                }
              }
              if (g < 0) g = 0;
            }
            gl.bindFramebuffer(gl.FRAMEBUFFER, targets.scene.fbo);
            gl.bindTexture(gl.TEXTURE_2D, snapTex[g]);
            gl.copyTexSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 0, 0, sceneW, sceneH);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            snapStamp[g] = simTime;
            snapCur = g;
            snapLastT = simTime;
          }
          for (let k = 0; k < pendingGen.length; k++) {
            pendingGen[k].gen = snapCur;
            snapRefs[snapCur]++;
          }
          pendingGen.length = 0;
        }

        /* ------------------------------------------------------------------
           Pointer input — click and drag both peel (tech note 17)
        ------------------------------------------------------------------ */

        const peelQueue = [];
        let dragging = false;
        let lastPeelX = 0;
        let lastPeelY = 0;

        function queuePeel(e) {
          const rect = canvas.getBoundingClientRect();
          if (rect.width < 2 || rect.height < 2) return;
          const ux = (e.clientX - rect.left) / rect.width;
          const uyUp = 1 - (e.clientY - rect.top) / rect.height;
          if (ux < 0 || ux > 1 || uyUp < 0 || uyUp > 1) return;
          peelQueue.push([ux, uyUp]);
          lastPeelX = e.clientX;
          lastPeelY = e.clientY;
        }

        canvas.addEventListener("pointerdown", (e) => {
          dragging = true;
          try {
            canvas.setPointerCapture(e.pointerId);
          } catch (_) {
            /* older browsers */
          }
          queuePeel(e);
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const minD = Math.max(6, (cellW / dpr) * 0.7);
          const dx = e.clientX - lastPeelX;
          const dy = e.clientY - lastPeelY;
          if (dx * dx + dy * dy >= minD * minD) queuePeel(e);
        });
        const endDrag = () => {
          dragging = false;
        };
        canvas.addEventListener("pointerup", endDrag);
        canvas.addEventListener("pointercancel", endDrag);
        window.addEventListener("blur", endDrag);

        /* ------------------------------------------------------------------
           Device tilt (mobile, secondary input) — the device's left/right
           roll AS SEEN ON SCREEN tilts the SOLVER'S GRAVITY VECTOR, so the
           pile slides downhill and gathers against the lower wall. Desktop /
           permission denied / unsupported: no events arrive and everything
           behaves as before. Recipe (permission flow) follows
           fable5_senkohanabi.html.

           deviceorientation's (beta, gamma) live in the DEVICE frame: gamma
           is the left/right roll only while the device is held UPRIGHT. Once
           the phone is turned to landscape, gamma becomes the front/back axis
           and no longer matches "left/right on screen". So the pair is
           rotated into SCREEN space by the current screen.orientation.angle:

             screenTilt = gamma·cos θ − beta·sin θ      (θ = orientation angle)
               θ=0   (portrait)        →  gamma
               θ=90  (landscape-left)  → −beta
               θ=180 (portrait upside) → −gamma
               θ=270 (landscape-right) →  beta

           θ=0 reproduces the previous portrait-only behaviour exactly.
        ------------------------------------------------------------------ */

        // tilt is an external input like the pointer: verification runs
        // (freeze / prewarm / settle / fakesource) ignore it entirely so the
        // deterministic frames stay deterministic.
        const TILT_INPUT_OK =
          TILT_TEST || (!FREEZE && PREWARM === 0 && SETTLE === 0 && !FAKE);
        let tiltActive = false;
        let tiltScreenDeg = 0; // left/right tilt in SCREEN space, clamped ±40°
        let rawGammaDeg = 0; // last raw sensor pair (device frame)
        let rawBetaDeg = 0;
        let screenAngleDeg = 0; // screen.orientation.angle, normalized 0..359
        let gravAng = 0; // eased gravity tilt actually used by the solver (rad)
        let gravAngWake = 0; // angle at which the pile was last woken
        let gDirX = 0; // gravity unit vector (screen space, y down)
        let gDirY = 1;

        function readScreenAngle() {
          const so = window.screen && window.screen.orientation;
          let a =
            so && typeof so.angle === "number" ? so.angle : window.orientation;
          if (typeof a !== "number" || !isFinite(a)) a = 0;
          screenAngleDeg = ((a % 360) + 360) % 360;
        }
        readScreenAngle();

        // beta is the pitch axis and swings far wider than gamma (±180°), so
        // it gets the same ±40° clamp before the rotation — a phone laid flat
        // or stood up must not be able to slam gravity to the rail.
        function recomputeScreenTilt() {
          const g = Math.max(-40, Math.min(40, rawGammaDeg));
          const b = Math.max(-40, Math.min(40, rawBetaDeg));
          const th = (screenAngleDeg * Math.PI) / 180;
          const t = g * Math.cos(th) - b * Math.sin(th);
          tiltScreenDeg = Math.max(-40, Math.min(40, t));
        }

        function onDeviceOrientation(ev) {
          if (!TILT_INPUT_OK) return;
          if (ev.gamma == null && ev.beta == null) return;
          tiltActive = true;
          if (ev.gamma != null) rawGammaDeg = ev.gamma;
          if (ev.beta != null) rawBetaDeg = ev.beta;
          recomputeScreenTilt();
        }

        // Turning the phone changes θ by 90° in one step, which would jump
        // the TARGET angle. It is only a target: updateGravityTilt still eases
        // it through the same ema + 60°/s rate limit, so the pile flows to the
        // new downhill instead of being teleported.
        function onScreenAngleChange() {
          readScreenAngle();
          recomputeScreenTilt();
        }
        window.addEventListener("orientationchange", onScreenAngleChange, {
          passive: true,
        });
        if (
          window.screen &&
          window.screen.orientation &&
          typeof window.screen.orientation.addEventListener === "function"
        ) {
          window.screen.orientation.addEventListener(
            "change",
            onScreenAngleChange,
          );
        }

        let tiltRequested = false;
        function maybeRequestTilt() {
          if (tiltRequested || !TILT_INPUT_OK) return;
          tiltRequested = true;
          const DOE = window.DeviceOrientationEvent;
          if (!DOE) return;
          if (typeof DOE.requestPermission === "function") {
            // iOS 13+: must be called from a user gesture (pointerdown)
            DOE.requestPermission()
              .then((res) => {
                if (res === "granted") {
                  window.addEventListener(
                    "deviceorientation",
                    onDeviceOrientation,
                    true,
                  );
                }
              })
              .catch(() => {
                /* denied / unavailable → pointer-only, no visible change */
              });
          }
        }
        canvas.addEventListener("pointerdown", maybeRequestTilt);
        if (
          TILT_INPUT_OK &&
          window.DeviceOrientationEvent &&
          typeof window.DeviceOrientationEvent.requestPermission !== "function"
        ) {
          window.addEventListener(
            "deviceorientation",
            onDeviceOrientation,
            true,
          );
        }

        // Gravity easing: ema toward the target angle + a hard rate limit
        // (≤ 60°/s). A flick of the wrist must never teleport the field and
        // blow the pile apart. When the direction has moved more than 3°
        // since the last wake, the resting pile is woken QUIETLY (zero
        // velocity, no restitution) so it flows downhill instead of
        // clattering.
        const TILT_MAX_ANG = 0.7; // 40° at slider 1.0
        function updateGravityTilt(dt) {
          const target =
            TILT_INPUT_OK && tiltActive
              ? Math.max(-1, Math.min(1, tiltScreenDeg / 35)) *
                TILT_MAX_ANG *
                state.tilt
              : 0;
          const k = 1 - Math.exp(-3.5 * dt);
          let a = gravAng + (target - gravAng) * k;
          const lim = 1.05 * dt; // rad/s cap
          if (a > gravAng + lim) a = gravAng + lim;
          else if (a < gravAng - lim) a = gravAng - lim;
          gravAng = a;
          gDirX = Math.sin(gravAng);
          gDirY = Math.cos(gravAng);
          frictionNow =
            FRICTION *
            (1 - 0.45 * Math.min(1, Math.abs(gravAng) / TILT_MAX_ANG));
          if (Math.abs(gravAng - gravAngWake) > 0.052) {
            gravAngWake = gravAng;
            tiltWakeSeq++; // opens a new wave — woken in bounded batches
          }
          tiltWakeTick();
        }

        // Test paths for the tilt route (headless has no real sensor):
        //   __setTilt(deg)  — inject the SCREEN-space tilt directly, skipping
        //                     the orientation rotation (used by the physics
        //                     stress tests; unaffected by screen angle).
        //   the orientation mapping itself is verified by dispatching real
        //   `deviceorientation` events with a faked screen.orientation.angle.
        window.__setTilt = (deg) => {
          if (!TILT_INPUT_OK) return { gamma: 0, gravDeg: 0 };
          tiltActive = true;
          tiltScreenDeg = Math.max(-40, Math.min(40, deg));
          return {
            gamma: tiltScreenDeg,
            gravDeg: +((gravAng * 180) / Math.PI).toFixed(2),
          };
        };
        window.__gravProbe = () => ({
          gravDeg: +((gravAng * 180) / Math.PI).toFixed(2),
          screenTilt: +tiltScreenDeg.toFixed(2),
          screenAngle: screenAngleDeg,
          tiltActive,
          enabled: TILT_INPUT_OK,
        });

        /* ------------------------------------------------------------------
           Render passes
        ------------------------------------------------------------------ */

        let cameraReady = false;
        let haveVideo = false;

        function uploadVideoFrame() {
          if (
            cameraReady &&
            video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
            video.videoWidth > 0 &&
            video.videoHeight > 0
          ) {
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(
              gl.TEXTURE_2D,
              0,
              gl.RGBA,
              gl.RGBA,
              gl.UNSIGNED_BYTE,
              video,
            );
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            return true;
          }
          return false;
        }

        function renderScene() {
          renderPass(targets.scene, programs.scene, () => {
            const u = locations.scene;
            bindTexture(0, videoTexture);
            gl.uniform1i(u.uVideo, 0);
            gl.uniform2f(u.uResolution, sceneW, sceneH);
            gl.uniform2f(
              u.uVideoSize,
              Math.max(1, video.videoWidth),
              Math.max(1, video.videoHeight),
            );
            gl.uniform1f(u.uTime, simTime);
            gl.uniform1i(u.uMirror, state.mirror ? 1 : 0);
            gl.uniform1i(u.uFake, FAKE ? 1 : 0);
            gl.uniform1i(u.uHasVideo, haveVideo ? 1 : 0);
          });
        }

        // The weathering TARGET tone of pile blocks (and the specimen's
        // weathering row) follows the current world: deep nega → fade toward
        // dark grays, positive → light grays (invariant 6 stays coherent).
        function negaDepthEq() {
          return 0.15 + 0.7 * state.nega;
        }

        function renderBw() {
          renderPass(targets.bw, programs.bw, () => {
            const u = locations.bw;
            bindTexture(0, targets.scene.tex);
            gl.uniform1i(u.uScene, 0);
            gl.uniform2f(u.uTexel, 1 / bwW, 1 / bwH);
            gl.uniform2f(u.uBwRes, bwW, bwH);
            gl.uniform1f(u.uNega, state.nega);
            gl.uniform1f(u.uEdge, state.edge);
          });
        }

        function uploadMask() {
          if (!maskDirty) return;
          maskDirty = false;
          for (let i = 0; i < cellCount; i++) {
            maskU8[i] = Math.max(0, Math.min(255, Math.round(surf[i] * 255)));
          }
          gl.bindTexture(gl.TEXTURE_2D, maskTex);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
          gl.texSubImage2D(
            gl.TEXTURE_2D,
            0,
            0,
            0,
            gridW,
            gridH,
            gl.RED,
            gl.UNSIGNED_BYTE,
            maskU8,
          );
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
        }

        function renderComp() {
          renderPass(null, programs.comp, () => {
            const u = locations.comp;
            bindTexture(0, targets.scene.tex);
            bindTexture(1, targets.bw.tex);
            bindTexture(2, maskTex);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uBw, 1);
            gl.uniform1i(u.uMask, 2);
            gl.uniform2f(u.uGrid, gridW, gridH);
            gl.uniform1f(u.uDepth, negaDepthEq());
            gl.uniform1f(u.uNega, state.nega);
            gl.uniform1i(u.uDebug, state.debugView);
          });
        }

        function renderBlocks() {
          let n = 0;
          for (let k = 0; k < bodies.length && n < MAX_BODIES; k++) {
            const b = bodies[k];
            const o = n * FLOATS_PER_INSTANCE;
            instanceData[o] = b.x;
            instanceData[o + 1] = b.y;
            instanceData[o + 2] = b.size;
            instanceData[o + 3] = b.ang;
            instanceData[o + 4] = b.u;
            instanceData[o + 5] = b.v;
            instanceData[o + 6] = b.uhx;
            instanceData[o + 7] = b.uhy;
            instanceData[o + 8] = b.gen;
            instanceData[o + 9] = b.weather;
            n++;
          }
          if (n === 0) return;
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.useProgram(programs.blocks);
          gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuf);
          gl.bufferSubData(
            gl.ARRAY_BUFFER,
            0,
            instanceData.subarray(0, n * FLOATS_PER_INSTANCE),
          );
          const u = locations.blocks;
          bindTexture(0, snapTex[0]);
          bindTexture(1, snapTex[1]);
          bindTexture(2, snapTex[2]);
          gl.uniform1i(u.uSnap0, 0);
          gl.uniform1i(u.uSnap1, 1);
          gl.uniform1i(u.uSnap2, 2);
          gl.uniform2f(u.uRes, canvas.width, canvas.height);
          gl.uniform1f(u.uDepth, negaDepthEq());
          gl.uniform1i(u.uDebug, state.debugView);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.bindVertexArray(blocksVao);
          if (state.debugView === 0) {
            // soft drop shadows first, then the blocks on top
            const cell = Math.min(cellW, cellH);
            gl.uniform1i(u.uShadow, 1);
            gl.uniform2f(u.uShadowOff, cell * 0.28, cell * 0.42);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, n);
          }
          gl.uniform1i(u.uShadow, 0);
          gl.uniform2f(u.uShadowOff, 0, 0);
          gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, n);
          gl.bindVertexArray(null);
          gl.disable(gl.BLEND);
        }

        /* ------------------------------------------------------------------
           Frame loop + deterministic prewarm
        ------------------------------------------------------------------ */

        const SDT = 1 / 60;
        let accum = 0;
        let lastNow = performance.now();
        let fpsLast = performance.now();
        let fpsFrames = 0;
        let statLast = 0;
        let readyStamped = false;
        const readout = document.getElementById("readout");

        function processPointerQueue() {
          for (let k = 0; k < peelQueue.length; k++) {
            peelBurst(peelQueue[k][0], peelQueue[k][1]);
          }
          peelQueue.length = 0;
        }

        function updateReadout(fps) {
          peeledCells = 0;
          for (let i = 0; i < cellCount; i++) {
            if (surf[i] < 0.995) peeledCells++;
          }
          let sleeping = 0;
          for (let k = 0; k < bodies.length; k++) {
            if (bodies[k].state > 0) sleeping++;
          }
          readout.textContent =
            `FPS ${fps.toFixed(0)} / 解像度 ${canvas.width}×${canvas.height}` +
            ` / 剥離 ${peeledCells} セル / ボディ ${bodies.length} (堆積 ${sleeping})` +
            ` / 物理 ${physMsAvg.toFixed(2)}ms (可動 ${physActiveNow}・接触 ${physContactsNow})` +
            (tiltActive
              ? ` / 傾き ${((gravAng * 180) / Math.PI).toFixed(0)}°`
              : "");
        }

        function frame(now) {
          resize();
          if (gridRebuildWanted) {
            gridRebuildWanted = false;
            rebuildGrid();
          }
          const rawDt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
          lastNow = now;
          const dt = FREEZE || state.pauseAnim ? 0 : rawDt;

          haveVideo = FAKE ? false : uploadVideoFrame();
          renderScene();
          processPointerQueue();

          if (ffBusy) {
            accum = 0; // a scripted fast-forward owns the clock
          } else {
            accum += dt;
            let steps = 0;
            while (accum >= SDT && steps < 4) {
              simStep(SDT);
              accum -= SDT;
              steps++;
            }
            if (accum > 4 * SDT) accum = 0;
          }

          flushSnapshot();
          renderBw();
          uploadMask();
          renderComp();
          if (state.debugView === 0 || state.debugView === 3) renderBlocks();

          if (!readyStamped) {
            glSync(); // the first real frame actually finished (CRAFT §C4)
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            updateReadout(fps);
          }
          requestAnimationFrame(frame);
        }

        // ?prewarm=<sec>: fixed-dt deterministic fast-forward BEFORE the
        // first presented frame. A scripted peel-event sequence (2–3 clicks)
        // produces holes + falling blocks + pile + delayed crumble + partial
        // healing in one still. GPU work during prewarm is event-driven only
        // (the scene pass renders just before each snapshot), so the whole
        // preroll is nearly pure CPU and cheap even under swiftshader.
        async function runPrewarm() {
          const evts = [
            { t: Math.min(1.0, PREWARM * 0.3), x: 0.33, yUp: 0.62 },
            { t: Math.min(4.2, PREWARM * 0.6), x: 0.68, yUp: 0.42 },
            { t: Math.max(0.2, PREWARM - 0.55), x: 0.5, yUp: 0.55 },
          ].sort((a, b) => a.t - b.t);
          const steps = Math.round(PREWARM / SDT);
          let ei = 0;
          for (let i = 0; i < steps; i++) {
            while (ei < evts.length && evts[ei].t <= simTime + SDT * 0.5) {
              if (!FAKE) haveVideo = uploadVideoFrame();
              renderScene(); // sceneT at the peel moment (frozen into snapT)
              peelBurst(evts[ei].x, evts[ei].yUp);
              flushSnapshot();
              ei++;
            }
            simStep(SDT);
            if (pendingGen.length) {
              if (!FAKE) haveVideo = uploadVideoFrame();
              renderScene();
              flushSnapshot();
            }
            if (i % 120 === 119) {
              glSync();
              await new Promise((resolve) => setTimeout(resolve, 0));
            }
          }
          glSync();
        }

        // ?settle=<sec>: event-free deterministic fast-forward AFTER prewarm.
        // Samples (simTime, wounded cells, bodies, resting bodies) twice a
        // second into window.__settleLog — the machine evidence that healing
        // and the pile die out together instead of the pile outliving the
        // repair (repair #6).
        window.__settleLog = [];
        let ffBusy = false;
        async function fastForward(sec, log) {
          ffBusy = true; // the rAF loop must not advance time in parallel
          const steps = Math.round(sec / SDT);
          for (let i = 0; i < steps; i++) {
            simStep(SDT);
            if (pendingGen.length) {
              if (!FAKE) haveVideo = uploadVideoFrame();
              renderScene();
              flushSnapshot();
            }
            if (log && i % 30 === 29) {
              let resting = 0;
              for (let k = 0; k < bodies.length; k++) {
                if (bodies[k].state > 0) resting++;
              }
              log.push({
                t: +simTime.toFixed(2),
                wounded: peeledCellsLive,
                bodies: bodies.length,
                resting,
              });
            }
            if (i % 120 === 119) {
              glSync();
              await new Promise((resolve) => setTimeout(resolve, 0));
            }
          }
          glSync();
          ffBusy = false;
        }
        // Verification aid: advance the simulation by N seconds of fixed-dt
        // steps on demand (software rendering is far slower than real time,
        // so live observation of slow phenomena — tilt flow, weathering — is
        // impossible otherwise). No effect on the artwork itself.
        window.__fastForward = (sec) =>
          fastForward(Math.min(60, Math.max(0, Number(sec) || 0)), null);
        async function runSettle() {
          await fastForward(SETTLE, window.__settleLog);
        }

        /* ------------------------------------------------------------------
           Camera + boot. With ?fakesource=1 the synthetic scene drives the
           pipeline and the video feed is never sampled, but getUserMedia
           still runs so the three error paths stay observable.
        ------------------------------------------------------------------ */

        let stream = null;

        async function startCamera() {
          stopCamera();
          cameraReady = false;
          retryCamera.disabled = true;
          setOverlay(
            "requesting",
            "REQUESTING CAMERA",
            "Please allow webcam access. If this is not localhost or HTTPS, the camera API will be blocked.",
          );

          if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost" &&
            location.hostname !== "127.0.0.1" &&
            location.hostname !== "[::1]"
          ) {
            setOverlay(
              "error",
              "SECURE CONTEXT REQUIRED",
              "Serve the file from localhost (for example: python3 -m http.server 8888) or HTTPS, then reload.",
              { retryCamera: true },
            );
            retryCamera.disabled = false;
            return;
          }

          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setOverlay(
              "error",
              "CAMERA API UNAVAILABLE",
              "This browser does not expose getUserMedia. Try a modern browser over localhost or HTTPS.",
              { retryCamera: true },
            );
            retryCamera.disabled = false;
            return;
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: state.facingMode,
                width: { ideal: 1280 },
                height: { ideal: 720 },
              },
              audio: false,
            });
            video.srcObject = stream;
            await video.play();
            cameraReady = true;
            retryCamera.disabled = false;
            if (overlayKind === "requesting") setOverlay("hidden", "", "");
          } catch (error) {
            retryCamera.disabled = false;
            const name = error && error.name ? error.name : "";
            if (name === "NotAllowedError" || name === "SecurityError") {
              setOverlay(
                "error",
                "PERMISSION DENIED",
                "Camera access was denied. Enable camera permission for this site, then retry.",
                { retryCamera: true },
              );
            } else if (
              name === "NotFoundError" ||
              name === "OverconstrainedError"
            ) {
              setOverlay(
                "error",
                "NO CAMERA FOUND",
                "No usable webcam was found. Connect a camera or release it from another app, then retry.",
                { retryCamera: true },
              );
            } else {
              setOverlay(
                "error",
                "CAMERA ERROR",
                `${name || "Unknown error"}. Check browser permissions and retry.`,
                { retryCamera: true },
              );
            }
          }
        }

        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        retryCamera.addEventListener("click", () => {
          startCamera();
        });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });

        window.addEventListener("beforeunload", stopCamera);

        async function boot() {
          resize();
          if (PREWARM > 0) {
            if (!FAKE) {
              // give the camera a moment so prewarm snapshots freeze real
              // frames, not the holding backdrop (fakesource never waits)
              const t0 = performance.now();
              while (!cameraReady && performance.now() - t0 < 4000) {
                await new Promise((resolve) => setTimeout(resolve, 100));
              }
            }
            await runPrewarm();
          }
          if (SETTLE > 0) await runSettle();
          requestAnimationFrame(frame);
        }

        try {
          startCamera();
          boot();
        } catch (error) {
          setOverlay(
            "error",
            "WEBGL SETUP ERROR",
            error && error.message
              ? error.message
              : "Could not initialize the renderer.",
          );
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
