<!--
  fable5_itsuwari-hyomen.html — WebGL2「偽りの表面(The False Surface)」— webcam

  発注書: prompts/fable5_itsuwari-hyomen_order.md
  ディレクション規約: AI_DIRECTION_GUIDE.md / UI・カメラ規約の参照: fable5_papercraft-cam.html

  概要:
    Webカメラにはいつも通りの自分と風景が映る。しかしそれは偽りで、クリック/タップ
    した点を中心に表面が正方形ブロックとして剥離し、回転しながら崩れ落ちて画面下に
    堆積する。剥がれた穴からは本当の世界 — 彩度ゼロでポジネガ反転した、黒い地に
    白いスクリブル線描だけの世界 — が露出する。剥がれたブロックは剥離した瞬間の色を
    凍結したまま積もり、背後の線描世界だけが動き続ける。放置すると表面は自己修復する。

  様式解析の要約(視覚的不変量、優先順):
    1. 無傷の表面は生のカメラ映像そのもの — 継ぎ目・格子・タイル感は一切見えない。
       無傷領域は video テクスチャのフルスクリーン直描き(事前タイル分割の禁止)。
       剥離状態は低解像度マスク(グリッドセル単位、CPU 管理)で持ち、合成時に
       smoothstep 再鋭化した境界で生映像/裏世界を切り替える。
    3. 各ブロックは剥離した瞬間の映像を凍結して携える — 剥離イベント時のみ sceneT を
       GPU 内コピー(copyTexSubImage2D)でスナップショット凍結。世代 3 枚を参照
       カウント付きで共有し、ブロックは生成時の世代を元位置 UV で参照する。
    2. 剥離ブロックは回転を伴う剛体として落下し床に山なりに堆積 — CPU の接触ベース
       剛体物理(均一グリッド broadphase+OBB SAT+逐次インパルス+ウォームスタート
       +摩擦+スリープ/深部凍結)、インスタンス描画。斜面で傾いて止まる・角で
       立ったブロックが倒れる、が接触点トルクから自然に出る。
    5. 崩壊は部分的 — クリックは手のひら大。支持喪失伝播(ストレス場の幾何減衰)で
       周縁セルが時間差で追い崩れ、必ず有限半径で止まる。乱数は cell-hash。
    4. 裏世界は彩度ゼロのポジネガ線描 — fable5_scribble-cam.html のスクリブル
       シェーダ(sobel 接線 ↔ curl ノイズの流れ場+ドメインワープした方向性
       ラインノイズ 3 オクターブ+輝度→線密度ゲート+静的スペックル)を
       フルフレームで移植(MediaPipe の人物マスクは持ち込まない。外部依存ゼロを
       維持)。既定はネガ(黒地に白線)。毎フレーム再計算されるライブ描画なので
       裏世界の被写体は動き続けるが、線パターンの乱数は座標のみ由来で静的。
    6. 自己修復と風化 — マスクは穴の端から ema 的長時定数で回復。堆積ブロックは
       寿命で退色して裏の線描世界に同化し消滅(ボディ数・堆積高さは有界)。風化は
       修復と連動: 元セルが修復済みになったブロックは残り寿命を 2〜4 秒
       (cell-hash ジッタ)に切り詰められ、消えた分だけ山が quiet ウェイク
       (無反発)で静かに沈降 — 表面が直るほど床の証拠も消えていき、
       全セル修復の数秒後には床が必ず空になる。加齢は凍結中も止まらない。

  パイプライン図(P2 のみイベント時、他は毎フレーム):
    video / fakeScene ─► [P0 scene] cover-fit+mirror      sceneT  RGBA8 長辺≤1024
    sceneT ───────────► [P1 bw   ] スクリブル線描(ポジネガ) bwT    RGBA8 長辺≤512
                        (sobel 接線+curl 流れ場+方向性ラインノイズ 3 oct)
    sceneT ─(剥離時)──► [P2 snap ] copyTexSubImage2D      snapT×3 RGBA8 sceneT同寸
    [CPU mask] グリッド(基準 82列、セル上限 12000)剥離/伝播/修復 → R8 一方向転送
    [CPU phys] 剥離セル→剛体ボディ(≤2400)。接触ソルバ(Matter.js と同構成を
               正方形専用に内蔵): 均一グリッド broadphase → OBB-OBB SAT+
               参照面クリッピング(接触≤2点) → 逐次インパルス(低反発+クーロン
               摩擦+ウォームスタート、速度4回)+線形位置補正(slop 付き、3回)
               → スリープ → 深部凍結(荷重下の長期スリープはソルバ除外)。
               スリープ許可は「低運動+下支え+接地連結」の3条件(接地連結=
               床/壁または grounded な静止体への接触チェーン)。15step毎に接触
               グラフを床/壁からBFSして grounded を再判定し、非接地の静止塊
               (空中ジャム=floating island)は quiet ウェイクで再落下させる。
               風化で支えが消えた近傍も同経路で静かに沈降(無反発+高減衰)。
               風化の加齢は凍結中も進み、元セル修復済みで残り寿命 2〜4 秒に
               クランプ(修復連動の有界フェード)。剥離セルが 0 になったら
               残存ボディ全部に同じフェードを掛ける(取りこぼしの保険)。
               過負荷の縮退は「見えない順」の三段構え(瞬時消去は一切しない):
               (1) 可動数が上限を超えたら接地した堆積を強制スリープ、
               (2) それでも超えるならソルバ反復数を落とす(4/3→3/2→2/1)、
               (3) 上限の 1.5 倍という真の過負荷でのみ最古のボディを約1秒の
               フェード(doom)に入れる。ボディ数の上限に達したときも、
               既にフェード末期(weather>0.8)の破片だけを回収し、
               該当が無ければ新しい破片の生成を見送る。
               重力は「ベクトル」で、モバイルの左右傾き(deviceorientation の
               beta/gamma を screen.orientation.angle θ で画面座標へ回転:
               screenTilt = gamma·cosθ − beta·sinθ。縦・横持ちのどちらでも
               「画面上の左右」が下り方向になる。beta/gamma とも ±40° に
               クランプ)を ema+レート制限(≤60°/s)で最大 ±40° 傾ける。傾くと
               山は下り側へ流れて壁際に寄る(接地判定=重力方向との内積、
               壁は接地連結の種、方向が 3° 変わると雪崩の「波」が始まり、
               毎ステップ上から順に最大120体ずつ quiet ウェイクする。
               一度に全体を起こすと可動数が跳ね上がるため、波は可動上限を
               超えない範囲でのみ進む)
    [P3 comp ] bwT 基層+マスクで無傷領域だけ sceneT。穴の縁に厚みの影と欠けの縁
    [P4 block] instanced quads(snapT 世代参照+風化の退色+回転連動の
               ベベル照明・面グラデ・サイズ/明度ジッタ+ソフトドロップシャドウ)→ canvas

  スライダー(写真らしさ ↔ 様式の強さ。カッコ内は既定値):
    block   ブロックの大きさ(0.50)— グリッドセルの辺長。既定は細かい破片=
            画面幅の約 1/82(レンジ 1/100〜1/64)
    burst   崩れの規模(0.50)— クリック起点の初期剥離半径
    spread  追い崩れ(0.55)— 支持喪失伝播の確率と持続(0=起点のみ/1=広く連鎖)
    tumble  破片の暴れ(0.50)— 剥離時の初速・角速度・反発係数
    heal    修復の速さ(0.35)— 剥離マスクの回復時定数(0=ほぼ直らない)
    weather 破片の風化(0.50)— 堆積ブロックの退色・消滅までの寿命
    nega    ポジネガ(0.90)— 裏世界の反転度。1=完全なネガ(黒地に白線)/
            0=ポジ(白地に黒線)。中間は連続補間(中点付近は線のインク階調を
            保護して図が消えないようにする)
    edge    輪郭の感度(0.50)— sobel 輪郭の線密度ブーストのしきい値と強さ
    tilt    傾きの効き(0.60)— モバイルで端末を左右に傾けたとき重力を傾ける
            最大角(1.0 で 40°)。0 で傾き入力を無効化。PC は傾きイベントが
            来ないので常に無効(見た目は従来どおり)。縦持ち・横持ち
            (screen.orientation.angle = 0/90/180/270)いずれでも「画面上の
            左右」が下り方向になるよう入力を画面座標へ回転する
    プリセット: 壁画の剥落(標準)/ 検知の世界 / 崩れ続ける夜

  実行方法:
    python3 -m http.server 8888
    → http://localhost:8888/fable5_itsuwari-hyomen.html を開きカメラを許可し、
    画面をクリック/ドラッグすると表面が剥がれる。
    (カメラ API はセキュアコンテキスト必須。file:// では動きません)
    モバイル: 端末を左右に傾けると重力が傾き、堆積した破片が下り側へ流れて
    壁際に寄る(iOS 13+ は最初のタップで傾きセンサの許可を一度だけ要求。
    拒否・非対応・PC では傾きは無効で、それ以外は従来どおり動作する)。
    縦持ち・横持ちの両方に対応し、回転しても「画面の左右」がそのまま
    下り方向になる(回転直後もレート制限つきで滑らかに追従する)。
    ?fakesource=1 … カメラ不使用。GLSL 合成シーン(揺れる人物+振り子ランプ+雲)で駆動
    ?freeze=1     … 時間駆動を停止(合成シーン・物理・伝播・修復。決定的静止フレーム)
    ?prewarm=<秒> … 初回描画前に固定 dt で決定的早送り。スクリプトの剥離イベント
                    3 発を含み、穴・落下・堆積・追い崩れ・部分修復が揃った状態を作る
    ?settle=<秒>  … 検証用。prewarm の後に「イベント無し」の決定的早送りを追加し、
                    剥離セル数とボディ数の時系列を window.__settleLog に記録する
                    (修復完了 → 床が空になる、の機械証拠)
    ?tilttest=1   … 検証用。fakesource でも傾き入力を有効化(window.__setTilt(deg)
                    で画面座標の傾きを直接注入、deviceorientation イベントを
                    dispatch すれば向き補正込みの経路を通せる)。通常運用では使わない
    uDebug: 0=最終 / 1=剥離マスク / 2=裏世界のみ / 3=ブロックのみ / 4=標本

  依存: なし(外部ライブラリ・MLモデル不使用)。WebGL2 / GLSL ES 3.00 単体。
-->

    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("gl");
        const video = document.getElementById("video");
        const panel = document.getElementById("panel");
        const togglePanel = document.getElementById("togglePanel");
        const flipCameraBtn = document.getElementById("flipCamera");
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlayText = document.getElementById("overlayText");
        const retryCamera = document.getElementById("retryCamera");

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        const QUERY = new URLSearchParams(location.search);
        // ?fakesource=1 — the GLSL synthetic scene (swaying figure + pendulum
        // lamp + drifting clouds) drives the whole pipeline; no camera needed.
        const FAKE = QUERY.get("fakesource") === "1";
        // ?freeze=1 — stop every time-driven animation (scene clock, physics,
        // propagation, healing) for deterministic still frames.
        const FREEZE = QUERY.get("freeze") === "1";
        // ?prewarm=<sec> — deterministic fixed-dt fast-forward BEFORE the
        // first presented frame, with a scripted peel-event sequence.
        const PREWARM = (() => {
          const v = parseFloat(QUERY.get("prewarm"));
          return Number.isFinite(v) && v > 0 ? Math.min(60, v) : 0;
        })();
        // ?settle=<sec> — verification hook: after the prewarm event script,
        // fast-forward this many further seconds with NO new peel events
        // (fixed dt, deterministic) and log the wound/body time series to
        // window.__settleLog. Used to prove "surface fully repaired ⇒ the
        // floor empties a few seconds later" (repair #6).
        const SETTLE = (() => {
          const v = parseFloat(QUERY.get("settle"));
          return Number.isFinite(v) && v > 0 ? Math.min(240, v) : 0;
        })();
        // ?tilttest=1 — verification hook: re-enable the device-tilt input
        // under ?fakesource=1 so a headless DeviceOrientationEvent can drive
        // the gravity tilt. Off by default: tilt is an external input like
        // the pointer and must never perturb deterministic verification.
        const TILT_TEST = QUERY.get("tilttest") === "1";

        const DEFAULTS = {
          block: 0.5,
          burst: 0.5,

        // Presets are full slider recipes (uDebug 4 の標本=色見本で確認可能)

        panel.innerHTML = `

        function formatValue(value) {

        function syncSliders() {

        let gridRebuildWanted = false;

        document.getElementById("resetLook").addEventListener("click", () => {

          state.preset = "hekiga";

        togglePanel.addEventListener("click", () => {
          const collapsed = panel.classList.toggle("collapsed");

          togglePanel.setAttribute("aria-expanded", String(!collapsed));

        flipCameraBtn.addEventListener("click", () => {

            state.facingMode === "user" ? "environment" : "user";
          flipCameraBtn.textContent =
            state.facingMode === "user" ? "REAR CAM" : "FRONT CAM";
          state.mirror = state.facingMode === "user";
          document.getElementById("mirror").checked = state.mirror;
          startCamera();
        });

        document.getElementById("savePng").addEventListener("click", () => {
          // preserveDrawingBuffer is on, so the current frame exports directly.
          const link = document.createElement("a");
          const stamp = new Date().toISOString().replace(/[:.]/g, "-");
          link.download = `fable5-itsuwari-hyomen-${stamp}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        });

        let overlayKind = "requesting";

        function setOverlay(kind, title, text, buttons = {}) {
          overlayKind = kind;
          overlayTitle.textContent = title;
          overlayText.textContent = text;
          retryCamera.hidden = !buttons.retryCamera;
          overlay.classList.toggle("hidden", kind === "hidden");
        }

        /* ------------------------------------------------------------------
           WebGL2 setup
        ------------------------------------------------------------------ */

        const gl = canvas.getContext("webgl2", {
          alpha: false,
          antialias: false,
          depth: false,
          stencil: false,
          preserveDrawingBuffer: true,
          powerPreference: "high-performance",
        });

        if (!gl) {
          setOverlay(
            "error",
            "WEBGL2 UNAVAILABLE",
            "This piece needs WebGL2. Try a current desktop/mobile browser with hardware acceleration enabled.",
          );
          return;
        }

        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.CULL_FACE);
        gl.disable(gl.BLEND);

        const fullscreenVS = `#version 300 es
          precision highp float;
          const vec2 POS[3] = vec2[3](
            vec2(-1.0, -1.0),
            vec2( 3.0, -1.0),
            vec2(-1.0,  3.0)
          );
          out vec2 vUv;
          void main() {
            vec2 p = POS[gl_VertexID];
            vUv = p * 0.5 + 0.5;
            gl_Position = vec4(p, 0.0, 1.0);
          }
        `;

        // Shared noise (static seeds — cell coords only, never time).
        const CHUNK_NOISE = `
          float hash12(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
          }
          float vnoise(vec2 p) {
            vec2 ip = floor(p);
            vec2 fp = fract(p);
            fp = fp * fp * (3.0 - 2.0 * fp);
            float a = hash12(ip);
            float b = hash12(ip + vec2(1.0, 0.0));
            float c = hash12(ip + vec2(0.0, 1.0));
            float d = hash12(ip + vec2(1.0, 1.0));
            return mix(mix(a, b, fp.x), mix(c, d, fp.x), fp.y);
          }
        `;

        // Shared achromatic tone mapping of the "true" world.
        // negaInk maps scribble ink coverage (0 = ground, 1 = full line) to
        // the pos/neg tone: nega 1 = white lines on black, 0 = black on
        // white. Near the crossing (nega ≈ 0.5) the ground and line ramps
        // would meet in flat gray, so a mid-protection term re-injects an
        // ink-graded tone and keeps the drawing readable at every value.
        // bwTone is kept as the weathering TARGET of pile blocks (invariant
        // 6: fade into the true world) — it is fed a nega-derived depth so
        // fading chips sink toward the ground tone of the current world.
        const CHUNK_TONE = `
          float lumaOf(vec3 c) {
            return dot(c, vec3(0.299, 0.587, 0.114));
          }
          vec3 negaInk(float ink, float ng) {
            float g = mix(0.93, 0.03, ng);
            float li = mix(0.055, 1.0, ng);
            vec3 col = vec3(mix(g, li, ink));
            float mid = 1.0 - abs(2.0 * ng - 1.0);
            return mix(col, vec3(mix(0.30, 0.72, ink)), mid * 0.42);
          }
          vec3 bwTone(float l, float dpt) {
            float lq = clamp(floor(l * 4.0) / 3.0, 0.0, 1.0);
            float hi = mix(0.92, 0.30, dpt);
            float lo = mix(0.24, 0.045, dpt);
            return vec3(mix(lo, hi, lq));
          }
        `;

        // Synthetic scene (?fakesource=1): a lived-in room with a swaying
        // figure at the centre (--motion samples the canvas centre), a
        // swinging pendulum lamp, drifting window clouds and a blink.
        const CHUNK_FAKE = `
          float sdCircF(vec2 p, vec2 c, float r) { return length(p - c) - r; }
          float sdEllF(vec2 p, vec2 c, vec2 r) {
            return (length((p - c) / r) - 1.0) * min(r.x, r.y);
          }
          float sdSegF(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a;
            vec2 ba = b - a;
            float h = clamp(dot(pa, ba) / max(1e-6, dot(ba, ba)), 0.0, 1.0);
            return length(pa - ba * h);
          }
          float fcov(float d) { return 1.0 - smoothstep(-0.004, 0.004, d); }

          vec3 fakeScene(vec2 uv, float t, float aspect) {
            // p-space keeps circles round regardless of canvas aspect
            vec2 p = vec2(0.5 + (uv.x - 0.5) * aspect, uv.y);
            // wall: soft vertical gradient + faint wallpaper stripes
            vec3 col = mix(vec3(0.74, 0.66, 0.54), vec3(0.58, 0.64, 0.68), uv.y);
            col *= 1.0 + 0.025 * sin(uv.x * 92.0);
            col += 0.03 * (vnoise(uv * 7.0) - 0.5);
            // wooden floor below the skirting line
            if (uv.y < 0.20) {
              vec3 wood = vec3(0.48, 0.34, 0.22) * (0.85 + 0.15 * sin(uv.x * 44.0));
              wood *= mix(0.75, 1.05, uv.y / 0.20);
              col = wood;
            }
            col *= 1.0 - 0.25 * fcov(abs(uv.y - 0.20) - 0.004);
            // window (right): sky + two drifting clouds + cross frame
            vec2 wq = abs(uv - vec2(0.845, 0.635)) - vec2(0.115, 0.155);
            float win = max(wq.x, wq.y);
            if (win < 0.0) {
              vec3 sky = mix(vec3(0.55, 0.72, 0.86), vec3(0.78, 0.88, 0.95), uv.y);
              float cx1 = mix(0.745, 0.945, fract(t * 0.045));
              float cx2 = mix(0.745, 0.945, fract(t * 0.03 + 0.55));
              float cl = fcov(sdEllF(uv, vec2(cx1, 0.70), vec2(0.040, 0.016)));
              cl = max(cl, fcov(sdEllF(uv, vec2(cx2, 0.585), vec2(0.032, 0.013))));
              sky = mix(sky, vec3(0.97, 0.97, 0.95), cl * 0.9);
              col = sky;
              col *= 1.0 - 0.85 * fcov(abs(uv.x - 0.845) - 0.006);
              col *= 1.0 - 0.85 * fcov(abs(uv.y - 0.635) - 0.006);
            }
            col *= 1.0 - 0.5 * (fcov(abs(max(wq.x, wq.y)) - 0.008));
            // shelf with three saturated books (left)
            if (uv.x < 0.30) {
              col *= 1.0 - 0.6 * fcov(abs(uv.y - 0.46) - 0.006 + step(0.27, uv.x));
              vec2 bq;
              bq = abs(uv - vec2(0.085, 0.535)) - vec2(0.020, 0.068);
              if (max(bq.x, bq.y) < 0.0) col = vec3(0.72, 0.18, 0.16);
              bq = abs(uv - vec2(0.135, 0.528)) - vec2(0.020, 0.060);
              if (max(bq.x, bq.y) < 0.0) col = vec3(0.88, 0.66, 0.16);
              bq = abs(uv - vec2(0.185, 0.540)) - vec2(0.020, 0.072);
              if (max(bq.x, bq.y) < 0.0) col = vec3(0.14, 0.44, 0.42);
            }
            // pendulum lamp (upper-left third): cord + warm shade, swinging
            float lang = 0.30 * sin(t * 1.15);
            vec2 pivot = vec2(0.30, 1.02);
            vec2 lampC = pivot + vec2(sin(lang), -cos(lang)) * 0.30;
            float cord = sdSegF(p, pivot, lampC) - 0.0035;
            col = mix(col, vec3(0.12, 0.11, 0.10), fcov(cord));
            float glow = 1.0 - smoothstep(0.03, 0.16, length(p - lampC));
            col += vec3(0.30, 0.22, 0.08) * glow * glow;
            col = mix(col, vec3(0.95, 0.78, 0.34),
              fcov(sdCircF(p, lampC, 0.034)));
            col = mix(col, vec3(0.99, 0.93, 0.70),
              fcov(sdCircF(p, lampC + vec2(0.0, -0.012), 0.014)));
            // ---- figure (center, swaying: the --motion guarantee) ----
            float fx = 0.5 + 0.052 * sin(t * 0.6);
            float fy = 0.585 + 0.012 * sin(t * 1.3);
            // torso: muted red knit sweater
            float torso = sdSegF(p, vec2(fx, 0.40), vec2(fx, 0.02)) - 0.155;
            float knit = 0.9 + 0.1 * sin(p.y * 110.0 + p.x * 18.0);
            vec3 sweater = vec3(0.68, 0.20, 0.18) * knit * (0.72 + 0.5 * p.y);
            col = mix(col, sweater, fcov(torso));
            // waving arm (second centre-adjacent mover)
            vec2 sho = vec2(fx + 0.135, 0.335);
            float aang = 1.05 + 0.45 * sin(t * 1.7);
            vec2 hand = sho + vec2(cos(aang), sin(aang)) * 0.185;
            float arm = sdSegF(p, sho, hand) - 0.034;
            col = mix(col, vec3(0.62, 0.18, 0.16) * knit, fcov(arm));
            col = mix(col, vec3(0.87, 0.64, 0.48), fcov(sdCircF(p, hand, 0.027)));
            // collar
            col = mix(col, vec3(0.92, 0.90, 0.86),
              fcov(sdEllF(p, vec2(fx, 0.415), vec2(0.055, 0.020))));
            // head: hair cap + shaded skin + readable features
            vec2 headC = vec2(fx, fy);
            float hair = sdEllF(p, headC + vec2(0.0, 0.022), vec2(0.096, 0.112));
            col = mix(col, vec3(0.16, 0.12, 0.10), fcov(hair));
            float face = sdEllF(p, headC, vec2(0.080, 0.098));
            vec2 nf = (p - headC) / vec2(0.080, 0.098);
            float shade = 0.78 + 0.28 * clamp(-nf.x * 0.6 - nf.y * 0.3 + 0.4, 0.0, 1.0);
            col = mix(col, vec3(0.89, 0.66, 0.50) * shade, fcov(face));
            float blink = 1.0 - smoothstep(0.90, 0.965, sin(t * 1.9 + 1.0));
            float eyeR = 0.0105 * max(0.15, blink);
            float eL = sdEllF(p, headC + vec2(-0.032, 0.018), vec2(0.016, eyeR));
            float eR = sdEllF(p, headC + vec2(0.032, 0.018), vec2(0.016, eyeR));
            col = mix(col, vec3(0.10, 0.09, 0.10), fcov(min(eL, eR)));
            float brw = min(
              sdEllF(p, headC + vec2(-0.033, 0.047), vec2(0.022, 0.006)),
              sdEllF(p, headC + vec2(0.033, 0.047), vec2(0.022, 0.006)));
            col = mix(col, vec3(0.15, 0.11, 0.09), fcov(brw));
            float nose = sdSegF(p, headC + vec2(0.0, 0.006), headC + vec2(0.0, -0.024)) - 0.006;
            col = mix(col, vec3(0.78, 0.54, 0.40) * shade, fcov(nose));
            float mou = sdEllF(p, headC + vec2(0.0, -0.052), vec2(0.026, 0.010));
            col = mix(col, vec3(0.62, 0.26, 0.24), fcov(mou));
            return clamp(col, 0.0, 1.0);
          }
        `;

        // P0 — webcam cover-fit + mirror (or the synthetic scene).
        // The intact surface IS this buffer, drawn fullscreen with no tiling.
        const sceneFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uVideo;
          uniform vec2 uResolution;
          uniform vec2 uVideoSize;
          uniform float uTime;
          uniform int uMirror;
          uniform int uFake;
          uniform int uHasVideo;
          ${CHUNK_NOISE}
          ${CHUNK_FAKE}
          void main() {
            float aspect = uResolution.x / max(1.0, uResolution.y);
            if (uFake == 1) {
              fragColor = vec4(fakeScene(vUv, uTime, aspect), 1.0);
              return;
            }
            if (uHasVideo == 0) {
              // neutral holding backdrop while the camera warms up (not black)
              fragColor = vec4(mix(vec3(0.20, 0.20, 0.22),
                vec3(0.30, 0.30, 0.30), vUv.y), 1.0);
              return;
            }
            vec2 uv = vUv;
            if (uMirror == 1) uv.x = 1.0 - uv.x;
            float videoAspect = uVideoSize.x / max(1.0, uVideoSize.y);
            vec2 scl = videoAspect > aspect
              ? vec2(aspect / videoAspect, 1.0)
              : vec2(1.0, videoAspect / aspect);
            vec2 vuv = (uv - 0.5) * scl + 0.5;
            fragColor = vec4(texture(uVideo, vuv).rgb, 1.0);
          }
        `;

        // P1 — the true world behind the surface: a live scribble drawing,
        // ported from fable5_scribble-cam.html (FS_PREP + FS_SCRIBBLE merged
        // into one pass at bw resolution; the MediaPipe mask gating of the
        // original is deliberately NOT carried over — full-frame scribble,
        // zero external dependencies). Sobel tangents blended toward curl
        // noise make the flow field; 3 octaves of domain-warped directional
        // line noise draw the strokes; luminance gates the line density;
        // a static speckle grain roughens the ground. uNega flips the ink:
        // 1 = white lines on black (negative), 0 = black on white.
        // Runs every frame so the world behind the holes keeps moving, but
        // every seed is coordinate-only (no time) — a still input is still.
        const bwFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform vec2 uTexel;
          uniform vec2 uBwRes;
          uniform float uNega;
          uniform float uEdge;
          ${CHUNK_NOISE}
          ${CHUNK_TONE}
          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 3; i++) {
              v += a * vnoise(p);
              p = p * 2.03 + 11.7;
              a *= 0.5;
            }
            return v;
          }
          // curl of an fbm potential — divergence-free organic meander for
          // flat regions where the sobel tangent has nothing to follow
          vec2 curlNoise(vec2 p) {
            float e = 0.02;
            float dpdy = fbm(p + vec2(0.0, e)) - fbm(p - vec2(0.0, e));
            float dpdx = fbm(p + vec2(e, 0.0)) - fbm(p - vec2(e, 0.0));
            return vec2(dpdy, -dpdx);
          }
          float lumAt(vec2 uv) {
            return lumaOf(texture(uScene, uv).rgb);
          }
          void main() {
            // ---- sobel on the live luminance ----
            float l00 = lumAt(vUv + uTexel * vec2(-1.0, -1.0));
            float l01 = lumAt(vUv + uTexel * vec2(-1.0, 0.0));
            float l02 = lumAt(vUv + uTexel * vec2(-1.0, 1.0));
            float l10 = lumAt(vUv + uTexel * vec2(0.0, -1.0));
            float l11 = lumAt(vUv);
            float l12 = lumAt(vUv + uTexel * vec2(0.0, 1.0));
            float l20 = lumAt(vUv + uTexel * vec2(1.0, -1.0));
            float l21 = lumAt(vUv + uTexel * vec2(1.0, 0.0));
            float l22 = lumAt(vUv + uTexel * vec2(1.0, 1.0));
            float gx = (l20 + 2.0 * l21 + l22) - (l00 + 2.0 * l01 + l02);
            float gy = (l02 + 2.0 * l12 + l22) - (l00 + 2.0 * l10 + l20);
            float mag = length(vec2(gx, gy));
            // edge tangent (gradient rotated 90°) vs curl-noise meander
            vec2 tang = normalize(vec2(-gy, gx) + 1e-6);
            vec2 curl = normalize(curlNoise(vUv * 3.0) + 1e-6);
            float fw = clamp(smoothstep(0.03, 0.30, mag) * 1.3, 0.0, 1.0);
            vec2 dir = normalize(mix(curl, tang, fw) + 1e-6);
            float theta = atan(dir.y, dir.x);

            // ---- luminance → line density ----
            // High thresholds: mid tones stay empty ground and only true
            // highlights fill with a dense tangle — the drawing is carried
            // by the contour boost (white outlines on black, per the ref).
            float Lc = clamp((l11 - 0.5) * 1.35 + 0.5, 0.0, 1.0);
            float dens = smoothstep(0.74, 0.98, Lc) * 0.95;
            // contour boost: brows / frames / silhouettes stay legible even
            // at mid luminance (uEdge = threshold + strength of the boost)
            float eBoost = smoothstep(mix(0.42, 0.08, uEdge),
              mix(0.80, 0.26, uEdge), mag);
            dens = max(dens,
              eBoost * mix(0.6, 1.0, uEdge) * smoothstep(0.015, 0.08, Lc));

            // ---- 3 octaves of domain-warped directional line noise ----
            float aspect = uBwRes.x / max(1.0, uBwRes.y);
            vec2 auv = vUv * vec2(aspect, 1.0);
            float acc = 0.0;
            for (int i = 0; i < 3; i++) {
              float fi = float(i);
              float sc = 46.0 * (1.0 + fi * 0.8);
              // orientation wobble (tangle) + fixed per-octave rotation
              float wob = (fbm(auv * sc * 0.30 + fi * 17.1) - 0.5) * 2.2;
              float a2 = theta + wob + fi * 0.35;
              vec2 dirO = vec2(cos(a2), sin(a2));
              vec2 nrm = vec2(-dirO.y, dirO.x);
              // domain warp bends parallel stripes into loops and hooks
              float warp = (fbm(auv * sc * 0.09 + fi * 7.7) - 0.5) * 7.0;
              float phase = dot(auv, nrm) * sc + warp + fi * 0.618;
              // along-line coordinate → segments for density gating
              float s = dot(auv, dirO) * sc * 0.35 +
                (fbm(auv * sc * 0.20 + fi * 3.3) - 0.5) * 2.0;
              vec2 cell = vec2(floor(phase), floor(s));
              float r1 = hash12(cell + fi * 31.7);
              float r2 = hash12(cell + fi * 57.3 + 11.0);
              float pr = dens * (1.0 - fi * 0.18);
              float on = step(r1, pr);
              // thin AA line at every integer phase (pixel-exact via fwidth)
              float f = abs(fract(phase) - 0.5);
              float wpx = fwidth(phase);
              float lw = 0.9 * wpx;
              float line = (1.0 - smoothstep(lw, lw + wpx, f)) * on *
                (0.55 + 0.45 * r2);
              acc = acc + line * (1.0 - acc);
            }

            // ---- static speckle grain (coordinate seed only, no time) ----
            vec2 gp = floor(vUv * uBwRes);
            float gh = hash12(gp + 7.3);
            float ink = clamp(acc + (gh - 0.5) * 0.14 +
              step(0.986, hash12(gp + 41.7)) * 0.30, 0.0, 1.0);
            fragColor = vec4(negaInk(ink, uNega), 1.0);
          }
        `;

        // P3 — the reveal composite. The intact surface is the live scene
        // buffer sampled 1:1 (no tiling); the peel mask only decides WHERE
        // the surface has fallen away. Hole edges get a chipped-plaster rim
        // and an inner thickness shadow (pseudo-SDF bands on the mask).
        const compFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform sampler2D uBw;
          uniform sampler2D uMask;
          uniform vec2 uGrid;
          uniform float uDepth;
          uniform float uNega;
          uniform int uDebug;
          ${CHUNK_NOISE}
          ${CHUNK_TONE}

          vec3 maskView(vec2 uv) {
            vec2 g = uv * uGrid;
            vec2 cell = floor(g);
            float mc = texture(uMask, (cell + 0.5) / uGrid).r;
            vec3 c;
            if (mc > 0.995) {
              c = vec3(0.09, 0.30, 0.16);
            } else {
              c = mix(vec3(0.72, 0.14, 0.10), vec3(0.85, 0.62, 0.16), mc);
            }
            vec2 f = fract(g);
            float ln = max(step(f.x, 0.07), step(f.y, 0.07));
            return c * (1.0 - 0.35 * ln);
          }

          vec3 specimenView(vec2 uv) {
            vec3 c = vec3(0.115, 0.11, 0.125);
            // (a) nega ink ramp: ground → 3 density steps → full line,
            // at the current pos/neg setting (the bw-world tone specimen)
            if (uv.y > 0.80 && uv.y < 0.93) {
              float fx = (uv.x - 0.05) / 0.90;
              if (fx >= 0.0 && fx < 1.0) {
                float ci = floor(fx * 5.0);
                float lf = fract(fx * 5.0);
                if (lf > 0.06 && lf < 0.94) {
                  c = negaInk(ci / 4.0, uNega);
                }
              }
            }
            // (b) block cross-section: frozen scene chip through 4 weathering
            // stages (fresh → bw-assimilated → dissolving)
            if (uv.y > 0.46 && uv.y < 0.72) {
              float fx = (uv.x - 0.05) / 0.90;
              if (fx >= 0.0 && fx < 1.0) {
                float ci = floor(fx * 4.0);
                vec2 lc = vec2(fract(fx * 4.0), (uv.y - 0.46) / 0.26);
                if (lc.x > 0.10 && lc.x < 0.90) {
                  vec2 q = vec2((lc.x - 0.10) / 0.80, lc.y);
                  vec2 suv = vec2(0.36, 0.35) + q * 0.24;
                  vec3 blockC = texture(uScene, suv).rgb;
                  float w = ci / 3.0;
                  vec3 tgt = bwTone(lumaOf(blockC), uDepth);
                  blockC = mix(blockC, tgt, smoothstep(0.05, 0.7, w));
                  float dEdge = max(abs(q.x - 0.5), abs(q.y - 0.5));
                  blockC *= 1.0 - 0.38 * smoothstep(0.36, 0.5, dEdge);
                  float alpha = 1.0 - smoothstep(0.62, 1.0, w) * 0.85;
                  c = mix(c, blockC, alpha);
                }
              }
            }
            // (c) collapse-propagation demo: initial hole → support-loss
            // spread → healed from the edges (same rules in miniature)
            if (uv.y > 0.06 && uv.y < 0.38) {
              for (int k = 0; k < 3; ++k) {
                float x0 = 0.05 + float(k) * 0.32;
                if (uv.x > x0 && uv.x < x0 + 0.28) {
                  vec2 q = vec2((uv.x - x0) / 0.28, (uv.y - 0.06) / 0.32);
                  vec2 cell2 = floor(q * vec2(12.0, 8.0));
                  float dc = distance(cell2, vec2(5.0, 4.0));
                  float rnd = hash12(cell2 + vec2(11.7, 5.3));
                  bool hole = dc < 2.1;
                  if (k >= 1) {
                    hole = hole ||
                      (dc < 4.8 && rnd < smoothstep(4.8, 1.8, dc) * 0.85);
                  }
                  if (k == 2 && hole) {
                    float rr = hash12(cell2 + vec2(3.1, 9.4));
                    if (dc > 1.5 && rr < 0.62) hole = false;
                  }
                  vec3 live2 = texture(uScene, q).rgb;
                  vec3 bw2 = texture(uBw, q).rgb;
                  c = hole ? bw2 : live2;
                  vec2 f2 = fract(q * vec2(12.0, 8.0));
                  if (hole) {
                    c *= 1.0 - 0.25 * max(step(f2.x, 0.10), step(f2.y, 0.10));
                  }
                }
              }
            }
            return c;
          }

          void main() {
            if (uDebug == 1) {
              fragColor = vec4(maskView(vUv), 1.0);
              return;
            }
            if (uDebug == 2) {
              fragColor = vec4(texture(uBw, vUv).rgb, 1.0);
              return;
            }
            if (uDebug == 3) {
              // dark stage — the instanced blocks (gen-tinted) draw on top
              fragColor = vec4(0.055, 0.055, 0.065, 1.0);
              return;
            }
            if (uDebug == 4) {
              fragColor = vec4(specimenView(vUv), 1.0);
              return;
            }
            // ---- final composite ----
            float m = texture(uMask, vUv).r;
            // chip the hole boundary with a static grid-frequency jitter
            float jn = vnoise(vUv * uGrid * 1.7 + 3.7);
            float th = 0.5 + (jn - 0.5) * 0.24;
            float aa = 0.055;
            float surfM = smoothstep(th - aa, th + aa, m);
            float sd = m - th;
            vec3 live = texture(uScene, vUv).rgb;
            vec3 bw = texture(uBw, vUv).rgb;
            // thickness shadow cast onto the bw world just inside the lip
            float shadowBand = smoothstep(-0.30, -0.02, sd) * (1.0 - surfM);
            bw *= 1.0 - 0.5 * shadowBand;
            // pale chipped-plaster rim on the surviving surface side
            float rim = surfM * (1.0 - smoothstep(0.015, 0.10, sd));
            live = mix(live, vec3(0.90, 0.87, 0.80), rim * 0.6);
            vec3 col = mix(bw, live, surfM);
            fragColor = vec4(col, 1.0);
          }
        `;

        // P4 — peeled blocks: instanced quads carrying the frozen snapshot
        // at their ORIGINAL uv rect (the image tumbles with the block).
        const blocksVS = `#version 300 es
          precision highp float;
          layout(location = 0) in vec4 aA; // xy center px (y down), z size, w angle
          layout(location = 1) in vec4 aB; // uv center, uv half extents
          layout(location = 2) in vec2 aC; // snapshot generation, weathering
          uniform vec2 uRes;
          uniform int uShadow;
          uniform vec2 uShadowOff;
          out vec2 vLocal;
          out vec2 vUvC;
          out vec2 vUvH;
          flat out int vGen;
          out float vFade;
          out float vAng;
          const vec2 CORNERS[6] = vec2[6](
            vec2(-0.5, -0.5), vec2(0.5, -0.5), vec2(-0.5, 0.5),
            vec2(-0.5, 0.5), vec2(0.5, -0.5), vec2(0.5, 0.5)
          );
          void main() {
            vec2 corner = CORNERS[gl_VertexID];
            vLocal = corner;
            float cs = cos(aA.w);
            float sn = sin(aA.w);
            float sizeMul = uShadow == 1 ? 1.18 : 1.0;
            vec2 off = vec2(cs * corner.x - sn * corner.y,
                            sn * corner.x + cs * corner.y) * aA.z * sizeMul;
            vec2 px = aA.xy + off + (uShadow == 1 ? uShadowOff : vec2(0.0));
            vec2 clip = vec2(px.x / uRes.x * 2.0 - 1.0,
                             1.0 - px.y / uRes.y * 2.0);
            gl_Position = vec4(clip, 0.0, 1.0);
            vUvC = aB.xy;
            vUvH = aB.zw;
            vGen = int(aC.x + 0.5);
            vFade = aC.y;
            vAng = aA.w;
          }
        `;

        const blocksFS = `#version 300 es
          precision highp float;
          in vec2 vLocal;
          in vec2 vUvC;
          in vec2 vUvH;
          flat in int vGen;
          in float vFade;
          in float vAng;
          uniform sampler2D uSnap0;
          uniform sampler2D uSnap1;
          uniform sampler2D uSnap2;
          uniform float uDepth;
          uniform int uDebug;
          uniform highp int uShadow;
          out vec4 fragColor;
          ${CHUNK_TONE}
          float bhash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
          }
          void main() {
            float dEdge = max(abs(vLocal.x), abs(vLocal.y));
            float alphaW = 1.0 - smoothstep(0.62, 1.0, vFade);
            if (uShadow == 1) {
              // soft drop shadow cast onto whatever is beneath the block
              float a = (1.0 - smoothstep(0.16, 0.5, dEdge)) * 0.32 * alphaW;
              fragColor = vec4(0.0, 0.0, 0.0, a);
              return;
            }
            vec2 uv = vUvC + vec2(vLocal.x, -vLocal.y) * vUvH * 2.0;
            vec3 c;
            if (vGen == 1) c = texture(uSnap1, uv).rgb;
            else if (vGen == 2) c = texture(uSnap2, uv).rgb;
            else c = texture(uSnap0, uv).rgb;
            // weathering: assimilate into the bw world, then dissolve
            float ph1 = smoothstep(0.05, 0.7, vFade);
            c = mix(c, bwTone(lumaOf(c), uDepth), ph1);
            float alpha = alphaW;
            // static per-block brightness jitter (cell-hash via source uv)
            c *= 0.92 + 0.16 * bhash(vUvC * 611.3);
            // plaster-chip lighting: the face is grazed from the upper left
            // and the edge facets catch or lose the light with the block's
            // rotation (thickness cue — a chip of wall, not confetti)
            float cs = cos(vAng);
            float sn = sin(vAng);
            vec2 wl = vec2(cs * vLocal.x - sn * vLocal.y,
                           sn * vLocal.x + cs * vLocal.y); // screen, y down
            c *= 1.0 - wl.y * 0.16;
            vec2 nl = abs(vLocal.x) > abs(vLocal.y)
              ? vec2(sign(vLocal.x), 0.0)
              : vec2(0.0, sign(vLocal.y));
            vec2 nw = vec2(cs * nl.x - sn * nl.y, sn * nl.x + cs * nl.y);
            float lit = dot(nw, normalize(vec2(-0.45, -0.89)));
            float band = smoothstep(0.30, 0.5, dEdge);
            c *= 1.0 - band * 0.30 * (1.0 - max(lit, 0.0));
            c += band * 0.16 * max(lit, 0.0) * (1.0 - ph1 * 0.6);
            if (uDebug == 3) {
              vec3 tint = vGen == 0 ? vec3(0.90, 0.30, 0.25)
                : vGen == 1 ? vec3(0.30, 0.80, 0.40)
                : vec3(0.35, 0.55, 0.95);
              c = mix(c, tint, 0.55);
              alpha = max(alpha, 0.6);
            }
            fragColor = vec4(c * alpha, alpha);
          }
        `;

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            const log = gl.getShaderInfoLog(shader);
            throw new Error(`Shader compile failed: ${log}`);
          }
          return shader;
        }

        function createProgram(vsSource, fsSource) {
          const program = gl.createProgram();
          gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
          gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(
              `Program link failed: ${gl.getProgramInfoLog(program)}`,
            );
          }
          return program;
        }

        function getLocations(program, names) {
          const out = {};
          names.forEach((name) => {
            out[name] = gl.getUniformLocation(program, name);
          });
          return out;
        }

        const programs = {
          scene: createProgram(fullscreenVS, sceneFS),
          bw: createProgram(fullscreenVS, bwFS),
          comp: createProgram(fullscreenVS, compFS),
          blocks: createProgram(blocksVS, blocksFS),
        };

        const locations = {
          scene: getLocations(programs.scene, [
            "uVideo",
            "uResolution",
            "uVideoSize",
            "uTime",
            "uMirror",
            "uFake",
            "uHasVideo",
          ]),
          bw: getLocations(programs.bw, [
            "uScene",
            "uTexel",
            "uBwRes",
            "uNega",
            "uEdge",
          ]),
          comp: getLocations(programs.comp, [
            "uScene",
            "uBw",
            "uMask",
            "uGrid",
            "uDepth",
            "uNega",
            "uDebug",
          ]),
          blocks: getLocations(programs.blocks, [
            "uRes",
            "uSnap0",
            "uSnap1",
            "uSnap2",
            "uDepth",
            "uDebug",
            "uShadow",
            "uShadowOff",
          ]),
        };

        function createTexture(width, height, internal, format, filterMode) {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filterMode);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filterMode);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            internal,
            width,
            height,
            0,
            format,
            gl.UNSIGNED_BYTE,
            null,
          );
          return tex;
        }

        function createTarget(width, height) {
          const tex = createTexture(width, height, gl.RGBA8, gl.RGBA, gl.LINEAR);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(
            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT0,
            gl.TEXTURE_2D,
            tex,
            0,
          );
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return { tex, fbo, width, height };
        }

        function destroyTarget(target) {
          if (!target) return;
          gl.deleteTexture(target.tex);
          gl.deleteFramebuffer(target.fbo);
        }

        const videoTexture = createTexture(2, 2, gl.RGBA8, gl.RGBA, gl.LINEAR);

        function bindTexture(unit, texture) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, texture);
        }

        function renderPass(target, program, setup) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
          gl.viewport(
            0,
            0,
            target ? target.width : canvas.width,
            target ? target.height : canvas.height,
          );
          gl.useProgram(program);
          setup();
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        // True GPU sync (CRAFT §C4): a 1×1 readPixels — gl.finish() is
        // effectively non-blocking under swiftshader.
        const syncPx = new Uint8Array(4);
        function glSync() {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, syncPx);
        }

        /* ------------------------------------------------------------------
           Buffers, resize, grid
        ------------------------------------------------------------------ */

        let targets = null;
        let sceneW = 2;
        let sceneH = 2;
        let bwW = 2;
        let bwH = 2;

        // Snapshot generations (invariant #3): 3 shared frozen frames,
        // reference-counted so a generation still worn by pile blocks is
        // recycled only as a last resort (LRU).
        const snapTex = [null, null, null];
        const snapRefs = [0, 0, 0];
        const snapStamp = [-1, -1, -1];
        let snapCur = -1;
        let snapLastT = -1e9;

        // Peel-mask grid (CPU, invariants #1 #5 #6)
        let gridW = 4;
        let gridH = 4;
        let cellW = 8;
        let cellH = 8;
        let cellCount = 16;
        let surf = new Float32Array(16);
        let stress = new Float32Array(16);
        let healGate = new Float32Array(16);
        let maskU8 = new Uint8Array(16);
        let maskTex = null;
        let maskDirty = true;

        // Rigid bodies (invariant #2)
        const MAX_BODIES = 2400;
        const SOFT_BODIES = MAX_BODIES - 300; // fade-out valve (repair #5)
        const FLOATS_PER_INSTANCE = 10;
        const bodies = [];
        const pendingGen = [];
        const instanceData = new Float32Array(MAX_BODIES * FLOATS_PER_INSTANCE);
        let peeledCells = 0;
        let peeledCellsLive = 0; // cells with surf < 1, recounted in healStep

        // Instance buffer + VAO
        const blocksVao = gl.createVertexArray();
        const instanceBuf = gl.createBuffer();
        gl.bindVertexArray(blocksVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuf);
        gl.bufferData(gl.ARRAY_BUFFER, instanceData.byteLength, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 40, 0);
        gl.vertexAttribDivisor(0, 1);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 40, 16);
        gl.vertexAttribDivisor(1, 1);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 40, 32);
        gl.vertexAttribDivisor(2, 1);
        gl.bindVertexArray(null);

        // Deterministic integer cell hash (pcg-flavored; NO time in the seed)
        function cellHash(a, b, c) {
          let h = (Math.imul(a, 374761393) +
            Math.imul(b, 668265263) +
            Math.imul(c, 2246822519)) | 0;
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          h ^= h >>> 16;
          return (h >>> 0) / 4294967296;
        }

        function rebuildTargets() {
          if (targets) Object.values(targets).forEach(destroyTarget);
          targets = {
            scene: createTarget(sceneW, sceneH),
            bw: createTarget(bwW, bwH),
          };
          for (let k = 0; k < 3; k++) {
            if (snapTex[k]) gl.deleteTexture(snapTex[k]);
            snapTex[k] = createTexture(sceneW, sceneH, gl.RGBA8, gl.RGBA, gl.LINEAR);
            snapRefs[k] = 0;
            snapStamp[k] = -1;
          }
          snapCur = -1;
          snapLastT = -1e9;
        }

        function rebuildGrid() {
          const W = canvas.width;
          const H = canvas.height;
          let gw = Math.round(100 - state.block * 36); // 100 (fine) .. 64 (slabs)
          gw = Math.max(12, Math.min(110, gw));
          let cw = W / gw;
          let gh = Math.max(6, Math.round(H / cw));
          // cell budget: heal (60Hz) and propagation (12Hz) are O(N) CPU
          // loops and the mask upload is N bytes/frame — 12000 cells stays
          // in the microsecond range; bodies are capped separately.
          while (gw > 12 && gw * gh > 12000) {
            gw -= 2;
            cw = W / gw;
            gh = Math.max(6, Math.round(H / cw));
          }
          gridW = gw;
          gridH = gh;
          cellW = W / gw;
          cellH = H / gh;
          cellCount = gw * gh;
          surf = new Float32Array(cellCount).fill(1);
          stress = new Float32Array(cellCount);
          healGate = new Float32Array(cellCount);
          maskU8 = new Uint8Array(cellCount).fill(255);
          maskDirty = true;
          if (maskTex) gl.deleteTexture(maskTex);
          maskTex = createTexture(gridW, gridH, gl.R8, gl.RED, gl.LINEAR);
          // bodies reference cell geometry of the old grid — clear them
          bodies.length = 0;
          pendingGen.length = 0;
          wsMap.clear();
          for (let k = 0; k < 3; k++) snapRefs[k] = 0;
          peeledCells = 0;
        }

        function resize() {
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const width = Math.max(2, Math.floor(canvas.clientWidth * dpr));
          const height = Math.max(2, Math.floor(canvas.clientHeight * dpr));
          if (canvas.width !== width || canvas.height !== height || !targets) {
            canvas.width = width;
            canvas.height = height;
            const sScale = Math.min(1, 1024 / Math.max(width, height));
            sceneW = Math.max(2, Math.round(width * sScale));
            sceneH = Math.max(2, Math.round(height * sScale));
            const bScale = Math.min(1, 512 / Math.max(width, height));
            bwW = Math.max(2, Math.round(width * bScale));
            bwH = Math.max(2, Math.round(height * bScale));
            rebuildTargets();
            rebuildGrid();
          }
        }

        window.addEventListener("resize", resize, { passive: true });

        /* ------------------------------------------------------------------
           Peeling — burst, support-loss propagation, healing (all CPU)
        ------------------------------------------------------------------ */

        let simTime = 0;
        let propAccum = 0;
        let propTick = 0;
        let burstCounter = 0;
        const PROP_DT = 1 / 12;

        function injectStress(cx, cy, energy, w) {
          if (cx < 0 || cy < 0 || cx >= gridW || cy >= gridH) return;
          const j = cy * gridW + cx;
          if (surf[j] < 0.98) return;
          const amt = energy * w * 0.58 * (0.3 + 0.7 * state.spread);
          stress[j] = Math.min(1.5, stress[j] + amt);
        }

        function peelCell(cx, cy, energy) {
          const i = cy * gridW + cx;
          if (surf[i] < 0.55) return;
          surf[i] = 0;
          stress[i] = 0;
          healGate[i] = 2.2 + cellHash(cx, cy, 31) * 2.5 + (1 - state.heal) * 1.5;
          maskDirty = true;
          // support loss: the cell ABOVE the new hole is stressed hardest
          injectStress(cx, cy + 1, energy, 1.3);
          injectStress(cx - 1, cy, energy, 0.9);
          injectStress(cx + 1, cy, energy, 0.9);
          injectStress(cx, cy - 1, energy, 0.45);
          spawnBody(cx, cy);
        }

        // Click/tap/drag entry point (ux 0..1 left→right, uyUp 0..1 bottom→top)
        function peelBurst(ux, uyUp) {
          const R = (0.03 + 0.115 * state.burst) * gridW;
          const gx = ux * gridW - 0.5;
          const gy = uyUp * gridH - 0.5;
          const salt = 7919 + burstCounter++;
          const x0 = Math.max(0, Math.floor(gx - R - 1));
          const x1 = Math.min(gridW - 1, Math.ceil(gx + R + 1));
          const y0 = Math.max(0, Math.floor(gy - R - 1));
          const y1 = Math.min(gridH - 1, Math.ceil(gy + R + 1));
          for (let cy = y0; cy <= y1; cy++) {
            for (let cx = x0; cx <= x1; cx++) {
              const d = Math.hypot(cx - gx, cy - gy);
              if (d > R + 1.5) continue;
              const i = cy * gridW + cx;
              let t = (R - d) / Math.max(0.5, R * 0.65);
              t = Math.max(0, Math.min(1, t));
              const p = t * t * (3 - 2 * t);
              if (surf[i] > 0.55 && cellHash(cx, cy, salt) < p + 0.12 && p > 0.02) {
                peelCell(cx, cy, 1.0);
              } else if (surf[i] > 0.98) {
                // ring stress just outside the core → the delayed crumble
                const ring = Math.max(0, 1 - Math.abs(d - R) / Math.max(0.6, R * 0.6));
                stress[i] = Math.min(
                  1.5,
                  stress[i] + ring * 0.5 * (0.25 + 0.75 * state.spread),
                );
              }
            }
          }
        }

        function propagationTick() {
          propTick++;
          for (let cy = 0; cy < gridH; cy++) {
            for (let cx = 0; cx < gridW; cx++) {
              const i = cy * gridW + cx;
              const s = stress[i];
              if (s < 0.02) {
                stress[i] = 0;
                continue;
              }
              if (surf[i] > 0.98) {
                const p = Math.min(0.32, s * (0.15 + 0.6 * state.spread));
                if (cellHash(cx, cy, 1013904223 + propTick) < p) {
                  peelCell(cx, cy, Math.min(1, s));
                  continue;
                }
              }
              stress[i] = s * 0.7; // geometric decay → finite radius
            }
          }
        }

        function healStep(dt) {
          const rate = 0.005 + 0.5 * Math.pow(state.heal, 1.2);
          // live wound count (cells not fully repaired). Free — the loop
          // already visits every cell — and it is the trigger for the
          // "surface fully repaired → the floor must empty" insurance
          // in physicsStep (repair #6).
          let damaged = 0;
          for (let cy = 0; cy < gridH; cy++) {
            for (let cx = 0; cx < gridW; cx++) {
              const i = cy * gridW + cx;
              if (surf[i] >= 1) continue;
              damaged++;
              if (healGate[i] > 0) {
                healGate[i] -= dt;
                continue;
              }
              let nb = 0;
              nb += cx === 0 || surf[i - 1] > 0.85 ? 1 : 0;
              nb += cx === gridW - 1 || surf[i + 1] > 0.85 ? 1 : 0;
              nb += cy === 0 || surf[i - gridW] > 0.85 ? 1 : 0;
              nb += cy === gridH - 1 || surf[i + gridW] > 0.85 ? 1 : 0;
              const f = nb === 0 ? 0.08 : 0.45 + 0.9 * (nb / 4);
              surf[i] = Math.min(
                1,
                surf[i] + dt * rate * f * (0.55 + 0.9 * cellHash(cx, cy, 97)),
              );
              maskDirty = true;
            }
          }
          peeledCellsLive = damaged;
        }

        /* ------------------------------------------------------------------
           Rigid bodies — contact-based mini engine (invariants #2 #6).
           Matter.js と同構成(均一グリッド broadphase → OBB-OBB SAT+参照面
           クリッピング → 逐次インパルス+ウォームスタート → 線形位置補正 →
           スリープ/深部凍結)を「ほぼ均一サイズの正方形」専用に内蔵実装。
           外部ライブラリは読み込まない(単一自己完結 HTML 規約)。
           決定性: 固定 dt、cell-hash 乱数、ボディ配列順の反復。
        ------------------------------------------------------------------ */

        const VEL_ITERS = 4; // sequential-impulse velocity iterations
        const POS_ITERS = 3; // linear position-correction iterations
        const FRICTION = 0.5; // Coulomb μ (Matter.js Stack 帯: 0.4–0.6)
        // Working μ. Untilted it IS FRICTION; device tilt loosens it (see
        // updateGravityTilt): μ=0.5 means an angle of repose of 26.6°, so a
        // settled mound would not avalanche at all below that. Loosening
        // with the tilt magnitude is the "a tilted, handled device shakes
        // the rubble" model and keeps the desktop path bit-identical.
        let frictionNow = FRICTION;
        const MAX_ACTIVE = 900; // non-sleeping solver bodies (force-sleep over)
        const SLEEP_STEPS = 22; // low-motion steps before sleeping (~0.37 s)
        const FREEZE_AFTER = 2.0; // s asleep + loaded from above → frozen
        let bodyIdSeq = 1;
        let physStepCount = 0;
        let physMsAvg = 0;
        let physActiveNow = 0;
        let physContactsNow = 0;
        // Removal-path counters (diagnostic only — repair #8). Every body
        // leaves through exactly one of these, so a sudden drop in the body
        // count can be attributed to a path instead of guessed at.
        // `activeCap` is the deleted instant-expiry path: it is kept as a
        // tripwire and must stay 0 forever. `doomOverload` counts the
        // graceful replacement (fade, not pop).
        const rmCount = {
          weather: 0,
          spawnCap: 0,
          activeCap: 0,
          doomOverload: 0,
        };

        // Warm-start cache: accumulated normal/tangent impulses per body
        // pair, rematched by contact-point proximity next step. Essential
        // for a pile that rests WITHOUT jitter (Matter.js does the same).
        const wsMap = new Map();
        function pairKey(ia, ib) {
          return ia * 67108864 + ib; // ids stay far below 2^26
        }

        function wakeBody(b, quiet) {
          if (b.state === 0) return;
          b.state = 0;
          b.quiet = !!quiet; // quiet = weathering subsidence: no bounce
          b.sleepCount = 0;
          b.sleepT = 0;
          b.airT = 0;
          b.motionS = 1e4;
        }

        /* ---- tilt avalanche wave (repair #8) --------------------------------
           A tilt change used to wake EVERY resting body in one step. On a
           large pile that pushed `active` far past MAX_ACTIVE in a single
           frame, and the old active-cap fallback then deleted the overage
           outright — measured: a 5° tilt on a 2195-block pile removed 1139
           blocks in ONE step, in full view (the reported bug).
           Now a tilt change only opens a new WAVE: each step wakes a bounded
           batch, topmost first, and never past the active cap. Physically
           truer too — the avalanche starts at the surface of the pile and
           travels down instead of the whole mound twitching at once. ---- */
        const TILT_WAKE_PER_STEP = 120;
        let tiltWakeSeq = 0; // incremented per tilt event; bodies start at 0
        function tiltWakeTick() {
          if (tiltWakeSeq === 0) return;
          const budget = Math.min(
            TILT_WAKE_PER_STEP,
            MAX_ACTIVE - 60 - physActiveNow,
          );
          if (budget <= 0) return;
          const cand = [];
          for (let i = 0; i < bodies.length; i++) {
            const b = bodies[i];
            if (b.state > 0 && b.wakeSeq !== tiltWakeSeq) cand.push(b);
          }
          if (cand.length === 0) return;
          // topmost first (y grows downward): the surface slides first
          cand.sort((p, q) => p.y - q.y || p.id - q.id);
          const n = Math.min(budget, cand.length);
          for (let k = 0; k < n; k++) {
            cand[k].wakeSeq = tiltWakeSeq;
            wakeBody(cand[k], true);
          }
        }

        function sleepBody(b) {
          b.state = 1;
          b.vx = 0;
          b.vy = 0;
          b.angv = 0; // keep b.ang — tilted rest poses persist (the look)
          b.quiet = false;
          b.sleepT = 0;
          b.sleepCount = 0;
          b.pushX = 0;
          b.pushY = 0;
          // it was only allowed to sleep because it reached ground this step
          // (see sleep bookkeeping / force-sleep gates) — mark it grounded so
          // the next lander can inherit the chain before the periodic scan.
          b.grounded = true;
          // pile-height bound: blocks resting high on a tall pile fade 3×
          b.wFast = b.y < canvas.height * 0.5;
        }

        function removeBody(idx) {
          const rb = bodies[idx];
          snapRefs[rb.gen] = Math.max(0, snapRefs[rb.gen] - 1);
          bodies[idx] = bodies[bodies.length - 1];
          bodies.pop();
          // the column above loses its support: wake it QUIETLY (zero
          // velocity, no restitution) so the pile subsides without dancing.
          for (let k = 0; k < bodies.length; k++) {
            const b = bodies[k];
            if (b.state === 0) continue;
            const dx = Math.abs(b.x - rb.x);
            const dy = rb.y - b.y; // >0 → b sits above the removed block
            if (
              dx < (b.size + rb.size) * 0.8 &&
              dy > -rb.size * 0.4 &&
              dy < rb.size * 2.2
            ) {
              wakeBody(b, true);
            }
          }
        }

        // Hard slot reclaim at MAX_BODIES. It used to pop the OLDEST body,
        // which on a full-surface drag (no resting body yet) fell through to
        // bodies[0] and made a block vanish in mid-flight. It now reclaims
        // the MOST WEATHERED one instead — with the doom valve running from
        // SOFT_BODIES on, that block is already ~invisible at the end of its
        // dissolve. If nothing is faded enough (weather < 0.8) NO block is
        // taken: the caller skips the spawn instead, which costs one chip
        // that was never seen rather than one the viewer is watching.
        function forceExpireFaded() {
          let idx = -1;
          let best = 0.8;
          for (let k = 0; k < bodies.length; k++) {
            if (bodies[k].weather > best) {
              best = bodies[k].weather;
              idx = k;
            }
          }
          if (idx < 0) return false;
          rmCount.spawnCap++;
          removeBody(idx);
          return true;
        }

        // Soft pressure valve (repair #5): approaching the body cap, each new
        // spawn fast-tracks the OLDEST resting block into its dissolve fade
        // (~1 s) instead of popping it. Since repair #8 this is the ONLY way
        // a visible block may be taken out of circulation.
        // Resting blocks are doomed first (they are the settled pile the eye
        // has stopped tracking); only if there is none — a burst where every
        // body is still airborne — does a falling one get the fade, and even
        // then it is a ~1 s dissolve, never a pop (repair #8).
        function doomOldest() {
          let idx = -1;
          let oldest = Infinity;
          for (let k = 0; k < bodies.length; k++) {
            const b = bodies[k];
            if (b.state > 0 && !b.doom && b.born < oldest) {
              oldest = b.born;
              idx = k;
            }
          }
          if (idx < 0) {
            for (let k = 0; k < bodies.length; k++) {
              const b = bodies[k];
              if (!b.doom && b.born < oldest) {
                oldest = b.born;
                idx = k;
              }
            }
          }
          if (idx < 0) return false;
          const b = bodies[idx];
          b.doom = true;
          b.weather = Math.max(b.weather, 0.62); // dissolve starts here
          return true;
        }

        function spawnBody(cx, cy) {
          if (bodies.length >= MAX_BODIES) {
            // no slot: reclaim a fully faded one, else drop this chip
            if (!forceExpireFaded()) return;
          } else if (bodies.length >= SOFT_BODIES) doomOldest();
          const H = canvas.height;
          // slight size jitter (cell-hash): varied rubble, not confetti
          const size =
            Math.min(cellW, cellH) * (0.8 + 0.34 * cellHash(cx, cy, 17));
          const r1 = cellHash(cx, cy, 11);
          const r2 = cellHash(cx, cy, 12);
          const r3 = cellHash(cx, cy, 13);
          const tv = state.tumble;
          const sc = H / 750;
          const b = {
            id: bodyIdSeq++,
            x: (cx + 0.5) * cellW,
            y: H - (cy + 0.5) * cellH,
            vx: (r1 - 0.5) * 2 * (30 + 170 * tv) * sc,
            vy: -(15 + 95 * tv * r2) * sc,
            ang: 0,
            angv: (r3 - 0.5) * 2 * (1.0 + 5.5 * tv),
            size,
            h: size * 0.5,
            invI: 6 / (size * size), // unit-mass square: I = m s² / 6
            u: (cx + 0.5) / gridW,
            v: (cy + 0.5) / gridH,
            uhx: (0.5 / gridW) * 0.98,
            uhy: (0.5 / gridH) * 0.98,
            gen: 0,
            state: 0, // 0 active / 1 sleeping / 2 frozen (static deep pile)
            quiet: false,
            supported: false,
            grounded: false, // connected to floor through a resting chain
            groundedNow: false, // this step: touched ground or a grounded body
            airT: 0.2, // spawned mid-air: bounce-eligible from the start
            sleepCount: 0,
            sleepT: 0,
            motionS: 1e4,
            pushX: 0,
            pushY: 0,
            weather: 0,
            // per-block lifetime jitter (cell-hash, no time in the seed)
            wJit: 0.7 + 0.6 * cellHash(cx, cy, 77),
            wFast: false,
            // heal-coupled fade (repair #5): ci = origin cell in the CURRENT
            // grid (bodies are cleared on grid rebuild, so it stays valid);
            // healedAway latches once the surface has repaired over the
            // wound — from then on the orphaned chip ages 2.6x faster, so
            // the pile dissolves in step with the healing instead of
            // lingering until the next tap force-expires it.
            ci: cy * gridW + cx,
            healedAway: false,
            // bounded post-repair fade (repair #6): 2–4 s, cell-hash jitter
            // so the pile dissolves block by block, never as one cliff.
            fadeLife: 2.0 + 2.0 * cellHash(cx, cy, 53),
            doom: false,
            wakeSeq: 0, // last tilt avalanche wave that woke it (repair #8)
            born: simTime,
          };
          bodies.push(b);
          pendingGen.push(b);
        }

        /* ---- broadphase: uniform grid buckets (cell ≥ max block diagonal).
           Every body registers at its centroid; active bodies query the
           surrounding 3×3 buckets for pair candidates. ---- */
        const bpMap = new Map();
        let bpCell = 32;
        function bpKey(gx, gy) {
          return (gx + 256) * 65536 + (gy + 256);
        }
        function buildBroadphase() {
          bpMap.clear();
          // max size = 1.14 cell → max diagonal ≈ 1.62 cell < 1.65 cell
          bpCell = Math.max(8, Math.min(cellW, cellH) * 1.65);
          for (let i = 0; i < bodies.length; i++) {
            const b = bodies[i];
            const key = bpKey(
              Math.floor(b.x / bpCell),
              Math.floor(b.y / bpCell),
            );
            let arr = bpMap.get(key);
            if (!arr) {
              arr = [];
              bpMap.set(key, arr);
            }
            arr.push(i);
          }
        }

        /* ---- narrowphase: OBB-OBB SAT with reference-face clipping
           (Box2D-lite scheme, simplified for squares: |RotAᵀRotB| has one
           independent entry K = |cosΔ| + |sinΔ|). Fills CN (normal A→B) and
           CP (x, y, penetration) × up to 2; returns the point count. ---- */
        const CP = new Float64Array(6);
        const CN = new Float64Array(2);
        const clipBuf = new Float64Array(4);

        function clipSegment(buf, nx, ny, offset) {
          const x0 = buf[0];
          const y0 = buf[1];
          const x1 = buf[2];
          const y1 = buf[3];
          const d0 = nx * x0 + ny * y0 - offset;
          const d1 = nx * x1 + ny * y1 - offset;
          let cnt = 0;
          if (d0 <= 0) {
            buf[cnt * 2] = x0;
            buf[cnt * 2 + 1] = y0;
            cnt++;
          }
          if (d1 <= 0) {
            buf[cnt * 2] = x1;
            buf[cnt * 2 + 1] = y1;
            cnt++;
          }
          if (d0 * d1 < 0 && cnt < 2) {
            const t = d0 / (d0 - d1);
            buf[cnt * 2] = x0 + t * (x1 - x0);
            buf[cnt * 2 + 1] = y0 + t * (y1 - y0);
            cnt++;
          }
          return cnt;
        }

        // The face of the incident box most anti-parallel to n, in world.
        function incidentEdge(h, px, py, cb, sb, nx, ny) {
          const nbx = -(nx * cb + ny * sb);
          const nby = -(-nx * sb + ny * cb);
          let ax;
          let ay;
          let bx;
          let by;
          if (Math.abs(nbx) > Math.abs(nby)) {
            if (nbx >= 0) {
              ax = h; ay = -h; bx = h; by = h;
            } else {
              ax = -h; ay = h; bx = -h; by = -h;
            }
          } else if (nby >= 0) {
            ax = h; ay = h; bx = -h; by = h;
          } else {
            ax = -h; ay = -h; bx = h; by = -h;
          }
          clipBuf[0] = px + ax * cb - ay * sb;
          clipBuf[1] = py + ax * sb + ay * cb;
          clipBuf[2] = px + bx * cb - by * sb;
          clipBuf[3] = py + bx * sb + by * cb;
        }

        function collideBoxes(A, B) {
          const ca = Math.cos(A.ang);
          const sa = Math.sin(A.ang);
          const cb = Math.cos(B.ang);
          const sb = Math.sin(B.ang);
          const hA = A.h;
          const hB = B.h;
          const dpx = B.x - A.x;
          const dpy = B.y - A.y;
          const dAx = dpx * ca + dpy * sa;
          const dAy = -dpx * sa + dpy * ca;
          const dBx = dpx * cb + dpy * sb;
          const dBy = -dpx * sb + dpy * cb;
          const K =
            Math.abs(ca * cb + sa * sb) + Math.abs(sa * cb - ca * sb) + 2e-6;
          const fAx = Math.abs(dAx) - hA - hB * K;
          if (fAx > 0) return 0;
          const fAy = Math.abs(dAy) - hA - hB * K;
          if (fAy > 0) return 0;
          const fBx = Math.abs(dBx) - hB - hA * K;
          if (fBx > 0) return 0;
          const fBy = Math.abs(dBy) - hB - hA * K;
          if (fBy > 0) return 0;

          // min-penetration axis; relative tolerance keeps face choice
          // coherent frame-to-frame (Box2D-lite constants)
          let axis = 0;
          let sep = fAx;
          let nx = dAx > 0 ? ca : -ca;
          let ny = dAx > 0 ? sa : -sa;
          const REL = 0.95;
          const ABS = 0.01;
          if (fAy > REL * sep + ABS * hA) {
            axis = 1;
            sep = fAy;
            nx = dAy > 0 ? -sa : sa;
            ny = dAy > 0 ? ca : -ca;
          }
          if (fBx > REL * sep + ABS * hB) {
            axis = 2;
            sep = fBx;
            nx = dBx > 0 ? cb : -cb;
            ny = dBx > 0 ? sb : -sb;
          }
          if (fBy > REL * sep + ABS * hB) {
            axis = 3;
            sep = fBy;
            nx = dBy > 0 ? -sb : sb;
            ny = dBy > 0 ? cb : -cb;
          }

          // reference box owns the axis; clip the other's incident face
          let fnx;
          let fny;
          let refPx;
          let refPy;
          let refH;
          let refC;
          let refS;
          if (axis < 2) {
            fnx = nx;
            fny = ny;
            refPx = A.x;
            refPy = A.y;
            refH = hA;
            refC = ca;
            refS = sa;
            incidentEdge(hB, B.x, B.y, cb, sb, fnx, fny);
          } else {
            fnx = -nx;
            fny = -ny;
            refPx = B.x;
            refPy = B.y;
            refH = hB;
            refC = cb;
            refS = sb;
            incidentEdge(hA, A.x, A.y, ca, sa, fnx, fny);
          }
          const front = fnx * refPx + fny * refPy + refH;
          const sdx = -fny;
          const sdy = fnx;
          const sideOff = sdx * refPx + sdy * refPy;
          if (clipSegment(clipBuf, -sdx, -sdy, -sideOff + refH) < 2) return 0;
          if (clipSegment(clipBuf, sdx, sdy, sideOff + refH) < 2) return 0;

          let np = 0;
          for (let k = 0; k < 2; k++) {
            const px = clipBuf[k * 2];
            const py = clipBuf[k * 2 + 1];
            const s2 = fnx * px + fny * py - front;
            if (s2 <= 0) {
              CP[np * 3] = px;
              CP[np * 3 + 1] = py;
              CP[np * 3 + 2] = -s2;
              np++;
            }
          }
          CN[0] = nx;
          CN[1] = ny;
          return np;
        }

        /* ---- contacts + sequential-impulse solver ---- */
        const contacts = [];

        // Airtime-gated restitution: only a body that has actually been in
        // free flight bounces. Inside a settled pile every contact gets
        // e = 0 — with any nonzero pile restitution a ~300-body pile
        // self-excites into a permanent churn (measured mean ~16 px/s)
        // regardless of the bias threshold; with the gate it decays to
        // < 0.2 px/s while genuine falls still bounce (0.05–0.15 band).
        function restitutionNow(a, b) {
          if (a.quiet || (b && b.quiet)) return 0;
          if (a.airT < 0.12 && (!b || b.airT < 0.12)) return 0;
          return 0.06 + 0.09 * state.tumble; // Matter Stack 帯 0.05–0.15
        }

        function makeContact(A, B, np, wallId) {
          const c = {
            a: A,
            b: B,
            nx: CN[0],
            ny: CN[1],
            dynA: A.state === 0,
            dynB: B ? B.state === 0 : false,
            e: restitutionNow(A, B),
            key: pairKey(A.id, B ? B.id : 67108860 + wallId),
            p0: null,
            p1: null,
          };
          const ws = wsMap.get(c.key);
          for (let k = 0; k < np; k++) {
            const px = CP[k * 3];
            const py = CP[k * 3 + 1];
            const pt = {
              px,
              py,
              pen: CP[k * 3 + 2],
              rax: px - A.x,
              ray: py - A.y,
              rbx: B ? px - B.x : 0,
              rby: B ? py - B.y : 0,
              mN: 0,
              mT: 0,
              bias: 0,
              jn: 0,
              jt: 0,
            };
            if (ws) {
              // proximity rematch (squares move slowly relative to size)
              const tol2 = A.h * A.h * 0.16;
              for (let m = 0; m < ws.p.length; m++) {
                const s = ws.p[m];
                const dx = s.px - px;
                const dy = s.py - py;
                if (dx * dx + dy * dy < tol2) {
                  pt.jn = s.jn;
                  pt.jt = s.jt;
                  break;
                }
              }
            }
            if (k === 0) c.p0 = pt;
            else c.p1 = pt;
          }
          contacts.push(c);
        }

        // wall ids: 0 floor, 1 left, 2 right (static half-planes, same solver)
        const bcCorners = new Float64Array(8);
        function boundaryContacts(A, W, H) {
          const axc = Math.cos(A.ang) * A.h;
          const axs = Math.sin(A.ang) * A.h;
          // corners: (±a ±b) where a=(axc,axs), b=(-axs,axc)
          const corners = bcCorners;
          corners[0] = A.x + axc - axs;
          corners[1] = A.y + axs + axc;
          corners[2] = A.x + axc + axs;
          corners[3] = A.y + axs - axc;
          corners[4] = A.x - axc - axs;
          corners[5] = A.y - axs + axc;
          corners[6] = A.x - axc + axs;
          corners[7] = A.y - axs - axc;
          for (let wall = 0; wall < 3; wall++) {
            let nx = 0;
            let ny = 0;
            let i1 = -1;
            let i2 = -1;
            let p1 = 0;
            let p2 = 0;
            for (let k = 0; k < 4; k++) {
              const cx = corners[k * 2];
              const cy = corners[k * 2 + 1];
              let pen;
              if (wall === 0) pen = cy - H;
              else if (wall === 1) pen = -cx;
              else pen = cx - W;
              if (pen > 0) {
                if (pen > p1) {
                  p2 = p1;
                  i2 = i1;
                  p1 = pen;
                  i1 = k;
                } else if (pen > p2) {
                  p2 = pen;
                  i2 = k;
                }
              }
            }
            if (i1 < 0) continue;
            if (wall === 0) {
              nx = 0;
              ny = 1;
            } else if (wall === 1) {
              nx = -1;
              ny = 0;
            } else {
              nx = 1;
              ny = 0;
            }
            let np = 0;
            CP[0] = corners[i1 * 2];
            CP[1] = corners[i1 * 2 + 1];
            CP[2] = p1;
            np = 1;
            if (i2 >= 0) {
              CP[3] = corners[i2 * 2];
              CP[4] = corners[i2 * 2 + 1];
              CP[5] = p2;
              np = 2;
            }
            CN[0] = nx;
            CN[1] = ny;
            makeContact(A, null, np, wall);
          }
        }

        function genContacts(sc) {
          contacts.length = 0;
          const W = canvas.width;
          const H = canvas.height;
          const wakeV = 55 * sc;
          for (let i = 0; i < bodies.length; i++) {
            const Q = bodies[i];
            if (Q.state !== 0) continue;
            const gx = Math.floor(Q.x / bpCell);
            const gy = Math.floor(Q.y / bpCell);
            for (let oy = -1; oy <= 1; oy++) {
              for (let ox = -1; ox <= 1; ox++) {
                const arr = bpMap.get(bpKey(gx + ox, gy + oy));
                if (!arr) continue;
                for (let k = 0; k < arr.length; k++) {
                  const j = arr[k];
                  if (j === i) continue;
                  const P = bodies[j];
                  if (P.state === 0 && j < i) continue; // pair handled at j
                  // canonical order by id → warm-start normals stay stable
                  const A = P.id < Q.id ? P : Q;
                  const B = P.id < Q.id ? Q : P;
                  const rr = (A.h + B.h) * 1.4143;
                  const ddx = B.x - A.x;
                  const ddy = B.y - A.y;
                  if (ddx * ddx + ddy * ddy > rr * rr) continue;
                  const np = collideBoxes(A, B);
                  if (np === 0) continue;
                  // impact wake: a sleeping (not frozen) partner joins the
                  // solve when actually hit — Matter's chained waking
                  const S = A.state !== 0 ? A : B.state !== 0 ? B : null;
                  if (S && S.state === 1) {
                    const D = S === A ? B : A;
                    const sp = Math.hypot(D.vx, D.vy) + Math.abs(D.angv) * D.h;
                    if (sp > wakeV) wakeBody(S, false);
                  }
                  makeContact(A, B, np, 0);
                }
              }
            }
            boundaryContacts(Q, W, H);
          }
          physContactsNow = contacts.length;
        }

        function prestepContact(c, restThreshV) {
          const a = c.a;
          const b = c.b;
          c.dynA = a.state === 0;
          c.dynB = b ? b.state === 0 : false;
          const iMa = c.dynA ? 1 : 0;
          const iIa = c.dynA ? a.invI : 0;
          const iMb = c.dynB ? 1 : 0;
          const iIb = c.dynB && b ? b.invI : 0;
          c.iMa = iMa;
          c.iIa = iIa;
          c.iMb = iMb;
          c.iIb = iIb;
          const nx = c.nx;
          const ny = c.ny;
          const tx = -ny;
          const ty = nx;
          for (let k = 0; k < 2; k++) {
            const pt = k === 0 ? c.p0 : c.p1;
            if (!pt) continue;
            const rnA = pt.rax * ny - pt.ray * nx;
            const rnB = pt.rbx * ny - pt.rby * nx;
            pt.mN = 1 / (iMa + iMb + iIa * rnA * rnA + iIb * rnB * rnB);
            const rtA = pt.rax * ty - pt.ray * tx;
            const rtB = pt.rbx * ty - pt.rby * tx;
            pt.mT = 1 / (iMa + iMb + iIa * rtA * rtA + iIb * rtB * rtB);
            // restitution target from pre-solve approach speed
            const vax = a.vx - a.angv * pt.ray;
            const vay = a.vy + a.angv * pt.rax;
            const vbx = b ? b.vx - b.angv * pt.rby : 0;
            const vby = b ? b.vy + b.angv * pt.rbx : 0;
            const vn = (vbx - vax) * nx + (vby - vay) * ny;
            pt.bias = vn < -restThreshV ? -c.e * vn : 0;
            // warm start
            const Px = pt.jn * nx + pt.jt * tx;
            const Py = pt.jn * ny + pt.jt * ty;
            if (c.dynA) {
              a.vx -= Px * iMa;
              a.vy -= Py * iMa;
              a.angv -= iIa * (pt.rax * Py - pt.ray * Px);
            }
            if (c.dynB) {
              b.vx += Px * iMb;
              b.vy += Py * iMb;
              b.angv += iIb * (pt.rbx * Py - pt.rby * Px);
            }
          }
        }

        function solveContactVel(c) {
          const a = c.a;
          const b = c.b;
          const nx = c.nx;
          const ny = c.ny;
          const tx = -ny;
          const ty = nx;
          for (let k = 0; k < 2; k++) {
            const pt = k === 0 ? c.p0 : c.p1;
            if (!pt) continue;
            // normal impulse (accumulated, clamped ≥ 0)
            let vax = a.vx - a.angv * pt.ray;
            let vay = a.vy + a.angv * pt.rax;
            let vbx = b ? b.vx - b.angv * pt.rby : 0;
            let vby = b ? b.vy + b.angv * pt.rbx : 0;
            const vn = (vbx - vax) * nx + (vby - vay) * ny;
            let l = -pt.mN * (vn - pt.bias);
            const jn0 = pt.jn;
            pt.jn = Math.max(0, jn0 + l);
            l = pt.jn - jn0;
            let Px = l * nx;
            let Py = l * ny;
            if (c.dynA) {
              a.vx -= Px * c.iMa;
              a.vy -= Py * c.iMa;
              a.angv -= c.iIa * (pt.rax * Py - pt.ray * Px);
            }
            if (c.dynB) {
              b.vx += Px * c.iMb;
              b.vy += Py * c.iMb;
              b.angv += c.iIb * (pt.rbx * Py - pt.rby * Px);
            }
            // friction impulse (clamped to μ · jn — Coulomb cone)
            vax = a.vx - a.angv * pt.ray;
            vay = a.vy + a.angv * pt.rax;
            vbx = b ? b.vx - b.angv * pt.rby : 0;
            vby = b ? b.vy + b.angv * pt.rbx : 0;
            const vt = (vbx - vax) * tx + (vby - vay) * ty;
            let lt = -pt.mT * vt;
            const maxF = frictionNow * pt.jn;
            const jt0 = pt.jt;
            pt.jt = Math.max(-maxF, Math.min(maxF, jt0 + lt));
            lt = pt.jt - jt0;
            Px = lt * tx;
            Py = lt * ty;
            if (c.dynA) {
              a.vx -= Px * c.iMa;
              a.vy -= Py * c.iMa;
              a.angv -= c.iIa * (pt.rax * Py - pt.ray * Px);
            }
            if (c.dynB) {
              b.vx += Px * c.iMb;
              b.vy += Py * c.iMb;
              b.angv += c.iIb * (pt.rbx * Py - pt.rby * Px);
            }
          }
        }

        // Linear position correction with slop (Matter.js scheme): pushes
        // accumulate in pushX/Y and apply once, rotation untouched — the
        // angular response lives in the velocity solve.
