            gl.uniform1i(u.uPresent01, present01);
          });

          // P5 — draw particles (instanced quads, additive) into the HDR field
          gl.bindFramebuffer(gl.FRAMEBUFFER, targets.field.fbo);
          gl.viewport(0, 0, targets.field.width, targets.field.height);
          gl.clearColor(0, 0, 0, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE);
          gl.useProgram(programs.pDraw);
          bindTexture(0, partDst.texA);
          bindTexture(1, partDst.texB);
          bindTexture(2, targets.softT.tex);
          gl.uniform1i(locations.pDraw.uStateA, 0);
          gl.uniform1i(locations.pDraw.uStateB, 1);
          gl.uniform1i(locations.pDraw.uMask, 2);
          gl.uniform1f(locations.pDraw.uTexW, PART_W);
          gl.uniform2f(locations.pDraw.uResolution, targets.field.width, targets.field.height);
          gl.uniform1f(locations.pDraw.uSize, state.grain);
          gl.uniform1f(locations.pDraw.uSmoke, state.smoke);
          gl.uniform1f(locations.pDraw.uAmbient, state.ambient);
          gl.uniform1f(locations.pDraw.uBodyFrac, BODY_FRAC);
          gl.uniform1f(locations.pDraw.uPresent, det.present);
          gl.bindVertexArray(vao);
          gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, PART_N);
          gl.bindVertexArray(null);
          gl.disable(gl.BLEND);

          // P6 — two-stage separable bloom from the field
          blurPass(targets.field, targets.b1Tmp, targets.b1, 2.6);
          blurPass(targets.b1, targets.b2Tmp, targets.b2, 2.6);

          // P7 — composite
          renderPass(null, programs.composite, () => {
            const u = locations.composite;
            bindTexture(0, targets.field.tex);
            bindTexture(1, targets.b1.tex);
            bindTexture(2, targets.b2.tex);
            bindTexture(3, targets.softT.tex);
            gl.uniform1i(u.uField, 0);
            gl.uniform1i(u.uB1, 1);
            gl.uniform1i(u.uB2, 2);
            gl.uniform1i(u.uMask, 3);
            gl.uniform2f(u.uResolution, canvas.width, canvas.height);
            gl.uniform1f(u.uBloom, state.bloom);
            gl.uniform1f(u.uTrail, state.trail);
            gl.uniform1f(u.uFilmGrain, state.filmGrain);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform1f(u.uPresent, det.present);
            gl.uniform1i(u.uDebug, state.debugView);
          });

          scenePing = !scenePing;
          maskPing = !maskPing;
          partPing = !partPing;

          if (!readyStamped && hasInput) {
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            readout.textContent = `FPS ${fps.toFixed(0)} / 解像度 ${canvas.width}×${
              canvas.height} / 粒子 ${PART_N.toLocaleString()} / 検知 ${detectionLabel()}`;
            updateChip();
          }

          requestAnimationFrame(frame);
        }

        /* ------------------------------------------------------------------
           Camera + boot. With ?fakesource=1 the synthetic scene drives the
           pipeline and MediaPipe is never touched, but getUserMedia still runs
           so the three error paths stay observable.
        ------------------------------------------------------------------ */

        async function startCamera() {
          stopCamera();
          cameraReady = false;
          retryCamera.disabled = true;
          setOverlay("requesting", "REQUESTING CAMERA",
            "Please allow webcam access. If this is not localhost or HTTPS, the camera API will be blocked.");

          if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost" &&
            location.hostname !== "127.0.0.1" &&
            location.hostname !== "[::1]"
          ) {
            setOverlay("error", "SECURE CONTEXT REQUIRED",
              "Serve the file from localhost (for example: python3 -m http.server 8899) or HTTPS, then reload.");
            retryCamera.disabled = false;
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setOverlay("error", "CAMERA API UNAVAILABLE",
              "This browser does not expose getUserMedia. Try a modern browser over localhost or HTTPS.");
            retryCamera.disabled = false;
            return;
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: state.facingMode,
                width: { ideal: 1280 }, height: { ideal: 720 },
              },
              audio: false,
            });
            video.srcObject = stream;
            await video.play();
            cameraReady = true;
            retryCamera.disabled = false;
            needsReset = true;
            setOverlay("hidden", "", "");
            if (!FAKE) loadMediaPipe();
          } catch (error) {
            retryCamera.disabled = false;
            const name = error && error.name ? error.name : "";
            if (name === "NotAllowedError" || name === "SecurityError") {
              setOverlay("error", "PERMISSION DENIED",
                "Camera access was denied. Enable camera permission for this site, then retry.",
                { retryCamera: true });
            } else if (name === "NotFoundError" || name === "OverconstrainedError") {
              setOverlay("error", "NO CAMERA FOUND",
                "No usable webcam was found. Connect a camera or release it from another app, then retry.",
                { retryCamera: true });
            } else {
              setOverlay("error", "CAMERA ERROR",
                `${name || "Unknown error"}. Check browser permissions and retry.`,
                { retryCamera: true });
            }
          }
        }

        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        retryCamera.addEventListener("click", () => { startCamera(); });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });
        window.addEventListener("beforeunload", stopCamera);

        const bootWall = performance.now();

        try {
          resize();
          if (FAKESEG) uploadFakeSeg(); // offline seg-path diagnostic
          // startCamera() runs in every mode. Under ?fakesource=1 the synthetic
          // scene drives the whole pipeline regardless of the camera (the video
          // texture is never sampled, MediaPipe stays untouched), so the camera
          // is only exercised to keep the three error overlays observable.
          startCamera();
          detectionTick();
          requestAnimationFrame(frame);
        } catch (error) {
          setOverlay("error", "WEBGL SETUP ERROR",
            error && error.message ? error.message : "Could not initialize the renderer.");
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
