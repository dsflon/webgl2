<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨戯 — Sumi Fluid</title>
<style>
  :root{
    --washi:#f4f1ea;       /* paper */
    --sumi:#1a1714;        /* ink */
    --stone:#6f675c;       /* muted */
    --shu:#b5332a;         /* vermilion seal accent */
    --line:rgba(40,34,28,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#e9e4da;
    color:var(--sumi);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

  /* ---- title block (vertical, like a scroll inscription) ---- */
  .mark{
    position:fixed;top:22px;left:24px;z-index:10;pointer-events:none;
    display:flex;align-items:flex-start;gap:12px;
  }
  .mark .seal{
    width:38px;height:38px;flex:0 0 auto;border-radius:5px;
    background:var(--shu);color:#f4f1ea;
    font-size:21px;line-height:38px;text-align:center;font-weight:700;
    box-shadow:0 4px 14px rgba(120,30,24,.35);letter-spacing:-1px;
  }
  .mark h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.16em;line-height:1.15}
  .mark p{margin:3px 0 0;font-size:12px;color:var(--stone);letter-spacing:.06em;font-family:system-ui,sans-serif}

  /* ---- control panel ---- */
  .panel{
    position:fixed;top:22px;right:22px;z-index:10;width:236px;max-width:calc(100vw - 44px);
    background:rgba(244,241,234,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:10px;padding:14px 14px 9px;
    font-family:system-ui,sans-serif;font-size:12px;color:var(--sumi);
    box-shadow:0 16px 44px rgba(30,24,18,.18);
  }
  .panel .ttl{display:flex;justify-content:space-between;align-items:baseline;
    font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--stone);margin:0 0 12px;font-weight:600}
  .panel .fps{font-variant-numeric:tabular-nums;color:var(--shu);letter-spacing:.04em}
  .row{margin:0 0 11px}
  .row label{display:flex;justify-content:space-between;margin:0 0 4px;color:var(--stone)}
  .row label b{color:var(--sumi);font-weight:600;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,#3a322a,#cfc7ba);outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--sumi);border:2px solid var(--washi);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:2px solid var(--washi);border-radius:50%;background:var(--sumi);cursor:pointer}
  .btns{display:flex;gap:8px;margin:13px 0 6px}
  .btns button{flex:1;cursor:pointer;font:inherit;font-size:11.5px;letter-spacing:.04em;color:var(--washi);
    background:var(--sumi);border:1px solid var(--sumi);border-radius:7px;padding:8px 0;transition:.15s}
  .btns button.ghost{color:var(--sumi);background:transparent}
  .btns button:hover{opacity:.85}
  .btns button:active{transform:translateY(1px)}
  .hint{position:fixed;bottom:18px;left:24px;z-index:10;pointer-events:none;
    font-family:system-ui,sans-serif;font-size:12px;color:var(--stone);letter-spacing:.02em;line-height:1.7}
  .hint b{color:var(--sumi);font-weight:600}
  .err{position:fixed;inset:0;display:none;place-items:center;padding:40px;text-align:center;
    font-family:system-ui,sans-serif;color:#3a322a;background:#e9e4da;z-index:50}
  .panel{transition:transform .3s ease,opacity .3s ease}
  #controlsToggle{
    position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));
    z-index:14;display:none;width:auto;min-width:100px;margin:0;padding:9px 14px;
    cursor:pointer;font:inherit;font-size:11.5px;letter-spacing:.04em;
    color:var(--sumi);background:rgba(244,241,234,.88);
    border:1px solid var(--line);border-radius:999px;
    box-shadow:0 8px 24px rgba(30,24,18,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  #controlsToggle.controls-toggle-open{
    bottom:calc(45vh + 22px + env(safe-area-inset-bottom));
  }
  @media (max-width:560px){
    #controlsToggle{display:block}
    .panel{top:auto;bottom:16px;right:14px;left:14px;width:auto;max-height:45vh;overflow-y:auto}
    .panel.controls-collapsed{transform:translateY(calc(100% + 24px + env(safe-area-inset-bottom)));opacity:0;pointer-events:none}
    .mark{top:16px;left:16px}.mark h1{font-size:22px}
    .hint{bottom:auto;top:64px;left:16px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="mark">
  <div class="seal">墨</div>
  <div>
    <h1>墨戯</h1>
    <p>SUMI · FLUID INK</p>
  </div>
</div>

<button id="controlsToggle" type="button" aria-controls="panel" aria-expanded="true">閉じる</button>

<div class="panel" id="panel">
  <p class="ttl"><span>Ink Controls</span><span class="fps" id="fps">— fps</span></p>
  <div class="row"><label>復元の速さ <b id="vHeal">—</b></label><input id="heal" type="range" min="0.005" max="0.08" step="0.001" value="0.022"></div>
  <div class="row"><label>かき混ぜの力 <b id="vStir">—</b></label><input id="stir" type="range" min="0.2" max="3" step="0.05" value="1.3"></div>
  <div class="row"><label>滲みの広がり <b id="vBleed">—</b></label><input id="bleed" type="range" min="0" max="3" step="0.05" value="1.2"></div>
  <div class="row"><label>墨の濃さ <b id="vInk">—</b></label><input id="ink" type="range" min="0.1" max="2.5" step="0.05" value="1.1"></div>
  <div class="row"><label>滴の大きさ <b id="vDrop">—</b></label><input id="drop" type="range" min="0.4" max="3" step="0.1" value="1.3"></div>
  <div class="row"><label>濡れた光沢 <b id="vGloss">—</b></label><input id="gloss" type="range" min="0" max="2" step="0.05" value="1.0"></div>
  <div class="row"><label>屈折・奥行き <b id="vRefr">—</b></label><input id="refr" type="range" min="0" max="2.5" step="0.05" value="1.1"></div>
  <div class="row"><label>圧力反復(質感) <b id="vIter">—</b></label><input id="iter" type="range" min="8" max="48" step="2" value="28"></div>
  <div class="btns">
    <button id="reset" class="ghost">原画に戻す</button>
    <button id="pour">墨を一滴</button>
  </div>
</div>

<div class="hint">
  動かす＝<b>かき混ぜる</b> ／ クリック＝<b>墨を垂らす</b> ／ ドラッグ＝<b>筆を沈めて描く</b><br>
  手を止めると、墨は紙へ滲み消え、絵は自ずと元へ。
</div>

<div class="err" id="err"></div>

<script>
"use strict";
/* =========================================================================
   墨戯 — Sumi Fluid Ink (WebGL2, GPU Stable Fluids)
   --------------------------------------------------------------------------
   静的な水墨画テクスチャは不変に保ち、ゼロへ緩和する2つのフィールド
   ── 歪み場(distortion: uvオフセット) と インク場(ink) ── だけを
   時間発展させる。両者が0に戻れば自動的に原画へ復帰する仕組み。
     - velocity : Stable Fluids (advect → divergence → Jacobi pressure → subtract)
     - distortion: 速度で移流し、ポインタで加算、毎フレーム減衰 → 原画へ復元
     - ink      : 速度で移流し、クリック/ドラッグで注入、拡散+減衰で消える
   表示は base(uv + distortion + 屈折) を描き、インク濃度の勾配から法線を
   作って濡れた墨の光沢・屈折・和紙質感・視差で奥行きを与える。
   ========================================================================= */

/* --------------------------- GL helpers -------------------------------- */
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)+'\n'+src);return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}
function uni(p){const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const in_=gl.getActiveUniform(p,i);u[in_.name.replace('[0]','')]=gl.getUniformLocation(p,in_.name);}return u;}

precision highp float;
out vec2 uv;
void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); uv=p; gl_Position=vec4(p*2.0-1.0,0.0,1.0); }`;

const HEAD = `#version 300 es
precision highp float;
in vec2 uv;
out vec4 outColor;`;

/* ---- advect any field by velocity (semi-Lagrangian) ---- */
const ADVECT_FS = HEAD + `
uniform sampler2D uVel;
uniform sampler2D uSrc;
uniform vec2 uTexel;     // 1/simRes
uniform float uDt;
uniform float uDissipate;
uniform float uVelScale; // sim units
void main(){
  vec2 v = texture(uVel, uv).xy * uVelScale;
  vec2 coord = uv - uDt * v * uTexel;
  outColor = texture(uSrc, coord) * uDissipate;
}`;

/* ---- divergence of velocity ---- */
const DIV_FS = HEAD + `
uniform sampler2D uVel;
uniform vec2 uTexel;
void main(){
  float l = texture(uVel, uv - vec2(uTexel.x,0)).x;
  float r = texture(uVel, uv + vec2(uTexel.x,0)).x;
  float b = texture(uVel, uv - vec2(0,uTexel.y)).y;
  float t = texture(uVel, uv + vec2(0,uTexel.y)).y;
  float div = 0.5*((r-l)+(t-b));
  outColor = vec4(div,0,0,1);
}`;

/* ---- Jacobi pressure iteration ---- */
const PRESS_FS = HEAD + `
uniform sampler2D uPressure;
uniform sampler2D uDiv;
uniform vec2 uTexel;
void main(){
  float l = texture(uPressure, uv - vec2(uTexel.x,0)).x;
  float r = texture(uPressure, uv + vec2(uTexel.x,0)).x;
  float b = texture(uPressure, uv - vec2(0,uTexel.y)).x;
  float t = texture(uPressure, uv + vec2(0,uTexel.y)).x;
  float d = texture(uDiv, uv).x;
  outColor = vec4((l+r+b+t - d)*0.25, 0,0,1);
}`;

/* ---- subtract pressure gradient (make velocity divergence-free) ---- */
const GRAD_FS = HEAD + `
uniform sampler2D uPressure;
uniform sampler2D uVel;
uniform vec2 uTexel;
void main(){
  float l = texture(uPressure, uv - vec2(uTexel.x,0)).x;
  float r = texture(uPressure, uv + vec2(uTexel.x,0)).x;
  float b = texture(uPressure, uv - vec2(0,uTexel.y)).x;
  float t = texture(uPressure, uv + vec2(0,uTexel.y)).x;
  vec2 v = texture(uVel, uv).xy;
  v -= 0.5*vec2(r-l, t-b);
  v = clamp(v, vec2(-0.45), vec2(0.45));   // keep advection stable (no teleporting)
  outColor = vec4(v,0,1);
}`;

/* ---- splat: inject velocity / distortion / ink along pointer ---- */
const SPLAT_VEL_FS = HEAD + `
uniform sampler2D uTarget;
uniform vec2 uPoint;     // 0..1
uniform vec2 uForce;     // velocity to add
uniform float uRadius;   // gaussian radius (uv)
uniform float uAspect;
void main(){
  vec2 d = uv - uPoint; d.x *= uAspect;
  float g = exp(-dot(d,d)/uRadius);
  vec2 base = texture(uTarget, uv).xy;
  outColor = vec4(base + uForce*g, 0.0, 1.0);
}`;

const SPLAT_DIST_FS = HEAD + `
uniform sampler2D uTarget;
uniform vec2 uPoint;
uniform vec2 uForce;     // distortion offset to add (uv units)
uniform float uRadius;
uniform float uAspect;
void main(){
  vec2 d = uv - uPoint; d.x *= uAspect;
  float g = exp(-dot(d,d)/uRadius);
  vec2 base = texture(uTarget, uv).xy;
  outColor = vec4(base + uForce*g, 0.0, 1.0);
}`;

const SPLAT_INK_FS = HEAD + `
uniform sampler2D uTarget;
uniform vec2 uPoint;
uniform float uAmount;
uniform float uRadius;
uniform float uAspect;
uniform float uSeed;
// value noise for ragged washi bleeding edge
float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec2 d = uv - uPoint; d.x *= uAspect;
  float rr = dot(d,d)/uRadius;
  // irregular edge: perturb the radius with noise -> ink soaks into the paper unevenly
  float n = vnoise(uv*64.0 + uSeed) + 0.5*vnoise(uv*128.0 - uSeed);
  float g = exp(-rr*(1.0 + 0.5*(n-0.75)));
  float base = texture(uTarget, uv).x;
  outColor = vec4(base + uAmount*g, 0.0, 0.0, 1.0);
}`;

/* ---- ink relax: slight diffusion + decay -> bleeds then fades to 0 ---- */
const INK_RELAX_FS = HEAD + `
uniform sampler2D uInk;
uniform vec2 uTexel;
uniform float uDecay;
uniform float uDiffuse;
void main(){
  float c = texture(uInk, uv).x;
  float l = texture(uInk, uv - vec2(uTexel.x,0)).x;
  float r = texture(uInk, uv + vec2(uTexel.x,0)).x;
  float b = texture(uInk, uv - vec2(0,uTexel.y)).x;
  float t = texture(uInk, uv + vec2(0,uTexel.y)).x;
  float lap = (l+r+b+t - 4.0*c);
  float v = c + uDiffuse*lap;
  v *= uDecay;
  outColor = vec4(max(v,0.0),0,0,1);
}`;

/* ---- distortion decay (relax to zero => returns to the original picture) ---- */
const DIST_RELAX_FS = HEAD + `
uniform sampler2D uDist;
uniform float uHeal;
void main(){
  vec2 dd = texture(uDist, uv).xy;
  outColor = vec4(dd*(1.0 - uHeal), 0.0, 1.0);
}`;

/* ---- final display: base image warped by distortion + ink, lit for depth ---- */
const DISPLAY_FS = HEAD + `
uniform sampler2D uImage;   // static sumi-e
uniform sampler2D uDist;    // distortion field (uv offset)
uniform sampler2D uInk;     // ink height/density
uniform vec2 uTexel;        // 1/dyeRes for gradients
uniform vec2 uImgFit;       // scale to fit image (cover) -> uv remap
uniform float uInkStrength;
uniform float uGloss;
uniform float uRefract;
uniform float uParallax;    // pointer-driven parallax amount
uniform vec2 uPointer;      // 0..1
uniform float uAspect;
uniform float uTime;

float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}

// map full-screen uv -> image uv with cover-fit and centering
vec2 fitUV(vec2 q){ return (q-0.5)*uImgFit + 0.5; }

void main(){
  // --- height field from ink (for normals / refraction) ---
  float hC = texture(uInk, uv).x;
  float hX = texture(uInk, uv+vec2(uTexel.x,0)).x - texture(uInk, uv-vec2(uTexel.x,0)).x;
  float hY = texture(uInk, uv+vec2(0,uTexel.y)).x - texture(uInk, uv-vec2(0,uTexel.y)).x;
  vec2 grad = vec2(hX,hY);

  // --- distortion (mixing) + refraction (depth via height gradient) ---
  vec2 dist = texture(uDist, uv).xy;
  vec2 par = (uPointer-0.5) * uParallax * (0.3 + hC); // subtle parallax, more where ink pools
  vec2 sampleUV = fitUV(uv + dist - grad*uRefract*0.06 + par*vec2(1.0,1.0));

  // --- base sumi-e (monochrome). White paper = 1, ink = dark ---
  bool outOfBounds = any(lessThan(sampleUV, vec2(0.0))) || any(greaterThan(sampleUV, vec2(1.0)));
  float img = outOfBounds ? 1.0 : texture(uImage, sampleUV).r;

  // added ink darkens the paper; pooled ink darkest (washi tamari)
  float inkDark = 1.0 - exp(-hC*2.4*uInkStrength);
  inkDark = clamp(inkDark, 0.0, 1.0);
  float lum = img * (1.0 - inkDark);

  // base ink color: warm-ish charcoal, not pure black
  vec3 paper = vec3(0.96,0.945,0.91);
  vec3 ink   = vec3(0.07,0.065,0.06);
  vec3 col = mix(ink, paper, lum);

  // --- washi paper grain ---
  float grain = vnoise(uv*vec2(uAspect,1.0)*420.0)*0.06 + vnoise(uv*900.0)*0.03;
  col *= (0.97 + grain*0.6);

  // --- wet-ink lighting: normal from height, Blinn-Phong specular ---
  vec3 N = normalize(vec3(-grad*60.0, 1.0));
  vec3 L = normalize(vec3(-0.4, -0.6, 0.8));
  vec3 V = vec3(0.0,0.0,1.0);
  vec3 Hh = normalize(L+V);
  float spec = pow(max(dot(N,Hh),0.0), 48.0);
  float wet = smoothstep(0.02, 0.5, hC);     // only wet where ink is present
  col += vec3(0.9,0.92,0.95) * spec * wet * uGloss * 1.2;
  // soft diffuse shading on ink ridges -> body/relief
  float diff = clamp(dot(N,L)*0.5+0.5,0.0,1.0);
  col *= mix(1.0, 0.82+0.36*diff, wet*0.8);

  // --- vignette for gentle depth ---
  vec2 q = uv-0.5; float vig = smoothstep(0.95,0.35,length(q*vec2(1.0,1.05)));
  col *= mix(0.9,1.0,vig);

  outColor = vec4(col,1.0);
}`;

/* ----------------------- programs -------------------------------------- */
const pAdv  = prog(VS,ADVECT_FS),   uAdv  = uni(pAdv);
const pDiv  = prog(VS,DIV_FS),      uDiv  = uni(pDiv);
const pPress= prog(VS,PRESS_FS),    uPress= uni(pPress);
const pGrad = prog(VS,GRAD_FS),     uGrad = uni(pGrad);
const pSV   = prog(VS,SPLAT_VEL_FS),uSV   = uni(pSV);
const pSD   = prog(VS,SPLAT_DIST_FS),uSD  = uni(pSD);
const pSI   = prog(VS,SPLAT_INK_FS),uSI   = uni(pSI);
const pInk  = prog(VS,INK_RELAX_FS),uInk  = uni(pInk);
const pHeal = prog(VS,DIST_RELAX_FS),uHealU=uni(pHeal);
const pDisp = prog(VS,DISPLAY_FS),  uDisp = uni(pDisp);

const vao = gl.createVertexArray();
function drawQuad(){ gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES,0,3); }

/* ----------------------- FBO / textures -------------------------------- */
const SIM = 256;   // velocity / pressure / divergence
const DYE = 512;   // ink / distortion (sharper)

function makeRT(res, comps){
  // half-float, filterable + renderable in WebGL2
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,res,res,0,gl.RGBA,gl.HALF_FLOAT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  return {tex,fb,res};
}
function makeDouble(res){ return {a:makeRT(res),b:makeRT(res),
  swap(){const t=this.a;this.a=this.b;this.b=t;}}; }

let velocity = makeDouble(SIM);
let pressure = makeDouble(SIM);
let divergence = makeRT(SIM);
let distortion = makeDouble(DYE);
let ink = makeDouble(DYE);

function bindRT(rt){ gl.bindFramebuffer(gl.FRAMEBUFFER,rt.fb); gl.viewport(0,0,rt.res,rt.res); }

/* ----------------------- base image ------------------------------------ */
let imgTex=null, imgReady=false, imgAspect=1;
const imageEl=new Image();
imageEl.onload=()=>{
  imgAspect = imageEl.naturalWidth/imageEl.naturalHeight;
  imgTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,imgTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB8,gl.RGB,gl.UNSIGNED_BYTE,imageEl);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  imgReady=true;
};
imageEl.onerror=()=>fail('画像の読み込みに失敗しました。');
imageEl.src=IMG_SRC;

/* ----------------------- params / UI ----------------------------------- */
const P={heal:0.022, stir:1.3, bleed:1.2, ink:1.1, drop:1.3, gloss:1.0, refr:1.1, iter:28};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduceMotion){ P.stir*=0.5; P.bleed*=0.6; }

function bind(id,key,fmt){const el=document.getElementById(id);const out=document.getElementById('v'+id.charAt(0).toUpperCase()+id.slice(1));
  const u=()=>{P[key]=parseFloat(el.value);if(out)out.textContent=fmt?fmt(P[key]):P[key];};el.addEventListener('input',u);u();}
bind('heal','heal',v=>v.toFixed(3));
bind('stir','stir',v=>v.toFixed(2));
bind('bleed','bleed',v=>v.toFixed(2));
bind('ink','ink',v=>v.toFixed(2));
bind('drop','drop',v=>v.toFixed(1));
bind('gloss','gloss',v=>v.toFixed(2));
bind('refr','refr',v=>v.toFixed(2));
bind('iter','iter',v=>v.toFixed(0));

function clearField(rt){ bindRT(rt); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); }
function resetAll(){ [velocity.a,velocity.b,pressure.a,pressure.b,divergence,distortion.a,distortion.b,ink.a,ink.b].forEach(clearField); }
document.getElementById('reset').addEventListener('click',resetAll);

/* ---- mobile controls toggle ---- */
const controlsPanel=document.getElementById('panel');
const controlsToggle=document.getElementById('controlsToggle');
const mobileQ=window.matchMedia('(max-width:560px)');
let controlsOpen=!mobileQ.matches;
function syncPanel(){
  controlsPanel.classList.toggle('controls-collapsed',!controlsOpen);
  controlsToggle.classList.toggle('controls-toggle-open',controlsOpen);
  controlsToggle.setAttribute('aria-expanded',String(controlsOpen));
  controlsToggle.textContent=controlsOpen?'閉じる':'Controls';
}
controlsToggle.addEventListener('click',()=>{controlsOpen=!controlsOpen;syncPanel();});
mobileQ.addEventListener('change',ev=>{controlsOpen=!ev.matches;syncPanel();});
syncPanel();

/* ----------------------- pointer input --------------------------------- */
const pointer={x:0.5,y:0.5,px:0.5,py:0.5,down:false,moved:false,active:false};
function pos(e){ const r=cv.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const cy=(e.touches?e.touches[0].clientY:e.clientY);
  return {x:(cx-r.left)/r.width, y:1.0-(cy-r.top)/r.height}; }

const splatQueue=[];  // ink drops {x,y,amount,radius}
function dropAt(x,y,mult){ splatQueue.push({x,y,amount:0.9*P.ink*mult, radius:0.0009*P.drop*mult}); }

function onDown(e){ const p=pos(e); pointer.x=pointer.px=p.x; pointer.y=pointer.py=p.y;
  pointer.down=true; pointer.active=true; dropAt(p.x,p.y,1.0); }
function onMove(e){ const p=pos(e); pointer.px=pointer.x; pointer.py=pointer.y;
  pointer.x=p.x; pointer.y=p.y; pointer.moved=true; pointer.active=true; }
function onUp(){ pointer.down=false; }

cv.addEventListener('mousedown',onDown);
cv.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
cv.addEventListener('mouseleave',()=>{pointer.active=false;});
cv.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();onUp();},{passive:false});
document.getElementById('pour').addEventListener('click',()=>dropAt(0.5,0.5,1.4));

/* ----------------------- resize ---------------------------------------- */
function resize(){const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.floor(innerWidth*dpr);cv.height=Math.floor(innerHeight*dpr);
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
addEventListener('resize',resize);resize();

/* ----------------------- simulation passes ----------------------------- */
const simTexel=[1/SIM,1/SIM], dyeTexel=[1/DYE,1/DYE];

function advect(target, srcTex, dissip, velScale){
  bindRT(target);
  gl.useProgram(pAdv);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,velocity.a.tex); gl.uniform1i(uAdv.uVel,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,srcTex); gl.uniform1i(uAdv.uSrc,1);
  gl.uniform2f(uAdv.uTexel, target.res===SIM?simTexel[0]:dyeTexel[0], target.res===SIM?simTexel[1]:dyeTexel[1]);
  gl.uniform1f(uAdv.uDt, 1.0);
  gl.uniform1f(uAdv.uDissipate, dissip);
  gl.uniform1f(uAdv.uVelScale, velScale);
  drawQuad();
}

let lastT=performance.now(), frames=0, fpsT=performance.now();
const fpsEl=document.getElementById('fps');

function step(){
  const aspect = cv.width/cv.height;

  /* ---- velocity self-advection ---- */
  advect(velocity.b, velocity.a.tex, 0.992, SIM);
  velocity.swap();

  /* ---- pointer-driven splats into velocity + distortion + ink ---- */
  const dx=(pointer.x-pointer.px), dy=(pointer.y-pointer.py);
  const speed=Math.hypot(dx,dy);
  if(pointer.active && (pointer.moved || pointer.down)){
    // velocity injection (stir) — forces are in uv/frame units (advection-matched)
    const fScale = 2.4 * P.stir;
    bindRT(velocity.b);
    gl.useProgram(pSV);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,velocity.a.tex);gl.uniform1i(uSV.uTarget,0);
    gl.uniform2f(uSV.uPoint,pointer.x,pointer.y);
    gl.uniform2f(uSV.uForce,dx*fScale,dy*fScale);
    gl.uniform1f(uSV.uRadius,0.0016);
    gl.uniform1f(uSV.uAspect,aspect);
    drawQuad(); velocity.swap();

    // distortion injection (the picture itself smears as you mix)
    const dScale = 0.09 * P.bleed;
    bindRT(distortion.b);
    gl.useProgram(pSD);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,distortion.a.tex);gl.uniform1i(uSD.uTarget,0);
    gl.uniform2f(uSD.uPoint,pointer.x,pointer.y);
    gl.uniform2f(uSD.uForce,dx*dScale,dy*dScale);
    gl.uniform1f(uSD.uRadius,0.004);
    gl.uniform1f(uSD.uAspect,aspect);
    drawQuad(); distortion.swap();

    // dragging (pressed) lays ink continuously; visible floor so a slow brush still marks
    if(pointer.down){
      const amt = Math.min(0.35 + speed*9.0, 1.1) * P.ink;
      splatQueue.push({x:pointer.x,y:pointer.y,amount:amt,radius:0.0014*P.drop});
    }
    pointer.moved=false;
  }

  /* ---- flush queued ink drops ---- */
  if(splatQueue.length){
    gl.useProgram(pSI);
    for(const s of splatQueue){
      bindRT(ink.b);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ink.a.tex);gl.uniform1i(uSI.uTarget,0);
      gl.uniform2f(uSI.uPoint,s.x,s.y);
      gl.uniform1f(uSI.uAmount,s.amount);
      gl.uniform1f(uSI.uRadius,s.radius);
      gl.uniform1f(uSI.uAspect,aspect);
      gl.uniform1f(uSI.uSeed, Math.random()*1000.0);
      drawQuad(); ink.swap();
      // a drop also pushes the water (gentle ripple) on impact
      bindRT(velocity.b);
      gl.useProgram(pSV);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,velocity.a.tex);gl.uniform1i(uSV.uTarget,0);
      gl.uniform2f(uSV.uPoint,s.x,s.y);
      gl.uniform2f(uSV.uForce, (Math.random()-0.5)*0.12, -0.16); // soft splash down
      gl.uniform1f(uSV.uRadius, Math.max(s.radius*3.0,0.003));
      gl.uniform1f(uSV.uAspect,aspect);
      drawQuad(); velocity.swap();
      gl.useProgram(pSI);
    }
    splatQueue.length=0;
  }

  /* ---- pressure projection: divergence -> Jacobi -> subtract ---- */
  bindRT(divergence);
  gl.useProgram(pDiv);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,velocity.a.tex);gl.uniform1i(uDiv.uVel,0);
  gl.uniform2f(uDiv.uTexel,simTexel[0],simTexel[1]);
  drawQuad();

  clearField(pressure.a);
  const iters=P.iter|0;
  gl.useProgram(pPress);
  for(let i=0;i<iters;i++){
    bindRT(pressure.b);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,pressure.a.tex);gl.uniform1i(uPress.uPressure,0);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,divergence.tex);gl.uniform1i(uPress.uDiv,1);
    gl.uniform2f(uPress.uTexel,simTexel[0],simTexel[1]);
    drawQuad(); pressure.swap();
  }
  bindRT(velocity.b);
  gl.useProgram(pGrad);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,pressure.a.tex);gl.uniform1i(uGrad.uPressure,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,velocity.a.tex);gl.uniform1i(uGrad.uVel,1);
  gl.uniform2f(uGrad.uTexel,simTexel[0],simTexel[1]);
  drawQuad(); velocity.swap();

  /* ---- advect distortion & ink by the velocity field ---- */
  advect(distortion.b, distortion.a.tex, 0.999, SIM); distortion.swap();
  advect(ink.b, ink.a.tex, 0.997, SIM); ink.swap();

  /* ---- relax: distortion -> 0 (heal to original), ink diffuse + decay ---- */
  bindRT(distortion.b);
  gl.useProgram(pHeal);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,distortion.a.tex);gl.uniform1i(uHealU.uDist,0);
  gl.uniform1f(uHealU.uHeal,P.heal);
  drawQuad(); distortion.swap();

  bindRT(ink.b);
  gl.useProgram(pInk);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ink.a.tex);gl.uniform1i(uInk.uInk,0);
  gl.uniform2f(uInk.uTexel,dyeTexel[0],dyeTexel[1]);
  gl.uniform1f(uInk.uDecay, 0.992);
  gl.uniform1f(uInk.uDiffuse, 0.08*P.bleed + 0.03);
  drawQuad(); ink.swap();
}

/* ----------------------- display --------------------------------------- */
function display(){
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,cv.width,cv.height);
  const aspect=cv.width/cv.height;
  // cover-fit the square-ish image into the viewport
  let fitX=1,fitY=1;
  const ia=imgAspect, va=aspect;
  if(va>ia){ fitY = ia/va; } else { fitX = va/ia; }
  // uImgFit maps screen-uv deviation to image-uv (cover) — invert: smaller fit => zoom
  const fit=[ (va>ia? va/ia : 1.0), (va>ia? 1.0 : ia/va) ];
  // Use simple cover: scale the shorter axis
  const sx = (va>ia)? (va/ia) : 1.0;
  const sy = (va>ia)? 1.0 : (ia/va);

  gl.useProgram(pDisp);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,imgTex);gl.uniform1i(uDisp.uImage,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,distortion.a.tex);gl.uniform1i(uDisp.uDist,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,ink.a.tex);gl.uniform1i(uDisp.uInk,2);
  gl.uniform2f(uDisp.uTexel,dyeTexel[0],dyeTexel[1]);
  gl.uniform2f(uDisp.uImgFit, sx, sy);
  gl.uniform1f(uDisp.uInkStrength,1.0);
  gl.uniform1f(uDisp.uGloss,P.gloss);
  gl.uniform1f(uDisp.uRefract,P.refr);
  gl.uniform1f(uDisp.uParallax, 0.02);
  gl.uniform2f(uDisp.uPointer, pointer.x, pointer.y);
  gl.uniform1f(uDisp.uAspect, aspect);
  gl.uniform1f(uDisp.uTime, performance.now()*0.001);
  drawQuad();
}

/* ----------------------- main loop ------------------------------------- */
function loop(now){
  if(imgReady){ step(); display(); }
  frames++;
  if(now-fpsT>500){ fpsEl.textContent=(frames*1000/(now-fpsT)).toFixed(0)+' fps'; frames=0; fpsT=now; }
  requestAnimationFrame(loop);
}
resetAll();
requestAnimationFrame(loop);
</script>
