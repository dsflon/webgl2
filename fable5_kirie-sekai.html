              const y = Math.min(t.height - 1, Math.max(0, Math.round(v * t.height)));
              gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
              const type = gl.getParameter(gl.IMPLEMENTATION_COLOR_READ_TYPE);
              let out;
              if (type === gl.FLOAT) {
                const b = new Float32Array(4);
                gl.readPixels(x, y, 1, 1, gl.RGBA, gl.FLOAT, b);
                out = Array.from(b);
              } else if (type === gl.HALF_FLOAT) {
                const b = new Uint16Array(4);
                gl.readPixels(x, y, 1, 1, gl.RGBA, gl.HALF_FLOAT, b);
                out = Array.from(b, (h) => {
                  const s = h >> 15 ? -1 : 1;
                  const e = (h >> 10) & 0x1f;
                  const m = h & 0x3ff;
                  if (e === 0) return s * m * 2 ** -24;
                  if (e === 31) return m ? NaN : s * Infinity;
                  return s * (1 + m / 1024) * 2 ** (e - 15);
                });
              } else {
                const b = new Uint8Array(4);
                gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
                out = Array.from(b, (q) => q / 255);
              }
              gl.bindFramebuffer(gl.FRAMEBUFFER, null);
              return out;
            };
            const luma = (c) => 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
            const sc = read(structPing ? targets.structB : targets.structA);
            const bm = read(targets.bandM);
            const bt = read(targets.bandT);
            return {
              fine: sc[3], bmFine: bm[3], btFine: bt[3],
              Lmed: luma(bm), Lheavy: luma(bt), dark: TH.dark,
            };
          };
          window.__thDbg = {
            th: Array.from(TH.th.slice(0, Math.max(n - 1, 0))),
            n, dark: TH.dark, inv,
          };
        }

        /* ------------------------------------------------------------------
           Render core + loop + prewarm
        ------------------------------------------------------------------ */

        let stream = null;
        let cameraReady = false;
        let animTime = 0;
        let lastNow = performance.now();
        let fpsLast = performance.now();
        let fpsFrames = 0;
        let structPing = false;
        let readyStamped = false;

        const readout = document.getElementById("readout");

        function uploadVideoFrame() {
          if (
            cameraReady &&
            video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
            video.videoWidth > 0 && video.videoHeight > 0
          ) {
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
            return true;
          }
          return false;
        }

        // One full pipeline step. dt is unused by the passes themselves
        // (the fake scene reads animTime), emaDt drives every EMA (fixed
        // during prewarm so the warmed state is deterministic and
        // framerate-independent).
        function renderCore(emaDt, drawFinal, haveVideo) {
          const doReset = needsReset;
          needsReset = false;
          if (doReset) clearSimTargets();

          const aspect = canvas.width / Math.max(canvas.height, 1);
          const structCur = structPing ? targets.structA : targets.structB;
          const structPrev = structPing ? targets.structB : targets.structA;
          const aStruct = 1 - Math.exp(-emaDt * (20 - 13 * state.calm));

          // P0 — scene
          renderPass(targets.scene, programs.scene, () => {
            const u = locations.scene;
            bindTexture(0, videoTexture);
            gl.uniform1i(u.uVideo, 0);
            gl.uniform2f(u.uResolution, paintW, paintH);
            gl.uniform2f(u.uVideoSize,
              Math.max(1, video.videoWidth), Math.max(1, video.videoHeight));
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uAnim, animTime);
            gl.uniform1i(u.uMirror, state.mirror ? 1 : 0);
            gl.uniform1i(u.uFake, FAKE ? 1 : 0);
            gl.uniform1i(u.uHasVideo, haveVideo ? 1 : 0);
          });

          // P1 — kuwahara + EMA (ping-pong)
          renderPass(structCur, programs.struct, () => {
            const u = locations.struct;
            bindTexture(0, targets.scene.tex);
            bindTexture(1, structPrev.tex);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uPrev, 1);
            gl.uniform2f(u.uTexel, 1 / structW, 1 / structH);
            gl.uniform1f(u.uAlpha, aStruct);
            gl.uniform1f(u.uRadius, 3.0 + 2.4 * state.smooth);
            gl.uniform1i(u.uReset, doReset ? 1 : 0);
          });

          // P1b — two-stage isotropic low-pass: medium (subdivision field +
          // chroma) then heavy (the quantization field). The scissor
          // roundness knob drives both sigmas.
          blurPass(structCur, targets.bandTmp, targets.bandM,
            1.0 + 1.6 * state.smooth);
          blurPass(targets.bandM, targets.bandTmp, targets.bandT,
            2.0 + 4.5 * state.smooth);

          // P2 — stats source (read back on a slow CPU cadence)
          renderPass(targets.stats, programs.stats, () => {
            const u = locations.stats;
            bindTexture(0, targets.bandT.tex);
            bindTexture(1, structCur.tex);
            gl.uniform1i(u.uBand, 0);
            gl.uniform1i(u.uStruct, 1);
          });

          if (drawFinal) {
            // P3 — composite → canvas
            renderPass(null, programs.composite, () => {
              const u = locations.composite;
              bindTexture(0, structCur.tex);
              bindTexture(1, targets.bandT.tex);
              bindTexture(2, targets.bandM.tex);
              gl.uniform1i(u.uStruct, 0);
              gl.uniform1i(u.uBand, 1);
              gl.uniform1i(u.uBandM, 2);
              gl.uniform2f(u.uResolution, canvas.width, canvas.height);
              gl.uniform1f(u.uAspect, aspect);
              gl.uniform1f(u.uRelief, state.relief);
              gl.uniform1f(u.uPalette, state.palette);
              gl.uniform1f(u.uDetail, state.detail);
              gl.uniform1f(u.uGrain, state.grain);
              gl.uniform1i(u.uPreset, state.preset);
              gl.uniform1i(u.uInvert, presetInvert());
              gl.uniform1i(u.uDebug, state.debugView);
              gl.uniform1fv(u["uTh[0]"], TH.th);
              gl.uniform1i(u.uN, TH.n);
              gl.uniform1f(u.uDark, TH.dark);
              gl.uniform2fv(u["uAB[0]"], TH.ab);
            });
          }

          structPing = !structPing;
        }

        // ?prewarm=<sec>: deterministic fast-forward BEFORE the first
        // presented frame. Two phases (both fixed-step, so the result is a
        // pure function of the prewarm value): (A) up to 3 simulated seconds
        // of full pipeline steps at dt=1/20 — the GPU EMA converges in
        // ~1-2 s; (B) the remaining simulated time in 1.5 s chunks of one
        // pipeline step + one CPU quantile update each — the threshold EMA
        // (τ up to ~2.5 s) converges without paying for full GPU steps
        // (swiftshader budget, CRAFT §C4). Async-chunked so the page load
        // event is never blocked; true glSync per chunk. Under ?freeze=1
        // the scene stays pinned while every EMA converges onto it.
        async function runPrewarm() {
          const PDT = 1 / 20;
          const stepsA = Math.round(Math.min(PREWARM, 3) / PDT);
          for (let i = 0; i < stepsA; i++) {
            if (!FREEZE && !state.pauseAnim) animTime += PDT;
            renderCore(PDT, false, false);
            if (i % 4 === 3) updateThresholds(4 * PDT);
            if (i % 10 === 9) {
              glSync();
              await new Promise((resolve) => setTimeout(resolve, 0));
            }
          }
          let remain = PREWARM - Math.min(PREWARM, 3);
          while (remain > 1e-3) {
            const chunk = Math.min(1.5, remain);
            if (!FREEZE && !state.pauseAnim) animTime += chunk;
            renderCore(PDT, false, false);
            updateThresholds(chunk);
            remain -= chunk;
            glSync();
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
          updateThresholds(4 * PDT);
          glSync();
        }

        function updateChip() {
          statusChip.textContent = FAKE
            ? "入力 · 合成 (fakesource=1)"
            : (cameraReady ? "入力 · カメラ" : "カメラ待機中");
          statusChip.classList.toggle(
            "hidden", performance.now() - bootWall > 4000 && (FAKE || cameraReady));
        }

        function frame(now) {
          resize();

          const rawDt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
          lastNow = now;
          const dt = FREEZE ? 0 : rawDt;
          if (!state.pauseAnim) animTime += dt;

          const haveVideo = FAKE ? false : uploadVideoFrame();
          const hasInput = FAKE || haveVideo;

          renderCore(dt, true, haveVideo);

          // low-cadence quantile refresh (never per frame, repo rule §8-13)
          if (now - lastStatWall > 200) {
            updateThresholds(Math.min(1, (now - lastStatWall) / 1000));
            lastStatWall = now;
          }

          if (!readyStamped && hasInput) {
            glSync();   // the first real frame actually finished (CRAFT §C4)
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            readout.textContent = `FPS ${fps.toFixed(0)} / 解像度 ${canvas.width}×${
              canvas.height} / 紙 ${TH.n}枚 · しきい値更新 ~200ms毎`;
            updateChip();
          }

          requestAnimationFrame(frame);
        }

        /* ------------------------------------------------------------------
           Camera + boot. Under ?fakesource=1 the synthetic scene drives the
           whole pipeline (the video texture is never sampled); the camera
           request still runs so the three error paths stay observable.
        ------------------------------------------------------------------ */

        async function startCamera() {
          stopCamera();
          cameraReady = false;
          retryCamera.disabled = true;
          setOverlay("requesting", "REQUESTING CAMERA",
            "Please allow webcam access. If this is not localhost or HTTPS, the camera API will be blocked.");

          if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost" &&
            location.hostname !== "127.0.0.1" &&
            location.hostname !== "[::1]"
          ) {
            setOverlay("error", "SECURE CONTEXT REQUIRED",
              "Serve the file from localhost (for example: python3 -m http.server 8888) or HTTPS, then reload.");
            retryCamera.disabled = false;
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setOverlay("error", "CAMERA API UNAVAILABLE",
              "This browser does not expose getUserMedia. Try a modern browser over localhost or HTTPS.");
            retryCamera.disabled = false;
            return;
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: state.facingMode,
                width: { ideal: 1280 }, height: { ideal: 720 },
              },
              audio: false,
            });
            video.srcObject = stream;
            await video.play();
            cameraReady = true;
            retryCamera.disabled = false;
            needsReset = true;
            setOverlay("hidden", "", "");
          } catch (error) {
            retryCamera.disabled = false;
            const name = error && error.name ? error.name : "";
            if (name === "NotAllowedError" || name === "SecurityError") {
              setOverlay("error", "PERMISSION DENIED",
                "Camera access was denied. Enable camera permission for this site, then retry.",
                { retryCamera: true });
            } else if (name === "NotFoundError" || name === "OverconstrainedError") {
              setOverlay("error", "NO CAMERA FOUND",
                "No usable webcam was found. Connect a camera or release it from another app, then retry.",
                { retryCamera: true });
            } else {
              setOverlay("error", "CAMERA ERROR",
                `${name || "Unknown error"}. Check browser permissions and retry.`,
                { retryCamera: true });
            }
          }
        }

        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        retryCamera.addEventListener("click", () => { startCamera(); });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });
        window.addEventListener("beforeunload", stopCamera);

        const bootWall = performance.now();

        try {
          resize();
          // startCamera() runs in every mode. Under ?fakesource=1 the
          // synthetic scene drives the whole pipeline regardless of the
          // camera (the video texture is never sampled), so the camera is
          // only exercised to keep the three error overlays observable.
          startCamera();
          if (PREWARM > 0) {
            runPrewarm().then(() => requestAnimationFrame(frame));
          } else {
            requestAnimationFrame(frame);
          }
        } catch (error) {
          setOverlay("error", "WEBGL SETUP ERROR",
            error && error.message ? error.message : "Could not initialize the renderer.");
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
