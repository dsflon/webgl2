for(let gy=0;gy<GRID_H;gy++){for(let gx=0;gx<GRID_W;gx++){let mv=0.0;if(mask){const sx=Math.min(mw-1,(((GRID_W-1-gx+0.5)/GRID_W)*mw)|0);const sy=Math.min(mh-1,(((gy+0.5)/GRID_H)*mh)|0);mv=mask[sy*mw+sx];}const gi=gy*GRID_W+gx;maskSmooth[gi]+=(mv-maskSmooth[gi])*0.35;const di=gi*4,si=gi*4;let r=img[si],g=img[si+1],b=img[si+2];const avg=(r+g+b)/3;const SAT=1.15;r=Math.min(255,Math.max(0,avg+(r-avg)*SAT));g=Math.min(255,Math.max(0,avg+(g-avg)*SAT));b=Math.min(255,Math.max(0,avg+(b-avg)*SAT));personPix[di]=r;personPix[di+1]=g;personPix[di+2]=b;personPix[di+3]=maskSmooth[gi]>0.45?255:Math.floor(maskSmooth[gi]*255);}}
gl.bindTexture(gl.TEXTURE_2D,personTex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,GRID_W,GRID_H,gl.RGBA,gl.UNSIGNED_BYTE,personPix);
gl.bindTexture(gl.TEXTURE_2D,videoTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);}
function simStep(dt,totalTime){const tx=1/SIM,ty=1/SIM;
useFBO(vel.write);gl.useProgram(progAdvect);bindFBOTex(0,vel.read);gl.uniform1i(progAdvect.u.u_vel,0);bindFBOTex(1,vel.read);gl.uniform1i(progAdvect.u.u_src,1);gl.uniform1f(progAdvect.u.u_dt,dt);gl.uniform1f(progAdvect.u.u_dissipation,0.993);drawQuad();vel.swap();
useFBO(vel.write);gl.useProgram(progInjectVel);bindFBOTex(0,vel.read);gl.uniform1i(progInjectVel.u.u_vel,0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,personTex);gl.uniform1i(progInjectVel.u.u_person,1);gl.uniform1f(progInjectVel.u.u_time,totalTime);gl.uniform1f(progInjectVel.u.u_screenAR,innerWidth/innerHeight);gl.uniform1f(progInjectVel.u.u_camAR,vAspect);gl.uniform2f(progInjectVel.u.u_personTexel,1.0/GRID_W,1.0/GRID_H);drawQuad();vel.swap();
if(Math.abs(M.dx)>0.0001||Math.abs(M.dy)>0.0001){useFBO(vel.write);gl.useProgram(progSplat);bindFBOTex(0,vel.read);gl.uniform1i(progSplat.u.u_base,0);gl.uniform2f(progSplat.u.u_point,M.x,M.y);gl.uniform3f(progSplat.u.u_color,M.dx*5.0,M.dy*5.0,0.0);gl.uniform1f(progSplat.u.u_r,0.0018);drawQuad();vel.swap();M.dx=0;M.dy=0;}
useFBO(dye.write);gl.useProgram(progAdvect);bindFBOTex(0,vel.read);gl.uniform1i(progAdvect.u.u_vel,0);bindFBOTex(1,dye.read);gl.uniform1i(progAdvect.u.u_src,1);gl.uniform1f(progAdvect.u.u_dt,dt);gl.uniform1f(progAdvect.u.u_dissipation,0.983);drawQuad();dye.swap();
useFBO(dye.write);gl.useProgram(progInjectDye);bindFBOTex(0,dye.read);gl.uniform1i(progInjectDye.u.u_dye,0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,personTex);gl.uniform1i(progInjectDye.u.u_person,1);gl.uniform1f(progInjectDye.u.u_screenAR,innerWidth/innerHeight);gl.uniform1f(progInjectDye.u.u_camAR,vAspect);gl.uniform2f(progInjectDye.u.u_personTexel,1.0/GRID_W,1.0/GRID_H);drawQuad();dye.swap();
useFBO(divFBO);gl.useProgram(progDiv);bindFBOTex(0,vel.read);gl.uniform1i(progDiv.u.u_vel,0);gl.uniform2f(progDiv.u.u_texel,tx,ty);drawQuad();
useFBO(pres.read);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
for(let i=0;i<25;i++){useFBO(pres.write);gl.useProgram(progPres);bindFBOTex(0,pres.read);gl.uniform1i(progPres.u.u_pres,0);bindFBOTex(1,divFBO);gl.uniform1i(progPres.u.u_div,1);gl.uniform2f(progPres.u.u_texel,tx,ty);drawQuad();pres.swap();}
useFBO(vel.write);gl.useProgram(progGrad);bindFBOTex(0,vel.read);gl.uniform1i(progGrad.u.u_vel,0);bindFBOTex(1,pres.read);gl.uniform1i(progGrad.u.u_pres,1);gl.uniform2f(progGrad.u.u_texel,tx,ty);drawQuad();vel.swap();
useFBO(vel.write);gl.useProgram(progBoundary);bindFBOTex(0,vel.read);gl.uniform1i(progBoundary.u.u_vel,0);gl.uniform2f(progBoundary.u.u_texel,tx,ty);drawQuad();vel.swap();}
function render(){gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.clearColor(0.0,0.0,0.0,1.0);gl.clear(gl.COLOR_BUFFER_BIT);
gl.disable(gl.BLEND);gl.useProgram(progBackground);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,videoTex);gl.uniform1i(progBackground.u.u_video,0);bindFBOTex(1,vel.read);gl.uniform1i(progBackground.u.u_vel,1);gl.uniform2f(progBackground.u.u_videoTexel,1.0/video.videoWidth,1.0/video.videoHeight);gl.uniform1f(progBackground.u.u_screenAR,innerWidth/innerHeight);gl.uniform1f(progBackground.u.u_camAR,vAspect);drawQuad();
gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.useProgram(progDisplay);bindFBOTex(0,dye.read);gl.uniform1i(progDisplay.u.u_dye,0);bindFBOTex(1,vel.read);gl.uniform1i(progDisplay.u.u_vel,1);gl.uniform1f(progDisplay.u.u_dpr,dpr);drawQuad();
gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.useProgram(progManga);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,videoTex);gl.uniform1i(progManga.u.u_video,0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,personTex);gl.uniform1i(progManga.u.u_person,1);gl.uniform2f(progManga.u.u_videoTexel,1.0/video.videoWidth,1.0/video.videoHeight);gl.uniform1f(progManga.u.u_screenAR,innerWidth/innerHeight);gl.uniform1f(progManga.u.u_camAR,vAspect);gl.uniform1f(progManga.u.u_range,0.72);drawQuad();
gl.disable(gl.BLEND);}
let last=performance.now(),totalTime=0;
function frame(now){const dt=Math.min((now-last)/1000,0.05);last=now;totalTime+=dt;if(video.currentTime!==lastVideoT){updatePerson(now);lastVideoT=video.currentTime;}simStep(dt,totalTime);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);}
