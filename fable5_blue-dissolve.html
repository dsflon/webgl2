          // P40 — composite to screen
          renderPass(null, programs.composite, () => {
            const u = locations.composite;
            bindTexture(0, sceneCur.tex);
            bindTexture(1, fieldOut.tex);
            bindTexture(2, targets.softT.tex);
            bindTexture(3, denOut.tex);
            bindTexture(4, targets.velA.tex);
            bindTexture(5, bgOut.tex);
            bindTexture(6, fbOut.tex);
            bindTexture(7, targets.b1.tex);
            bindTexture(8, targets.b2.tex);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uField, 1);
            gl.uniform1i(u.uSoft, 2);
            gl.uniform1i(u.uDen, 3);
            gl.uniform1i(u.uVel, 4);
            gl.uniform1i(u.uBg, 5);
            gl.uniform1i(u.uFb, 6);
            gl.uniform1i(u.uB1, 7);
            gl.uniform1i(u.uB2, 8);
            gl.uniform2f(u.uResolution, canvas.width, canvas.height);
            gl.uniform2f(u.uSoftTexel, fieldTexel[0], fieldTexel[1]);
            gl.uniform1f(u.uGrade, state.grade);
            gl.uniform1f(u.uRim, state.rimLight);
            gl.uniform1f(u.uGlow, state.glow);
            gl.uniform1f(u.uGrain, state.grain);
            gl.uniform1f(u.uBody, state.body);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform3fv(u.uRimL, hexToRgb(preset.rimL));
            gl.uniform3fv(u.uRimR, hexToRgb(preset.rimR));
            gl.uniform3fv(u.uToneS, hexToRgb(preset.toneShadow));
            gl.uniform3fv(u.uToneM, hexToRgb(preset.toneMid));
            gl.uniform3fv(u.uToneH, hexToRgb(preset.toneHigh));
            gl.uniform3fv(u.uBokA, hexToRgb(preset.bokehA));
            gl.uniform3fv(u.uBokB, hexToRgb(preset.bokehB));
            gl.uniform3fv(u.uBandCol, hexToRgb(preset.band));
            gl.uniform1i(u.uDebug, state.debugView);
          });

          scenePing = !scenePing;
          bgPing = !bgPing;
          fieldPing = !fieldPing;
          denPing = !denPing;
          fbPing = !fbPing;

          // Verification hook: first real composited frame is on screen
          // (works under ?freeze=1 and ?fakesource=1 too).
          if (!readyStamped && hasInput) {
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            const bgState = FAKE
              ? "SYNTH"
              : learnPhase
                ? `LEARNING ${Math.round((bgLearnT / LEARN_SECONDS) * 100)}%`
                : "TRACKING";
            readout.textContent = `FPS ${fps.toFixed(0)} / RES ${canvas.width}×${
              canvas.height
            } / FLUID ${fieldW}×${fieldH} / BG ${bgState}`;
            updateChip(learnPhase, wallNow);
          }

          requestAnimationFrame(frame);
        }

        /* ------------------------------------------------------------------
           Camera + boot. With ?fakesource=1 the synthetic scene drives the
           pipeline whatever the camera does, but getUserMedia still runs so
           the three error paths (secure context / permission / no camera)
           stay observable.
        ------------------------------------------------------------------ */

        async function startCamera() {
          stopCamera();
          cameraReady = false;
          retryCamera.disabled = true;
          setOverlay(
            "requesting",
            "REQUESTING CAMERA",
            "Please allow webcam access. If this is not localhost or HTTPS, the camera API will be blocked.",
          );

          if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost" &&
            location.hostname !== "127.0.0.1" &&
            location.hostname !== "[::1]"
          ) {
            setOverlay(
              "error",
              "SECURE CONTEXT REQUIRED",
              "Serve the file from localhost (for example: python3 -m http.server 8888) or HTTPS, then reload.",
            );
            retryCamera.disabled = false;
            return;
          }

          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setOverlay(
              "error",
              "CAMERA API UNAVAILABLE",
              "This browser does not expose getUserMedia. Try a modern browser over localhost or HTTPS.",
            );
            retryCamera.disabled = false;
            return;
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: state.facingMode,
                width: { ideal: 1280 },
                height: { ideal: 720 },
              },
              audio: false,
            });
            video.srcObject = stream;
            await video.play();

            cameraReady = true;
            retryCamera.disabled = false;
            // Fresh feed ⇒ relearn the background from scratch.
            if (!FAKE) bgLearnT = 0;
            needsReset = true;
            setOverlay("hidden", "", "");
          } catch (error) {
            retryCamera.disabled = false;
            const name = error && error.name ? error.name : "";
            if (name === "NotAllowedError" || name === "SecurityError") {
              setOverlay(
                "error",
                "PERMISSION DENIED",
                "Camera access was denied. Enable camera permission for this site, then retry.",
                { retryCamera: true },
              );
            } else if (
              name === "NotFoundError" ||
              name === "OverconstrainedError"
            ) {
              setOverlay(
                "error",
                "NO CAMERA FOUND",
                "No usable webcam was found. Connect a camera or release it from another app, then retry.",
                { retryCamera: true },
              );
            } else {
              setOverlay(
                "error",
                "CAMERA ERROR",
                `${name || "Unknown error"}. Check browser permissions and retry.`,
                { retryCamera: true },
              );
            }
          }
        }

        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        retryCamera.addEventListener("click", () => {
          startCamera();
        });

        document.addEventListener("visibilitychange", () => {
          // Avoid a dt spike (and a fluid impulse) when the tab returns.
          if (!document.hidden) lastNow = performance.now();
        });

        window.addEventListener("beforeunload", stopCamera);

        const bootWall = performance.now();

        try {
          resize();
          startCamera();
          requestAnimationFrame(frame);
        } catch (error) {
          setOverlay(
            "error",
            "WEBGL SETUP ERROR",
            error && error.message
              ? error.message
              : "Could not initialize the renderer.",
          );
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
