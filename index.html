<!doctype html>
<!--
  index.html — 作品一覧ギャラリー「黒の展示室」(docs/gallery_plan.md)

  データ: works.json(単一の情報源。日付降順で描画)
  サムネ: thumbs/<slug>.jpg(800x500 JPEG。tools/thumbs.mjs で再現可能に生成)

  作品を追加するとき:
    1. works.json に1エントリ追記(slug/file/title/date/desc/model/tags/series/thumb)
    2. node tools/thumbs.mjs <slug> でサムネ生成(要 http://localhost:8888)
    3. README.md にもリンク1行(リポジトリの目次として併存)
    ※ 下の <noscript> のリンク一覧にも1行足すとJS無効環境でも辿れる(任意)

  背景演出「展示室の光と塵」: WebGL2 の単一フルスクリーンパス。
    - 左上からの光の帯(スクロールで後退・減衰)
    - セルハッシュ由来の塵(curl風ドリフト、帯の中でだけ輝く。ほぼ白+淡ティール/淡金)
    - ポインタ周りの小さな渦
    - prefers-reduced-motion: 静止1フレーム / document.hidden: 停止
    - WebGL2 不可・context lost: キャンバスを消して CSS 地のみ(機能は完全維持)
    - 乱数シードはセル座標由来のみ(時間シード禁止 — 作品と同じ規律)
-->

    <style>
      :root {
        --bg: #0a0b0e;
        --surface: #14161b;
        --line: rgba(255, 255, 255, 0.07);

      .body { padding: 14px 16px 15px; }

        background: var(--accent);

      }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag {
        font-size: 9px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
      }
      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .card:hover {
          transform: translateY(-4px);
          border-color: rgba(110, 231, 220, 0.45);
          box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);

      noscript ul { columns: 2; font-size: 13px; }

          gap: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .card, .thumb img { transition: none; }
      }

  <body>

    <script>
      "use strict";

      /* ================= card grid (works.json driven) ================= */

      const NEW_DAYS = 14;

      function esc(s) {
        return String(s).replace(/[&<>"]/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]),
        );
      }

      async function renderGrid() {
        const grid = document.getElementById("grid");
        let works;
        try {
          const res = await fetch("works.json", { cache: "no-cache" });
          works = await res.json();
        } catch (e) {
          grid.innerHTML =
            '<p style="color:var(--muted)">作品リストを読み込めませんでした。' +
            '<a style="color:var(--accent)" href="https://github.com/dsflon/webgl2">GitHub のREADME</a> をご覧ください。</p>';
          return;
        }
        works.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
        document.getElementById("count").textContent = works.length;

        const now = Date.now();
        const frag = document.createDocumentFragment();
        for (const w of works) {
          const isNew = now - new Date(w.date + "T00:00:00Z").getTime() < NEW_DAYS * 864e5;
          const a = document.createElement("a");
          a.className = "card";
          a.href = w.file;
          a.innerHTML =
            '<div class="thumb"><img loading="lazy" decoding="async" width="800" height="500" ' +
            `src="${esc(w.thumb)}" alt="${esc(w.title)} のスクリーンショット"></div>` +
            '<div class="body">' +
            `<p class="meta mono">${esc(w.date)}${isNew ? ' <span class="badge-new">NEW</span>' : ""}</p>` +
            `<h2 class="title">${esc(w.title)}</h2>` +
            `<p class="slug mono">${esc(w.slug)}</p>` +
            `<p class="desc">${esc(w.desc)}</p>` +
            `<div class="tags">${(w.tags || [])
              .map((t) => `<span class="tag mono">${esc(t)}</span>`)
              .join("")}</div>` +
            "</div>";
          frag.appendChild(a);
        }
        grid.appendChild(frag);
      }
      renderGrid();

      /* ============ background: 展示室の光と塵 (WebGL2, 1 pass) ============ */

      (() => {
        const canvas = document.getElementById("dust");
        const gl = canvas.getContext("webgl2", {
          alpha: true,
          antialias: false,
          depth: false,
          preserveDrawingBuffer: false,
        });
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!gl) { canvas.remove(); return; }
        canvas.addEventListener("webglcontextlost", () => canvas.remove());

        const VS = `#version 300 es
          void main() {
            vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
            gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
          }`;
        const FS = `#version 300 es
          precision highp float;
          out vec4 o;
          uniform vec2 uRes;
          uniform float uTime;    // 0 when reduced-motion
          uniform float uScroll;  // scrollY / viewportH
          uniform vec2 uMouse;    // px, smoothed
          uniform float uMouseW;  // 0..1 pointer presence

          float h21(vec2 p) {
            vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
            q += dot(q, q.yzx + 33.33);
            return fract((q.x + q.y) * q.z);
          }

          // one dust layer: each grid cell owns one mote (seeded by cell coords
          // only). Motes drift on slow per-cell sine orbits + a global updraft.
          float dust(vec2 px, float cell, float t, float par, out float hue) {
            vec2 g = (px + vec2(t * 5.0, t * 9.0) * par) / cell;
            vec2 id = floor(g);
            float rnd = h21(id);
            hue = h21(id + 71.3);
            vec2 c = vec2(h21(id + 13.7), h21(id + 41.2));
            c += 0.22 * vec2(sin(t * (0.25 + rnd * 0.4) + rnd * 6.28),
                             cos(t * (0.21 + rnd * 0.33) + rnd * 4.1));
            float d = length((fract(g) - c) * cell);
            float r = 0.9 + rnd * 1.6;                 // px radius
            float m = exp(-d * d / (r * r));
            return m * step(0.45, rnd);                // ~55% of cells hold a mote
          }

          void main() {
            vec2 px = gl_FragCoord.xy;                 // origin bottom-left
            vec2 uv = px / uRes;
            float vh = uRes.y;

            // pointer swirl: rotate the sampling frame around the cursor
            vec2 mpx = vec2(uMouse.x, uRes.y - uMouse.y);
            vec2 dm = px - mpx;
            float md = length(dm) / (0.22 * max(uRes.x, uRes.y));
            float sw = uMouseW * 0.55 * exp(-md * md);
            float cs = cos(sw), sn = sin(sw);
            vec2 spx = mpx + mat2(cs, -sn, sn, cs) * dm;

            // light shaft from upper-left, receding with scroll
            vec2 dir = normalize(vec2(0.42, -1.0));    // down-right
            vec2 org = vec2(uRes.x * (0.16 - uScroll * 0.10),
                            uRes.y * (1.0 + uScroll * 0.55));
            vec2 rel = px - org;
            float along = dot(rel, dir);
            float perp = dot(rel, vec2(-dir.y, dir.x));
            float width = uRes.x * 0.16 + along * 0.22;
            float shaft = exp(-perp * perp / (width * width))
                        * smoothstep(-vh * 0.1, vh * 0.45, along)
                        * exp(-along / (vh * 1.35));
            shaft *= exp(-uScroll * 1.15);             // fades as you walk deeper
            // airy shimmer inside the beam
            shaft *= 0.82 + 0.18 * sin(perp / width * 3.0 + uTime * 0.4);

            // three parallax dust layers, lit mostly inside the shaft
            float hue, b = 0.0; vec3 col = vec3(0.0);
            const vec3 WHITE = vec3(0.92, 0.95, 1.0);
            const vec3 TEAL  = vec3(0.43, 0.91, 0.86);
            const vec3 GOLD  = vec3(0.95, 0.79, 0.42);
            for (int i = 0; i < 3; i++) {
              float fi = float(i);
              float cell = 90.0 - fi * 26.0;           // 90 / 64 / 38 px
              float par = 0.5 + fi * 0.45;
              float m = dust(spx + fi * 517.0, cell, uTime, par, hue);
              vec3 tint = hue < 0.12 ? TEAL : hue < 0.24 ? GOLD : WHITE;
              float vis = 0.10 + 0.90 * shaft;         // faint ambient, bright in beam
              col += tint * m * vis * (0.35 + 0.2 * fi);
              b += m;
            }

            // the beam itself: a whisper of volume
            col += vec3(0.99, 0.98, 0.92) * shaft * 0.045;

            float a = clamp(max(max(col.r, col.g), col.b), 0.0, 0.5);
            o = vec4(col, a);
          }`;

        function compile(type, src) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
          return s;
        }
        let prog;
        try {
          prog = gl.createProgram();
          gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
          gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
          gl.linkProgram(prog);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
        } catch (e) { canvas.remove(); return; }
        gl.useProgram(prog);
        const U = {};
        for (const n of ["uRes", "uTime", "uScroll", "uMouse", "uMouseW"])
          U[n] = gl.getUniformLocation(prog, n);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

        const DPR = Math.min(devicePixelRatio || 1, 1.5);
        function resize() {
          canvas.width = Math.round(innerWidth * DPR);
          canvas.height = Math.round(innerHeight * DPR);
          gl.viewport(0, 0, canvas.width, canvas.height);
        }
        resize();
        addEventListener("resize", resize);

        let mx = innerWidth * 0.5, my = innerHeight * 0.3, tx = mx, ty = my, mw = 0, tw = 0;
        addEventListener("pointermove", (e) => { tx = e.clientX; ty = e.clientY; tw = 1; }, { passive: true });
        addEventListener("pointerleave", () => { tw = 0; });

        let raf = 0;
        const t0 = performance.now();
        function frame(now) {
          mx += (tx - mx) * 0.06; my += (ty - my) * 0.06; mw += (tw - mw) * 0.04;
          gl.uniform2f(U.uRes, canvas.width, canvas.height);
          gl.uniform1f(U.uTime, reduced ? 0 : (now - t0) / 1000);
          gl.uniform1f(U.uScroll, scrollY / Math.max(innerHeight, 1));
          gl.uniform2f(U.uMouse, mx * DPR, my * DPR);
          gl.uniform1f(U.uMouseW, mw);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          if (!reduced) raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) cancelAnimationFrame(raf);
          else if (!reduced) raf = requestAnimationFrame(frame);
        });
        if (reduced) addEventListener("scroll", () => requestAnimationFrame(frame), { passive: true });
      })();
    </script>
  </body>
