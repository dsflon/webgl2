<!doctype html>
<!--
  fable5_gas-head.html — WebGL2 webcam →「Gas Head Cam」
  スーツの身体は実写のまま、頭部だけが首元から立ち上る大量の粒状・白青い体積煙に
  置き換わる「ガスヘッド」。黒背景・強コントラスト。参照 refs/ref1_gashead.jpg(主) /
  refs/ref2_wisps.jpg(副)の忠実再現を狙う。派生元エンジン: fable5_smoke-portrait.html。

  様式解析(視覚的不変量。優先度 1>2>3>4>5>6):
    1. 二領域 — マスク内の首から下は実写、ポーズ検知の頭部楕円内だけ煙に置換。境界はソフト遷移。
    2. 体積煙 — 頭部から実際に立ち上る Stable Fluids。首元濃く上へ膨らみ薄れる(重ね画像でない)。
    3. 粒状 — 密度に fbm を乗算しムラ、縁はノイズディザで破断。全面に静的フィルムグレイン。
    4. 配色 — 密度→白青ランプ(下濃上淡)、背景は黒+微ヘイズ、身体は軽いティール split-tone、強コントラスト。
    5. 追従 — 頭部中心/半径/噴出源を EMA 平滑化。身体の動き(運動場)を煙の外力に。
    6. 頑健性 — MediaPipe ロード中/未検出/オフラインでも黒+微ヘイズで待機。?fakesource=1 で全駆動。

  パイプライン図(毎フレーム。★=EXT_color_buffer_float 有効時 RGBA16F / 無効時 RGBA8):
    入力: カメラ映像 / fakeScene(GLSL スーツ+頭) / MediaPipe seg マスク(uint8 tex) + 頭部中心/半径(uniform, EMA)
    [P0 scene]  cover-fit+mirror                       sceneA/B RGBA8 長辺≤1280
    [P1 mask]   seg tex or fake SDF → 人物マスク        maskA/B★ ≤512  R=maskEMA BA=運動場
    [P2 blur]   マスク分離ブラー(境界ソフト)         softT★
    [P3 curl]→[P4 vel 移流+浮力+curl+渦度+運動場]→[P5 div]→[P6..29 Jacobi×24]→[P30 proj]  vel/prs★ ≤512
    [P31 den]   移流+減衰+首元ガウス注入+fbm粒状+縁ディザ  denA/B★ ≤512
    [P32 emis]→[P33 fb 残像]→[P34-37 bloom]  emis/fb★ b1 b2
    [P38 composite] 黒+微ヘイズ→実写身体(ティール)→頭部を煙にcrossfade→白青ランプ煙→強コントラスト→静的グレイン

  実行方法:
    python3 -m http.server 8888 → http://localhost:8888/fable5_gas-head.html を開きカメラを許可
    (カメラ API はセキュアコンテキスト必須。file:// では動きません)
    ?fakesource=1 … カメラ不使用。合成スーツ+頭(ゆっくり動く)で全パイプライン駆動(検証用)
    ?freeze=1    … 全ての時間駆動を停止(dt=0)し決定的な静止フレームを出す(検証用)
    デバッグ表示: 0=最終 1=人物マスク 2=頭部楕円/噴出源 3=煙密度 4=速度場 5=配色標本

  スライダーの説明:
    煙の量      頭部(首元)からの密度注入量
    立ち上り    buoyancy(煙が上昇する強さ)
    渦          vorticity+curl noise の乱流
    粒状感      排気ガス的な粒(fbm 乗算)と縁の破断の強さ
    頭部範囲    煙に置換する頭部楕円の大きさ
    境界ぼかし  実写→煙の遷移の柔らかさ
    残像        feedback 残光の長さ
    ティール    身体・全体のティール split-tone と背景の黒さ
    フィルム粒子 全面の静的グレイン

  依存: @mediapipe/tasks-vision の CDN(実カメラ時のみ実行時 import。fakesource は依存ゼロ)。
  WebGL2 / GLSL ES 3.00 単体。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FABLE5 · Gas Head Cam — WebGL2 volumetric smoke head</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #04070a;
        --ink: #dcecf2;
        --muted: rgba(220, 236, 242, 0.66);
        --panel: rgba(5, 12, 16, 0.84);
        --line: rgba(220, 236, 242, 0.16);
        --accent: #4fd6d0;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background:
          radial-gradient(circle at 72% 16%, rgba(79, 214, 208, 0.10), transparent 34%),
          linear-gradient(160deg, #03060a, #05121a 55%, #04080c);
        font-family: ui-monospace, "Courier New", Courier, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      canvas { display: block; width: 100%; height: 100%; background: var(--bg); }
      video {
        position: fixed; width: 1px; height: 1px; left: -10px; top: -10px;
        opacity: 0; pointer-events: none;
      }
      .top-btn {
        position: fixed; top: max(14px, env(safe-area-inset-top)); z-index: 11;
        padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
        color: var(--ink); background: var(--panel); font: inherit; font-size: 11px;
        letter-spacing: 0.08em; cursor: pointer;
      }
      #togglePanel {
        left: max(14px, env(safe-area-inset-left)); width: 38px; padding: 8px 0;
        font-size: 15px; line-height: 1; text-align: center;
      }
      #togglePanel.hidden { display: none; }
      #closePanel {
        position: absolute; top: 9px; right: 9px; z-index: 2; width: 26px; height: 26px;
        display: flex; align-items: center; justify-content: center; padding: 0;
        border: 1px solid var(--line); border-radius: 7px; color: var(--ink);
        background: rgba(220, 236, 242, 0.06); font: inherit; font-size: 14px;
        line-height: 1; cursor: pointer;
      }
      #closePanel:hover { background: rgba(220, 236, 242, 0.14); }
      #flipCamera { right: max(14px, env(safe-area-inset-right)); display: none; }
      @media (pointer: coarse) { #flipCamera { display: block; } }
      #statusChip {
        position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%;
        transform: translateX(-50%); z-index: 11; padding: 7px 12px;
        border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
        background: var(--panel); font-size: 10px; letter-spacing: 0.1em;
        pointer-events: none; transition: opacity 0.6s ease; white-space: nowrap;
      }
      #statusChip.hidden { opacity: 0; }
      .panel {
        position: fixed; top: max(56px, calc(env(safe-area-inset-top) + 56px));
        left: max(14px, env(safe-area-inset-left)); z-index: 10;
        width: min(360px, calc(100vw - 28px)); max-height: calc(100vh - 76px);
        overflow: hidden; display: flex; flex-direction: column;
        padding: 13px 14px 14px; color: var(--muted); background: var(--panel);
        border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(10px);
        transition: transform 0.25s ease, opacity 0.25s ease;
      }
      .panel-body { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
      .panel h1 {
        margin: 0 0 6px; padding-right: 30px; font-size: 13px;
        letter-spacing: 0.14em; color: var(--ink);
      }
      .panel p { margin: 0 0 12px; font-size: 10.5px; line-height: 1.55; }
      .select-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; margin: 0 0 10px; font-size: 10px; letter-spacing: 0.08em;
      }
      .select-row select {
        flex: 1; max-width: 210px; padding: 5px 6px; color: var(--ink);
        background: rgba(220, 236, 242, 0.06); border: 1px solid var(--line);
        border-radius: 7px; font: inherit; font-size: 10.5px;
      }
      .row {
        display: grid; grid-template-columns: 1fr 44px;
        grid-template-areas: "label out" "slider slider"; gap: 2px 8px;
        padding: 7px 0 2px; border-top: 1px solid var(--line);
      }
      .row label { grid-area: label; font-size: 11px; color: var(--ink); }
      .row label span {
        display: block; font-size: 9.5px; color: var(--muted); letter-spacing: 0.02em;
      }
      .row output { grid-area: out; justify-self: end; font-size: 10.5px; color: var(--accent); }
      .row input[type="range"] { grid-area: slider; width: 100%; accent-color: var(--accent); }
      .check-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 0 2px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink);
      }
      .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .buttons button {
        flex: 1; min-width: 100px; padding: 8px 10px; border: 1px solid var(--line);
        border-radius: 8px; color: var(--ink); background: rgba(220, 236, 242, 0.06);
        font: inherit; font-size: 10.5px; letter-spacing: 0.08em; cursor: pointer;
      }
      .status {
        margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
        font-size: 9.5px; line-height: 1.7; letter-spacing: 0.05em;
      }
      .badge {
        display: inline-block; margin-top: 4px; padding: 3px 8px;
        border: 1px solid var(--line); border-radius: 999px; font-size: 9px; color: var(--muted);
      }
      #overlay {
        position: fixed; inset: 0; z-index: 20; display: flex; align-items: center;
        justify-content: center; padding: 20px; background: rgba(2, 6, 10, 0.76);
        backdrop-filter: blur(6px); transition: opacity 0.3s ease;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      .overlay-card {
        max-width: 460px; padding: 22px 24px; text-align: center; color: var(--muted);
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      }
      .overlay-card h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 0.16em; color: var(--ink); }
      .overlay-card p { margin: 0 0 14px; font-size: 11px; line-height: 1.6; }
      .overlay-card button {
        margin: 0 4px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 8px;
        color: var(--ink); background: rgba(220, 236, 242, 0.08); font: inherit;
        font-size: 11px; letter-spacing: 0.08em; cursor: pointer;
      }
      @media (max-width: 640px) {
        .panel {
          top: auto; right: max(10px, env(safe-area-inset-right));
          bottom: max(10px, env(safe-area-inset-bottom)); left: max(10px, env(safe-area-inset-left));
          width: auto; max-height: 54vh; padding: 12px;
        }
        .panel.collapsed { transform: translateY(calc(100% + 18px)); opacity: 0; }
      }
      @media (min-width: 641px) {
        .panel.collapsed { transform: translateX(calc(-100% - 22px)); opacity: 0; }
      }
    </style>
  </head>

  <body>
    <canvas id="gl" aria-label="WebGL2 gas head webcam"></canvas>
    <video id="video" playsinline muted autoplay></video>

    <button id="togglePanel" type="button" class="top-btn hidden"
      aria-label="コントローラーを開く" aria-expanded="true">☰</button>
    <button id="flipCamera" type="button" class="top-btn" aria-label="カメラ切替">背面カメラ</button>
    <div id="statusChip">起動中</div>

    <section id="panel" class="panel" aria-label="Gas head webcam controls"></section>

    <div id="overlay" role="status" aria-live="polite">
      <div class="overlay-card">
        <h2 id="overlayTitle">REQUESTING CAMERA</h2>
        <p id="overlayText">
          Please allow webcam access. Serve this file from localhost or HTTPS.
        </p>
        <button id="retryCamera" type="button" hidden>RETRY CAMERA</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("gl");
        const video = document.getElementById("video");
        const panel = document.getElementById("panel");
        const togglePanel = document.getElementById("togglePanel");
        const flipCameraBtn = document.getElementById("flipCamera");
        const statusChip = document.getElementById("statusChip");
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlayText = document.getElementById("overlayText");
        const retryCamera = document.getElementById("retryCamera");

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        const QUERY = new URLSearchParams(location.search);
        // ?fakesource=1 replaces the camera with a synthetic scene (a teal
        // suited bust whose head slowly drifts). MediaPipe is not used; the
        // person mask + head ellipse + neck source are generated analytically
        // so the whole smoke/grain/color/tracking pipeline runs offline.
        const FAKE = QUERY.get("fakesource") === "1";
        // ?freeze=1 makes dt = 0: fluid, buoyancy, curl, grain animation,
        // the fake head drift and the detection EMA all stop (deterministic).
        const FREEZE = QUERY.get("freeze") === "1";

        const DEBUG_MODES = [
          "最終",
          "人物マスク",
          "頭部楕円/噴出源",
          "煙密度",
          "速度場",
          "配色標本",
        ];

        const DEFAULTS = {
          smoke: 0.82,
          rise: 0.7,
          swirl: 0.68,
          grain: 0.6,
          headSize: 1.0,
          blend: 0.5,
          trail: 0.5,
          grade: 0.5,
          filmGrain: 0.35,
        };

        const state = {
          ...DEFAULTS,
          debugView: 0,
          mirror: true,
          facingMode: "user",
          pauseAnim: reducedMotion || FREEZE,
        };

        const uiRows = [
          ["smoke", "煙の量", "頭部(首元)からの密度注入量", 0, 1, 0.01],
          ["rise", "立ち上り", "buoyancy(煙が上昇する強さ)", 0, 1, 0.01],
          ["swirl", "渦", "vorticity+カールノイズの乱流", 0, 1, 0.01],
          ["grain", "粒状感", "排気ガス的な粒(fbm)と縁の破断", 0, 1, 0.01],
          ["headSize", "頭部範囲", "煙に置換する頭部楕円の大きさ", 0.5, 1.5, 0.01],
          ["blend", "境界ぼかし", "実写→煙の遷移の柔らかさ", 0, 1, 0.01],
          ["trail", "残像", "煙の残光が残る長さ", 0, 1, 0.01],
          ["grade", "ティール", "身体・全体のティール寄せと背景の黒さ", 0, 1, 0.01],
          ["filmGrain", "フィルム粒子", "全面の静的グレイン", 0, 1, 0.01],
        ];

        panel.innerHTML = `
          <button id="closePanel" type="button" aria-label="コントローラーを閉じる">✕</button>
          <div class="panel-body">
          <h1>FABLE5 · ガスヘッド CAM</h1>
          <p>
            スーツの身体は実写のまま残し、頭部だけを首元から立ち上る大量の粒状な白青い
            煙に置き換えます。頭部は移流・浮力・渦で動く体積流体で、下ほど濃く上へ
            もくもくと膨らみ薄れます。黒背景・強コントラスト。
          </p>
          <div class="select-row">
            <span>デバッグ表示</span>
            <select id="debugView" aria-label="デバッグ表示">
              ${DEBUG_MODES.map(
                (label, i) => `<option value="${i}">${label}</option>`,
              ).join("")}
            </select>
          </div>
          ${uiRows
            .map(
              ([key, label, hint, min, max, step]) => `
                <div class="row">
                  <label for="${key}">
                    ${label}
                    <span>${hint}</span>
                  </label>
                  <output id="${key}Out">${formatValue(state[key])}</output>
                  <input id="${key}" type="range" min="${min}" max="${max}"
                    step="${step}" value="${state[key]}" />
                </div>
              `,
            )
            .join("")}
          <label class="check-row">
            <span>左右反転(鏡)</span>
            <input id="mirror" type="checkbox" ${state.mirror ? "checked" : ""} />
          </label>
          <label class="check-row">
            <span>ゆらぎを停止</span>
            <input id="pauseAnim" type="checkbox" ${state.pauseAnim ? "checked" : ""} />
          </label>
          <div class="buttons">
            <button id="savePng" type="button">PNG保存</button>
            <button id="resetLook" type="button">リセット</button>
          </div>
          <div class="status">
            <div id="readout">FPS -- / 解像度 -- / 流体 -- / 検知 --</div>
            <span class="badge">WebGL2 · Stable Fluids · MediaPipe</span>
          </div>
          </div>
        `;

        uiRows.forEach(([key]) => {
          const input = document.getElementById(key);
          const out = document.getElementById(`${key}Out`);
          input.addEventListener("input", () => {
            state[key] = Number(input.value);
            out.textContent = formatValue(state[key]);
          });
        });

        function setSlider(key, value) {
          state[key] = value;
          const input = document.getElementById(key);
          const out = document.getElementById(`${key}Out`);
          if (input) input.value = value;
          if (out) out.textContent = formatValue(value);
        }

        document.getElementById("debugView").addEventListener("change", (event) => {
          state.debugView = Number(event.currentTarget.value);
        });
        document.getElementById("mirror").addEventListener("change", (event) => {
          state.mirror = event.currentTarget.checked;
        });
        document.getElementById("pauseAnim").addEventListener("change", (event) => {
          state.pauseAnim = event.currentTarget.checked;
        });
        document.getElementById("resetLook").addEventListener("click", () => {
          Object.keys(DEFAULTS).forEach((key) => setSlider(key, DEFAULTS[key]));
        });

        const closePanel = document.getElementById("closePanel");
        function setPanelCollapsed(collapsed) {
          panel.classList.toggle("collapsed", collapsed);
          togglePanel.classList.toggle("hidden", !collapsed);
          togglePanel.setAttribute("aria-expanded", String(!collapsed));
        }
        togglePanel.addEventListener("click", () => setPanelCollapsed(false));
        closePanel.addEventListener("click", () => setPanelCollapsed(true));
        const isMobile = window.matchMedia("(max-width: 640px)").matches;
        setPanelCollapsed(isMobile);

        flipCameraBtn.addEventListener("click", () => {
          state.facingMode = state.facingMode === "user" ? "environment" : "user";
          flipCameraBtn.textContent =
            state.facingMode === "user" ? "背面カメラ" : "前面カメラ";
          state.mirror = state.facingMode === "user";
          document.getElementById("mirror").checked = state.mirror;
          startCamera();
        });

        document.getElementById("savePng").addEventListener("click", () => {
          const link = document.createElement("a");
          const stamp = new Date().toISOString().replace(/[:.]/g, "-");
          link.download = `fable5-gas-head-${stamp}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        });

        function formatValue(value) {
          return Number(value).toFixed(Math.abs(value) >= 10 ? 0 : 2);
        }

        function setOverlay(kind, title, text, buttons = {}) {
          overlayTitle.textContent = title;
          overlayText.textContent = text;
          retryCamera.hidden = !buttons.retryCamera;
          overlay.classList.toggle("hidden", kind === "hidden");
        }
        /* ------------------------------------------------------------------
           WebGL2 setup
        ------------------------------------------------------------------ */

        const gl = canvas.getContext("webgl2", {
          alpha: false,
          antialias: false,
          depth: false,
          stencil: false,
          preserveDrawingBuffer: true,
          powerPreference: "high-performance",
        });

        if (!gl) {
          setOverlay(
            "error",
            "WEBGL2 UNAVAILABLE",
            "This piece needs WebGL2. Try a current desktop/mobile browser with hardware acceleration enabled.",
          );
          return;
        }

        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.CULL_FACE);
        gl.disable(gl.BLEND);

        // Float render targets keep the fluid / EMAs from stalling in 8 bits.
        // Signed quantities are offset-encoded into [0,1] (encV / encS) so the
        // RGBA8 fallback runs the exact same shaders, only coarser.
        const floatExt = gl.getExtension("EXT_color_buffer_float");

        const fullscreenVS = `#version 300 es
          precision highp float;
          const vec2 POS[3] = vec2[3](
            vec2(-1.0, -1.0), vec2( 3.0, -1.0), vec2(-1.0,  3.0)
          );
          out vec2 vUv;
          void main() {
            vec2 p = POS[gl_VertexID];
            vUv = p * 0.5 + 0.5;
            gl_Position = vec4(p, 0.0, 1.0);
          }
        `;

        // Shared: pcg-flavoured hash + value noise + fbm. Grain and the density
        // mottle are seeded by cell / position only — never by time (repo rule),
        // so they stay deterministic under ?freeze=1.
        const CHUNK_NOISE = `
          float hash12(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
          }
          float vnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash12(i);
            float b = hash12(i + vec2(1.0, 0.0));
            float c = hash12(i + vec2(0.0, 1.0));
            float d = hash12(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }
          float fbm(vec2 p) {
            float s = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 5; i++) {
              s += amp * vnoise(p);
              p *= 2.02;
              amp *= 0.5;
            }
            return s;
          }
          vec2 curlN(vec2 p) {
            float e = 0.012;
            float n1 = vnoise(p + vec2(0.0, e)) - vnoise(p - vec2(0.0, e));
            float n2 = vnoise(p + vec2(e, 0.0)) - vnoise(p - vec2(e, 0.0));
            return vec2(n1, -n2) / (2.0 * e);
          }
        `;

        // Shared: [0,1] offset encoding for signed fields. The clamp doubles as
        // the mandatory velocity clamp (no NaN blow-ups).
        const CHUNK_ENC = `
          const float VMAX = 2.4;
          const float SMAX = 3.0;
          vec2 encV(vec2 v) { return clamp(v, -VMAX, VMAX) / (2.0 * VMAX) + 0.5; }
          vec2 decV(vec2 e) { return (e - 0.5) * (2.0 * VMAX); }
          float encS(float x) { return clamp(x, -SMAX, SMAX) / (2.0 * SMAX) + 0.5; }
          float decS(float e) { return (e - 0.5) * (2.0 * SMAX); }
        `;

        // Shared: head ellipse in screen UV. Center + radius (radius already
        // scaled by the headSize slider in JS) define the region that is
        // replaced by smoke; the neck point (bottom of the ellipse) is the
        // density injection source.
        const CHUNK_HEAD = `
          float headND(vec2 uv, vec2 c, float r, float aspect) {
            vec2 d = uv - c;
            d.x *= aspect;
            d.y /= 1.18;               // head a touch taller than wide
            return length(d) / max(r, 1e-4);
          }
        `;

        // Shared: the ?fakesource=1 synthetic scene — a teal suited bust on
        // near-black, whose head (drawn at uHeadCenter/uHeadRadius so it always
        // matches the ellipse the shaders use) slowly drifts. fakeMask returns
        // the person coverage used in place of the MediaPipe segmentation mask.
        const CHUNK_FAKE = `
          float sdSeg(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a;
            vec2 ba = b - a;
            float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
            return length(pa - ba * h);
          }
          float smin2(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
          }
          // p and headC are in aspect-corrected space; r is in y-units.
          float fakeBustDist(vec2 p, vec2 headC, float r) {
            float d = 1e9;
            // shoulders: wide horizontal capsule
            d = min(d, sdSeg(p, vec2(0.30, 0.34), vec2(0.70, 0.34)) - 0.125);
            // torso down to the bottom of frame
            d = smin2(d, sdSeg(p, vec2(0.5, -0.05), vec2(0.5, 0.36)) - 0.20, 0.06);
            // neck
            d = smin2(d, sdSeg(p, vec2(headC.x, headC.y - r * 1.05),
              vec2(headC.x, 0.40)) - 0.052, 0.03);
            // head
            d = smin2(d, length((p - headC) / vec2(1.0, 1.18)) - r, 0.02);
            return d;
          }
          vec3 fakeScene(vec2 uv, vec2 headC, float r, float aspect) {
            // near-black backdrop with a faint vertical lift
            vec3 col = mix(vec3(0.010, 0.016, 0.020), vec3(0.020, 0.030, 0.038), uv.y);
            vec2 p = vec2((uv.x - 0.5) * aspect + 0.5, uv.y);
            vec2 hc = vec2((headC.x - 0.5) * aspect + 0.5, headC.y);
            float d = fakeBustDist(p, hc, r);
            float m = 1.0 - smoothstep(-0.004, 0.006, d);
            // teal suit, lighter collar V, darker tie
            float shade = 0.70 + 0.55 * smoothstep(0.02, 0.55, uv.y);
            vec3 suit = vec3(0.13, 0.52, 0.55) * shade;
            float collar = smoothstep(0.05, 0.0, abs(p.x - 0.5) - (0.40 - uv.y) * 0.20);
            collar *= smoothstep(0.30, 0.44, uv.y) * (1.0 - smoothstep(0.44, 0.50, uv.y));
            suit = mix(suit, vec3(0.62, 0.80, 0.82) * shade, collar * 0.8);
            float tie = smoothstep(0.028, 0.0, abs(p.x - 0.5)) *
              smoothstep(0.44, 0.40, uv.y) * step(0.12, uv.y);
            suit = mix(suit, vec3(0.08, 0.36, 0.40) * shade, tie * 0.9);
            // head skin-ish tone (mostly hidden by smoke in the final image)
            float headM = 1.0 - smoothstep(r * 0.9, r * 1.05,
              length((p - hc) / vec2(1.0, 1.18)));
            suit = mix(suit, vec3(0.52, 0.46, 0.42), headM * 0.85);
            return mix(col, suit, m);
          }
          float fakeMask(vec2 uv, vec2 headC, float r, float aspect) {
            vec2 p = vec2((uv.x - 0.5) * aspect + 0.5, uv.y);
            vec2 hc = vec2((headC.x - 0.5) * aspect + 0.5, headC.y);
            float d = fakeBustDist(p, hc, r);
            return 1.0 - smoothstep(-0.006, 0.010, d);
          }
        `;

        // P0 — webcam cover-fit + mirror (or the synthetic scene) into the
        // working scene buffer. Everything downstream is screen-aligned.
        const sceneFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uVideo;
          uniform vec2 uResolution;
          uniform vec2 uVideoSize;
          uniform vec2 uHeadCenter;
          uniform float uHeadRadius;
          uniform float uAspect;
          uniform int uMirror;
          uniform int uFake;
          uniform int uHasVideo;
          ${CHUNK_NOISE}
          ${CHUNK_FAKE}
          void main() {
            if (uFake == 1) {
              fragColor = vec4(
                fakeScene(vUv, uHeadCenter, uHeadRadius, uAspect), 1.0);
              return;
            }
            if (uHasVideo == 0) {
              fragColor = vec4(0.010, 0.016, 0.022, 1.0);
              return;
            }
            vec2 uv = vUv;
            if (uMirror == 1) uv.x = 1.0 - uv.x;
            float canvasAspect = uResolution.x / uResolution.y;
            float videoAspect = uVideoSize.x / uVideoSize.y;
            vec2 scale = videoAspect > canvasAspect
              ? vec2(canvasAspect / videoAspect, 1.0)
              : vec2(1.0, videoAspect / canvasAspect);
            vec2 vuv = (uv - 0.5) * scale + 0.5;
            fragColor = vec4(texture(uVideo, vuv).rgb, 1.0);
          }
        `;

        // P1 — the mask/field: R = person mask EMA (fake SDF, uploaded
        // MediaPipe segmentation with cover-fit, or 0 when nothing is
        // detected), BA = motion field (frame-difference flow, EMA-smoothed)
        // so body movement can nudge the smoke (invariant 5).
        const maskFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform sampler2D uScenePrev;
          uniform sampler2D uPrev;
          uniform sampler2D uSeg;
          uniform vec2 uTexel;
          uniform vec2 uSegScale;
          uniform vec2 uHeadCenter;
          uniform float uHeadRadius;
          uniform float uAspect;
          uniform float uDt;
          uniform float uAlphaMask;
          uniform float uAlphaMot;
          uniform int uReset;
          uniform int uSource;
          uniform int uMirror;
          ${CHUNK_ENC}
          ${CHUNK_FAKE}
          float lumaf(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
          void main() {
            float rawMask = 0.0;
            if (uSource == 0) {
              rawMask = fakeMask(vUv, uHeadCenter, uHeadRadius, uAspect);
            } else if (uSource == 1) {
              vec2 uv = vUv;
              if (uMirror == 1) uv.x = 1.0 - uv.x;
              vec2 suv = (uv - 0.5) * uSegScale + 0.5;
              rawMask = texture(uSeg, suv).r;
            }
            vec4 prev = texture(uPrev, vUv);
            float mask = uReset == 1 ? rawMask
              : mix(prev.r, rawMask, uAlphaMask);

            // pseudo optical flow from the scene frame difference
            vec3 cur = texture(uScene, vUv).rgb;
            float l0 = lumaf(texture(uScenePrev, vUv).rgb);
            float l1 = lumaf(cur);
            float lx = lumaf(texture(uScene, vUv + vec2(uTexel.x, 0.0)).rgb) -
              lumaf(texture(uScene, vUv - vec2(uTexel.x, 0.0)).rgb);
            float ly = lumaf(texture(uScene, vUv + vec2(0.0, uTexel.y)).rgb) -
              lumaf(texture(uScene, vUv - vec2(0.0, uTexel.y)).rgb);
            vec2 grd = vec2(lx / (2.0 * uTexel.x), ly / (2.0 * uTexel.y));
            float it = (l1 - l0) / max(uDt, 1e-3);
            vec2 flowRaw = -it * grd / (dot(grd, grd) + 40.0);
            flowRaw = clamp(flowRaw, vec2(-VMAX), vec2(VMAX));
            vec2 flow = uReset == 1 ? vec2(0.0)
              : mix(decV(prev.ba), flowRaw, uAlphaMot);

            fragColor = vec4(clamp(mask, 0.0, 1.0), 0.0, encV(flow));
          }
        `;

        // Separable Gaussian (all channels). Used to soften the mask edge.
        const blurFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uSrc;
          uniform vec2 uDir;
          uniform float uSigma;
          void main() {
            vec4 acc = vec4(0.0);
            float wsum = 0.0;
            for (int i = -10; i <= 10; ++i) {
              float x = float(i);
              float w = exp(-0.5 * x * x / max(uSigma * uSigma, 1e-4));
              acc += texture(uSrc, vUv + uDir * x) * w;
              wsum += w;
            }
            fragColor = acc / wsum;
          }
        `;

        // P3 — curl of the velocity field (for vorticity confinement).
        const curlFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uVel;
          uniform vec2 uTexel;
          ${CHUNK_ENC}
          void main() {
            float vr = decV(texture(uVel, vUv + vec2(uTexel.x, 0.0)).rg).y;
            float vl = decV(texture(uVel, vUv - vec2(uTexel.x, 0.0)).rg).y;
            float vt = decV(texture(uVel, vUv + vec2(0.0, uTexel.y)).rg).x;
            float vb = decV(texture(uVel, vUv - vec2(0.0, uTexel.y)).rg).x;
            float c = 0.5 * ((vr - vl) - (vt - vb));
            fragColor = vec4(encS(c), 0.0, 0.0, 1.0);
          }
        `;

        // P4 — semi-Lagrangian advection + forces: buoyancy lifts dense smoke,
        // curl noise adds exhaust turbulence, vorticity confinement re-sharpens
        // eddies, and the body motion field drags the gas so it wafts.
        const velFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uVel;
          uniform sampler2D uCurl;
          uniform sampler2D uMask;
          uniform sampler2D uDen;
          uniform vec2 uTexel;
          uniform vec2 uNeck;
          uniform vec2 uHeadCenter;
          uniform float uHeadRadius;
          uniform float uAspect;
          uniform float uDt;
          uniform float uTime;
          uniform float uRise;
          uniform float uSwirl;
          uniform float uPresent;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_HEAD}
          void main() {
            vec2 vHere = decV(texture(uVel, vUv).rg);
            vec2 back = vUv - vHere * uDt;
            vec2 v = decV(texture(uVel, back).rg);

            vec4 mk = texture(uMask, vUv);
            float mask = mk.r;
            vec2 flow = decV(mk.ba);
            float den = texture(uDen, vUv).r;

            // upward launch jet at the collar/head source: a sustained vertical
            // impulse so the plume shoots high above the head, not just a
            // buoyant blob (matches ref1's tall billow).
            float nd = headND(vUv, uHeadCenter, uHeadRadius, uAspect);
            float headFill = 1.0 - smoothstep(0.5, 1.12, nd);
            vec2 dd = vUv - uNeck;
            dd.x *= uAspect;
            float sx = 0.80 * uHeadRadius;
            float xg = exp(-(dd.x * dd.x) / (2.0 * sx * sx));
            float up = vUv.y - uNeck.y;
            float plume = xg * exp(-max(up, 0.0) / (uHeadRadius * 1.6)) *
              smoothstep(-uHeadRadius * 0.5, 0.0, up);
            float jetSrc = max(headFill * 0.55, plume) * uPresent;
            v.y += jetSrc * (0.7 + 2.1 * uRise) * uDt * 3.2;

            // buoyancy — dense smoke keeps rising even after it leaves the head
            v.y += (0.8 + 3.6 * uRise) * den * uDt;

            // body motion drags the gas near the person (invariant 5)
            v += flow * (1.15 * clamp(mask, 0.0, 1.0)) * uDt;

            // curl noise turbulence, THREE octaves (coarse→fine): the fine
            // octave tatters the edges into ragged, cauliflower exhaust.
            float wSmoke = smoothstep(0.003, 0.10, den);
            vec2 np = vUv * 3.4 + vec2(0.0, -uTime * 0.05);
            vec2 np2 = vUv * 7.2 + vec2(uTime * 0.035, 0.0);
            vec2 np3 = vUv * 14.5 + vec2(-uTime * 0.06, uTime * 0.02);
            vec2 cn = curlN(np) + 0.75 * curlN(np2) + 0.55 * curlN(np3);
            v += cn * (0.20 + 1.7 * uSwirl) * wSmoke * uDt;

            // vorticity confinement — stronger so eddies curl into clumps
            float cC = decS(texture(uCurl, vUv).r);
            float cL = decS(texture(uCurl, vUv - vec2(uTexel.x, 0.0)).r);
            float cR = decS(texture(uCurl, vUv + vec2(uTexel.x, 0.0)).r);
            float cB = decS(texture(uCurl, vUv - vec2(0.0, uTexel.y)).r);
            float cT = decS(texture(uCurl, vUv + vec2(0.0, uTexel.y)).r);
            vec2 gAbs = 0.5 * vec2(abs(cR) - abs(cL), abs(cT) - abs(cB));
            vec2 nDir = gAbs / max(length(gAbs), 1e-4);
            v += vec2(nDir.y, -nDir.x) * cC * (0.6 + uSwirl * 2.8) * uDt;

            // gentler damping so smoke travels far up before settling
            v *= exp(-uDt * 0.5);
            fragColor = vec4(encV(v), 0.0, 1.0);
          }
        `;

        // P5 — divergence of the forced velocity.
        const divFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uVel;
          uniform vec2 uTexel;
          ${CHUNK_ENC}
          void main() {
            float vr = decV(texture(uVel, vUv + vec2(uTexel.x, 0.0)).rg).x;
            float vl = decV(texture(uVel, vUv - vec2(uTexel.x, 0.0)).rg).x;
            float vt = decV(texture(uVel, vUv + vec2(0.0, uTexel.y)).rg).y;
            float vb = decV(texture(uVel, vUv - vec2(0.0, uTexel.y)).rg).y;
            fragColor = vec4(encS(0.5 * ((vr - vl) + (vt - vb))), 0.0, 0.0, 1.0);
          }
        `;

        // P6..P29 — Jacobi pressure iterations (fixed count from JS,
        // warm-started from the previous frame's pressure).
        const jacobiFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uPrs;
          uniform sampler2D uDiv;
          uniform vec2 uTexel;
          ${CHUNK_ENC}
          void main() {
            float pl = decS(texture(uPrs, vUv - vec2(uTexel.x, 0.0)).r);
            float pr = decS(texture(uPrs, vUv + vec2(uTexel.x, 0.0)).r);
            float pb = decS(texture(uPrs, vUv - vec2(0.0, uTexel.y)).r);
            float pt = decS(texture(uPrs, vUv + vec2(0.0, uTexel.y)).r);
            float dv = decS(texture(uDiv, vUv).r);
            fragColor = vec4(encS((pl + pr + pb + pt - dv) * 0.25), 0.0, 0.0, 1.0);
          }
        `;

        // P30 — subtract the pressure gradient (projection).
        const projFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uVel;
          uniform sampler2D uPrs;
          uniform vec2 uTexel;
          ${CHUNK_ENC}
          void main() {
            vec2 v = decV(texture(uVel, vUv).rg);
            float pl = decS(texture(uPrs, vUv - vec2(uTexel.x, 0.0)).r);
            float pr = decS(texture(uPrs, vUv + vec2(uTexel.x, 0.0)).r);
            float pb = decS(texture(uPrs, vUv - vec2(0.0, uTexel.y)).r);
            float pt = decS(texture(uPrs, vUv + vec2(0.0, uTexel.y)).r);
            v -= 0.5 * vec2(pr - pl, pt - pb);
            fragColor = vec4(encV(v), 0.0, 1.0);
          }
        `;

        // P31 — density: advect + dissipate the smoke, inject a granular plume
        // at the neck source, multiply in fbm mottle (exhaust particulate), and
        // tatter thin edges with a position-seeded noise dither.
        const denFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uDen;
          uniform sampler2D uVel;
          uniform vec2 uNeck;
          uniform vec2 uHeadCenter;
          uniform float uHeadRadius;
          uniform float uAspect;
          uniform float uDt;
          uniform float uSmoke;
          uniform float uGrain;
          uniform float uPresent;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_HEAD}
          void main() {
            vec2 v = decV(texture(uVel, vUv).rg);
            float d = texture(uDen, vUv - v * uDt).r;
            // height-dependent dissipation: near the collar it clears fast (so
            // density does not over-pile), high above it barely decays (so the
            // billow survives all the way up into the black — invariant 2).
            float heightFade = clamp((vUv.y - uNeck.y) / 0.55, 0.0, 1.0);
            float diss = mix(0.26, 0.05, heightFade) + 0.12 * (1.0 - uSmoke);
            d *= exp(-uDt * diss);

            // injection: a vertical column rooted at the neck that fills the
            // head and decays upward. Buoyancy then carries the top into a
            // billowing plume above the head (invariant 2). fbm mottle makes it
            // granular (invariant 3).
            // Two sources combined (invariants 1,2,4):
            //  - headFill keeps the whole head ellipse gas so no face shows.
            //  - the collar plume is densest at the neck and feeds upward; it
            //    is gated off below the neck so the torso/suit stays clean.
            float nd = headND(vUv, uHeadCenter, uHeadRadius, uAspect);
            float headFill = 1.0 - smoothstep(0.5, 1.12, nd);
            vec2 dd = vUv - uNeck;
            dd.x *= uAspect;
            float sx = 0.80 * uHeadRadius;
            float xg = exp(-(dd.x * dd.x) / (2.0 * sx * sx));
            float up = vUv.y - uNeck.y;
            float plume = xg * exp(-max(up, 0.0) / (uHeadRadius * 1.5)) *
              smoothstep(-uHeadRadius * 0.5, 0.0, up);
            float src = max(headFill * 0.7, plume);
            // high-contrast multi-octave mottle → exhaust particulate clumps
            float mott = fbm(vUv * 10.0);
            mott = pow(clamp(mott, 0.0, 1.0), 1.7);
            float inj = src * uPresent * uSmoke * (0.22 + 1.7 * mott);
            d += inj * uDt * 3.4;

            // edge tatter — break the thin fringe hard so it reads as ragged,
            // torn exhaust rather than a smooth balloon (invariant 3)
            float en = fbm(vUv * 8.0 + 11.3);
            float tat = smoothstep(-0.03, 0.13, d + (en - 0.5) * 0.75);
            d *= mix(1.0, tat, 0.6 * uGrain);

            fragColor = vec4(clamp(d, 0.0, 1.0), 0.0, 0.0, 1.0);
          }
        `;

        // P32 — grayscale emission (bloom / halo source) from density.
        const emisFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uDen;
          void main() {
            float d = texture(uDen, vUv).r;
            float e = pow(max(d, 0.0), 0.75);
            fragColor = vec4(vec3(e), 1.0);
          }
        `;

        // P33 — afterglow feedback: max(current, previous · decay).
        // Under ?freeze=1 decay = 1 (dt = 0), so the buffer holds still.
        const fbFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uEmis;
          uniform sampler2D uPrev;
          uniform float uDecay;
          void main() {
            vec3 e = texture(uEmis, vUv).rgb;
            vec3 p = texture(uPrev, vUv).rgb * uDecay;
            fragColor = vec4(max(e, p), 1.0);
          }
        `;
        // P38 — final composite. Black backdrop + faint haze, photographic
        // body (teal split-tone) where the mask holds and the head ellipse
        // does not, the head crossfaded to smoke, then the volumetric smoke
        // (white→teal ramp, dense-low / thin-high) drawn over everything so it
        // billows up into the black. Strong contrast + static film grain.
        const compositeFS = `#version 300 es
          precision highp float;
          in vec2 vUv;
          out vec4 fragColor;
          uniform sampler2D uScene;
          uniform sampler2D uMask;
          uniform sampler2D uMaskRaw;
          uniform sampler2D uDen;
          uniform sampler2D uVel;
          uniform sampler2D uFb;
          uniform sampler2D uB1;
          uniform sampler2D uB2;
          uniform vec2 uResolution;
          uniform vec2 uHeadCenter;
          uniform vec2 uNeck;
          uniform float uHeadRadius;
          uniform float uAspect;
          uniform float uBlend;
          uniform float uGrade;
          uniform float uTrail;
          uniform float uFilmGrain;
          uniform int uDebug;
          ${CHUNK_NOISE}
          ${CHUNK_ENC}
          ${CHUNK_HEAD}
          float lumaf(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

          // density → smoke color: dense/low = teal-white, thin/high = cool pale
          vec3 smokeRamp(float d, float heightT) {
            vec3 deep = vec3(0.42, 0.74, 0.80);
            vec3 mid = vec3(0.78, 0.90, 0.94);
            vec3 hi = vec3(0.95, 0.98, 1.00);
            vec3 c = mix(deep, mid, smoothstep(0.10, 0.55, d));
            c = mix(c, hi, smoothstep(0.55, 0.95, d));
            c = mix(c, vec3(0.90, 0.96, 1.0), clamp(heightT, 0.0, 1.0) * 0.45);
            return c;
          }
          // gentle teal split-tone on the photographic body
          vec3 splitTone(vec3 c, float amt) {
            float l = lumaf(c);
            vec3 sh = vec3(0.05, 0.15, 0.17);
            vec3 hl = vec3(0.86, 0.98, 1.0);
            vec3 t = mix(sh, hl, smoothstep(0.0, 1.0, l)) * (0.35 + 1.2 * l);
            vec3 teal = c * vec3(0.84, 1.03, 1.04);
            return mix(c, mix(teal, t, 0.30), amt);
          }
          void main() {
            float den = texture(uDen, vUv).r;
            float maskS = clamp(texture(uMask, vUv).r, 0.0, 1.0);
            float aspect = uAspect;
            float nd = headND(vUv, uHeadCenter, uHeadRadius, aspect);
            float ew = clamp(0.05 + 0.30 * uBlend, 0.02, 0.6);
            float head = 1.0 - smoothstep(1.0 - ew, 1.0 + ew, nd);

            if (uDebug == 1) {
              fragColor = vec4(vec3(texture(uMaskRaw, vUv).r), 1.0);
              return;
            }
            if (uDebug == 2) {
              float ring = 1.0 - smoothstep(0.02, 0.05, abs(nd - 1.0));
              vec2 dn = vUv - uNeck; dn.x *= aspect;
              float neck = 1.0 - smoothstep(0.012, 0.024, length(dn));
              vec3 c = vec3(texture(uMaskRaw, vUv).r) * 0.32;
              c += vec3(0.2, 0.95, 0.92) * ring;
              c += vec3(1.0, 0.45, 0.2) * neck;
              fragColor = vec4(c, 1.0);
              return;
            }
            if (uDebug == 3) {
              fragColor = vec4(vec3(den), 1.0);
              return;
            }
            if (uDebug == 4) {
              vec2 v = decV(texture(uVel, vUv).rg);
              fragColor = vec4(clamp(v / (2.0 * VMAX) + 0.5, 0.0, 1.0), 0.4, 1.0);
              return;
            }
            if (uDebug == 5) {
              float dstrip = clamp((vUv.x - 0.08) / 0.84, 0.0, 1.0);
              float strip = 1.0 - smoothstep(0.16, 0.18, abs(vUv.y - 0.5));
              float ht = clamp((0.68 - vUv.y) / 0.36, 0.0, 1.0);
              fragColor = vec4(smokeRamp(dstrip, ht) * strip, 1.0);
              return;
            }

            // gain is kept up so the faint OUTER/UPPER billow (low density) is
            // carried too, not just the dense head core.
            float fb = texture(uFb, vUv).r;
            float b1 = texture(uB1, vUv).r;
            float b2 = texture(uB2, vUv).r;
            float halo = max(fb, 0.6 * b1 + 0.5 * b2);
            float sd = max(den, halo * (0.18 + 0.42 * uTrail));
            // gamma-lift low/mid density so thin smoke reads as bright teal-
            // white instead of collapsing to black. Pure zero stays zero, so
            // the true background (no density) remains black.
            float sLift = pow(clamp(sd, 0.0, 1.0), 0.62);
            float s = 1.0 - exp(-sLift * 3.4);
            float smokeA = clamp(smoothstep(0.015, 0.90, s), 0.0, 1.0);
            float heightT = clamp((vUv.y - uNeck.y) / 0.5, 0.0, 1.0);
            vec3 smokeCol = smokeRamp(den, heightT);

            // black backdrop + faint static haze
            vec3 base = mix(vec3(0.006, 0.010, 0.014),
              vec3(0.011, 0.019, 0.025), vUv.y);
            base *= mix(1.0, 0.55, uGrade);
            float hz = fbm(vUv * vec2(3.0, 2.0));
            base += vec3(0.008, 0.014, 0.018) * hz * 0.5;

            // photographic body, minus the head ellipse (face suppressed there)
            vec3 cam = texture(uScene, vUv).rgb;
            vec3 body = splitTone(cam, uGrade);
            float faceKeep = 1.0 - 0.9 * head;
            float suitW = maskS * faceKeep;
            vec3 col = mix(base, body, suitW);

            // Tone the PHOTOGRAPHIC layer (contrast + vignette) BEFORE the
            // smoke, so the billow is never crushed to black by the vignette.
            col = pow(max(col, 0.0), vec3(0.92));
            col = (col - 0.5) * (1.10 + 0.32 * uGrade) + 0.5;
            col = max(col, 0.0);
            vec2 vq = (vUv - 0.5) * vec2(aspect, 1.0);
            col *= mix(0.82, 1.0, smoothstep(1.2, 0.30, length(vq)));

            // and the plume above/around it) floats on the black, not just the
            // head ellipse. The head ellipse only drives the face crossfade.
            col = mix(col, smokeCol, smokeA);
            // extra additive glow lifts the faint upper/outer billow off black;
            // vanishes where there is no smoke, so the background stays pure.
            col += smokeCol * halo * (0.12 + 0.18 * uTrail) * (1.0 - smokeA);

            float g1 = hash12(floor(gl_FragCoord.xy));
            float g2 = hash12(floor(gl_FragCoord.xy * 0.5) + 17.0);
            float lc = lumaf(col);
            float gAmt = uFilmGrain * (0.05 + 0.12 * (1.0 - smoothstep(0.05, 0.6, lc)));
            col += (g1 - 0.5) * gAmt + (g2 - 0.5) * uFilmGrain * 0.02;

            fragColor = vec4(col, 1.0);

            "uAlphaMot", "uReset", "uSource", "uMirror",

          blur: getLocations(programs.blur, ["uSrc", "uDir", "uSigma"]),
          curl: getLocations(programs.curl, ["uVel", "uTexel"]),
          vel: getLocations(programs.vel, [
            "uVel", "uCurl", "uMask", "uDen", "uTexel", "uNeck", "uHeadCenter",
            "uHeadRadius", "uAspect", "uDt", "uTime", "uRise", "uSwirl",

            sceneB: createTarget(paintW, paintH, false),
            maskA: createTarget(fieldW, fieldH, true),
            maskB: createTarget(fieldW, fieldH, true),
            softT: createTarget(fieldW, fieldH, true),
            softTmp: createTarget(fieldW, fieldH, true),
            curlT: createTarget(fieldW, fieldH, true),
            velA: createTarget(fieldW, fieldH, true),
            velB: createTarget(fieldW, fieldH, true),
            divT: createTarget(fieldW, fieldH, true),
            prsA: createTarget(fieldW, fieldH, true),
            prsB: createTarget(fieldW, fieldH, true),
            denA: createTarget(fieldW, fieldH, true),
            denB: createTarget(fieldW, fieldH, true),
            emisT: createTarget(glowW, glowH, true),
            fbA: createTarget(glowW, glowH, true),
            fbB: createTarget(glowW, glowH, true),

          clearTarget(targets.sceneB, 0.01, 0.016, 0.022, 1);
          clearTarget(targets.maskA, 0, 0, 0.5, 0.5);
          clearTarget(targets.maskB, 0, 0, 0.5, 0.5);
          clearTarget(targets.softT, 0, 0, 0.5, 0.5);
          clearTarget(targets.velA, 0.5, 0.5, 0, 1);
          clearTarget(targets.velB, 0.5, 0.5, 0, 1);
          clearTarget(targets.prsA, 0.5, 0, 0, 1);
          clearTarget(targets.prsB, 0.5, 0, 0, 1);
          clearTarget(targets.divT, 0.5, 0, 0, 1);
          clearTarget(targets.curlT, 0.5, 0, 0, 1);
          clearTarget(targets.denA, 0, 0, 0, 1);
          clearTarget(targets.denB, 0, 0, 0, 1);

        function resize() {

            canvas.height = height;

            const paintScale = Math.min(1, 1280 / maxSide);
            paintW = Math.max(2, Math.round(width * paintScale));
            paintH = Math.max(2, Math.round(height * paintScale));
            const fieldScale = Math.min(1, 512 / maxSide);

          for (const i of idx) {
            const p = lm[i];
            if (p) { sx += p.x; sy += p.y; n++; }

            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

        function updateDetection(dt) {
          const canvasAspect = canvas.width / Math.max(canvas.height, 1);

            ? video.videoWidth / video.videoHeight : 4 / 3;
          det.segScale = videoAspect > canvasAspect
            ? [canvasAspect / videoAspect, 1]
            : [1, videoAspect / canvasAspect];

          if (mpState === "error") return "検知エラー";

          const dt = FREEZE ? 0 : rawDt;
          if (!state.pauseAnim) animTime += dt;

          const haveVideo = FAKE ? false : uploadVideoFrame();
          const hasInput = FAKE || haveVideo || mpState === "ready";

          updateDetection(dt);

          const doReset = needsReset;
          needsReset = false;
          if (doReset) clearSimTargets();

          const rEff = det.r * state.headSize;
          const headCenter = [det.cx, det.cy];
          const neck = [det.cx, det.cy - rEff * 1.02];
          const aspect = canvas.width / Math.max(canvas.height, 1);
          const source = FAKE ? 0 : (mpState === "ready" && det.segReady ? 1 : 2);

          const sceneCur = scenePing ? targets.sceneA : targets.sceneB;
          const scenePrev = scenePing ? targets.sceneB : targets.sceneA;
          const maskOut = maskPing ? targets.maskA : targets.maskB;
          const maskPrev = maskPing ? targets.maskB : targets.maskA;
          const denOut = denPing ? targets.denA : targets.denB;
          const denPrev = denPing ? targets.denB : targets.denA;
          const fbOut = fbPing ? targets.fbA : targets.fbB;
          const fbPrev = fbPing ? targets.fbB : targets.fbA;
          const fieldTexel = [1 / fieldW, 1 / fieldH];

          // P0 — scene
          renderPass(sceneCur, programs.scene, () => {
            const u = locations.scene;
            bindTexture(0, videoTexture);
            gl.uniform1i(u.uVideo, 0);
            gl.uniform2f(u.uResolution, paintW, paintH);
            gl.uniform2f(u.uVideoSize,
              Math.max(1, video.videoWidth), Math.max(1, video.videoHeight));
            gl.uniform2f(u.uHeadCenter, headCenter[0], headCenter[1]);
            gl.uniform1f(u.uHeadRadius, rEff);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1i(u.uMirror, state.mirror ? 1 : 0);
            gl.uniform1i(u.uFake, FAKE ? 1 : 0);
            gl.uniform1i(u.uHasVideo, haveVideo ? 1 : 0);
          });

          // P1 — mask / motion field
          renderPass(maskOut, programs.mask, () => {
            const u = locations.mask;
            bindTexture(0, sceneCur.tex);
            bindTexture(1, scenePrev.tex);
            bindTexture(2, maskPrev.tex);
            bindTexture(3, segTexture);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uScenePrev, 1);
            gl.uniform1i(u.uPrev, 2);
            gl.uniform1i(u.uSeg, 3);
            gl.uniform2f(u.uTexel, fieldTexel[0], fieldTexel[1]);
            gl.uniform2f(u.uSegScale, det.segScale[0], det.segScale[1]);
            gl.uniform2f(u.uHeadCenter, headCenter[0], headCenter[1]);
            gl.uniform1f(u.uHeadRadius, rEff);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uAlphaMask, 1 - Math.exp(-Math.max(dt, 1e-4) * 8));
            gl.uniform1f(u.uAlphaMot, 1 - Math.exp(-Math.max(dt, 1e-4) * 5.5));
            gl.uniform1i(u.uReset, doReset ? 1 : 0);
            gl.uniform1i(u.uSource, source);
            gl.uniform1i(u.uMirror, state.mirror ? 1 : 0);
          });

          // P2 — soft mask (boundary softening)
          const sdfSigma = 2.5 + 4.0 * state.blend;
          blurPass(maskOut, targets.softTmp, targets.softT, sdfSigma);

          // P3 — curl
          renderPass(targets.curlT, programs.curl, () => {
            bindTexture(0, targets.velA.tex);
            gl.uniform1i(locations.curl.uVel, 0);
            gl.uniform2f(locations.curl.uTexel, fieldTexel[0], fieldTexel[1]);
          });

          // P4 — advect velocity + forces
          renderPass(targets.velB, programs.vel, () => {
            const u = locations.vel;
            bindTexture(0, targets.velA.tex);
            bindTexture(1, targets.curlT.tex);
            bindTexture(2, maskOut.tex);
            bindTexture(3, denPrev.tex);
            gl.uniform1i(u.uVel, 0);
            gl.uniform1i(u.uCurl, 1);
            gl.uniform1i(u.uMask, 2);
            gl.uniform1i(u.uDen, 3);
            gl.uniform2f(u.uTexel, fieldTexel[0], fieldTexel[1]);
            gl.uniform2f(u.uNeck, neck[0], neck[1]);
            gl.uniform2f(u.uHeadCenter, headCenter[0], headCenter[1]);
            gl.uniform1f(u.uHeadRadius, rEff);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uTime, animTime);
            gl.uniform1f(u.uRise, state.rise);
            gl.uniform1f(u.uSwirl, state.swirl);
            gl.uniform1f(u.uPresent, det.present);
          });

          // P5 — divergence
          renderPass(targets.divT, programs.div, () => {
            bindTexture(0, targets.velB.tex);
            gl.uniform1i(locations.div.uVel, 0);
            gl.uniform2f(locations.div.uTexel, fieldTexel[0], fieldTexel[1]);
          });

          // P6..P29 — Jacobi pressure solve (warm-started)
          let prsIn = targets.prsA;
          let prsOut = targets.prsB;
          for (let i = 0; i < JACOBI_ITERATIONS; i++) {
            const src = prsIn;
            renderPass(prsOut, programs.jacobi, () => {
              bindTexture(0, src.tex);
              bindTexture(1, targets.divT.tex);
              gl.uniform1i(locations.jacobi.uPrs, 0);
              gl.uniform1i(locations.jacobi.uDiv, 1);
              gl.uniform2f(locations.jacobi.uTexel, fieldTexel[0], fieldTexel[1]);
            });
            const swap = prsIn; prsIn = prsOut; prsOut = swap;
          }

          // P30 — projection → velA
          renderPass(targets.velA, programs.proj, () => {
            bindTexture(0, targets.velB.tex);
            bindTexture(1, prsIn.tex);
            gl.uniform1i(locations.proj.uVel, 0);
            gl.uniform1i(locations.proj.uPrs, 1);
            gl.uniform2f(locations.proj.uTexel, fieldTexel[0], fieldTexel[1]);
          });

          // P31 — density: advect + dissipate + neck injection + grain
          renderPass(denOut, programs.den, () => {
            const u = locations.den;
            bindTexture(0, denPrev.tex);
            bindTexture(1, targets.velA.tex);
            gl.uniform1i(u.uDen, 0);
            gl.uniform1i(u.uVel, 1);
            gl.uniform2f(u.uNeck, neck[0], neck[1]);
            gl.uniform2f(u.uHeadCenter, headCenter[0], headCenter[1]);
            gl.uniform1f(u.uHeadRadius, rEff);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uDt, dt);
            gl.uniform1f(u.uSmoke, state.smoke);
            gl.uniform1f(u.uGrain, state.grain);
            gl.uniform1f(u.uPresent, det.present);
          });

          // P32 — emission (bloom source)
          renderPass(targets.emisT, programs.emis, () => {
            bindTexture(0, denOut.tex);
            gl.uniform1i(locations.emis.uDen, 0);
          });

          // P33 — afterglow feedback
          const fbDecay = Math.exp(-dt * (2.8 + (0.25 - 2.8) * state.trail));
          renderPass(fbOut, programs.fb, () => {
            bindTexture(0, targets.emisT.tex);
            bindTexture(1, fbPrev.tex);
            gl.uniform1i(locations.fb.uEmis, 0);
            gl.uniform1i(locations.fb.uPrev, 1);
            gl.uniform1f(locations.fb.uDecay, fbDecay);
          });

          // P34..P37 — two-stage separable bloom
          blurPass(fbOut, targets.b1Tmp, targets.b1, 2.4);
          blurPass(targets.b1, targets.b2Tmp, targets.b2, 2.4);

          // P38 — composite
          renderPass(null, programs.composite, () => {
            const u = locations.composite;
            bindTexture(0, sceneCur.tex);
            bindTexture(1, targets.softT.tex);
            bindTexture(2, maskOut.tex);
            bindTexture(3, denOut.tex);
            bindTexture(4, targets.velA.tex);
            bindTexture(5, fbOut.tex);
            bindTexture(6, targets.b1.tex);
            bindTexture(7, targets.b2.tex);
            gl.uniform1i(u.uScene, 0);
            gl.uniform1i(u.uMask, 1);
            gl.uniform1i(u.uMaskRaw, 2);
            gl.uniform1i(u.uDen, 3);
            gl.uniform1i(u.uVel, 4);
            gl.uniform1i(u.uFb, 5);
            gl.uniform1i(u.uB1, 6);
            gl.uniform1i(u.uB2, 7);
            gl.uniform2f(u.uResolution, canvas.width, canvas.height);
            gl.uniform2f(u.uHeadCenter, headCenter[0], headCenter[1]);
            gl.uniform2f(u.uNeck, neck[0], neck[1]);
            gl.uniform1f(u.uHeadRadius, rEff);
            gl.uniform1f(u.uAspect, aspect);
            gl.uniform1f(u.uBlend, state.blend);
            gl.uniform1f(u.uGrade, state.grade);
            gl.uniform1f(u.uTrail, state.trail);
            gl.uniform1f(u.uFilmGrain, state.filmGrain);
            gl.uniform1i(u.uDebug, state.debugView);
          });

          scenePing = !scenePing;
          maskPing = !maskPing;
          denPing = !denPing;
          fbPing = !fbPing;

          if (!readyStamped && hasInput) {
            readyStamped = true;
            window.__artReady = true;
          }

          fpsFrames++;
          const wallNow = performance.now();
          if (wallNow - fpsLast > 500) {
            const fps = (fpsFrames * 1000) / (wallNow - fpsLast);
            fpsLast = wallNow;
            fpsFrames = 0;
            readout.textContent = `FPS ${fps.toFixed(0)} / 解像度 ${canvas.width}×${
              canvas.height} / 流体 ${fieldW}×${fieldH} / 検知 ${detectionLabel()}`;
            updateChip();
          }

          requestAnimationFrame(frame);
        }

        /* ------------------------------------------------------------------
           Camera + boot. With ?fakesource=1 the synthetic scene drives the
           pipeline and MediaPipe is never touched, but getUserMedia still runs
           so the three error paths stay observable.
        ------------------------------------------------------------------ */

        async function startCamera() {
          stopCamera();
          cameraReady = false;
          retryCamera.disabled = true;
          setOverlay("requesting", "REQUESTING CAMERA",
            "Please allow webcam access. If this is not localhost or HTTPS, the camera API will be blocked.");

          if (
            location.protocol !== "https:" &&
            location.hostname !== "localhost" &&
            location.hostname !== "127.0.0.1" &&
            location.hostname !== "[::1]"
          ) {
            setOverlay("error", "SECURE CONTEXT REQUIRED",
              "Serve the file from localhost (for example: python3 -m http.server 8888) or HTTPS, then reload.");
            retryCamera.disabled = false;
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setOverlay("error", "CAMERA API UNAVAILABLE",
              "This browser does not expose getUserMedia. Try a modern browser over localhost or HTTPS.");
            retryCamera.disabled = false;
            return;
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: state.facingMode,
                width: { ideal: 1280 }, height: { ideal: 720 },
              },
              audio: false,
            });
            video.srcObject = stream;
            await video.play();
            cameraReady = true;
            retryCamera.disabled = false;
            needsReset = true;
            setOverlay("hidden", "", "");
            loadMediaPipe();
          } catch (error) {
            retryCamera.disabled = false;
            const name = error && error.name ? error.name : "";
            if (name === "NotAllowedError" || name === "SecurityError") {
              setOverlay("error", "PERMISSION DENIED",
                "Camera access was denied. Enable camera permission for this site, then retry.",
                { retryCamera: true });
            } else if (name === "NotFoundError" || name === "OverconstrainedError") {
              setOverlay("error", "NO CAMERA FOUND",
                "No usable webcam was found. Connect a camera or release it from another app, then retry.",
                { retryCamera: true });
            } else {
              setOverlay("error", "CAMERA ERROR",
                `${name || "Unknown error"}. Check browser permissions and retry.`,
                { retryCamera: true });
            }
          }
        }

        function stopCamera() {
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        retryCamera.addEventListener("click", () => { startCamera(); });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) lastNow = performance.now();
        });
        window.addEventListener("beforeunload", stopCamera);

        const bootWall = performance.now();

        try {
          resize();
          // startCamera() runs in every mode. Under ?fakesource=1 the synthetic
          // scene drives the whole pipeline regardless of the camera (the video
          // texture is never sampled, MediaPipe stays untouched), so the camera
          // is only exercised to keep the three error overlays observable: on
          // success the overlay hides and the fake art shows; on denial/no-camera
          // the matching error overlay appears over the still-rendering scene.
          startCamera();
          detectionTick();
          requestAnimationFrame(frame);
        } catch (error) {
          setOverlay("error", "WEBGL SETUP ERROR",
            error && error.message ? error.message : "Could not initialize the renderer.");
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
